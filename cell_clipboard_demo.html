<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落版 Cell Clipboard</title>
<style>
  :root{
    --blue:#4a6fdc; --ink:#333a45; --muted:#7a8494;
    --bg:#f2f4f8; --card:#ffffff; --line:#e2e6ee;
    --pink:#fbe3d8; --pink-rule:#d8b6a6;
    --green:#cdeeda; --green-rule:#5aa678; --green-ink:#2e7d52;
    --amber-bg:#fff4d6; --amber:#c07f00;
    --flash:#fff2b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .stage{width:960px; max-width:96vw}
  .hint{
    font-size:13px; color:var(--muted); font-weight:700;
    margin-bottom:12px; text-align:center;
  }
  .hint b{color:var(--ink)}
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px;
  }
  .cell{
    min-height:112px; border:1.5px solid var(--line); border-radius:9px;
    padding:9px 11px; background:#fafbfe; position:relative;
    font-size:14px; line-height:1.5; outline:none; cursor:text;
    transition:border-color .12s, box-shadow .12s, background .3s;
    overflow:auto;
  }
  .cell:empty::before{
    content:attr(data-ph); color:#b8c0cd; font-weight:700; pointer-events:none;
  }
  .cell:hover{border-color:#c4cfe6}
  .cell:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(74,111,220,.16); background:#fff}
  .cell.flash{background:var(--flash)}
  .cell .tag{
    position:absolute; top:6px; right:8px; font-size:10px; font-weight:800;
    color:#aab2c0; letter-spacing:.04em;
  }
  .cell strong{color:var(--pink-rule)}
  .cell em{color:var(--green-ink); font-style:normal; background:var(--green); padding:0 3px; border-radius:3px}

  /* cursor-following status label — no side panel, no bottom text */
  #cursorTag{
    position:fixed; z-index:50; pointer-events:none;
    background:var(--ink); color:#fff; font-size:12px; font-weight:800;
    padding:5px 9px; border-radius:7px; white-space:nowrap;
    transform:translate(14px,16px); opacity:0; transition:opacity .1s;
    box-shadow:0 4px 14px rgba(30,40,60,.28);
  }
  #cursorTag.on{opacity:1}
  #cursorTag .mode{color:#9fd6ff}
  #cursorTag .txt{color:#ffd98b}
  #cursorTag .cell-mode{color:#8fe0b0}
</style>
</head>
<body>
  <div class="stage">
    <div class="hint">
      落版格：<b>整格複製</b> = 游標在格內、未選字時按 Ctrl/⌘+C　·　<b>整格貼上</b> = Ctrl/⌘+V 覆蓋該格　·　選取文字時走一般文字複製貼上
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="cursorTag"></div>

<script>
/* ---------- seed data (fake data, real behaviour) ---------- */
const SEED = [
  '<strong>主打</strong> 夏季特談<br>NT$ 1,290 起',
  '限量 500 組<br>加贈 <em>贈品 A</em>',
  '',
  '會員日<br>單筆滿 <strong>3000</strong> 折 300',
  '', '',
  '新品到貨<br><em>預購中</em>',
  '',
];

const grid = document.getElementById('grid');
SEED.forEach((html,i)=>{
  const c = document.createElement('div');
  c.className='cell';
  c.contentEditable='true';
  c.spellcheck=false;
  c.dataset.ph='（空格）';
  c.innerHTML = html;
  const tag = document.createElement('span');
  tag.className='tag'; tag.textContent='格 '+(i+1);
  c.appendChild(tag);
  grid.appendChild(c);
});

/* keep the corner tag out of the editable text flow:
   store real content separately so tag never gets copied */
function cellHTML(cell){
  const clone = cell.cloneNode(true);
  clone.querySelectorAll('.tag').forEach(t=>t.remove());
  return clone.innerHTML.trim();
}
function cellText(cell){
  const clone = cell.cloneNode(true);
  clone.querySelectorAll('.tag').forEach(t=>t.remove());
  return clone.innerText.trim();
}
function setCellHTML(cell, html){
  const tag = cell.querySelector('.tag');
  cell.innerHTML = html;
  if(tag) cell.appendChild(tag);   // re-attach corner tag
}

/* ---------- the core decision: text-range vs whole-cell ---------- */
function hasTextSelectionInside(cell){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  // selection must be non-empty AND anchored inside this cell
  return cell.contains(r.commonAncestorContainer) && sel.toString().length>0;
}

let cellClipboard = null;   // internal clipboard for whole-cell payloads

document.addEventListener('copy', e=>{
  const cell = document.activeElement;
  if(!cell || !cell.classList || !cell.classList.contains('cell')) return;

  if(hasTextSelectionInside(cell)) return;   // let the browser do normal text copy

  // no selection → copy the WHOLE cell
  e.preventDefault();
  const html = cellHTML(cell);
  const text = cellText(cell);
  cellClipboard = {html};
  try{
    e.clipboardData.setData('text/plain', text);
    e.clipboardData.setData('text/html', html);
  }catch(_){}
  flash(cell,'green');
  showTag(cell, 'copied');
});

document.addEventListener('paste', e=>{
  const cell = document.activeElement;
  if(!cell || !cell.classList || !cell.classList.contains('cell')) return;

  if(hasTextSelectionInside(cell)) return;   // replacing a text range → normal paste

  // whole-cell paste → replace entire cell content
  e.preventDefault();
  let html = null;
  if(cellClipboard) html = cellClipboard.html;
  else{
    const h = e.clipboardData.getData('text/html');
    const t = e.clipboardData.getData('text/plain');
    html = h ? h : escapeHTML(t).replace(/\n/g,'<br>');
  }
  setCellHTML(cell, html);
  placeCaretEnd(cell);
  flash(cell,'pink');
  showTag(cell,'pasted');
});

/* ---------- helpers ---------- */
function escapeHTML(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function placeCaretEnd(el){
  const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function flash(cell,kind){
  cell.classList.remove('flash'); void cell.offsetWidth;
  cell.style.setProperty('--flash', kind==='green' ? '#d7f3e2' : '#fbe3d8');
  cell.classList.add('flash');
  setTimeout(()=>cell.classList.remove('flash'),320);
}

/* ---------- cursor-following status label ---------- */
const tagEl = document.getElementById('cursorTag');
let lastCell = null, pinned = '';
function render(){
  if(!lastCell){ tagEl.classList.remove('on'); return; }
  const idx = [...grid.children].indexOf(lastCell)+1;
  if(pinned){
    tagEl.innerHTML = pinned;
  }else if(hasTextSelectionInside(lastCell)){
    tagEl.innerHTML = `格 ${idx}　<span class="txt">選字模式 → 一般複製/貼上</span>`;
  }else{
    tagEl.innerHTML = `格 ${idx}　<span class="cell-mode">整格模式 → C 複製 · V 貼上</span>`;
  }
  tagEl.classList.add('on');
}
function showTag(cell,kind){
  const idx=[...grid.children].indexOf(cell)+1;
  pinned = kind==='copied'
    ? `<span class="cell-mode">✓ 已複製整格 ${idx}</span>`
    : `<span class="mode">✓ 已貼上覆蓋格 ${idx}</span>`;
  render();
  clearTimeout(showTag._t);
  showTag._t=setTimeout(()=>{pinned='';render();},900);
}
document.addEventListener('mousemove', e=>{
  tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px';
});
document.addEventListener('mouseover', e=>{
  const c=e.target.closest && e.target.closest('.cell');
  if(c){ lastCell=c; render(); }
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest && e.target.closest('.cell') && !e.relatedTarget?.closest?.('.cell')){
    lastCell=null; render();
  }
});
document.addEventListener('selectionchange', ()=>{ if(lastCell) render(); });
grid.addEventListener('focusin', e=>{ const c=e.target.closest('.cell'); if(c){lastCell=c;render();} });
</script>
</body>
</html>
