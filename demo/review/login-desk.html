<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜DM 行銷開板設計系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=Anton&display=swap">
<style>
/* 登入頁（第四版，demo）：就是這支系統本人，只是還沒登入。
   上一版（打樣紙）讀起來像報紙頭版 —— 主角是一行大標，而上班打開一支工具的人不需要被標題迎接。
   所以這一版照主程式的框：灰藍桌面、最上面一條列、中間一張紙、右邊一欄。
   紙上是「檔期時程」：每一本進行中的 DM 攤在日曆上，十關一段一段排開、今天一條線 ——
   這是登入之前就該看得到、而且真的有用的東西（哪一本走到哪、這一關還剩多久）。
   右邊那一欄就是編輯器放側欄的位置，登入站在那裡；登入之後這個框直接變成系統。
   大膽只花在那張時程上。顏色照主程式：關的顏色＝那一關是誰的事（PM 黃、設計天藍），
   琥珀＝今天／現在，藍只給要按的那一顆。 */
:root{
  --chrome:#ccd5e1;          /* 桌面（跟主程式同一個） */
  --chrome-ink:#1d2634;
  --chrome-muted:#525d6f;
  --chrome-line:#adbaca;
  --glass:rgba(29,38,52,.08);
  --glass-edge:rgba(255,255,255,.38);
  --glass-hi:rgba(255,255,255,.6);
  --glass-shade:rgba(29,38,52,.10);
  --paper:#ffffff;
  --ink:#1d2634;
  --ink-dim:#525d6f;
  --ink-faint:#7d8798;
  --line:#e2e6ee;
  --line-strong:#c9d6e2;
  --weekend:#f4f6fa;         /* 時程上的週末：淡一階，看得出一週在哪裡斷 */
  --side-pm:#ffd447;         /* 那一關是 PM 的事（＝便利貼 PM 黃） */
  --side-pm-soft:#fff1bf;
  --side-design:#87ceeb;     /* 那一關是設計的事（＝便利貼設計天藍） */
  --side-design-soft:#d8eef8;
  --done:#e6e9ef;            /* 走完的關 */
  --now:#c07f00;             /* 今天、現在這一關（主程式的琥珀） */
  --now-tint:#fff4d6;
  --late:#e0182d;            /* 延遲：跟 DM 上的價格同一種紅 */
  --accent:#4a6fdc;          /* 藍＝你正在點的東西 */
  --accent-strong:#3f61c6;
  --accent-tint:#eef2fc;
  --danger-ink:#b42318;
  --danger-tint:#fdeceb;
  --av-1:#5b7bb4; --av-2:#6f8a52; --av-3:#a0715c; --av-4:#7d6aa6; --av-5:#4f8a8b; --av-6:#9a7b3f;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Anton","Impact",sans-serif;
  --label-w:240px;           /* 時程左邊那一欄（檔期名字＋倒數） */
  --day-min:16px;            /* 一天最少多寬（再窄就讓時程自己左右捲） */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--ink);background:var(--chrome);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- 最上面那條列：還沒登入，所以不是任何一個身分的顏色 ---------- */
.topbar{display:flex;align-items:center;gap:20px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--chrome-line);color:var(--chrome-ink)}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--chrome-ink);color:#fff;display:grid;place-items:center;font-family:var(--font-num);font-size:13px;letter-spacing:.02em}
.tb-meta{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:13px;color:var(--chrome-muted);white-space:nowrap}
.tb-meta b{color:var(--chrome-ink);font-weight:700;font-variant-numeric:tabular-nums}
/* 名牌的位置：登入之後這裡寫你是誰 */
.who{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:8px;background:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px var(--glass-edge), 0 1px 2px var(--glass-shade);color:var(--chrome-ink);font-weight:700;font-size:13px}
.who i{width:3px;height:16px;border-radius:2px;background:repeating-linear-gradient(var(--chrome-muted) 0 3px,transparent 3px 5px)}
.who.in i{background:var(--chrome-ink)}

/* ---------- 桌面上兩張紙：時程、登入 ---------- */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px;min-height:0}
.sheet{background:var(--paper);border-radius:10px 10px 4px 4px;box-shadow:0 1px 2px rgba(29,38,52,.08),0 0 0 1px rgba(29,38,52,.06);min-height:0;display:flex;flex-direction:column}
.sheet-bar{display:flex;align-items:center;gap:16px;min-height:48px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-bar h1,.sheet-bar h2{margin:0;font-size:15px;font-weight:800}
.sheet-bar .sub{font-size:13px;color:var(--ink-dim)}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--ink-dim);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px}
.legend .today i{width:2px;height:14px;border-radius:0;background:var(--now)}

/* ---------- 檔期時程 ---------- */
.g-scroll{flex:none;max-height:62%;overflow:auto;border-bottom:1px solid var(--line-strong)}
.gantt{display:flex;flex-direction:column;min-width:calc(var(--label-w) + var(--days) * var(--day-min))}
.g-head,.g-row{display:grid;grid-template-columns:var(--label-w) minmax(0,1fr)}
.g-head{position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1px solid var(--line-strong)}
.g-corner{position:sticky;left:0;z-index:1;background:var(--paper);display:flex;align-items:flex-end;padding:0 18px 7px;font-size:12px;font-weight:700;color:var(--ink-faint);border-right:1px solid var(--line)}
.g-ruler{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr))}
.g-month{grid-row:1;min-width:0;overflow:hidden;padding:8px 6px 0;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;border-left:1px solid var(--line-strong)}
.g-month:first-child{border-left:0}
.g-day{grid-row:2;padding:2px 0 6px;text-align:center;font-size:12px;line-height:1.25;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.g-day small{display:block;font-size:10.5px;color:var(--ink-faint)}
.g-day.we{color:var(--ink-faint)}
.g-day.today{color:var(--now);font-weight:800}
.g-day.today small{color:var(--now)}

.g-body{flex:1;position:relative;display:flex;flex-direction:column}
/* 底下那一層：週末、每一天的格線、今天那一條線，一路畫到紙的最下面 */
.g-bg{position:absolute;top:0;bottom:0;left:var(--label-w);right:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--days) - 1px),var(--line) calc(100% / var(--days) - 1px) calc(100% / var(--days)))}
.g-we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.g-now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--now)}   /* 在關的色塊底下走：字不被它切開 */
.g-now span{position:absolute;top:6px;left:6px;padding:1px 7px;border-radius:4px;background:var(--now);color:#fff;font-size:11.5px;font-weight:800;white-space:nowrap}
.g-labelcol{position:absolute;top:0;bottom:0;left:0;width:var(--label-w);border-right:1px solid var(--line);background:var(--paper);z-index:1}

.g-row{position:relative;z-index:1;border-bottom:1px solid var(--line)}
.g-row:first-child{margin-top:28px;border-top:1px solid var(--line)}   /* 讓出今天那塊牌子 */
.g-label{position:sticky;left:0;z-index:2;background:var(--paper);padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.g-name{font-size:15px;font-weight:800;line-height:1.35}
.g-type{font-size:12px;color:var(--ink-faint);font-weight:600}
.g-count{display:flex;align-items:baseline;gap:6px;margin-top:8px;line-height:1}
.g-count .n{font-family:var(--font-num);font-size:30px;color:var(--late);font-variant-numeric:tabular-nums}
.g-count .u{font-size:12px;font-weight:800;color:var(--late)}
.g-count .l{font-size:12px;font-weight:700;color:var(--ink-dim);margin-left:4px;line-height:1.35}
.g-count.quiet .n,.g-count.quiet .u{color:var(--ink)}
.g-row.late .g-count .n{color:var(--late)}

.g-lane{position:relative;min-height:96px}
.seg{position:absolute;top:50%;height:36px;margin-top:-18px;display:flex;align-items:center;padding:0 7px;border-radius:5px;
  font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(29,38,52,.08)}
.seg.pm{background:var(--side-pm-soft)}
.seg.design{background:var(--side-design-soft)}
.seg.done{background:var(--done);color:var(--ink-faint)}
.seg.now{z-index:1;font-weight:900;box-shadow:inset 0 0 0 2px var(--ink)}
.seg.now.pm{background:var(--side-pm)}
.seg.now.design{background:var(--side-design)}
.g-row.late .seg.now{box-shadow:inset 0 0 0 2px var(--late)}
.seg.one{justify-content:center;padding:0}   /* 一天的關塞不下兩個字：寫第一個字，整個名字在 title 裡 */

/* ---------- 接下來的截止 ---------- */
.agenda{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.agenda .sheet-bar{border-bottom:0;min-height:44px}
.ag-list{list-style:none;margin:0;padding:0 18px 12px}
.ag-list li{display:grid;grid-template-columns:128px 54px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.ag-when{font-weight:800;font-variant-numeric:tabular-nums}
.ag-when small{font-weight:600;color:var(--ink-faint);margin-left:6px}
.ag-list li.today .ag-when{color:var(--now)}
.ag-side{justify-self:start;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:800}
.ag-side.pm{background:var(--side-pm-soft)}
.ag-side.design{background:var(--side-design-soft)}
.ag-what b{font-weight:800}
.ag-what span{color:var(--ink-dim)}
.ag-left{font-size:12.5px;font-weight:700;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-list li.today .ag-left{color:var(--now)}
.ag-none{margin:0;padding:4px 18px 16px;color:var(--ink-faint)}
.g-empty{padding:28px 18px;color:var(--ink-dim);font-weight:700}

/* ---------- 右邊那一欄：登入 ---------- */
.side .body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.sec{padding:18px}
.sec + .sec{border-top:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--ink)}
.lead{margin:0 0 16px;font-size:14px;color:var(--ink-dim);line-height:1.7}
.g-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:50px;padding:3px 14px 3px 3px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.g-btn:hover{background:var(--accent-strong)}
.g-btn .g{flex:none;width:44px;height:44px;border-radius:6px;background:#fff;display:grid;place-items:center}
.g-btn .t{flex:1;text-align:center;padding-right:44px}
.fine{margin:12px 0 0;font-size:12px;color:var(--ink-faint);line-height:1.6}
.notice{margin:0 0 10px;font-size:13px;color:var(--danger-ink)}
.notice:empty{display:none}
.signed .nm{font-size:17px;font-weight:900}
.signed .meta{font-size:13px;color:var(--ink-dim)}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;justify-content:center}
.btn.primary:hover{background:var(--accent-strong)}
.btn:not(.primary):hover{background:var(--accent-tint)}
.denied h2{margin:0 0 8px;font-size:16px;font-weight:900;color:var(--danger-ink)}
.denied .acct{padding:7px 10px;border-radius:6px;background:var(--danger-tint);font-weight:700;word-break:break-all}
.denied p{margin:10px 0 0;font-size:13px;color:var(--ink-dim);line-height:1.7}
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:7px 0;font-size:13px;line-height:1.6}
.news li + li{border-top:1px dashed var(--line)}
.news time{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.news .soon time{color:var(--now)}
.news-none{margin:0;font-size:13px;color:var(--ink-faint)}
.help{margin-top:auto;background:#f7f9fc}
.help dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.help dt{color:var(--ink-faint)}
.help dd{margin:0;font-weight:700;word-break:break-all}
.help a{color:var(--accent)}

/* ---------- 模擬的 Google 選帳號窗（跟 demo 同一套） ---------- */
#picker{padding:0;border:0;width:min(420px,calc(100% - 32px));border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 24px 60px -20px rgba(29,38,52,.55)}
#picker::backdrop{background:rgba(29,38,52,.38)}
.pk-wrap{display:flex;flex-direction:column;max-height:min(640px,calc(100vh - 48px))}
.pk-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-dim)}
.pk-sim{margin-left:auto;font-size:12px;border:1px solid var(--line-strong);border-radius:999px;padding:1px 9px}
.pk-body{padding:22px 22px 8px;overflow:auto}
.pk-body h2{margin:0;font-size:22px;font-weight:500;text-align:center}
.pk-sub{margin:4px 0 16px;text-align:center;font-size:14px;color:var(--ink-dim)}
.pk-search{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px}
.pk-list{list-style:none;margin:10px -22px 0;padding:0}
.pk-list li + li{border-top:1px solid var(--line)}
.pk-acct{width:100%;display:flex;align-items:center;gap:12px;padding:10px 22px;border:0;background:none;text-align:left;cursor:pointer}
.pk-acct:hover,.pk-acct:focus-visible{background:var(--accent-tint);outline:none}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--av,var(--av-1));color:#fff;font-size:14px;font-weight:500}
.av.plus{background:none;border:1px solid var(--line-strong);color:var(--ink-dim);font-size:18px}
.pk-acct .nm{display:block;font-weight:500;line-height:1.35}
.pk-acct .em{display:block;font-size:13px;color:var(--ink-dim);line-height:1.35;word-break:break-all}
.pk-empty{padding:14px 22px;font-size:14px;color:var(--ink-dim)}
.pk-other label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:4px}
.pk-other input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px}
.pk-err{margin:6px 0 0;min-height:1.5em;font-size:13px;color:var(--danger-ink)}
.pk-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.pk-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
.btn-text{border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--accent);font-weight:700;cursor:pointer}
.btn-text:hover{background:var(--accent-tint)}

/* 窄的時候：先登入、再看時程（時程在自己的框裡左右捲，左邊那一欄黏著） */
@media (max-width:980px){
  :root{--label-w:200px}
  .app{height:auto;min-height:100vh}
  .desk{grid-template-columns:minmax(0,1fr)}
  .side{order:-1}
  .timeline .g-scroll{max-height:none}
  .agenda{overflow:visible}
  .tb-meta .demo{display:none}
}
@media (max-width:560px){
  :root{--label-w:150px;--day-min:28px}
  .topbar{gap:10px;padding:0 12px}
  .brand .full{display:none}
  .tb-meta{gap:10px}
  .desk{padding:8px;gap:8px}
  .g-label{padding:12px}
  .g-name{font-size:14px}
  .g-count .n{font-size:24px}
  .g-count{flex-wrap:wrap}
  .g-count .l{flex-basis:100%;margin:4px 0 0}
  .legend{margin-left:0}
  .ag-list li{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px}
  .ag-when{grid-column:1 / -1}
  .ag-side{grid-row:2}
}
@media (prefers-reduced-motion:no-preference){
  .g-scroll{scroll-behavior:smooth}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">DM</span><span class="full">DM 行銷開板設計系統</span></div>
    <div class="tb-meta">
      <span class="demo">本機示範：資料只存在這台瀏覽器</span>
      <span id="clock"></span>
      <span class="who" id="who"><i aria-hidden="true"></i><span id="whoText">還沒登入</span></span>
    </div>
  </header>

  <div class="desk">
    <main class="sheet timeline" aria-labelledby="tlH">
      <div class="sheet-bar">
        <h1 id="tlH">檔期時程</h1>
        <span class="sub" id="tlSub"></span>
        <span class="legend" aria-hidden="true">
          <span><i style="background:var(--side-pm)"></i>PM 的關</span>
          <span><i style="background:var(--side-design)"></i>設計的關</span>
          <span><i style="background:var(--done)"></i>走完了</span>
          <span class="today"><i></i>今天</span>
        </span>
      </div>
      <div class="g-scroll" id="gScroll"><div id="gantt"></div></div>
      <section class="agenda" aria-labelledby="agH">
        <div class="sheet-bar"><h2 id="agH">接下來兩週的截止</h2><span class="sub">每一關都是最後一天 18:00 截止</span></div>
        <div id="agenda"></div>
      </section>
    </main>

    <aside class="sheet side" aria-labelledby="sgH">
      <div class="sheet-bar"><h2 id="sgH">登入</h2></div>
      <div class="body">
        <section class="sec" id="signSec"></section>
        <section class="sec" aria-labelledby="newsH">
          <h3 id="newsH">系統公告</h3>
          <div id="news"></div>
        </section>
        <section class="sec help" id="help" aria-labelledby="helpH" hidden>
          <h3 id="helpH">登入有問題</h3>
          <dl id="helpDl"></dl>
        </section>
      </div>
    </aside>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<!-- 模擬的 Google 選帳號窗：接上 Supabase 之後這一窗不存在，按下去就整頁轉去真的 Google -->
<dialog id="picker" aria-labelledby="pkTitle">
  <div class="pk-wrap">
    <div class="pk-head"><svg width="16" height="16" aria-hidden="true"><use href="#gLogo"/></svg><span>使用 Google 帳戶登入</span><span class="pk-sim" title="本機示範用的模擬視窗，不會連到 Google">模擬</span></div>
    <div class="pk-body">
      <h2 id="pkTitle">選擇帳戶</h2>
      <p class="pk-sub">以繼續使用「DM 行銷開板設計系統」</p>
      <div id="pkChoose">
        <input class="pk-search" id="pkSearch" type="search" placeholder="搜尋姓名或 email" aria-label="搜尋帳戶" autocomplete="off">
        <ul class="pk-list" id="pkList"></ul>
      </div>
      <form class="pk-other" id="pkOther" hidden novalidate>
        <label for="pkEmail">Email</label>
        <input id="pkEmail" type="email" autocomplete="off" placeholder="name@example.com">
        <p class="pk-err" id="pkErr" role="alert"></p>
        <div class="pk-row"><button type="button" class="btn-text" id="pkBack">返回帳戶清單</button><button type="submit" class="btn primary" style="flex:none">繼續</button></div>
      </form>
    </div>
    <div class="pk-foot"><span>關掉這個視窗＝不登入</span><button type="button" class="btn-text" id="pkCancel">取消</button></div>
  </div>
</dialog>

<script src="seed.js"></script>
<script src="../../review-rules.js"></script>
<script src="../../review-store.js"></script>
<script>
(function () {
'use strict';
const S = window.ReviewStore, R = window.ReviewRules;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WEEK = '日一二三四五六';
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const md = d => `${d.getMonth() + 1}/${pad(d.getDate())}`;
const dayOf = ymd => new Date(ymd + 'T00:00:00');
const APP_URL = 'index.html#/todo';   // 登入了就進 demo 本人（登入狀態是同一份）
/* 每一關是誰的事（照主程式的 STAGE_SIDE：審稿、出稿都算 PM 那一邊） */
const SIDE = { 提明細: 'pm', 製作: 'design', 一校: 'pm', 一改: 'design', 二校: 'pm', 二改: 'design', 蓋章確認: 'pm', 蓋章修改: 'design', 審稿: 'pm', 出稿: 'pm' };

/* ---------- 檔期時程 ---------- */
function countOf(p) {
  if (!p.started) { const d = dayOf(p.startsAt); return { n: md(d), u: `（${WEEK[d.getDay()]}）`, l: '開始提明細', quiet: true }; }
  if (p.done) return { n: '✓', u: '', l: '出稿了', quiet: true };
  const ms = +new Date(p.due) - S.now();
  const due = new Date(p.due);
  const l = `${p.stage}截止<br>${md(due)}（${WEEK[due.getDay()]}）18:00`;
  if (ms <= 0) return { n: '延遲', u: '', l, late: true };
  if (ms < 48 * 3600000) return { n: (ms / 3600000).toFixed(1), u: '小時', l };
  return { n: String(Math.ceil(ms / DAY)), u: '天', l };
}

async function paintBoard() {
  const pb = await S.api.publicBoard();
  const nowMs = S.now();
  const today = new Date(nowMs); today.setHours(0, 0, 0, 0);
  const plans = pb.plans.filter(p => p.schedule && p.schedule.length);
  if (!plans.length) {
    $('tlSub').textContent = '';
    $('gantt').innerHTML = '<p class="g-empty">目前沒有進行中的檔期。</p>';
    paintNews(pb); return;
  }
  // 範圍：最早那一關的前一天到最晚那一關的後一天，今天一定在裡面
  let lo = +today, hi = +today;
  for (const p of plans) { lo = Math.min(lo, +dayOf(p.schedule[0].start)); hi = Math.max(hi, +dayOf(p.schedule[p.schedule.length - 1].end)); }
  lo -= DAY; hi += DAY;
  const days = Math.round((hi - lo) / DAY) + 1;
  const pct = ms => ((ms - lo) / (days * DAY) * 100).toFixed(3) + '%';

  // 尺規：月份一行、日子一行
  let ruler = '', we = '';
  let mStart = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(lo + i * DAY);
    const last = i === days - 1 || new Date(lo + (i + 1) * DAY).getMonth() !== d.getMonth();
    if (last) { ruler += `<div class="g-month" style="grid-column:${mStart + 1} / ${i + 2}">${d.getMonth() + 1} 月</div>`; mStart = i + 1; }
    const w = d.getDay(), isWe = w === 0 || w === 6, isToday = +d === +today;
    ruler += `<div class="g-day${isWe ? ' we' : ''}${isToday ? ' today' : ''}" style="grid-column:${i + 1}">${d.getDate()}<small>${WEEK[w]}</small></div>`;
    if (isWe) we += `<i class="g-we" style="left:${pct(+d)};width:${(100 / days).toFixed(3)}%"></i>`;
  }

  const rows = plans.map(p => {
    const ix = p.started ? R.STAGES.indexOf(p.stage) : -1;
    const c = countOf(p);
    const segs = p.schedule.map((s, i) => {
      const a = +dayOf(s.start), b = +dayOf(s.end) + DAY;
      const state = p.done || (ix >= 0 && i < ix) ? 'done' : i === ix ? 'now' : '';
      const tip = `${s.stage}　${md(dayOf(s.start))}–${md(dayOf(s.end))}（截止 18:00）${SIDE[s.stage] === 'pm' ? '・PM' : '・設計'}`;
      const one = b - a <= DAY;
      return `<div class="seg ${SIDE[s.stage]} ${state}${one ? ' one' : ''}" style="left:calc(${pct(a)} + 1px);width:calc(${((b - a) / (days * DAY) * 100).toFixed(3)}% - 2px)" title="${esc(tip)}">${one ? esc(Array.from(s.stage)[0]) : (state === 'done' ? '✓ ' : '') + esc(s.stage)}</div>`;
    }).join('');
    return `<div class="g-row${c.late ? ' late' : ''}">
      <div class="g-label">
        <div class="g-name">${esc(p.name)}</div>
        <div class="g-type">${esc(p.type)}${p.started && !p.done ? `・第 ${ix + 1}／10 關` : ''}</div>
        <div class="g-count${c.quiet ? ' quiet' : ''}"><span class="n">${esc(c.n)}</span><span class="u">${esc(c.u)}</span><span class="l">${c.l}</span></div>
      </div>
      <div class="g-lane">${segs}</div>
    </div>`;
  }).join('');

  const t = new Date(nowMs);
  $('gantt').innerHTML = `<div class="gantt" style="--days:${days}">
    <div class="g-head"><div class="g-corner">檔期</div><div class="g-ruler">${ruler}</div></div>
    <div class="g-body">
      <div class="g-labelcol" aria-hidden="true"></div>
      <div class="g-bg" aria-hidden="true">${we}<div class="g-now" style="left:${pct(nowMs)}"><span>今天 ${pad(t.getHours())}:${pad(t.getMinutes())}</span></div></div>
      ${rows}
    </div>
  </div>`;
  const first = new Date(plans.reduce((m, p) => Math.min(m, +dayOf(p.schedule[0].start)), Infinity));
  const lastD = new Date(plans.reduce((m, p) => Math.max(m, +dayOf(p.schedule[p.schedule.length - 1].end)), -Infinity));
  $('tlSub').textContent = `${plans.length} 本進行中・${md(first)} – ${md(lastD)}`;
  // 時程比窗口寬的時候（手機），先捲到今天那一天
  const sc = $('gScroll');
  if (sc.scrollWidth > sc.clientWidth + 4) {
    const lw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--label-w')) || 0;
    const laneW = sc.scrollWidth - lw;
    sc.scrollLeft = Math.max(0, (nowMs - lo) / (days * DAY) * laneW - 3 * laneW / days);
  }
  paintAgenda(plans, nowMs);
  paintNews(pb);
}

/* 接下來兩週：每一關的截止（最後一天 18:00），還沒開始的那一本寫它哪天開始 */
function paintAgenda(plans, nowMs) {
  const until = nowMs + 14 * DAY;
  const items = [];
  for (const p of plans) {
    if (!p.started) { const d = dayOf(p.startsAt); if (+d <= until) items.push({ at: +d, plan: p.name, stage: '提明細', what: '開始', start: true }); }
    for (const s of p.schedule) {
      const at = +dayOf(s.end) + 18 * 3600000;
      if (at > nowMs && at <= until) items.push({ at, plan: p.name, stage: s.stage, what: '截止' });
    }
  }
  items.sort((a, b) => a.at - b.at);
  const today = new Date(nowMs); today.setHours(0, 0, 0, 0);
  $('agenda').innerHTML = items.length ? `<ul class="ag-list">${items.map(x => {
    const d = new Date(x.at);
    const dd = Math.round((+new Date(d.getFullYear(), d.getMonth(), d.getDate()) - +today) / DAY);
    const left = dd === 0 ? '今天' : dd === 1 ? '明天' : `${dd} 天後`;
    return `<li class="${dd <= 1 ? 'today' : ''}"><span class="ag-when">${md(d)}（${WEEK[d.getDay()]}）<small>${x.start ? '' : '18:00'}</small></span>
      <span class="ag-side ${SIDE[x.stage]}">${SIDE[x.stage] === 'pm' ? 'PM' : '設計'}</span>
      <span class="ag-what"><b>${esc(x.stage)}${x.what}</b>　<span>${esc(x.plan)}</span></span>
      <span class="ag-left">${left}</span></li>`;
  }).join('')}</ul>` : '<p class="ag-none">兩週內沒有截止的關。</p>';
}

function paintNews(pb) {
  const nowMs = S.now();
  const news = pb.announcements.slice().sort((a, b) => b.date.localeCompare(a.date));
  $('news').innerHTML = news.length ? `<ul class="news">${news.map(x => {
    const d = dayOf(x.date);
    const soon = +d >= nowMs - DAY;   // 還沒發生的（例如維護）用琥珀：那是要提前知道的事
    return `<li class="${soon ? 'soon' : ''}"><time datetime="${esc(x.date)}">${md(d)}（${WEEK[d.getDay()]}）</time><span>${esc(x.text)}</span></li>`;
  }).join('')}</ul>` : '<p class="news-none">目前沒有公告。</p>';
  const s = pb.support;
  $('help').hidden = !s;
  if (s) $('helpDl').innerHTML = `<dt>找誰</dt><dd>${esc(s.who)}</dd><dt>電話</dt><dd>${esc(s.ext)}</dd><dt>Email</dt><dd><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></dd>`;
}

function paintClock() {
  const t = new Date(S.now());
  $('clock').innerHTML = `<b>${md(t)}（${WEEK[t.getDay()]}）${pad(t.getHours())}:${pad(t.getMinutes())}</b>`;
}

/* ---------- 登入那一段 ---------- */
const G_BTN = `<button class="g-btn" id="signInBtn" type="button"><span class="g"><svg width="22" height="22" aria-hidden="true"><use href="#gLogo"/></svg></span><span class="t">用 Google 帳號登入</span></button>`;
function setWho(text, inside) { $('whoText').textContent = text; $('who').classList.toggle('in', !!inside); }
function signIdle(notice) {
  setWho('還沒登入');
  $('signSec').innerHTML = `<p class="lead">用公司發的 Google 帳號登入。只有人員名單上、在職的人進得來；進去之後看到的是輪到你的事。</p>
    <p class="notice" role="status">${esc(notice || '')}</p>${G_BTN}
    <p class="fine">登入會記一筆紀錄（誰、什麼時候）。這是本機示範，按下去是模擬的選帳號窗。</p>`;
}
/* 這台瀏覽器已經登入了：寫出是誰，給兩條路 */
function signDone(id) {
  const m = id.member;
  setWho(m.name, true);
  $('signSec').innerHTML = `<div class="signed"><div class="nm">${esc(m.name)}</div><div class="meta">${esc(m.department)}　${esc(m.title)}</div></div>
    <p class="fine" style="margin-top:6px">這台瀏覽器已經登入了。</p>
    <div class="acts"><a class="btn primary" href="${APP_URL}">進入系統</a><button class="btn" type="button" id="switchBtn">換一個帳號</button></div>`;
}
function signDenied(r) {
  const m = r.member;
  setWho('還沒登入');
  let title, body;
  if (r.code === 'inactive') { title = '這個帳號已停用'; body = '人員資料裡標為離職，所以進不來。已經回到公司的話，請找系統管理者把人員資料改回在職。'; }
  else if (r.code === 'invalid_email') { title = '這不是一個有效的 email'; body = '換一個帳號，用完整的 email 登入。'; }
  else { title = '這個帳號不在人員名單裡'; body = '請改用公司發的帳號。如果這就是公司帳號，請找系統管理者把你加進人員資料（聯絡方式在下面）。'; }
  $('signSec').innerHTML = `<div class="denied" role="alert"><h2>${esc(title)}</h2><div class="acct">${esc(m ? m.name + '　' : '')}${esc(r.email || '')}</div><p>${esc(body)}</p>
    <div class="acts"><button class="btn primary" type="button" id="retryBtn">換一個帳號</button></div></div>`;
  $('retryBtn').focus();
}

let busy = false;
async function signIn() {
  if (busy) return;
  busy = true;
  try {
    const r = await S.auth.signIn();
    if (r && r.cancelled) return;
    const w = await S.api.whoami({ fresh: true });
    if (w.ok) location.href = APP_URL;       // 登入了就直接進去，不停頓
    else signDenied(w);
  } catch (e) {
    signIdle('登入沒有完成：' + e.message);
  } finally { busy = false; }
}

/* ---------- 模擬的選帳號窗（照 demo 那一支） ---------- */
let pickResolve = null;
const picker = $('picker');
function openPicker() {
  return new Promise(res => { pickResolve = res; $('pkSearch').value = ''; showOther(false); renderAccounts(''); picker.showModal(); $('pkSearch').focus(); });
}
function finishPick(email) { const r = pickResolve; pickResolve = null; if (picker.open) picker.close(); if (r) r(email || null); }
function avColor(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `var(--av-${h % 6 + 1})`; }
function renderAccounts(q) {
  const k = q.trim().toLowerCase();
  const all = S.dev ? S.dev.accounts() : [];
  const hit = all.filter(a => !k || a.name.toLowerCase().includes(k) || a.email.toLowerCase().includes(k));
  const rows = hit.map(a => `<li><button type="button" class="pk-acct" data-email="${esc(a.email)}"><span class="av" style="--av:${avColor(a.email)}">${esc(a.name ? Array.from(a.name)[0] : a.email[0].toUpperCase())}</span><span>${a.name ? `<span class="nm">${esc(a.name)}</span>` : ''}<span class="em">${esc(a.email)}</span></span></button></li>`);
  if (!hit.length) rows.push(`<li class="pk-empty">找不到「${esc(q)}」。可以改用其他帳戶登入。</li>`);
  rows.push(`<li><button type="button" class="pk-acct" data-other="1"><span class="av plus" aria-hidden="true">＋</span><span class="nm">使用其他帳戶</span></button></li>`);
  $('pkList').innerHTML = rows.join('');
}
function showOther(on) {
  $('pkChoose').hidden = on; $('pkOther').hidden = !on; $('pkErr').textContent = '';
  if (on) { const q = $('pkSearch').value.trim(); $('pkEmail').value = q.includes('@') ? q : ''; $('pkEmail').focus(); }
}

function wire() {
  document.addEventListener('click', async e => {
    if (e.target.closest('#signInBtn') || e.target.closest('#retryBtn')) { signIdle(); signIn(); return; }
    if (e.target.closest('#switchBtn')) { await S.auth.signOut(); signIdle(); signIn(); }
  });
  $('pkSearch').addEventListener('input', e => renderAccounts(e.target.value));
  $('pkSearch').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); const b = $('pkList').querySelector('.pk-acct'); if (b) b.focus(); }
    if (e.key === 'Enter') { e.preventDefault(); const b = $('pkList').querySelector('.pk-acct'); if (b) b.click(); }
  });
  $('pkList').addEventListener('click', e => { const b = e.target.closest('.pk-acct'); if (!b) return; if (b.dataset.other) showOther(true); else finishPick(b.dataset.email); });
  $('pkBack').addEventListener('click', () => { showOther(false); $('pkSearch').focus(); });
  $('pkOther').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('pkEmail').value.trim();
    if (!R.validEmail(R.normEmail(v))) { $('pkErr').textContent = '請輸入完整的 email，例如 name@example.com。'; $('pkEmail').focus(); return; }
    finishPick(v);
  });
  $('pkCancel').addEventListener('click', () => finishPick(null));
  picker.addEventListener('close', () => finishPick(null));
  picker.addEventListener('click', e => { if (e.target === picker) finishPick(null); });
}

async function boot() {
  S.auth.usePicker(openPicker);
  wire();
  paintClock();
  paintBoard();
  // 時鐘和今天那一條線每分鐘走一次（倒數跟著變）
  setInterval(() => { paintClock(); if (!picker.open) paintBoard(); }, 60000);
  const s = await S.auth.getSession();
  if (!s) { signIdle(); return; }
  const w = await S.api.whoami();
  if (w.ok) signDone(w.identity);
  else if (w.code === 'no_session') signIdle();
  else signDenied(w);
}
boot();
})();
</script>
