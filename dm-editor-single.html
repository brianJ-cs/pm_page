  el.className = 'split-container';
  el.style.flexDirection = node.dir === 'row' ? 'row' : 'column';

  const kids = node.children;
  const divPx = node.fold ? FOLD_PX : RESIZE_PX;
  const dividerShare = (divPx * (kids.length - 1)) / kids.length;

  const childEls = [];
  kids.forEach((kid, i) => {
    if (i > 0){
      if (node.fold){
        const f = document.createElement('div');   // the crease — never draggable
        f.className = 'fold';
        el.appendChild(f);
      } else {
        const r = document.createElement('div');
        r.className = 'resizer ' + (node.dir === 'row' ? 'resizer-vertical' : 'resizer-horizontal');
        r._parent = node;
        r._index  = i - 1;
        r._childEls = childEls;
        el.appendChild(r);
      }
    }
    const kidEl = isLeaf(kid) ? renderLeaf(kid) : renderContainer(kid);
    kidEl.style.flex = flexFor(kid.size, dividerShare);
    kidEl.style.minWidth = '0px';
    kidEl.style.minHeight = '0px';
    kidEl._dividerShare = dividerShare;
    childEls.push(kidEl);
    el.appendChild(kidEl);
  });

  el._childEls = childEls;
  return el;
}

/** Slide A stacks each group on its own line: 冰箱(24) / 洗衣機(18). */
function groupLinesHTML(node){
  return node.groups.map(g => `<div>${g.name}${
    g.count ? `<span class="cnt">(${g.count})</span>` : ''}</div>`).join('');
}

function renderLeaf(node){
  const el = document.createElement('div');
  /* 底色跟小地圖同一套：灰＝還沒指派、白＝設計手上、綠＝已交出 */
  const sh = node.sheet || {};
  el.className = 'window-node'
    + (sh.confirmed ? ' handed' : '')
    + (sh.pm ? '' : ' unowned');
  el.setAttribute('data-items', JSON.stringify(
    node.groups.map(g => ({ cat: g.name, qty: g.count }))));

  const label = document.createElement('div');
  label.className = 'region-label';
  label.style.fontSize = '14px';
  label.innerHTML = groupLinesHTML(node)
    + (node.noMasthead ? '<div style="font-size:11px;color:#8a7f74">(無刊頭)</div>' : '');
  el.appendChild(label);
  return el;
}

let boards = {};

function buildBoard(side, title){
  const wrap = document.createElement('div');
  wrap.className = 'board';
  const heading = document.createElement('h3');
  heading.textContent = title;
  wrap.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'board-grid';

  const corner = document.createElement('div');
  corner.className = 'ruler-corner';
  corner.textContent = '尺';          // unit lives here, clear of the ticks

  const rTop = document.createElement('div');
  rTop.className = 'ruler-top';
  const markerX = document.createElement('div');
  markerX.className = 'ruler-marker ruler-marker-x';
  markerX.setAttribute('data-val', '0');
  rTop.appendChild(markerX);

  const rLeft = document.createElement('div');
  rLeft.className = 'ruler-left';
  const markerY = document.createElement('div');
  markerY.className = 'ruler-marker ruler-marker-y';
  markerY.setAttribute('data-val', '0');
  rLeft.appendChild(markerY);

  const ws = document.createElement('div');
  ws.className = 'board-ws';
  ws.appendChild(renderContainer(layout[side]));

  const guideV = document.createElement('div'); guideV.className = 'guide v';
  const guideH = document.createElement('div'); guideH.className = 'guide h';
  ws.appendChild(guideV); ws.appendChild(guideH);

  grid.appendChild(corner);
  grid.appendChild(rTop);
  grid.appendChild(rLeft);
  grid.appendChild(ws);
  wrap.appendChild(grid);

  const entry = { ws, rTop, rLeft, markerX, markerY, guideV, guideH,
                  ticks: { len: [], side: [] }, bw: 0, bh: 0 };
  boards[side] = entry;

  /* Marker follows the cursor across the board (1排版切割.html workspace
     mousemove). The board only moves when the pointer is outside it, so its
     rect is taken once on entry instead of on every move — a rect read there
     forces a layout flush per mouse event. The writes are batched into one
     rAF for the same reason. */
  let wsRect = null, markFrame = 0, markAt = null;
  ws.addEventListener('mouseenter', () => { wsRect = ws.getBoundingClientRect(); });
  ws.addEventListener('mousemove', e => {
    if (!wsRect) wsRect = ws.getBoundingClientRect();
    markAt = { x: e.clientX, y: e.clientY };
    if (markFrame) return;
    markFrame = requestAnimationFrame(() => {
      markFrame = 0;
      if (!wsRect || !markAt) return;
      const { x, y } = markAt;
      moveMarkers(entry, x - wsRect.left, y - wsRect.top, x, y);
    });
  });
  ws.addEventListener('mouseleave', () => {
    wsRect = null;
    if (markFrame){ cancelAnimationFrame(markFrame); markFrame = 0; }
    if (!drag) hideMarkers(entry);
  });

  return wrap;
}

/* ==========================================================================
   RULER (總體)
   Structure and tick tiers follow 1排版切割.html: a fixed-size strip along the
   top and left with a corner box, three tick heights (major / medium / minor),
   labels on majors only, and a live marker line + value badge that tracks the
   cursor. Units stay 尺 — a MAJOR tick is one 尺 division, subdivided into
   minor ticks — so 磁吸對齊 keeps snapping to exactly the labelled lines.
   ========================================================================== */

const TICK_MAJOR = 12, TICK_MED = 8, TICK_MINOR = 4;   // px, per the demo

/** How finely to subdivide one 尺, keeping minor ticks at least ~5px apart. */
function pickSubdiv(majorPx){
  for (const c of [10, 4, 2, 1]) if (majorPx / c >= 5) return c;
  return 1;
}

/** Label every k-th 尺, so numbers never crowd on a small board. */
function labelStep(span, divisions, needPx){
  for (const k of [1, 2, 4, 5, 10]) if ((span / divisions) * k >= needPx) return k;
  return divisions;
}

function drawRulers(entry){
  const { rTop, rLeft, bw, bh } = entry;
  rTop.querySelectorAll('.tick,.tick-label,.ruler-cap').forEach(el => el.remove());
  rLeft.querySelectorAll('.tick,.tick-label,.ruler-cap').forEach(el => el.remove());
  entry.ticks = { len: [], side: [] };

  /* Both rulers run to a couple of hundred nodes. Building them into fragments
     and attaching each in one go costs one reflow per ruler rather than one
     per tick — this runs on every resize frame. */
  const fTop = document.createDocumentFragment();
  const fLeft = document.createDocumentFragment();

  /* ---- top ruler: length ---- */
  const lenDiv = CONFIG.lengthDivisions;
  const subL = pickSubdiv(bw / lenDiv);
  const stepL = labelStep(bw, lenDiv, 19);      // widest label "20" + breathing room
  for (let j = 0; j <= lenDiv * subL; j++){
    const x = (j / (lenDiv * subL)) * bw;
    const major = j % subL === 0;
    const med   = !major && subL % 2 === 0 && j % subL === subL / 2;

    const t = document.createElement('div');
    t.className = 'tick';
    t.style.cssText =
      `left:${x}px;bottom:0;width:1px;height:${major ? TICK_MAJOR : med ? TICK_MED : TICK_MINOR}px`;
    fTop.appendChild(t);

    if (major){
      const idx = j / subL;
      let num = null;
      if (idx > 0 && idx % stepL === 0){   // 0 would collide with the corner
        num = document.createElement('div');
        num.className = 'tick-label';
        // centre on the tick, but pull the last one fully inside the strip
        // so it is not clipped by the ruler's overflow:hidden
        const shift = idx === lenDiv ? '-100%' : '-50%';
        num.style.cssText = `left:${x}px;top:2px;transform:translateX(${shift})`;
        num.textContent = idx;
        fTop.appendChild(num);
      }
      entry.ticks.len.push({ tick: t, num });
    }
  }

  /* ---- left ruler: height ---- */
  const sideDiv = CONFIG.sideDivisions;
  const subS = pickSubdiv(bh / sideDiv);
  const stepS = labelStep(bh, sideDiv, 16);
  for (let j = 0; j <= sideDiv * subS; j++){
    const y = (j / (sideDiv * subS)) * bh;
    const major = j % subS === 0;
    const med   = !major && subS % 2 === 0 && j % subS === subS / 2;

    const t = document.createElement('div');
    t.className = 'tick';
    t.style.cssText =
      `top:${y}px;right:0;height:1px;width:${major ? TICK_MAJOR : med ? TICK_MED : TICK_MINOR}px`;
    fLeft.appendChild(t);

    if (major){
      const idx = j / subS;
      let num = null;
      if (idx > 0 && idx % stepS === 0){
        num = document.createElement('div');
        num.className = 'tick-label';
        // The demo rotates these because its labels are 3-digit pixel values;
        // ours are 0–10, so upright reads better and cannot overflow. Pull the
        // last one fully inside so the strip does not clip it.
        const shift = idx === sideDiv ? '-100%' : '-50%';
        num.style.cssText = `top:${y}px;right:14px;transform:translateY(${shift})`;
        num.textContent = idx;
        fLeft.appendChild(num);
      }
      entry.ticks.side.push({ tick: t, num });
    }
  }

  rTop.appendChild(fTop);
  rLeft.appendChild(fLeft);
}

/** Move both marker lines and the cursor readout; x/y are board-relative px.
    cx/cy are the raw client coords, used only to place the readout. */
function moveMarkers(entry, x, y, cx, cy){
  x = Math.max(0, Math.min(x, entry.bw));
  y = Math.max(0, Math.min(y, entry.bh));
  const ux = (x / entry.bw) * CONFIG.lengthDivisions;
  const uy = (y / entry.bh) * CONFIG.sideDivisions;

  entry.markerX.style.left = x + 'px';
  entry.markerX.setAttribute('data-val', ux.toFixed(1));
  entry.markerY.style.top = y + 'px';
  entry.markerY.setAttribute('data-val', uy.toFixed(1));
  entry.markerX.classList.add('on');
  entry.markerY.classList.add('on');

  // the pointer readout gives the full coordinate pair, not a division index
  if (cx != null){
    tip.textContent = `X ${ux.toFixed(1)}　Y ${uy.toFixed(1)}　尺`;
    tip.style.display = 'block';
    tip.style.left = (cx + 16) + 'px';
    tip.style.top  = (cy + 18) + 'px';
  }
}
/** While dragging a segment line, report the LINE's own position — and only
    on the axis it actually moves along. A vertical line has an X and no
    meaningful Y, and vice versa. `unit` is the boundary's ruler position,
    already snapped when snapping applied. */
function moveDragMarker(entry, horizontal, unit, snapped, cx, cy, aligned){
  const txt = aligned ? unit.toFixed(1) : (snapped ? String(unit) : unit.toFixed(1));
  entry.markerX.classList.toggle('aligned', !!aligned);
  entry.markerY.classList.toggle('aligned', !!aligned);
  tip.classList.toggle('aligned', !!aligned);
  if (horizontal){                                  // vertical line -> X only
    entry.markerX.style.left = (unit / CONFIG.lengthDivisions) * entry.bw + 'px';
    entry.markerX.setAttribute('data-val', txt);
    entry.markerX.classList.add('on');
    entry.markerY.classList.remove('on');
    tip.textContent = `X ${txt} 尺`;
  } else {                                          // horizontal line -> Y only
    entry.markerY.style.top = (unit / CONFIG.sideDivisions) * entry.bh + 'px';
    entry.markerY.setAttribute('data-val', txt);
    entry.markerY.classList.add('on');
    entry.markerX.classList.remove('on');
    tip.textContent = `Y ${txt} 尺`;
  }
  tip.style.display = 'block';
  tip.style.left = (cx + 16) + 'px';
  tip.style.top  = (cy + 18) + 'px';
}

function hideMarkers(entry){
  entry.markerX.classList.remove('on');
  entry.markerY.classList.remove('on');
  tip.style.display = 'none';
  tip.classList.remove('snapped');
}

function fitBoards(){
  const host = document.getElementById('view-total');
  if (!host.classList.contains('active')) return;
  const RW = 30;                                   // must match --ruler-w
  const availW = (host.clientWidth - 34 - 8) / 2 - RW;
  const availH = host.clientHeight - 42 - RW;
  const k = Math.max(0.25, Math.min(1, availW / CONFIG.board.w, availH / CONFIG.board.h));
  const bw = Math.round(CONFIG.board.w * k);
  const bh = Math.round(CONFIG.board.h * k);
  Object.values(boards).forEach(b => {
    b.bw = bw; b.bh = bh;
    b.ws.style.width  = bw + 'px';
    b.ws.style.height = bh + 'px';
    drawRulers(b);                                 // ticks re-fit the new size
  });
}

/* ==========================================================================
   DRAG (總體)
   Rects measured once on pointerdown; pointermove only records the pending
   value and a single rAF does every DOM write.
   ========================================================================== */

const tip = document.getElementById('tip');
let drag = null;
let frame = 0;

/* Flexbox lays each child out as `size% * parentPx - dividerShare`, so the
   leading edge of boundary i sits at
       cum% * parentPx - (i+1)*dividerShare + i*divPx
   Using (parentPx - totalDividers) instead is off by up to a pixel — enough
   to stop a snap landing exactly on its gridline. Exact inverses.

   `ctx` is whatever measureDivider() returned — the live drag during a drag,
   a throwaway measurement when the inline 尺 field needs the same maths. */
function offsetForCum(ctx, cum){
  return (cum / 100) * ctx.parentPx - (ctx.i + 1) * ctx.dividerShare + ctx.i * ctx.divPx;
}
function cumForOffset(ctx, offsetPx){
  return ((offsetPx + (ctx.i + 1) * ctx.dividerShare - ctx.i * ctx.divPx) / ctx.parentPx) * 100;
}

/** Everything about one divider's geometry, measured once. */
function measureDivider(r){
  const node = r._parent, i = r._index, childEls = r._childEls;
  const horizontal = node.dir === 'row';

  const containerEl = r.parentElement;
  const parentRect = containerEl.getBoundingClientRect();
  const side = containerEl.closest('.board-ws');
  const boardRect = side.getBoundingClientRect();

  // The board is sized in real px (no transform), so rect px ARE css px.
  const divPx = RESIZE_PX;
  const parentPx = horizontal ? parentRect.width : parentRect.height;
  const boardPx  = horizontal ? boardRect.width  : boardRect.height;
  const parentInBoard = horizontal
    ? parentRect.left - boardRect.left
    : parentRect.top  - boardRect.top;

  const sizes = effSizes(node);
  const before = sizes.slice(0, i).reduce((s,v) => s + v, 0);
  const pairSum = sizes[i] + sizes[i+1];

  return {
    node, i, childEls, horizontal, side, resizerEl: r,
    parentRect, boardRect, parentPx, boardPx, parentInBoard, divPx, before, pairSum,
    dividerShare: childEls[i]._dividerShare,
    boardsEntry: Object.values(boards).find(b => b.ws === side),
    sizes
  };
}

/** Alignment targets on this axis: other dividers, plus the user's 參考線. */
function collectAlignTargets(ctx){
  const { horizontal, side, boardRect, childEls, i, resizerEl } = ctx;
  /* Canva-style alignment targets: every OTHER divider on this axis, measured
     once here. Dividers inside the two siblings being resized are skipped —
     they shift as the drag proceeds, so their cached position would be a lie.
     Everything else on the board is stationary for the whole gesture, which
     keeps the move handler free of layout reads. */
  const axisSel = horizontal ? '.resizer-vertical, .fold' : '.resizer-horizontal';
  const moving = [childEls[i], childEls[i+1]];
  const guides = [];
  side.querySelectorAll(axisSel).forEach(el => {
    if (el === resizerEl || moving.some(m => m.contains(el))) return;
    const rc = el.getBoundingClientRect();
    guides.push(horizontal
      ? rc.left + rc.width / 2 - boardRect.left
      : rc.top + rc.height / 2 - boardRect.top);
  });

  // 參考線 pulled out of the ruler are targets too, exactly like PS
  const key = sideKeyOf(side);
  const list = (currentPlan && currentPlan.guides && currentPlan.guides[key]) || [];
  const axis = horizontal ? 'len' : 'side';
  const divisions = horizontal ? CONFIG.lengthDivisions : CONFIG.sideDivisions;
  const span = horizontal ? boardRect.width : boardRect.height;
  list.forEach(g => { if (g.axis === axis) guides.push((g.unit / divisions) * span); });

  return guides;
}

document.addEventListener('pointerdown', e => {
  const r = e.target.closest ? e.target.closest('.resizer') : null;
  if (!r || !r._parent) return;
  e.preventDefault();
  closeDividerField();

  const ctx = measureDivider(r);
  const resRect = r.getBoundingClientRect();

  drag = Object.assign(ctx, {
    guides: collectAlignTargets(ctx),
    grab: ctx.horizontal ? e.clientX - resRect.left : e.clientY - resRect.top,
    origI: ctx.sizes[ctx.i],          // what Esc puts back
    startClient: ctx.horizontal ? e.clientX : e.clientY,
    moved: false,
    pending: null
  });

  r.setPointerCapture(e.pointerId);
  r.classList.add('dragging');
  document.body.classList.add('dragging', ctx.horizontal ? 'dragging-col' : 'dragging-row');
}, true);

document.addEventListener('pointermove', e => {
  if (!drag) return;
  const ptr = drag.horizontal
    ? e.clientX - drag.parentRect.left
    : e.clientY - drag.parentRect.top;
  const offsetPx = ptr - drag.grab;
  /* Browsers emit a pointermove on press even when nothing moved. A couple of
     px of slack keeps a plain click reading as a click, so it still opens the
     尺 field instead of being taken for a zero-length drag. */
  if (Math.abs((drag.horizontal ? e.clientX : e.clientY) - drag.startClient) > 2)
    drag.moved = true;

  let sizeI = cumForOffset(drag, offsetPx) - drag.before;
  sizeI = Math.max(CONFIG.minPercent, Math.min(drag.pairSum - CONFIG.minPercent, sizeI));

  // Alt held = PS's snap override: free positioning for as long as it is down
  showSnapOverride(e.altKey);
  const snapped = applySnap(sizeI, !e.altKey);

  // keep the ruler marker live while dragging, as 1排版切割.html does — but
  // tracking the boundary itself, on its own axis only
  if (drag.boardsEntry){
    moveDragMarker(drag.boardsEntry, drag.horizontal,
      snapped.unit, snapped.hit, e.clientX, e.clientY, snapped.aligned);
  }
  drag.pending = { sizeI: snapped.sizeI, unit: snapped.unit, snapped: snapped.hit, x: e.clientX, y: e.clientY };
  if (!frame) frame = requestAnimationFrame(commit);
});

function commit(){
  frame = 0;
  if (!drag || !drag.pending) return;
  applyPair(drag, drag.pending.sizeI);
  tip.classList.toggle('snapped', drag.pending.snapped);   // text set by moveMarkers
}

/* Set when a drag ends, consumed by the click handler that would otherwise
   mistake the drag's trailing click for a fresh one. */
let divClickSuppressed = false;

function endDrag(e, revert){
  if (!drag) return;
  if (frame){ cancelAnimationFrame(frame); frame = 0; if (!revert) commit(); }

  // Esc: put the pair back exactly as it was when the drag started
  if (revert) applyPair(drag, drag.origI);

  const moved = drag.moved && !revert;
  drag.resizerEl.classList.remove('dragging');
  try { drag.resizerEl.releasePointerCapture(e && e.pointerId); } catch (err) {}
  clearSnapFeedback(drag.boardsEntry);
  if (drag.boardsEntry) hideMarkers(drag.boardsEntry);
  document.body.classList.remove('dragging', 'dragging-col', 'dragging-row');
  tip.style.display = 'none';
  tip.classList.remove('snapped', 'aligned');
  showSnapOverride(false);
  drag = null;
  /* A drag is followed by a click event on the same divider. That must not be
     read as "the user clicked a divider" and open the 尺 field. */
  divClickSuppressed = moved;
  if (moved) commitAction();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* While Alt is held the 磁吸對齊 switch reads as off, so the state on screen
   always matches the behaviour — but CONFIG.snapOn itself is untouched. */
const snapToggleEl = document.getElementById('snapToggle');
let snapOverridden = false;
function showSnapOverride(on){
  if (on === snapOverridden) return;
  snapOverridden = on;
  snapToggleEl.checked = on ? false : CONFIG.snapOn;
}

/* ==========================================================================
   SNAP (總體)
   ========================================================================== */

let snapState = { entry: null, axis: null, idx: -1 };

function applySnap(sizeI, snapAllowed){
  const divisions = drag.horizontal ? CONFIG.lengthDivisions : CONFIG.sideDivisions;
  const boardPx = drag.boardPx;
  const boardPos = drag.parentInBoard + offsetForCum(drag, drag.before + sizeI);
  const unit = (boardPos / boardPx) * divisions;

  if (!CONFIG.snapOn || snapAllowed === false){
    clearSnapFeedback(drag.boardsEntry);
    return { sizeI, unit, hit: false };
  }

  const tolerance = CONFIG.snapPx;                // board is unscaled: px == px

  const nearest = Math.round(unit);
  const gridPx = (nearest / divisions) * boardPx;
  const dGrid = (nearest >= 0 && nearest <= divisions)
    ? Math.abs(gridPx - boardPos) : Infinity;

  /* Canva leans toward lining up with another object rather than the grid —
     but only leans. A bias lets alignment win a near-tie without dragging the
     boundary past a gridline that is plainly closer. */
  let bestObj = null, dObj = Infinity;
  for (const g of drag.guides){
    const d = Math.abs(g - boardPos);
    if (d < dObj){ dObj = d; bestObj = g; }
  }
  if (bestObj != null && dObj <= tolerance && dObj <= dGrid + CONFIG.alignBias){
    const size = cumForOffset(drag, bestObj - drag.parentInBoard) - drag.before;
    if (size >= CONFIG.minPercent && drag.pairSum - size >= CONFIG.minPercent){
      showAlignGuide(drag.boardsEntry, drag.horizontal, (bestObj / boardPx) * 100);
      return { sizeI: size, unit: (bestObj / boardPx) * divisions, hit: true, aligned: true };
    }
  }

  if (dGrid <= tolerance){
    const snappedSize = cumForOffset(drag, gridPx - drag.parentInBoard) - drag.before;
    if (snappedSize >= CONFIG.minPercent && drag.pairSum - snappedSize >= CONFIG.minPercent){
      showSnapFeedback(drag.boardsEntry, drag.horizontal ? 'len' : 'side', nearest, divisions);
      return { sizeI: snappedSize, unit: nearest, hit: true };
    }
  }
  clearSnapFeedback(drag.boardsEntry);
  return { sizeI, unit, hit: false };
}

/** Violet line where the boundary meets another divider (Canva smart guide). */
function showAlignGuide(entry, horizontal, pct){
  if (!entry) return;
  clearSnapFeedback(entry);
  const g = horizontal ? entry.guideV : entry.guideH;
  if (horizontal) g.style.left = pct + '%'; else g.style.top = pct + '%';
  g.classList.add('on', 'obj');
  snapState = { entry, axis: null, idx: -1, obj: true };
}

function showSnapFeedback(entry, axis, idx, divisions){
  if (!entry) return;
  if (snapState.entry === entry && snapState.axis === axis && snapState.idx === idx) return;
  clearSnapFeedback(snapState.entry);
  const t = entry.ticks[axis][idx];
  if (t){ t.tick.classList.add('hi'); if (t.num) t.num.classList.add('hi'); }   // idx 0 has no label
  const pct = (idx / divisions) * 100;
  if (axis === 'len'){ entry.guideV.style.left = pct + '%'; entry.guideV.classList.add('on'); }
  else               { entry.guideH.style.top  = pct + '%'; entry.guideH.classList.add('on'); }
  snapState = { entry, axis, idx };
}

function clearSnapFeedback(entry){
  if (!snapState.entry) return;              // stay off the hot path
  const e = entry || snapState.entry;
  if (!e) return;
  e.guideV.classList.remove('obj');
  e.guideH.classList.remove('obj');
  const clr = t => { t.tick.classList.remove('hi'); if (t.num) t.num.classList.remove('hi'); };
  e.ticks.len.forEach(clr);
  e.ticks.side.forEach(clr);
  e.guideV.classList.remove('on');
  e.guideH.classList.remove('on');
  snapState = { entry: null, axis: null, idx: -1 };
}

document.getElementById('snapToggle').addEventListener('change', e => {
  if (snapOverridden) return;             // Alt is driving the checkbox
  CONFIG.snapOn = e.target.checked;
  if (!CONFIG.snapOn) clearSnapFeedback(null);
});

/* 顯示品名 — a view preference, not document state: it is never written into
   the plan and never lands in the undo stack. Purely how you are looking at
   the sheet right now. */
const copyToggle = document.getElementById('copyToggle');
let showCopy = true;

function applyShowCopy(){
  boardEl.classList.toggle('hide-copy', !showCopy);
}
copyToggle.addEventListener('change', e => {
  showCopy = e.target.checked;
  applyShowCopy();
  toast(showCopy ? '顯示品名' : '已隱藏品名，只看版面配置', 'info', 1600);
});

/* ==========================================================================
   參考線 — PS GUIDES (總體)
   Pull one out of either ruler, drop it back on the ruler to delete it,
   double-click a ruler to clear the board. Positions are stored per 檔期 in
   尺 units rather than px, so they survive a window resize and a re-import.
   ========================================================================== */

const sideKeyOf = wsEl => Object.keys(boards).find(k => boards[k].ws === wsEl) || 'front';
const guidesFor = key => {
  if (!currentPlan) return [];
  if (!currentPlan.guides) currentPlan.guides = { front: [], back: [] };
  if (!currentPlan.guides[key]) currentPlan.guides[key] = [];
  return currentPlan.guides[key];
};
const divisionsOf = axis => axis === 'len' ? CONFIG.lengthDivisions : CONFIG.sideDivisions;

/** Rebuild one board's guide elements from the stored list. */
function drawGuides(key){
  const entry = boards[key];
  if (!entry) return;
  entry.ws.querySelectorAll('.rguide').forEach(el => el.remove());
  guidesFor(key).forEach((g, i) => {
    const el = document.createElement('div');
    el.className = 'rguide ' + (g.axis === 'len' ? 'v' : 'h');
    el.dataset.at = i;
    positionGuide(el, g);
    entry.ws.appendChild(el);
  });
}

function positionGuide(el, g){
  const pct = (g.unit / divisionsOf(g.axis)) * 100;
  if (g.axis === 'len') el.style.left = pct + '%';
  else                  el.style.top  = pct + '%';
}

/** Board-relative pointer position, in 尺, clamped to the board. */
function guideUnitAt(entry, axis, cx, cy){
  const r = entry.ws.getBoundingClientRect();
  const div = divisionsOf(axis);
  const frac = axis === 'len'
    ? (cx - r.left) / r.width
    : (cy - r.top) / r.height;
  return Math.max(0, Math.min(div, frac * div));
}

let guideDrag = null;

function startGuideDrag(key, axis, g, el, e, created){
  guideDrag = { key, axis, g, el, created, orig: g.unit,
                entry: boards[key], doomed: false, leftRuler: !created };
  el.classList.add('dragging');
  el.setPointerCapture(e.pointerId);
  document.body.style.userSelect = 'none';
}

document.addEventListener('pointermove', e => {
  if (!guideDrag) return;
  const { entry, axis, g, el } = guideDrag;
  let unit = guideUnitAt(entry, axis, e.clientX, e.clientY);

  // guides land on the labelled 尺 lines unless Alt says otherwise
  if (CONFIG.snapOn && !e.altKey){
    const near = Math.round(unit);
    const span = axis === 'len' ? entry.bw : entry.bh;
    if (Math.abs((near - unit) / divisionsOf(axis) * span) <= CONFIG.snapPx) unit = near;
  }
  g.unit = Math.round(unit * 10) / 10;
  positionGuide(el, g);

  // back over the ruler strip = drop it here and it goes away, as in PS
  const r = entry.ws.getBoundingClientRect();
  guideDrag.doomed = axis === 'len' ? e.clientY < r.top : e.clientX < r.left;
  el.classList.toggle('doomed', guideDrag.doomed);
  // a new guide only becomes real once it has been pulled onto the board
  if (!guideDrag.doomed) guideDrag.leftRuler = true;

  moveDragMarker(entry, axis === 'len', g.unit, false, e.clientX, e.clientY, false);
});

function endGuideDrag(){
  if (!guideDrag) return;
  const { key, g, el, doomed, entry, created, orig, leftRuler } = guideDrag;
  guideDrag = null;
  document.body.style.userSelect = '';
  hideMarkers(entry);
  el.classList.remove('dragging', 'doomed');

  const list = guidesFor(key);

  /* Released without ever leaving the ruler: that was a click, not a drag, so
     the provisional guide never existed. This is also what lets a double-click
     on the ruler mean "clear guides" and nothing else. */
  if (created && !leftRuler){
    const at = list.indexOf(g);
    if (at >= 0) list.splice(at, 1);
    drawGuides(key);
    return;
  }

  if (doomed){
    const at = list.indexOf(g);
    if (at >= 0) list.splice(at, 1);
    drawGuides(key);
    toast('已刪除參考線', 'info', 1400);
    commitAction();
    return;
  }
  if (created || g.unit !== orig) commitAction();
}
document.addEventListener('pointerup', endGuideDrag);
document.addEventListener('pointercancel', endGuideDrag);

/* ---- pull a new guide out of a ruler ---- */
document.addEventListener('pointerdown', e => {
  if (!e.target.closest) return;
  const strip = e.target.closest('.ruler-top, .ruler-left');
  if (!strip || !currentPlan) return;

  const axis = strip.classList.contains('ruler-top') ? 'len' : 'side';
  const key = Object.keys(boards).find(k =>
    boards[k].rTop === strip || boards[k].rLeft === strip);
  if (!key) return;

  e.preventDefault();
  const entry = boards[key];
  const g = { axis, unit: guideUnitAt(entry, axis, e.clientX, e.clientY) };
  const at = guidesFor(key).push(g) - 1;
  drawGuides(key);
  const el = entry.ws.querySelector('.rguide[data-at="' + at + '"]');
  if (el) startGuideDrag(key, axis, g, el, e, true);
});

/* ---- move or delete an existing guide ---- */
document.addEventListener('pointerdown', e => {
  if (!e.target.closest) return;
  const el = e.target.closest('.rguide');
  if (!el) return;
  const wsEl = el.parentElement;
  const key = sideKeyOf(wsEl);
  const g = guidesFor(key)[+el.dataset.at];
  if (!g) return;
  e.preventDefault();
  e.stopPropagation();
  startGuideDrag(key, g.axis, g, el, e, false);
}, true);

/* ---- double-click a ruler: clear that board's guides ---- */
document.addEventListener('dblclick', e => {
  if (!e.target.closest) return;
  const strip = e.target.closest('.ruler-top, .ruler-left');
  if (!strip || !currentPlan) return;
  const key = Object.keys(boards).find(k =>
    boards[k].rTop === strip || boards[k].rLeft === strip);
  if (!key) return;
  const list = guidesFor(key);
  if (!list.length) return;
  const n = list.length;
  list.length = 0;
  drawGuides(key);
  commitAction();
  toast(`已清除 ${n} 條參考線　⌘/Ctrl+Z 可復原`, 'info', 2600);
});

/* ==========================================================================
   DIVIDER: 雙擊平分 ・ 單擊輸入尺值
   ========================================================================== */

let divField = null, divClickTimer = 0;

function closeDividerField(){
  if (!divField) return;
  divField.remove();
  divField = null;
}

/** The boundary's current position on the ruler, in 尺. */
function dividerUnit(ctx){
  const divisions = ctx.horizontal ? CONFIG.lengthDivisions : CONFIG.sideDivisions;
  const boardPos = ctx.parentInBoard + offsetForCum(ctx, ctx.before + ctx.sizes[ctx.i]);
  return (boardPos / ctx.boardPx) * divisions;
}

/** Move the boundary so it sits at `unit` 尺, honouring the min-size floors. */
function setDividerUnit(ctx, unit){
  const divisions = ctx.horizontal ? CONFIG.lengthDivisions : CONFIG.sideDivisions;
  const boardPos = (unit / divisions) * ctx.boardPx;
  let size = cumForOffset(ctx, boardPos - ctx.parentInBoard) - ctx.before;
  size = Math.max(CONFIG.minPercent, Math.min(ctx.pairSum - CONFIG.minPercent, size));
  applyPair(ctx, size);
}

/** Write one pair of sibling sizes into both the tree and the DOM. */
function applyPair(ctx, sizeI){
  const { node, i, childEls, dividerShare, pairSum } = ctx;
  node.children[i].size = sizeI;
  if (node.children[i+1].size != null) node.children[i+1].size = pairSum - sizeI;
  childEls[i].style.flex = flexFor(node.children[i].size, dividerShare);
  if (node.children[i+1].size != null)
    childEls[i+1].style.flex = flexFor(node.children[i+1].size, dividerShare);
}

function openDividerField(r, cx, cy){
  closeDividerField();
  const ctx = measureDivider(r);
  const divisions = ctx.horizontal ? CONFIG.lengthDivisions : CONFIG.sideDivisions;

  const inp = document.createElement('input');
  inp.type = 'number';
  inp.className = 'div-num';
  inp.step = '0.1'; inp.min = '0'; inp.max = String(divisions);
  inp.value = dividerUnit(ctx).toFixed(1);
  inp.title = `輸入 0 – ${divisions} 尺，Enter 確定，Esc 取消`;
  inp.style.left = Math.min(window.innerWidth - 100, cx + 12) + 'px';
  inp.style.top  = Math.min(window.innerHeight - 40, cy + 12) + 'px';

  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();                    // never reaches the tool shortcuts
    if (ev.key === 'Enter'){
      const v = parseFloat(inp.value);
      if (isFinite(v)){
        setDividerUnit(ctx, Math.max(0, Math.min(divisions, v)));
        commitAction();
        toast(`已設為 ${Math.max(0, Math.min(divisions, v)).toFixed(1)} 尺`, 'ok', 1500);
      }
      closeDividerField();
    } else if (ev.key === 'Escape'){
      closeDividerField();
    }
  });
  inp.addEventListener('blur', closeDividerField);

  divField = inp;
  document.body.appendChild(inp);
  inp.focus(); inp.select();
}

/* A single click opens the field, a double-click evens the pair — so the
   field waits long enough to find out which gesture this was. */
document.addEventListener('click', e => {
  const r = e.target.closest ? e.target.closest('.resizer') : null;
  if (!r || !r._parent) return;
  if (drag) return;
  if (divClickSuppressed){ divClickSuppressed = false; return; }   // ended a drag
  clearTimeout(divClickTimer);
  const cx = e.clientX, cy = e.clientY;
  divClickTimer = setTimeout(() => openDividerField(r, cx, cy), 240);
});

document.addEventListener('dblclick', e => {
  const r = e.target.closest ? e.target.closest('.resizer') : null;
  if (!r || !r._parent) return;
  clearTimeout(divClickTimer);
  closeDividerField();
  const ctx = measureDivider(r);
  applyPair(ctx, ctx.pairSum / 2);           // 50/50
  commitAction();
  toast('已平分為 50 / 50', 'ok', 1500);
});

/* ==========================================================================
   ================== 落版 VIEW — isolated from 總體 below =================
   ========================================================================== */

const sheetSide = document.getElementById('sheetSide');
const boardEl     = document.getElementById('board');
const blockHead   = document.getElementById('blockHead');
const sheetMainEl = document.getElementById('sheetMain');   // the scroll pane
const mhFile    = document.getElementById('mhFile');
let activeBlock = null;
/* structural fingerprint of what #board currently shows — see sheetSig() */
let boardSig = null;

/* Cells start empty. Arranging the grid comes first; only after 確認格子排列
   is the layout fixed and the cards open for text. `gi` is kept so the
   two-tone group colouring still marks where one 群組 ends and the next
   begins, even while the cards are blank. */
function buildCells(block){
  const cells = [];
  let i = 0;
  block.groups.forEach((g, gi) => {
    for (let k = 0; k < g.count; k++){
      cells.push({ id: block.id + '-c' + (i++), gi, text: '' });
    }
  });
  return cells;
}
function sheetOf(block){
  if (!block.sheet.cells){
    block.sheet.cells = buildCells(block);
    // 無刊頭 blocks start without one; everyone else gets a placeholder
    block.sheet.masthead = block.noMasthead ? null : { image: null };
  }
  return block.sheet;
}

/* ==========================================================================
   MINIMAP  (adapted from dm-block-zoom.html: #minimap / renderMinimap /
   switchBlock — same click-to-switch + .active model, but the boards are
   rendered straight from the 總體 tree instead of absolute x/y/w/h, and
   region names + red counts stay visible per spec §1.)
   ========================================================================== */

const MINI_PAGE = { w: 252, h: 179 };     // must match .mini-page
const MINI_LH = 1.28, MINI_CHROME = 7;    // line-height, padding + border
const MINI_FOLD_PX = 3;

/** Rough advance width in em: CJK ~1.0, ASCII ~0.5. */
const emWidth = s => [...s].reduce((w,ch) => w + (/[\x00-\x7F]/.test(ch) ? 0.5 : 1), 0);

/** Largest size (capped at dm-block-zoom's 13px) that still fits the region. */
function miniFontSize(node, wpx, hpx){
  const n = node.groups.length;
  const widestEm = Math.max(...node.groups.map(g => emWidth(`${g.name}(${g.count})`)));
  const byH = (hpx - MINI_CHROME) / (n * MINI_LH);
  const byW = (wpx - MINI_CHROME) / widestEm;
  return Math.max(8, Math.min(13, Math.floor(Math.min(byH, byW))));
}

function renderMiniNode(node, wpx, hpx){
  if (isLeaf(node)){
    const el = document.createElement('div');
    /* 底色講的是這一塊現在的狀態：沒人負責 / 設計手上 / 已交給 PM。
       選中是藍框，不是藍底 —— 底色是「東西的狀態」，藍色是「你在哪裡」。 */
    el.className = 'mini-blk'
      + (activeBlock === node ? ' active' : '')
      + (node.sheet.confirmed ? ' confirmed' : '')
      + (node.sheet.pm ? '' : ' unowned');
    // dm-block-zoom's 13px baseline, stepped down only as far as this
    // region's real pixel size demands, so nothing ever clips
    el.style.fontSize = miniFontSize(node, wpx, hpx) + 'px';
    el.innerHTML = node.groups.map(g => `<div>${g.name}${
      g.count ? `<span class="cnt">(${g.count})</span>` : ''}</div>`).join('');
    /* 這個版位還欠幾則：哪一種、各幾則排在左下角，總數是右上角那顆紅點。
       不必點進去就看得出來哪一塊還有事情沒處理。 */
    const roll = noteRollup(node);
    if (roll.total){
      el.classList.add('has-notes');
      const row = document.createElement('div');
      row.className = 'mini-notes';
      roll.kinds.forEach(({ k, n }) => {
        const chip = document.createElement('i');
        chip.className = 'mnk' + (k.icon ? '' : ' plain');
        chip.style.background = k.color;
        chip.textContent = k.icon;
        if (n > 1){
          const b = document.createElement('b');
          b.textContent = n;
          chip.appendChild(b);
        }
        chip.title = `${k.label} ${n} 則還沒處理`;
        row.appendChild(chip);
      });
      el.appendChild(row);
      const dot = document.createElement('span');
      dot.className = 'mini-cnb';
      dot.textContent = roll.total;
      dot.title = roll.total + ' 則還沒處理';
      el.appendChild(dot);
    }
    el.addEventListener('click', () => switchBlock(node));
    el.addEventListener('mousemove', e => showTip(e, tipForBlock(node)));
    el.addEventListener('mouseleave', hideTip);
    return el;
  }
  const el = document.createElement('div');
  el.className = 'mini-split';
  const row = node.dir === 'row';
  el.style.flexDirection = row ? 'row' : 'column';

  const sizes = effSizes(node);
  const folds = node.fold ? MINI_FOLD_PX * (node.children.length - 1) : 0;
  const availW = row ? wpx - folds : wpx;
  const availH = row ? hpx : hpx - folds;

  node.children.forEach((kid, i) => {
    if (i > 0 && node.fold){
      const f = document.createElement('div');
      f.className = 'mini-fold';
      el.appendChild(f);
    }
    const kw = row ? (sizes[i] / 100) * availW : availW;
    const kh = row ? availH : (sizes[i] / 100) * availH;
    const kidEl = renderMiniNode(kid, kw, kh);
    // no resizers in the minimap, so plain proportional growth is exact
    kidEl.style.flex = `${sizes[i]} 1 0%`;
    kidEl.style.minWidth = '0px';
    kidEl.style.minHeight = '0px';
    el.appendChild(kidEl);
  });
  return el;
}

/* ---- 收合把手 ------------------------------------------------------------
   一根貼在欄位外緣正中間的書籤：按一下把那一欄推到旁邊，再按一下拉回來。
   它自己是獨立的一條（寬度 0），所以欄位收掉之後它還在原地，不會跟著不見。 */
function makeFoldBar(side, resolve, title, opts){
  const canPush = !(opts && opts.push === false);   // 左邊那欄只用點的
  const bar = document.createElement('div');
  bar.className = 'fold-bar ' + (side === 'left' ? 'at-left' : 'at-right')
               + (canPush ? '' : ' no-push');
  const tab = document.createElement('button');
  tab.className = 'fold-tab';
  tab.title = title + (canPush ? '（拖著左右推＝改寬度）' : '');
  bar.appendChild(tab);

  const paint = () => {
    const host = resolve();
    const mini = !!(host && host.classList.contains('mini'));
    tab.textContent = (side === 'left') === mini ? '⟩' : '⟨';
    return host;
  };
  /* ---- 用推的：拖著這根書籤把欄位推寬、推窄，推到底就收起來 --------------
     點一下還是整條收起／展開（原本的用法沒有變），只是現在多了一種手感：
     欄位寬度是你自己決定的，不是只有「全開」和「全關」兩種。 */
  const RAIL = h => h && h.id === 'boardRail';
  const appEl = () => document.querySelector('.app');
  const MINW = 170, MAXW = 560;
  let lastW = 0;                        // 收起來之前的寬度，展開就回到那裡

  const widthNow = host => RAIL(host)
    ? (parseFloat(getComputedStyle(appEl()).getPropertyValue('--railw')) || 340)
    : (host.getBoundingClientRect().width || parseFloat(getComputedStyle(host).width) || 240);

  function setWidth(host, w){
    if (RAIL(host)) appEl().style.setProperty('--railw', w + 'px');
    else host.style.width = w + 'px';
  }
  function setMini(host, on){
    if (host.classList.contains('mini') === on) return;
    host.classList.toggle('mini', on);
    if (RAIL(host)){
      appEl().classList.toggle('rail-mini', on);
      // 收起來時要讓 .rail-mini 那條規則說了算，行內的寬度得先讓開
      if (on) appEl().style.removeProperty('--railw');
      else if (lastW) setWidth(host, lastW);
    } else {
      if (on) host.style.width = '';    // 同理：讓 .mini 的 0 生效
      else if (lastW) setWidth(host, lastW);
    }
    paint();
  }

  let push = null;
  tab.addEventListener('pointerdown', e => {
    const host = resolve();
    if (!host || e.button !== 0) return;
    e.preventDefault();
    if (!canPush){ push = { host, moved: false }; return; }   // 點一下就好
    const mini = host.classList.contains('mini');
    push = { host, x: e.clientX, w: mini ? 0 : widthNow(host), mini, moved: false };
    if (!mini) lastW = push.w;
    try { tab.setPointerCapture(e.pointerId); } catch (_) {}
  });
  tab.addEventListener('pointermove', e => {
    if (!push || !canPush) return;
    const dx = e.clientX - push.x;
    if (!push.moved){
      if (Math.abs(dx) < 4) return;
      push.moved = true;
      bar.classList.add('pushing');
      push.host.classList.add('no-anim');
    }
    // 左邊那欄往右推是變寬，右邊那欄往左推才是變寬
    const want = push.w + (side === 'left' ? dx : -dx);
    if (want < MINW * .6){ setMini(push.host, true); return; }
    setMini(push.host, false);
    lastW = Math.max(MINW, Math.min(MAXW, want));
    setWidth(push.host, lastW);
  });
  function endPush(){
    if (!push) return;
    const p = push;
    push = null;
    bar.classList.remove('pushing');
    p.host.classList.remove('no-anim');
    if (p.moved) return;                                  // 推過了就不是點擊
    setMini(p.host, !p.host.classList.contains('mini'));  // 點一下＝整條收起／展開
  }
  tab.addEventListener('pointerup', endPush);
  tab.addEventListener('pointercancel', endPush);
  bar.paint = paint;
  paint();
  return bar;
}

/* 左邊那一欄：落版 是小地圖，拼板 的 PM 看到的是品類樹 —— 同一根把手管當下那一個 */
/* 左邊那欄只有「收起／展開」兩種狀態：小地圖和品類樹的寬度是照內容量好的，
   推寬推窄只會讓它們兩邊都不好看。要推的是右邊那條意見欄。 */
const sideFold = makeFoldBar('left', () => {
  const t = document.getElementById('pmTree');
  return (t && t.offsetParent) ? t : sheetSide;
}, '收起／展開左邊這一欄', { push:false });

function renderMinimap(){
  const wasMini = sheetSide.classList.contains('mini');
  sheetSide.innerHTML = '';
  sheetSide.classList.toggle('mini', wasMini);     // 重畫不該把它打開
  [['front','正面'], ['back','背面']].forEach(([side, title]) => {
    const lab = document.createElement('div');
    lab.className = 'mini-label';
    lab.textContent = title;
    const page = document.createElement('div');
    page.className = 'mini-page';
    page.appendChild(renderMiniNode(layout[side], MINI_PAGE.w - 4, MINI_PAGE.h - 4));
    sheetSide.appendChild(lab);
    sheetSide.appendChild(page);
  });
}

function switchBlock(block){
  const moved = block !== activeBlock;      // 真的換了一個版位，不是重畫同一個
  activeBlock = block;
  renderMinimap();
  renderHead();
  renderGrid(block);
  renderConfirmBtn();
  // 換版位：開著的那一格已經不在這張版上了，面板和意見欄跟著換
  if (activeTab === 'board'){
    closeBoardCell();
    focusCell = null; selNote = null;
    paintBoardThumbs(); applyPmFocus(); renderRail(); applyFocusCell();
    syncTypeBar();          // 換版位＝換一套字級設定
    queueType(block);
  }
  /* 換到一個新的版位＝要「先看到它整張」，所以自己縮到剛好、擺到正中間。
     只在真的換版位時做 —— 在同一個版位裡切分頁、重畫，都不該把你自己
     調好的縮放洗掉。 */
  if (moved) zoomToFit(true);
}

/* --- cursor tip, lifted from dm-block-zoom.html --- */
const cursorTip = document.getElementById('cursorTip');
let lastTipPos = { x:0, y:0 };
const sep = '<span class="sep">・</span>';

function tipForBlock(b){
  const who = (b.sheet && b.sheet.pm) ? pmName(b.sheet.pm) : '';
  return [ `<b>${b.name}</b>`,
           b.noMasthead ? '<span class="sep">(無刊頭)</span>' : '',
           `<span class="num">${totalCount(b)} 支</span>`,
           who ? `PM：${who}` : '未指派 PM',
           b.sheet.confirmed ? '已確認' : '' ].filter(Boolean).join(sep);
}
function showTip(e, html){
  lastTipPos = { x:e.clientX, y:e.clientY };
  cursorTip.innerHTML = html;
  cursorTip.style.display = 'block';
  positionTip();
}
function positionTip(){
  const r = cursorTip.getBoundingClientRect();
  let x = lastTipPos.x + 14, y = lastTipPos.y + 14;
  if (x + r.width  + 8 > innerWidth)  x = lastTipPos.x - r.width  - 8;
  if (y + r.height + 8 > innerHeight) y = lastTipPos.y - r.height - 8;
  cursorTip.style.left = x + 'px';
  cursorTip.style.top  = y + 'px';
}
function hideTip(){ cursorTip.style.display = 'none'; }

/* ==========================================================================
   GRID  (adapted from dm-block-zoom.html renderGrid — same "pick a column
   count that divides n so no ragged edge" trick, but biased to ~8 wide
   columns per spec §2, and emitted as .row/.cell so grid-reorder.html's
   row mechanic applies verbatim.)
   ========================================================================== */

/** Walk the tree to find a block's pixel w/h inside its board. */
function regionSize(node, target, wpx, hpx){
  if (node === target) return { w: wpx, h: hpx };
  if (isLeaf(node)) return null;
  const row = node.dir === 'row';
  const divPx = node.fold ? FOLD_PX : RESIZE_PX;
  const folds = divPx * (node.children.length - 1);
  const availW = row ? wpx - folds : wpx;
  const availH = row ? hpx : hpx - folds;
  const sizes = effSizes(node);
  for (let i = 0; i < node.children.length; i++){
    const kw = row ? (sizes[i] / 100) * availW : availW;
    const kh = row ? availH : (sizes[i] / 100) * availH;
    const hit = regionSize(node.children[i], target, kw, kh);
    if (hit) return hit;
  }
  return null;
}

/** The block's shape on the board — the grid is built to match it. */
function blockAspect(block){
  for (const side of ['front','back']){
    const r = regionSize(layout[side], block, CONFIG.board.w, CONFIG.board.h);
    if (r && r.h > 0) return r.w / r.h;
  }
  return 1;
}

/* Row counts come from the block's shape; splitEven — lifted verbatim from
   grid-reorder.html — then spreads the cells across those rows as evenly as
   possible. Combined with flex:1 cards this guarantees a full rectangle for
   any n, instead of dm-block-zoom's requirement that cols divide n exactly. */
function splitEven(total, nRows){
  const base = Math.floor(total / nRows);
  const extra = total % nRows;
  return Array.from({length:nRows}, (_, i) => base + (i < extra ? 1 : 0));
}

function renderHead(){
  blockHead.innerHTML = '';
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);

  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = sh.masthead
    ? `${activeBlock.name}刊頭：`
    : `${activeBlock.name}（無刊頭）`;
  blockHead.appendChild(title);

  // 刊頭 width is fixed — it spans the block — so only height is editable
  if (sh.masthead){
    const fixedW = document.createElement('span');
    fixedW.className = 'mh-fixed';
    // 站在卡片旁邊時，寬度就是它分到的那一成，由中間那條縫決定
    const sideFr = sh.mhSide ? Math.max(.12, Math.min(.6, sh.mhSide.frac || .3)) : 0;
    fixedW.textContent = sh.mhSide
      ? (sh.mastheadW * sideFr).toFixed(1)
      : sh.mastheadW;
    fixedW.title = sh.mhSide
      ? '刊頭寬度：拖版面中間那條縫調整'
      : '刊頭寬度固定為版位寬度，不可調整';
    blockHead.appendChild(fixedW);

    const x = document.createElement('span');
    x.className = 'mh-x-sep';
    x.textContent = '×';
    blockHead.appendChild(x);

    // the block's own height in cm caps how tall the 刊頭 may be
    const blockHcm = sh.mastheadW / blockAspect(activeBlock);
    const maxH = Math.round(blockHcm * CONFIG.mastheadMaxFrac * 10) / 10;

    const inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'mh-num';
    inp.min = '1'; inp.max = String(maxH); inp.step = '0.5';
    inp.value = sh.mhSide ? Math.round(blockHcm * 10) / 10 : sh.mastheadH;
    // 站在卡片旁邊時高度就是版位的高，不是這裡能決定的
    inp.disabled = sh.confirmed || !!sh.mhSide;
    inp.title = `1 – ${maxH} cm（版位高 ${blockHcm.toFixed(1)}cm）`;
    const apply = () => {
      const v = parseFloat(inp.value);
      if (!isFinite(v) || v <= 0){ inp.value = sh.mastheadH; return; }
      sh.mastheadH = Math.min(maxH, Math.round(v * 10) / 10);
      inp.value = sh.mastheadH;
      renderHead();
      renderGrid(activeBlock);                   // 刊頭 height re-flows the grid
      commitAction();
    };
    inp.addEventListener('change', apply);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    blockHead.appendChild(inp);

    const cm = document.createElement('span');
    cm.className = 'sub';
    cm.textContent = 'cm';
    blockHead.appendChild(cm);
  }

  const sub = document.createElement('span');
  sub.className = 'sub';
  sub.textContent = `${totalCount(activeBlock)} 支`;
  blockHead.appendChild(sub);

  /* 這個版位歸哪位 PM：設計指派，PM 那邊就只會看到自己的版位。
     沒指派的版位每位 PM 都看得到 —— 漏掉比重複更麻煩。 */
  if (activeMode === 'design'){
    const who = document.createElement('select');
    who.className = 'pm-of';
    who.title = '這個版位交給哪位 PM';
    who.innerHTML = '<option value="">未指派（大家都看得到）</option>' +
      PMS.map(p => `<option value="${p.id}"${sh.pm === p.id ? ' selected' : ''}>${p.name}</option>`).join('');
    who.addEventListener('change', () => {
      sh.pm = who.value || '';
      commitAction();
      renderMinimap();
      toast(sh.pm ? `這個版位交給 ${pmName(sh.pm)}` : '這個版位改成未指派', 'ok', 1800);
    });
    blockHead.appendChild(who);
  } else {
    const own = document.createElement('span');
    own.className = 'sub';
    own.textContent = sh.pm ? `負責：${pmName(sh.pm)}` : '未指派';
    blockHead.appendChild(own);
  }

  if (sh.confirmed){
    const badge = document.createElement('span');
    badge.className = 'lockBadge';
    badge.textContent = '🔒 列已鎖定・可輸入品名・可用搬移工具互換格子';
    blockHead.appendChild(badge);
  } else if (!sh.masthead){
    const add = document.createElement('button');
    add.id = 'addMasthead';
    add.textContent = '＋刊頭';
    add.addEventListener('click', () => {
      sh.masthead = { image: null };
      sh.mhSide = null;                // 重新加的刊頭先當一條橫帶
      renderHead(); renderGrid(activeBlock);
      commitAction();
    });
    blockHead.appendChild(add);
  }
}

/* `editable` follows the lock: the row arrangement is settled first, and only
   then is the sheet opened for copy. Typed text keeps its typography either
   way, so unlocking to re-arrange never makes the existing copy jump size. */
function makeCard(cell, confirmed){
  const el = document.createElement('div');
  /* PM 在這一格動過手（挑了貨、或留了話）＝設計在 落版 就看得到「已填寫」，
     不必切到 拼板 一格一格點開來確認。這是交接的反方向：
     confirmed 是設計交給 PM，這個是 PM 交回來的回音。 */
  const pmFilled = !!pickedOf(cell).length || !!notesOf(cell).length;
  el.className = 'cell copy' + (confirmed ? ' editable' : '')
                             + (pmFilled ? ' pm-filled' : '')
                             + (cell.gi === 1 ? ' g2' : '');   // dm-block-zoom .sq.g2
  el.dataset.cellId = cell.id;
  el.dataset.gi = cell.gi;             // 拼板要靠它認出這一格是哪個品類
  el.textContent = cell.text || '';

  if (!confirmed) return el;           // look, but do not type

  el.contentEditable = 'true';
  el.spellcheck = false;
  // write straight to state; never re-render here or the caret is lost
  el.addEventListener('input', () => {
    cell.text = el.textContent;
    markDirty();                       // saved, but not yet a history step
  });
  /* One history step per field, not per keystroke — PS records "輸入文字",
     not each letter. The blur is the commit. */
  let entry = cell.text || '';
  el.addEventListener('focus', () => { entry = cell.text || ''; });
  el.addEventListener('blur', () => { if ((cell.text || '') !== entry) commitAction(); });

  /* Tab / Enter walk the grid like a spreadsheet, which is how these get
     filled in — one card after another, never with the mouse. */
  el.addEventListener('keydown', e => {
    if (e.key !== 'Tab' && e.key !== 'Enter') return;
    e.preventDefault();
    const all = [...boardEl.querySelectorAll('.cell')];
    const at = all.indexOf(el);
    const to = all[at + (e.shiftKey ? -1 : 1)];
    if (to){ to.focus(); placeCaretAtEnd(to); }
    else el.blur();                    // past the last card: commit and stop
  });
  return el;
}

/** Focus lands at the start otherwise, so typing would prepend. */
function placeCaretAtEnd(el){
  const r = document.createRange();
  r.selectNodeContents(el); r.collapse(false);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}

/* Everything renderGrid needs to know about the finished sheet, with no DOM
   writes — so the same numbers can either build the board or just re-size the
   board that is already there. */
function sheetMetrics(block){
  const main = sheetMainEl;
  const sh = sheetOf(block);

  /* ---- shape the grid like the block's segment on the minimap ----
     The 刊頭 spans the block's full width, so that width IS the block's real
     width in cm and is not editable. Its editable height therefore eats a
     share of the block's height, and the cell grid gets whatever is left —
     which is why changing 刊頭 height re-flows the grid. */
  const n = sh.cells.length;
  const aspect = blockAspect(block);              // whole block, w/h
  const blockHcm = sh.mastheadW / aspect;         // block height in cm
  /* 刊頭在旁邊時，它吃掉的是寬度不是高度：兩邊都是滿高，所以卡片那一塊變窄、
     變高，列數自己重算。版位整體的形狀一步都不動。 */
  const side = (sh.masthead && sh.mhSide) ? sh.mhSide : null;
  const sideFrac = side ? Math.max(.12, Math.min(.6, side.frac || .3)) : 0;
  const mhFrac = (sh.masthead && !side)
    ? Math.min(CONFIG.mastheadMaxFrac, sh.mastheadH / blockHcm)
    : 0;

  // cells occupy the block minus the 刊頭 band (or minus its column), so they
  // are laid out to THAT shape, not the whole block's
  const cellAspect = side ? aspect * (1 - sideFrac) : aspect / (1 - mhFrac);

  /* clientWidth/Height 是含內距的，而那圈內距現在是刻意留的空地（可以把任何一格
     拖到畫面中間）。版面該有多大要看「真正看得到的那一塊」，所以先扣掉。 */
  const cs = getComputedStyle(main);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = Math.max(320, main.clientWidth - padX - 12);
  const availH = Math.max(240, main.clientHeight - padY - blockHead.offsetHeight - 34);

  /* Row count from the shape, then grid-reorder.html's splitEven spreads the
     cells across those rows as evenly as possible. Every row is flex-filled to
     the full width, so the block always reads as a solid rectangle — n never
     has to divide evenly, and there is no stub row (20 -> 7/7/6, not 8/8/4). */
  let nRows = Math.max(1, Math.round(Math.sqrt(n / cellAspect)));
  // never so many per row that cards fall under the legibility floor
  const maxPerRow = Math.max(1, Math.floor((availW - 14) / (CONFIG.minCellW + ROW_GAP)));
  nRows = Math.min(n, Math.max(nRows, Math.ceil(n / maxPerRow)));
  /* Once a row has been dragged, the split the user was looking at IS the
     arrangement — re-deriving it here would silently re-flow the cells and
     undo the drag on the next render (confirming, resizing, zooming). */
  const frozen = sh.rows && sh.rows.reduce((a, b) => a + b, 0) === n ? sh.rows : null;
  const counts = frozen || splitEven(n, nRows);
  nRows = counts.length;                 // row heights follow the actual split

  const widestRow = Math.max(...counts);

  // Fill the pane's width and let the aspect decide the height — a tall block
  // scrolls vertically rather than shrinking to fit the viewport.
  let gridW = availW;
  // Guard only the pathological case (a very tall, narrow region), where full
  // width would produce an absurdly long column.
  const maxH = availH * CONFIG.maxGridHeightFactor;
  if (gridW / aspect > maxH) gridW = maxH * aspect;
  // never squeeze cards below the legibility floor — if the pane is too
  // narrow for that, the grid overflows and #sheetMain scrolls sideways
  gridW = Math.max(gridW, widestRow * CONFIG.minCellW + 14 + widestRow * ROW_GAP);

  // split the block's total height between the 刊頭 band and the cell rows
  const totalH = gridW / aspect;
  const mastheadPx = (sh.masthead && !side)
    ? Math.max(CONFIG.mastheadMinH, totalH * mhFrac)
    : 0;
  const cellAreaH = totalH - mastheadPx - ((sh.masthead && !side) ? ROW_GAP : 0);
  // subtract the inter-row gaps first, so the finished box matches the
  // region's aspect exactly rather than being a few % tall
  let rowH = Math.max(CONFIG.minRowH, (cellAreaH - ROW_GAP * (nRows - 1)) / nRows);
  let mhPx = mastheadPx;

  // 縮放 tool: scale the finished layout uniformly. Applied last so it can go
  // below the legibility floors on purpose — the floors size the 100% view.
  if (sheetZoom !== 1){
    gridW *= sheetZoom; rowH *= sheetZoom; mhPx *= sheetZoom;
  }

  return {
    sh, counts, gridW, rowH, mhPx, blockHcm, totalH: totalH * sheetZoom,
    /* 卡片那一疊實際有多高。列高有下限（太扁就看不清楚），碰到下限時這一疊
       會比版位本身還高 —— 旁邊那根刊頭要跟的是這個數字，不是理論高度，
       不然它會比卡片矮一截。 */
    stackH: rowH * counts.length + ROW_GAP * (counts.length - 1),
    // 旁邊那根柱子：哪一邊、佔多寬（含間隙前的實寬）
    side: side ? { at: side.side === 'left' ? 'left' : 'right',
                   frac: sideFrac, w: gridW * sideFrac } : null,
    mhAt: (sh.masthead && !side) ? Math.min(sh.mastheadRow || 0, counts.length) : -1,
    // px the 刊頭 box gains per cm of length, so the drag maps 1:1 to the field
    pxPerCm: (totalH * sheetZoom) / blockHcm,
    maxHcm: blockHcm * CONFIG.mastheadMaxFrac
  };
}

/* What the board is currently showing, structurally: which cards, in what
   order, split how, with the 刊頭 where — and whether the sheet is locked,
   because that decides whether the cards are built editable. Zoom and pane
   size are deliberately absent; those only change sizes, which is the cheap
   path below. */
function sheetSig(m){
  return m.counts.join(',') + '|' + m.mhAt +
         '|' + (m.side ? 'S' + m.side.at : '-') +
         '|' + (m.sh.confirmed ? 'L' : 'u') + '|' +
         (m.sh.masthead ? (m.sh.masthead.image ? 'img' : 'box') : '-') + '|' +
         m.sh.cells.map(c => c.id).join(',');
}

/* PM 動過沒有，是在別的分頁改的（拼板 挑貨、貼便利貼）—— 那些都不會動到
   sheetSig，因為版面的結構真的沒變，所以格子不會重建。既然不重建，這個記號
   就得在「只調大小」這一趟自己更新，不然它永遠停在上次重建時的樣子。 */
function syncPmFilled(sh){
  const by = new Map((sh.cells || []).map(c => [String(c.id), c]));
  boardEl.querySelectorAll('.cell').forEach(el => {
    const c = by.get(el.dataset.cellId);
    if (!c) return;
    el.classList.toggle('pm-filled', !!pickedOf(c).length || !!notesOf(c).length);
  });
}

/** Size-only pass: no DOM is created, so focus, caret and selection survive. */
function layoutGrid(m){
  syncPmFilled(m.sh);
  boardEl.style.setProperty('--z', sheetZoom);   // card type scales with it
  boardEl.style.width = m.gridW + 'px';
  sizeSideMasthead(m);
  for (const row of boardEl.children){
    if (!row.classList.contains('row')) continue;
    row.style.height = (row.classList.contains('masthead-row') ? m.mhPx : m.rowH) + 'px';
  }
  // the empty 刊頭 prints its own size, so it has to follow a live edge drag
  paintMhLabel(m);
}

/** 旁邊那根刊頭：讓出卡片那半邊的寬度，自己拉到滿高，縫也跟著站好。 */
function sizeSideMasthead(m){
  const left = m.side && m.side.at === 'left';
  boardEl.style.paddingLeft  = (m.side && left)  ? m.side.w + 'px' : '';
  boardEl.style.paddingRight = (m.side && !left) ? m.side.w + 'px' : '';

  const mh = boardEl.querySelector('.masthead.side');
  if (!m.side || !mh) return;
  const w = Math.max(20, m.side.w - ROW_GAP);
  mh.style.width = w + 'px';
  mh.style.height = Math.max(m.totalH, m.stackH) + 'px';   // 跟卡片一樣高
  mh.style.left  = left ? '0px' : '';
  mh.style.right = left ? '' : '0px';

}

/** 空刊頭上那行說明：寫上它現在的尺寸，框太小就把後半句收起來，
    絕不讓字被切一半。字級固定，不隨 縮放 起伏。 */
function paintMhLabel(m){
  const mh = boardEl.querySelector('.masthead:not(.hasimg)');
  const size = mh && mh.querySelector('.mh-size');
  if (!size) return;
  // 站在旁邊時：寬度是它分到的那一成，高度就是整個版位的高
  const w = m.side ? (m.sh.mastheadW * m.side.frac).toFixed(1) : m.sh.mastheadW;
  const h = m.side ? m.blockHcm.toFixed(1) : m.sh.mastheadH;
  size.textContent = `刊頭 ${w}×${h}cm`;
  /* 整句都要看得見：框放不下就把字縮到放得下為止，不再把後半句收起來。
     二分找最大的、還裝得下的比例 —— 直接一格一格縮太慢，而且字會抖。
     縮不下去就停在下限，寧可小也不要少一半的字。 */
  mh.classList.remove('tight');
  const fits = () => mh.scrollHeight <= mh.clientHeight + 1
                  && mh.scrollWidth  <= mh.clientWidth  + 1;
  mh.style.setProperty('--mh-fit', 1);
  if (!fits()){
    let lo = .25, hi = 1, best = .25;
    for (let i = 0; i < 9; i++){
      const mid = (lo + hi) / 2;
      mh.style.setProperty('--mh-fit', mid);
      if (fits()){ best = mid; lo = mid; } else hi = mid;
    }
    mh.style.setProperty('--mh-fit', best);
  }
}

function renderGrid(block){
  syncTools();                    // 搬移 comes and goes with the lock
  if (!block){
    boardEl.innerHTML = '<div class="sheet-empty">' + (activeMode === 'pm'
      ? '沒有你的版位<br><span class="sub">設計確認排列、而且指定給你之後，這裡才會出現東西</span>'
      : '← 從左邊選一個版位') + '</div>';
    boardSig = null;
    return;
  }
  const m = sheetMetrics(block);
  const sh = m.sh;
  boardEl.classList.toggle('locked', sh.confirmed);

  /* Zooming, resizing the pane and dragging the 刊頭 edge all leave the same
     cards in the same order — only the numbers move. Re-sizing in place skips
     rebuilding every card and, more importantly, does not blow away the card
     you are typing in. */
  const sig = sheetSig(m);
  if (sig === boardSig && boardEl.querySelector('.row')){
    layoutGrid(m);
    return;
  }
  boardSig = sig;

  // Emptying the board collapses the scroll container, which drops scrollTop
  // to 0 — so a rebuild after a drag would fling you back to the top. Hold
  // the position and put it back once the rows exist again.
  const main = sheetMainEl;
  const keepL = main.scrollLeft, keepT = main.scrollTop;

  const rows = [];
  let at = 0;
  m.counts.forEach(count => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.height = m.rowH + 'px';
    row.appendChild(makeGrip());
    // cards keep the stylesheet's flex:1 1 0, so the row always fills the
    // width whatever its count — that is what keeps the block rectangular
    sh.cells.slice(at, at + count).forEach(c => row.appendChild(makeCard(c, sh.confirmed)));
    at += count;
    rows.push(row);
  });
  // the masthead keeps whatever row REORDER last dragged it to
  if (m.mhAt >= 0){
    rows.splice(m.mhAt, 0, buildMastheadRow(sh, m.mhPx, m.pxPerCm, m.maxHcm));
  }

  // one reflow for the whole board instead of one per row
  const frag = document.createDocumentFragment();
  rows.forEach(r => frag.appendChild(r));
  // 刊頭在旁邊：它不是列，是壓在旁邊那一柱的一塊，外加中間那條縫
  if (m.side){
    const mh = buildMasthead(sh, m.pxPerCm, m.maxHcm);
    mh.classList.add('side', m.side.at === 'left' ? 'at-left' : 'at-right');
    // 直立時的把手：拉的是兩邊的比例，不是長度 —— 換一條，位置一樣在身上
    const old = mh.querySelector('.mh-grab');
    if (old) old.remove();
    const grab = document.createElement('div');
    grab.className = 'mh-grab v';
    grab.title = '拖曳調整刊頭與卡片各佔多少';
    grab.addEventListener('pointerdown', ev => {
      if (sh.confirmed){ rejectLocked(); return; }
      ev.preventDefault(); ev.stopPropagation();
      mhSplit = { startX: ev.clientX, startFrac: m.side.frac, sh,
                  at: m.side.at, w: m.gridW };
      document.body.classList.add('mh-splitting');
    });
    grab.addEventListener('click', ev => ev.stopPropagation());
    mh.appendChild(grab);

    // 站著的時候把手也站起來，貼在外側那一邊 —— 跟改比例那條各據一邊
    const move = document.createElement('div');
    move.className = 'mh-move v';
    move.textContent = '⋮⋮';
    move.title = '拖著它放到上／下／左／右，或點一下用選的';
    move.addEventListener('pointerdown', ev => startMhDrag(ev, sh));
    move.addEventListener('click', ev => ev.stopPropagation());
    mh.appendChild(move);

    frag.appendChild(mh);
  }
  frag.appendChild(dropLine);           // survives every rebuild
  boardEl.replaceChildren(frag);

  boardEl.style.setProperty('--z', sheetZoom);
  boardEl.style.width = m.gridW + 'px';
  sizeSideMasthead(m);
  paintMhLabel(m);

  main.scrollLeft = keepL;              // stay where the user was looking
  main.scrollTop  = keepT;
}

function makeGrip(){
  const g = document.createElement('div');
  g.className = 'grip';
  g.textContent = '⋮⋮';
  g.title = '拖曳整列調換順序';
  return g;
}

/* ==========================================================================
   MASTHEAD
   One oversized full-width cell. It is a normal row, so REORDER drags it into
   position like any other. ✕ deletes it, ＋刊頭 (header) puts it back.
   ========================================================================== */

/* Live drag state for the 刊頭 edge. Deliberately NOT using pointer capture:
   each move re-renders the grid, which destroys the handle element, so the
   listeners live on the document and survive the rebuild. */
let mhResize = null, mhFrame = 0;

document.addEventListener('pointermove', e => {
  if (!mhResize) return;
  const dCm = (e.clientY - mhResize.startY) / mhResize.pxPerCm;
  let v = mhResize.startH + dCm;
  v = Math.max(1, Math.min(mhResize.maxH, v));
  v = Math.round(v * 10) / 10;
  if (v === mhResize.sh.mastheadH) return;
  mhResize.sh.mastheadH = v;

  if (!mhFrame) mhFrame = requestAnimationFrame(() => {
    mhFrame = 0;
    // update the number field in place rather than rebuilding the header
    const inp = blockHead.querySelector('.mh-num');
    if (inp) inp.value = mhResize ? mhResize.sh.mastheadH : inp.value;
    renderGrid(activeBlock);
  });
});
function endMhResize(){
  if (!mhResize) return;
  if (mhFrame){ cancelAnimationFrame(mhFrame); mhFrame = 0; }
  const changed = mhResize.sh.mastheadH !== mhResize.startH;
  mhResize = null;
  document.body.classList.remove('mh-resizing');
  renderHead();                       // resync title/max/tooltip
  renderGrid(activeBlock);
  if (changed) commitAction();        // one step for the whole drag
}
document.addEventListener('pointerup', endMhResize);
document.addEventListener('pointercancel', endMhResize);

function buildMastheadRow(sh, heightPx, pxPerCm, maxHcm){
  const row = document.createElement('div');
  row.className = 'row masthead-row';
  // height is decided by renderGrid, as the 刊頭's cm share of the block
  row.style.height = heightPx + 'px';
  /* 刊頭的 ⋮⋮ 跟卡片列的 ⋮⋮ 站在同一條線上，但它不是「往上下搬一列」：
     一抓起來，版位上就畫出四個落點，拖到哪一塊就放到哪裡。 */
  const grab = document.createElement('div');
  grab.className = 'grip mh-move';
  grab.textContent = '⋮⋮';
  grab.title = '拖著它放到上／下／左／右，或點一下用選的';
  grab.addEventListener('pointerdown', ev => startMhDrag(ev, sh));
  grab.addEventListener('click', ev => ev.stopPropagation());
  row.appendChild(grab);
  row.appendChild(buildMasthead(sh, pxPerCm, maxHcm));
  return row;
}

/** 刊頭本體。 */
function buildMasthead(sh, pxPerCm, maxHcm){
  const mh = document.createElement('div');
  mh.className = 'masthead' + (sh.masthead.image ? ' hasimg' : '');
  mh.dataset.masthead = '1';

  if (sh.masthead.image){
    const img = document.createElement('img');
    img.src = sh.masthead.image;
    mh.appendChild(img);
  } else {
    const lab = document.createElement('span');
    lab.className = 'mh-label';
    lab.innerHTML = '<span class="mh-size"></span>' +
                    '<span class="mh-sub"> — 拖曳圖片到這裡，或點擊選擇檔案</span>';
    mh.appendChild(lab);
  }

  const x = document.createElement('button');
  x.className = 'mh-x';
  x.textContent = '✕';
  x.title = '刪除刊頭';
  x.addEventListener('click', ev => {
    ev.stopPropagation();
    if (sh.confirmed){ rejectLocked(); return; }
    sh.masthead = null;
    sh.mhSide = null;                  // 站哪裡的記錄跟著刊頭一起走
    renderHead(); renderGrid(activeBlock);
    commitAction();                    // deleting a 刊頭 must be undoable
    toast('已刪除刊頭　⌘/Ctrl+Z 可復原', 'info', 2600);
  });
  mh.appendChild(x);

  // click -> file picker
  mh.addEventListener('click', () => {
    if (sh.confirmed){ rejectLocked(); return; }
    mhFile.onchange = () => {
      const f = mhFile.files && mhFile.files[0];
      if (f) readImage(f, sh);
      mhFile.value = '';
    };
    mhFile.click();
  });

  // drag & drop
  ['dragenter','dragover'].forEach(t => mh.addEventListener(t, ev => {
    if (sh.confirmed) return;
    ev.preventDefault(); mh.classList.add('dropping');
  }));
  ['dragleave','drop'].forEach(t => mh.addEventListener(t, ev => {
    ev.preventDefault(); mh.classList.remove('dropping');
  }));
  mh.addEventListener('drop', ev => {
    if (sh.confirmed){ rejectLocked(); return; }
    const f = ev.dataTransfer && ev.dataTransfer.files[0];
    if (f && /^image\//.test(f.type)){ readImage(f, sh); return; }
    // a PDF or an .ai landing here is a mistake worth naming out loud
    if (f) flashReject(mh, '僅支援圖片');
  });

  // ---- pull the bottom edge to change 刊頭長度 ----
  const grab = document.createElement('div');
  grab.className = 'mh-grab';
  grab.title = '拖曳調整刊頭長度';
  grab.addEventListener('pointerdown', ev => {
    if (sh.confirmed){ rejectLocked(); return; }
    ev.preventDefault();
    ev.stopPropagation();             // don't start a row drag
    // startH doubles as the value Esc reverts to
    mhResize = { startY: ev.clientY, startH: sh.mastheadH, pxPerCm, maxH: maxHcm, sh };
    document.body.classList.add('mh-resizing');
  });
  // the handle sits on the masthead, whose click opens the file picker
  grab.addEventListener('click', ev => ev.stopPropagation());
  mh.appendChild(grab);
  return mh;
}

/* ---- 拿起刊頭，指一個位置放下 -------------------------------------------
   一張版位上刊頭只有四個去處：上、下、左、右。與其拖著它去瞄準，不如直接把
   那四個位置畫出來讓你點 —— 拖曳會失手，指一下不會。 */
let mhPlacing = false;

function mhWhereNow(sh){
  if (sh.mhSide) return sh.mhSide.side === 'left' ? 'left' : 'right';
  /* 卡片有幾列：sh.rows 要拖過列才會凍結，還沒拖過就是 null。以前這裡把 null
     當 0 列，於是「排在第 0 列前面」（＝最上面）被判成 >= 0 ＝ 最下面 ——
     刊頭明明在上面，落點卻標「現在在下面」。 */
  const rows = (sh.rows && sh.rows.length) || cardRows().length || 1;
  return (sh.mastheadRow || 0) >= rows ? 'bottom' : 'top';
}

function closeMhPlacer(){
  if (!mhPlacing) return;
  mhPlacing = false;
  if (mhDrag) mhDrag.hot = null;
  boardEl.classList.remove('placing');
  document.getElementById('sheetPane').classList.remove('placing');
  boardEl.querySelectorAll('.mh-zone').forEach(z => z.remove());
}

function openMhPlacer(){
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);
  if (!sh.masthead || sh.confirmed) return;
  closeMhPlacer();
  mhPlacing = true;
  boardEl.classList.add('placing');
  document.getElementById('sheetPane').classList.add('placing');   // 標題讓開
  const at = mhWhereNow(sh);
  /* 四塊站在版位「外面」的空地上，一塊都不壓到卡片：位置本來就是「相對這張版
     的哪一邊」，畫在版外面才看得懂，而且底下那張版全程看得見。 */
  const GAP = '12px';
  const ZONES = [
    { key:'top',    label:'上', css:{ left:'25%', right:'25%', bottom:`calc(100% + ${GAP})`, height:'52px' } },
    { key:'bottom', label:'下', css:{ left:'25%', right:'25%', top:`calc(100% + ${GAP})`,    height:'52px' } },
    { key:'left',   label:'左', css:{ right:`calc(100% + ${GAP})`, top:'25%', bottom:'25%', width:'58px' } },
    { key:'right',  label:'右', css:{ left:`calc(100% + ${GAP})`,  top:'25%', bottom:'25%', width:'58px' } }
  ];
  ZONES.forEach(z => {
    const el = document.createElement('div');
    el.className = 'mh-zone' + (z.key === at ? ' here' : '');
    el.dataset.zone = z.key;
    el.innerHTML = z.label + (z.key === at ? '<span class="now">（現在在這裡）</span>' : '');
    Object.assign(el.style, z.css);
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      placeMasthead(z.key);
    });
    boardEl.appendChild(el);
  });
  toast('刊頭要放哪裡？拖過去放手，或點一個位置（Esc 取消）', 'info', 2200);
}

/* ---- 拖著把手丟到落點上 ------------------------------------------------
   位置只有四個，所以拖曳不必瞄準座標，只要落在那四塊的其中一塊上。
   一抓起來就把四塊畫出來；沒有移動就當作「點一下」，四塊留在畫面上讓你選。 */
let mhDrag = null;

function startMhDrag(ev, sh){
  if (ev.button !== 0) return;
  if (sh && sh.confirmed){ rejectLocked(); return; }
  ev.preventDefault();
  ev.stopPropagation();               // 這不是搬一列，也不是拖畫面
  openMhPlacer();
  mhDrag = { x: ev.clientX, y: ev.clientY, moved: false, hot: null };
}

function hotZone(el){
  if (mhDrag.hot === el) return;
  if (mhDrag.hot) mhDrag.hot.classList.remove('hot');
  mhDrag.hot = el;
  if (el) el.classList.add('hot');
}

/* 位置只有四個，所以不必真的碰到那一塊 —— 拖到它附近就算數，不要叫人去瞄準。
   四塊的範圍放大之後會互相重疊，重疊的地方**就近的那一塊贏**：照 DOM 順序挑
   的話「上」會把中間整片通吃，明明比較靠近「左」也還是選到「上」。
   放大的只有判定範圍，畫出來的方塊沒有變 —— 看到的還是那四塊。 */
const ZONE_REACH = 90;
function nearestZone(x, y){
  let best = null, bestD = Infinity;
  boardEl.querySelectorAll('.mh-zone').forEach(el => {
    const r = el.getBoundingClientRect();
    if (x < r.left - ZONE_REACH || x > r.right  + ZONE_REACH ||
        y < r.top  - ZONE_REACH || y > r.bottom + ZONE_REACH) return;
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = el; }
  });
  return best;
}

document.addEventListener('pointermove', e => {
  if (!mhDrag) return;
  if (!mhDrag.moved){
    if (Math.abs(e.clientX - mhDrag.x) + Math.abs(e.clientY - mhDrag.y) < 4) return;
    mhDrag.moved = true;
  }
  hotZone(nearestZone(e.clientX, e.clientY));
});

function endMhDrag(){
  if (!mhDrag) return;
  const { moved, hot } = mhDrag;
  mhDrag = null;
  if (hot){ hot.classList.remove('hot'); placeMasthead(hot.dataset.zone); return; }
  // 拖出去又沒落在任何一塊上＝放棄；完全沒動＝改用點的，四塊就留著
  if (moved) closeMhPlacer();
}
document.addEventListener('pointerup', endMhDrag);
document.addEventListener('pointercancel', endMhDrag);

/** 放下去：上下是一條橫帶（差在排在第幾列），左右是站在卡片旁邊的一根柱子。 */
function placeMasthead(where){
  const sh = activeBlock && sheetOf(activeBlock);
  if (!sh || !sh.masthead) return;
  const was = mhWhereNow(sh);
  closeMhPlacer();
  if (where === was) return;

  if (where === 'left' || where === 'right'){
    sh.mhSide = { side: where, frac: (sh.mhSide && sh.mhSide.frac) || .3 };
  } else {
    sh.mhSide = null;
    // 上＝排在第一列前面；下＝排在最後（大一點的數字，renderGrid 會夾回列數）
    sh.mastheadRow = where === 'top' ? 0 : 999;
  }
  renderHead();
  boardSig = null;
  renderGrid(activeBlock);
  commitAction();
  toast(`刊頭放到${{ top:'上面', bottom:'下面', left:'左邊', right:'右邊' }[where]}了`, 'ok', 1800);
}

/* ---- 中間那條縫：左右拖，改兩邊各佔幾成 -------------------------------
   拖的時候卡片那一塊會跟著變窄或變寬，列數自己重算 —— 卡片永遠是一整塊，
   只是換個形狀去填滿它那半邊。 */
let mhSplit = null;

document.addEventListener('pointermove', e => {
  if (!mhSplit) return;
  const dx = (mhSplit.at === 'left' ? 1 : -1) * (e.clientX - mhSplit.startX);
  const frac = Math.max(.12, Math.min(.6, mhSplit.startFrac + dx / Math.max(1, mhSplit.w)));
  if (Math.abs(frac - (mhSplit.sh.mhSide.frac || 0)) < .004) return;
  mhSplit.sh.mhSide.frac = frac;
  mhSplit.sh.rows = null;              // 換寬度就換分列，凍住的那份要放掉
  renderGrid(activeBlock);
});

function endMhSplit(){
  if (!mhSplit) return;
  const changed = mhSplit.sh.mhSide.frac !== mhSplit.startFrac;
  mhSplit = null;
  document.body.classList.remove('mh-splitting');
  if (changed) commitAction();
}
document.addEventListener('pointerup', endMhSplit);
document.addEventListener('pointercancel', endMhSplit);

/* 刊頭要換位置一律走 ⤧ 那個四選一（openMhPlacer）：位置只有四個，是選的，
   不是拖的。拖曳留給真正連續的量 —— 橫帶的高度、柱子佔幾成。 */

function readImage(file, sh){
  const fr = new FileReader();
  fr.onload = () => {
    sh.masthead.image = fr.result;
    renderGrid(activeBlock);
    commitAction();
  };
  fr.readAsDataURL(file);
}

/* ---- feedback for input the sheet is refusing ---- */

/** Brief red flash + message on a drop zone that rejected what it was given. */
function flashReject(el, msg){
  const keep = el.classList.contains('hasimg') ? null : el.firstChild;
  const was = keep && keep.nodeType === 3 ? keep.nodeValue : null;
  el.classList.add('reject');
  if (was != null) keep.nodeValue = msg;
  toast(msg, 'warn', 1800);
  setTimeout(() => {
    el.classList.remove('reject');
    if (was != null && keep.isConnected) keep.nodeValue = was;
  }, 900);
}

/** The 版位 is confirmed, so this input is not going to be accepted — say so
    the way PS does with a locked layer, rather than doing nothing at all. */
/* Clicking a card before 確認 simply does nothing, which reads as a bug rather
   than a rule. Say why — but at most once every few seconds, or it turns into
   noise while the user is arranging rows. */
let explainedAt = 0;
function explainNotYetEditable(){
  const now = Date.now();
  if (now - explainedAt < 4000) return;
  explainedAt = now;
  toast('確認列排列後才能輸入品名', 'info', 2400);
}

let shakeTimer = 0;
function rejectLocked(){
  boardEl.classList.remove('shake');
  void boardEl.offsetWidth;                     // restart the animation
  boardEl.classList.add('shake');
  clearTimeout(shakeTimer);
  shakeTimer = setTimeout(() => boardEl.classList.remove('shake'), 500);
  toast('此版位已鎖定，請先解除鎖定', 'warn', 1800);
}

/* ==========================================================================
   REORDER
   Row drag is grid-reorder.html's mechanic: pointer capture, translateY
   follow, midpoint-swap while-loops, snap back on endDrag. One deviation —
   the demo assumes uniform rows and precomputes a single `step`; the masthead
   row is taller, so the threshold reads the neighbour's own height.
   Cell drag reuses the same idea, resolved by hit-testing.
   ========================================================================== */

let rowDrag = null;
let cellDrag = null;

/* ==========================================================================
   SLIDE (FLIP)
   Re-ordering happens by rewriting the DOM, and no CSS transition can animate
   that — the browser simply paints the new arrangement. So: measure where
   things were, let the layout land, then transform each element back to its
   old position and release it. The card travels instead of teleporting.
   Deliberately quick; this is feedback, not choreography.
   ========================================================================== */

const SLIDE_MS = 190;
const SLIDE_EASE = 'cubic-bezier(.22,.61,.36,1)';   // decelerate into place
const noMotion = !!(window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/** 版面要換一種排法時包在這裡：先記下每一塊在哪，換完再讓它們從舊位置滑過去。
    刊頭換位置已經不走這條路了（換位置時列高、格數同時在變，滑動追不上，
    看起來像壞掉）—— 留著給列與列之間那種「東西移過去了」的動作用。 */
function flipBoard(change){
  const was = new Map();
  boardEl.querySelectorAll('.cell').forEach(el =>
    was.set(el.dataset.cellId, el.getBoundingClientRect()));
  const mhWas = boardEl.querySelector('.masthead');
  if (mhWas) was.set('\u0000mh', mhWas.getBoundingClientRect());

  change();

  boardEl.querySelectorAll('.cell').forEach(el => {
    const b = was.get(el.dataset.cellId);
    if (!b) return;
    const a = el.getBoundingClientRect();
    slideFrom(el, b.left - a.left, b.top - a.top);
  });
  const mhNow = boardEl.querySelector('.masthead');
  const bm = was.get('\u0000mh');
  if (mhNow && bm){
    const a = mhNow.getBoundingClientRect();
    slideFrom(mhNow, bm.left - a.left, bm.top - a.top);
  }
}

/** The element is already at its new home — slide it in from (dx,dy) away. */
function slideFrom(el, dx, dy){
  if (noMotion || (!dx && !dy)) return;
  el.style.transition = 'none';
  el.style.transform = `translate(${dx}px, ${dy}px)`;
  requestAnimationFrame(() => {
    el.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
    el.style.transform = '';
    setTimeout(() => { el.style.transition = ''; }, SLIDE_MS + 40);
  });
}

/** Let go of an element that is currently translated, easing it back to rest. */
function slideHome(el){
  if (noMotion){ el.style.transform = ''; return; }
  el.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
  el.style.transform = '';
  setTimeout(() => { el.style.transition = ''; }, SLIDE_MS + 40);
}

/** Cut every animation short. A new gesture must measure where things ARE,
