<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計組・檔期 → 設計開檔</title>
<style>
  :root{
    --blue:#4a6fdc;
    --ink:#333a45;
    --muted:#7a8494;
    --bg:#f2f4f8;
    --card:#ffffff;
    --line:#e2e6ee;
    --amber-bg:#fff4d6; --amber:#c07f00;
    --rule:#98a0ae;
    --pink:#fbe3d8;            /* block fill, per slide A */
    --pink-rule:#d8b6a6;
    --green:#cdeeda; --green-rule:#5aa678; --green-ink:#2e7d52;
    --accent:#c0392b;          /* the red counts */
    --g2:#eef1f6; --g2-rule:#d6dde6;   /* dm-block-zoom two-tone group */
    /* ruler chrome, after 1排版切割.html (light palette to suit this app) */
    --ruler-w:30px;
    --ruler-bg:#eef1f6; --ruler-line:#d5dbe6;
    --ruler-tick:#9aa3b2; --ruler-label:#7a8494;
    --align:#8b3dff;           /* Canva-ish alignment guide */

    /* ---- 顏色代號：照「做什麼用」取名，不照「是什麼顏色」 --------------------
       之前顏色是一路寫下來的，光是「淡藍色的互動底」就有六個相近的值，
       「接近白的底」也有六個 —— 沒有人選過它們，它們只是長出來的。
       改皮膚、加深色模式、查為什麼這行字看不見，都是從這裡開始。
       規則：新的顏色一律先在這裡取個名字，不要再往下面塞 hex。 */
    --surface:#ffffff;         /* 卡片、面板、紙 */
    --surface-2:#fafbfd;       /* 次一層的底（欄位、內凹的區塊） */
    --surface-3:#f1f4fb;       /* 淺色底上的 hover */
    --line-strong:#c9d6e2;     /* 比 --line 明顯一點的分隔線 */
    --ink-strong:#101828;      /* 最黑的字（便利貼、標題強調） */
    --ink-dim:#4b5566;         /* 次一級的字 */
    --grip:#e7ebf3;            /* ⋮⋮ 這類把手的底 */
    --grip-hover:#d8deea;

    /* 藍色＝「你正在點的東西」：分頁、選取、放下去的位置。東西本身不用藍。 */
    --accent:#4a6fdc;          /* ＝ --blue，語意名 */
    --accent-strong:#3f61c6;   /* 按下去／hover 的深藍 */
    --accent-tint:#eef2fc;     /* 淡藍底 */
    --accent-tint-2:#e2e9fa;   /* 淡藍底的 hover */
    --accent-line:#ccd8f5;     /* 淡藍框 */
    --accent-ink:#cfd9f2;      /* 深色底上的藍字 */
    --accent-ink-strong:#2b3a5c;

    /* 三個狀態色。紅只用在「還沒處理／價格」，綠只用在「好了」，黃只用在「注意」 */
    --ok:#17663a; --ok-ink:#17663a; --ok-tint:#e6f6ea;
    --warn:#f5a623; --warn-line:#f0dcae; --warn-tint:#fff3e0;
    --danger:#d92d20; --danger-ink:#b42318; --danger-tint:#fdeceb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height: 80%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .app{height:100vh;display:flex;flex-direction:column;padding:16px 24px 10px;gap:11px;
       position:relative}

  /* ---- tab bar + toolbar ---- */
  .bar{display:flex;align-items:center;gap:12px;min-height:38px}
  .tab{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--accent-line);border-radius:999px;padding:7px 22px;
    background:var(--accent-tint);color:var(--blue);
  }
  .tab:hover{background:var(--accent-tint-2)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}

  .bar .right{margin-left:auto;display:flex;align-items:center;gap:16px}

  /* ---- 復原 / 重做 (步驟記錄) ---- */
  .hist{display:flex;gap:6px;margin-left:6px}
  .btn.icon{
    position:relative;padding:7px 13px 11px;font-size:17px;line-height:1;
    color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint);
  }
  /* same corner-key treatment as the tool rail, so the two read as one system */
  .btn.icon[data-key]::after{
    content:attr(data-key);position:absolute;right:3px;bottom:2px;
    font-size:8.5px;font-weight:800;line-height:1;opacity:.62;
  }
  .btn.icon:hover:not(:disabled){background:var(--accent-tint-2)}
  .btn.icon:disabled{opacity:.38;cursor:not-allowed;background:var(--card)}
  /* 鎖定鈕浮在畫面右邊、垂直置中：這是整個 落版 最後要做的那一件事，
     大一點、固定在同一個地方，不必每次去找它在哪。
     只有 落版 會出現，而 意見欄 是 拼板 才有的 —— 右邊這一帶不會撞到東西。 */
  #confirmBtn{
    position:fixed;right:26px;top:132px;
    z-index:60;white-space:nowrap;text-align:center;line-height:1.3;
    font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;
    border:2px solid var(--blue);border-radius:14px;padding:18px 26px;
    background:var(--blue);color:var(--surface);display:none;
    box-shadow:0 10px 28px rgba(0,0,0,.34);
    transition:background-color .13s ease,box-shadow .13s ease;
  }
  #confirmBtn .lk{display:block;font-size:30px;line-height:1;margin-bottom:7px}
  #confirmBtn:hover{background:var(--accent-strong);box-shadow:0 12px 32px rgba(0,0,0,.42)}
  #confirmBtn.is-confirmed{background:var(--surface);color:var(--green-ink);border-color:var(--green-rule)}

  /* 字級那一條：拼板 的左邊直條，長得跟 落版 的 #toolRail 一樣（同一個藍、同一個
     位置、同樣的直排標題）—— 兩頁的「對這個版位做的事」就站在同一個地方。
     沒選版位的時候整條收起來：沒有東西可以調。 */
  #typeWrap{
    display:none;flex:none;width:74px;margin:2px 18px 10px;border-radius:8px;
    background:var(--blue);color:var(--surface);
    flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;user-select:none;
  }
  #typeWrap.on{display:flex}
  /* 標籤在上、格子在下 —— 直條裡沒有橫的空間放「一價 [__]」 */
  #typeWrap .tw-n{display:flex;flex-direction:column;align-items:center;gap:3px;
                  font-size:11.5px;font-weight:800;color:var(--surface)}
  #typeWrap input{width:58px;padding:4px 5px;border-radius:6px;text-align:center;
                  border:1px solid rgba(255,255,255,.45);
                  background:rgba(255,255,255,.14);color:var(--surface);
                  font-family:inherit;font-size:12.5px;font-weight:800}
  #typeWrap input:focus{outline:none;border-color:var(--surface);background:rgba(255,255,255,.28)}
  /* 沒設過的那一格顯示 placeholder「自動」，要看得出來它是空的 */
  #typeWrap input::placeholder{color:rgba(255,255,255,.62);font-weight:700}
  #typeWrap #typeReset{margin-top:2px;padding:5px 9px;font-size:12px;
                       background:rgba(255,255,255,.14);color:var(--surface);
                       border:1px solid rgba(255,255,255,.45)}
  #typeWrap #typeReset:hover{background:rgba(255,255,255,.28)}

  .toggle{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{position:absolute;opacity:0;pointer-events:none}
  .track{width:42px;height:23px;border-radius:999px;background:#cfd6e3;position:relative;transition:background .16s}
  .track::after{
    content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
    background:var(--surface);box-shadow:0 1px 3px rgba(30,40,60,.3);transition:transform .16s;
  }
  .toggle input:checked + .track{background:var(--blue)}
  .toggle input:checked + .track::after{transform:translateX(19px)}

  /* ---- header banner ---- */
  /* 檔期名和進度只要看得到就好，不必佔一整條 */
  /* 檔期名站在分頁左邊，靠一條分隔線跟分頁分開 —— 不用底色，那一列才不會
     被兩塊顏色切成兩半。 */
  .banner{
    display:flex;align-items:baseline;gap:9px;flex:none;
    padding:2px 16px 2px 2px;margin-right:2px;border-right:1px solid var(--chrome-line);
  }
  .banner .nm{font-size:15.5px;font-weight:800;color:var(--ink)}
  .banner .rg{font-size:13px;font-weight:800;color:var(--amber)}

  /* ---- 檔期列表 (from design_team.html) ---- */
  /* ---- 身分列 (設計 / PM) — pinned to the top edge, pulls down on approach.
     It is fixed, so it costs the page no vertical space while hidden. ---- */
  .modebar{
    position:fixed;left:0;right:0;top:0;z-index:120;
    display:flex;align-items:center;gap:10px;
    background:var(--blue);padding:6px 16px;
    /* parked with a 7px sliver still showing, so the bar is never invisible */
    transform:translateY(calc(-100% + 7px));transition:transform .18s ease;
    box-shadow:0 3px 14px rgba(74,111,220,.28);
  }
  .modebar.show{transform:none}
  /* 檔期列表上沒有版面要讓位，身分列就一直停在那；.app 讓出等高的位置，
     標題和 匯入 才不會被壓在下面 */
  .modebar.pinned{transform:none}
  .app.bar-pinned{padding-top:52px}
  /* the sliver: a deeper blue than the bar so it reads as a deliberate edge */
  .modebar::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
    background:linear-gradient(#3355c9,#1f3ea6);transition:opacity .18s ease;
  }
  .modebar.show::after{opacity:0}
  /* a pale grabber on the sliver, saying the edge is something you can pull */
  .modebar .handle{
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:1;
    width:56px;height:3px;border-radius:2px;background:rgba(255,255,255,.75);
    transition:opacity .18s ease;
  }
  .modebar.show .handle{opacity:0}
  /* the back button lives on blue now, so it has to read as white-on-blue */
  .modebar .back{
    background:transparent;border-color:rgba(255,255,255,.5);color:var(--surface);
    padding:4px 12px;font-size:13px;
  }
  .modebar .back:hover{background:rgba(255,255,255,.16)}
  .modebar .seg{
    margin-left:auto;display:flex;
    border:1px solid rgba(255,255,255,.55);border-radius:999px;overflow:hidden;
  }
  .modebar .seg button{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:0;padding:5px 20px;background:transparent;color:var(--surface);
  }
  .modebar .seg button + button{border-left:1px solid rgba(255,255,255,.55)}
  .modebar .seg button:hover{background:rgba(255,255,255,.16)}
  .modebar .seg button.active{background:var(--surface);color:var(--blue)}
  /* 換 PM：每個 PM 管的品類不一樣，所以身分後面還要說是「哪一位」 */
  .modebar .pmpick{display:none;align-items:center;gap:6px;color:var(--surface);font-size:13px;font-weight:800}
  .modebar .pmpick.on{display:flex}
  .modebar .pmpick select{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:1px solid rgba(255,255,255,.55);border-radius:999px;
    padding:4px 10px;background:rgba(255,255,255,.12);color:var(--surface);
  }
  .modebar .pmpick select option{color:var(--ink)}
  .modebar .pmpick .mini{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;line-height:1;
    border:1px solid rgba(255,255,255,.55);border-radius:999px;
    padding:4px 9px;background:transparent;color:var(--surface);
  }
  .modebar .pmpick .mini:hover{background:rgba(255,255,255,.16)}

  .topbar{display:flex;align-items:center;gap:10px;flex:none}
  .topbar h1{font-size:22px;font-weight:800}
  .btn{
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;padding:7px 16px;
    background:var(--card);color:var(--ink);
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  /* 清空資料：測試用的東西，站在角落、講清楚它很危險，但不要搶匯入的位置 */
  .btn.danger{margin-left:auto;color:var(--danger-ink);border-color:#f0c2bd;background:var(--danger-tint)}
  .btn.danger:hover{background:#fbdad7}
  .btn.primary:hover{background:var(--accent-strong)}
  .btn.back{padding:6px 14px;font-size:13.5px;color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint)}
  .btn.back:hover{background:var(--accent-tint-2)}
  .btn.open{
    margin-left:14px;padding:6px 16px;font-size:13.5px;
    color:var(--surface);background:var(--blue);border-color:var(--blue);
  }
  .btn.open:hover{background:var(--accent-strong)}

  #view-plans{flex-direction:column}
  #planList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
  .plan-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;box-shadow:0 2px 8px rgba(30,40,60,.06);
  }
  .plan-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .plan-name{font-size:20px;font-weight:800}
  .pill{
    font-size:14px;font-weight:800;border:1px solid var(--line);border-radius:6px;
    padding:3px 10px;color:var(--muted);background:var(--surface-2);
  }
  .pill.tag{color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint)}
  .pill.count{color:var(--amber);border-color:var(--warn-line);background:var(--amber-bg)}
  .plan-out{margin-left:auto;font-size:16px;font-weight:800;color:var(--muted)}
  .plan-out b{color:var(--ink)}
  .stage-row{display:flex;gap:8px;flex-wrap:wrap}
  .stage-chip{
    min-width:86px;text-align:center;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px 7px;background:var(--surface-2);
  }
  .stage-chip .n{font-size:15px;font-weight:800;color:#5d6675}
  .stage-chip .d{font-size:13.5px;color:var(--muted);margin-top:2px}
  .stage-chip.done{background:var(--green-bg,var(--ok-tint));border-color:#cdeeda}
  .stage-chip.done .n,.stage-chip.done .d{color:#2e8b57}
  .stage-chip.now{background:var(--amber-bg);border-color:var(--warn-line);position:relative}
  .stage-chip.now .n,.stage-chip.now .d{color:var(--amber)}
  .stage-chip.now::after{
    content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;
    border-radius:50%;background:var(--warn);
  }
  .empty-hint{color:var(--muted);text-align:center;margin-top:60px;font-size:18px}
  #editorChrome{display:flex;flex-direction:column;gap:11px}

  /* ---- view panels ---- */
  .panel{flex:1;min-height:0;display:none}
  .panel.active{display:flex}
  #view-total{align-items:flex-start;justify-content:center;gap:34px;overflow:auto;padding-top:4px}
  /* 拼板：小地圖固定在左邊（不管在哪一層都看得到自己在哪），右邊換內容 */
  #view-board{padding-top:6px;gap:0;align-items:stretch}
  #boardSide{flex:none;display:flex}
  /* 同一欄兩種左邊：設計看小地圖，PM 看品類樹 */
  #boardSide.pm #sheetSide{display:none}
  #boardSide:not(.pm) #pmTree{display:none}
  #boardMain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  /* 浮在版面左上角，貼著左欄：白底小藥丸，壓在淺色畫布上才讀得清楚 */
  #markWrap{
    position:absolute;top:8px;left:10px;z-index:40;
    gap:8px;font-size:12.5px;color:var(--ink);
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px 5px 8px;box-shadow:0 3px 10px rgba(16,24,40,.14);
  }
  #markWrap .track{width:34px;height:19px}
  #markWrap .track::after{width:15px;height:15px}
  #markWrap input:checked + .track::after{transform:translateX(15px)}
  /* 總覽：借用 落版 的格子，只是這裡不編輯，純粹挑一格 */
  #boardOverview{flex:1;min-height:0;display:none;align-items:stretch}
  #boardOverview.on{display:flex}
  #boardOverview #toolRail{display:none}          /* 工具是 落版 的事 */
  /* 刊頭尺寸、鎖定狀態、怎麼輸入品名 — 那些是 落版 在處理的事，拼板 不必看 */
  #boardOverview #blockHead{display:none}
  /* 這一層不編輯版面：整張版關掉滑鼠，只把「格子」開回來當入口 */
  #boardOverview #sheetMain{pointer-events:none}
  /* 左右各留一整片空地：最邊邊那一格也能被拖到畫面中間來看，
     不必歪著頭看螢幕邊緣。空地只是捲動範圍，不影響版面本身。 */
  /* 拼板 也是同一套空地 */
  #boardOverview #sheetMain{padding:30vh 40%}
  /* 那兩片空地會把內容欄壓得很窄。版面自己有寬度不受影響，但刊頭那行標題會被
     擠成一個字一行 — 讓它不要斷行，寧可超出內容欄。 */
  /* 空地會把內容欄壓窄，標題那行不要跟著斷行 */
  #blockHead{white-space:nowrap;flex:none}
  #boardOverview .cell{pointer-events:auto;cursor:pointer;user-select:none;
    transition:outline-color .12s,background .12s,opacity .12s}
  /* 搬列用的 ⋮⋮ 是 落版 的工具：PM 不搬列，那條就不該在他眼前 */
  #boardOverview.pm .grip{display:none}
  /* 不歸這位 PM 管的格子：看得到位置，但不是他的活，點不進去 */
  #boardOverview .cell.dim{opacity:.26}
  #boardOverview .cell.locked{pointer-events:none}
  /* 滾輪縮放、按著拖曳平移：整片版面在手上，跟拼板那頁同一套手感 */
  #boardOverview{cursor:grab;user-select:none}
  #boardOverview.panning{cursor:grabbing}
  #boardOverview.panning .cell{cursor:grabbing}
  #boardOverview .cell:hover{outline:2px solid var(--blue);outline-offset:-2px;background:var(--accent-tint)}
  /* 那一格裡面跑的就是拼板本人（2cell-product-pick.html 的畫布模式），照這一格
     的大小把 540×420 整個縮進去。所以這不是縮圖，是同一塊畫布 —
     旁邊面板勾了什麼，這裡當場就長出來。
     isolate 讓卡片自己開一層，畫布 z-index:-1 壓在卡片底色之上、文字之下。 */
  #boardOverview .cell{position:relative;isolation:isolate}
  .ccanvas{
    position:absolute;inset:0;z-index:-1;width:100%;height:100%;
    border:0;background:transparent;pointer-events:none;
  }
  /* 正在拼的那一格，設計可以直接在版上搬東西；PM 只挑貨，不搬版 */
  #boardOverview:not(.pm) .cell.editing .ccanvas{pointer-events:auto}
  /* 從桌面拖一張圖進來的那幾秒：畫布整個浮上來收 drop。平常它 pointer-events:none
     又壓在卡片底下（z-index:-1），不先點進那一格根本收不到 —— 但拖圖換商品圖
     不該還要先點兩下，看到哪一格就丟哪一格。 */
  #boardOverview.filedrag .ccanvas{pointer-events:auto;z-index:1}
  /* 拼過的格子上，落版打的字預設收起來（那裡畫布才是主角），開了 顯示落版文字
     才回來，壓在畫布上，補一圈白邊才讀得清楚。
     還沒拼的格子沒有東西可看，字就是它唯一的身分，一直留著。 */
  #boardOverview .cell.filled{font-size:0}
  #boardOverview.words .cell.filled{
    font-size:calc(10px * var(--z));text-shadow:0 0 3px var(--surface),0 0 3px var(--surface);
  }
  /* 編輯那一格 = 貼在那一格右邊的一塊版面，不是另外開的視窗：它跟著版面一起
     捲動、一起平移，所以它永遠黏在那一格旁邊。擋住旁邊幾格沒關係。 */
  #boardStage{
    position:fixed;z-index:150;display:none;flex-direction:column;gap:6px;
    overscroll-behavior:contain;
    pointer-events:auto;                 /* 總覽把整張版關掉了，這塊要開回來 */
    background:var(--surface);border:2px solid var(--blue);border-radius:10px;
    box-shadow:0 6px 22px rgba(31,62,166,.18);padding:8px;
  }
  #boardStage.on{display:flex;animation:pop-in .14s ease-out both}
  @keyframes pop-in{from{opacity:0}to{opacity:1}}
  #boardStageBar{display:flex;align-items:center;gap:10px;flex:none;user-select:none}
  #boardWhich{font-size:14px;font-weight:800;color:var(--ink)}
  #boardWhich .sub{color:var(--muted);font-weight:800;margin-left:8px;font-size:12.5px}
  #boardStage .close{
    margin-left:auto;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);
    line-height:1;padding:5px 10px;
  }
  #boardStage .close:hover{background:var(--surface-2);color:var(--ink)}
  /* 面板開著的時候，被拼的那一格自己亮起來，兩邊才對得上 */
  #boardOverview .cell.editing{outline:3px solid var(--blue);outline-offset:-3px;background:var(--accent-tint)}
  #boardFrame{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

  /* ---- 標記／留言（貼紙欄 + 意見欄）------------------------------------------
     照 block-comment-demo / block-review-demo 那兩支的做法搬過來：貼紙是實體，
     用拖的貼到格子上；貼上去就是一則問題，右邊那欄像 Word 的註解欄一樣，
     一則一張卡，可以回覆、可以標成處理完。
     字一律大而粗、按鈕至少 48px：這是站在版子前面看的東西。 */
  /* 意見欄靠著畫面右邊站，從分頁列底下一路到底 —— 它蓋過上面那兩條，
     因為問題清單比檔期名重要。版面那邊讓出等寬的位置，不會被壓到。 */
  #boardRail{
    position:absolute;top:var(--rail-top,60px);right:0;bottom:0;z-index:60;
    width:var(--railw,340px);display:flex;flex-direction:column;gap:7px;
    background:var(--surface);border-left:2px solid var(--line);
    padding:10px 12px;overflow:visible;
    transition:width .14s ease;
  }
  #view-board{padding-right:calc(var(--railw,340px) + 10px)}
  .app.rail-mini{--railw:26px}
  #boardRail.mini{padding:10px 4px}
  /* 開著某一格的面板時，意見欄讓位，只留一條看得懂的邊：紅字就是還欠幾則。
     面板和意見欄輪流上場，畫面上永遠只有一個「右邊」。 */
  #boardRail.mini > *:not(.fold-bar){display:none}
  /* 書籤獨立撐滿整條欄位的高度，才會停在畫面的正中央 */
  #boardRail .fold-bar{position:absolute;left:0;top:0;bottom:0;width:0;align-self:auto}
  #railHead{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  #railTitle{font-size:14px;font-weight:800;color:var(--ink)}
  #railSub{font-size:11.5px;font-weight:800;color:var(--muted);width:100%}
  #railBack{
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:none;
    border:2px solid var(--blue);border-radius:9px;padding:5px 10px;
    background:var(--accent-tint);color:var(--blue);
  }
  #railBack.on{display:block}
  /* 類型篩選：一顆一種，數字是還沒處理的 */
  /* 分類按鈕一定排一列：擠一點沒關係，換行會把下面的問題擠掉 */
  #railLegend{display:flex;gap:5px;flex-wrap:nowrap;flex:none}
  .lg{
    flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    border:2px solid var(--line);border-radius:999px;padding:4px 5px;background:var(--surface);color:var(--ink-dim);
  }
  .lg:hover{border-color:var(--lc)}
  .lg.on{background:var(--lc);border-color:var(--lc);color:var(--ink-strong)}
  .lg.zero{opacity:.45}

  /* 貼紙欄：拖一張下去就是一則 */
  /* 三張貼紙一列，整疊一定看得到 —— 它是入口，不該被塞進一個小捲軸裡。
     上面那些字讓小一點就排得下，會捲的只有下面的問題清單。 */
  #stickTray{flex:none;overflow:visible;
             border:2px dashed var(--line);border-radius:12px;padding:6px}
  #stickTray .hint{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
  #stickRow{display:flex;gap:6px;flex-wrap:nowrap}
  /* 貼紙欄裡的也是便利貼：方的一疊，拿起來就往版面上貼 */
  .stick{
    position:relative;flex:1 1 0;min-width:0;aspect-ratio:1/1;
    font-family:inherit;font-size:13px;font-weight:800;
    cursor:grab;border:0;border-radius:1px;color:var(--ink-strong);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    user-select:none;
    background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(0,0,0,.06));
    box-shadow:1px 1px 0 rgba(0,0,0,.06), 3px 4px 9px rgba(16,24,40,.24);
    clip-path:polygon(0 0,100% 0,100% 82%,82% 100%,0 100%);
    transform:rotate(-1.5deg);transition:transform .1s;
  }
  .stick::after{
    content:"";position:absolute;right:0;bottom:0;width:18%;height:18%;
    background:linear-gradient(135deg,rgba(0,0,0,.18),rgba(0,0,0,.02));
  }
  .stick:nth-child(even){transform:rotate(1.5deg)}
  .stick .ico{font-size:21px;line-height:1}
  .stick:hover{transform:rotate(0deg) scale(1.03)}
  .stick:active{cursor:grabbing}
  .stick.armed{outline:3px solid var(--ink-strong);outline-offset:2px;transform:rotate(0deg)}
  #armHint{
    display:none;flex:none;font-size:13.5px;font-weight:800;color:#8a4b00;
    background:var(--warn-tint);border:2px solid var(--warn-line);border-radius:10px;padding:7px 9px;
  }
  #armHint.on{display:block}

  /* 意見欄：一則一張卡 */
  /* 問題清單是這一欄的主角：至少佔四分之三，其他東西自己讓 */
  #railList{
    flex:1 1 auto;min-height:0;overflow:auto;
    display:flex;flex-direction:column;gap:10px;
  }
  .icard{
    border:2px solid var(--line);border-left:10px solid var(--nc,#98a2b3);
    border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;
  }
  .icard:hover{background:var(--surface-2)}
  .icard.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,111,220,.22)}
  .icard.done{background:#f6f8fa}
  .icard .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .icard .who{font-size:15px;font-weight:800;color:var(--ink)}
  .icard .where{
    font-size:13px;font-weight:800;color:var(--blue);
    background:var(--accent-tint);border-radius:999px;padding:2px 9px;
  }
  .icard .state{
    margin-left:auto;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;
    background:var(--danger-tint);color:var(--danger-ink);
  }
  .icard.done .state{background:var(--ok-tint);color:var(--ok-ink)}
  .icard .kind{font-size:16px;font-weight:800;color:var(--nc,#374151);margin-top:6px;
    display:flex;align-items:center;gap:6px}
  .icard .kind .ico{font-size:20px;line-height:1}
  /* 人寫的字自己寫死顏色。意見欄站在深色的桌面上，卡片卻是白的 —— 不寫就會
     繼承桌面那套淺灰（#eaeef7），白卡片上幾乎看不見。 */
  .icard .body{font-size:17px;font-weight:700;line-height:1.5;margin-top:5px;
    color:var(--ink-strong);white-space:pre-wrap;word-break:break-word}
  .icard.done .body{text-decoration:line-through;color:var(--muted)}
  .icard .body.blank{color:var(--muted)}
  .icard .meta{font-size:13.5px;font-weight:800;color:var(--muted);margin-top:5px}
  .icard .replies{margin:9px 0 0 4px;padding-left:10px;border-left:4px solid var(--line);
    display:flex;flex-direction:column;gap:8px}
  .icard .reply .who{font-size:14px;font-weight:800;color:var(--blue)}
  .icard .reply .rtext{font-size:16px;font-weight:700;line-height:1.45;
    color:var(--ink-strong);white-space:pre-wrap}
  .icard .box{display:none;margin-top:10px}
  .icard.sel .box{display:block}
  .icard .box textarea{
    width:100%;font-family:inherit;font-size:16px;font-weight:700;line-height:1.4;
    border:2px solid var(--line);border-radius:9px;padding:9px 10px;resize:none;height:64px;
  }
  .icard .box textarea:focus{outline:none;border-color:var(--blue)}
  .icard .acts{display:flex;gap:8px;margin-top:8px}
  .icard .acts button{
    flex:1;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;min-height:48px;
    border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);
  }
  .icard .acts .send{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .icard .acts .ok{border-color:var(--ok-ink);color:var(--ok-ink)}
  .icard .acts .ok:hover{background:var(--ok-tint)}
  .icard .acts .del{border-color:var(--danger-ink);color:var(--danger-ink)}
  .icard .acts .del:hover{background:var(--danger-tint)}
  #railEmpty{font-size:17px;font-weight:800;color:var(--muted);text-align:center;padding:26px 8px}
  .icard .owned{
    font-size:14.5px;font-weight:800;color:#8a4b00;background:var(--warn-tint);
    border:2px solid var(--warn-line);border-radius:9px;padding:8px 10px;margin-bottom:8px;
  }

  /* ---- 格子上的貼紙：貼在放下去的那個位置，大到掃一眼就看得到 ---- */
  /* 貼紙就是便利貼：方的、微微歪一點、右下角有影子，像真的黏上去 */
  .cmk{
    position:absolute;z-index:3;
    /* 便利貼可以用手挪：拖它換位置，點它就是點那一則 */
    pointer-events:auto;cursor:grab;touch-action:none;
    /* 便利貼是貼在版面「某一個點」上的：它指著那一格裡的某個東西。所以放大版面
       看細節時，它得跟著長大，才還指得準；縮小時也跟著縮，才不會一張貼紙蓋掉
       整格。上下各留一個界限 —— 太小抓不住，太大就把版面蓋掉了。 */
    --zs:clamp(.55, var(--z,1), 1.7);
    width:30px;height:30px;border-radius:0;
    transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(var(--zs));
    display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:15px;font-weight:800;color:var(--ink-strong);
    /* 紙：左上受光、右下沉，中間有一點點紙的紋路 */
    background-image:
      linear-gradient(155deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.10) 42%,rgba(0,0,0,.09) 100%);
    /* 一張紙只黏得住上緣，下緣會微微翹起來 —— 影子從上到下越拉越開 */
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 1px 1px rgba(16,24,40,.14),
      2px 5px 10px rgba(16,24,40,.30);
    clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  /* 右下角折起來的那一小塊：斜邊旁邊是紙的背面，比正面暗 */
  .cmk::after{
    content:"";position:absolute;right:0;bottom:0;width:26%;height:26%;
    clip-path:polygon(100% 0,100% 100%,0 100%);
    background:linear-gradient(135deg,rgba(0,0,0,.30),rgba(0,0,0,.06));
  }
  /* 黏在牆上的那條膠：上緣中間一小段半透明 */
  .cmk::before{
    content:"";position:absolute;left:28%;right:28%;top:-3px;height:7px;
    background:rgba(255,255,255,.42);
    box-shadow:0 1px 2px rgba(16,24,40,.16);
  }
  .cmk:hover{transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(calc(var(--zs) * 1.06))}
  .cmk.dragging{
    /* 拖的時候讓它自己「透明」，底下才問得出來現在在哪一格上面 */
    cursor:grabbing;z-index:9;transition:none;pointer-events:none;
    transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(calc(var(--zs) * 1.14));
    box-shadow:4px 12px 22px rgba(16,24,40,.38);
  }
  /* 角落那一個字＝誰貼的。壓在紙的左下角，不擋中間那個圖示 */
  .cmk-who{
    position:absolute;left:2px;bottom:1px;font-size:8.5px;font-weight:800;line-height:1;
    color:rgba(16,24,40,.6);font-style:normal;pointer-events:none;
  }
  /* 別人的便利貼：看得到、點得開，但搬不動 */
  .cmk.theirs{cursor:pointer}
  .cmk.done{opacity:.4}
  .cmk.sel{outline:3px solid var(--ink-strong);outline-offset:1px}
  /* 格子本身 overflow:hidden，而且最邊上那排格子外面就是版面邊界 —
     所以這顆數字貼在格子「裡面」的角落，不掛在外面，才不會被切掉。 */
  .cnb{
    position:absolute;right:3px;top:3px;z-index:4;pointer-events:none;
    /* 跟便利貼同一套：大小是固定的，縮放走 transform，數字才不會抖。
       只往下縮、不往上長：版面縮小它跟著縮，放大時它就停在原本大小 ——
       它是一個提示，不是版面的一部分，湊近看不該變成一顆紅球。 */
    transform:scale(min(1, var(--z,1)));transform-origin:100% 0;
    min-width:20px;height:20px;padding:0 5px;border-radius:999px;
    background:var(--danger);color:var(--surface);font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--surface);box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  #boardOverview.nomarks .cmk,#boardOverview.nomarks .cnb{display:none}
  /* 拖著貼紙經過時，那一格自己站出來 */
  #boardOverview .cell.drop{outline:4px solid var(--warn);outline-offset:-4px;background:#fff6e6}
  #boardOverview.arming .cell{cursor:copy}
  /* 意見欄點到某一格：其他格子讓開 */
  #boardOverview .cell.focus{outline:4px solid var(--blue);outline-offset:-4px}
  #boardOverview.focusing .cell:not(.focus){opacity:.35}

  /* ---- PM 的左欄：不是小地圖，是「這個檔期有哪些品類」 ---- */
  #pmTree{
    position:relative;width:230px;flex:none;overflow:auto;padding-right:8px;
    border-right:1px solid var(--line);margin-right:10px;
    display:flex;flex-direction:column;transition:width .14s ease;
  }
  #pmTree .pt-root{
    font-size:14.5px;font-weight:800;color:var(--ink);
    padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;
  }
  #pmTree .pt-root .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  #pmTree .pt-type{
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:5px 6px;border-radius:7px;font-size:13.5px;font-weight:800;color:var(--ink);
  }
  #pmTree .pt-type:hover{background:var(--surface-3)}
  #pmTree .pt-type.open{background:var(--accent-tint);color:var(--blue)}
  #pmTree .pt-type .caret{font-size:10px;color:var(--muted);width:10px;flex:none}
  #pmTree .pt-type .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pmTree .pt-type .n{font-size:12px;color:var(--muted);font-weight:800}
  #pmTree .pt-kids{display:none;margin:2px 0 6px 16px}
  #pmTree .pt-type.open + .pt-kids{display:block}
  #pmTree .pt-blk{
    display:flex;align-items:center;gap:6px;cursor:pointer;
    padding:4px 8px;border-radius:6px;font-size:13px;color:var(--ink-dim);
  }
  #pmTree .pt-blk:hover{background:var(--surface-3)}
  #pmTree .pt-blk.active{background:var(--blue);color:var(--surface)}
  #pmTree .pt-blk .n{margin-left:auto;font-size:11.5px;font-weight:800;opacity:.85}
  #pmTree .pt-sep{
    font-size:11.5px;font-weight:800;color:var(--muted);
    margin:10px 4px 4px;padding-top:8px;border-top:1px dashed var(--line);
  }
  #pmTree .pt-mine{opacity:1}
  #pmTree .pt-other{opacity:.62}

  /* ================= 總體 : board + rulers ================= */
  .board{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .board h3{font-size:16px;font-weight:800;color:var(--muted)}

  /* ruler chrome sits OUTSIDE the workspace in a grid, per 1排版切割.html:
     corner + top strip + left strip, all fixed size regardless of board scale */
  .board-grid{display:grid;grid-template-columns:var(--ruler-w) auto;grid-template-rows:var(--ruler-w) auto}
  .ruler-corner{
    grid-column:1;grid-row:1;background:var(--ruler-bg);
    border-right:1px solid var(--ruler-line);border-bottom:1px solid var(--ruler-line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--muted);user-select:none;
  }
  .ruler-top,.ruler-left{position:relative;overflow:hidden;background:var(--ruler-bg)}
  .ruler-top{grid-column:2;grid-row:1;border-bottom:1px solid var(--ruler-line)}
  .ruler-left{grid-column:1;grid-row:2;border-right:1px solid var(--ruler-line)}

  .tick{position:absolute;background:var(--ruler-tick)}
  .tick.hi{background:var(--blue);box-shadow:0 0 0 .5px var(--blue)}
  .tick-label{position:absolute;color:var(--ruler-label);font-size:10px;font-weight:800;user-select:none;white-space:nowrap}
  .tick-label.hi{color:var(--blue)}
  .ruler-cap{position:absolute;font-size:11px;font-weight:800;color:var(--muted)}

  /* live cursor marker + value badge (1排版切割.html .ruler-marker) */
  .ruler-marker{position:absolute;background:var(--blue);z-index:100;pointer-events:none;display:none}
  .ruler-marker.on{display:block}
  .ruler-marker-x{top:0;bottom:0;width:1px}
  .ruler-marker-y{left:0;right:0;height:1px}
  .ruler-marker::after{
    content:attr(data-val);position:absolute;background:var(--blue);color:var(--surface);
    font-size:10px;font-weight:800;padding:1px 5px;border-radius:3px;white-space:nowrap;
  }
  .ruler-marker-x::after{top:2px;left:3px}
  .ruler-marker-y::after{left:2px;top:3px}

  .board-ws{grid-column:2;grid-row:2;position:relative;background:var(--surface);box-shadow:0 0 0 1px var(--rule);overflow:hidden}

  .split-container{display:flex;width:100%;height:100%;overflow:hidden}
  .fold{width:2px;background:#5b6472;flex:none}
  .window-node{
    box-sizing:border-box;border:1px solid var(--line-strong);position:relative;
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .window-node.unowned{background:#e9ecf2;border-color:#cdd4e0}
  .window-node.handed{background:#dff0e5;border-color:var(--green-rule)}
  .window-node.unowned .region-label div,
  .window-node.unowned .region-label .cnt{color:#98a1b2}
  .window-node.handed .region-label div,
  .window-node.handed .region-label .cnt{color:var(--green-ink)}
  .region-label{pointer-events:none;text-align:center;padding:2px}
  .region-label div{font-weight:800;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  /* 支數用紅的，跟小地圖同一套：數量是「還有多少要處理」，不是可以點的東西 */
  .region-label .cnt{color:var(--danger-ink)}

  /* z-index keeps the bar (and its fat hit area) above BOTH siblings —
     without it the following sibling paints over half the grab zone */
  .resizer{background:rgba(90,60,40,.55);flex:none;position:relative;touch-action:none;z-index:3}
  .resizer-vertical{width:1px;cursor:col-resize}
  .resizer-horizontal{height:1px;cursor:row-resize}
  .resizer::before{content:"";position:absolute;inset:0}
  /* ±7px grab zone — a 1px line is far too fine a target to hunt for */
  .resizer-vertical::before{left:-7px;right:-7px}
  .resizer-horizontal::before{top:-7px;bottom:-7px}
  .resizer.dragging{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}

  .guide{position:absolute;background:var(--blue);opacity:0;pointer-events:none;transition:opacity .1s;z-index:5}
  .guide.v{top:0;bottom:0;width:1px}
  .guide.h{left:0;right:0;height:1px}
  .guide.on{opacity:.85}
  /* Canva-style alignment guide: a distinct violet line, shown when the
     boundary lines up with ANOTHER divider rather than with the 尺 grid */
  .guide.obj{background:var(--align);box-shadow:0 0 0 .5px var(--align)}
  .guide.obj.v{width:2px}
  .guide.obj.h{height:2px}
  #tip.aligned{background:var(--align)}
  .ruler-marker.aligned{background:var(--align)}
  .ruler-marker.aligned::after{background:var(--align)}

  /* tool hint, after dm-block-zoom.html's #hint */
  #toolHint{
    flex:none;display:none;align-items:center;gap:9px;
    background:var(--accent-tint);border:1px solid var(--accent-line);border-left:5px solid var(--blue);
    color:var(--accent-ink-strong);font-size:13px;font-weight:800;letter-spacing:.02em;
    padding:5px 14px;border-radius:8px;
    box-shadow:0 2px 8px rgba(74,111,220,.14);
  }
  #toolHint .ico{
    flex:none;width:24px;height:24px;border-radius:6px;background:var(--blue);color:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  #toolHint b{color:var(--blue)}
  /* Three zones, always in the same place: which tool ・ the one thing it
     does ・ the couple of keys worth knowing. Reading it should take a
     glance, not a parse. */
  #toolHint .hint-name{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    color:var(--blue);font-weight:800;
    padding-right:12px;border-right:1px solid var(--accent-line);
  }
  #toolHint .hint-main{font-weight:800;color:var(--accent-ink-strong)}
  #toolHint .hint-keys{
    margin-left:auto;display:flex;align-items:center;gap:14px;
    font-size:13px;font-weight:800;color:#6d7c9e;white-space:nowrap;
  }
  #toolHint .hint-keys b{color:var(--blue);font-variant-numeric:tabular-nums}
  #toolHint kbd{
    font-family:inherit;font-size:11.5px;font-weight:800;line-height:1;
    background:var(--surface);color:var(--blue);border:1px solid var(--accent-line);
    border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin-right:5px;
  }
  #toolHint.pop{animation:hintPop .18s ease-out}
  @keyframes hintPop{from{transform:scale(.94);opacity:.45}to{transform:scale(1);opacity:1}}

  #tip{
    position:fixed;z-index:99;pointer-events:none;display:none;
    background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:800;
    padding:4px 9px;border-radius:6px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(30,40,60,.3);
  }
  #tip.snapped{background:var(--blue)}
  body.dragging-col,body.dragging-col *{cursor:col-resize !important}
  body.dragging-row,body.dragging-row *{cursor:row-resize !important}
  body.dragging *{user-select:none}

  /* ================= 落版 : shell ================= */
  #view-sheet{gap:0;align-items:stretch}

  /* --- minimap sidebar (adapted from dm-block-zoom.html #minimap) --- */
  /* Sized and weighted to dm-block-zoom.html's minimap: 13px/700 labels,
     1.5px block rules, a 2px page frame, and a FILLED active state (its
     .mini-blk.active) rather than a thin outline — tuned for legibility. */
  /* 兩邊的欄位都收得起來：版面要看大的時候，把它們推到旁邊去 */
  #sheetSide{
    position:relative;flex:none;width:270px;overflow-y:auto;padding:2px 14px 10px 2px;
    display:flex;flex-direction:column;gap:9px;border-right:1px solid var(--line);
    transition:width .14s ease;
  }
  #sheetSide.mini,#pmTree.mini{width:0;padding-left:0;padding-right:0;border-right:0}
  #sheetSide.mini > *,#pmTree.mini > *{display:none}

  /* 收合的把手：站在欄位外緣的正中間，凸出來一塊，像書籤一樣 —— 一眼就看得到，
     而且不管欄位裡有什麼、捲到哪裡，它都在同一個地方。 */
  .fold-bar{
    flex:none;width:0;position:relative;align-self:stretch;
  }
  .fold-tab{
    position:absolute;top:50%;transform:translateY(-50%);z-index:8;
    width:20px;height:74px;padding:0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;line-height:1;
    border:2px solid var(--line);background:var(--bg);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;
    box-shadow:2px 0 6px rgba(16,24,40,.12);
  }
  .fold-tab:hover{background:#e9edf6;border-color:var(--blue);color:var(--blue)}
  /* 這根書籤是用推的：左右拖＝把欄位推寬推窄，點一下＝整條收起來 */
  .fold-tab{cursor:ew-resize;touch-action:none}
  .fold-bar.no-push .fold-tab{cursor:pointer}
  .fold-bar.pushing .fold-tab{border-color:var(--blue);color:var(--blue)}
  /* 推的時候不要有寬度動畫，欄位才跟得上手 */
  .no-anim{transition:none !important}
  .fold-bar.at-left .fold-tab{left:0;border-radius:0 9px 9px 0;border-left:0}
  .fold-bar.at-right .fold-tab{right:0;border-radius:9px 0 0 9px;border-right:0;
                               box-shadow:-2px 0 6px rgba(16,24,40,.12)}
  .fold-tab .n{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    min-width:20px;padding:1px 5px;border-radius:999px;
    background:var(--danger);color:var(--surface);font-size:12px;font-weight:800;
  }
  .fold-tab .n.zero{display:none}
  .mini-label{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.08em}
  /* 270 的欄寬扣掉捲軸和內距，剩 252 — 版面比例照舊（350:248），高度跟著縮 */
  .mini-page{position:relative;width:252px;height:179px;border:2px solid var(--ink);background:var(--surface);flex:none}
  .mini-split{display:flex;width:100%;height:100%;overflow:hidden}
  .mini-fold{width:3px;background:#3d444f;flex:none}
/* 小地圖是一張進度表，不是裝飾：底色只講這一塊走到哪了。
   灰＝還沒人管　白＝設計手上　綠＝已交出給 PM。三個都不搶眼 ——
   整個畫面上最有顏色的東西應該是版面本身和貼在上面的便利貼。 */
  .mini-blk{
    border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.28;user-select:none;
    transition:background .12s,border-color .12s;padding:2px;
  }
  .mini-blk .cnt{color:var(--danger-ink);font-weight:800}
  .mini-blk:hover{background:var(--surface-3);border-color:var(--accent);color:var(--ink)}
  /* 還沒指派 PM：整塊灰掉，一眼看得出這一塊還沒有人管 */
  .mini-blk.unowned{background:#e9ecf2;border-color:#cdd4e0;color:#98a1b2}
  .mini-blk.unowned .cnt{color:#98a1b2}
  /* 選中：藍框，底色照舊 —— 換掉底色就看不出它本來是什麼狀態了 */
  .mini-blk.active{outline:3px solid var(--blue);outline-offset:-3px;
                   border-color:#2f4b96;z-index:2}
  /* 已交出給 PM（＝按了確認鎖定）：綠底，這一塊就不在設計手上了 */
  .mini-blk.confirmed{background:#dff0e5;border-color:var(--green-rule);color:var(--green-ink)}
  .mini-blk.confirmed .cnt{color:var(--green-ink)}
  /* confirmed AND selected: keep the green fill, ring it in blue */
  .mini-blk.active.confirmed{border-color:var(--green-rule)}

  /* --- 工具 rail --- */
  #toolRail{
    position:relative;                 /* 鎖定鈕貼著它的右邊站 */
    flex:none;width:58px;margin:2px 18px 10px;border-radius:8px;
    background:var(--blue);color:var(--surface);display:flex;flex-direction:column;align-items:center;
    gap:8px;padding:12px 0 10px;user-select:none;
  }
  .rail-title{
    font-size:16px;font-weight:800;letter-spacing:4px;
    writing-mode:vertical-rl;text-orientation:upright;margin-bottom:6px;
  }
  .tool{
    position:relative;
    width:40px;height:40px;border-radius:8px;font-family:inherit;font-size:18px;
    border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:var(--surface);
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  /* the 快捷鍵 tucked in the corner, PS-style — present but never competing
     with the glyph for attention */
  .tool[data-key]::after{
    content:attr(data-key);position:absolute;right:3px;bottom:2px;
    font-size:9px;font-weight:800;line-height:1;letter-spacing:0;opacity:.7;
  }
  .tool:hover{background:rgba(255,255,255,.28)}
  .tool.active{background:var(--surface);color:var(--blue);border-color:var(--surface);font-weight:800}
  .zoom-val{margin-top:auto;font-size:10.5px;font-weight:800;opacity:.92;font-variant-numeric:tabular-nums}

  /* --- main area --- */
  /* 四周都留一整片空地：不管是最邊邊還是最上面那一格，都能被拖到畫面正中間來看。
     空地只是捲動範圍，版面本身的大小是算出來的（見 sheetMetrics 扣掉內距那段）。 */
  #sheetMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto;
             padding:30vh 40%}
  /* 畫布這一塊：版面在裡面捲，標題貼在它的左上角不動。
     標題講的是「你在看哪一個版位」—— 它不是版面的一部分，所以不跟著版面捲，
     也不跟著縮放跑。 */
  #sheetPane{flex:1;min-width:0;min-height:0;position:relative;display:flex}
  /* 站在畫布正上方的中間：左上角是鎖定鈕的位置，兩個疊在一起會互相蓋掉。
     中間這個位置在任何縮放下都是同一個地方 —— 它釘在畫布上，不在版面上。 */
  #blockHead{
    color:var(--ink);              /* 紙上的字是黑的（它不在 #sheetMain 裡面） */
    position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);
    background:var(--bg);border-radius:8px;padding:3px 12px 5px;
  }
  #blockHead .title{font-size:19px;font-weight:800}
  #blockHead .sub{font-size:13.5px;color:var(--muted);font-weight:800}
  /* 這個版位歸誰：站在標題旁邊，因為它是這個版位的屬性，不是工具 */
  .pm-of{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:7px;padding:4px 8px;
    background:var(--surface);color:var(--ink);
  }
  .pm-of:hover{border-color:var(--blue)}
  .lockBadge{
    font-size:13px;font-weight:800;color:var(--green-ink);
    background:var(--green);border:1px solid var(--green-rule);border-radius:999px;padding:3px 12px;
  }
  .mh-num{
    font-family:inherit;font-size:14px;font-weight:800;width:68px;text-align:center;
    border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;background:var(--surface);color:var(--ink);
  }
  .mh-num:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .mh-num:disabled{background:var(--surface-3);color:var(--muted);cursor:not-allowed}
  .mh-x-sep{font-size:14px;font-weight:800;color:var(--muted)}
  /* fixed 刊頭 width: shown as plain text, styled like a disabled field */
  .mh-fixed{font-size:14px;font-weight:800;color:var(--muted);background:var(--surface-3);
    border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:default}
  #addMasthead{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:1px dashed var(--blue);border-radius:7px;padding:5px 12px;
    background:var(--accent-tint);color:var(--blue);
  }
  #addMasthead:hover{background:var(--accent-tint-2)}

  /* 版面本身：卡片相接成一塊完整的方塊，四周才留邊 */
  #board{display:flex;flex-direction:column;gap:var(--gap);margin:15px auto;
         position:relative;--z:1;--gap:0px}
  .row{position:relative;display:flex;gap:var(--gap);align-items:stretch}
  .row.dragging{cursor:grabbing;opacity:.85;z-index:5;overflow:visible}
  /* ⋮⋮ 是操作用的把手，不是版面的一部分 —— 留一點縫，讓卡片那一塊自己是完整的 */
  .grip{
    flex:none;width:14px;margin-right:6px;border-radius:4px;
    background:var(--grip);color:var(--muted);
    display:flex;align-items:center;justify-content:center;cursor:grab;
    font-size:10px;line-height:1;user-select:none;touch-action:none;
  }
  .grip:hover{background:var(--grip-hover);color:var(--ink)}
  /* 刊頭的把手：橫帶時就是左邊那條 ⋮⋮；站著時轉成直的貼在外側 */
  .mh-move.v{
    position:absolute;top:0;bottom:0;width:16px;z-index:6;
    background:var(--grip);color:var(--muted);cursor:grab;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;letter-spacing:2px;user-select:none;touch-action:none;
    writing-mode:vertical-rl;
  }
  .mh-move.v:hover{background:var(--grip-hover);color:var(--ink)}
  .masthead.side.at-left .mh-move.v{left:0}
  .masthead.side.at-right .mh-move.v{right:0}
  #board.locked .mh-move.v{display:none}
  /* 拖到某一塊落點上：那一塊自己亮起來，放手就是它 */
  .mh-zone.hot{background:var(--blue);color:var(--surface);border-style:solid}
  /* 挑位置的時候版位標題先淡掉：「上」那一塊就站在它的位置上 */
  #sheetPane.placing #blockHead{opacity:.12;pointer-events:none}

  /* product cards — .sq/.g2 two-tone carried over from dm-block-zoom.html */
  /* card type scaled up to dm-block-zoom.html's .sq baseline (10px) and its
     2px hover outline, so the labels stay readable at 8-to-10 columns */
  .cell{
    flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;
    padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:calc(10px * var(--z));line-height:1.3;text-align:center;overflow:hidden;
    touch-action:none;user-select:none;
    font-variant-numeric:tabular-nums;
    /* colour eases; transform does NOT — the FLIP slide sets its own inline
       transition and must not be slowed by a default here */
    transition:background-color .13s ease,border-color .13s ease;
  }
  .cell.g2{background:var(--g2);border-color:var(--g2-rule)}
  .cell:hover{outline:2px solid var(--blue);outline-offset:-1px;z-index:1}
  /* 相接處只留一條線：右邊和下面那一條交給隔壁去畫，不然邊界會變兩倍粗 */
  .row .cell + .cell{border-left:none}
  .row + .row .cell{border-top:none}
  .row.masthead-row + .row .cell{border-top:none}
  /* pointer-events:none so elementFromPoint sees the card UNDER the cursor,
     not the one being dragged — without it no drop target is ever found */
  .cell.cell-dragging{opacity:.5;pointer-events:none}
  /* the card a 交換 drag will trade places with */
  .cell.cell-target{outline:3px solid var(--blue);outline-offset:-3px;
                    background:#e8eeff;z-index:2}

  /* ---- move tool: centre = 交換, edge = 插入 ---- */
  .drop-line{
    position:absolute;width:3px;background:var(--blue);border-radius:2px;
    pointer-events:none;z-index:20;display:none;box-shadow:0 0 0 1px rgba(74,111,220,.35);
    /* glides between boundaries instead of teleporting; the first appearance
       suppresses this inline, or it would streak in from its last position */
    transition:left .12s ease-out,top .12s ease-out,height .12s ease-out;
  }

  /* cursors follow the selected tool */
  /* 看版：整片都是手，卡片也不例外 —— 這個工具碰不到版上的東西 */
  #sheetMain.tool-zoom,#sheetMain.tool-zoom .cell{cursor:grab}
  #sheetMain.tool-zoom.panning,#sheetMain.tool-zoom.panning *{cursor:grabbing !important}
  #sheetMain.tool-move .cell{cursor:grab}
  /* 輸入工具：卡片是拿來打字的；其他地方照樣是「可以拖畫面」的手 */
  #sheetMain.tool-select{cursor:grab}
  #sheetMain.tool-select .cell{cursor:default}
  #sheetMain.tool-select .cell.editable{cursor:text}
  /* 搬移、複製：空白處一樣拖得動畫面 */
  #sheetMain.tool-move,#sheetMain.tool-copy{cursor:grab}
  /* 整格複製：這個工具下不打字，點一格就是挑它 */
  #sheetMain.tool-copy .cell{cursor:copy;user-select:none}
  #sheetMain.tool-copy .cell.copy-sel{outline:3px solid var(--blue);outline-offset:-3px}
  /* 手上拿著的那一格：虛線一直留著，才知道等一下貼的是誰 */
  #sheetMain.tool-copy .cell.copy-src{outline:3px dashed var(--ok-ink);outline-offset:-3px}
  .cell.copy-flash{animation:cellFlash .35s ease-out}
  @keyframes cellFlash{from{background:#fff2b8}to{background:transparent}}

  /* masthead row */
  .row.masthead-row{gap:var(--gap)}
  .masthead{
    flex:1 1 0;min-width:0;position:relative;
    border:2px dashed #b9c6d6;border-radius:6px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-weight:800;text-align:center;overflow:hidden;
    /* 跟著縮放：這行字要看起來像「印在版上」的，不是浮在螢幕上的說明。
       所以縮小的時候它就該跟著變小、看不清楚 —— 要看就自己放大，
       跟看真正的印刷品一樣。（本來是固定 13px，2026-07 改掉的。）
       它自己折行去適應框，絕不被切一半。 */
    font-size:calc(13px * var(--z) * var(--mh-fit, 1));line-height:1.35;
    padding:8px 10px;
    white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  }
  /* 標籤自己是一塊，不當匿名的 flex item —— 盒子怎麼縮，它的字級都不受影響 */
  .masthead .mh-label{flex:0 1 auto;min-width:0;max-width:100%;font-weight:800}
  .masthead .mh-sub{display:inline}
  .masthead.hasimg{border-style:solid;border-color:var(--line-strong);background:var(--surface)}
  .masthead img{width:100%;height:100%;object-fit:contain;display:block}
  .masthead.dropping{border-color:var(--blue);background:var(--accent-tint);color:var(--blue)}
  /* pull the bottom edge to set 刊頭長度; mirrors the number field */
  .mh-grab{
    position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;z-index:4;
    display:flex;align-items:center;justify-content:center;
  }
  .mh-grab::after{
    content:"";width:46px;height:3px;border-radius:2px;background:rgba(74,111,220,.45);
  }
  .mh-grab:hover::after{background:var(--blue);height:4px;width:60px}
  #board.locked .mh-grab{display:none}
  body.mh-resizing,body.mh-resizing *{cursor:ns-resize !important;user-select:none}

  /* ---- 刊頭擺在卡片旁邊 ----------------------------------------------------
     它不再是一條橫帶，而是一整根柱子：和卡片各佔一邊，兩邊都拉到版位的滿高。
     卡片那一堆永遠是一整塊，只是被擠窄了就自己重新分列。
     中間那條縫可以左右拖，決定兩邊各佔幾成。 */
  .masthead.side{position:absolute;top:0;z-index:2}
  /* 把手還是長在刊頭身上，只是它站著的時候，把手也跟著轉成直的，
     長在它和卡片相接的那一邊 —— 拖它就是改兩邊各佔幾成。
     刊頭本身是 overflow:hidden，所以把手要貼在框「裡面」的邊上，不能掛在外面
     （掛外面會被裁掉，就是看不見的原因）。它是疊上去的，不佔任何寬度。 */
  .mh-grab.v{
    top:0;bottom:0;left:auto;right:0;width:18px;height:auto;cursor:ew-resize;z-index:5;
  }
  .masthead.side.at-right .mh-grab.v{right:auto;left:0}
  .mh-grab.v::after{
    width:4px;height:64px;background:rgba(74,111,220,.55);
    box-shadow:0 0 0 2px rgba(255,255,255,.75);
  }
  .mh-grab.v:hover::after{background:var(--blue);width:5px;height:88px}


  body.mh-splitting,body.mh-splitting *{cursor:ew-resize !important;user-select:none}
  /* 搬動中：卡片先排到它「會變成的樣子」，淡淡的，放手才落實 */



  /* 四個落點蓋在版位上：拖到哪一塊、或點哪一塊，刊頭就搬去那裡 */
  .mh-zone{
    position:absolute;z-index:30;cursor:pointer;
    border:3px dashed rgba(74,111,220,.75);border-radius:10px;
    background:rgba(238,242,252,.92);
    box-shadow:0 6px 18px rgba(16,24,40,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:var(--blue);user-select:none;
  }
  .mh-zone:hover{background:var(--blue);color:var(--surface);border-style:solid}
  .mh-zone.here{border-style:solid;background:rgba(74,111,220,.16)}
  /* 站在版外面，字排成直的才塞得下（左右那兩塊）；上下那兩塊照常橫著 */
  .mh-zone .now{font-size:11.5px;font-weight:800;opacity:.8;margin-left:6px}
  .mh-zone[data-zone="left"],.mh-zone[data-zone="right"]{
    flex-direction:column;gap:4px;
  }
  .mh-zone[data-zone="left"] .now,.mh-zone[data-zone="right"] .now{
    margin-left:0;writing-mode:vertical-rl;
  }

  .masthead .mh-x{
    position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    border:none;background:rgba(51,58,69,.72);color:var(--surface);font-size:12px;font-weight:800;
    cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;
  }
  .masthead:hover .mh-x{display:flex}
  .masthead .mh-x:hover{background:var(--accent)}

  /* 確認後：列鎖定（⋮⋮、刊頭把手收起），格子改為可互換 */
  #board.locked .masthead{cursor:default}
  /* typed copy is the thing you read on this sheet, so it runs a good deal
     larger and heavier than the 10px card baseline — still scaled by --z.
     This is typography only, so it applies locked or not: unlocking to
     re-arrange rows must never make existing copy jump size. */
  .cell.copy{justify-content:flex-start;
             font-size:calc(15px * var(--z));font-weight:800;line-height:1.25}
  /* 確認前 the sheet is not open for copy — the cards are arrangement, not text */
  .cell.editable{cursor:text;user-select:text}
  .cell.editable:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fbfcff}
  /* the placeholder stays small and light so it never reads as real copy */
  .cell.editable:empty::before{content:'輸入品名';color:#c2cad8;font-weight:400;
                               font-size:calc(10px * var(--z))}
  #board.locked .grip{display:none}
  #board.locked .masthead{border-style:solid}
  /* cards keep their hover ring — after the lock they are the thing you move */
  #board.locked .masthead:hover{outline:none}
  #board.locked .mh-x{display:none !important}

  /* 顯示品名 off: the copy goes invisible but keeps its box, so the grid does
     not re-flow — this is a way to read the layout as pure blocks, not a
     different layout. The card being typed in stays legible regardless, or
     you would be entering text you cannot see. */
  #board.hide-copy .cell{color:transparent}
  #board.hide-copy .cell.editable:empty::before{color:transparent}
  #board.hide-copy .cell.editable:focus{color:var(--ink)}
  #board.hide-copy .cell.editable:focus:empty::before{color:#c2cad8}

  .sheet-empty{color:var(--muted);font-size:16px;font-weight:800;margin:40px auto;
               text-align:center;line-height:1.7}
  .sheet-empty .sub{font-size:13px;font-weight:800;opacity:.75}

  /* --- cursor tip (dm-block-zoom.html #cursorTip) --- */
  #cursorTip{
    position:fixed;pointer-events:none;z-index:99;display:none;
    background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.5;
    padding:5px 9px;border-radius:3px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(28,27,25,.25);font-variant-numeric:tabular-nums;
  }
  #cursorTip b{font-weight:700}
  #cursorTip .sep{color:#8b939f;margin:0 5px}
  #cursorTip .num{color:#f0a888}

  /* ================= 儲存狀態 ・ 進度 ================= */
  /* Always-on badge: at a glance, is my work safe or not? It never fades —
     an indicator you have to catch in time is no indicator at all. */
  #saveState{
    opacity: 50%;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    display:none;
    align-items:center;
    gap:6px;
    border:1px solid transparent;
    border-radius:999px;
    padding:4px 13px;
    transition:background .16s,color .16s,border-color .16s;
  }
  #saveState.on{display:inline-flex}
  #saveState.dirty{color:var(--amber);background:var(--amber-bg);border-color:var(--warn-line)}
  #saveState.done {color:var(--green-ink);background:var(--green);border-color:var(--green-rule)}
  #saveState.fail {color:var(--surface);background:var(--accent);border-color:var(--accent)}
  /* 進度跟著跑到那一列的最右邊，和檔期名各據一端 */
  .bar .prog{font-size:13px;font-weight:800;color:var(--amber)}
  .bar .prog b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pill.prog{color:var(--green-ink);border-color:var(--green-rule);background:var(--green)}

  /* ================= toast ================= */
  #toastHost{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:400;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    font-size:14.5px;font-weight:800;padding:10px 20px;border-radius:9px;
    background:var(--ink);color:var(--surface);box-shadow:0 4px 16px rgba(30,40,60,.28);
    max-width:min(90vw,540px);animation:popIn .16s ease-out;
  }
  .toast.ok  {background:var(--green);color:var(--green-ink);border:1px solid var(--green-rule)}
  .toast.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--warn-line)}
  .toast.info{background:var(--accent-tint);color:var(--accent-ink-strong);border:1px solid var(--accent-line)}
  .toast.out{animation:toastOut .2s ease-in forwards}
  @keyframes popIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes toastOut{to{transform:translateY(6px);opacity:0}}

  /* ================= modal (取代 confirm()) ================= */
  #modalHost{
    position:fixed;inset:0;z-index:500;display:none;
    align-items:center;justify-content:center;background:rgba(30,40,60,.34);
  }
  #modalHost.on{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px 20px;min-width:340px;max-width:min(92vw,470px);
    box-shadow:0 18px 48px rgba(30,40,60,.3);animation:popIn .16s ease-out;
  }
  /* 白底上的字要自己寫 color：不寫就繼承深色那一段的淺灰，白底上等於看不見
     （#blockHead、.plan-card、落版的字都中過同一招） */
  .modal h4{font-size:18px;font-weight:800;margin-bottom:9px;color:var(--ink)}
  .modal p{font-size:14.5px;font-weight:800;color:var(--muted);line-height:1.65;margin-bottom:19px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}
  .modal .btn.danger{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .modal .btn.danger:hover{background:#a5301f}

  /* ================= 參考線 (PS guides) ================= */
  .ruler-top,.ruler-left{cursor:crosshair}
  .rguide{position:absolute;background:#00c8e0;z-index:6;touch-action:none}
  .rguide.v{top:0;bottom:0;width:1px;cursor:col-resize}
  .rguide.h{left:0;right:0;height:1px;cursor:row-resize}
  /* the line is 1px but the grab zone is not */
  .rguide::before{content:"";position:absolute}
  .rguide.v::before{top:0;bottom:0;left:-6px;right:-6px}
  .rguide.h::before{left:0;right:0;top:-6px;bottom:-6px}
  .rguide.dragging{background:var(--align);box-shadow:0 0 0 1px var(--align)}
  /* dragged back over the ruler: release here and it goes away */
  .rguide.doomed{opacity:.3}

  /* ================= inline 尺 field on a divider ================= */
  .div-num{
    position:fixed;z-index:300;font-family:inherit;font-size:13px;font-weight:800;
    width:88px;text-align:center;background:var(--surface);color:var(--ink);
    border:1px solid var(--blue);border-radius:6px;padding:4px 6px;
    box-shadow:0 4px 14px rgba(30,40,60,.26);
  }
  .div-num:focus{outline:2px solid var(--blue);outline-offset:-1px}

  /* ================= tool rail states ================= */
  /* PS greys unavailable tools out rather than removing them */
  .tool[disabled]{opacity:.4;cursor:not-allowed}
  .tool[disabled]:hover{background:rgba(255,255,255,.14)}
  /* 空白鍵 = 手形工具, exactly as in PS */
  #sheetMain.tool-hand,#sheetMain.tool-hand *{cursor:grab !important}
  #sheetMain.tool-hand.panning,#sheetMain.tool-hand.panning *{cursor:grabbing !important}

  /* ================= locked feedback (PS layer lock) ================= */
  @keyframes lockShake{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)}
  }
  #board.shake{animation:lockShake .4s cubic-bezier(.36,.07,.19,.97)}
  /* the row itself refuses the drag; the cards on it keep their own cursors,
     which are set by more specific rules further up */
  #board.locked .row{cursor:not-allowed}
  /* a confirmed 版位 is marked by a glyph, not by colour alone */
  .mini-blk{position:relative}
  .mini-blk.confirmed::after{
    content:"✓";position:absolute;top:2px;right:5px;line-height:1;
    font-size:12px;font-weight:800;color:var(--green-ink);
  }
  /* 右上角同時要放紅點的時候，✓ 讓到左邊去 —— 兩個都是狀態，誰都不該被蓋掉 */
  .mini-blk.confirmed.has-notes::after{right:auto;left:4px}

  /* 點貼紙跳出來的那一張卡：浮在最上面，貼著那張貼紙站。
     固定大小 —— 它是「講話的卡片」，不是版面的一部分，版面縮放不該動到它。 */
  .note-pop{
    position:fixed;z-index:80;width:300px;max-width:calc(100vw - 16px);
    max-height:70vh;overflow:auto;
    filter:drop-shadow(0 12px 30px rgba(16,24,40,.4));
  }
  .note-pop .icard{margin:0;cursor:default}

  /* PM 動過的那一格，設計在 落版 看得到。
     用 ::after 而不是塞一個 <span> 進去：格子是 contentEditable 的，
     打字時 cell.text 讀的是 el.textContent —— 真的塞一塊進去，
     「已填寫」三個字就會被存進品名裡。虛擬元素不算在 textContent 裡。
     只在 落版（#view-sheet）出現；拼板 借同一份 DOM，那邊看得到內容本人。 */
  /* 整格轉綠，不是角落貼一張小標：綠色在這支程式裡一直是「已經交出去了」
     （版位底色那一套就是灰／白／綠），所以格子本身變綠＝這一格 PM 收過了。
     一眼掃過去就看得出哪幾格還空著，不必去讀每個角落的小字。 */
  #view-sheet .cell.pm-filled{
    position:relative;
    background:var(--ok-tint,#e6f4ec);
    border-color:var(--green-rule,#9ccfb2);
  }
  #view-sheet .cell.pm-filled::after{
    content:"已填寫";position:absolute;top:3px;right:5px;
    font-size:10px;font-weight:800;line-height:1.25;
    color:var(--ok-ink,#1a7f47);pointer-events:none;
  }

  /* 小地圖上的貼紙統計：左下角一種一枚，右上角一顆紅色總數。
     這一組是「標記」，固定大小 —— 版位縮到多小它都要看得清楚。 */
  .mini-notes{
    position:absolute;left:3px;bottom:3px;display:flex;gap:2px;align-items:flex-end;
    pointer-events:none;
  }
  .mnk{
    width:13px;height:13px;border-radius:3px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;position:relative;
    font-size:9px;font-style:normal;font-weight:800;color:#3a3a3a;
    border:1px solid rgba(16,24,40,.28);box-shadow:0 1px 2px rgba(16,24,40,.22);
  }
  /* 留言沒有圖示，那就讓它是一張空白的貼紙 —— 形狀本身就是它 */
  .mnk.plain{}
  .mnk b{
    position:absolute;right:-3px;bottom:-4px;font-size:8px;line-height:1;
    color:var(--ink);background:var(--surface);border-radius:5px;padding:0 2px;
    border:1px solid rgba(16,24,40,.3);
  }
  .mini-cnb{
    position:absolute;top:2px;right:3px;min-width:14px;height:14px;padding:0 3px;
    border-radius:8px;background:var(--danger-ink,#d92d20);color:#fff;
    font-size:9.5px;font-weight:800;line-height:14px;text-align:center;
    box-shadow:0 1px 3px rgba(16,24,40,.35);pointer-events:none;
  }

  /* ================= 刊頭 rejected drop ================= */
  .masthead.reject{
    border-color:var(--accent) !important;background:var(--danger-tint) !important;
    color:var(--accent) !important;animation:lockShake .4s;
  }

  /* ==========================================================================
     操作區調深色 —— 版面本身是紙，其他都是桌面
     上面那條、左邊那欄、右邊那欄一律沉下去，中間那片（#sheetMain）維持原本的
     淺色，眼睛才會自己停在版面上。放在最後面：只覆蓋顏色，不動任何尺寸。
     ========================================================================== */
  :root{
    --chrome:#232a37;          /* 桌面：所有控制項站的底 */
    --chrome-2:#2e3747;        /* 浮在桌面上的東西（按鈕、書籤） */
    --chrome-ink:#eaeef7;
    --chrome-muted:#9aa6bc;
    --chrome-line:#3d4759;
  }
  body{background:var(--chrome);color:var(--chrome-ink)}
  .topbar h1{color:var(--chrome-ink)}

  /* 中間那片：版面連同它四周的空地就是「紙」，深色到這裡為止 */
  #sheetMain{background:var(--bg);border-radius:12px}
  /* 紙上的字是黑的：深色是給桌面用的，版面裡的一切照原本的顏色走。
     （少了這一行，落版打的字會繼承深色底那一套淺灰，白卡片上就快看不見了。） */
  #sheetMain,#view-total{color:var(--ink)}
  /* 檔期卡是白的，字也要回到黑的（少了這行，檔期名會淡到像沒開啟） */
  .plan-card{color:var(--ink)}
  /* 總體 那一頁沒有 #sheetMain，版面直接鋪在頁上 —— 那一整片也是紙 */
  #view-total{background:var(--bg);border-radius:12px;padding:10px 0}

  /* ---- 上面那條 ---- */
  .tab{background:rgba(255,255,255,.09);border-color:var(--chrome-line);color:var(--accent-ink)}
  .tab:hover{background:rgba(255,255,255,.16)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .btn.icon{background:rgba(255,255,255,.09);border-color:var(--chrome-line);color:var(--accent-ink)}
  .btn.icon:hover:not(:disabled){background:rgba(255,255,255,.16)}
  .btn.icon:disabled{background:rgba(255,255,255,.04)}
  .toggle{color:var(--chrome-muted)}
  .track{background:#4b566b}
  /* 檔期名這一段站在深色上：名字亮、日期和進度用暖色，跟分頁的藍分開 */
  .banner .nm{color:var(--chrome-ink)}
  .banner .rg,.bar .prog{color:#e6b465}
  .bar .prog b{color:var(--chrome-ink)}

  /* ---- 左邊那欄：小地圖／品類樹 ---- */
  #sheetSide,#pmTree{border-right-color:var(--chrome-line)}
  .mini-label{color:var(--chrome-ink)}
  #pmTree .pt-root{color:var(--chrome-ink);border-bottom-color:var(--chrome-line)}
  #pmTree .pt-root .sub,#pmTree .pt-type .caret,#pmTree .pt-type .n{color:var(--chrome-muted)}
  #pmTree .pt-type{color:var(--chrome-ink)}
  #pmTree .pt-type:hover{background:rgba(255,255,255,.08)}
  #pmTree .pt-type.open{background:rgba(74,111,220,.30);color:var(--accent-ink)}
  #pmTree .pt-blk{color:var(--chrome-muted)}
  #pmTree .pt-blk:hover{background:rgba(255,255,255,.08);color:var(--chrome-ink)}
  #pmTree .pt-blk.active{background:var(--blue);color:var(--surface)}
  #pmTree .pt-sep{color:var(--chrome-muted);border-top-color:var(--chrome-line)}

  /* ---- 右邊那欄：意見欄 ---- */
  #boardRail{background:var(--chrome);border-left-color:var(--chrome-line)}
  #railTitle{color:var(--chrome-ink)}
  #railSub,#stickTray .hint,#railEmpty{color:var(--chrome-muted)}
  #railBack{background:rgba(74,111,220,.28);border-color:var(--blue);color:var(--accent-ink)}
  #stickTray{border-color:var(--chrome-line)}
  .lg{background:rgba(255,255,255,.07);border-color:var(--chrome-line);color:var(--chrome-muted)}
  .lg.on{color:var(--ink-strong)}                       /* 選中的那顆本來就上色，字要壓回深的 */

  /* ---- 兩根書籤：站在深色上，自己也得是深色 ---- */
  .fold-tab{background:var(--chrome-2);border-color:var(--chrome-line);color:var(--chrome-ink)}
  .fold-tab:hover{background:#3a4457;border-color:var(--blue);color:var(--accent-ink)}

  /* ---- 拆框 ------------------------------------------------------------
     原本每一塊東西都用一圈線圍起來：版面一個框、意見欄一個框、每張卡再一個框。
     框疊三層，中間那片就變成井底。線改成「只有現在正在發生的事」才畫粗、畫顏色，
     其他一律靠底色分塊 —— 分得出來就夠了，不必圍起來。 */

  /* 一、中間那片鋪到視窗邊：看不到盡頭的畫布才不覺得被關著 */
  .app{padding-left:0;padding-right:0;padding-bottom:0}
  .bar{padding-left:22px;padding-right:22px}
  .topbar,#view-plans{padding-left:24px;padding-right:24px}
  #boardSide{padding-left:16px}
  #sheetSide{padding-left:2px}
  #sheetMain,#view-total{border-radius:0}
  #view-board{padding-right:var(--railw,340px)}

  /* 二、線改成底色：該分開的靠深淺分，不靠框 */
  #boardRail{border-left:1px solid var(--chrome-line)}
  #stickTray{border:0;background:rgba(255,255,255,.055);border-radius:12px;padding:8px}
  .lg{border-width:1px}
  #armHint{border-width:1px}
  .icard{
    border:1px solid rgba(16,24,40,.10);border-left:6px solid var(--nc,#98a2b3);
    box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .icard .box textarea{border-width:1px}
  .icard .acts button{border-width:1px}
  .mini-page{border:1px solid rgba(255,255,255,.28)}
  /* 面板是浮起來的紙：靠影子站出來，不必再框一圈藍 */
  #boardStage{border:1px solid var(--chrome-line);box-shadow:0 18px 44px rgba(0,0,0,.45)}

  /* 三、粗線和顏色留給「正在發生的事」：拖到哪一格、正在看哪一格、選中的那一則。
     這些狀態維持原本的粗細 —— 它們該搶眼，因為它們會消失。 */
</style>

     不要直接改這一支 —— 改正本那兩支，然後重跑一次。
     ========================================================================== -->
<script>window.__PICK_HTML = "<!doctype html>\r\n<html lang=\"zh-Hant\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\r\n<title>格子商品帶入</title>\r\n<link href=\"https://fonts.googleapis.com/css2?family=Anton&display=swap\" rel=\"stylesheet\">\r\n<style>\r\n:root{--ink:#111;--line:#e3e7ef;--bg:#f4f5f8;--accent:#d31f2b;--cw:540px;--ch:420px;\r\n  --drop:#4a6fdc;   /* 藍＝放下去的位置 */\r\n  --missing:#d31f2b}   /* 紅＝這裡還缺東西（還沒換上商品圖） */\r\n*{box-sizing:border-box}\r\nbody{margin:0;height:100vh;overflow:hidden;padding-top:52px;box-sizing:border-box;background:var(--bg);color:var(--ink);\r\n  font-family:-apple-system,\"PingFang TC\",\"Microsoft JhengHei\",\"Noto Sans TC\",sans-serif;display:flex}\r\n\r\n/* ---------- 左 sidebar：後台 ---------- */\r\n/* 後台改為覆蓋層，開合不推動中間格子 */\r\n#side{position:fixed;left:0;top:0;bottom:0;z-index:80;width:0;flex:0 0 0;\r\n  background:#fff;border-right:1px solid var(--line);overflow:hidden;\r\n  box-shadow:6px 0 24px rgba(0,0,0,.08);\r\n  transition:flex-basis .18s,width .18s;display:flex;flex-direction:column}\r\n#side.on{width:460px;flex-basis:460px}\r\n#side.on ~ #stage{pointer-events:auto}\r\n.side-hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800;\r\n  display:flex;align-items:center;justify-content:space-between}\r\n.side-bd{flex:1;overflow:auto;padding:12px}\r\n\r\n/* ---------- 中間工作區 ---------- */\r\n#topbar{position:fixed;left:0;right:0;top:0;height:52px;z-index:90;background:#fff;\r\n  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}\r\n.tlabel{font-size:12.5px;font-weight:800;color:#666;margin-left:10px}\r\n.num{width:52px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;\r\n  font:inherit;font-size:13px;text-align:center}\r\n.num:focus{outline:none;border-color:var(--accent)}\r\n.tx{font-weight:800;color:#888}\r\n.tinfo{font-size:12px;color:#999;font-weight:700;min-width:34px}\r\n.tsep{width:1px;height:22px;background:var(--line);margin:0 6px}\r\n#pad{width:140px;accent-color:var(--accent)}\r\n/* 格子陣列 */\r\n#grid{display:grid;gap:0;justify-content:center;box-shadow:0 6px 26px rgba(0,0,0,.07);background:#fff}\r\n#grid .cell{width:var(--cw);height:var(--ch)}\r\n/* 內容以 540×CH 排版再整體縮放：CH 照這一格真正的長寬比算出來，\r\n   所以版面永遠填滿那一格 —— 不會為了保持 4:3 在兩側留下空白帶。 */\r\n.cstage{position:absolute;left:0;top:0;width:var(--lw,540px);height:var(--lh,420px);\r\n  transform-origin:0 0;transform:scale(var(--cs,1))}\r\n/* 上下左右 10px 安全邊界，元素不可進入 */\r\n/* 安全邊界只剩左右：上下已經不留邊，字和價格就是要頂到底 */\r\n.safe{position:absolute;left:var(--pad,10px);top:0;\r\n  right:var(--pad,10px);bottom:0;\r\n  outline:1px dashed rgba(211,31,43,.22);pointer-events:none;display:none}\r\n.cell.cur .safe{display:block}\r\n/* 目前作用中的格子：只用內陰影標示，不加框線以免破壞黏合外觀 */\r\n.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}\r\n/* 只有非第一列的格子去掉上虛線，避免橫向相鄰時誤消 */\r\n#grid .cell:not(.row1){border-top:none}\r\n#stage{flex:1;min-width:0;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;position:relative}\r\n/* 版面錨點：格子永遠置中不動，左右面板各自佔預留欄位 */\r\n#rig{display:grid;grid-template-columns:auto 400px;align-items:center;column-gap:0}\r\n/* 右欄：選商品在上、圖層在下，之間留空隙 */\r\n#rcol{grid-column:2;margin-left:28px;display:flex;flex-direction:column;gap:16px;\r\n  max-height:calc(100vh - 100px)}\r\n/* 圖層面板與格子零間距貼合 */\r\n#wrap{position:relative;display:flex;align-items:stretch;gap:0;grid-column:1}\r\n\r\n\r\n/* ---------- 格子 ---------- */\r\n.cell{position:relative;width:var(--cw);height:var(--ch);background:#fff;\r\n  border:none;border-top:1px dashed #c9d0dc;border-bottom:1px dashed #c9d0dc;border-radius:0;\r\n  cursor:pointer;padding:0;display:block}\r\n\r\n.cell{overflow:hidden}\r\n\r\n.cell.empty{align-items:center;justify-content:center;color:#aab;font-size:20px;font-weight:700}\r\n/* 格子內每個元素都是可自由移動的 block */\r\n.blk{position:absolute;cursor:move;user-select:none;border:1.5px solid transparent;border-radius:6px;\r\n  padding:2px 4px;transition:border-color .1s}\r\n/* 字永遠壓在圖上：商品圖是背景，價格、SKU、品名是要讀的東西，不能被蓋住。\r\n   圖片自己有 z-index（疊放順序），所以這裡把「不是圖」的一律抬到它們之上。 */\r\n.blk:not(.img){z-index:60}\r\n.blk:hover{border-color:#c3cbd8}\r\n.blk.sel{border-color:var(--accent);background:rgba(211,31,43,.06)}\r\n.blk.drop{border-color:#0a7;background:rgba(0,170,119,.12)}\r\n.blk.name{font-size:30px;font-weight:800;letter-spacing:.5px}\r\n.blk.model{font-size:13px;font-weight:700;color:#666;letter-spacing:.3px}\r\n/* 品牌：實際 PNG 或長形 placeholder，高度約等同品牌字級 */\r\n.blk.brand .bimg{height:26px;display:block;pointer-events:none}\r\n.bph{position:relative;display:inline-block;width:120px;height:28px}\r\n.bph svg{width:100%;height:100%;display:block}\r\n.bph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\r\n  font-style:normal;font-size:12px;font-weight:800;color:#98a2b3;letter-spacing:.5px}\r\n.blk.img img,.blk.img .ph{width:100%;display:block;pointer-events:none}\r\n.blk.img .ph{height:170px}\r\n.blk.price{font-family:Anton,sans-serif;color:var(--accent);font-size:52px;line-height:1}\r\n.spec{display:inline-block;border:1.5px solid #111;border-radius:6px;padding:1px 8px;\r\n  font-size:14px;font-weight:800;margin-bottom:3px}\r\n.sku{font-size:var(--sku-fs,12px);color:#333;line-height:1.35;white-space:nowrap}\r\n/* 規格／SKU／價格整欄靠右：右緣對齊欄的右邊界，字級放大時往左溢出、右緣不動。\r\n   靠的是 autoSpace 量好的欄寬（b.w2）當固定寬度框 + text-align:right —— 這樣\r\n   轉盤把價格放大也不會把右緣推出格子外（本來是靠左，一放大就往右頂）。 */\r\n.blk.price,.blk.skub,.blk.specb{text-align:right}\r\n.blk.price{white-space:nowrap}\r\n.blk.skub .sku{text-align:right}\r\n/* 剛排好的那一格先藏起來量寬高，靠右對齊、圖讓開都定位完才顯示 ——\r\n   不然會看到價格先閃在估算的位置、再跳到定位（就是那個「先在中間閃一下」）。 */\r\n.cstage.measuring{visibility:hidden}\r\n.guide{position:absolute;background:#e0329b;pointer-events:none;z-index:60}\r\n.guide.gv{top:0;bottom:0;width:1px}\r\n.guide.gh{left:0;right:0;height:1px}\r\n.marquee{position:absolute;display:none;border:1.5px dashed var(--accent);\r\n  background:rgba(211,31,43,.07);pointer-events:none;z-index:50}\r\n.price{font-family:Anton,sans-serif;color:var(--accent);font-size:44px;line-height:1;margin-top:4px}\r\n\r\n/* ---------- 選商品面板 ---------- */\r\n.panel{width:400px;height:380px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:14px;\r\n  display:none;flex-direction:column;overflow:hidden;box-shadow:0 6px 26px rgba(0,0,0,.07)}\r\n.panel.on{display:flex}\r\n.psearch{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}\r\n.psearch input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px}\r\n.psearch input:focus{outline:none;border-color:var(--accent)}\r\n.pbody{flex:1;overflow:auto;padding:12px}\r\n.pcats{display:flex;gap:6px;padding:9px 10px;border-top:1px solid var(--line);overflow-x:auto;flex-shrink:0}\r\n.pcats button{appearance:none;white-space:nowrap;border:1px solid var(--line);background:#fbfcfe;\r\n  border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}\r\n.pcats button.on{background:var(--accent);border-color:var(--accent);color:#fff}\r\n\r\n.item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}\r\n.item:hover{background:#f4f6fa}\r\n.item input{width:16px;height:16px;accent-color:var(--accent)}\r\n.grp{font-size:12px;font-weight:800;color:#888;margin:10px 0 4px}\r\n.grpline td{border-top:2px solid #b9c1cf}\r\n.imgrow{display:flex;align-items:center;gap:8px;padding:4px 0}\r\n.ithumb{width:34px;height:34px;flex-shrink:0;display:block;overflow:hidden;border-radius:5px;background:#f0f2f6}\r\n.ithumb img,.ithumb svg{width:100%;height:100%;object-fit:cover;display:block}\r\n.iname{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\r\n.bthumb{width:76px;flex-shrink:0;display:block}\r\n.bthumb .bph{width:76px;height:20px}\r\n.bthumb .bph i{font-size:9px}\r\n.bthumb .bimg{height:20px;width:auto;max-width:76px;object-fit:contain}\r\n.binput{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 7px;\r\n  font:inherit;font-size:12px}\r\n.binput:focus{outline:none;border-color:var(--accent)}\r\n.var{font-size:12.5px;color:#555;margin-left:auto}\r\n.empty-hint{color:#aab;font-size:13px;padding:14px;text-align:center}\r\n\r\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\r\nth,td{border:1px solid var(--line);padding:3px 4px}\r\nth{background:#f6f8fb;font-size:11px}\r\ntd input,.grp input{border:none;font:inherit;padding:2px;background:transparent;width:100%}\r\ntd input:focus,.grp input:focus{outline:1px solid var(--accent)}\r\n.mini{appearance:none;border:1px solid var(--line);background:#fbfcfe;border-radius:7px;\r\n  padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin:6px 4px 0 0}\r\n.mini:hover{border-color:var(--accent);color:var(--accent)}\r\n\r\n.blk.img{overflow:visible}\r\n.blk.img.actimg{border-color:#007acc;box-shadow:0 0 12px rgba(0,122,204,.45);opacity:1!important}\r\n.tobtn{position:absolute;right:8px;bottom:8px;display:none;appearance:none;\r\n  border:1px solid rgba(0,0,0,.15);border-bottom-width:2px;\r\n  background:linear-gradient(#fff,#eef1f6);color:#1b3a57;font:inherit;font-size:11px;font-weight:800;\r\n  padding:5px 10px;border-radius:7px;cursor:pointer;z-index:5;\r\n  box-shadow:0 2px 5px rgba(0,0,0,.18)}\r\n.tobtn:hover{background:linear-gradient(#fff,#dfe6f0);border-color:#007acc;color:#007acc}\r\n.tobtn:active{transform:translateY(1px);border-bottom-width:1px;box-shadow:0 1px 3px rgba(0,0,0,.18)}\r\n.blk.img:hover .tobtn,.blk.img.actimg .tobtn{display:block}\r\n/* 圖層面板：位於選商品面板正下方，獨立窗口 */\r\n#lay{display:none;width:400px;flex:1;min-height:150px;background:#fff;\r\n  border:1px solid var(--line);border-radius:14px;flex-direction:column;overflow:hidden;\r\n  box-shadow:0 6px 26px rgba(0,0,0,.07)}\r\n#lay.on{display:flex}\r\n#lay .side-hd{padding:10px 12px;font-size:12px}\r\n#lay .side-bd{flex:1;overflow:auto;padding:8px}\r\n.lyr{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;cursor:pointer;\r\n  border:1.5px solid transparent;font-size:13px}\r\n.lyr:hover{background:#f4f6fa}\r\n.lyr.on{border-color:#007acc;background:rgba(0,122,204,.08)}\r\n.lyr{cursor:grab}\r\n.lyr:active{cursor:grabbing}\r\n.lyr.dragging{opacity:.45}\r\n.lyr.over{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}\r\n.lgrip{color:#b9c1cf;font-size:11px;flex-shrink:0}\r\n.lyr .mini{font-size:10.5px;padding:3px 7px;opacity:0;flex-shrink:0}\r\n.lyr:hover .mini,.lyr.on .mini{opacity:1}\r\n.lthumb{width:30px;height:30px;flex-shrink:0;overflow:hidden;border-radius:5px;background:#f0f2f6}\r\n.lthumb img,.lthumb svg{width:100%;height:100%;object-fit:cover;display:block}\r\n.lname{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\r\n.lz{font-size:10px;color:#999;font-weight:800}\r\n.spec.dark{background:#111;color:#fff;border-color:#111}\r\n/* 劃線：兩條對角線橫跨整個價格，線條隨字級縮放 */\r\n.blk.price.crossed{overflow:visible}\r\n.blk.price.crossed::before,.blk.price.crossed::after{\r\n  content:'';position:absolute;left:-6%;top:50%;width:112%;height:0;\r\n  border-top:.07em solid #111;pointer-events:none}\r\n.blk.price.crossed::before{transform:rotate(15deg)}\r\n.blk.price.crossed::after{transform:rotate(-15deg)}\r\n/* 浮動小工具列：貼在被選元素正上方 */\r\n#props{position:absolute;display:none;gap:5px;z-index:70;\r\n  background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;\r\n  box-shadow:0 4px 14px rgba(0,0,0,.16)}\r\n#props.on{display:flex}\r\n#props::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);\r\n  width:9px;height:9px;background:#fff;border-right:1px solid var(--line);\r\n  border-bottom:1px solid var(--line);rotate:45deg}\r\n.pbtn{appearance:none;border:1px solid var(--line);background:#fbfcfe;border-radius:6px;\r\n  padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}\r\n.pbtn:hover{border-color:#111}\r\n.pbtn.act{background:#111;color:#fff;border-color:#111}\r\n#tip{position:fixed;pointer-events:none;z-index:99;background:#111;color:#fff;font-size:12px;\r\n  font-weight:700;padding:5px 9px;border-radius:7px;transform:translate(14px,16px);display:none;white-space:nowrap}\r\n\r\n/* 換圖的回報。不能用 #tip —— 那個是跟著游標走的，而且 ui-stage 下被關掉了。 */\r\n#imgsay{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:120;\r\n  background:#111;color:#fff;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;\r\n  opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}\r\n#imgsay.on{opacity:.94}\r\n/* 拖著檔案經過哪一塊、哪一塊正在傳 */\r\n.blk.img.imgdrop{outline:3px solid var(--drop);outline-offset:2px}\r\n.blk.img.imgbusy{opacity:.45}\r\n/* 還沒換上真圖的商品圖框紅色：一眼看得出這一版還缺幾張圖 */\r\n.blk.img.noimg{outline:2px solid var(--missing);outline-offset:1px}\r\n\r\n/* ---------- 身分：設計 只排版；PM 只帶商品 ---------- */\r\n/* 設計 拿不到選商品面板與後台，所以無法新增任何東西 */\r\nbody.role-design #panel,\r\nbody.role-design #sideToggle{display:none !important}\r\n/* PM 只能點選，不能搬動，游標也要說清楚 */\r\nbody.role-pm .blk{cursor:default}\r\n/* 疊放順序是排版的事，PM 沒有圖層面板 */\r\nbody.role-pm #lay{display:none !important}\r\n\r\n/* ---------- 只出借一塊面板（?ui=panel） ----------\r\n   嵌在落版旁邊時，這一頁只露出「挑貨」／「圖層」那塊面板，貼在那一格旁邊。\r\n   格子本身還是要照畫 — 縮圖是從它身上複製的 — 所以版面不是 display:none，\r\n   而是搬到畫面外：照樣有版面、有尺寸，只是看不到。 */\r\nbody.ui-panel{padding-top:0;background:transparent}\r\nbody.ui-panel #topbar,\r\nbody.ui-panel #side{display:none !important}\r\nbody.ui-panel #stage{padding:0;display:block;overflow:hidden}\r\nbody.ui-panel #rig{display:block;height:100%}\r\nbody.ui-panel #wrap{position:absolute;left:-10000px;top:0;visibility:hidden}\r\nbody.ui-panel #rcol{margin:0;width:100%;height:100%;gap:0}\r\nbody.ui-panel .panel,\r\nbody.ui-panel #lay{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}\r\n/* 被嵌在落版旁邊時，這塊面板捲到底就停 — 不要把剩下的滾輪推給外面那張版，\r\n   不然名單一到底，整片版面就跟著動起來。 */\r\n
