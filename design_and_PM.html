  const folds = divPx * (node.children.length - 1);
  const availW = row ? wpx - folds : wpx;
  const availH = row ? hpx : hpx - folds;
  const sizes = effSizes(node);
  for (let i = 0; i < node.children.length; i++){
    const kw = row ? (sizes[i] / 100) * availW : availW;
    const kh = row ? availH : (sizes[i] / 100) * availH;
    const hit = regionSize(node.children[i], target, kw, kh);
    if (hit) return hit;
  }
  return null;
}

/** The block's shape on the board — the grid is built to match it. */
function blockAspect(block){
  for (const side of ['front','back']){
    const r = regionSize(layout[side], block, CONFIG.board.w, CONFIG.board.h);
    if (r && r.h > 0) return r.w / r.h;
  }
  return 1;
}

/* Row counts come from the block's shape; splitEven — lifted verbatim from
   grid-reorder.html — then spreads the cells across those rows as evenly as
   possible. Combined with flex:1 cards this guarantees a full rectangle for
   any n, instead of dm-block-zoom's requirement that cols divide n exactly. */
function splitEven(total, nRows){
  const base = Math.floor(total / nRows);
  const extra = total % nRows;
  return Array.from({length:nRows}, (_, i) => base + (i < extra ? 1 : 0));
}

function renderHead(){
  blockHead.innerHTML = '';
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);

  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = sh.masthead
    ? `${activeBlock.name}刊頭：`
    : `${activeBlock.name}（無刊頭）`;
  blockHead.appendChild(title);

  if (sh.masthead){
    /* 寬和高兩個都寫出來，躺著站著都一樣。刊頭是要發出去做的一塊實體印刷品，
       它的規格就是「寬 × 高」—— 即使躺著的時候寬度永遠等於版位寬、不會變，
       那也是這塊東西的尺寸，不是可以省略的常數。
       （躺著：寬固定、高用拖的或打字；站著：寬用中間那條縫拖、高就是版位的高。） */
    const fixedW = document.createElement('span');
    fixedW.className = 'mh-fixed';
    fixedW.textContent = sh.mhSide
      ? (sh.mastheadW * clampSideFrac(sh.mhSide.frac)).toFixed(1)
      : sh.mastheadW;
    fixedW.title = sh.mhSide
      ? '刊頭寬度：拖版面中間那條縫調整'
      : '刊頭寬度固定為版位寬度，不可調整';
    blockHead.appendChild(fixedW);

    const x = document.createElement('span');
    x.className = 'mh-x-sep';
    x.textContent = '×';
    blockHead.appendChild(x);

    // the block's own height in cm caps how tall the 刊頭 may be
    const blockHcm = sh.mastheadW / blockAspect(activeBlock);
    const maxH = Math.round(blockHcm * CONFIG.mastheadMaxFrac * 10) / 10;

    const inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'mh-num';
    inp.min = '1'; inp.max = String(maxH); inp.step = '0.5';
    inp.value = sh.mhSide ? Math.round(blockHcm * 10) / 10 : sh.mastheadH;
    // 站在卡片旁邊時高度就是版位的高，不是這裡能決定的
    inp.disabled = !!sh.mhSide;
    inp.title = `1 – ${maxH} cm（版位高 ${blockHcm.toFixed(1)}cm）`;
    const apply = () => {
      const v = parseFloat(inp.value);
      if (!isFinite(v) || v <= 0){ inp.value = sh.mastheadH; return; }
      sh.mastheadH = Math.min(maxH, Math.round(v * 10) / 10);
      inp.value = sh.mastheadH;
      renderHead();
      renderGrid(activeBlock);                   // 刊頭 height re-flows the grid
      commitAction();
    };
    inp.addEventListener('change', apply);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    blockHead.appendChild(inp);

    const cm = document.createElement('span');
    cm.className = 'sub';
    cm.textContent = 'cm';
    blockHead.appendChild(cm);
  }

  const sub = document.createElement('span');
  sub.className = 'sub';
  sub.textContent = `${totalCount(activeBlock)} 支`;
  blockHead.appendChild(sub);

  /* 這個版位上有哪幾位 PM。只是一行字，不是下拉 —— 指派是一格一格的，
     那件事在 拼板 的「指派」模式裡做（見 assignCells）。
     這裡曾經是一顆「這個版位交給哪位 PM」的下拉，配合的是「一個版位一位 PM」。
     一個版位本來就會有好幾個品類、由不同的人顧，那顆下拉逼人二選一。 */
  const own = document.createElement('span');
  own.className = 'sub';
  const whos = blockPms(sh).map(pmName).filter(Boolean);
  own.textContent = whos.length ? `負責：${whos.join('、')}` : '未指派';
  blockHead.appendChild(own);

  if (!sh.masthead){
    const add = document.createElement('button');
    add.id = 'addMasthead';
    add.textContent = '＋刊頭';
    add.addEventListener('click', () => {
      sh.masthead = { image: null };
      sh.mhSide = null;                // 重新加的刊頭先當一條橫帶
      renderHead(); renderGrid(activeBlock);
      commitAction();
    });
    blockHead.appendChild(add);
  }
}

/* 落版的格子只回答一件事：這一格有沒有人動過。
   以前它同時是輸入框（鎖定後打品名）、提示（輸入品名）、狀態（右上角「已填寫」）
   三種字擠在同一塊小方塊裡，要看懂得先分辨看到的是哪一種。落版是在決定版面長相，
   品名是拼板挑完貨才有的東西 —— 那一頁本來就看得到，不必在這裡先寫一次。

   已經打過的品名沒有刪（cell.text 還在），只是介面上不再畫它。 */
function makeCard(cell){
  const el = document.createElement('div');
  /* PM 在這一格動過手（挑了貨、或留了話）＝設計在 落版 就看得到「有填寫」，
     不必切到 拼板 一格一格點開來確認。這是交接的反方向：
     cell.st（蓋章／第幾關）是棒子現在在哪一關，這個是 PM 那邊做了什麼的回音。 */
  const pmFilled = !!pickedOf(cell).length || !!notesOf(cell).length;
  el.className = 'cell copy' + (pmFilled ? ' pm-filled' : '')
                             + (cell.gi === 1 ? ' g2' : '');   // dm-block-zoom .sq.g2
  el.dataset.cellId = cell.id;
  el.dataset.gi = cell.gi;             // 拼板要靠它認出這一格是哪個品類
  /* 未填寫／有填寫那兩個字是 CSS 的 ::before，不是這裡塞的文字節點 ——
     同一批 .cell 會被原封不動搬去拼板當畫布的容器，真的塞一個文字節點進去，
     它就會卡在畫布底下（clearBoardThumbs 當初就是為了這件事才存在）。 */
  return el;
}

/* Everything renderGrid needs to know about the finished sheet, with no DOM
   writes — so the same numbers can either build the board or just re-size the
   board that is already there. */
function sheetMetrics(block){
  const main = sheetMainEl;
  const sh = sheetOf(block);

  /* ---- shape the grid like the block's segment on the minimap ----
     The 刊頭 spans the block's full width, so that width IS the block's real
     width in cm and is not editable. Its editable height therefore eats a
     share of the block's height, and the cell grid gets whatever is left —
     which is why changing 刊頭 height re-flows the grid. */
  const n = sh.cells.length;
  const aspect = blockAspect(block);              // whole block, w/h
  const blockHcm = sh.mastheadW / aspect;         // block height in cm
  /* 刊頭在旁邊時，它吃掉的是寬度不是高度：兩邊都是滿高，所以卡片那一塊變窄、
     變高，列數自己重算。版位整體的形狀一步都不動。 */
  const side = (sh.masthead && sh.mhSide) ? sh.mhSide : null;
  const sideFrac = side ? clampSideFrac(side.frac) : 0;
  const mhFrac = (sh.masthead && !side)
    ? Math.min(CONFIG.mastheadMaxFrac, sh.mastheadH / blockHcm)
    : 0;

  // cells occupy the block minus the 刊頭 band (or minus its column), so they
  // are laid out to THAT shape, not the whole block's
  const cellAspect = side ? aspect * (1 - sideFrac) : aspect / (1 - mhFrac);

  /* 版面該有多大＝這塊窗口現在看得到多寬，也就是 clientWidth 本人。
     這裡本來還去扣掉那一圈內距（`padding:30vh 40%`），但那圈東西是**捲動用的空地**，
     不是被誰佔走的版面 —— 它讓最邊邊那一格也能拖到畫面中間，看得到的寬度一點都沒少。
     扣掉的後果是整條算式在 1221px 寬的窗口裡只剩 221px，被下面兩個下限接住變成
     320×240，於是 maxPerRow 永遠是 4：不管版位多寬、有幾格，一列最多四格。
     60 格的版位因此被排成 15 列 × 4 格 —— 一格 8.5cm 寬、1.3cm 高，畫布裡的
     品名、商品圖、價格整疊塞不進去就滿出來，壓在上下兩列身上（壓力測試那張圖）。 */
  const availW = Math.max(320, main.clientWidth - 12);
  const availH = Math.max(240, main.clientHeight - blockHead.offsetHeight - 34);

  /* Row count from the shape, then grid-reorder.html's splitEven spreads the
     cells across those rows as evenly as possible. Every row is flex-filled to
     the full width, so the block always reads as a solid rectangle — n never
     has to divide evenly, and there is no stub row (20 -> 7/7/6, not 8/8/4). */
  let nRows = Math.max(1, Math.round(Math.sqrt(n / cellAspect)));
  // never so many per row that cards fall under the legibility floor
  const maxPerRow = Math.max(1, Math.floor((availW - 14) / (CONFIG.minCellW + ROW_GAP)));
  nRows = Math.min(n, Math.max(nRows, Math.ceil(n / maxPerRow)));
  /* Once a row has been dragged, the split the user was looking at IS the
     arrangement — re-deriving it here would silently re-flow the cells and
     undo the drag on the next render (confirming, resizing, zooming). */
  const held = mhRowLock && mhRowLock.reduce((a, b) => a + b, 0) === n ? mhRowLock : null;
  const frozen = held
    || (sh.rows && sh.rows.reduce((a, b) => a + b, 0) === n ? sh.rows : null);
  const counts = frozen || splitEven(n, nRows);
  nRows = counts.length;                 // row heights follow the actual split

  const widestRow = Math.max(...counts);

  // Fill the pane's width and let the aspect decide the height — a tall block
  // scrolls vertically rather than shrinking to fit the viewport.
  let gridW = availW;
  // Guard only the pathological case (a very tall, narrow region), where full
  // width would produce an absurdly long column.
  const maxH = availH * CONFIG.maxGridHeightFactor;
  if (gridW / aspect > maxH) gridW = maxH * aspect;
  // never squeeze cards below the legibility floor — if the pane is too
  // narrow for that, the grid overflows and #sheetMain scrolls sideways
  gridW = Math.max(gridW, widestRow * CONFIG.minCellW + 14 + widestRow * ROW_GAP);

  /* 把版位的總高分給 刊頭 和 卡片列。
     ⚠️ 版位的比例是這張版的事實，任何工具都不准改它 —— 尤其是拉刊頭。
     外框永遠是 gridW × totalH，而 totalH 只由 aspect 決定；刊頭吃掉多少，
     卡片那一塊就少多少，總高一步都不動。 */
  const totalH = gridW / aspect;
  /* 刊頭吃掉多少就是多少，最多吃到 mastheadMaxFrac（卡片那一塊一定留得下來，
     不然下面會除到 0）。
     這裡本來還有一個 mastheadMinH 的下限（60px），結果 1cm 到 6.8cm 畫出來
     一模一樣 —— 25.7cm 的可調範圍有四分之一是死的，拖著把手走一大段版面完全不動，
     那比「列被擠扁」更像壞掉。列高的下限就是為了同樣的理由拿掉的（見下面那段），
     刊頭沒有道理是唯一的例外：版上的東西該多長就畫多長。
     縮到快看不見也回得來 —— 刊頭旁邊那個公分數字欄一直都在，打一個數字就回來了。 */
  const mastheadPx = (sh.masthead && !side)
    ? Math.min(totalH * mhFrac, totalH * CONFIG.mastheadMaxFrac)
    : 0;
  const cellAreaH = totalH - mastheadPx - ((sh.masthead && !side) ? ROW_GAP : 0);

  /* 列高＝剩下的高度均分，沒有下限，而且**不會**因此去動版位的大小。
     這裡踩過兩種錯，兩種都是拿「版位的樣子」去補「看不清楚」這件事：
       1. `Math.max(minRowH, …)` —— 列高被墊高，卡片那一疊比版位還高，版位被撐長，
          比例當場變掉（一塊真實比例 2.08 的版被畫成 0.26）。
       2. 列太扁就整塊等比放大 —— 比例是保住了，但拉一下刊頭整個版位就跟著脹大，
          看起來像自己會縮放，一樣是工具在動版面。
     正確的是：外框永遠是 gridW × totalH，刊頭吃掉多少、卡片就少多少，
     版位在畫面上的大小和形狀**一步都不動**。列被擠扁是對的 —— 那就是這張版真正的
     樣子。看不清楚要用縮放拉近，那只是把畫面推近，不會改到印出來的東西。 */
  let rowH = (cellAreaH - ROW_GAP * (nRows - 1)) / nRows;   // 下面 sheetZoom 會再乘
  let mhPx = mastheadPx;

  // 縮放 tool: scale the finished layout uniformly. Applied last so it can go
  // below the legibility floors on purpose — the floors size the 100% view.
  if (sheetZoom !== 1){
    gridW *= sheetZoom; rowH *= sheetZoom; mhPx *= sheetZoom;
  }

  return {
    sh, counts, gridW, rowH, mhPx, blockHcm, totalH: totalH * sheetZoom,
    /* 卡片那一疊實際有多高。列高碰到下限時整塊是等比放大的，所以這個數字現在
       永遠等於扣掉刊頭之後剩下的高度 —— 旁邊那根刊頭跟著它，不會矮一截。 */
    stackH: rowH * counts.length + ROW_GAP * (counts.length - 1),
    // 旁邊那根柱子：哪一邊、佔多寬（含間隙前的實寬）
    side: side ? { at: side.side === 'left' ? 'left' : 'right',
                   frac: sideFrac, w: gridW * sideFrac } : null,
    mhAt: (sh.masthead && !side) ? Math.min(sh.mastheadRow || 0, counts.length) : -1,
    // px the 刊頭 box gains per cm of length, so the drag maps 1:1 to the field
    pxPerCm: (totalH * sheetZoom) / blockHcm,
    maxHcm: blockHcm * CONFIG.mastheadMaxFrac
  };
}

/* What the board is currently showing, structurally: which cards, in what
   order, split how, with the 刊頭 where. Zoom and pane size are deliberately
   absent; those only change sizes, which is the cheap path below. */
function sheetSig(m){
  return m.counts.join(',') + '|' + m.mhAt +
         '|' + (m.side ? 'S' + m.side.at : '-') +
         '|' +
         (m.sh.masthead ? (m.sh.masthead.image ? 'img' : 'box') : '-') +
         /* 換的是哪一張也算結構的一部分 —— 只記「有圖／沒圖」的話，換第二張圖
            簽名不變、那個 <img> 不重建，畫面就停在上一張（見 readImage）。
            記版次不記網址：base64 的刊頭圖好幾 MB，不該每次重排都比對一次。 */
         (m.sh.mhRev || 0) + '|' +
         m.sh.cells.map(c => c.id).join(',');
}

/* PM 動過沒有，是在別的分頁改的（拼板 挑貨、貼便利貼）—— 那些都不會動到
   sheetSig，因為版面的結構真的沒變，所以格子不會重建。既然不重建，這個記號
   就得在「只調大小」這一趟自己更新，不然它永遠停在上次重建時的樣子。 */
function syncPmFilled(sh){
  const by = new Map((sh.cells || []).map(c => [String(c.id), c]));
  boardEl.querySelectorAll('.cell').forEach(el => {
    const c = by.get(el.dataset.cellId);
    if (!c) return;
    el.classList.toggle('pm-filled', !!pickedOf(c).length || !!notesOf(c).length);
  });
}

/** Size-only pass: no DOM is created, so focus, caret and selection survive. */
function layoutGrid(m){
  syncPmFilled(m.sh);
  boardEl.style.setProperty('--z', sheetZoom);          // card type scales with it
  boardEl.style.setProperty('--rowh', m.rowH + 'px');   // 格子上的字跟著列高走
  boardEl.style.width = m.gridW + 'px';
  sizeSideMasthead(m);
  for (const row of boardEl.children){
    if (!row.classList.contains('row')) continue;
    row.style.height = (row.classList.contains('masthead-row') ? m.mhPx : m.rowH) + 'px';
  }
  // the empty 刊頭 prints its own size, so it has to follow a live edge drag
  paintMhLabel(m);
}

/** 旁邊那根刊頭：讓出卡片那半邊的寬度，自己拉到滿高，縫也跟著站好。 */
function sizeSideMasthead(m){
  const left = m.side && m.side.at === 'left';
  boardEl.style.paddingLeft  = (m.side && left)  ? m.side.w + 'px' : '';
  boardEl.style.paddingRight = (m.side && !left) ? m.side.w + 'px' : '';

  const mh = boardEl.querySelector('.masthead.side');
  if (!m.side || !mh) return;
  const w = Math.max(20, m.side.w - ROW_GAP);
  mh.style.width = w + 'px';
  mh.style.height = Math.max(m.totalH, m.stackH) + 'px';   // 跟卡片一樣高
  mh.style.left  = left ? '0px' : '';
  mh.style.right = left ? '' : '0px';

}

/** 空刊頭上那行說明：寫上它現在的尺寸，框太小就把後半句收起來，
    絕不讓字被切一半。字級固定，不隨 縮放 起伏。 */
function paintMhLabel(m){
  const mh = boardEl.querySelector('.masthead:not(.hasimg)');
  const size = mh && mh.querySelector('.mh-size');
  if (!size) return;
  // 站在旁邊時：寬度是它分到的那一成，高度就是整個版位的高
  const w = m.side ? (m.sh.mastheadW * m.side.frac).toFixed(1) : m.sh.mastheadW;
  const h = m.side ? m.blockHcm.toFixed(1) : m.sh.mastheadH;
  size.textContent = `刊頭 ${w}×${h}cm`;
  /* 整句都要看得見：框放不下就把字縮到放得下為止，不再把後半句收起來。
     二分找最大的、還裝得下的比例 —— 直接一格一格縮太慢，而且字會抖。
     縮不下去就停在下限，寧可小也不要少一半的字。 */
  mh.classList.remove('tight');
  const fits = () => mh.scrollHeight <= mh.clientHeight + 1
                  && mh.scrollWidth  <= mh.clientWidth  + 1;
  mh.style.setProperty('--mh-fit', 1);
  if (!fits()){
    let lo = .25, hi = 1, best = .25;
    for (let i = 0; i < 9; i++){
      const mid = (lo + hi) / 2;
      mh.style.setProperty('--mh-fit', mid);
      if (fits()){ best = mid; lo = mid; } else hi = mid;
    }
    mh.style.setProperty('--mh-fit', best);
  }
}

function renderGrid(block){
  syncTools();                    // 搬移 comes and goes with the lock
  if (!block){
    boardEl.innerHTML = '<div class="sheet-empty">' + (activeMode === 'pm'
      ? '沒有你的版位<br><span class="sub">設計確認排列、而且指定給你之後，這裡才會出現東西</span>'
      : '← 從左邊選一個版位') + '</div>';
    boardSig = null;
    return;
  }
  const m = sheetMetrics(block);
  lastMetrics = m;
  const sh = m.sh;

  /* Zooming, resizing the pane and dragging the 刊頭 edge all leave the same
     cards in the same order — only the numbers move. Re-sizing in place skips
     rebuilding every card and, more importantly, does not blow away the card
     you are typing in. */
  const sig = sheetSig(m);
  if (sig === boardSig && boardEl.querySelector('.row')){
    layoutGrid(m);
    return;
  }
  boardSig = sig;

  // Emptying the board collapses the scroll container, which drops scrollTop
  // to 0 — so a rebuild after a drag would fling you back to the top. Hold
  // the position and put it back once the rows exist again.
  const main = sheetMainEl;
  const keepL = main.scrollLeft, keepT = main.scrollTop;

  const rows = [];
  let at = 0;
  m.counts.forEach((count, ri) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.height = m.rowH + 'px';
    row.appendChild(makeGrip());
    // cards keep the stylesheet's flex:1 1 0, so the row always fills the
    // width whatever its count — that is what keeps the block rectangular
    sh.cells.slice(at, at + count).forEach(c => row.appendChild(makeCard(c)));
    // ＋／−：這一列加一格／少一格。掛在列身上（絕對定位在版面外），所以卡片那一塊
    // 一個 px 都沒少
    row.appendChild(makeRowBtns(ri, count, sh.cells.length));
    at += count;
    rows.push(row);
  });
  // the masthead keeps whatever row REORDER last dragged it to
  if (m.mhAt >= 0){
    // 排在所有卡片列後面＝它在最下面，把手要換到上緣去（見 .masthead.at-bottom）
    rows.splice(m.mhAt, 0,
      buildMastheadRow(sh, m.mhPx, m.pxPerCm, m.maxHcm, m.mhAt >= m.counts.length));
  }

  // one reflow for the whole board instead of one per row
  const frag = document.createDocumentFragment();
  rows.forEach(r => frag.appendChild(r));
  // 刊頭在旁邊：它不是列，是壓在旁邊那一柱的一塊，外加中間那條縫
  if (m.side){
    const mh = buildMasthead(sh, m.pxPerCm, m.maxHcm);
    mh.classList.add('side', m.side.at === 'left' ? 'at-left' : 'at-right');
    // 直立時的把手：拉的是兩邊的比例，不是長度 —— 換一條，位置一樣在身上
    const old = mh.querySelector('.mh-grab');
    if (old) old.remove();
    const grab = document.createElement('div');
    grab.className = 'mh-grab v';
    grab.title = '拖曳調整刊頭與卡片各佔多少';
    grab.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      mhSplit = { startX: ev.clientX, startFrac: m.side.frac, sh,
                  at: m.side.at, w: m.gridW };
      document.body.classList.add('mh-splitting');
      showMhTip(ev, (sh.mastheadW * m.side.frac).toFixed(1), m.blockHcm.toFixed(1),
                `卡片 ${(sh.mastheadW * (1 - m.side.frac)).toFixed(1)}cm`);
    });
    grab.addEventListener('click', ev => ev.stopPropagation());
    mh.appendChild(grab);

    // 站著的時候把手也站起來，貼在外側那一邊 —— 跟改比例那條各據一邊
    const move = document.createElement('div');
    move.className = 'mh-move v';
    move.textContent = '⋮⋮';
    move.title = '拖著它放到上／下／左／右，或點一下用選的';
    move.addEventListener('pointerdown', ev => startMhDrag(ev, sh));
    move.addEventListener('click', ev => ev.stopPropagation());
    mh.appendChild(move);

    frag.appendChild(mh);
  }
  frag.appendChild(dropLine);           // survives every rebuild
  boardEl.replaceChildren(frag);

  boardEl.style.setProperty('--z', sheetZoom);
  boardEl.style.setProperty('--rowh', m.rowH + 'px');   // 格子上的字跟著列高走
  boardEl.style.width = m.gridW + 'px';
  sizeSideMasthead(m);
  paintMhLabel(m);

  main.scrollLeft = keepL;              // stay where the user was looking
  main.scrollTop  = keepT;
}

function makeGrip(){
  const g = document.createElement('div');
  g.className = 'grip';
  g.textContent = '⋮⋮';
  g.title = '拖曳整列調換順序';
  return g;
}

/* ==========================================================================
   一列加一格／少一格
   排版排到一半才發現這一列少一支貨是常態。以前只能回 總體 改品類的數字，
   那是走回上一層去改一個跟眼前這一列有關的東西 —— 手離現場太遠。
   三個地方都給：設計的 落版、設計的 拼板、PM 的 拼板（版面是同一份，
   renderGrid 也是同一支，所以是同一組按鈕）。
   ＋ 加的那一格算在**這一列最後一格的品類**底下（總體那邊的數字跟著加），
   − 拿掉的是這一列最後一格。一列不會被減到 0，整個版位也不會被減到 0。
   ========================================================================== */
function makeRowBtns(at, count, total){
  const box = document.createElement('div');
  box.className = 'rowbtns';
  const mk = (act, txt, title, off) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.act = act;
    b.dataset.at = at;
    b.textContent = txt;
    b.title = title;
    b.disabled = off;
    return b;
  };
  box.append(
    mk('add', '+', `第 ${at + 1} 列加一格（現在 ${count} 格）`, count >= MAX_PER_ROW),
    mk('del', '−', `第 ${at + 1} 列少一格（現在 ${count} 格）`, count <= 1 || total <= 1));
  return box;
}

/** 這個版位下一個沒人用過的格子編號 —— id 是拿來認人的（便利貼、指派、蓋章都指名）。 */
function newCellId(block){
  let max = -1;
  ((block.sheet && block.sheet.cells) || []).forEach(c => {
    const m = String(c.id).match(/-c(\d+)$/);
    if (m) max = Math.max(max, +m[1]);
  });
  return block.id + '-c' + (max + 1);
}

/** 現在每列幾格。使用者搬過列就以那一份為準（sh.rows），沒搬過就照算出來的。 */
function rowCountsOf(block){
  const sh = sheetOf(block);
  const n = sh.cells.length;
  if (sh.rows && sh.rows.reduce((a, b) => a + b, 0) === n) return sh.rows.slice();
  return sheetMetrics(block).counts.slice();
}

function changeRowCells(block, at, delta){
  const sh = sheetOf(block);
  const counts = rowCountsOf(block);
  if (at < 0 || at >= counts.length) return;
  const start = counts.slice(0, at).reduce((a, b) => a + b, 0);

  if (delta > 0){
    if (counts[at] >= MAX_PER_ROW) return;
    /* 跟著同一列最後那一格走：同一列本來就是同一區的貨，品類、負責的 PM 都照抄。
       關（cell.st）不抄 —— 新的一格什麼都還沒有，它就該從第一關開始。 */
    const src = sh.cells[start + counts[at] - 1] || sh.cells[start] || { gi: 0 };
    const cell = { id: newCellId(block), gi: src.gi || 0, text: '' };
    if (src.pm) cell.pm = src.pm;
    sh.cells.splice(start + counts[at], 0, cell);
    const g = block.groups[cell.gi];
    if (g) g.count++;
  } else {
    if (counts[at] <= 1 || sh.cells.length <= 1) return;
    const idx = start + counts[at] - 1;
    const gone = sh.cells[idx];
    if (!gone) return;
    sh.cells.splice(idx, 1);
    const g = block.groups[gone.gi];
    if (g){
      g.count--;
      /* 一個品類被減到 0 就把它整條拿掉，後面的格子的 gi 跟著往前挪 ——
         留一個「刮鬍刀(0)」在總體上，只會讓人以為那裡還有東西要排。 */
      if (g.count <= 0){
        block.groups.splice(gone.gi, 1);
        sh.cells.forEach(c => { if (c.gi > gone.gi) c.gi--; });
      }
    }
  }
  /* 動過的那一份就是現在的排列，寫回去釘住 —— 不釘的話下一次重畫會照
     splitEven 重新分，剛加的那一格就跑到別列去了。 */
  counts[at] += delta;
  sh.rows = counts;
  mhRowLock = null;
  commitAction();
  rebuildAll(block.id);            // 總體的數字、小地圖、拼板的畫布一起跟上
}

/* 一下點擊只能是一件事：這兩顆按完就把事件收住，不然後面還接著
   「點格子＝開那一格／蓋章／指派」。 */
boardEl.addEventListener('click', e => {
  const b = e.target.closest('.rowbtns button');
  if (!b || !activeBlock) return;
  e.preventDefault();
  e.stopPropagation();
  changeRowCells(activeBlock, +b.dataset.at, b.dataset.act === 'add' ? 1 : -1);
});

/* ==========================================================================
   MASTHEAD
   One oversized full-width cell. It is a normal row, so REORDER drags it into
   position like any other. ✕ deletes it, ＋刊頭 (header) puts it back.
   ========================================================================== */

/* 拉刊頭時跟著游標的那行字。
   版位的總高（或總寬）是固定的，所以拉刊頭永遠是一筆交易：刊頭多吃一分，卡片就
   少一分。以前畫面上只看得到刊頭變長，卡片默默被壓扁 —— 兩邊一起寫出來，
   「列變扁」就從「怎麼突然這樣」變成你自己選的。 */
const mhTip = document.getElementById('mhTip');

/* w × h 兩個都寫，跟標題那一行講的是同一件事 —— 拖的時候看的是這裡，
   放手之後看的是上面，兩邊對不起來就等於在說謊。theirs 是交易的另一邊。 */
function showMhTip(e, w, h, theirs){
  mhTip.innerHTML = `刊頭 <span class="num">${w} × ${h}</span>cm`
                  + (theirs ? `<span class="sep">・</span>${theirs}` : '');
  const pad = 16;
  const r = mhTip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width  + 8 > innerWidth)  x = e.clientX - r.width  - pad;
  if (y + r.height + 8 > innerHeight) y = e.clientY - r.height - pad;
  mhTip.style.left = x + 'px';
  mhTip.style.top  = y + 'px';
}

/* 一格一格的列現在多高（公分）。pxPerCm 已經含縮放，rowH 也是，所以直接除。 */
function rowCmNow(){
  const m = lastMetrics;
  if (!m || !m.pxPerCm || !m.rowH) return null;
  return (m.rowH / m.pxPerCm).toFixed(1);
}

/* Live drag state for the 刊頭 edge. Deliberately NOT using pointer capture:
   each move re-renders the grid, which destroys the handle element, so the
   listeners live on the document and survive the rebuild. */
let mhResize = null, mhFrame = 0;

document.addEventListener('pointermove', e => {
  if (!mhResize) return;
  const dCm = (mhResize.dir || 1) * (e.clientY - mhResize.startY) / mhResize.pxPerCm;
  let v = mhResize.startH + dCm;
  v = Math.max(1, Math.min(mhResize.maxH, v));
  v = Math.round(v * 10) / 10;
  /* 位置先跟上游標（拉到頂了也要跟著手走，不然會以為卡住了）；
     數字等下面那個 rAF 重畫完再寫 —— 每列剩幾公分是 renderGrid 算出來的，
     在這裡先寫就會永遠慢一格。 */
  mhResize.lastE = { clientX: e.clientX, clientY: e.clientY };
  const rcNow = rowCmNow();
  showMhTip(e, mhResize.sh.mastheadW, v.toFixed(1),
            rcNow ? `每列 ${rcNow}cm` : '');
  if (v === mhResize.sh.mastheadH) return;
  mhResize.sh.mastheadH = v;

  if (!mhFrame) mhFrame = requestAnimationFrame(() => {
    mhFrame = 0;
    // update the number field in place rather than rebuilding the header
    const inp = blockHead.querySelector('.mh-num');
    if (inp) inp.value = mhResize ? mhResize.sh.mastheadH : inp.value;
    renderGrid(activeBlock);
    // 重畫完才有新的列高，這時候才寫得出「每列剩幾公分」
    if (mhResize && mhResize.lastE){
      const rc = rowCmNow();
      showMhTip(mhResize.lastE, mhResize.sh.mastheadW,
                mhResize.sh.mastheadH.toFixed(1), rc ? `每列 ${rc}cm` : '');
    }
  });
});
function endMhResize(){
  if (!mhResize) return;
  if (mhFrame){ cancelAnimationFrame(mhFrame); mhFrame = 0; }
  const changed = mhResize.sh.mastheadH !== mhResize.startH;
  mhResize = null;
  mhRowLock = null;                   // 放手了：該怎麼排就怎麼排
  document.body.classList.remove('mh-resizing');
  renderHead();                       // resync title/max/tooltip
  renderGrid(activeBlock);
  if (changed) commitAction();        // one step for the whole drag
}
document.addEventListener('pointerup', endMhResize);
document.addEventListener('pointercancel', endMhResize);

function buildMastheadRow(sh, heightPx, pxPerCm, maxHcm, atBottom){
  const row = document.createElement('div');
  row.className = 'row masthead-row';
  // height is decided by renderGrid, as the 刊頭's cm share of the block
  row.style.height = heightPx + 'px';
  /* 刊頭的 ⋮⋮ 跟卡片列的 ⋮⋮ 站在同一條線上，但它不是「往上下搬一列」：
     一抓起來，版位上就畫出四個落點，拖到哪一塊就放到哪裡。 */
  const grab = document.createElement('div');
  grab.className = 'grip mh-move';
  grab.textContent = '⋮⋮';
  grab.title = '拖著它放到上／下／左／右，或點一下用選的';
  grab.addEventListener('pointerdown', ev => startMhDrag(ev, sh));
  grab.addEventListener('click', ev => ev.stopPropagation());
  row.appendChild(grab);
  row.appendChild(buildMasthead(sh, pxPerCm, maxHcm, atBottom));
  return row;
}

/** 刊頭本體。 */
function buildMasthead(sh, pxPerCm, maxHcm, atBottom){
  const mh = document.createElement('div');
  mh.className = 'masthead' + (sh.masthead.image ? ' hasimg' : '')
               + (atBottom ? ' at-bottom' : '');
  mh.dataset.masthead = '1';

  if (sh.masthead.image){
    const img = document.createElement('img');
    img.src = sh.masthead.image;
    /* 讀不到的時候要說出來。圖只存網址（見 CLAUDE.md），網址會失效 ——
       檔案在 Storage 上被換掉、bucket 權限改了、或這份檔期是從別的地方帶進來的。
       不接的話畫面上就是一個瀏覽器自己的破圖示，沒有人知道那是「壞了」還是
       「還沒放」，也不知道還能不能點。所以換回那塊落點，並且講一句話。 */
    img.addEventListener('error', () => {
      if (!img.isConnected) return;
      mh.classList.remove('hasimg');
      const bad = document.createElement('span');
      bad.className = 'mh-label';
      bad.innerHTML = '<span class="mh-size">刊頭圖讀不到</span>' +
                      '<span class="mh-sub"> — 網址失效了，點一下重放一張</span>';
      img.replaceWith(bad);
    });
    mh.appendChild(img);
  } else {
    const lab = document.createElement('span');
    lab.className = 'mh-label';
    lab.innerHTML = '<span class="mh-size"></span>' +
                    '<span class="mh-sub"> — 拖曳圖片到這裡，或點擊選擇檔案</span>';
    mh.appendChild(lab);
  }

  const x = document.createElement('button');
  x.className = 'mh-x';
  x.textContent = '✕';
  x.title = '刪除刊頭';
  x.addEventListener('click', ev => {
    ev.stopPropagation();
    sh.masthead = null;
    sh.mhSide = null;                  // 站哪裡的記錄跟著刊頭一起走
    renderHead(); renderGrid(activeBlock);
    commitAction();                    // deleting a 刊頭 must be undoable
    toast('已刪除刊頭　⌘/Ctrl+Z 可復原', 'info', 2600);
  });
  mh.appendChild(x);

  /* 主視覺往往是最後才進來的那一張，那時候人已經在 拼板 排東西了 —— 所以換圖
     什麼時候都能換。（這裡以前擋在「版位鎖定」後面，那個鎖已經整條拿掉了。） */
  // click -> file picker
  mh.addEventListener('click', () => {
    mhFile.onchange = () => {
      const f = mhFile.files && mhFile.files[0];
      if (f) readImage(f, sh);
      mhFile.value = '';
    };
    mhFile.click();
  });

  // drag & drop
  ['dragenter','dragover'].forEach(t => mh.addEventListener(t, ev => {
    ev.preventDefault(); mh.classList.add('dropping');
  }));
  ['dragleave','drop'].forEach(t => mh.addEventListener(t, ev => {
    ev.preventDefault(); mh.classList.remove('dropping');
  }));
  mh.addEventListener('drop', ev => {
    const f = ev.dataTransfer && ev.dataTransfer.files[0];
    if (f && /^image\//.test(f.type)){ readImage(f, sh); return; }
    // a PDF or an .ai landing here is a mistake worth naming out loud
    if (f) flashReject(mh, '僅支援圖片');
  });

  // ---- pull the bottom edge to change 刊頭長度 ----
  const grab = document.createElement('div');
  grab.className = 'mh-grab';
  grab.title = atBottom ? '往上拖：刊頭變長' : '往下拖：刊頭變長';
  grab.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    ev.stopPropagation();             // don't start a row drag
    // 列數鎖在拖之前的樣子，放手才解開
    const m0 = sheetMetrics(activeBlock);
    mhRowLock = (m0 && m0.counts && m0.counts.length) ? m0.counts.slice() : null;
    /* dir：刊頭在最下面時，把手在上緣，往上拖才是變長 —— 邊往哪走、刊頭就往哪長，
       不然手勢跟結果是反的。 */
    // startH doubles as the value Esc reverts to
    mhResize = { startY: ev.clientY, startH: sh.mastheadH, pxPerCm, maxH: maxHcm, sh,
                 dir: atBottom ? -1 : 1 };
    document.body.classList.add('mh-resizing');
    // 一抓住就先把讀數擺到游標旁邊，不然它會在左上角閃一下才跟上來
    const rc0 = rowCmNow();
    showMhTip(ev, sh.mastheadW, sh.mastheadH.toFixed(1),
              rc0 ? `每列 ${rc0}cm` : '');
  });
  // the handle sits on the masthead, whose click opens the file picker
  grab.addEventListener('click', ev => ev.stopPropagation());
  mh.appendChild(grab);
  return mh;
}

/* ---- 拿起刊頭，指一個位置放下 -------------------------------------------
   一張版位上刊頭只有四個去處：上、下、左、右。與其拖著它去瞄準，不如直接把
   那四個位置畫出來讓你點 —— 拖曳會失手，指一下不會。 */
let mhPlacing = false;

function mhWhereNow(sh){
  if (sh.mhSide) return sh.mhSide.side === 'left' ? 'left' : 'right';
  /* 卡片有幾列：sh.rows 要拖過列才會凍結，還沒拖過就是 null。以前這裡把 null
     當 0 列，於是「排在第 0 列前面」（＝最上面）被判成 >= 0 ＝ 最下面 ——
     刊頭明明在上面，落點卻標「現在在下面」。 */
  const rows = (sh.rows && sh.rows.length) || cardRows().length || 1;
  return (sh.mastheadRow || 0) >= rows ? 'bottom' : 'top';
}

function closeMhPlacer(){
  if (!mhPlacing) return;
  mhPlacing = false;
  if (mhDrag) mhDrag.hot = null;
  boardEl.classList.remove('placing');
  document.getElementById('sheetPane').classList.remove('placing');
  boardEl.querySelectorAll('.mh-zone').forEach(z => z.remove());
}

function openMhPlacer(){
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);
  if (!sh.masthead) return;
  closeMhPlacer();
  mhPlacing = true;
  boardEl.classList.add('placing');
  document.getElementById('sheetPane').classList.add('placing');   // 標題讓開
  const at = mhWhereNow(sh);
  /* 四塊站在版位「外面」的空地上，一塊都不壓到卡片：位置本來就是「相對這張版
     的哪一邊」，畫在版外面才看得懂，而且底下那張版全程看得見。 */
  const GAP = '12px';
  const ZONES = [
    { key:'top',    label:'上', css:{ left:'25%', right:'25%', bottom:`calc(100% + ${GAP})`, height:'52px' } },
    { key:'bottom', label:'下', css:{ left:'25%', right:'25%', top:`calc(100% + ${GAP})`,    height:'52px' } },
    { key:'left',   label:'左', css:{ right:`calc(100% + ${GAP})`, top:'25%', bottom:'25%', width:'58px' } },
    { key:'right',  label:'右', css:{ left:`calc(100% + ${GAP})`,  top:'25%', bottom:'25%', width:'58px' } }
  ];
  ZONES.forEach(z => {
    const el = document.createElement('div');
    el.className = 'mh-zone' + (z.key === at ? ' here' : '');
    el.dataset.zone = z.key;
    el.innerHTML = z.label + (z.key === at ? '<span class="now">（現在在這裡）</span>' : '');
    Object.assign(el.style, z.css);
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      placeMasthead(z.key);
    });
    boardEl.appendChild(el);
  });
  toast('刊頭要放哪裡？拖過去放手，或點一個位置（Esc 取消）', 'info', 2200);
}

/* ---- 拖著把手丟到落點上 ------------------------------------------------
   位置只有四個，所以拖曳不必瞄準座標，只要落在那四塊的其中一塊上。
   一抓起來就把四塊畫出來；沒有移動就當作「點一下」，四塊留在畫面上讓你選。 */
let mhDrag = null;

function startMhDrag(ev, sh){
  if (ev.button !== 0) return;
  ev.preventDefault();
  ev.stopPropagation();               // 這不是搬一列，也不是拖畫面
  openMhPlacer();
  mhDrag = { x: ev.clientX, y: ev.clientY, moved: false, hot: null };
}

function hotZone(el){
  if (mhDrag.hot === el) return;
  if (mhDrag.hot) mhDrag.hot.classList.remove('hot');
  mhDrag.hot = el;
  if (el) el.classList.add('hot');
}

/* 位置只有四個，所以不必真的碰到那一塊 —— 拖到它附近就算數，不要叫人去瞄準。
   四塊的範圍放大之後會互相重疊，重疊的地方**就近的那一塊贏**：照 DOM 順序挑
   的話「上」會把中間整片通吃，明明比較靠近「左」也還是選到「上」。
   放大的只有判定範圍，畫出來的方塊沒有變 —— 看到的還是那四塊。 */
const ZONE_REACH = 90;
function nearestZone(x, y){
  let best = null, bestD = Infinity;
  boardEl.querySelectorAll('.mh-zone').forEach(el => {
    const r = el.getBoundingClientRect();
    if (x < r.left - ZONE_REACH || x > r.right  + ZONE_REACH ||
        y < r.top  - ZONE_REACH || y > r.bottom + ZONE_REACH) return;
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = el; }
  });
  return best;
}

document.addEventListener('pointermove', e => {
  if (!mhDrag) return;
  if (!mhDrag.moved){
    if (Math.abs(e.clientX - mhDrag.x) + Math.abs(e.clientY - mhDrag.y) < 4) return;
    mhDrag.moved = true;
  }
  hotZone(nearestZone(e.clientX, e.clientY));
});

function endMhDrag(){
  if (!mhDrag) return;
  const { moved, hot } = mhDrag;
  mhDrag = null;
  if (hot){ hot.classList.remove('hot'); placeMasthead(hot.dataset.zone); return; }
  // 拖出去又沒落在任何一塊上＝放棄；完全沒動＝改用點的，四塊就留著
  if (moved) closeMhPlacer();
}
document.addEventListener('pointerup', endMhDrag);
document.addEventListener('pointercancel', endMhDrag);

/** 放下去：上下是一條橫帶（差在排在第幾列），左右是站在卡片旁邊的一根柱子。 */
function placeMasthead(where){
  const sh = activeBlock && sheetOf(activeBlock);
  if (!sh || !sh.masthead) return;
  const was = mhWhereNow(sh);
  closeMhPlacer();
  if (where === was) return;

  if (where === 'left' || where === 'right'){
    sh.mhSide = { side: where, frac: (sh.mhSide && sh.mhSide.frac) || .3 };
  } else {
    sh.mhSide = null;
    // 上＝排在第一列前面；下＝排在最後（大一點的數字，renderGrid 會夾回列數）
    sh.mastheadRow = where === 'top' ? 0 : 999;
  }
  renderHead();
  boardSig = null;
  renderGrid(activeBlock);
  commitAction();
  toast(`刊頭放到${{ top:'上面', bottom:'下面', left:'左邊', right:'右邊' }[where]}了`, 'ok', 1800);
}

/* ---- 中間那條縫：左右拖，改兩邊各佔幾成 -------------------------------
   拖的時候卡片那一塊會跟著變窄或變寬，列數自己重算 —— 卡片永遠是一整塊，
   只是換個形狀去填滿它那半邊。 */
let mhSplit = null;

document.addEventListener('pointermove', e => {
  if (!mhSplit) return;
  const dx = (mhSplit.at === 'left' ? 1 : -1) * (e.clientX - mhSplit.startX);
  const frac = clampSideFrac(mhSplit.startFrac + dx / Math.max(1, mhSplit.w));
  /* 站著的時候換的是寬度，交易的另一邊是卡片那一柱 —— 兩個加起來就是版位的寬。
     高度不變（站著就是滿高），但照樣寫出來：讀數講的是這塊東西的規格。 */
  const W = mhSplit.sh.mastheadW;
  const Hcm = (lastMetrics && lastMetrics.blockHcm) || 0;
  showMhTip(e, (W * frac).toFixed(1), Hcm.toFixed(1),
            `卡片 ${(W * (1 - frac)).toFixed(1)}cm`);
  if (Math.abs(frac - (mhSplit.sh.mhSide.frac || 0)) < .004) return;
  mhSplit.sh.mhSide.frac = frac;
  mhSplit.sh.rows = null;              // 換寬度就換分列，凍住的那份要放掉
  renderGrid(activeBlock);
  /* 標題上那個寬度是這條縫唯一的數字讀數，拖的時候就得跟著動。
     只改那一格的字、不重建整條標題 —— 重建會把焦點和游標一起清掉（刊頭高度那條
     也是為了同一件事才改字不重建）。以前這裡完全沒更新，於是拖完縫，標題還停在
     拖之前的公分數，看起來像「這條縫沒有真的改到東西」。 */
  const w = blockHead.querySelector('.mh-fixed');
  if (w) w.textContent = (mhSplit.sh.mastheadW * frac).toFixed(1);
});

function endMhSplit(){
  if (!mhSplit) return;
  const changed = mhSplit.sh.mhSide.frac !== mhSplit.startFrac;
  mhSplit = null;
  document.body.classList.remove('mh-splitting');
  renderHead();                        // 放手後整條重算一次（上限、tooltip 都跟著）
  if (changed) commitAction();
}
document.addEventListener('pointerup', endMhSplit);
document.addEventListener('pointercancel', endMhSplit);

/* 刊頭要換位置一律走 ⤧ 那個四選一（openMhPlacer）：位置只有四個，是選的，
   不是拖的。拖曳留給真正連續的量 —— 橫帶的高度、柱子佔幾成。 */

/* 刊頭圖跟商品圖走同一條路：傳去 Storage，plan 裡只留一串網址。
   以前是整張 base64 存進 sh.masthead.image，於是那幾 MB 跟著 plan 進 localStorage、
   跟著每一次存檔重傳一遍、還被歷史那 50 份快照各留一份 —— 儲存空間爆掉的
   toast（見 flushSave）就是這樣來的。
   沒接後端時照舊存 base64：這支程式的前提是「瀏覽器直接開就是完整的程式」，
   不能因為沒有資料庫就換不了刊頭。舊檔期存的 data: 網址照樣顯示，不用轉。 */
function readImage(file, sh){
  const done = src => {
    sh.masthead.image = src;
    /* 換第二張圖的時候，版面簽名（sheetSig 裡只記「有圖／沒圖／沒刊頭」）根本沒變，
       renderGrid 就走「只改大小」那條快路，完全不重建那個 <img> —— 畫面於是停在
       上一張，看起來像這一下沒有反應。第一張放得進去只是因為 沒圖→有圖 剛好動到簽名。
       本來只補一句「直接把 src 換掉」，但那要求那個 <img> 還在：讀不到的圖已經被
       換成一塊「讀不到」的字了（見 buildMasthead 的 error），這時候 live 是 null，
       於是**再放一張好圖也回不來**。所以改成記一個版次，簽名跟著它變、該重建就重建。
       （簽名裡還是不放圖的網址：base64 的刊頭圖是好幾 MB，每次重排都要比對一次。） */
    sh.mhRev = (sh.mhRev || 0) + 1;
    const live = boardEl.querySelector('.masthead img');
    if (live) live.src = src;                 // 重建之前先換掉，畫面不會閃一下舊圖
    renderGrid(activeBlock);
    /* 換圖會讓 renderGrid 整張重建（版面簽名裡有「刊頭有沒有圖」），而 拼板 的
       畫布是掛在那些格子上的 —— 不補畫一次，放完圖整張版就變成一片空格。 */
    if (activeTab === 'board') paintBoardThumbs();
    commitAction();
  };
  const s = sync();
  if (s && s.uploadImage){
    /* Storage 的檔名是**這一塊版位**，不是使用者那個檔案叫什麼。
       上傳是 x-upsert（同名蓋掉），而檔名一樣就是同一個物件 —— 用使用者的檔名，
       兩個版位各放一張都叫 `banner.png`／`IMG_0001.jpg`（截圖、手機照片天天撞名）
       就會蓋成同一張：後放的那張會把先放的那個版位的刊頭換掉，而先放的那邊
       什麼事都沒發生過，只是圖突然變成別人的。
       換成 版位 id：同一塊重放才蓋掉自己（那正是要的），別塊永遠撞不到。 */
    const ext = (String(file.name || '').match(/\.[A-Za-z0-9]+$/) || ['.png'])[0];
    const key = 'masthead-' + ((currentPlan && currentPlan.id) || 'plan')
              + '-' + ((activeBlock && activeBlock.id) || 'blk') + ext;
    s.uploadImage(key, file)
     .then(done)
     .catch(err => toast('刊頭圖上傳失敗：' + ((err && err.message) || err), 'warn', 4000));
    return;
  }
  const fr = new FileReader();
  fr.onload = () => done(fr.result);
  fr.readAsDataURL(file);
}

/* ---- feedback for input the sheet is refusing ---- */

/** Brief red flash + message on a drop zone that rejected what it was given. */
function flashReject(el, msg){
  const keep = el.classList.contains('hasimg') ? null : el.firstChild;
  const was = keep && keep.nodeType === 3 ? keep.nodeValue : null;
  el.classList.add('reject');
  if (was != null) keep.nodeValue = msg;
  toast(msg, 'warn', 1800);
  setTimeout(() => {
    el.classList.remove('reject');
    if (was != null && keep.isConnected) keep.nodeValue = was;
  }, 900);
}

/* ==========================================================================
   REORDER
   Row drag is grid-reorder.html's mechanic: pointer capture, translateY
   follow, midpoint-swap while-loops, snap back on endDrag. One deviation —
   the demo assumes uniform rows and precomputes a single `step`; the masthead
   row is taller, so the threshold reads the neighbour's own height.
   Cell drag reuses the same idea, resolved by hit-testing.
   ========================================================================== */

let rowDrag = null;
let cellDrag = null;

/* ==========================================================================
   SLIDE (FLIP)
   Re-ordering happens by rewriting the DOM, and no CSS transition can animate
   that — the browser simply paints the new arrangement. So: measure where
   things were, let the layout land, then transform each element back to its
   old position and release it. The card travels instead of teleporting.
   Deliberately quick; this is feedback, not choreography.
   ========================================================================== */

const SLIDE_MS = 190;
const SLIDE_EASE = 'cubic-bezier(.22,.61,.36,1)';   // decelerate into place
const noMotion = !!(window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/** 版面要換一種排法時包在這裡：先記下每一塊在哪，換完再讓它們從舊位置滑過去。
    刊頭換位置已經不走這條路了（換位置時列高、格數同時在變，滑動追不上，
    看起來像壞掉）—— 留著給列與列之間那種「東西移過去了」的動作用。 */
function flipBoard(change){
  const was = new Map();
  boardEl.querySelectorAll('.cell').forEach(el =>
    was.set(el.dataset.cellId, el.getBoundingClientRect()));
  const mhWas = boardEl.querySelector('.masthead');
  if (mhWas) was.set('\u0000mh', mhWas.getBoundingClientRect());

  change();

  boardEl.querySelectorAll('.cell').forEach(el => {
    const b = was.get(el.dataset.cellId);
    if (!b) return;
    const a = el.getBoundingClientRect();
    slideFrom(el, b.left - a.left, b.top - a.top);
  });
  const mhNow = boardEl.querySelector('.masthead');
  const bm = was.get('\u0000mh');
  if (mhNow && bm){
    const a = mhNow.getBoundingClientRect();
    slideFrom(mhNow, bm.left - a.left, bm.top - a.top);
  }
}

/** The element is already at its new home — slide it in from (dx,dy) away. */
function slideFrom(el, dx, dy){
  if (noMotion || (!dx && !dy)) return;
  el.style.transition = 'none';
  el.style.transform = `translate(${dx}px, ${dy}px)`;
  requestAnimationFrame(() => {
    el.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
    el.style.transform = '';
    setTimeout(() => { el.style.transition = ''; }, SLIDE_MS + 40);
  });
}

/** Let go of an element that is currently translated, easing it back to rest. */
function slideHome(el){
  if (noMotion){ el.style.transform = ''; return; }
  el.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
  el.style.transform = '';
  setTimeout(() => { el.style.transition = ''; }, SLIDE_MS + 40);
}

/** Cut every animation short. A new gesture must measure where things ARE,
    not where they are halfway to — otherwise drop targets land wrong. */
function settleSlides(){
  boardEl.querySelectorAll('.cell, .row').forEach(el => {
    if (el.style.transition || el.style.transform){
      el.style.transition = '';
      el.style.transform = '';
    }
  });
}

/** Card positions before a re-render, keyed by id so they survive the rebuild. */
function captureCells(){
  const m = new Map();
  if (noMotion) return m;
  boardEl.querySelectorAll('.cell').forEach(el => {
    const r = el.getBoundingClientRect();
    m.set(el.dataset.cellId, r);
  });
  return m;
}

/** Play every card from where it used to be to where it now is. */
function playCells(prev){
  if (noMotion || !prev.size) return;
  const moved = [];
  boardEl.querySelectorAll('.cell').forEach(el => {
    const a = prev.get(el.dataset.cellId);
    if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    moved.push(el);
  });
  if (!moved.length) return;
  // one frame for the inverted transform to stick, then release them together
  requestAnimationFrame(() => {
    moved.forEach(el => {
      el.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
      el.style.transform = '';
    });
    setTimeout(() => moved.forEach(el => { el.style.transition = ''; }), SLIDE_MS + 40);
  });
}

/* Sibling walks that skip non-rows — #board also holds the drop line and the
   merged grip, and treating those as rows would let a drag jump past them. */
const nextRow = el => { let n = el.nextElementSibling;
  while (n && !n.classList.contains('row')) n = n.nextElementSibling; return n; };
const prevRow = el => { let p = el.previousElementSibling;
  while (p && !p.classList.contains('row')) p = p.previousElementSibling; return p; };
const cardRows = () => [...boardEl.children].filter(r =>
  r.classList.contains('row') && !r.classList.contains('masthead-row'));


/** After any move, rewrite the block's cell-order array from the DOM (spec §4). */
function syncOrderFromDOM(){
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);
  const byId = new Map(sh.cells.map(c => [c.id, c]));
  const next = [];
  boardEl.querySelectorAll('.cell').forEach(el => {
    const c = byId.get(el.dataset.cellId);
    if (c) next.push(c);
  });
  if (next.length === sh.cells.length) sh.cells = next;

  // freeze how the cells are split across rows, or the next render re-derives
  // it from the pane size and throws the drag away
  sh.rows = cardRows().map(r => r.querySelectorAll('.cell').length);

  const mhIdx = [...boardEl.children].findIndex(r => r.classList.contains('masthead-row'));
  if (mhIdx >= 0) sh.mastheadRow = mhIdx;

}

/* 這一組手勢是 落版 的：搬列、搬卡片、鎖定後的拒絕動作、還有「確認後才能打字」
   那句提示。拼板 借的是同一份格子 DOM，所以這裡一定要先問「現在在哪一頁」——
   不問的話，PM 在拼板上點一格，跳出來的會是落版的規矩。 */
boardEl.addEventListener('pointerdown', e => {
  /* 看版 的時候 拼板 的格子有它自己的用法（點一格＝開面板），這裡不插手。
     但拿起 搬移／複製 之後，那就跟在 落版 上做的是同一件事 —— 同一條路。 */
  if (activeTab !== 'sheet' && !(activeTab === 'board' && activeTool === 'move')) return;
  if (!activeBlock) return;
  if (handMode) return;                  // 空白鍵 pan owns the pointer
  /* 指派中，這一下講的是「框哪幾格」，不是搬列也不是換格子的位置 —— 讓位，
     跟蓋章在 拼板 讓掉平移是同一個理由：一個手勢不能同時是兩件事。 */
  if (assignMode && assignable()) return;
  settleSlides();                        // measure reality, not a mid-flight frame

  // 整列永遠可搬（⋮⋮）；單張卡片互換是 搬移 工具的事，兩個手勢各走各的
  const grip = e.target.closest('.grip');
  if (grip){
    const row = grip.closest('.row');
    if (!row) return;
    e.preventDefault();
    /* Every steppable row is a card row and they all carry the same height
       (the 刊頭 is a wall a drag can never cross), so one measurement here
       replaces an offsetHeight read per neighbour per move. */
    if (row.classList.contains('masthead-row')) return;   // 刊頭換位置走 ⤧，不用拖的
    rowDrag = { row, startY: e.clientY, startX: e.clientX,
                step: (cardRows()[0] || row).offsetHeight + ROW_GAP };
    row.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
    return;
  }

  // 卡片只有拿著 搬移 的時候才拖得動 —— 平常那一下是「點進去」
  const cell = e.target.closest('.cell');
  if (cell && activeTool === 'move'){
    e.preventDefault();
    cellDrag = { cell, mode: null, target: null, before: false, rects: measureCells() };
    cell.classList.add('cell-dragging');
    cell.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  }
});

boardEl.addEventListener('pointermove', e => {
  // 拖到一半就別再問在哪一頁了 —— 手勢已經開始，讓它走完（拼板 也用得到）
  if (activeTab !== 'sheet' && !rowDrag && !cellDrag) return;
  /* ---- row reorder (grid-reorder.html) ---- */
  if (rowDrag){
    const { row } = rowDrag;
    let dy = e.clientY - rowDrag.startY;

    // card rows step past each other as in the demo — but the 刊頭 is a wall,
    // so a card row can never cross to its far side either
    /* The row being dragged follows the pointer, but the one it displaces is
       moved by rewriting the DOM — so it is slid in from where it just was
       rather than being repainted in its new slot. */
    const step = rowDrag.step;
    let next = nextRow(row);
    while (next && !next.classList.contains('masthead-row') && dy > step / 2){
      next.after(row);
      slideFrom(next, 0, step);          // it shifted up by one row
      rowDrag.startY += step;
      dy -= step;
      next = nextRow(row);
    }
    let prev = prevRow(row);
    while (prev && !prev.classList.contains('masthead-row') && dy < -step / 2){
      prev.before(row);
      slideFrom(prev, 0, -step);         // it shifted down by one row
      rowDrag.startY -= step;
      dy += step;
      prev = prevRow(row);
    }
    row.style.transform = 'translateY(' + dy + 'px)';
    return;
  }

  /* ---- card drag: insert at the nearest boundary ----
     Nothing moves during the drag; we only preview the intent, then commit
     to the cell array on release. */
  if (cellDrag){
    const hit = resolveTarget(cellDrag.rects, e.clientX, e.clientY);
    const target = hit && hit.el;

    clearDropFeedback();

    if (!target || target === cellDrag.cell){
      cellDrag.mode = null; cellDrag.target = null;
      return;
    }
    // clamped: a pointer in the gap sits outside the card, which should still
    // read as "at that edge" rather than falling off the scale
    const rel = Math.max(0, Math.min(1, (e.clientX - hit.l) / hit.w));

    /* The middle of a card is its own target: land there and the two cards
       trade places, keeping every other card put. The outer thirds still
       insert, so re-ordering a run of cards works as before. */
    if (rel > SWAP_BAND && rel < 1 - SWAP_BAND){
      cellDrag.mode = 'swap'; cellDrag.target = target;
      target.classList.add('cell-target');
      highlighted = target;
      return;
    }
    cellDrag.mode = 'insert'; cellDrag.target = target;
    cellDrag.before = rel <= 0.5;          // whichever side of the card is nearer
    showDropLine(target, cellDrag.before);
  }
});

function endRowCellDrag(e){
  if (activeTab !== 'sheet' && !rowDrag && !cellDrag) return;
  if (rowDrag){
    const row = rowDrag.row;
    slideHome(row);                             // ease into the slot, not snap
    /* .dragging carries the z-index, so it has to outlive the slide or the row
       would duck under its neighbours on the way down. Bail out if the same
       row has been grabbed again in the meantime. */
    setTimeout(() => { if (!rowDrag || rowDrag.row !== row) row.classList.remove('dragging'); },
               noMotion ? 0 : SLIDE_MS);
    rowDrag = null;
    document.body.style.userSelect = '';
    syncOrderFromDOM();
    commitAction();
  }
  if (cellDrag){
    const { cell, mode, target, before } = cellDrag;
    cell.classList.remove('cell-dragging');
    clearDropFeedback();
    document.body.style.userSelect = '';
    cellDrag = null;

    // commit the intent previewed during the drag
    const sh = sheetOf(activeBlock);
    const from = sh.cells.findIndex(c => c.id === cell.dataset.cellId);
    if (mode && target && from >= 0){
      const toId = target.dataset.cellId;
      const to = sh.cells.findIndex(c => c.id === toId);
      if (to >= 0){
        const was = captureCells();          // where every card sits right now
        if (mode === 'swap'){
          // straight trade — nothing else on the sheet shifts
          [sh.cells[from], sh.cells[to]] = [sh.cells[to], sh.cells[from]];
        } else {
          const [moved] = sh.cells.splice(from, 1);
          // re-find after the removal so the index stays valid
          let idx = sh.cells.findIndex(c => c.id === toId);
          if (!before) idx += 1;
          sh.cells.splice(idx, 0, moved);
        }
        /* 拼板 走它自己的重畫，畫布和貼紙才會跟著回來。那邊也不播滑動動畫：
           格子裡是 iframe，一格一格滑過去既貴、又會讓畫布在半路重載。 */
        if (activeTab === 'board') redrawSheet();
        else { renderGrid(activeBlock); playCells(was); }
        commitAction();
      }
    }
  }
}
boardEl.addEventListener('pointerup', endRowCellDrag);
boardEl.addEventListener('pointercancel', endRowCellDrag);

/* ==========================================================================
   TOOLS (工具 rail)
   搬移 — drag a card onto the MIDDLE of another and the two trade places
          (blockswap.html's model); drop on either outer third and it inserts
          at that boundary instead. The insert zones of two neighbours meet
          across the gap between them, so the whole space between cards is one
          continuous target with no dead spot, marked by a single line down the
          gap. Swapping matters here because the cards carry typed copy — it
          moves one product without pushing every card after it along.
   縮放 — wheel scales the grid. Zoom is applied to the COMPUTED layout
          (widths/heights/type), not as a CSS transform, so every pointer
          coordinate stays in real px and the drag maths needs no scale term.
   選取 — drags off; for reading the grid without disturbing it.
   ========================================================================== */

/* 上限放到 6 倍：拼板 要看清楚一格裡的價格和 SKU，2.5 倍根本不夠近 */
/* 上限 6 → 14：拼一格的時候常常要湊很近看價格對不對齊、SKU 有沒有落在框裡，
   六倍就到頂了。縮放只是把畫面拉近看，不會改變印出來的東西，所以放寬沒有代價。 */
const ZOOM_MIN = 0.4, ZOOM_MAX = 14, ZOOM_STEP = 1.12;
/* outer third of a card inserts, the middle third swaps */
const SWAP_BAND = 1 / 3;
let activeTool = 'edit';     // 預設是「在格子裡搬零件」；搬移要鎖定後才出現
let sheetZoom = 1;

const zoomVal = document.getElementById('zoomVal');

/* the blue insert indicator, re-attached by renderGrid on every rebuild */
const dropLine = document.createElement('div');
dropLine.className = 'drop-line';

const prevCell = el => { let p = el.previousElementSibling;
  while (p && !p.classList.contains('cell')) p = p.previousElementSibling; return p; };
const nextCell = el => { let n = el.nextElementSibling;
  while (n && !n.classList.contains('cell')) n = n.nextElementSibling; return n; };

/* Nothing on the board moves for the whole of a card drag, so every card is
   measured once at pointerdown. Hit-testing then costs arithmetic instead of
   an elementFromPoint plus a getBoundingClientRect per card per pointermove,
   each of which forces the browser to flush layout. */
function measureCells(){
  const out = [];
  boardEl.querySelectorAll('.cell').forEach(el => {
    const r = el.getBoundingClientRect();
    out.push({ el, l: r.left, t: r.top, rt: r.right, b: r.bottom, w: r.width });
  });
  return out;
}

/** Nearest card to the pointer — so the gaps between cards are never dead. */
function resolveTarget(rects, x, y){
  let best = null, bestD = Infinity;
  for (const c of rects){
    // inside the card: an exact hit, nothing can beat it
    if (x >= c.l && x <= c.rt && y >= c.t && y <= c.b) return c;
    const dx = x < c.l ? c.l - x : x > c.rt ? x - c.rt : 0;
    const dy = y < c.t ? c.t - y : y > c.b ? y - c.b : 0;
    const d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = c; }
  }
  return best;
}

/* One line per boundary: drawn down the MIDDLE of the gap, so approaching
   from either neighbouring card marks the same insertion point. */
function showDropLine(target, before){
  const br = boardEl.getBoundingClientRect();
  const r = target.getBoundingClientRect();
  const nb = before ? prevCell(target) : nextCell(target);

  let x;
  if (nb){
    const nr = nb.getBoundingClientRect();
    x = before ? (nr.right + r.left) / 2 : (r.right + nr.left) / 2;
  } else {
    x = before ? r.left - 3 : r.right + 3;      // outer edge of the row
  }

  const rowEl = target.closest('.row');
  const rr = rowEl ? rowEl.getBoundingClientRect() : r;
  // appearing from nowhere must not animate; moving between boundaries should
  dropLine.style.transition = dropLine.style.display === 'block' ? '' : 'none';
  dropLine.style.display = 'block';
  dropLine.style.left = (x - br.left - 1.5) + 'px';
  dropLine.style.top = (rr.top - br.top) + 'px';
  dropLine.style.height = rr.height + 'px';
}
/* At most one card is ever highlighted, so hold onto it rather than sweeping
   the whole board for the class on every pointermove. */
let highlighted = null;
function clearDropFeedback(){
  dropLine.style.display = 'none';
  if (highlighted){ highlighted.classList.remove('cell-target'); highlighted = null; }
}

/* Each hint is the same three zones so the eye always lands in the same place:
   which tool it is, the single thing it does, then at most two keys. Anything
   rarer stays in the shortcut table at the top of this script instead of
   crowding the bar — the old one-line-of-everything version was unreadable. */
const hint = (ico, name, key, main, keys) =>
  `<span class="ico">${ico}</span>` +
  `<span class="hint-name">${name}<kbd>${key}</kbd></span>` +
  `<span class="hint-main">${main}</span>` +
  `<span class="hint-keys">${keys.join('')}</span>`;

const HINTS = {
  move: hint('⇄', '搬移', 'V',
    '拖曳卡片：放在<b>中央</b>兩張互換，放在<b>邊緣</b>插入',
    ['<span><kbd>按住空白鍵</kbd>拖曳移動畫面</span>', '<span><kbd>Esc</kbd>取消</span>']),

  edit: hint('✥', '選零件', 'S',
    '在格子裡選、拖<b>品名／價格／商品圖</b>；拖格子以外的空地移動畫面',
    ['<span><kbd>Alt</kbd>這一下不要吸</span>']),

  pan: hint('✋', '拖畫面', 'D',
    '拖<b>哪裡都是移動畫面</b>，包括格子上：不怕碰到格子裡的東西',
    ['<span><kbd>⌘/Ctrl+0</kbd>符合視窗</span>']),



  /* 這一個不是工具，是開關（見 .tgl）—— 但滑過去一樣要講得出自己在做什麼 */
  gridsnap: hint('⊞', '顯示格線', 'G',
    '開著就一直鋪一層<b>格線</b>給你看，關著就沒有。它<b>只是尺</b>，零件不會被吸到線上',
    ['<span><kbd>Alt</kbd>連對齊線也不吸</span>'])
};

/* 滑過工具才出現的小提示，貼在那一顆旁邊。圖示只有一個符號，猜錯的代價是
   「換了工具、動到東西、再換回來」—— 所以它要在你按下去之前就講完。
   用自己的 tooltip 不用瀏覽器的 title：title 要等一秒才出來，而且排不進
   快捷鍵那一行。 */
function showHint(name, anchor){
  const el = document.getElementById('toolHint');
  if (!name || !HINTS[name]){ el.style.display = 'none'; return; }
  el.innerHTML = HINTS[name];
  el.style.display = 'block';
  /* 先量再擺：內容是剛剛才換的，寬高要重新問一次。
     擺在工具的右邊、垂直對齊它；貼到視窗邊就往回收。 */
  const a = anchor.getBoundingClientRect(), r = el.getBoundingClientRect();
  let x = a.right + 10;
  if (x + r.width > innerWidth - 8) x = Math.max(8, a.left - r.width - 10);
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(Math.min(Math.max(8, a.top + a.height / 2 - r.height / 2),
                                      innerHeight - r.height - 8)) + 'px';
  el.classList.remove('pop');
  void el.offsetWidth;                 // restart the animation
  el.classList.add('pop');
  syncZoomHint();
}
function hideHint(){ document.getElementById('toolHint').style.display = 'none'; }

/* 綁在工具列上（事件委派），不是綁在每一顆按鈕上 —— 按鈕會被 syncTools 顯示／隱藏，
   一顆一顆綁的話，之後多一顆工具就多一個「忘記綁」的機會。 */
const toolRailEl = document.getElementById('toolRail');
toolRailEl.addEventListener('mouseover', e => {
  const b = e.target.closest && e.target.closest('.tool,#snapBtn');
  if (!b) return;
  showHint(b.id === 'snapBtn' ? 'gridsnap' : b.dataset.tool, b);
});
toolRailEl.addEventListener('mouseout', e => {
  const b = e.target.closest && e.target.closest('.tool,#snapBtn');
  if (b && !(e.relatedTarget && b.contains(e.relatedTarget))) hideHint();
});
toolRailEl.addEventListener('mouseleave', hideHint);
// 換了工具就把提示收起來：那一刻你已經知道自己拿了什麼，留著只會擋住版面
document.addEventListener('pointerdown', hideHint, true);

function syncZoomHint(){
  const z = document.getElementById('hintZoom');
  if (z) z.textContent = Math.round(sheetZoom * 100) + '%';
}

/* 搬移 only makes sense once the rows are settled. PS greys out a tool that
   cannot be used rather than removing it, so the button stays put and says
   why it is unavailable. */
function syncTools(){
  const tool = n => document.querySelector(`.tool[data-tool="${n}"]`);
  const moveBtn = tool('move');
  /* 搬移一直都在。以前要「確認列排列」之後才開得起來 —— 那顆鈕現在只剩「送給 PM」，
     不再是一道把版面凍住的門，工具就沒有理由跟著它開關。 */
  if (moveBtn){
    moveBtn.disabled = false;
    moveBtn.style.display = '';
    moveBtn.title = '搬移 (V)：拖到卡片中央＝交換，拖到邊緣＝插入';
  }
  /* 工具列不因身分收起來。收過一版（行銷在 拼板 整條藏掉），後來收回：
     少一半的按鈕會讓人以為是壞了或載不完全，而「這一下做不做得到」本來就有
     擋在動作那一層（開格子、蓋章、貼紙、畫布裡的零件都各自問過身分了）。 */
  const rail = document.getElementById('toolRail');
  if (rail) rail.style.display = '';
}

/* ==========================================================================
   整格複製（照 cell_clipboard_demo 那支的做法：一格就是一份東西）
   同一支商品常常要在版上出現好幾次。點一格、Ctrl+C，再點另一格、Ctrl+V，
   品名和拼好的內容一起過去 —— 貼紙不跟，那是留言，不是版面的一部分。
   ========================================================================== */

const cellById = id => (activeBlock ? (sheetOf(activeBlock).cells || []) : [])
  .find(c => String(c.id) === String(id));

function setTool(name){
  activeTool = name;
  document.querySelectorAll('.tool').forEach(t =>
    t.classList.toggle('active', t.dataset.tool === name));
  sheetMainEl.classList.toggle('tool-zoom', name === 'pan');
  sheetMainEl.classList.toggle('tool-move', name === 'move');
  /* 拼板 那一層平常關著滑鼠（只留格子當入口）。拿起會動到版面的工具就把整張版
     還給滑鼠。用 getElementById 不用上面那個 const boardOv —— 那個宣告在這個
     函式下面，開機時 setTool 會比它早跑到。 */
  const ov = document.getElementById('boardOverview');
  if (ov) ov.classList.toggle('tooling', name !== 'edit');
}
document.querySelectorAll('.tool').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool)));

/* ==========================================================================
   ZOOM — one path for the wheel, the keyboard and the 縮放 tool's clicks
   ========================================================================== */

/** 重畫這張版。在 拼板 時要走 拼板 那條路，畫布和貼紙才會跟著回來。 */
function redrawSheet(){
  if (activeTab === 'board') reflowBoard();
  else renderGrid(activeBlock);
}

/** Apply a new zoom, keeping the point under (cx,cy) where it is. Client
    coords; omit them and the centre of the pane is held instead. */
/* 縮放要「釘住游標下那一點」。本來的算法把縮放當成「以捲動原點為中心的等比例放大」
   （scrollLeft = px*k - ax），但這裡兩個前提都不成立：#sheetMain 四周有一大圈
   padding（30vh／40%，見 centreSheet），而且版面比視窗窄的時候是**置中**的 ——
   版面的左上角會跟著大小移動，不是釘在原點。所以那個模型算出來的捲動量是錯的，
   看起來就是「一縮放整張版就跳到中間」。

   改成量出來再修正：先記下游標落在版面的哪一個比例位置（0～1），重畫之後量那一點
   現在畫在哪裡，差多少就捲多少。不必假設任何模型 —— padding、置中、reflow
   全部自動成立。 */
function zoomKeepPoint(clientX, clientY, redraw){
  const r0 = boardEl.getBoundingClientRect();
  const fx = r0.width  ? (clientX - r0.left) / r0.width  : .5;
  const fy = r0.height ? (clientY - r0.top)  / r0.height : .5;
  redraw();
  const r1 = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (r1.left + fx * r1.width)  - clientX;
  sheetMainEl.scrollTop  += (r1.top  + fy * r1.height) - clientY;
}

/* ---- 滾輪縮放：把游標指的那一塊帶到眼前 ---------------------------------
   來歷和量測見 zoom-at-cursor-demo.html。純粹釘在游標下（一般地圖那種）在這裡不夠
   用：指著右下角那一格滾，它就一路在右下角長大，看得到卻永遠沒被端到面前。所以每滾
   一發除了放大，還把目標往視窗中央收 ZOOM_PULL。

   但「往中央帶」會讓目標從游標底下溜走，於是下一發滾輪再讀一次游標，讀到的已經是
   滑過來的別人 —— 換它被帶去中央，再換下一個。手明明沒動，版面卻一路橫著爬，停不
   下來（示範上量過：連滾 16 下，錨點從第 17 格滑進格線縫再跳到隔壁格，捲動量
   128→3841 一路沒收斂）。所以錨點在**手勢的第一發就鎖住**，之後每一發都拉同一個
   點，它才會愈走愈靠中間然後定住。手停一下（GESTURE_MS）或游標真的移動了
   （MOVE_TOL）才重新挑。 */
const ZOOM_PULL = .35, ZOOM_GESTURE_MS = 500, ZOOM_MOVE_TOL = 6;
let zLatch = null, zLatchTime = 0, zLatchCx = 0, zLatchCy = 0;

/* 錨點記的是「佔版面的幾成」，不是 client 座標 —— 版面一縮放，同一個 client 座標
   底下就換成別的東西了，下一發根本對不回來。比例縮放前後不變，正好當錨。 */
function zoomLatch(clientX, clientY){
  const now = performance.now();
  const moved = Math.hypot(clientX - zLatchCx, clientY - zLatchCy) > ZOOM_MOVE_TOL;
  if (!zLatch || moved || now - zLatchTime > ZOOM_GESTURE_MS){
    const r = boardEl.getBoundingClientRect();
    zLatch = { fx: r.width  ? (clientX - r.left) / r.width  : .5,
               fy: r.height ? (clientY - r.top)  / r.height : .5 };
  }
  zLatchTime = now; zLatchCx = clientX; zLatchCy = clientY;
  return zLatch;
}

/* 滾輪縮放走這一條（鍵盤 ＋／− 不走：沒有游標就沒有「指著誰」，setZoom 照舊釘中央）。
   redraw 由呼叫端給 —— 落版 是 renderGrid、拼板 是 reflowBoard。 */
function zoomWheelTo(next, clientX, clientY, redraw){
  const from = sheetZoom;
  const to = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
  if (to === from) return;

  const L = zoomLatch(clientX, clientY);
  const r0 = boardEl.getBoundingClientRect();
  const nowX = r0.left + L.fx * r0.width, nowY = r0.top + L.fy * r0.height;

  /* 放大才往中央帶；縮小是「退遠一點看全部」，再往中央拉只會把畫面拖著跑。 */
  const vr = sheetMainEl.getBoundingClientRect();
  const k = to > from ? ZOOM_PULL : 0;
  const destX = nowX + (vr.left + vr.width  / 2 - nowX) * k;
  const destY = nowY + (vr.top  + vr.height / 2 - nowY) * k;

  sheetZoom = to;
  redraw();
  // 重畫之後量那一點現在畫在哪，差多少就捲多少（同 zoomKeepPoint，只是終點換成 dest）
  const r1 = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (r1.left + L.fx * r1.width)  - destX;
  sheetMainEl.scrollTop  += (r1.top  + L.fy * r1.height) - destY;
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
}

function setZoom(next, cx, cy){
  if (!activeBlock) return;
  const from = sheetZoom;
  const to = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
  if (to === from) return;
  sheetZoom = to;

  /* 沒帶座標進來（鍵盤 ＋／−）就以視窗中央當那一點 */
  const r = sheetMainEl.getBoundingClientRect();
  zoomKeepPoint(cx == null ? r.left + r.width / 2 : cx,
                cy == null ? r.top + r.height / 2 : cy,
                redrawSheet);
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
  syncZoomHint();
}

/* 把版面挪到畫布正中間。#sheetMain 四周留了很大一圈 padding（30vh／40%）讓人
   可以把版面拖到旁邊看，所以捲到 0,0 是停在那圈留白上，不是停在版面上 ——
   要置中只能量出來：兩個中心點差多少，就捲多少。 */
function centreSheet(){
  const pr = sheetMainEl.getBoundingClientRect();
  const br = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (br.left + br.width  / 2) - (pr.left + pr.width  / 2);
  sheetMainEl.scrollTop  += (br.top  + br.height / 2) - (pr.top  + pr.height / 2);
}

/** Ctrl/Cmd+0 — shrink until the whole 版位 is inside the pane, then centre it.
    quiet＝換版位時自己跑的那一次，不用每次都跳一個提示出來。 */
function zoomToFit(quiet){
  if (!activeBlock) return;
  // measure the 100% layout, then render once at whatever ratio fits it
  sheetZoom = 1;
  redrawSheet();
  const availW = sheetMainEl.clientWidth - 12;
  const availH = sheetMainEl.clientHeight - blockHead.offsetHeight - 34;
  const w = boardEl.scrollWidth, h = boardEl.scrollHeight;
  /* 取小的那一個＝比較擠的那一邊剛好進得來，長的那一邊自然也就進得來 */
  const k = (w > 0 && h > 0) ? Math.min(availW / w, availH / h) : 1;

  sheetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, k));
  redrawSheet();
  centreSheet();
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
  syncZoomHint();
  if (!quiet) toast(`符合視窗 ${Math.round(sheetZoom * 100)}%`, 'info', 1400);
}

/* A wheel fires far faster than the screen repaints, so the handler only does
   arithmetic and the actual re-layout happens once per frame. */
let zoomFrame = 0, zoomAnchor = null, zoomTo = 0;

/* 滾輪就是縮放 — 跟 拼板 同一套手感，不必先切 縮放 工具。
   在 拼板 時這張版是借過去的，那邊有自己的滾輪處理，這裡就別再算一次。 */
sheetMainEl.addEventListener('wheel', e => {
  if (!activeBlock || activeTab === 'board') return;
  e.preventDefault();

  /* 倍率先累起來、下一幀才重畫。累的是 zoomTo 不是 sheetZoom —— 中途改掉 sheetZoom
     的話，這一幀還沒重畫，畫面和數字就已經對不上了。 */
  const base = zoomTo || sheetZoom;
  const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX,
    base * (e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP)));
  if (next === base) return;
  zoomTo = next;

  /* 一連好幾發滾輪合成一次重畫；「游標在哪」記第一發那一下。
     真正的釘點交給 zoomWheelTo（量出來再修正）—— 這裡本來也是那個
     以捲動原點為中心的模型，量到過縮放一次就跑掉 59×38px。 */
  if (!zoomAnchor) zoomAnchor = { cx: e.clientX, cy: e.clientY };

  if (!zoomFrame) zoomFrame = requestAnimationFrame(() => {
    zoomFrame = 0;
    const { cx, cy } = zoomAnchor;
    zoomAnchor = null;
    const to = zoomTo; zoomTo = 0;
    zoomWheelTo(to, cx, cy, () => renderGrid(activeBlock));
    syncZoomHint();
  });
}, { passive: false });

/* ==========================================================================
   手形工具 — hold Space to pan (PS's single most ingrained habit)
   The tool is temporary: it borrows the pointer for as long as the key is
   down and hands it straight back on release.
   ========================================================================== */

let handMode = false, handPrevTool = null, panning = null;

function setHandMode(on){
  if (on === handMode) return;
  handMode = on;
  sheetMainEl.classList.toggle('tool-hand', on);
  if (on){
    handPrevTool = activeTool;
  } else {
    sheetMainEl.classList.remove('panning');
    panning = null;
    handPrevTool = null;
  }
}

/* 縮放 工具就是「看版面」的工具：滾輪縮放，按著拖就移動畫面。
   空白鍵的手形照舊，兩個共用同一套平移。 */
sheetMainEl.addEventListener('pointerdown', e => {
  // 落版 的工具（縮放／手形）不該管到拼板 —— 那一頁自己有一套平移
  if (activeTab !== 'sheet') return;
  if (assignMode && assignable()) return;   // 指派中：這一下是框選，不是拖畫面
  /* ⋮⋮ 和刊頭是「抓著這個東西」，不是「抓著畫面」。
     版位標題那一行也是：那裡的按鈕和欄位是拿來按的，不是拿來拖畫面的
     —— 平移在捕獲階段就把事件吃掉了，不放行的話 ＋刊頭 永遠按不到。 */
  if (!handMode && e.target.closest
      && e.target.closest('.grip,.masthead,.mh-zone,#blockHead,button,input,select,textarea')) return;

  /* 移動畫面不是某一個工具的專利：不管手上拿著什麼，拖空白處都是移動畫面。
     差別只在卡片身上 ——
       看版／空白鍵／中鍵：整片都能拖，卡片也一樣，這個工具本來就碰不到東西
       搬移：卡片是要拖去換位置的，這一下不歸平移
       輸入／複製：先不吃掉，手沒動＝點卡片，手一動＝拖畫面（見 pointermove） */
  const free = handMode || e.button === 1 || activeTool === 'pan';
  const onCell = e.target.closest && e.target.closest('.cell');
  if (!free && onCell && activeTool === 'move') return;

  panning = { x: e.clientX, y: e.clientY,
              left: sheetMainEl.scrollLeft, top: sheetMainEl.scrollTop,
              pending: !free && !!onCell };
  if (panning.pending) return;
  e.preventDefault();
  e.stopPropagation();
  sheetMainEl.classList.add('panning');
  try { sheetMainEl.setPointerCapture(e.pointerId); } catch (err) {}
}, true);

sheetMainEl.addEventListener('pointermove', e => {
  if (!panning) return;
  const dx = e.clientX - panning.x, dy = e.clientY - panning.y;
  /* 從卡片上起手的：超過幾 px 才算拖畫面。一旦算數了就把游標和選字收掉，
     不然拖出來的會是一條反白的字。 */
  if (panning.pending){
    if (Math.abs(dx) + Math.abs(dy) < 5) return;
    panning.pending = false;
    sheetMainEl.classList.add('panning');
    document.body.style.userSelect = 'none';
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  // drag right and the sheet follows the hand, so scroll goes the other way
  sheetMainEl.scrollLeft = panning.left - dx;
  sheetMainEl.scrollTop  = panning.top  - dy;
});

function endPan(){
  if (!panning) return;
  panning = null;
  sheetMainEl.classList.remove('panning');
  document.body.style.userSelect = '';
}
sheetMainEl.addEventListener('pointerup', endPan);
sheetMainEl.addEventListener('pointercancel', endPan);

/* ==========================================================================
   KEYBOARD — see the shortcut table at the top of this script
   ========================================================================== */

/** True while the caret is somewhere the keystroke belongs to the user. */
function typingInField(){
  const el = document.activeElement;
  if (!el) return false;
  return el.isContentEditable || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
}

/** Esc: abandon whatever gesture is running and put things back. */
function cancelEverything(){
  let did = false;

  if (mhPlacing){ mhDrag = null; closeMhPlacer(); did = true; }

  // the pointer is still down: its eventual click must not open the 尺 field
  if (drag){ endDrag(null, true); divClickSuppressed = true; did = true; }

  if (guideDrag){
    const { key, g, created, orig } = guideDrag;
    const list = guidesFor(key);
    if (created){ const at = list.indexOf(g); if (at >= 0) list.splice(at, 1); }
    else g.unit = orig;
    guideDrag = null;
    document.body.style.userSelect = '';
    drawGuides(key);
    did = true;
  }

  if (rowDrag){
    rowDrag.row.style.transform = '';
    rowDrag.row.classList.remove('dragging');
    rowDrag = null;
    document.body.style.userSelect = '';
    boardSig = null;                    // the DOM order is dirty; rebuild it
    renderGrid(activeBlock);            // straight back from state
    did = true;
  }

  if (cellDrag){
    cellDrag.cell.classList.remove('cell-dragging');
    clearDropFeedback();
    cellDrag = null;
    document.body.style.userSelect = '';
    did = true;
  }

  if (mhResize){
    // put the 刊頭 back to the height it had when the drag started
    mhResize.sh.mastheadH = mhResize.startH;
    if (mhFrame){ cancelAnimationFrame(mhFrame); mhFrame = 0; }
    mhResize = null;
    document.body.classList.remove('mh-resizing');
    renderHead(); renderGrid(activeBlock);
    did = true;
  }

  if (did) toast('已取消', 'info', 1200);
  return did;
}

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  /* ---- Esc works everywhere, including out of a field ---- */
  if (e.key === 'Escape'){
    if (divField){ closeDividerField(); return; }
    if (modalClose){ modalClose(); return; }
    if (typingInField() && document.activeElement.isContentEditable){
      document.activeElement.blur(); return;
    }
    if (cancelEverything()) e.preventDefault();
    return;
  }

  /* ---- undo / redo, allowed even mid-typing ---- */
  if (mod && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    if (typingInField() && document.activeElement.isContentEditable)
      document.activeElement.blur();     // commit the field, then step back
    e.shiftKey ? redo() : undo();
    return;
  }
  if (mod && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }

  if (typingInField()) return;           // everything below is a bare key

  /* ---- zoom：落版 和 拼板 同一套 ---- */
  if ((activeTab === 'sheet' || activeTab === 'board') && mod){
    if (e.key === '+' || e.key === '='){ e.preventDefault(); setZoom(sheetZoom * ZOOM_STEP); return; }
    if (e.key === '-' || e.key === '_'){ e.preventDefault(); setZoom(sheetZoom / ZOOM_STEP); return; }
    if (e.key === '0'){ e.preventDefault(); zoomToFit(); return; }
  }
  if (mod) return;                       // leave every other Ctrl combo alone

  /* ---- Space = 手形, held ---- */
  if (e.code === 'Space' && activeTab === 'sheet'){
    e.preventDefault();
    if (!e.repeat) setHandMode(true);
    return;
  }

  /* ---- single-key tools ---- */
  // 工具列 拼板 也有一份，快捷鍵就跟著它走（Space 手形還是只有 落版：拼板 的平移
  // 是拖空白處，那邊沒有 handMode 那一套）
  if (activeTab !== 'sheet' && activeTab !== 'board') return;
  const k = e.key.toLowerCase();
  /* S／D 挨在一起（跟 Ctrl+C／Ctrl+V 同一個道理：常一起用的鍵手不必換位置）：
     S＝選東西（在格子裡挑零件、拖零件），D＝拖畫面。搬移還是 V。 */
  if (k === 'v'){ e.preventDefault(); setTool('move'); }
  else if (k === 's'){ e.preventDefault(); setTool('edit'); }
  else if (k === 'd'){ e.preventDefault(); setTool('pan'); }
  // 顯示格線是開關不是工具，但快捷鍵放在一起最順手
  else if (k === 'g'){ e.preventDefault(); setGridLines(!gridLines); }
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space' && handMode){
    const prev = handPrevTool;           // setHandMode clears it
    setHandMode(false);
    if (prev) setTool(prev);
  }
});
/* a lost focus would otherwise strand the hand tool on */
window.addEventListener('blur', () => { if (handMode) setHandMode(false); });

/* ==========================================================================
   CONFIRM
   ========================================================================== */

const confirmBtn = document.getElementById('confirmBtn');
const bannerProg = document.getElementById('bannerProg');

/** 球在哪：在 PM 幾格、在設計幾格 — 正面背面一起算。
    數的是格不是版位（「12 個版位交了 5 個」會把「另外七個各交了一半」講成沒進度），
    而且不講「完成度」—— 棒子會來回傳，沒有單調遞增的那種進度。 */
function planProgress(pl){
  if (!pl || !pl.layout) return null;
  const all = collectBlocks(pl.layout.front, []).concat(collectBlocks(pl.layout.back, []));
  if (!all.length) return null;
  let pm = 0, total = 0;
  all.forEach(b => {
    const cells = (b.sheet && b.sheet.cells) || [];
    total += cells.length;
    pm    += cellsAt(b.sheet, 'pm').length;
  });
  return total ? { pm, design: total - pm, total } : null;
}

function updateProgress(){
  const p = planProgress(currentPlan);
  bannerProg.innerHTML = p
    ? `在 PM <b>${p.pm}</b>・在設計 <b>${p.design}</b> 格` : '';
}

/* 「送給 PM」：把這個版位還在設計手上的格一次往前推一關。
   它不是一道門，是一個動作 —— 按幾次都行（第二次推的是這期間又退回來的那幾格），
   也沒有相對的「收回」：要拿回某一格就去 拼板 蓋章退回它，那條路一直都在。
   （這裡本來是「確認列排列（鎖定）」：一顆鈕同時管交件和「別再搬列了」，
     於是想交件就得先接受版面被鎖住。鎖定整條拿掉了，剩下交件這一件事。） */
function renderConfirmBtn(){
  // 拼板 borrows the 落版 grid, but 送給 PM stays a 落版 decision
  // 行銷不交件：棒子是設計和 PM 在傳的
  if (!activeBlock || activeTab === 'board' || isMkt()){ confirmBtn.style.display = 'none'; return; }
  const sh = sheetOf(activeBlock);
  confirmBtn.style.display = 'block';
  const n = cellsAt(sh, 'design').length;
  /* 數字寫在鈕上：按下去會動到幾格，按之前就看得見。一格都不在設計手上就沒事可做，
     鈕自己說出來（而不是按了沒反應）。 */
  confirmBtn.innerHTML = n
    ? `<span class="lk">📮</span>送給 PM<br>（${n} 格往前一關）`
    : '<span class="lk">✓</span>都送出去了<br>（沒有在你手上的格）';
  confirmBtn.classList.toggle('is-confirmed', !n);
  confirmBtn.disabled = !n;
}

confirmBtn.addEventListener('click', () => {
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);
  /* 棒子還是一格一顆（cell.st），這裡只是一次把設計那邊的每一格都往前推一關 ——
     設計排完之後本來就沒事了，還要再去 拼板 一格一格蓋一次章是白工。
     推一關、不是直接跳到某一關：一改跟二改是不同的關，硬塞同一個值等於把
     走到哪裡這件事洗掉。已經在 PM 那一關的格不動（不然就變成幫 PM 蓋了章）。 */
  const moved = cellsAt(sh, 'design');
  if (!moved.length){ toast('這個版位沒有在你手上的格', 'info', 1800); return; }
  moved.forEach(c => setCellStage(c, stageNext(cellStage(c))));
  toast(`${moved.length} 格${stampWord(moved, true)}（個別格子可以到 拼板 蓋章退回）`, 'ok', 3000);
  renderMinimap();
  renderHead();
  renderGrid(activeBlock);
  renderConfirmBtn();
  updateProgress();
  commitAction();
});

      hostSheet(document.getElementById('view-sheet'));
      clearBoardThumbs();                   // 拼板的畫布、貼紙、數字都不進這一頁
      /* 第一次看到某個版位（剛開檔期、還沒挑過）＝要先看到它整張，
         所以縮到剛好、擺正中間。本來就有選著的版位不動 —— 在同一個版位裡
         切分頁不該把你調好的縮放洗掉。 */
      const fresh = !activeBlock;
      if (!activeBlock) activeBlock = collectBlocks(layout.front, [])[0];
      renderMinimap();
      renderHead();
      renderGrid(activeBlock);
      renderConfirmBtn();
      /* 第一次看到＝縮到剛好再擺中間；已經在看的那一個只擺中間，不動縮放。
         兩頁的可用寬度不一樣（拼板 右邊還有意見欄），所以切回來一定要重新
         置中，不然版面看起來是歪的。 */
      if (fresh && activeBlock) zoomToFit(true);
      else if (activeBlock) requestAnimationFrame(centreSheet);
    },
    unmount(){ hideTip(); }
  },
  /* 拼板 has two states: the whole sheet (so you can see where you are), and a
     single 版位 opened in 2cell-product-pick.html — a separate app in an iframe,
     with its own styles and script, so nothing of this editor applies inside. */
  board: {
    mount(){
      snapWrap.style.display = 'none';
      markWrap.style.display = 'flex';
      confirmBtn.style.display = 'none';
      document.getElementById('toolHint').style.display = 'none';
      showBoardOverview();
      syncTypeBar();          // 字級那一排只有這一頁看得到
    },
    unmount(){
      hideTip(); closeBoardCell(); armKind(null); clearBoardThumbs();
      markWrap.style.display = 'none';
      typeWrap.classList.remove('on');
    }
  }
};

/* ---- 拼板 ------------------------------------------------------------------
   左邊選版位（設計看小地圖，PM 看品類樹）→ 右邊是那個版位的整張版 → 點一格，
   拼那一格的面板就浮在那一格旁邊，版面留在底下不動。
   總覽這一層直接借用 落版 的那三塊 DOM（小地圖／工具／格子），整個搬過來再搬
   回去 — 兩邊永遠是同一份、同一組事件，不必養第二套 render。 */
let boardCell = null;               // 面板正在拼的那一格，null = 面板關著
let boardLoaded = null;             // iframe 現在載的是哪一格，避免重載洗掉進度

/** Park 落版's three nodes somewhere. 落版 takes all three in a row; 拼板 keeps
    the minimap in its own left column so it survives the drill-in. */
/* railHost：工具列要掛在哪裡。落版 就掛在版面旁邊自己站一條；拼板 傳 #typeWrap
   進來，工具就接在 字級 底下變成同一條的下半截，左邊不會出現兩塊藍。
   不管掛到哪都是**同一顆** DOM —— setTool／syncTools／快捷鍵操作的都是同一組按鈕，
   不必同步兩份狀態。 */
function hostSheet(parent, sideParent, railHost){
  const side = sideParent || parent;
  if (sheetSide.parentNode !== side) side.appendChild(sheetSide);
  // 把手永遠跟在那一欄後面，兩邊的檢視共用同一根
  if (sideFold.parentNode !== side || sideFold.previousElementSibling !== sheetSide)
    side.insertBefore(sideFold, sheetSide.nextSibling);
  sideFold.paint();
  const rail = document.getElementById('toolRail');
  const rHost = railHost || parent;
  if (rail.parentNode !== rHost) rHost.appendChild(rail);
  const pane = document.getElementById('sheetPane');
  if (pane.parentNode !== parent) parent.appendChild(pane);
}

function showBoardOverview(){
  closeBoardCell();
  const ov = document.getElementById('boardOverview');
  const side = document.getElementById('boardSide');
  // 工具接在 字級 那條底下，不另外站一條
  hostSheet(ov, side, document.getElementById('typeWrap'));
  ov.classList.add('on');
  ov.classList.toggle('pm', activeMode === 'pm');   // PM 不在版上搬東西
  // PM 那邊由 pickPmDefaultBlock 決定看得到哪一個（可能一個都沒有）
  const fresh = !activeBlock;          // 這一趟才挑到版位＝第一次看到它
  if (!activeBlock && activeMode !== 'pm') activeBlock = collectBlocks(layout.front, [])[0];
  // 設計靠小地圖找版位，PM 靠品類找貨 — 同一欄，兩種左邊
  side.classList.toggle('pm', activeMode === 'pm');
  if (activeMode === 'pm'){ pickPmDefaultBlock(); renderPmTree(); }
  else renderMinimap();
  renderHead();
  renderGrid(activeBlock);
  paintBoardThumbs();
  applyPmFocus();
  renderRail();
  applyFocusCell();
  syncRailTop();
  /* 意見欄是切到這一頁才長出來的，它一站好，版面能用的寬度就少了一截 ——
     而上面那次 renderGrid 是在它出現**之前**量的，於是版位停在一個比實際寬的
     尺寸上，直到下一次重建才「啪」地縮回去（加一格的時候看到的那一下就是它）。
     所以欄位站好之後，下一幀再量一次：這一趟走的是「只改大小」那條快路，
     不重建卡片、也不重載畫布。 */
  requestAnimationFrame(() => {
    if (activeTab !== 'board' || !activeBlock) return;
    renderGrid(activeBlock);
    /* 第一次看到這個版位就縮到剛好、擺正中間；本來就在看的那一個維持原樣，
       只把左右的空地捲回中間（不然會以為版面跑掉了）。 */
    if (fresh) zoomToFit(true); else centreSheet();
  });
}

/** 意見欄從分頁列底下開始 —— 量出來的，換字級、換視窗都不會壓到上面那條。 */
function syncRailTop(){
  const app = document.querySelector('.app');
  const bar = document.querySelector('.bar');
  if (!app || !bar) return;
  const a = app.getBoundingClientRect(), b = bar.getBoundingClientRect();
  app.style.setProperty('--rail-top', Math.max(0, Math.round(b.bottom - a.top) + 8) + 'px');
}

/** 把版面捲回兩片空地的正中央。 */
function centerBoardScroll(){
  sheetMainEl.scrollLeft = Math.max(0, (sheetMainEl.scrollWidth - sheetMainEl.clientWidth) / 2);
}

/** 開那一格的拼板面板，浮在被點的那一格旁邊。 */
function openBoardCell(anchor, block, cells, at){
  boardCell = { block, cell: cells[at], at };
  const st = document.getElementById('boardStage');
  st.classList.add('on');
  document.getElementById('boardWhich').innerHTML =
