                   border-color:#2f4b96;z-index:2}
  /* 綠底有兩個意思：整塊都在 PM，或者列排列已鎖定。
     這是刻意的取捨（2026-07 決定）：「按了確認就變綠」是這張小地圖用了很久的
     手感，交接改成一格一格之後那個綠沒了，找不到「這張版排完了」的回饋。
     兩者要分辨就看右上角那個 ✓ —— 有 ✓ 才是都在 PM。 */
  .mini-blk.at-pm{
    background:#dff0e5;border-color:var(--green-rule);color:var(--green-ink)}
  .mini-blk.at-pm .cnt{color:var(--green-ink)}
  /* 綠底又剛好選中：綠底留著，藍框套在外面 */
  .mini-blk.active.at-pm{border-color:var(--green-rule)}
  /* 批次交接挑起來的：藍框＋淡藍罩。跟 .active 同一個藍 —— 兩者都是
     「你正在點的東西」，只是一個是「在看它」、一個是「要交出它」。 */
  .mini-blk.sel{outline:3px solid var(--blue);outline-offset:-3px;z-index:3;
                box-shadow:inset 0 0 0 9999px rgba(74,111,220,.16)}


  /* 小地圖最上面那顆批次交接開關 */
  .mini-mark{
    display:block;width:100%;margin:0 0 8px;font:inherit;font-size:12px;font-weight:800;
    cursor:pointer;border:1.5px dashed var(--chrome-line);border-radius:8px;padding:6px 8px;
    background:transparent;color:var(--chrome-muted);text-align:center;
  }
  .mini-mark:hover{border-color:var(--blue);color:var(--chrome-ink)}
  .mini-mark.on{background:var(--blue);border-style:solid;border-color:var(--blue);color:#fff}

  /* 小地圖底下那顆「進度」 */
  .mini-prog{
    display:block;width:100%;margin:10px 0 2px;font:inherit;font-size:12px;font-weight:800;
    cursor:pointer;border:1px solid var(--chrome-line);border-radius:8px;padding:7px 8px;
    background:var(--chrome-2);color:var(--chrome-ink);text-align:center;
  }
  .mini-prog:hover{border-color:var(--blue);background:#3a4457}

  /* 進度面板：蓋在畫面上，左邊版位、右邊 PM */
  #progMask{
    position:fixed;inset:0;z-index:700;display:none;
    background:rgba(12,17,24,.62);align-items:center;justify-content:center;
  }
  #progMask.on{display:flex}
  #progBox{
    background:var(--surface);color:var(--ink);border-radius:14px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);width:min(760px,92vw);
  }
  #progBox h3{
    font-size:15px;font-weight:800;padding:12px 18px;
    background:var(--surface-2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  #progBox h3 .close{
    margin-left:auto;font:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;padding:3px 11px;
    background:var(--surface);color:var(--ink-dim);
  }
  #progBox h3 .close:hover{background:var(--surface-2);border-color:var(--blue)}
  .prog-cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media (max-width:680px){ .prog-cols{grid-template-columns:1fr} }
  .prog-col{padding:16px 18px 18px}
  .prog-col + .prog-col{border-left:1px solid var(--line)}
  .prog-col > h4{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:10px}
  .prog-big{font-size:34px;font-weight:800;line-height:1;color:var(--ink)}
  .prog-big small{font-size:14px;color:var(--muted);margin-left:7px;font-weight:800}
  .prog-bar{height:8px;border-radius:999px;background:var(--surface-3,#eef1f6);overflow:hidden;margin:10px 0 4px}
  .prog-bar i{display:block;height:100%;background:var(--green-rule);border-radius:999px}
  /* 面板裡的小地圖：跟左欄那張同一個形狀，只是不能點。
     用真正的版面比例畫，不是一排等大的方塊 —— 才看得出還沒交的是哪幾塊、有多大。
     顏色跟小地圖同一套：灰＝未指派、白＝還在設計手上、綠＝整塊都在 PM。 */
  .prog-maps{display:flex;gap:10px;margin-top:12px}
  .prog-map{flex:1;min-width:0}
  .prog-map .lb{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
  .prog-page{
    position:relative;width:100%;aspect-ratio:350/248;
    border:1.5px solid var(--ink);background:var(--surface);overflow:hidden;
  }
  .prog-split{display:flex;width:100%;height:100%;overflow:hidden}
  .prog-fold{width:2px;background:#3d444f;flex:none}
  .prog-blk{
    border:1px solid var(--line-strong);background:var(--surface);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:800;color:var(--ink-dim);text-align:center;line-height:1.15;
    padding:1px;
  }
  .prog-blk.done{background:#dff0e5;border-color:var(--green-rule);color:var(--green-ink)}
  .prog-blk.none{background:#e9ecf2;border-color:#cdd4e0;color:#98a1b2}
  .prog-side{font-size:12px;color:var(--muted);margin-top:9px}
  .prog-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .prog-row:last-child{border-bottom:0}
  .prog-row .nm{font-size:13px;font-weight:800;width:78px;flex:none}
  .prog-row .bar{flex:1;height:7px;border-radius:999px;background:var(--surface-3,#eef1f6);overflow:hidden}
  .prog-row .bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
  .prog-row .n{font-size:12.5px;font-weight:800;color:var(--ink-dim);width:66px;text-align:right;flex:none}
  .prog-empty{font-size:12.5px;color:var(--muted);padding:10px 0}

  /* --- 工具 rail --- */
  #toolRail{
    position:relative;                 /* 鎖定鈕貼著它的右邊站 */
    flex:none;width:58px;margin:2px 18px 10px;border-radius:8px;
    background:var(--blue);color:var(--surface);display:flex;flex-direction:column;align-items:center;
    gap:8px;padding:12px 0 10px;user-select:none;
  }
  .rail-title{
    font-size:16px;font-weight:800;letter-spacing:4px;
    writing-mode:vertical-rl;text-orientation:upright;margin-bottom:6px;
  }
  .tool{
    position:relative;
    width:40px;height:40px;border-radius:8px;font-family:inherit;font-size:18px;
    border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:var(--surface);
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  /* the 快捷鍵 tucked in the corner, PS-style — present but never competing
     with the glyph for attention */
  .tool[data-key]::after{
    content:attr(data-key);position:absolute;right:3px;bottom:2px;
    font-size:9px;font-weight:800;line-height:1;letter-spacing:0;opacity:.7;
  }
  .tool:hover{background:rgba(255,255,255,.28)}
  .tool.active{background:var(--surface);color:var(--blue);border-color:var(--surface);font-weight:800}
  /* 開關長得跟工具不一樣：工具是互斥的模式（一次只有一個亮），開關是「開著／關著」。
     長一樣的話，看到兩顆亮的會以為自己同時拿著兩個工具。所以它小一點、是圓的。 */
  .tgl{
    position:relative;width:32px;height:32px;border-radius:999px;font-family:inherit;font-size:15px;
    border:1px dashed rgba(255,255,255,.45);background:transparent;color:var(--surface);
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .tgl:hover{background:rgba(255,255,255,.18)}
  .tgl.on{background:var(--surface);color:var(--blue);border-style:solid;border-color:var(--surface);font-weight:800}
  .tgl[data-key]::after{
    content:attr(data-key);position:absolute;right:1px;bottom:0;
    font-size:8px;font-weight:800;line-height:1;opacity:.7;
  }
  .zoom-val{margin-top:auto;font-size:10.5px;font-weight:800;opacity:.92;font-variant-numeric:tabular-nums}

  /* --- main area --- */
  /* 四周都留一整片空地：不管是最邊邊還是最上面那一格，都能被拖到畫面正中間來看。
     空地只是捲動範圍，版面本身的大小是算出來的（見 sheetMetrics 扣掉內距那段）。 */
  #sheetMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto;
             padding:30vh 40%}
  /* 畫布這一塊：版面在裡面捲，標題貼在它的左上角不動。
     標題講的是「你在看哪一個版位」—— 它不是版面的一部分，所以不跟著版面捲，
     也不跟著縮放跑。 */
  #sheetPane{flex:1;min-width:0;min-height:0;position:relative;display:flex}
  /* 站在畫布正上方的中間：左上角是鎖定鈕的位置，兩個疊在一起會互相蓋掉。
     中間這個位置在任何縮放下都是同一個地方 —— 它釘在畫布上，不在版面上。 */
  #blockHead{
    color:var(--ink);              /* 紙上的字是黑的（它不在 #sheetMain 裡面） */
    position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);
    background:var(--bg);border-radius:8px;padding:3px 12px 5px;
  }
  #blockHead .title{font-size:19px;font-weight:800}
  #blockHead .sub{font-size:13.5px;color:var(--muted);font-weight:800}
  /* 這裡曾經有一顆 .pm-of 下拉（「這個版位交給哪位 PM」）。指派改成一格一格之後
     它就沒有位置了 —— 標題旁邊現在只寫「PM：甲、乙」，是一行字不是一個選擇。 */
  /* 打數字進去的那條路留著（刊頭縮到看不見時，它是唯一回得來的方法），但平常
     安靜一點：真正在調尺寸的時候人是拖版上那條邊、看游標旁邊的讀數，不是看這裡。
     指過來或點進去才長回一個正常輸入框的樣子。 */
  .mh-num{
    font-family:inherit;font-size:14px;font-weight:800;width:60px;text-align:center;
    border:1px solid transparent;border-radius:6px;padding:4px 6px;
    background:transparent;color:var(--muted);
    transition:background .12s,border-color .12s,color .12s;
  }
  .mh-num:hover:not(:disabled){background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
  .mh-num:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue);
    background:var(--surface);color:var(--ink)}
  .mh-num:disabled{background:var(--surface-3);color:var(--muted);cursor:not-allowed}
  .mh-x-sep{font-size:14px;font-weight:800;color:var(--muted)}
  /* 寬度是讀的，不是改的：寫成一般的字就好。以前它有框有底色，看起來比旁邊那個
     真的能打字的高度欄還像輸入框 —— 能動的東西要看起來能動，反過來不行。 */
  .mh-fixed{font-size:14px;font-weight:800;color:var(--muted);padding:4px 2px;cursor:default}
  #addMasthead{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:1px dashed var(--blue);border-radius:7px;padding:5px 12px;
    background:var(--accent-tint);color:var(--blue);
  }
  #addMasthead:hover{background:var(--accent-tint-2)}

  /* 版面本身：卡片相接成一塊完整的方塊，四周才留邊 */
  #board{display:flex;flex-direction:column;gap:var(--gap);margin:15px auto;
         position:relative;--z:1;--gap:0px}
  .row{position:relative;display:flex;gap:var(--gap);align-items:stretch}
  .row.dragging{cursor:grabbing;opacity:.85;z-index:5;overflow:visible}
  /* ⋮⋮ 是操作用的把手，不是版面的一部分 —— 留一點縫，讓卡片那一塊自己是完整的 */
  .grip{
    flex:none;width:14px;margin-right:6px;border-radius:4px;
    background:var(--grip);color:var(--muted);
    display:flex;align-items:center;justify-content:center;cursor:grab;
    font-size:10px;line-height:1;user-select:none;touch-action:none;
  }
  .grip:hover{background:var(--grip-hover);color:var(--ink)}
  /* 一列旁邊的 ＋／−：這一列加一格／少一格（做法照 grid-reorder 那份示範：
     只動這一列，那一列自己重排，別的列一格都不動）。
     絕對定位貼在版面**外面** —— 版位的大小和比例不准被工具動，塞進列裡面就等於
     把卡片擠窄，那是把工具的方便算在版面頭上。 */
  .rowbtns{
    position:absolute;left:100%;top:0;bottom:0;margin-left:8px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;z-index:6;
  }
  .rowbtns button{
    width:22px;height:22px;padding:0;flex:none;
    font:800 15px/1 system-ui,sans-serif;
    /* 白底上的東西自己寫 color：不寫就繼承深色那一段的淺灰，等於看不見 */
    color:var(--muted);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .rowbtns button:hover{background:var(--accent-tint);border-color:var(--blue);color:var(--blue)}
  .rowbtns button:disabled{opacity:.32;cursor:default;background:var(--surface);color:var(--muted)}
  /* 刊頭的把手：橫帶時就是左邊那條 ⋮⋮；站著時轉成直的貼在外側 */
  .mh-move.v{
    position:absolute;top:0;bottom:0;width:16px;z-index:6;
    background:var(--grip);color:var(--muted);cursor:grab;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;letter-spacing:2px;user-select:none;touch-action:none;
    writing-mode:vertical-rl;
  }
  .mh-move.v:hover{background:var(--grip-hover);color:var(--ink)}
  .masthead.side.at-left .mh-move.v{left:0}
  .masthead.side.at-right .mh-move.v{right:0}
  /* 拖到某一塊落點上：那一塊自己亮起來，放手就是它 */
  .mh-zone.hot{background:var(--blue);color:var(--surface);border-style:solid}
  /* 挑位置的時候版位標題先淡掉：「上」那一塊就站在它的位置上 */
  #sheetPane.placing #blockHead{opacity:.12;pointer-events:none}

  /* product cards — .sq/.g2 two-tone carried over from dm-block-zoom.html */
  /* card type scaled up to dm-block-zoom.html's .sq baseline (10px) and its
     2px hover outline, so the labels stay readable at 8-to-10 columns */
  .cell{
    flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;
    padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:calc(10px * var(--z));line-height:1.3;text-align:center;overflow:hidden;
    touch-action:none;user-select:none;
    font-variant-numeric:tabular-nums;
    /* colour eases; transform does NOT — the FLIP slide sets its own inline
       transition and must not be slowed by a default here */
    transition:background-color .13s ease,border-color .13s ease;
  }
  .cell.g2{background:var(--g2);border-color:var(--g2-rule)}
  .cell:hover{outline:2px solid var(--blue);outline-offset:-1px;z-index:1}
  /* 相接處只留一條線：右邊和下面那一條交給隔壁去畫，不然邊界會變兩倍粗 */
  .row .cell + .cell{border-left:none}
  .row + .row .cell{border-top:none}
  .row.masthead-row + .row .cell{border-top:none}
  /* pointer-events:none so elementFromPoint sees the card UNDER the cursor,
     not the one being dragged — without it no drop target is ever found */
  .cell.cell-dragging{opacity:.5;pointer-events:none}
  /* the card a 交換 drag will trade places with */
  .cell.cell-target{outline:3px solid var(--blue);outline-offset:-3px;
                    background:#e8eeff;z-index:2}

  /* ---- move tool: centre = 交換, edge = 插入 ---- */
  .drop-line{
    position:absolute;width:3px;background:var(--blue);border-radius:2px;
    pointer-events:none;z-index:20;display:none;box-shadow:0 0 0 1px rgba(74,111,220,.35);
    /* glides between boundaries instead of teleporting; the first appearance
       suppresses this inline, or it would streak in from its last position */
    transition:left .12s ease-out,top .12s ease-out,height .12s ease-out;
  }

  /* cursors follow the selected tool */
  /* 看版：整片都是手，卡片也不例外 —— 這個工具碰不到版上的東西 */
  #sheetMain.tool-zoom,#sheetMain.tool-zoom .cell{cursor:grab}
  #sheetMain.tool-zoom.panning,#sheetMain.tool-zoom.panning *{cursor:grabbing !important}
  #sheetMain.tool-move .cell{cursor:grab}
  /* 輸入工具：卡片是拿來打字的；其他地方照樣是「可以拖畫面」的手 */
  /* 搬移、複製：空白處一樣拖得動畫面 */
  #sheetMain.tool-move{cursor:grab}
  /* 整格複製：這個工具下不打字，點一格就是挑它 */
  /* 手上拿著的那一格：虛線一直留著，才知道等一下貼的是誰 */

  /* masthead row */
  .row.masthead-row{gap:var(--gap)}
  .masthead{
    flex:1 1 0;min-width:0;position:relative;
    border:2px dashed #b9c6d6;border-radius:6px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-weight:800;text-align:center;overflow:hidden;
    /* 跟著縮放：這行字要看起來像「印在版上」的，不是浮在螢幕上的說明。
       所以縮小的時候它就該跟著變小、看不清楚 —— 要看就自己放大，
       跟看真正的印刷品一樣。（本來是固定 13px，2026-07 改掉的。）
       它自己折行去適應框，絕不被切一半。 */
    font-size:calc(13px * var(--z) * var(--mh-fit, 1));line-height:1.35;
    padding:8px 10px;
    white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  }
  /* 標籤自己是一塊，不當匿名的 flex item —— 盒子怎麼縮，它的字級都不受影響 */
  .masthead .mh-label{flex:0 1 auto;min-width:0;max-width:100%;font-weight:800}
  .masthead .mh-sub{display:inline}
  /* 有圖之後那個框和內距就該讓開：刊頭是一塊實體印刷品，圖印到哪裡就是刊頭到哪裡。
     留著 8/10px 的內距等於在版上憑空多一圈白邊，而那圈白邊印不出來也量不到。
     （虛線框和內距是「還沒放圖」時給人看的落點，放了圖它們的工作就做完了。） */
  .masthead.hasimg{border:0;padding:0;background:var(--surface)}
  .masthead img{width:100%;height:100%;object-fit:contain;display:block}
  .masthead.dropping{border-color:var(--blue);background:var(--accent-tint);color:var(--blue)}
  /* pull the edge to set 刊頭長度; mirrors the number field */
  .mh-grab{
    position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;z-index:4;
    display:flex;align-items:center;justify-content:center;
  }
  /* 刊頭排在最下面的時候，把手要跑到上緣去。
     版位的總高是固定的，所以刊頭在最下面時，它的下緣就是整張版的下緣 —— 那條邊
     動不了。真正會動的是它跟卡片相接的那一條，也就是上緣。把手留在下緣的話，
     你拉的是一條不會動的邊，動的卻是對面那條，怎麼拉都覺得不對。 */
  .masthead.at-bottom .mh-grab{top:0;bottom:auto}
  .mh-grab::after{
    content:"";width:46px;height:3px;border-radius:2px;background:rgba(74,111,220,.45);
  }
  .mh-grab:hover::after{background:var(--blue);height:4px;width:60px}
  body.mh-resizing,body.mh-resizing *{cursor:ns-resize !important;user-select:none}

  /* ---- 刊頭擺在卡片旁邊 ----------------------------------------------------
     它不再是一條橫帶，而是一整根柱子：和卡片各佔一邊，兩邊都拉到版位的滿高。
     卡片那一堆永遠是一整塊，只是被擠窄了就自己重新分列。
     中間那條縫可以左右拖，決定兩邊各佔幾成。 */
  .masthead.side{position:absolute;top:0;z-index:2}
  /* 把手還是長在刊頭身上，只是它站著的時候，把手也跟著轉成直的，
     長在它和卡片相接的那一邊 —— 拖它就是改兩邊各佔幾成。
     刊頭本身是 overflow:hidden，所以把手要貼在框「裡面」的邊上，不能掛在外面
     （掛外面會被裁掉，就是看不見的原因）。它是疊上去的，不佔任何寬度。 */
  .mh-grab.v{
    top:0;bottom:0;left:auto;right:0;width:18px;height:auto;cursor:ew-resize;z-index:5;
  }
  .masthead.side.at-right .mh-grab.v{right:auto;left:0}
  .mh-grab.v::after{
    width:4px;height:64px;background:rgba(74,111,220,.55);
    box-shadow:0 0 0 2px rgba(255,255,255,.75);
  }
  .mh-grab.v:hover::after{background:var(--blue);width:5px;height:88px}


  body.mh-splitting,body.mh-splitting *{cursor:ew-resize !important;user-select:none}
  /* 搬動中：卡片先排到它「會變成的樣子」，淡淡的，放手才落實 */



  /* 四個落點蓋在版位上：拖到哪一塊、或點哪一塊，刊頭就搬去那裡 */
  .mh-zone{
    position:absolute;z-index:30;cursor:pointer;
    border:3px dashed rgba(74,111,220,.75);border-radius:10px;
    background:rgba(238,242,252,.92);
    box-shadow:0 6px 18px rgba(16,24,40,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:var(--blue);user-select:none;
  }
  .mh-zone:hover{background:var(--blue);color:var(--surface);border-style:solid}
  .mh-zone.here{border-style:solid;background:rgba(74,111,220,.16)}
  /* 站在版外面，字排成直的才塞得下（左右那兩塊）；上下那兩塊照常橫著 */
  .mh-zone .now{font-size:11.5px;font-weight:800;opacity:.8;margin-left:6px}
  .mh-zone[data-zone="left"],.mh-zone[data-zone="right"]{
    flex-direction:column;gap:4px;
  }
  .mh-zone[data-zone="left"] .now,.mh-zone[data-zone="right"] .now{
    margin-left:0;writing-mode:vertical-rl;
  }

  .masthead .mh-x{
    position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
    border:none;background:rgba(51,58,69,.72);color:var(--surface);font-size:12px;font-weight:800;
    cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;
  }
  .masthead:hover .mh-x{display:flex}
  .masthead .mh-x:hover{background:var(--accent)}

  /* 確認後：列鎖定（⋮⋮、刊頭把手收起），格子改為可互換。
     刊頭「換一張圖」不在鎖定的範圍裡（見 buildMasthead）—— 鎖的是排列和尺寸，
     不是內容，所以游標照舊是可以點的手。 */
  /* typed copy is the thing you read on this sheet, so it runs a good deal
     larger and heavier than the 10px card baseline — still scaled by --z.
     This is typography only, so it applies locked or not: unlocking to
     re-arrange rows must never make existing copy jump size. */
  .cell.copy{justify-content:flex-start;
             font-size:calc(15px * var(--z));font-weight:800;line-height:1.25}
  /* 確認前 the sheet is not open for copy — the cards are arrangement, not text */
  /* 落版的格子只有兩種字：未填寫／有填寫 ✓。用 ::before 畫而不是塞進 DOM ——
     這些 .cell 會被整批搬去拼板放畫布，多一個文字節點就會卡在畫布底下。
     字跟著縮放（它是版面的一部分，不是螢幕上的標記）。 */
  #view-sheet .cell{justify-content:center}
  /* 字級跟著格子走，不是只跟著縮放：刊頭一拉長，列就被擠扁（那是對的，見
     sheetMetrics），字如果還是原來那麼大，就會頂滿甚至撐破一格。--rowh 是
     renderGrid 量好的列高（已經含縮放），取它的一個比例；上限那條是為了不要
     在很高的格子裡變成一塊招牌。 */
  #view-sheet .cell::before{
    content:'未填寫';color:var(--ink-dim);
    font-size:min(calc(var(--rowh, 40px) * .26), calc(13px * var(--z)));
    font-weight:800;letter-spacing:.04em;line-height:1;
  }
  #view-sheet .cell.pm-filled::before{content:'有填寫 ✓';color:var(--ok-ink,#1a7f47)}
  /* cards keep their hover ring — after the lock they are the thing you move */


  .sheet-empty{color:var(--muted);font-size:16px;font-weight:800;margin:40px auto;
               text-align:center;line-height:1.7}
  .sheet-empty .sub{font-size:13px;font-weight:800;opacity:.75}

  /* --- cursor tip (dm-block-zoom.html #cursorTip) --- */
  #cursorTip{
    position:fixed;pointer-events:none;z-index:99;display:none;
    background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.5;
    padding:5px 9px;border-radius:3px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(28,27,25,.25);font-variant-numeric:tabular-nums;
  }
  #cursorTip b{font-weight:700}
  #cursorTip .sep{color:#8b939f;margin:0 5px}
  #cursorTip .num{color:#f0a888}

  /* 拉刊頭時的讀數。站在游標旁邊，不站在標題列裡 —— 尺寸是「你正在改的東西」，
     要看的時候眼睛在版上，不在上面那條標題。而且它講的是一筆交易：
     版位的高是固定的，刊頭多吃一分，卡片就少一分，兩邊一起寫出來才看得懂
     自己在拿什麼換什麼。 */
  #mhTip{
    position:fixed;pointer-events:none;z-index:99;display:none;
    background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;line-height:1.5;
    padding:5px 10px;border-radius:4px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(28,27,25,.25);font-variant-numeric:tabular-nums;
  }
  body.mh-resizing #mhTip,body.mh-splitting #mhTip{display:block}
  #mhTip .sep{color:#8b939f;margin:0 6px}
  #mhTip .num{color:#f0a888}

  /* ================= 儲存狀態 ・ 進度 ================= */
  /* Always-on badge: at a glance, is my work safe or not? It never fades —
     an indicator you have to catch in time is no indicator at all. */
  #saveState{
    opacity: 50%;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    display:none;
    align-items:center;
    gap:6px;
    border:1px solid transparent;
    border-radius:999px;
    padding:4px 13px;
    transition:background .16s,color .16s,border-color .16s;
  }
  #saveState.on{display:inline-flex}
  #saveState.dirty{color:var(--amber);background:var(--amber-bg);border-color:var(--warn-line)}
  #saveState.done {color:var(--green-ink);background:var(--green);border-color:var(--green-rule)}
  #saveState.fail {color:var(--surface);background:var(--accent);border-color:var(--accent)}
  /* 進度跟著跑到那一列的最右邊，和檔期名各據一端 */
  .bar .prog{font-size:13px;font-weight:800;color:var(--amber)}
  .bar .prog b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pill.prog{color:var(--green-ink);border-color:var(--green-rule);background:var(--green)}
  /* 交了一半／一格都還沒交：綠是「這份沒你的事了」，那兩種都還沒到那一步 */
  .pill.prog.half{color:var(--amber);border-color:var(--warn-line);background:var(--amber-bg)}
  .pill.prog.wip{color:var(--ink-dim);border-color:#cdd4e0;background:var(--surface)}

  /* ================= toast ================= */
  #toastHost{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:400;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    font-size:14.5px;font-weight:800;padding:10px 20px;border-radius:9px;
    background:var(--ink);color:var(--surface);box-shadow:0 4px 16px rgba(30,40,60,.28);
    max-width:min(90vw,540px);animation:popIn .16s ease-out;
  }
  .toast.ok  {background:var(--green);color:var(--green-ink);border:1px solid var(--green-rule)}
  .toast.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--warn-line)}
  .toast.info{background:var(--accent-tint);color:var(--accent-ink-strong);border:1px solid var(--accent-line)}
  .toast.out{animation:toastOut .2s ease-in forwards}
  @keyframes popIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes toastOut{to{transform:translateY(6px);opacity:0}}

  /* ================= modal (取代 confirm()) ================= */
  /* 確認框永遠在最上面：它問的是「你剛剛那一下確定嗎」，而那一下多半是在
     某一張大視窗裡按的（回收桶的永久刪除、過往檔期裡的刪除）。z-index 比
     #impMask／#pastMask／#trashMask（600）低的話，問題會開在它們**後面** ——
     看得到一半、按不到，而且完全不像壞掉，像是那顆鈕沒反應。 */
  #modalHost{
    position:fixed;inset:0;z-index:700;display:none;
    align-items:center;justify-content:center;background:rgba(30,40,60,.34);
  }
  #modalHost.on{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px 20px;min-width:340px;max-width:min(92vw,470px);
    box-shadow:0 18px 48px rgba(30,40,60,.3);animation:popIn .16s ease-out;
  }
  /* 白底上的字要自己寫 color：不寫就繼承深色那一段的淺灰，白底上等於看不見
     （#blockHead、.plan-card、落版的字都中過同一招） */
  .modal h4{font-size:18px;font-weight:800;margin-bottom:9px;color:var(--ink)}
  .modal p{font-size:14.5px;font-weight:800;color:var(--muted);line-height:1.65;margin-bottom:19px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}
  .modal .btn.danger{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .modal .btn.danger:hover{background:#a5301f}

  /* ================= 參考線 (PS guides) ================= */
  .ruler-top,.ruler-left{cursor:crosshair}
  .rguide{position:absolute;background:#00c8e0;z-index:6;touch-action:none}
  .rguide.v{top:0;bottom:0;width:1px;cursor:col-resize}
  .rguide.h{left:0;right:0;height:1px;cursor:row-resize}
  /* the line is 1px but the grab zone is not */
  .rguide::before{content:"";position:absolute}
  .rguide.v::before{top:0;bottom:0;left:-6px;right:-6px}
  .rguide.h::before{left:0;right:0;top:-6px;bottom:-6px}
  .rguide.dragging{background:var(--align);box-shadow:0 0 0 1px var(--align)}
  /* dragged back over the ruler: release here and it goes away */
  .rguide.doomed{opacity:.3}

  /* ================= inline 公分欄 on a divider ================= */
  .div-num{
    position:fixed;z-index:300;font-family:inherit;font-size:13px;font-weight:800;
    width:88px;text-align:center;background:var(--surface);color:var(--ink);
    border:1px solid var(--blue);border-radius:6px;padding:4px 6px;
    box-shadow:0 4px 14px rgba(30,40,60,.26);
  }
  .div-num:focus{outline:2px solid var(--blue);outline-offset:-1px}

  /* ================= tool rail states ================= */
  /* PS greys unavailable tools out rather than removing them */
  .tool[disabled]{opacity:.4;cursor:not-allowed}
  .tool[disabled]:hover{background:rgba(255,255,255,.14)}
  /* 空白鍵 = 手形工具, exactly as in PS */
  #sheetMain.tool-hand,#sheetMain.tool-hand *{cursor:grab !important}
  #sheetMain.tool-hand.panning,#sheetMain.tool-hand.panning *{cursor:grabbing !important}

  /* 搖一下表示「這一下不算」。版位鎖定那條路沒了，現在只剩刊頭的數字欄在用 */
  @keyframes lockShake{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)}
  }
  /* 都在 PM 的那一塊除了綠底再給一個記號 —— 只靠顏色講狀態，色弱就看不到 */
  .mini-blk{position:relative}
  .mini-blk.at-pm::after{
    content:"✓";position:absolute;top:2px;right:5px;line-height:1;
    font-size:12px;font-weight:800;color:var(--green-ink);
  }
  /* 右上角同時要放紅點的時候，✓ 讓到左邊去 —— 兩個都是狀態，誰都不該被蓋掉 */
  .mini-blk.at-pm.has-notes::after{right:auto;left:4px}

  /* 點貼紙跳出來的那一張卡：浮在最上面，貼著那張貼紙站。
     固定大小 —— 它是「講話的卡片」，不是版面的一部分，版面縮放不該動到它。 */
  .note-pop{
    position:fixed;z-index:80;width:300px;max-width:calc(100vw - 16px);
    max-height:70vh;overflow:auto;
    filter:drop-shadow(0 12px 30px rgba(16,24,40,.4));
  }
  .note-pop .icard{margin:0;cursor:default}

  /* PM 動過的那一格，設計在 落版 看得到。
     整格轉綠，不是角落貼一張小標：綠色在這支程式裡一直是「已經交出去了」
     （版位底色那一套就是灰／白／綠），所以格子本身變綠＝這一格 PM 收過了。
     一眼掃過去就看得出哪幾格還空著，不必去讀每個角落的小字。
     角落那張「已填寫」小標拿掉了 —— 格子中央現在就寫著有填寫／未填寫，
     同一件事寫兩次只是讓人多讀一遍。
     只在 落版（#view-sheet）出現；拼板 借同一份 DOM，那邊看得到內容本人。 */
  #view-sheet .cell.pm-filled{
    background:var(--ok-tint,#e6f4ec);
    border-color:var(--green-rule,#9ccfb2);
  }

  /* 小地圖上的貼紙統計：左下角一種一枚，右上角一顆紅色總數。
     這一組是「標記」，固定大小 —— 版位縮到多小它都要看得清楚。 */
  .mini-notes{
    position:absolute;left:3px;bottom:3px;display:flex;gap:2px;align-items:flex-end;
    pointer-events:none;
  }
  .mnk{
    width:13px;height:13px;border-radius:3px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;position:relative;
    font-size:9px;font-style:normal;font-weight:800;color:#3a3a3a;
    border:1px solid rgba(16,24,40,.28);box-shadow:0 1px 2px rgba(16,24,40,.22);
  }
  /* 留言沒有圖示，那就讓它是一張空白的貼紙 —— 形狀本身就是它 */
  .mnk.plain{}
  .mnk b{
    position:absolute;right:-3px;bottom:-4px;font-size:8px;line-height:1;
    color:var(--ink);background:var(--surface);border-radius:5px;padding:0 2px;
    border:1px solid rgba(16,24,40,.3);
  }
  .mini-cnb{
    position:absolute;top:2px;right:3px;min-width:14px;height:14px;padding:0 3px;
    border-radius:8px;background:var(--danger-ink,#d92d20);color:#fff;
    font-size:9.5px;font-weight:800;line-height:14px;text-align:center;
    box-shadow:0 1px 3px rgba(16,24,40,.35);pointer-events:none;
  }

  /* ================= 刊頭 rejected drop ================= */
  .masthead.reject{
    border-color:var(--accent) !important;background:var(--danger-tint) !important;
    color:var(--accent) !important;animation:lockShake .4s;
  }

  /* ==========================================================================
     操作區調深色 —— 版面本身是紙，其他都是桌面
     上面那條、左邊那欄、右邊那欄一律沉下去，中間那片（#sheetMain）維持原本的
     淺色，眼睛才會自己停在版面上。放在最後面：只覆蓋顏色，不動任何尺寸。
     ========================================================================== */
  :root{
    --chrome:#232a37;          /* 桌面：所有控制項站的底 */
    --chrome-2:#2e3747;        /* 浮在桌面上的東西（按鈕、書籤） */
    --chrome-ink:#eaeef7;
    --chrome-muted:#9aa6bc;
    --chrome-line:#3d4759;
  }
  body{background:var(--chrome);color:var(--chrome-ink)}
  .topbar h1{color:var(--chrome-ink)}

  /* 中間那片：版面連同它四周的空地就是「紙」，深色到這裡為止 */
  #sheetMain{background:var(--bg);border-radius:12px}
  /* 紙上的字是黑的：深色是給桌面用的，版面裡的一切照原本的顏色走。
     （少了這一行，落版打的字會繼承深色底那一套淺灰，白卡片上就快看不見了。） */
  #sheetMain,#view-total{color:var(--ink)}
  /* 檔期卡是白的，字也要回到黑的（少了這行，檔期名會淡到像沒開啟） */
  .plan-card{color:var(--ink)}
  /* 總體 那一頁沒有 #sheetMain，版面直接鋪在頁上 —— 那一整片也是紙 */
  #view-total{background:var(--bg);border-radius:12px;padding:10px 0}

  /* ---- 上面那條 ---- */
  .tab{background:rgba(255,255,255,.09);border-color:var(--chrome-line);color:var(--accent-ink)}
  .tab:hover{background:rgba(255,255,255,.16)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .btn.icon{background:rgba(255,255,255,.09);border-color:var(--chrome-line);color:var(--accent-ink)}
  .btn.icon:hover:not(:disabled){background:rgba(255,255,255,.16)}
  .btn.icon:disabled{background:rgba(255,255,255,.04)}
  .toggle{color:var(--chrome-muted)}
  .track{background:#4b566b}
  /* 檔期名這一段站在深色上：名字亮、日期和進度用暖色，跟分頁的藍分開 */
  .banner .nm{color:var(--chrome-ink)}
  .banner .rg,.bar .prog{color:#e6b465}
  .bar .prog b{color:var(--chrome-ink)}

  /* ---- 左邊那欄：小地圖／品類樹 ---- */
  #sheetSide{border-right-color:var(--chrome-line)}
  .mini-label{color:var(--chrome-ink)}
  /* PM 那一疊整個站在桌面上：段標題、檔期列都要自己寫顏色，不寫就是淺色底那一套 */
  #pmStack{border-right-color:var(--chrome-line)}
  .pm-sec .sec-head{color:var(--chrome-muted);border-top-color:var(--chrome-line)}
  .pm-sec .sec-head:hover{color:var(--chrome-ink)}
  .pl-row{background:var(--chrome-2);border-color:var(--chrome-line);color:var(--chrome-ink)}
  .pl-row:hover{border-color:var(--blue)}
  .pl-row.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .pl-row .sub,.pl-note{color:var(--chrome-muted)}
  .pl-row .sub .mine{color:#e6b465}
  .pl-row.active .sub{color:rgba(255,255,255,.85)}
  .pl-row.active .sub .mine{color:#ffe6b8}

  /* ---- 右邊那欄：意見欄 ---- */
  #boardRail{background:var(--chrome);border-left-color:var(--chrome-line)}
  #railTitle{color:var(--chrome-ink)}
  #railSub,#stickTray .hint,#railEmpty{color:var(--chrome-muted)}
  #railBack{background:rgba(74,111,220,.28);border-color:var(--blue);color:var(--accent-ink)}
  #stickTray{border-color:var(--chrome-line)}
  .lg{background:rgba(255,255,255,.07);border-color:var(--chrome-line);color:var(--chrome-muted)}
  .lg.on{color:var(--ink-strong)}                       /* 選中的那顆本來就上色，字要壓回深的 */

  /* ---- 兩根書籤：站在深色上，自己也得是深色 ---- */
  .fold-tab{background:var(--chrome-2);border-color:var(--chrome-line);color:var(--chrome-ink)}
  .fold-tab:hover{background:#3a4457;border-color:var(--blue);color:var(--accent-ink)}

  /* ---- 拆框 ------------------------------------------------------------
     原本每一塊東西都用一圈線圍起來：版面一個框、意見欄一個框、每張卡再一個框。
     框疊三層，中間那片就變成井底。線改成「只有現在正在發生的事」才畫粗、畫顏色，
     其他一律靠底色分塊 —— 分得出來就夠了，不必圍起來。 */

  /* 一、中間那片鋪到視窗邊：看不到盡頭的畫布才不覺得被關著 */
  .app{padding-left:0;padding-right:0;padding-bottom:0}
  .bar{padding-left:22px;padding-right:22px}
  .topbar,#view-plans{padding-left:24px;padding-right:24px}
  #boardSide{padding-left:16px}
  #sheetSide{padding-left:2px}
  #sheetMain,#view-total{border-radius:0}
  #view-board{padding-right:var(--railw,340px)}

  /* 二、線改成底色：該分開的靠深淺分，不靠框 */
  #boardRail{border-left:1px solid var(--chrome-line)}
  #stickTray{border:0;background:rgba(255,255,255,.055);border-radius:12px;padding:8px}
  .lg{border-width:1px}
  #armHint{border-width:1px}
  .icard{
    border:1px solid rgba(16,24,40,.10);border-left:6px solid var(--nc,#98a2b3);
    box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .icard .box textarea{border-width:1px}
  .icard .acts button{border-width:1px}
  .mini-page{border:1px solid rgba(255,255,255,.28)}
  /* 面板是浮起來的紙：靠影子站出來，不必再框一圈藍 */
  #boardStage{border:1px solid var(--chrome-line);box-shadow:0 18px 44px rgba(0,0,0,.45)}

  /* 三、粗線和顏色留給「正在發生的事」：拖到哪一格、正在看哪一格、選中的那一則。
     這些狀態維持原本的粗細 —— 它們該搶眼，因為它們會消失。 */

  /* ==========================================================================
     乾淨版（列印 → 另存為 PDF）
     印出來的東西要跟印刷廠拿到的那一份一樣：刊頭圖、每一格的商品版面，沒有別的。
     便利貼、標籤、把手、按鈕、壓暗、hover 的框全部是螢幕上的東西 —— 它們是
     「你現在在做什麼」的提示，不是版面的一部分。

     為什麼不搬 DOM：#board 裡每一格都是一個 iframe（畫布本人），搬到別的節點底下
     瀏覽器會重載它，重載完那一格就空了。所以這裡一行 DOM 都不動，只用
     visibility 把整頁藏起來、再把 #board 那一支放出來（visibility 會繼承，
     display 不會，所以藏得掉又放得回來）。--pk 是主程式量好的縮放，讓這個版位
     整塊剛好落在一張紙上。
     這一段擺在 stylesheet 最後面，理由跟深色那一段一樣：靠來源順序蓋過去。
     ========================================================================== */
  @media print{
    @page{size:A4 landscape;margin:8mm}
    html,body{background:#fff !important;height:auto !important;overflow:visible !important}
    body{visibility:hidden !important}
    #board{
      visibility:visible !important;
      position:fixed !important;left:0 !important;top:0 !important;margin:0 !important;
      background:transparent !important;
      transform:scale(var(--pk,1)) !important;transform-origin:top left !important;
    }
    #board *{visibility:visible !important}
    /* 螢幕上的東西：把手、標籤、便利貼、紅色數字、落點、拖曳線 */
    #board .grip,#board .cst,#board .cmk,#board .cnb,#board .cbadge,
    #board .mh-grab,#board .mh-move,#board .mh-x,#board .mh-zone,
    #board .drop-line,#board .mh-label{display:none !important}
    /* 格子只是位置，不是印出來的線。壓暗、選取、hover 的框同理 —— 那些講的是
       「棒子在誰手上」「你正在點哪一格」，跟印刷品無關。 */
    #board .cell{
      border:0 !important;border-radius:0 !important;background:transparent !important;
      outline:none !important;opacity:1 !important;padding:0 !important;
      /* 落版打的字和「未填寫」都不印：這一頁印的是拼好的版面 */
      font-size:0 !important;
    }
    #board .cell::before,#board .cell::after{content:none !important}
    /* 刊頭：有圖就只有圖，沒圖就是一塊空地（那塊虛線框是給人指的落點） */
    #board .masthead{border:0 !important;background:transparent !important}
    /* 畫布本人 —— 這才是要印的東西。平常它壓在卡片底色之下（z-index:-1）。 */
    #board .ccanvas{visibility:visible !important;z-index:0 !important}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar" id="listChrome">
    <!-- 「你是誰」講在右邊那個名牌上（#whoName），標題就只是標題 ——
         同一件事寫兩個地方，遲早有一個會忘記跟著改。 -->
    <h1 id="listTitle">進行中檔期</h1>
    <!-- 測試用：把這台瀏覽器上的東西全部清掉，回到什麼都沒有的狀態 -->
    <!-- devtool：一鍵生一個「做到一半」的假檔期。虛線邊、灰字，看得出來它不是
         正常流程裡的按鈕。放在檔期列表而不是拼板裡 —— 它做的事是「多一筆檔期」。 -->
    <button id="stressPlanBtn" title="另生一個「壓力測試」假檔期並開起來，真實檔期不動"
            style="padding:5px 11px;font:inherit;font-size:12px;font-weight:800;
                   border:1.5px dashed var(--muted);border-radius:8px;background:transparent;
                   color:var(--muted);cursor:pointer">壓力測試：塞滿假檔期</button>
    <!-- 這一整排都是行銷的（見 syncListButtons）：講的都是「這本 DM 存不存在、
         什麼時候做」。一開始全部 hidden，登入之後才知道要不要給。 -->
    <button class="btn danger" id="wipeBtn" hidden
            title="清掉這台瀏覽器存的所有檔期與設定">清空資料</button>
    <button class="btn" id="importBtn" hidden>匯入</button>
    <button class="btn" id="pastBtn" hidden>📁 過往檔期</button>
    <button class="btn" id="trashBtn" hidden>🗑 回收桶</button>
    <button class="btn primary" id="newPlanBtn" hidden>＋ 新增檔期</button>
    <!-- 身分列上那三顆拿掉之後，這裡是唯一寫著「你是誰」的地方 -->
    <span id="whoBadge"><b id="whoName"></b><button class="btn" id="logoutBtn"
            title="回到登入頁換一個人">登出</button></span>
  </div>
  <input type="file" id="importInput" accept=".json,.html,.htm" multiple hidden>

  <!-- 開了檔期之後回列表用的。以前這條列上還有設計／PM／行銷三顆和換 PM 的下拉，
       改成登入之後那些都沒了 —— 你是誰是登入頁決定的，這裡只剩一條回頭路。 -->
  <div class="modebar" id="modeBar">
    <button class="btn back" id="backBtn">← 檔期列表</button>
    <span class="handle"></span>
  </div>

  <div id="editorChrome">
  <div class="bar">
    <!-- 檔期名跟分頁同一列：它是「現在在看哪一檔」，不必自己佔一整條 -->
    <div class="banner">
      <span class="nm" id="bannerName"></span>
      <span class="rg" id="bannerRange"></span>
    </div>
    <button class="tab active" data-tab="total">總體</button>
    <button class="tab" data-tab="sheet">落版</button>
    <button class="tab" data-tab="board">拼板</button>
    <div class="hist">
      <button class="btn icon" id="undoBtn" data-key="⌘Z" title="復原 (⌘/Ctrl+Z)" disabled>↶</button>
      <button class="btn icon" id="redoBtn" data-key="⇧⌘Z" title="重做 (⌘/Ctrl+Shift+Z)" disabled>↷</button>
    </div>
    <!-- 切在幾公分：填了就照數字切，空著就照點下去的位置切。跟開檔那支同一條規矩，
         擺的位置也一樣（最上面那條），只有 總體 拿起 切分 時才出現。 -->
    <div id="cutBar">切在<input id="cutLen" type="number" min="0" step="0.1" placeholder="—"
           title="從指到的那一塊的左（直切）／上（橫切）緣量起">cm 處<button
           class="btn" id="cutGo" type="button" disabled>切下去</button></div>
    <div class="right">
      <!-- 匯出乾淨版：走瀏覽器的列印，目的地選「另存為 PDF」就是一份 PDF。
           見 stylesheet 最後的 @media print。 -->
      <!-- 提交給設計：只有行銷、只有還是草稿的檔期看得到。每一塊版位都填齊了才按得下去。 -->
      <button class="btn primary" id="submitBtn" hidden>提交給設計</button>
      <button class="btn" id="exportBtn"
              title="把這個版位印成乾淨版：沒有便利貼、按鈕、把手、壓暗和標籤。在列印對話框把目的地選成「另存為 PDF」">匯出乾淨版</button>
      <span id="hereNow"></span>
      <span class="prog" id="bannerProg"></span>
      <span id="saveState"></span>
      <!-- 名牌和登出在這裡：開著檔期的時候，這是唯一看得到「你是誰」的地方 -->
      <span id="whoSlot"></span>
      <label class="toggle" id="snapWrap">
        <input type="checkbox" id="snapToggle" checked>
        <span class="track"></span>
        <span>磁吸對齊</span>
      </label>
    </div>
  </div>

  <div id="toolHint"></div>
  </div>

  <!-- 這一刀會切在哪：紅線 ＋ 幾公分。站在最外面，不塞進版位裡 -->
  <div id="cutPreview"><span class="lbl"></span></div>

  <!-- 品類／支數：貼在點到的那一塊旁邊。跟開檔那支的「點選」是同一件事 -->
  <div id="itemPop">
    <div class="ip-head"><span class="ip-title"></span><button class="ip-x" title="關起來">✕</button></div>
    <div class="ip-list"></div>
    <div class="ip-add">
      <input class="ip-name" list="catList" placeholder="品類" autocomplete="off">
      <input class="ip-qty" type="number" min="1" step="1" placeholder="支數">
      <button class="ip-plus" title="加一個品類">＋</button>
    </div>
    <div class="ip-note">支數改了，格子跟著加減 —— 已經拼好的那幾格不動。</div>
  </div>
  <datalist id="catList"></datalist>

  <div class="panel active" id="view-plans">
    <!-- 目前階段管理：手動指定某一檔現在走到哪一階段。開發／示範用的東西，
         所以收得起來（記在 catalogue_statusbar_folded）。 -->
    <div id="statusBar" hidden></div>
    <div id="planList"></div>
  </div>

  <!-- 開檔表＋時間軸。行銷專用：新增一個檔期、或改一個檔期的時程都走這一張。
       從 落版單系統 搬過來的，所以名字和結構都跟那邊一樣（好對照）。 -->
  <div class="panel" id="view-plan">
    <div class="head-row">
      <button class="btn" id="planBackBtn">← 返回</button>
      <h2 id="planTitle">開檔</h2>
      <div class="spacer"></div>
      <!-- 帶入是「照上一次的抄一份」，那是開新檔期才有的動作（改時程時收起來） -->
      <button class="btn" id="impOpenBtn">帶入</button>
      <span id="whoSlotPlan"></span>
    </div>

    <div class="form-grid">
      <div class="form-line">
        <label>名字</label>
        <input type="text" id="nameInput" placeholder="例：2026年8月1波">
        <label style="margin-left:18px">開始日</label>
        <input type="date" id="startInput">
        <label style="margin-left:18px">總長</label>
        <input type="number" id="totalInput" min="5">
        <span class="unit-tail">天</span>
      </div>
      <div class="form-line">
        <label>DM類別</label>
        <div id="typeBtns" style="display:flex;gap:8px"></div>
      </div>
      <div class="form-line">
        <label>標籤</label>
        <div class="tagbox" id="tagBox">
          <input id="tagInput" placeholder="輸入後按空格成標籤">
        </div>
        <div class="preset-tags" id="presetTags"></div>
      </div>
    </div>

    <div class="dur-row" id="durRow"></div>

    <div class="tl-scroll">
      <div class="tl-panel" id="tlPanel">
        <div class="stack-layer" id="stackLayer"></div>
        <div class="bar-wrap"><div id="bar"></div></div>
        <div class="number-labels" id="numberLabels"></div>
        <div id="track"></div>
      </div>
    </div>

    <div class="plan-actions"><button class="btn primary" id="planNextBtn">下一步</button></div>
  </div>

  <!-- 總體 的小工具。預設是 選擇（只看、只點得亮一塊），切分和移動都要自己拿起來 ——
       這一頁動的是整本 DM 的骨架，不該用「滑過去就改掉了」的方式做。
       長得跟 落版 那條工具列一樣：同一件事（我現在拿著什麼）就該長同一個樣子。 -->
  <div class="panel" id="view-total">
    <div id="totalRail">
      <div class="rail-title">工具</div>
      <button class="tool active" data-ttool="pick" title="選擇：點一塊把它點亮，版面不會被動到">⬚</button>
      <!-- 跟開檔那支的「點選」同一顆圖示（✏️）—— 兩邊做的是同一件事 -->
      <button class="tool" data-ttool="items" title="品類：點一塊，填它要放哪些品類、各幾支">✏️</button>
      <button class="tool" data-ttool="cut" title="切分：點一塊，就從你點下去的那條線切成兩塊">✂</button>
      <button class="tool" data-ttool="swap" title="移動：把一塊拖到另一塊上，兩塊對調（品類、格子、刊頭一起走）">⇄</button>
      <!-- 方向只有兩個，就給兩個落點讓人指，不要叫人用滾輪去猜現在是哪一種 -->
      <div id="cutDirs">
        <button class="tool sub on" data-cutdir="v" title="直切：切成左右兩塊">⇔</button>
        <button class="tool sub" data-cutdir="h" title="橫切：切成上下兩塊">⇕</button>
      </div>
    </div>
  </div>

  <!-- 拼板：小地圖一直留在左邊當定位，右邊在「整張版」和「拼一格」之間換。
       拼一格是 2cell-product-pick.html 原封不動跑在 iframe 裡，樣式與腳本各自獨立。 -->
  <div class="panel" id="view-board">
    <!-- PM 的左欄是一疊三段（檔期／品類樹／小地圖），設計的左欄就是小地圖本人。
         小地圖（#sheetSide）是同一顆 DOM 搬來搬去 —— PM 這邊掛進 #secMini 裡。 -->
    <div id="boardSide">
      <div id="pmStack">
        <div class="pm-sec" id="secPlans">
          <div class="sec-head" data-sec="plans"><span class="caret">▾</span><span>檔期</span><span class="n"></span></div>
          <div id="pmPlans"></div>
        </div>
        <div class="pm-sec" id="secMini">
          <div class="sec-head" data-sec="mini"><span class="caret">▾</span><span>整本落版</span><span class="n"></span></div>
        </div>
      </div>
    </div>
    <!-- 字級：跟 落版 的工具列同一個位置、同一個樣子。它跟工具一樣是「對這個版位
         做的事」，站在畫布左邊比擠在最上面那條橫的好找。
         一個版位一套；價格照「這一格有幾個價格」分三組，各自一個轉盤。 -->
    <div id="typeWrap">
      <div class="rail-title">字級</div>
      <label class="tw-n">SKU<input type="number" id="skuSize" min="4" max="60" step="0.5"></label>
      <label class="tw-n">一價<input type="number" id="price1" min="8" max="200" step="1" placeholder="自動"></label>
      <label class="tw-n">二價<input type="number" id="price2" min="8" max="200" step="1" placeholder="自動"></label>
      <label class="tw-n">三價<input type="number" id="price3" min="8" max="200" step="1" placeholder="自動"></label>
      <button class="btn" id="typeReset" title="三個價格轉盤都交還給自動" aria-label="還原成自動">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path>
        </svg>
      </button>
    </div>
    <div id="boardMain">
      <!-- 便利貼蓋在版面上，要看原樣的時候整批收起來。浮在左欄旁邊：它管的是
           版面上看得到什麼，不是意見欄裡的事 -->
      <label class="toggle" id="markWrap">
        <input type="checkbox" id="markToggle" checked>
        <span class="track"></span>
        <span>顯示便利貼</span>
      </label>
      <div id="boardOverview"></div>
    </div>
    <!-- 意見欄：貼紙從這裡拖到格子上，貼上去的每一則都在下面排成一張卡 -->
    <div id="boardRail">
      <div id="railHead">
        <span id="railTitle">全部問題</span>
        <button id="railBack">← 看全部</button>
        <span id="railSub"></span>
      </div>
      <div id="railLegend"></div>
      <div id="stickTray">
        <div class="hint">把貼紙拖到格子上（或先點貼紙，再點格子）</div>
        <div id="stickRow"></div>
        <!-- 蓋章站在貼紙旁邊，因為它們是同一件事的兩半：貼紙是「我有話跟 PM 說」，
             蓋章是「這幾格給你了」。都是對 PM 做的動作，手就該在同一個地方。 -->
        <button id="stampBtn" hidden>
          <span class="ico">📮</span>

<!-- 共用資料層。這兩支是選配的：檔案不在（或 config.js 還是佔位符）時 PlanSync.ok()
     回 false，整支程式就走原本純 localStorage 的路徑，跟沒接後端一模一樣。 -->
<script src="config.js"></script>
<script src="supabase-sync.js"></script>

<script>
(function(){
'use strict';

/* ==========================================================================
   鍵盤快速鍵 — KEYBOARD SHORTCUTS
   Modelled on Photoshop, since that is what these designers live in. Every
   shortcut below is ignored while the caret is inside a card or a number
   field, so typing copy never triggers a tool.

   ---- 全域 (both views) --------------------------------------------------
   Ctrl/Cmd + Z          復原        undo one committed action (max 50)
   Ctrl/Cmd + Shift + Z  重做        redo
   Ctrl/Cmd + Y          重做        redo (Windows alias)
   Esc                   取消        cancel + revert any drag in flight;
                                     also closes the modal / inline field

   ---- 落版 view ----------------------------------------------------------
   V                     搬移工具    move tool (disabled until 確認)
   Z                     縮放工具    zoom tool
   S                     選取工具    select / type tool
   Space (hold)          手形工具    temporary pan — drag to scroll, release
                                     to return to the previous tool
   Ctrl/Cmd + +  or  =   放大        zoom in about the sheet centre
   Ctrl/Cmd + -          縮小        zoom out
   Ctrl/Cmd + 0          符合視窗    fit the whole 版位 in the pane
   滾輪                  縮放        zoom toward the cursor, any tool, 落版 and 拼板
   Click (Z tool)        放大        zoom in toward the click
   Alt + Click (Z tool)  縮小        zoom out from the click
   Tab / Enter           下一格      next card; Shift+Tab / Shift+Enter back

   ---- 總體 view ----------------------------------------------------------
   Alt (hold, dragging)  暫停磁吸    bypass 磁吸對齊 while held
   Drag from ruler       新增參考線  pull a cyan guide out of either ruler
   Drag guide to ruler   刪除參考線  drop it back on the ruler to remove it
   Double-click ruler    清除參考線  clear every guide on that board
   Double-click divider  50/50       reset that pair to an even split
   Click divider         輸入公分    inline field for an exact cm position
   ========================================================================== */

/* ==========================================================================
   CONFIG
   ========================================================================== */
/* ---- 版面實際多大（公分）------------------------------------------------
   尺規、游標讀數、對齊線、切分的長度，全部用公分 —— 版上的其他東西（刊頭、列高）
   本來就是公分，同一頁上不該有兩把尺。以前這裡是「尺」：20 格 × 10 格的格子，
   那個「尺」既不是台尺也不是公分，只是一個沒有人量得出來的格。
   （以前開檔那支有自己的一份，改一邊要改兩邊。兩支合併之後只剩這一份了。）
   ——兩支沒有共用的程式碼可以放。要照貴公司真正的發印尺寸校正。 */
const DM_SIZE = {
  '全省對開大DM': { w: 78.7, h: 54.5 },   // 對開（全開 78.7×109 的一半），攤開是橫的
  '網路素材':     { w: 42.0, h: 29.7 },   // 沒有發印尺寸，先照 A3 攤開
  '單店制作物':   { w: 42.0, h: 29.7 },
  'A3':          { w: 42.0, h: 29.7 }
};
const DM_SIZE_FALLBACK = { w: 42.0, h: 29.7 };
/** 現在這一張版多大（cm）。認不得的類別就照 A3 —— 尺規上有數字總比沒有好。 */
const boardCm = () => (currentPlan && DM_SIZE[currentPlan.type]) || DM_SIZE_FALLBACK;
/* 尺規上有幾格＝版面幾公分。原本這兩個是 CONFIG 裡寫死的 20／10。 */
const unitsLen  = () => boardCm().w;
const unitsSide = () => boardCm().h;
/* 一公分畫出來是幾個 px。量的是真的畫出來的那一邊，所以換視窗大小也跟著對。
   分左右是為了保險：版子現在是照真實公分比畫的（boardPx()），兩軸的一公分理應
   一樣長；但尺規本來就各量各的（bw/lenCm、bh/sideCm），這裡跟著它，就算哪天
   那個矩形又被寫死成別的比例也不會量錯。 */
function pxPerCm(el, vertical){
  const ws = el && el.closest && el.closest('.board-ws');
  const cm = boardCm();
  return vertical === false
    ? ((ws && ws.clientHeight) || 1) / cm.h
    : ((ws && ws.clientWidth)  || 1) / cm.w;
}

/* 版子畫多大：寬固定，高**照真實公分比算出來** —— 這個矩形是所有比例的基準
   （fitBoards 照它縮放、blockAspect 拿它量一個版位長什麼形狀），寫死 742×525
   的話整張版就被畫成 1.413 的比例，而真正的對開是 1.444，差 2%：橫的一公分和
   直的一公分在螢幕上不一樣長，量出來的「版位有幾公分高」也跟著偏。 */
const BOARD_REF_W = 742;
const boardPx = () => {
  const cm = boardCm();
  return { w: BOARD_REF_W, h: BOARD_REF_W * cm.h / cm.w };
};

const CONFIG = {
  snapPx:     6,
  alignBias:  2,                         // how far Canva-style alignment may outrank the grid
  minPercent: 6,
  snapOn:     true,
  gutter: { left: 36, bottom: 30 },
  defaultMasthead: { w: 36.6, h: 13 },   // 刊頭 in cm, editable per block
  minCellW: 64, minRowH: 76,             // legibility floors (minRowH == card min-height)
  maxGridHeightFactor: 1.75,             // how far past the pane a grid may run
  /* 刊頭最多吃掉版位的九成。本來是六成，但那個上限是「我猜你不會想要更長」——
     真的要一條很長的刊頭時，它就變成一堵拉不動的牆，而且完全不說為什麼。
     卡片被擠扁是可以接受的結果（列高有 minRowH 擋著，擠到底就換成整疊比版位高），
     擋住人想做的事不行。留最後一成是因為 cellAspect 要除以 (1 - mhFrac)，
     真的給到 1 就變成除以 0。 */
  mastheadMaxFrac: 0.9,
  /* 刊頭站在旁邊時，那一柱最少要留多少。上下那條已經完全沒有下限了（縮到看不見
     也沒關係，刊頭旁邊的公分欄打個數字就回得來），但站著的時候那個欄位是關掉的
     （見 renderHead 的 inp.disabled），唯一的回頭路就是那根把手 ——
     所以這裡要留一條抓得到的邊，不能給到 0。 */
  sideMinFrac: 0.05
};

/* 刊頭站在旁邊時佔多寬。上限跟躺著的時候同一個（mastheadMaxFrac）——
   本來這裡自己寫死 .6，那正是 mastheadMaxFrac 註解裡講的、後來被放寬掉的那道牆：
   「我猜你不會想要更長」，拉到底就不動了，而且完全不說為什麼。躺著的改了，
   站著的沒人回頭改，於是同一個刊頭轉個方向就少掉三成可調範圍。
   兩個地方（sheetMetrics 和拖那條縫）夾的是同一個範圍，所以夾在這裡，別再各寫各的。 */
const clampSideFrac = f =>
  Math.max(CONFIG.sideMinFrac, Math.min(CONFIG.mastheadMaxFrac, f || .3));

const FOLD_PX = 2;
const RESIZE_PX = 1;
/* 卡片之間不留縫：整個版位是一塊實心的方塊，卡片彼此相接，刊頭也貼著卡片
   —— 那才是落版單本來的樣子。要留的是整塊外面那 15px 的邊界。
   CSS 讀的是同一個數字（--gap），所以量出來的版面和算出來的永遠對得起來。 */
const ROW_GAP = 0;
const BLOCK_MARGIN = 15;         // 整塊版面四周留的邊
/* 一列最多幾格（＋ 按到這裡就停）。照 grid-reorder 那份示範的數字 ——
   再多下去一格連個品名都放不下，那不是版面是條紋。 */
const MAX_PER_ROW = 60;

/* ==========================================================================
   TOAST ・ MODAL
   Native alert()/confirm() block the thread and look nothing like the rest of
   the app, so everything routes through these two instead.
   ========================================================================== */

const toastHost = document.getElementById('toastHost');
const modalHost = document.getElementById('modalHost');

function toast(msg, kind, ms){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  el.textContent = msg;
  toastHost.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, ms || 2200);
  return el;
}

/** Styled stand-in for confirm(). Resolves true on 確定, false on 取消/Esc. */
let modalClose = null;
function modalConfirm(opts){
  return new Promise(resolve => {
    modalHost.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'modal';

    const h = document.createElement('h4');
    h.textContent = opts.title || '確認';
    const p = document.createElement('p');
    p.textContent = opts.body || '';
    const acts = document.createElement('div');
    acts.className = 'acts';

    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = opts.cancel || '取消';
    const ok = document.createElement('button');
    ok.className = 'btn ' + (opts.danger ? 'danger' : 'primary');
    ok.style.marginLeft = '0';                 // .primary would push it away
    ok.textContent = opts.ok || '確定';

    const done = v => { modalHost.classList.remove('on'); modalHost.innerHTML = '';
                        modalClose = null; resolve(v); };
    cancel.addEventListener('click', () => done(false));
    ok.addEventListener('click', () => done(true));
    modalHost.addEventListener('click', e => { if (e.target === modalHost) done(false); });
    modalClose = () => done(false);            // Esc, wired in the key handler

    acts.appendChild(cancel); acts.appendChild(ok);
    box.appendChild(h); box.appendChild(p); box.appendChild(acts);
    modalHost.appendChild(box);
    modalHost.classList.add('on');
    ok.focus();
  });
}

/* ==========================================================================
   AUTO-SAVE
   Every mutation calls markDirty(); the write itself is debounced so a drag
   that fires a hundred commits still costs one localStorage round-trip.
   ========================================================================== */

const SAVE_DEBOUNCE = 1000;
const saveStateEl = document.getElementById('saveState');
let saveTimer = 0, savePending = false;

/** kind: 'dirty' | 'saving' | 'done' | 'fail' | 'off' */
function setSaveState(kind){
  const map = {
    dirty:  ['● 未儲存',   'dirty'],
    saving: ['儲存中…',    'dirty'],
    done:   ['✓ 已儲存',   'done'],
    fail:   ['⚠ 儲存失敗', 'fail']
  };
  saveStateEl.classList.remove('dirty', 'done', 'fail');
  if (kind === 'off' || !map[kind]){ saveStateEl.classList.remove('on'); return; }
  saveStateEl.textContent = map[kind][0];
  saveStateEl.classList.add('on', map[kind][1]);
}

function markDirty(){
  if (!currentPlan) return;
  /* 動過手才有東西會覆蓋掉別人 —— 輪詢撞到的時候要靠它決定是「提醒一下」
     還是「停止上傳、問一句」。 */
  planTouched = true;
  stampLastBy(currentPlan);        // 誰改的寫進 plan 自己的 JSON，輪詢就講得出名字
  savePending = true;
  setSaveState('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE);
}

let saveFailWarned = false;
function flushSave(){
  clearTimeout(saveTimer); saveTimer = 0;
  if (!savePending) return;

  if (!savePlans()){
    // stays pending, so 返回 and tab-close still warn about it
    setSaveState('fail');
    if (!saveFailWarned){
      saveFailWarned = true;
      toast('儲存失敗：瀏覽器儲存空間可能已滿，請先清理或減少刊頭圖片', 'warn', 6000);
    }
    return;
  }
  savePending = false;
  saveFailWarned = false;
  setSaveState('done');

  /* 本機存成功了才往上送，而且只送當下這一個檔期 —— 整包送會讓「行銷改 A 檔」
     被「設計手上還是舊版的 A 檔」蓋掉。上傳自己還有 600ms 的 debounce。 */
  const s = sync();
  /* 已經知道別人也在改這一檔了：再送上去就是把他的整包蓋掉。本機照樣存
     （你的東西不會不見），只是先不往共用資料庫送，等你在那一條上做決定。
     ⚠️ 要記住「有一筆被扣著」：上面已經把 savePending 清掉了（本機那一半確實做完了），
     所以解除封鎖之後再叫一次 flushSave() 什麼也不會發生 —— 那一筆就這樣沒了。 */
  /* 以前這裡會在撞到別人時停止上傳（remoteBlocked）。有了三方合併之後不必了：
     送上去的時候會先跟對方那一份合，改的不是同一塊就兩邊都留得住。
     擋是「我不知道該怎麼辦」，合併是「我知道」。 */
  if (s && currentPlan) s.queueUpsert(currentPlan);
}

/* ==========================================================================
   HISTORY — Photoshop's 步驟記錄
   A snapshot is the whole plan state (layout tree + guides) as JSON, taken
   after each COMMITTED action: a drag that ended, a 確認, a delete, a text
   blur. Never per keystroke — typing a name would otherwise bury every other
   step in the stack.
   ========================================================================== */

const HISTORY_MAX = 50;
let histStack = [], histAt = -1, histLock = false;
/* 復原之後，格子裡的畫布會重新載入、再自己回報一次內容 —— 那不是你做的一步。
   剛復原完的那一下子，回報一律不記帳，否則重做那一疊會被它清掉。 */
let histQuiet = 0;

const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');

/** Grey the arrows out when there is nowhere to go, so the stack is visible. */
function syncHistoryBtns(){
  const canUndo = !!currentPlan && histAt > 0;
  const canRedo = !!currentPlan && histAt < histStack.length - 1;
  undoBtn.disabled = !canUndo;
  redoBtn.disabled = !canRedo;
  undoBtn.title = canUndo ? `復原 (⌘/Ctrl+Z)　剩 ${histAt} 步` : '沒有可復原的步驟';
  redoBtn.title = canRedo
    ? `重做 (⌘/Ctrl+Shift+Z)　剩 ${histStack.length - 1 - histAt} 步`
    : '沒有可重做的步驟';
}

undoBtn.addEventListener('click', () => undo());
redoBtn.addEventListener('click', () => redo());

function snapshot(){
  return JSON.stringify({
    layout: currentPlan.layout,
    guides: currentPlan.guides || null,
    active: activeBlock ? activeBlock.id : null
  });
}

/** Record the state as it stands now. Call AFTER applying the change. */
function pushHistory(){
  if (!currentPlan || histLock || Date.now() < histQuiet) return;
  const s = snapshot();
  if (histStack[histAt] === s) return;         // nothing actually moved
  histStack.length = histAt + 1;               // a new branch drops the redos
  histStack.push(s);
  if (histStack.length > HISTORY_MAX) histStack.shift();
  histAt = histStack.length - 1;
  syncHistoryBtns();
}

/* 便利貼不進復原 —— 但光是「貼的時候不 pushHistory」擋不住：便利貼住在
   cell.notes 裡，而 cell.notes 在 plan.layout 底下，snapshot() 一序列化就把它們
   一起收走了。所以復原任何一個「別的」動作，都會連帶把之後貼的貼紙一起抹掉。
   解法是還原完再把現在版上的便利貼原封不動放回去：復原改的是版面，不是對話。
   收的時候連空陣列也收（map.has 才問得出「這一格現在就是沒有貼紙」），
   不然撕掉的那一則會被舊快照救回來。 */
function collectNotes(layout){
  const map = new Map();
  ['front', 'back'].forEach(side => collectBlocks(layout[side], []).forEach(b =>
    ((b.sheet && b.sheet.cells) || []).forEach(c => map.set(String(c.id), c.notes || []))));
  return map;
}
function restoreNotes(layout, map){
  ['front', 'back'].forEach(side => collectBlocks(layout[side], []).forEach(b =>
    ((b.sheet && b.sheet.cells) || []).forEach(c => {
      /* 快照裡有、但現在版上沒有的格子（復原把它救回來了）就保留快照那一份 ——
         那些貼紙本來就不在畫面上，不算「現在的對話」。 */
      if (map.has(String(c.id))) c.notes = map.get(String(c.id));
    })));
}

function applySnapshot(json){
  const keepNotes = collectNotes(currentPlan.layout);
  const snap = JSON.parse(json);
  currentPlan.layout = snap.layout;
  restoreNotes(currentPlan.layout, keepNotes);
  currentPlan.guides = snap.guides || { front: [], back: [] };
  histLock = true;                             // rebuilding must not re-record
  histQuiet = Date.now() + 700;                // 連帶擋掉畫布晚一步的回報
  try { rebuildAll(snap.active); } finally { histLock = false; }
  markDirty();
  syncHistoryBtns();
}

function undo(){
  if (!currentPlan || histAt <= 0){ toast('沒有可復原的步驟', 'info', 1400); return; }
  histAt--;
  applySnapshot(histStack[histAt]);
  toast('已復原', 'info', 1200);
}

function redo(){
  if (!currentPlan || histAt >= histStack.length - 1){
    toast('沒有可重做的步驟', 'info', 1400); return;
  }
  histAt++;
  applySnapshot(histStack[histAt]);
  toast('已重做', 'info', 1200);
}

/** One committed action: record it and schedule the save. */
function commitAction(){ pushHistory(); markDirty(); }

/* ==========================================================================
   TREE
   container: { dir:'row'|'col', children:[...], size:<pct|null>, fold:true? }
   leaf(block): { id, name, groups:[{name,count}], size, noMasthead?, sheet:{...} }

   `size` is flex-basis % within the parent; the LAST child carries size:null
   and renders as `flex:1 1 0%`, so a row sums to exactly 100% with no drift.

   Per spec §6 every 落版 concern (cell order, masthead, 每列幾格) lives on
   the block node itself, so the single tree is the whole app state and
   exportLayout() carries 落版 along for free.
   ========================================================================== */

let uid = 0;
function blk(name, groups, size, opts){
  return Object.assign({
    id: 'b' + (++uid),
    name, groups, size,
    sheet: { cells: null, masthead: null,
             rows: null,      // frozen row split once the user drags a row
             mastheadW: CONFIG.defaultMasthead.w,
             mastheadH: CONFIG.defaultMasthead.h }
  }, opts || {});
}

/* Every 檔期 owns its own tree, so 落版 state (cell text, 刊頭, 每列幾格)
   never leaks between plans. Called fresh per plan; blk() hands out
   unique ids each time. Blocks per slide A / dm-block-zoom.html's PAGES. */
function buildLayout(){ return {
  front: {
    dir:'row', fold:true, size:null, children:[
      { dir:'col', size:50, children:[
        blk('刮鬍刀', [{name:'刮鬍刀', count:14}], 55),
        blk('小家電', [{name:'小家電', count:77}], null, { noMasthead:true })
      ]},
      { dir:'col', size:50, children:[
        blk('空調', [{name:'空調', count:40}], 62),
        blk('五機', [{name:'五機', count:45}], null)
      ]}
    ]
  },
  back: {
    dir:'row', fold:true, size:null, children:[
      { dir:'col', size:50, children:[
        blk('開學季資訊', [{name:'開學季資訊', count:20}], 48),
        blk('通訊數位商品', [{name:'手機', count:18},{name:'筆電', count:12},{name:'平板', count:6}], 36),
        blk('揪居家', [{name:'寢具', count:9},{name:'收納', count:7}], null)
      ]},
      { dir:'col', size:50, children:[
        blk('冰箱・洗衣機', [{name:'冰箱', count:24},{name:'洗衣機', count:18}], 48),
        blk('電視・聲霸', [{name:'電視', count:24},{name:'聲霸', count:8}], null)
      ]}
    ]
  }
}; }

let layout = null;                      // set when a 檔期 is opened

/* ==========================================================================
   一格走到第幾關（cell.st）
   本來只記「在設計還是在 PM」（cell.at），但兩邊來回傳三四趟長得一模一樣 ——
   看到「在設計」講不出這是第一次做還是二改。實際的流程本來就有名字，照那串名字記：

     提明細作業(商品部PM) → 製作(設計) → 一校(PM) → 一改(設計)
       → 二校(PM) → 二改(設計) → 蓋章(PM&商品部各主管) → 蓋章修改(設計) → 蓋章 → …

   最後兩關是一個圈：蓋章改完再蓋一次，來回到雙方都沒意見為止（CELL_STAGE_LOOP）。
   「在誰手上」不再另外存，是這一關的 side 算出來的 —— 同一個問題不留兩個答案。

   跟檔期列表那串 STAGES（提品／製作／…／審稿／出稿）是兩件事，名字才刻意分開：
   那一串是**整個檔期**的排程，一關一個日期區間；這一串是**一格**走到哪，
   一格一格各走各的，而且會在最後兩關來回好幾趟。

   表放在這裡（而不是跟 cellAt 擺一起）是因為畫版面的程式碼寫在更上面，
   const 的 TDZ 會在載入途中就炸掉整支程式。 */
const CELL_STAGES = [
  { k:'提明細',   t:'提明細作業', by:'商品部 PM',        side:'pm'     },
  { k:'製作',     t:'製作',       by:'設計',             side:'design' },
  { k:'一校',     t:'一校',       by:'PM',               side:'pm'     },
  { k:'一改',     t:'一改',       by:'設計',             side:'design' },
  { k:'二校',     t:'二校',       by:'PM',               side:'pm'     },
  { k:'二改',     t:'二改',       by:'設計',             side:'design' },
  { k:'蓋章',     t:'蓋章',       by:'PM & 商品部各主管', side:'pm'    },
  { k:'蓋改',     t:'蓋章修改',   by:'設計',             side:'design' }
];
const CELL_STAGE_LOOP = 6;              // 走完最後一關就回到蓋章，之後一直來回

function cellStage(c){
  const i = c && c.st;
  return (typeof i === 'number' && CELL_STAGES[i]) ? i : 0;
}
function stageOf(c){ return CELL_STAGES[cellStage(c)]; }
function stageNext(i){ return i + 1 < CELL_STAGES.length ? i + 1 : CELL_STAGE_LOOP; }
function stagePrev(i){ return i > 0 ? i - 1 : 0; }
/* 第一關是預設值，就不留欄位 —— 存檔小一點，也省得舊檔期看起來像被改過 */
function setCellStage(c, i){ if (i) c.st = i; else delete c.st; }

const isLeaf = n => !n.children;
const totalCount = b => b.groups.reduce((s,g) => s + g.count, 0);

function effSizes(node){
  const out = node.children.map(k => k.size);
  const idx = out.indexOf(null);
  if (idx >= 0){
    const rest = out.reduce((s,v) => s + (v || 0), 0);
    out[idx] = Math.max(0, 100 - rest);
  }
  return out;
}

function collectBlocks(node, out){
  if (isLeaf(node)) { out.push(node); return out; }
  node.children.forEach(k => collectBlocks(k, out));
  return out;
}

/** Percent-based snapshot, 落版 state included. */
function exportLayout(){
  return JSON.parse(JSON.stringify(layout));
}
window.exportLayout = exportLayout;

/* ==========================================================================
   RENDER (總體)
   ========================================================================== */

function flexFor(size, dividerShare){
  return size == null ? '1 1 0%' : `0 0 calc(${size}% - ${dividerShare}px)`;
}

function renderContainer(node){
  const el = document.createElement('div');
  el.className = 'split-container';
  el.style.flexDirection = node.dir === 'row' ? 'row' : 'column';

  const kids = node.children;
  const divPx = node.fold ? FOLD_PX : RESIZE_PX;
  const dividerShare = (divPx * (kids.length - 1)) / kids.length;

  const childEls = [];
  kids.forEach((kid, i) => {
    if (i > 0){
      if (node.fold){
        const f = document.createElement('div');   // the crease — never draggable
        f.className = 'fold';
        el.appendChild(f);
      } else {
        const r = document.createElement('div');
        r.className = 'resizer ' + (node.dir === 'row' ? 'resizer-vertical' : 'resizer-horizontal');
        r._parent = node;
        r._index  = i - 1;
        r._childEls = childEls;
        el.appendChild(r);
      }
    }
    const kidEl = isLeaf(kid) ? renderLeaf(kid) : renderContainer(kid);
    kidEl.style.flex = flexFor(kid.size, dividerShare);
    kidEl.style.minWidth = '0px';
    kidEl.style.minHeight = '0px';
    kidEl._dividerShare = dividerShare;
    childEls.push(kidEl);
    el.appendChild(kidEl);
  });

  el._childEls = childEls;
  return el;
}

/** Slide A stacks each group on its own line: 冰箱(24) / 洗衣機(18). */
function groupLinesHTML(node){
  return node.groups.map(g => `<div>${g.name}${
    g.count ? `<span class="cnt">(${g.count})</span>` : ''}</div>`).join('');
}

/* 拖刊頭的時候，列數暫時鎖成拖之前的樣子。
   nRows 是從 cellAspect 推出來的，而 cellAspect 含著「刊頭吃掉多少」—— 不鎖的話
   刊頭拉到一半格子會自己重排（四列忽然變三列）。列高和列數同時在動，眼睛追不上，
   看起來就是壞掉；版面重排不做滑動動畫防的是同一件事。
   只鎖到放手為止，不寫進 sh.rows —— 那個欄位的意思是「這個人拖過列，這就是他要的
   排法」，只是把刊頭拉長一點不該算數，也不該讓這個版位從此不再跟著版面重排。
   放手之後該怎麼排就怎麼排，要跳也只跳這一次。 */
let mhRowLock = null;

/* renderGrid 算出來的那一份，留著給拉刊頭時的讀數用 —— 它要的是「現在每列多高」，
   那是 sheetMetrics 的產物，重算一次只為了印一行字太浪費。 */
let lastMetrics = null;

/* 一個版位現在是什麼狀態。底色本來就照這三種分（灰／白／綠），這裡只是把同一件事
   用字寫出來 —— 顏色要人記得對照表，字不用，而且列印或轉手給別人看時也留得住。 */
function blockState(sh){
  /* 棒子是一格一格傳的，所以一個版位可以「一半在 PM」—— 那正是做到一半的樣子，
     不寫出來的話它跟「整塊都還在設計手上」長得一模一樣。 */
  const cells = (sh && sh.cells) || [];
  const n = cellsAt(sh, 'pm').length;
  /* 每一格都還停在第一關＝這塊還沒開工。它技術上「都在 PM」（提明細是 PM 的事），
     但綠色講的是「交出去了、這邊沒事了」—— 一個剛開的檔期整片綠，看起來像做完了。
     所以給灰，寫「待提明細」。
     （灰以前還兼著「未指派」那個意思。一格一位 PM 拿掉之後，灰只剩這一件事 ——
       一個顏色本來就不該講兩件事。） */
  if (!cells.length || !cells.some(c => cellStage(c) > 0))
                               return { k:'s-none', t:'待提明細' };
  if (n && n === cells.length) return { k:'s-done', t:'都在 PM' };
  if (n)                       return { k:'s-half', t:`在 PM ${n}/${cells.length} 格` };
  return                         { k:'s-wip',  t:'在設計' };
}

function renderLeaf(node){
  const el = document.createElement('div');
  /* 底色跟小地圖同一套：灰＝還沒提明細、白＝還在設計手上、綠＝整塊都在 PM */
  const sh = node.sheet || {};
  /* 綠底＝「這塊沒你的事了」，所以要整塊都交出去才給綠。交了一半還在設計手上，
     底色留白、由角落那顆黃色的「交出 8/14 格」把進度講清楚 —— 顏色只有三級，
     講不出「一半」，硬塞給它就會有人以為都好了。 */
  el.className = 'window-node'
    + (blockState(sh).k === 's-done' ? ' handed' : '')
    + (blockState(sh).k === 's-none' ? ' unowned' : '');
  el.dataset.blockId = node.id;
  el.setAttribute('data-items', JSON.stringify(
    node.groups.map(g => ({ cat: g.name, qty: g.count }))));

  const st = blockState(sh);
  const badge = document.createElement('div');
  badge.className = 'blk-state ' + st.k;
  badge.textContent = st.t;
  el.appendChild(badge);

  const label = document.createElement('div');
  label.className = 'region-label';
  label.style.fontSize = '14px';
  label.innerHTML = groupLinesHTML(node)
    + (node.noMasthead ? '<div style="font-size:11px;color:#8a7f74">(無刊頭)</div>' : '');
  el.appendChild(label);
  return el;
}

let boards = {};

/* 只清掉那兩張版，不清整個 #view-total —— 小工具列也住在裡面（它是這一頁的家具，
   不是內容）。以前這裡是 innerHTML = ''，重建一次工具列就沒了。 */
function clearBoards(){
  editorHost.querySelectorAll(':scope > .board').forEach(el => el.remove());
}

function buildBoard(side, title){
  const wrap = document.createElement('div');
  wrap.className = 'board';
  const heading = document.createElement('h3');
  heading.textContent = title;
  wrap.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'board-grid';

  const corner = document.createElement('div');
  corner.className = 'ruler-corner';
  corner.textContent = 'cm';         // unit lives here, clear of the ticks

  const rTop = document.createElement('div');
  rTop.className = 'ruler-top';
  const markerX = document.createElement('div');
  markerX.className = 'ruler-marker ruler-marker-x';
  markerX.setAttribute('data-val', '0');
  rTop.appendChild(markerX);

  const rLeft = document.createElement('div');
  rLeft.className = 'ruler-left';
  const markerY = document.createElement('div');
  markerY.className = 'ruler-marker ruler-marker-y';
  markerY.setAttribute('data-val', '0');
  rLeft.appendChild(markerY);

  const ws = document.createElement('div');
  ws.className = 'board-ws';
  ws.appendChild(renderContainer(layout[side]));

  const guideV = document.createElement('div'); guideV.className = 'guide v';
  const guideH = document.createElement('div'); guideH.className = 'guide h';
  ws.appendChild(guideV); ws.appendChild(guideH);

  grid.appendChild(corner);
  grid.appendChild(rTop);
  grid.appendChild(rLeft);
  grid.appendChild(ws);
  wrap.appendChild(grid);

  const entry = { ws, rTop, rLeft, markerX, markerY, guideV, guideH,
                  ticks: { len: [], side: [] }, bw: 0, bh: 0 };
  boards[side] = entry;

  /* Marker follows the cursor across the board (1排版切割.html workspace
     mousemove). The board only moves when the pointer is outside it, so its
     rect is taken once on entry instead of on every move — a rect read there
     forces a layout flush per mouse event. The writes are batched into one
     rAF for the same reason. */
  let wsRect = null, markFrame = 0, markAt = null;
  ws.addEventListener('mouseenter', () => { wsRect = ws.getBoundingClientRect(); });
  ws.addEventListener('mousemove', e => {
    if (!wsRect) wsRect = ws.getBoundingClientRect();
    markAt = { x: e.clientX, y: e.clientY };
    if (markFrame) return;
    markFrame = requestAnimationFrame(() => {
      markFrame = 0;
      if (!wsRect || !markAt) return;
      const { x, y } = markAt;
      moveMarkers(entry, x - wsRect.left, y - wsRect.top, x, y);
    });
  });
  ws.addEventListener('mouseleave', () => {
    wsRect = null;
    if (markFrame){ cancelAnimationFrame(markFrame); markFrame = 0; }
    if (!drag) hideMarkers(entry);
  });

  return wrap;
}

/* ==========================================================================
   RULER (總體)
   Structure and tick tiers follow 1排版切割.html: a fixed-size strip along the
   top and left with a corner box, three tick heights (major / medium / minor),
   labels on majors only, and a live marker line + value badge that tracks the
   cursor.
   單位是公分：**一格一公分**，寫數字的那幾條長一點（那就是 major）。磁吸對齊
   吸的也是整公分 —— 尺規上看得到的線和吸得到的線是同一條，才不會吸到看不見的東西。
   ========================================================================== */

const TICK_MAJOR = 12, TICK_MED = 8, TICK_MINOR = 4;   // px, per the demo

/** 每幾公分寫一個數字。數字之間至少留 needPx，不然一整排會擠成一團。 */
function labelStep(span, units, needPx){
  for (const k of [1, 2, 5, 10, 20, 50]) if ((span / units) * k >= needPx) return k;
  return Math.ceil(units);
}

function drawRulers(entry){
  const { rTop, rLeft, bw, bh } = entry;
  rTop.querySelectorAll('.tick,.tick-label,.ruler-cap').forEach(el => el.remove());
  rLeft.querySelectorAll('.tick,.tick-label,.ruler-cap').forEach(el => el.remove());
  entry.ticks = { len: [], side: [] };

  /* Both rulers run to a couple of hundred nodes. Building them into fragments
     and attaching each in one go costs one reflow per ruler rather than one
     per tick — this runs on every resize frame. */
  const fTop = document.createDocumentFragment();
  const fLeft = document.createDocumentFragment();

  /* ---- top ruler: length ----
     一格一公分。ticks.len[j] 就是「第 j 公分那一條」—— 磁吸的回饋直接照公分數
     取（showSnapFeedback），所以每一公分都要進去，不能只留有數字的那幾條。 */
  const lenCm = unitsLen();
  const stepL = labelStep(bw, lenCm, 26);       // 兩位數的標籤 ＋ 一點空隙
  for (let j = 0; j <= lenCm; j++){
    const x = (j / lenCm) * bw;
    const lab = j % stepL === 0;                          // 有數字的那幾條
    const med = !lab && stepL % 2 === 0 && j % (stepL / 2) === 0;

    const t = document.createElement('div');
    t.className = 'tick';
    t.style.cssText =
      `left:${x}px;bottom:0;width:1px;height:${lab ? TICK_MAJOR : med ? TICK_MED : TICK_MINOR}px`;
    fTop.appendChild(t);

    let num = null;
    if (lab && j > 0){                          // 0 would collide with the corner
      num = document.createElement('div');
      num.className = 'tick-label';
      // centre on the tick, but pull the last one fully inside the strip
      // so it is not clipped by the ruler's overflow:hidden
      const shift = j + stepL > lenCm ? '-100%' : '-50%';
      num.style.cssText = `left:${x}px;top:2px;transform:translateX(${shift})`;
      num.textContent = j;
      fTop.appendChild(num);
    }
    entry.ticks.len.push({ tick: t, num });
  }

  /* ---- left ruler: height ---- */
  const sideCm = unitsSide();
  const stepS = labelStep(bh, sideCm, 24);
  for (let j = 0; j <= sideCm; j++){
    const y = (j / sideCm) * bh;
    const lab = j % stepS === 0;
    const med = !lab && stepS % 2 === 0 && j % (stepS / 2) === 0;

    const t = document.createElement('div');
    t.className = 'tick';
    t.style.cssText =
      `top:${y}px;right:0;height:1px;width:${lab ? TICK_MAJOR : med ? TICK_MED : TICK_MINOR}px`;
    fLeft.appendChild(t);

    let num = null;
    if (lab && j > 0){
      num = document.createElement('div');
      num.className = 'tick-label';
      // The demo rotates these because its labels are 3-digit pixel values;
      // ours are two digits, so upright reads better and cannot overflow. Pull
      // the last one fully inside so the strip does not clip it.
      const shift = j + stepS > sideCm ? '-100%' : '-50%';
      num.style.cssText = `top:${y}px;right:14px;transform:translateY(${shift})`;
      num.textContent = j;
      fLeft.appendChild(num);
    }
    entry.ticks.side.push({ tick: t, num });
  }

  rTop.appendChild(fTop);
  rLeft.appendChild(fLeft);
}

/** Move both marker lines and the cursor readout; x/y are board-relative px.
    cx/cy are the raw client coords, used only to place the readout. */
function moveMarkers(entry, x, y, cx, cy){
  x = Math.max(0, Math.min(x, entry.bw));
  y = Math.max(0, Math.min(y, entry.bh));
  const ux = (x / entry.bw) * unitsLen();
  const uy = (y / entry.bh) * unitsSide();

  entry.markerX.style.left = x + 'px';
  entry.markerX.setAttribute('data-val', ux.toFixed(1));
  entry.markerY.style.top = y + 'px';
  entry.markerY.setAttribute('data-val', uy.toFixed(1));
  entry.markerX.classList.add('on');
  entry.markerY.classList.add('on');

  // the pointer readout gives the full coordinate pair, not a division index
  if (cx != null){
    tip.textContent = `X ${ux.toFixed(1)}　Y ${uy.toFixed(1)}　cm`;
    tip.style.display = 'block';
    tip.style.left = (cx + 16) + 'px';
    tip.style.top  = (cy + 18) + 'px';
  }
}
/** While dragging a segment line, report the LINE's own position — and only
    on the axis it actually moves along. A vertical line has an X and no
    meaningful Y, and vice versa. `unit` is the boundary's ruler position,
    already snapped when snapping applied. */
function moveDragMarker(entry, horizontal, unit, snapped, cx, cy, aligned){
  const txt = aligned ? unit.toFixed(1) : (snapped ? String(unit) : unit.toFixed(1));
  entry.markerX.classList.toggle('aligned', !!aligned);
  entry.markerY.classList.toggle('aligned', !!aligned);
  tip.classList.toggle('aligned', !!aligned);
  if (horizontal){                                  // vertical line -> X only
    entry.markerX.style.left = (unit / unitsLen()) * entry.bw + 'px';
    entry.markerX.setAttribute('data-val', txt);
    entry.markerX.classList.add('on');
    entry.markerY.classList.remove('on');
    tip.textContent = `X ${txt} cm`;
  } else {                                          // horizontal line -> Y only
    entry.markerY.style.top = (unit / unitsSide()) * entry.bh + 'px';
    entry.markerY.setAttribute('data-val', txt);
    entry.markerY.classList.add('on');
    entry.markerX.classList.remove('on');
    tip.textContent = `Y ${txt} cm`;
  }
  tip.style.display = 'block';
  tip.style.left = (cx + 16) + 'px';
  tip.style.top  = (cy + 18) + 'px';
}

function hideMarkers(entry){
  entry.markerX.classList.remove('on');
  entry.markerY.classList.remove('on');
  tip.style.display = 'none';
  tip.classList.remove('snapped');
}

function fitBoards(){
  const host = document.getElementById('view-total');
  if (!host.classList.contains('active')) return;
  const RW = 30;                                   // must match --ruler-w
  const availW = (host.clientWidth - 34 - 8) / 2 - RW;
  const availH = host.clientHeight - 42 - RW;
  const ref = boardPx();
  const k = Math.max(0.25, Math.min(1, availW / ref.w, availH / ref.h));
  const bw = Math.round(ref.w * k);
  const bh = Math.round(ref.h * k);
  Object.values(boards).forEach(b => {
    b.bw = bw; b.bh = bh;
    b.ws.style.width  = bw + 'px';
    b.ws.style.height = bh + 'px';
    drawRulers(b);                                 // ticks re-fit the new size
  });
}

/* ==========================================================================
   DRAG (總體)
   Rects measured once on pointerdown; pointermove only records the pending
   value and a single rAF does every DOM write.
   ========================================================================== */

const tip = document.getElementById('tip');
let drag = null;
let frame = 0;

/* Flexbox lays each child out as `size% * parentPx - dividerShare`, so the
   leading edge of boundary i sits at
       cum% * parentPx - (i+1)*dividerShare + i*divPx
   Using (parentPx - totalDividers) instead is off by up to a pixel — enough
   to stop a snap landing exactly on its gridline. Exact inverses.

   `ctx` is whatever measureDivider() returned — the live drag during a drag,
   a throwaway measurement when the inline 公分欄 needs the same maths. */
function offsetForCum(ctx, cum){
  return (cum / 100) * ctx.parentPx - (ctx.i + 1) * ctx.dividerShare + ctx.i * ctx.divPx;
}
function cumForOffset(ctx, offsetPx){
  return ((offsetPx + (ctx.i + 1) * ctx.dividerShare - ctx.i * ctx.divPx) / ctx.parentPx) * 100;
}

/** Everything about one divider's geometry, measured once. */
function measureDivider(r){
  const node = r._parent, i = r._index, childEls = r._childEls;
  const horizontal = node.dir === 'row';

  const containerEl = r.parentElement;
  const parentRect = containerEl.getBoundingClientRect();
  const side = containerEl.closest('.board-ws');
  const boardRect = side.getBoundingClientRect();

  // The board is sized in real px (no transform), so rect px ARE css px.
  const divPx = RESIZE_PX;
  const parentPx = horizontal ? parentRect.width : parentRect.height;
  const boardPx  = horizontal ? boardRect.width  : boardRect.height;
  const parentInBoard = horizontal
    ? parentRect.left - boardRect.left
    : parentRect.top  - boardRect.top;

  const sizes = effSizes(node);
  const before = sizes.slice(0, i).reduce((s,v) => s + v, 0);
  const pairSum = sizes[i] + sizes[i+1];

  return {
    node, i, childEls, horizontal, side, resizerEl: r,
    parentRect, boardRect, parentPx, boardPx, parentInBoard, divPx, before, pairSum,
    dividerShare: childEls[i]._dividerShare,
    boardsEntry: Object.values(boards).find(b => b.ws === side),
    sizes
  };
}

/** Alignment targets on this axis: other dividers, plus the user's 參考線. */
function collectAlignTargets(ctx){
  const { horizontal, side, boardRect, childEls, i, resizerEl } = ctx;
  /* Canva-style alignment targets: every OTHER divider on this axis, measured
     once here. Dividers inside the two siblings being resized are skipped —
     they shift as the drag proceeds, so their cached position would be a lie.
     Everything else on the board is stationary for the whole gesture, which
     keeps the move handler free of layout reads. */
  const axisSel = horizontal ? '.resizer-vertical, .fold' : '.resizer-horizontal';
  const moving = [childEls[i], childEls[i+1]];
  const guides = [];
  side.querySelectorAll(axisSel).forEach(el => {
    if (el === resizerEl || moving.some(m => m.contains(el))) return;
    const rc = el.getBoundingClientRect();
    guides.push(horizontal
      ? rc.left + rc.width / 2 - boardRect.left
      : rc.top + rc.height / 2 - boardRect.top);
  });

  // 參考線 pulled out of the ruler are targets too, exactly like PS
  const key = sideKeyOf(side);
  const list = (currentPlan && currentPlan.guides && currentPlan.guides[key]) || [];
  const axis = horizontal ? 'len' : 'side';
  const divisions = horizontal ? unitsLen() : unitsSide();
  const span = horizontal ? boardRect.width : boardRect.height;
  list.forEach(g => { if (g.axis === axis) guides.push((g.unit / divisions) * span); });

  return guides;
}

document.addEventListener('pointerdown', e => {
  const r = e.target.closest ? e.target.closest('.resizer') : null;
  if (!r || !r._parent) return;
  e.preventDefault();
  closeDividerField();

  const ctx = measureDivider(r);
  const resRect = r.getBoundingClientRect();

  drag = Object.assign(ctx, {
    guides: collectAlignTargets(ctx),
    grab: ctx.horizontal ? e.clientX - resRect.left : e.clientY - resRect.top,
    origI: ctx.sizes[ctx.i],          // what Esc puts back
    startClient: ctx.horizontal ? e.clientX : e.clientY,
    moved: false,
    pending: null
  });

  r.setPointerCapture(e.pointerId);
  r.classList.add('dragging');
  document.body.classList.add('dragging', ctx.horizontal ? 'dragging-col' : 'dragging-row');
}, true);

document.addEventListener('pointermove', e => {
  if (!drag) return;
  const ptr = drag.horizontal
    ? e.clientX - drag.parentRect.left
