    'on', activeTab === 'total' && totalTool === 'cut');
}
document.querySelectorAll('#totalRail .tool[data-ttool]').forEach(b =>
  b.addEventListener('click', () => setTotalTool(b.dataset.ttool)));
document.querySelectorAll('#cutDirs .tool').forEach(b =>
  b.addEventListener('click', () => setCutDir(b.dataset.cutdir)));

/** 總體 上的一塊 → 樹上的那個 node。 */
const totalNodeOf = el => el && allBlocks().find(b => b.id === el.dataset.blockId);

function selectTotalBlock(node){
  totalSel = node || null;
  totalHost.querySelectorAll('.window-node').forEach(el =>
    el.classList.toggle('sel', !!node && el.dataset.blockId === node.id));
}

/** 誰是它的爸爸。切分要把那一片換成一個容器，所以得先找到掛它的地方。 */
function parentOfNode(root, target){
  if (isLeaf(root)) return null;
  for (const k of root.children){
    if (k === target) return root;
    const p = parentOfNode(k, target);
    if (p) return p;
  }
  return null;
}

/* 切一刀：內容留在第一半，第二半是一塊空的（跟行銷那支 cutNode 同一個約定 ——
   切下去是「這裡還要再放一塊」，不是把現有的東西分一半）。 */
function cutBlock(node, pct, vertical){
  const par = parentOfNode(layout.front, node) || parentOfNode(layout.back, node);
  const half = blk('未命名', [{ name:'未命名', count:0 }], null);
  const box = { dir: vertical ? 'row' : 'col', size: node.size, children: [node, half] };
  // 太靠邊的一刀切出一條看不見的細長條，那不是有人想要的東西
  node.size = Math.max(8, Math.min(92, pct));
  if (par){
    par.children[par.children.indexOf(node)] = box;
  } else {
    // 整張版就這麼一塊：換掉根本人
    const side = layout.front === node ? 'front' : 'back';
    box.size = null;
    layout[side] = box;
  }
  commitAction();
  rebuildAll(activeBlock && activeBlock.id);
}

/* ==========================================================================
   品類／支數（總體 的「✏ 品類」工具）
   --------------------------------------------------------------------------
   這一塊要放哪些品類、各幾支，本來只有行銷那一支（開檔的「點選」）填得了 ——
   於是設計切出一塊新的版位之後，得回去那一支才補得上內容。這裡把同一件事接上。
   支數是格子的來源（buildCells 照 groups 的 count 生格），所以改支數＝加減格子：
   加的接在那個品類最後一格後面，減的從最後一格拿掉 —— **已經拼好的那幾格不動**。
   ========================================================================== */

/** 這個品類的格子在 cells 裡的最後一個位置（沒有就回 -1）。 */
function lastCellOfGroup(cells, gi){
  for (let i = cells.length - 1; i >= 0; i--) if (cells[i].gi === gi) return i;
  return -1;
}

/** 把某一個品類的支數改成 want。加減的是格子，不是重生一份 —— 重生會把拼好的洗掉。 */
function setGroupCount(block, gi, want){
  const sh = sheetOf(block);
  const g = block.groups[gi];
  if (!g) return;
  want = Math.max(0, Math.round(want));
  let cur = g.count || 0;

  while (cur < want){
    const at = lastCellOfGroup(sh.cells, gi);
    /* 接在同一個品類最後一格後面；這個品類還一格都沒有的話，就照品類的順序
       插在它該在的位置 —— 不然新的格會跑到別的品類中間。 */
    const pos = at >= 0 ? at + 1
      : block.groups.slice(0, gi).reduce((a, x) => a + (x.count || 0), 0);
    const src = at >= 0 ? sh.cells[at] : null;
    // 關（cell.st）不抄，新的一格從第一關開始
    const cell = { id: newCellId(block), gi, text: '' };
    sh.cells.splice(Math.min(pos, sh.cells.length), 0, cell);
    cur++;
  }
  while (cur > want){
    const at = lastCellOfGroup(sh.cells, gi);
    if (at < 0) break;
    sh.cells.splice(at, 1);
    cur--;
  }
  g.count = want;

  /* 減到 0 就整條拿掉，後面的 gi 往前挪 —— 留一個「刮鬍刀(0)」在總體上，
     只會讓人以為那裡還有東西要排。（跟一列旁邊那顆 − 同一條規矩。） */
  if (!g.count){
    block.groups.splice(gi, 1);
    sh.cells.forEach(c => { if (c.gi > gi) c.gi--; });
    /* 最後一個品類也拿掉了：留一塊「未命名 0 支」的位子，跟剛切出來的那種一樣。
       整塊變成一片空白的話，看不出它是「還沒填」還是「畫壞了」。 */
    if (!block.groups.length) block.groups.push({ name: '未命名', count: 0 });
  }
  /* 釘住的列數不算數了：格數變了還照舊分，加的那幾格會擠在最後一列。
     交回 splitEven 重新分，那才是這個形狀該有的排法。 */
  sh.rows = null;
  mhRowLock = null;
}

const itemPop = document.getElementById('itemPop');
let itemNode = null;                 // 正在編的那一塊（樹上的 node）

/** 這個檔期出現過的品類，給輸入框當提示 —— 是「讓你想起來有哪些」，不是自動完成。 */
function syncCatList(){
  const seen = [];
  allBlocks().forEach(b => (b.groups || []).forEach(g => {
    if (g.name && g.name !== '未命名' && !seen.includes(g.name)) seen.push(g.name);
  }));
  const dl = document.getElementById('catList');
  dl.innerHTML = '';
  seen.forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
}

function closeItemPop(){
  itemPop.classList.remove('on');
  itemNode = null;
}

/** 改完就重畫整棵樹，然後把小卡貼回同一塊上 —— 那一塊的 DOM 已經是新的了。 */
function applyItems(){
  const id = itemNode && itemNode.id;
  /* 版位的名字＝它裝了哪些品類（落版 的標題、品類樹讀的都是它）。改了品類卻不改
     名字的話，總體 上寫著「刮鬍泡(8)」，切過去 落版 卻還叫「未命名」。 */
  if (itemNode) itemNode.name = itemNode.groups.map(g => g.name).join('・') || '未命名';
  commitAction();
  rebuildAll(activeBlock && activeBlock.id);
  const node = allBlocks().find(b => b.id === id);
  const el = node && totalHost.querySelector(`.window-node[data-block-id="${id}"]`);
  if (node && el) openItemPop(node, el); else closeItemPop();
}

function openItemPop(node, el){
  itemNode = node;
  syncCatList();
  const total = (node.groups || []).reduce((a, g) => a + (g.count || 0), 0);
  itemPop.querySelector('.ip-title').textContent =
    `${node.groups.map(g => g.name).join('・') || '未命名'}　共 ${total} 支`;

  const list = itemPop.querySelector('.ip-list');
  list.innerHTML = '';
  (node.groups || []).forEach((g, gi) => {
    const row = document.createElement('div');
    row.className = 'ip-row';

    const nm = document.createElement('input');
    nm.className = 'ip-name';
    nm.value = g.name;
    nm.setAttribute('list', 'catList');
    // 改完（Enter 或移開）才算數：每敲一個字就重建整棵樹，游標會被洗掉
    const rename = () => {
      const v = nm.value.trim();
      if (!v || v === g.name) return;
      g.name = v;
      applyItems();
    };
    nm.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter'){ e.preventDefault(); nm.blur(); }
      if (e.key === 'Escape'){ nm.value = g.name; nm.blur(); }
    });
    nm.addEventListener('blur', rename);

    const qty = document.createElement('input');
    qty.className = 'ip-qty';
    qty.type = 'number'; qty.min = '0'; qty.step = '1';
    qty.value = g.count;
    const requant = () => {
      const v = parseInt(qty.value, 10);
      if (!isFinite(v) || v === g.count){ qty.value = g.count; return; }
      setGroupCount(node, gi, v);
      applyItems();
    };
    qty.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter'){ e.preventDefault(); qty.blur(); }
      if (e.key === 'Escape'){ qty.value = g.count; qty.blur(); }
    });
    qty.addEventListener('blur', requant);

    const del = document.createElement('button');
    del.className = 'ip-del';
    del.textContent = '✕';
    del.title = `拿掉「${g.name}」，它的 ${g.count} 格也一起拿掉`;
    del.addEventListener('click', () => { setGroupCount(node, gi, 0); applyItems(); });

    row.appendChild(nm); row.appendChild(qty); row.appendChild(del);
    list.appendChild(row);
  });
  if (!node.groups.length){
    const d = document.createElement('div');
    d.className = 'ip-note';
    d.textContent = '這一塊還沒有品類。';
    list.appendChild(d);
  }

  /* 站在那一塊**旁邊**，不要壓在它身上 —— 正在填的是這一塊的內容，看不到它就
     不知道自己在填哪裡。右邊放不下就換左邊，兩邊都放不下才蓋上去。 */
  const r = el.getBoundingClientRect();
  itemPop.classList.add('on');
  const w = itemPop.offsetWidth, h = itemPop.offsetHeight;
  const left = r.right + 10 + w <= window.innerWidth ? r.right + 10
             : r.left - 10 - w >= 8                  ? r.left - 10 - w
             : Math.max(8, Math.min(window.innerWidth - w - 8, r.left + 10));
  itemPop.style.left = left + 'px';
  itemPop.style.top  = Math.max(8, Math.min(window.innerHeight - h - 8, r.top)) + 'px';
}

/* 加一個品類：名字空著就不算數（空的品類在總體上是一塊寫著「未命名」的地方，
   而那正是切出來還沒填的樣子 —— 不該用「加」再生一個）。 */
itemPop.querySelector('.ip-plus').addEventListener('click', () => {
  if (!itemNode) return;
  const nameEl = itemPop.querySelector('.ip-add .ip-name');
  const qtyEl  = itemPop.querySelector('.ip-add .ip-qty');
  const name = nameEl.value.trim();
  const qty  = Math.max(1, parseInt(qtyEl.value, 10) || 1);
  if (!name) { nameEl.focus(); return; }
  /* 切出來那塊空的「未命名 0 支」是個位子，不是一個品類：填第一個品類時
     就地改掉它，不要在它旁邊再長一個。 */
  const blank = itemNode.groups.findIndex(g => !g.count && (!g.name || g.name === '未命名'));
  if (blank >= 0) itemNode.groups[blank].name = name;
  else itemNode.groups.push({ name, count: 0 });
  setGroupCount(itemNode, blank >= 0 ? blank : itemNode.groups.length - 1, qty);
  nameEl.value = ''; qtyEl.value = '';
  applyItems();
});
itemPop.querySelector('.ip-x').addEventListener('click', closeItemPop);
itemPop.addEventListener('keydown', e => {
  e.stopPropagation();                       // 別讓 Delete／快捷鍵傳到版面上
  if (e.key === 'Escape') closeItemPop();
});
/* 點到小卡和版位以外的地方就收起來 —— 它貼在版面上，擋著別人看版 */
document.addEventListener('pointerdown', e => {
  if (!itemPop.classList.contains('on')) return;
  if (e.target.closest('#itemPop') || e.target.closest('.window-node')) return;
  closeItemPop();
}, true);

/* 兩塊對調：換的是**內容**（品類、格子、刊頭），不是位置和大小 —— 版位的大小和
   比例是落版談好的，工具不准動它（跟行銷那支 swap 同一個約定）。 */
function swapBlocks(a, b){
  if (!a || !b || a === b) return;
  ['name', 'groups', 'sheet', 'noMasthead'].forEach(k => {
    const t = a[k]; a[k] = b[k]; b[k] = t;
  });
  commitAction();
  rebuildAll(activeBlock && activeBlock.id);
}

/* ==========================================================================
   切分的手感：照開檔那支（落版單系統 的 切割）搬過來
   指著哪一塊就把它框紅（cutAim）—— 因為手要移到「切下去」那顆鈕上，一離開版面
   就忘記的話，那顆鈕永遠不知道要切誰。線和紅框一起留著，看得到才敢按。
   沒填公分＝那一刀就切在游標上；填了＝線跳到那個公分數上，點下去也切在那裡
   （線就是承諾，不能畫一條線卻切在別的地方）。滾輪切換直／橫。
   ========================================================================== */
const cutBar = document.getElementById('cutBar');
const cutLenInput = document.getElementById('cutLen');
const cutPreview = document.getElementById('cutPreview');
let cutAim = null;                  // 紅框指著的那一塊（DOM）
let cutHoverXY = null;              // 游標最後停在哪

/* 空的、0、負的、看不懂的都當成「沒填」＝照點的位置切。 */
function cutLenCm(){
  const v = parseFloat(cutLenInput.value);
  return (isFinite(v) && v > 0) ? v : null;
}
let cutBadTimer = 0;
function flashCutLen(spanCm){
  cutBar.classList.add('bad');
  cutLenInput.title = `這一塊只有 ${spanCm.toFixed(1)}cm，切不出 ${cutLenCm()}cm`;
  clearTimeout(cutBadTimer);
  cutBadTimer = setTimeout(() => cutBar.classList.remove('bad'), 700);
}
function syncCutGo(){
  const go = document.getElementById('cutGo');
  go.disabled = !(totalTool === 'cut' && cutLenCm() != null && cutAim && cutAim.isConnected);
  go.title = cutLenCm() == null ? '先填要切在幾公分'
           : (cutAim ? '切紅框那一塊' : '先把滑鼠移到要切的那一塊上（它會框成紅色）');
}

function aimAt(el){
  if (cutAim && cutAim !== el) cutAim.classList.remove('cut-aim');
  cutAim = el || null;
  if (cutAim) cutAim.classList.add('cut-aim');
  paintCutPreview();
  syncCutGo();
}

/** 這一刀落在那一塊的第幾個 px（從左緣／上緣量起），以及那一塊有多長。 */
function cutOffset(){
  const r = cutAim.getBoundingClientRect();
  const vertical = cutDir === 'v';
  const span = vertical ? r.width : r.height;
  const k = pxPerCm(cutAim, vertical);        // 橫的一公分和直的一公分不一樣長
  const want = cutLenCm();
  const raw = want != null ? want * k
            : (cutHoverXY ? (vertical ? cutHoverXY.x - r.left : cutHoverXY.y - r.top)
                          : span / 2);
  return { r, vertical, span, k, raw, off: Math.max(0, Math.min(span, raw)), over: raw >= span };
}

function paintCutPreview(){
  if (totalTool !== 'cut' || activeTab !== 'total' || !cutAim || !cutAim.isConnected){
    cutPreview.style.display = 'none';
    return;
  }
  const { r, vertical, k, off, over } = cutOffset();
  cutPreview.className = vertical ? 'v' : 'h';
  cutPreview.classList.toggle('over', over);
  if (vertical){
    cutPreview.style.left = (r.left + off - 1) + 'px';
    cutPreview.style.top = r.top + 'px';
    cutPreview.style.width = '2px';
    cutPreview.style.height = r.height + 'px';
  } else {
    cutPreview.style.left = r.left + 'px';
    cutPreview.style.top = (r.top + off - 1) + 'px';
    cutPreview.style.width = r.width + 'px';
    cutPreview.style.height = '2px';
  }
  cutPreview.querySelector('.lbl').textContent =
    (off / k).toFixed(1) + 'cm' + (over ? '（切不下去）' : '');
  cutPreview.style.display = 'block';
}

/** 兩條路（點下去、按「切下去」）最後都走這一支：切的永遠是紅框那一塊、紅線那個位置。 */
function doCut(){
  if (!cutAim || !cutAim.isConnected) return;
  const node = totalNodeOf(cutAim);
  if (!node) return;
  const { span, k, off, over } = cutOffset();
  if (over){ flashCutLen(span / k); return; }        // 切不下去就別切
  const vertical = cutDir === 'v';
  aimAt(null);                                       // 紅框和紅線要在重建之前收掉
  cutBlock(node, off / span * 100, vertical);
}
document.getElementById('cutGo').addEventListener('click', doCut);
cutLenInput.addEventListener('input', () => { syncCutGo(); paintCutPreview(); });
/* 填完數字手還在鍵盤上：Enter 就是按那顆鈕 */
cutLenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); doCut(); }
});

/* ---- 滑鼠：切分的紅框紅線、移動的拖曳，都用委派掛在 總體 那一層 ---- */
let swapFrom = null;
function endSwapDrag(){
  swapFrom = null;
  totalHost.querySelectorAll('.swap-from,.swap-to').forEach(el =>
    el.classList.remove('swap-from', 'swap-to'));
}

totalHost.addEventListener('mousemove', e => {
  if (totalTool !== 'cut') return;
  cutHoverXY = { x: e.clientX, y: e.clientY };
  const el = e.target.closest && e.target.closest('.window-node');
  if (el) aimAt(el);
  else paintCutPreview();          // 移到版位外面：紅框留著（手要去按那顆鈕）
});
/* 紅線是 position:fixed 的，這一頁一捲它就對不到那一塊了 */
totalHost.addEventListener('scroll', paintCutPreview);
/* 滾輪切直／橫，跟開檔那支一樣。兩顆方向鈕跟著亮 —— 同一件事只能有一個答案。 */
totalHost.addEventListener('wheel', e => {
  if (totalTool !== 'cut') return;
  e.preventDefault();
  setCutDir(e.deltaY > 0 ? 'h' : 'v');
}, { passive: false });

totalHost.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.window-node');
  if (!el) return;
  const node = totalNodeOf(el);
  if (!node) return;
  if (totalTool === 'pick'){ selectTotalBlock(node === totalSel ? null : node); return; }
  if (totalTool === 'items'){
    if (itemNode === node) closeItemPop(); else openItemPop(node, el);
    return;
  }
  if (totalTool === 'cut'){
    cutHoverXY = { x: e.clientX, y: e.clientY };
    aimAt(el);
    doCut();
  }
});

totalHost.addEventListener('pointerdown', e => {
  if (totalTool !== 'swap') return;
  const el = e.target.closest && e.target.closest('.window-node');
  if (!el) return;
  e.preventDefault();
  swapFrom = el;
  el.classList.add('swap-from');
});
totalHost.addEventListener('pointermove', e => {
  if (!swapFrom) return;
  const el = e.target.closest && e.target.closest('.window-node');
  totalHost.querySelectorAll('.swap-to').forEach(n => n.classList.remove('swap-to'));
  if (el && el !== swapFrom) el.classList.add('swap-to');
});
/* 放在 document 上：手放開的地方常常已經不在那一塊上面了 */
document.addEventListener('pointerup', e => {
  if (!swapFrom) return;
  const el = e.target.closest && e.target.closest('.window-node');
  const from = totalNodeOf(swapFrom);
  const to   = el && el !== swapFrom ? totalNodeOf(el) : null;
  endSwapDrag();
  if (from && to) swapBlocks(from, to);
});

/* ==========================================================================
   檔期 LIST  (date maths, stage chips and countdown from design_team.html)
   ========================================================================== */

const MS = 86400000;
const atMid = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const parseYMD = str => { const [y,m,dd] = str.split('-').map(Number); return new Date(y, m-1, dd); };
const toYMD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWE = d => d.getDay() === 0 || d.getDay() === 6;
const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const nextWork = d => { let r = addDays(d,1); while (isWE(r)) r = addDays(r,1); return r; };
const prevWork = d => { let r = addDays(d,-1); while (isWE(r)) r = addDays(r,-1); return r; };
const addWork = (d,n) => { let r = new Date(d); for (let c = 0; c < n; c++) r = nextWork(r); return r; };
const dayOffset = (base,d) => Math.round((atMid(d) - atMid(base)) / MS);
const fmtMD = d => `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
/* 兩天之間隔幾個工作天。開檔表那條時間軸算「這一段做幾天」用的 —— 週末不算。 */
const workBetween = (a,b) => { let c = 0, r = new Date(a);
                               while (r < b){ r = addDays(r,1); if (!isWE(r)) c++; } return c; };
const WD = ['日','一','二','三','四','五','六'];

const STAGES = ['提品','製作','一校','一改','二校','二改','蓋章','蓋章修改','審稿','出稿'];
const DEADLINE_HOUR = 18;
const LS_KEY = 'catalogue_plans_v1';

/* 有接 Supabase 就回那個物件，沒接回 null。所有同步的呼叫都先過這一關，
   後端不在的時候整支程式一行都不會走到網路上。 */
const sync = () => (window.PlanSync && window.PlanSync.ok()) ? window.PlanSync : null;

/* 商品目錄（商品列表、機型、品牌）。全公司一份，不屬於任何檔期 —— 所以放在這裡，
   由主程式保管，開機拉一次，再發給每一塊畫布。畫布自己不連網（金鑰不進 iframe）。
   拉不到就是 null，畫布會繼續用它自己寫死的那份，跟以前一樣。 */
let CATALOGUE = null;

/** 發給所有畫布／面板 —— 目錄變了大家要一起變，不然這一格和那一格對不起來。 */
function pushCatalogue(){
  if (!CATALOGUE) return;
  document.querySelectorAll('iframe').forEach(f => {
    try { f.contentWindow.postMessage({ catalogue: CATALOGUE }, '*'); } catch (_){}
  });
}

const SEED_PLANS = [
  { id:'seed-2', name:'7月中檔・全省對開大DM', type:'全省對開大DM', tags:['大DM','促銷'],
    start: (() => { let d = atMid(new Date()); for (let i = 0; i < 4; i++) d = prevWork(d); return toYMD(d); })(),
    durs:[2,2,1,1,1,1,2,1,1,1] }
];
let plans;
try { plans = JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { plans = null; }
/* 沒有存檔時要不要給範例檔期，由網址決定：?seed=1 才給。
   預設是空的 —— 清掉 localStorage 就真的從零開始，不會又冒出示範資料。 */
if (!Array.isArray(plans)) plans = [];
if (!plans.length && new URLSearchParams(location.search).has('seed')) plans = SEED_PLANS;
/* Returns false if the write failed — 刊頭 images are stored as base64 inside
   the plan, so a few large ones really can hit the storage quota, and an
   auto-save that fails silently is the exact thing auto-save is meant to
   prevent. */
function savePlans(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(plans)); return true; }
  catch (e) { return false; }
}

function planStages(plan){
  const start = parseYMD(plan.start);
  const base = addDays(isWE(start) ? nextWork(start) : start, -1);
  let prev = base;
  return plan.durs.map((dur, i) => {
    const to = addWork(prev, dur);
    const from = dur === 0 ? to : nextWork(prev);
    prev = to;
    return { name: STAGES[i], from, to };
  });
}
const stageDeadline = st => { const d = new Date(st.to); d.setHours(DEADLINE_HOUR,0,0,0); return d; };
/* 系統推算的那一關：第一個 18:00 還沒過的。全部過完（檔期結束）回 -1。 */
function autoStageIndex(plan){
  const now = new Date();
  return planStages(plan).findIndex(st => stageDeadline(st) >= now);
}
/* 大家講好的「現在是哪一關」：有人手動指定就聽他的，沒有就用推算的。
   卡片和管理列讀的是同一支，所以它們永遠不會各說各話。 */
function currentStageOf(plan){
  const o = plan.stageOverride;
  if (o != null && o >= 0 && o < STAGES.length) return o;
  return autoStageIndex(plan);
}
function isFinished(plan){
  const st = planStages(plan);
  return stageDeadline(st[st.length - 1]) < new Date();
}
function stageRange(st){
  return dayOffset(st.from, st.to) === 0
    ? fmtMD(st.from)
    : (st.from.getMonth() === st.to.getMonth()
        ? `${fmtMD(st.from)}-${String(st.to.getDate()).padStart(2,'0')}`
        : `${fmtMD(st.from)}-${fmtMD(st.to)}`);
}
function fmtCountdown(ms){
  const h = ms / 3600000;
  if (h < 1) return `倒數 ${Math.max(1, Math.round(ms/60000))} 分`;
  if (h < 24) return `倒數 ${Math.round(h*2)/2} 小時`;
  return `倒數 ${Math.ceil(h/24)} 天`;
}
function tickPill(el){
  el.textContent = `● ${el.dataset.stage}截止 ${fmtCountdown(+el.dataset.deadline - Date.now())}`;
}
/** Banner line for the editor, e.g. 8/01(六)–8/06(四). */
function planRangeLabel(plan){
  const st = planStages(plan);
  const a = st[0].from, b = st[st.length-1].to;
  return `${fmtMD(a)}(${WD[a.getDay()]})–${fmtMD(b)}(${WD[b.getDay()]})　出稿 ${fmtMD(b)} 09:00`;
}

const planList = document.getElementById('planList');

function buildPlanCard(plan, now, past){
  const stages = planStages(plan);
  const out = stages[stages.length - 1].to;
  const curIdx = currentStageOf(plan);
  const live = curIdx >= 0 ? stages[curIdx] : null;

  const card = document.createElement('div');
  card.className = 'plan-card';
  card.dataset.planId = plan.id;        // 心跳要靠它把「誰在看」貼上去

  const head = document.createElement('div');
  head.className = 'plan-head';
  const nm = document.createElement('span');
  nm.className = 'plan-name';
  nm.textContent = plan.name;
  head.appendChild(nm);
  const tp = document.createElement('span');
  tp.className = 'pill';
  tp.textContent = plan.type;
  head.appendChild(tp);
  (plan.tags || []).forEach(t => {
    const el = document.createElement('span');
    el.className = 'pill tag';
    el.textContent = t;
    head.appendChild(el);
  });
  /* 球在哪，不必開檔期就看得到。跟橫幅同一句話（見 updateProgress）——
     兩個地方講同一件事就該用同一個說法，不然會被當成兩種數字。
     本來這裡寫的是「已確認 n / m 版位」，但 planProgress 早就改成數格、回的是
     {pm, design, total}，`prog.done` 根本不存在，畫出來就是「已確認 undefined / 322」。
     而且「已確認」那個概念也沒了：現在只有「球在哪」。 */
  /* 還沒提交：只有行銷看得到這張卡（見 visiblePlans），所以這枚標籤是講給他聽的 */
  if (isDraft(plan)){
    const d = document.createElement('span');
    d.className = 'pill draft';
    d.textContent = '草稿・還沒提交';
    d.title = '設計和 PM 還看不到這一檔。切完版之後在 總體 按「提交給設計」';
    head.appendChild(d);
  }
  const prog = planProgress(plan);
  if (prog){
    const pg = document.createElement('span');
    /* 顏色照版位那一套三級：全在 PM＝綠、一半＝黃、都在設計手上＝白。
       綠只給整份都交出去的 —— 交了一半還在設計手上，給綠會被當成做完了。 */
    pg.className = 'pill prog' + (prog.pm === 0 ? ' wip' : prog.design ? ' half' : '');
    pg.textContent = `在 PM ${prog.pm}・在設計 ${prog.design} 格`;
    head.appendChild(pg);
  }
  if (plan.stageOverride != null) head.appendChild(manualPill(plan, curIdx, autoStageIndex(plan)));
  if (live){
    const cd = document.createElement('span');
    cd.className = 'pill count';
    cd.dataset.deadline = stageDeadline(live).getTime();
    cd.dataset.stage = live.name;
    tickPill(cd);
    head.appendChild(cd);
  }
  const outEl = document.createElement('span');
  outEl.className = 'plan-out';
  outEl.innerHTML = `出稿 <b>${fmtMD(out)} 09:00</b>`;
  head.appendChild(outEl);

  /* 改時程：開回開檔那張表、同一條時間軸。日期改的次數比想像多（印廠改期、
     檔期提前），而那個工具本來就在這裡 —— 沒有這顆的話只能重開一個檔期。 */
  if (isMkt() && !past){
    const ed = document.createElement('button');
    ed.className = 'btn';
    ed.textContent = '改時程';
    ed.title = '用開檔那條時間軸改這個檔期的日期和各段天數';
    ed.addEventListener('click', e => { e.stopPropagation(); PlanForm.open(plan); });
    head.appendChild(ed);
  }
  /* 刪除：行銷才有（檔期是他開的）。刪掉是進回收桶，不是抹掉 ——
     所以這顆不必長得很兇，真正要小心的是回收桶裡那顆「永久刪除」。 */
  if (isMkt()){
    const del = document.createElement('button');
    del.className = 'btn';
    del.textContent = '🗑';
    del.title = '刪除這個檔期（會先問一次，之後還原得回來）';
    del.addEventListener('click', e => { e.stopPropagation(); askDeletePlan(plan); });
    head.appendChild(del);
  }
  const open = document.createElement('button');
  open.className = 'btn open';
  open.textContent = '開啟';
  open.addEventListener('click', () => openPlan(plan));
  head.appendChild(open);
  card.appendChild(head);

  const row = document.createElement('div');
  row.className = 'stage-row';
  stages.forEach((sg,i) => {
    const chip = document.createElement('div');
    chip.className = 'stage-chip';
    if (curIdx < 0 ? stageDeadline(sg) < now : i < curIdx) chip.classList.add('done');
    else if (i === curIdx) chip.classList.add('now');
    chip.innerHTML = `<div class="n"></div><div class="d"></div>`;
    chip.querySelector('.n').textContent = sg.name;
    chip.querySelector('.d').textContent = stageRange(sg);
    row.appendChild(chip);
  });
  card.appendChild(row);
  appendCardMap(card, plan);      // 挑到哪了 ＋ 拉得開的小地圖
  return card;
}

/* 誰看得到哪些檔期。**只有這一個出口** —— 檔期列表、PM 左欄那份清單、之後的
   過往檔期都走它，不然「草稿」會從某一份沒改到的清單漏出去。
   行銷看得到自己還在切的草稿；設計和 PM 要等他按「提交給設計」。 */
function visiblePlans(){
  return isMkt() ? plans.slice() : plans.filter(pl => !isDraft(pl));
}

function renderPlans(){
  planList.innerHTML = '';
  syncListButtons();        // 過往檔期／回收桶那兩顆上的數字跟著檔期走
  renderStatusBar();        // 管理列跟卡片讀同一份資料，就一起重畫
  const now = new Date();
  const running = visiblePlans().reverse().filter(pl => !isFinished(pl));
  if (!running.length){
    planList.innerHTML = '<div class="empty-hint">目前沒有進行中的檔期</div>';
    return;
  }
  running.forEach(plan => planList.appendChild(buildPlanCard(plan, now)));
  paintPresence();          // 卡片是整批重建的，記號要補回去
}
/* ==========================================================================
   卡片下半：這一檔挑到哪了 ＋ 拉得開的小地圖
   ==========================================================================
   從行銷那一支搬回來的。一張卡上要回答的是「這一檔還缺哪裡」：
   收起來是一條方塊（一格一個版位，看得出還有幾塊沒做），拉開才是版面本人。

   跟原本那一版的差別：那邊每一塊上還寫著「這塊歸哪位 PM」。一格一位 PM
   拿掉之後沒有那件事了，所以那一格改成寫「挑好幾格」。
   ========================================================================== */
const MM_GAP = 36;            // 正面和背面中間留多少（要跟 .mm-wrap 的 gap 一樣）
/* 哪幾張卡的小地圖是拉開的。記在這裡而不是 DOM 上 —— 卡片會被整批重建
   （倒數每 30 秒跳一次），記在 DOM 上的話你拉開的那張會自己合起來。 */
const mapOpen = new Set();

const planBlocksOf = plan => plan && plan.layout
  ? collectBlocks(plan.layout.front, []).concat(collectBlocks(plan.layout.back, []))
  : [];
/** 這張版多大（cm）。boardCm() 問的是「現在開著的那一檔」，列表上沒有那個東西。 */
const planCm = plan => (plan && DM_SIZE[plan.type]) || DM_SIZE_FALLBACK;

/* 一個版位挑到哪了：wait 一格都還沒挑／doing 挑了一部分／done 每一格都有貨。
   「做完」用「每一格都有貨」認，因為那正是 PM 在拼板要做的事。 */
function blockPicked(b){
  const cells = (b.sheet && b.sheet.cells) || [];
  const done = cells.filter(c => pickedOf(c).length).length;
  return { done, total: cells.length,
           state: !cells.length || !done ? 'wait' : done === cells.length ? 'done' : 'doing' };
}

/* 小地圖本人。形狀的算法跟編輯器左邊那一張同源（同一棵樹、同一套百分比），
   所以這裡畫出來的比例跟設計在編輯器裡看到的一模一樣。差別只有兩點：
   這裡不能點，而且每一塊寫的是「挑到哪」而不是版位的狀態。 */
function cardMiniNode(node, wpx, hpx){
  if (!node.children){
    const p = blockPicked(node);
    const el = document.createElement('div');
    el.className = 'mm-blk ' + (p.state === 'doing' ? 'part' : p.state === 'done' ? 'done' : '')
                 + (p.total ? '' : ' unlaid');
    if (p.state === 'doing' && p.total)
      el.style.setProperty('--fill', Math.round(p.done / p.total * 100) + '%');
    /* 字級照這一塊真正有多大算：窄的版位分到的可能不到 60px 寬，
       寫死字級就會被切掉半截。 */
    el.style.fontSize = Math.max(13, Math.min(25, Math.floor(Math.min(hpx / 1.6, wpx / 2.4)))) + 'px';
    /* 太薄的版位（版面上真的有那種一長條的）就只留顏色 —— 塞字進去只會被切掉
       半個字，看起來像壞掉。 */
    el.innerHTML = hpx < 25 ? ''
                 : `<b>${escapeHtml(node.name || '版位')}</b>`
                   + (hpx > 54 && p.total ? `<span>${p.done}/${p.total}</span>` : '');
    el.title = `${node.name || '版位'}　`
             + (p.total ? `${p.done}/${p.total} 格挑好貨` : '還沒排版');
    return el;
  }
  const el = document.createElement('div');
  el.className = 'mm-split';
  const row = node.dir === 'row';
  el.style.flexDirection = row ? 'row' : 'column';
  const sizes = effSizes(node);
  const folds = node.fold ? 3 * (node.children.length - 1) : 0;   // .mm-fold 的寬
  const availW = row ? wpx - folds : wpx;
  const availH = row ? hpx : hpx - folds;
  node.children.forEach((kid, i) => {
    if (i > 0 && node.fold){
      const f = document.createElement('div');
      f.className = 'mm-fold';
      el.appendChild(f);
    }
    const kw = row ? (sizes[i] / 100) * availW : availW;
    const kh = row ? availH : (sizes[i] / 100) * availH;
    const k = cardMiniNode(kid, kw, kh);
    k.style.flex = `${sizes[i]} 1 0%`;
    k.style.minWidth = '0px';
    k.style.minHeight = '0px';
    el.appendChild(k);
  });
  return el;
}

/** 掛在卡片下半：一行摘要 ＋ 收起來的方塊條 ＋ 拉得開的小地圖。沒版面就整段不出現。 */
function appendCardMap(card, plan){
  const blks = planBlocksOf(plan).map(b => Object.assign({ name: b.name || '版位' }, blockPicked(b)));
  const pmRow = document.createElement('div');
  pmRow.className = 'pm-row' + (blks.length ? '' : ' empty');
  card.appendChild(pmRow);
  if (!blks.length) return;

  const done = blks.filter(b => b.state === 'done').length;
  const line = document.createElement('div');
  line.className = 'pm-line';

  const sum = document.createElement('span');
  sum.className = 'pm-sum' + (done === blks.length ? ' all' : '');
  sum.textContent = `版位 ${done}/${blks.length} 挑完`;
  line.appendChild(sum);

  /* 收起來的樣子：一塊版位一個方塊，填多少＝挑了幾格。 */
  const map = document.createElement('span');
  map.className = 'pm-map';
  blks.forEach(b => {
    const sq = document.createElement('i');
    sq.className = 'pm-blk' + (b.state === 'done' ? ' done' : b.state === 'doing' ? ' part' : '');
    if (b.state === 'doing' && b.total)
      sq.style.setProperty('--fill', Math.round(b.done / b.total * 100) + '%');
    sq.title = `${b.name}　${b.total ? `${b.done}/${b.total} 格挑好貨` : '還沒排版'}`;
    map.appendChild(sq);
  });
  line.appendChild(map);

  /* 一句話講「還缺多少」。全部都還沒動的時候只說一句還沒開始 ——
     那時候「還沒挑完 10 塊」等於把整張版念一遍，那不是在點名，是在報名冊。 */
  const left = blks.length - done;
  const who = document.createElement('span');
  who.className = 'pm-who' + (left ? '' : ' all');
  who.textContent = !left            ? '都挑完了'
                  : done === 0       ? '還沒開始'
                                     : `還有 ${left} 塊沒挑完`;
  line.appendChild(who);
  pmRow.appendChild(line);

  const open = mapOpen.has(plan.id);
  const wrap = document.createElement('div');
  wrap.className = 'mm-wrap' + (open ? '' : ' shut');
  pmRow.appendChild(wrap);

  /* 兩張版是拉開的時候才畫的 —— 要照卡片實際多寬去分，那件事得等它進到畫面上
     才量得到。順便：關著的卡片一張都不用畫。 */
  const drawMaps = () => {
    wrap.innerHTML = '';
    const room = wrap.clientWidth || 700;
    // 滿寬的 0.7：版面縮 30%，字反而看起來更滿
    const w = Math.max(150, Math.floor((room - MM_GAP) / 2 * 0.7));
    const cm = planCm(plan);
    const h = Math.round(w * cm.h / cm.w);     // 照這一種 DM 真正的長寬比
    [['front','正面'], ['back','背面']].forEach(([side, title]) => {
      if (!plan.layout || !plan.layout[side]) return;
      const box = document.createElement('div');
      box.className = 'mm-side';
      const tag = document.createElement('span');
      tag.className = 'mm-tag';
      tag.textContent = title;
      const page = document.createElement('div');
      page.className = 'mm-page';
      page.style.width = w + 'px';
      page.style.height = h + 'px';
      page.appendChild(cardMiniNode(plan.layout[side], w - 3, h - 3));
      box.appendChild(tag); box.appendChild(page);
      wrap.appendChild(box);
    });
  };

  /* 把手掛在卡片下緣（不是那一行裡）—— 它是「這張卡還有一截沒拉開」的意思，
     所以站在卡片的邊上，不是站在資訊列裡當一顆按鈕。 */
  const tab = document.createElement('button');
  tab.type = 'button';
  tab.className = 'mm-tab' + (open ? ' on' : '');
  tab.innerHTML = '小地圖<span class="arw">▾</span>';
  tab.title = open ? '收起小地圖' : '展開小地圖';
  tab.addEventListener('click', e => {
    e.stopPropagation();
    const now = !mapOpen.has(plan.id);
    now ? mapOpen.add(plan.id) : mapOpen.delete(plan.id);
    wrap.classList.toggle('shut', !now);
    tab.classList.toggle('on', now);
    tab.title = now ? '收起小地圖' : '展開小地圖';
    if (now) drawMaps();
  });
  card.appendChild(tab);
  // 重畫卡片時本來就開著的那幾張要補畫（clientWidth 要等它進 DOM 才量得到）
  if (open) setTimeout(drawMaps, 0);
}

/* ==========================================================================
   目前階段管理列
   ==========================================================================
   一個檔期現在走到哪一階段，平常是**算出來的**（第一個還沒過期限的那一關）。
   但實際上會提前、會延、會卡住，而下游只看得到日期 —— 所以留一條手動指定的路：
   點檔期名字 → 點階段 → 確認。指定過的掛一枚「手動」，跟推算的分得出來。

   ⚠️ 它是**開發／示範用的面板**，不是每天要看的東西，所以收得起來，
   而且收起來之後把手還在（不然收掉就再也開不回來）。

   跟行銷那一支的差別：那邊這一條裡還有「＋ 示範檔期」和「刪除檔期」。
   這支已經有「壓力測試」那顆，刪除也已經在卡片上 —— 同一件事不留兩個入口。
   ========================================================================== */
const statusBar = document.getElementById('statusBar');
const SB_FOLD_KEY = 'catalogue_statusbar_folded';
let sbFolded = false;
try { sbFolded = localStorage.getItem(SB_FOLD_KEY) === '1'; } catch (e){}
let focusPlanId = null;     // 管理列現在攤開的是哪一檔
let barEditMode = false;    // 點了名字才進編輯模式，階段格才點得下去
let editTimer = null;       // 放著不動就自己收起來

/** 那條把手。收起來之後它自己還在，不然就再也拉不回來了。 */
function sbPullBtn(){
  const b = document.createElement('button');
  b.className = 'sb-pull';
  b.type = 'button';
  b.innerHTML = sbFolded ? '目前階段管理　⌄' : '⌃';
  b.title = sbFolded ? '拉出「目前階段管理」' : '收起「目前階段管理」';
  b.addEventListener('click', e => {
    e.stopPropagation();
    sbFolded = !sbFolded;
    try { localStorage.setItem(SB_FOLD_KEY, sbFolded ? '1' : '0'); } catch (err){}
    renderStatusBar();
  });
  return b;
}

function resetEditTimer(){
  clearTimeout(editTimer);
  editTimer = setTimeout(exitEditMode, 10000);
}
/* 點名字＝攤開那一檔；再點同一個就收起來 */
function selectForEdit(id){
  if (barEditMode && focusPlanId === id){ exitEditMode(); return; }
  focusPlanId = id;
  barEditMode = true;
  renderStatusBar();
  resetEditTimer();
}
function exitEditMode(){
  if (!barEditMode) return;
  barEditMode = false;
  clearTimeout(editTimer);
  renderStatusBar();
}

function renderStatusBar(){
  /* 列的是**看得到的每一檔**，不是只有進行中的 —— 不然全部跑完的那一天
     這條管理列會剛好消失，而那正是你想手動把某一檔拉回來的時候。 */
  const list = visiblePlans();
  if (!list.length){
    statusBar.hidden = true;
    statusBar.innerHTML = '';
    barEditMode = false;
    return;
  }
  statusBar.hidden = false;
  statusBar.classList.toggle('folded', sbFolded);
  if (sbFolded){                       // 收起來：只留把手，其他一律不畫
    statusBar.innerHTML = '';
    statusBar.appendChild(sbPullBtn());
    return;
  }
  // 攤開的那一檔被刪掉了就換一個：離期限最近的
  if (!focusPlanId || !list.some(p => p.id === focusPlanId)){
    focusPlanId = list.slice().sort((a,b) => nextDeadline(a) - nextDeadline(b))[0].id;
  }
  statusBar.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'sb-title';
  title.innerHTML = '目前階段管理<span class="sb-sub">點選檔期即可調整目前階段</span>';
  statusBar.appendChild(title);

  const names = document.createElement('div');
  names.className = 'sb-names';
  list.forEach(plan => {
    const stages = planStages(plan);
    const curIdx = currentStageOf(plan);
    const autoIdx = autoStageIndex(plan);
    const overriding = plan.stageOverride != null;
    const cur = curIdx >= 0 ? stages[curIdx] : null;

    const btn = document.createElement('button');
    btn.className = 'sb-name' + (barEditMode && plan.id === focusPlanId ? ' selected' : '');
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = plan.name;
    btn.appendChild(nm);
    if (cur){
      const st = document.createElement('span');
      st.className = 'st'; st.textContent = '· ' + cur.name;
      btn.appendChild(st);
      const cd = document.createElement('span');
      cd.className = 'sb-cd';
      cd.dataset.deadline = stageDeadline(cur).getTime();
      cd.textContent = fmtCountdown(stageDeadline(cur).getTime() - Date.now());
      btn.appendChild(cd);
    }
    if (overriding) btn.appendChild(manualPill(plan, curIdx, autoIdx));
    btn.addEventListener('click', e => { e.stopPropagation(); selectForEdit(plan.id); });
    names.appendChild(btn);
  });
  statusBar.appendChild(names);

  if (barEditMode){
    const plan = list.find(p => p.id === focusPlanId);
    const stages = planStages(plan);
    const curIdx = currentStageOf(plan);

    const editor = document.createElement('div');
    editor.className = 'sb-editor';

    const row = document.createElement('div');
    row.className = 'sb-editrow';
    const lead = document.createElement('span');
    lead.className = 'sb-edit-lead';
    lead.textContent = `變更『${plan.name}』目前階段：`;
    row.appendChild(lead);
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    row.appendChild(spacer);
    if (plan.stageOverride != null){
      const auto = document.createElement('button');
      auto.className = 'sb-linkbtn';
      auto.textContent = '回復自動';
      auto.addEventListener('click', e => { e.stopPropagation(); resetEditTimer(); askStage(plan, 'auto'); });
      row.appendChild(auto);
    }
    const done = document.createElement('button');
    done.className = 'sb-linkbtn';
    done.textContent = '完成';
    done.addEventListener('click', e => { e.stopPropagation(); exitEditMode(); });
    row.appendChild(done);
    editor.appendChild(row);

    const track = document.createElement('div');
    track.className = 'sb-track';
    stages.forEach((sg,i) => {
      const chip = document.createElement('div');
      chip.className = 'stage-chip';
      if (curIdx < 0 ? stageDeadline(sg) < new Date() : i < curIdx) chip.classList.add('done');
      else if (i === curIdx) chip.classList.add('now');
      chip.innerHTML = '<div class="n"></div><div class="d"></div>';
      chip.querySelector('.n').textContent = sg.name;
      chip.querySelector('.d').textContent = stageRange(sg);
      chip.addEventListener('click', e => { e.stopPropagation(); resetEditTimer(); askStage(plan, i); });
      track.appendChild(chip);
    });
    editor.appendChild(track);

    const hint = document.createElement('div');
    hint.className = 'sb-hint';
    hint.textContent = '點選上方階段即可設為目前進度（會再次確認）';
    editor.appendChild(hint);
    statusBar.appendChild(editor);
  }
  statusBar.appendChild(sbPullBtn());   // 最後才掛：它是貼在下緣的把手，不是內容
}

/** 「手動」那一枚。系統推算的跟指定的不一樣時畫成虛線，滑過去看得到推算是哪一關。 */
function manualPill(plan, curIdx, autoIdx){
  const mp = document.createElement('span');
  const drift = autoIdx !== curIdx && autoIdx >= 0;
  mp.className = 'pill manual' + (drift ? ' drift' : '');
  mp.textContent = '手動';
  if (drift) mp.title = `系統推算目前為：${STAGES[autoIdx]}`;
  return mp;
}
/** 只拿來挑預設要攤開哪一檔：離下一個期限最近的 */
function nextDeadline(plan){
  const i = autoStageIndex(plan);
  return i >= 0 ? stageDeadline(planStages(plan)[i]).getTime() : Infinity;
}

/* 每一次變更都問一次：這是「替所有人改一個事實」，不是調自己的畫面。 */
async function askStage(plan, chosen){
  const curIdx = currentStageOf(plan);
  const curName = curIdx >= 0 ? STAGES[curIdx] : '（無）';
  let body, apply;
  if (chosen === 'auto'){
    const a = autoStageIndex(plan);
    body = `『${plan.name}』要回復成自動判定嗎？（系統推算目前為：${a >= 0 ? STAGES[a] : '（無）'}）`;
    apply = () => { plan.stageOverride = null; };
  } else {
    if (chosen === curIdx) return;      // 點現在這一關＝什麼都沒說
    body = `『${plan.name}』的目前階段要從 ${curName} 改成 ${STAGES[chosen]} 嗎？`;
    apply = () => { plan.stageOverride = chosen; };
  }
  const ok = await modalConfirm({ title:'變更目前階段', body: body, ok:'確認', cancel:'取消' });
  if (!ok) return;
  apply();
  savePlans();
  const s = sync(); if (s) s.queueUpsert(plan);
  barEditMode = false;
  renderPlans();                       // 卡片和管理列一起重畫，兩邊才不會各說各話
  toast('已更新目前階段', 'ok', 2200);
}

/* 滑鼠還在上面就別自己收；點到外面就收起來 */
statusBar.addEventListener('mousemove', () => { if (barEditMode) resetEditTimer(); });
document.addEventListener('click', e => {
  if (!barEditMode) return;
  if (e.target.closest('#statusBar') || e.target.closest('#modalHost')) return;
  exitEditMode();
});
/* 倒數每分鐘跳一次。只更新那幾個數字，不重畫整條 —— 重畫的話你正攤開的
   那一檔會在你讀它的時候自己合起來。 */
setInterval(() => {
  if (currentPlan || statusBar.hidden) return;
  statusBar.querySelectorAll('.sb-cd[data-deadline]').forEach(el => {
    el.textContent = fmtCountdown(+el.dataset.deadline - Date.now());
  });
}, 30000);

/* ==========================================================================
   過往檔期／回收桶
   ==========================================================================
   已經出稿的檔期不佔首頁（首頁是「現在在跑的事」），收進 📁 那個彈窗。
   刪掉的檔期不是消失，是進回收桶 —— 刪錯一個檔期的代價太大。
   ⚠️ **回收桶只在這台機器上**（`catalogue_trash_v1`）。共用資料庫那邊是直接把
   那一列拿掉（queueRemove），別台機器之後開才不會又看到它；也就是說「還原」
   只還原得了你自己刪的那一份。這是刻意的取捨：回收桶是給手滑用的，不是版本控制。
   ========================================================================== */
const LS_TRASH = 'catalogue_trash_v1';
let trash = readLS(LS_TRASH, []) || [];
if (!Array.isArray(trash)) trash = [];
const saveTrash = () => { try { localStorage.setItem(LS_TRASH, JSON.stringify(trash)); } catch (e){} };

const pastMask  = document.getElementById('pastMask');
const trashMask = document.getElementById('trashMask');
const finishedPlans = () => visiblePlans().reverse().filter(isFinished);

/* 檔期列表那一行上的每一顆，都在這裡決定給不給看。
   **整排都是行銷的**：新增、改時程、刪除、匯入一份檔期、翻過往檔期、清空資料 ——
   講的都是「這本 DM 存不存在、什麼時候做」，那是排檔期的人的事。
   設計和 PM 手上永遠是「別人開好的檔」，他們的列表列上只剩標題和名牌。
   （「壓力測試」那顆不在這裡：它是 devtool，長得就不像正常流程裡的按鈕。） */
function syncListButtons(){
  const mkt = isMkt();
  ['wipeBtn','importBtn','newPlanBtn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.hidden = !mkt;
  });
  const pb = document.getElementById('pastBtn');
  const n = finishedPlans().length;
  pb.hidden = !mkt;
  pb.textContent = n ? `📁 過往檔期 (${n})` : '📁 過往檔期';
  /* 回收桶是「刪除」的反悔鍵。空的時候連行銷也收起來 —— 沒東西可還原時它只是雜訊。 */
  const tb = document.getElementById('trashBtn');
  tb.hidden = !trash.length || !mkt;
  tb.textContent = `🗑 回收桶 (${trash.length})`;
}

function renderPast(){
  const host = document.getElementById('pastList');
  host.innerHTML = '';
  const list = finishedPlans();
  if (!list.length){
    host.innerHTML = '<div class="trash-empty">還沒有結束的檔期</div>';
    return;
  }
  const now = new Date();
  list.forEach(plan => host.appendChild(buildPlanCard(plan, now, true)));
}
const closePast = () => pastMask.classList.remove('on');
document.getElementById('pastBtn').addEventListener('click', () => {
  renderPast();
  pastMask.classList.add('on');
});
document.getElementById('pastClose').addEventListener('click', closePast);
pastMask.addEventListener('click', e => { if (e.target === pastMask) closePast(); });

/** 刪一個檔期：問一次，然後**搬**進回收桶（不是抹掉）。 */
async function askDeletePlan(plan){
  const ok = await modalConfirm({
    title: '刪除檔期',
    body: `確定要刪除「${plan.name}」嗎？會移到回收桶，還原得回來。`
        + (sync() ? '共用資料庫上的那一筆會直接拿掉，別人重整之後就看不到了。' : ''),
    ok: '刪除', cancel: '取消', danger: true
  });
  if (!ok) return;
  const i = plans.indexOf(plan);
  if (i < 0) return;
  plans.splice(i, 1);
  trash.push(Object.assign({}, plan, { deletedAt: Date.now() }));
  savePlans(); saveTrash();
  const s = sync(); if (s) s.queueRemove(plan.id);
  renderPlans();
  if (pastMask.classList.contains('on')) renderPast();   // 從過往那一份刪的
  toast(`已將「${plan.name}」移到回收桶`, 'info', 2600);
}

function renderTrash(){
  const host = document.getElementById('trashList');
  host.innerHTML = '';
  if (!trash.length){
    host.innerHTML = '<div class="trash-empty">回收桶是空的</div>';
    return;
  }
  [...trash].reverse().forEach(plan => {
    const row = document.createElement('div');
    row.className = 'trash-item';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = plan.name;
    const tp = document.createElement('span');
    tp.className = 'pill';
    tp.textContent = plan.type;
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = plan.deletedAt ? '刪除於 ' + fmtMD(new Date(plan.deletedAt)) : '';
    const restore = document.createElement('button');
    restore.className = 'mini';
    restore.textContent = '↩ 還原';
    restore.addEventListener('click', () => restorePlan(plan));
    const purge = document.createElement('button');
    purge.className = 'mini del';
    purge.textContent = '永久刪除';
    purge.addEventListener('click', () => askPurge(plan));
    row.appendChild(nm); row.appendChild(tp); row.appendChild(when);
    row.appendChild(restore); row.appendChild(purge);
    host.appendChild(row);
  });
}
function restorePlan(plan){
  const i = trash.indexOf(plan);
  if (i < 0) return;
  trash.splice(i, 1);
  const clean = Object.assign({}, plan);
  delete clean.deletedAt;
  plans.push(clean);
  savePlans(); saveTrash();
  // 還原＝再送上去一次：刪的時候已經從共用資料庫拿掉了
  const s = sync(); if (s) s.queueUpsert(clean);
  renderTrash(); renderPlans();
  toast(`已還原「${plan.name}」`, 'ok', 2400);
}
async function askPurge(plan){
  const ok = await modalConfirm({
    title: '永久刪除',
    body: `「${plan.name}」會被永久刪除，救不回來。確定嗎？`,
    ok: '永久刪除', cancel: '取消', danger: true
  });
  if (!ok) return;
  const i = trash.indexOf(plan);
  if (i < 0) return;
  trash.splice(i, 1);
  saveTrash();
  renderTrash(); syncListButtons();
  toast('已永久刪除', 'info', 2000);
}
const closeTrash = () => trashMask.classList.remove('on');
document.getElementById('trashBtn').addEventListener('click', () => {
  renderTrash();
  trashMask.classList.add('on');
});
document.getElementById('trashClose').addEventListener('click', closeTrash);
trashMask.addEventListener('click', e => { if (e.target === trashMask) closeTrash(); });

/* Esc 由近到遠收：回收桶開在過往檔期上面的時候，先收上面那一張 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (trashMask.classList.contains('on')){ closeTrash(); return; }
  if (pastMask.classList.contains('on')) closePast();
});

/* ==========================================================================
   開檔表＋時間軸  —— 行銷開一個新檔期，或改一個檔期的時程
   ==========================================================================
   整段從 落版單系統.html 搬過來（那邊的 VIEW 2）。**包成自己的 IIFE**：
   兩支程式的頂層名字撞得很兇（render、setMode、savePlans、saveState、
   initBoards、pxPerCm、boardCm、DM_SIZE、restore、undoBtn…全部同名不同義），
   平鋪進來就是一場改名大戰，而且改錯了只會在執行到那一行的時候才炸。

   ⚠️ 模組裡**一行都不能在定義當下執行**：這支程式是一整個 <script>，
   在頂層跑一個會讀到下面才宣告的 let 的函式 → ReferenceError → 整頁死掉，
   而且語法檢查完全看不出來。所以 buildGrid()／render() 一律延到第一次 open()。

   外面只看得到 PlanForm.open(plan|null)：null ＝ 開一張新的。
   ========================================================================== */
const PlanForm = (function(){
  const DEFAULT_DURS = [2,2,1,1,1,1,2,1,1,1];
  const PRESET_TAGS  = ['大DM','小DM','促銷','新品','節慶','週年慶','母親節','年中慶'];
  const DM_TYPES     = ['全省對開大DM','網路素材','單店制作物','A3'];
  const N = STAGES.length;
  const PX_PER_BLOCK = 56;
  const MIN_UNITS = 5;        // 總長沒有上限 —— 打幾天就是幾天，只有下限

  const $ = id => document.getElementById(id);
  const fmtMDW = d => fmtMD(d) + '(' + WD[d.getDay()] + ')';

  let els = null;             // 第一次 open() 才抓 DOM、才建旗子和天數格
  let START = atMid(new Date());
  let flagDates = [];
  let UNITS = 15;
  let selected = 0, dragging = -1, pending = null;
  let tags = [];
  let editingPlan = null;     // null ＝這是新的一張，不是在改誰
  const durInputs = [], durDateEls = [], flagEls = [];

  /* ---- 日期算術：旗子插在「那一段的最後一天」 ---- */
  const firstValid = () => isWE(START) ? nextWork(START) : START;
  const baseDay    = () => addDays(firstValid(), -1);
  // 提品至少要有一天；後面每一段都可以縮成 0 天（＝跟前一段同一天結束，旗子疊起來）
  const minDur = i => i === 0 ? 1 : 0;

  function flagsFromDurs(durs){
    let prev = baseDay();
    flagDates = durs.map((d,i) => { prev = addWork(prev, Math.max(minDur(i), d)); return prev; });
  }
  function dursFromFlags(){
    let prev = baseDay();
    return flagDates.map(f => { const d = workBetween(prev, f); prev = f; return d; });
  }
  /* 軸上只有 UNITS 格，最後一支旗子要站在最後一格的尾巴上 —— 再往右就沒有方塊給它站了 */
  function lastValid(){
    const d = addDays(START, UNITS - 1);
    return isWE(d) ? prevWork(d) : d;
  }
  function clampFlags(){
    const lo = firstValid(), hi = lastValid();
    flagDates = flagDates.map(f => f < lo ? lo : (f > hi ? hi : f));
  }
  /* 軸有多長**只有「總長」那一格說了算**（或開新表／改開始日時自己算一次）——
     拖旗子永遠不會把軸拉長，所以拖曳的手感是固定的。 */
  function setTotal(v){
    if (!Number.isFinite(v)) v = UNITS;
    UNITS = Math.max(MIN_UNITS, Math.round(v));
    els.totalInput.value = UNITS;
    clampFlags(); buildGrid(); render();
  }
  function fitTotalToFlags(){
    UNITS = Math.max(15, dayOffset(START, flagDates[N-1]) + 2);
    els.totalInput.value = UNITS;
  }

  /* ---- 天數那一排 ---- */
  function buildDurRow(){
    STAGES.forEach((name, i) => {
      const cell = document.createElement('div');
      cell.className = 'dur-cell';
      const dn = document.createElement('div');
      dn.className = 'dn'; dn.textContent = name;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = minDur(i);
      const unit = document.createElement('span');
      unit.className = 'unit'; unit.textContent = ' 天';
      const dd = document.createElement('div');
      dd.className = 'dd';
      cell.appendChild(dn); cell.appendChild(inp);
      cell.appendChild(unit); cell.appendChild(dd);
      els.durRow.appendChild(cell);
      durInputs.push(inp); durDateEls.push(dd);

      inp.addEventListener('change', () => {
        let v = parseInt(inp.value, 10);
        if (!Number.isFinite(v) || v < minDur(i)) v = minDur(i);
        inp.value = v;
        const durs = dursFromFlags();
        durs[i] = v;
        flagsFromDurs(durs);
        /* 把一段拉長就把軸拉長到裝得下 —— 不是把旗子卡在軸的盡頭。
           而且只長不縮：改個數字就把你調好的軸長洗掉會很惱人。 */
        UNITS = Math.max(UNITS, dayOffset(START, flagDates[N-1]) + 2);
        els.totalInput.value = UNITS;
        buildGrid(); render();
      });
    });
  }
  function syncDurRow(){
    dursFromFlags().forEach((d,i) => {
      durInputs[i].value = d;
      durDateEls[i].textContent = fmtMDW(flagDates[i]);
    });
  }

  /* ---- 格線、日期、週末 ---- */
  function buildGrid(){
    // 面板 12 ＋ bar-wrap 14 的內距：扣掉之後 bar 剛好 UNITS × PX_PER_BLOCK 寬，
    // 所以螢幕上「一天」永遠是同一個寬度
    els.tlPanel.style.width = (UNITS * PX_PER_BLOCK + 26) + 'px';
    els.bar.innerHTML = '';
    els.numberLabels.innerHTML = '';
    for (let n = 0; n <= UNITS; n++){
      const d = addDays(START, n);
      if (isWE(d) && n < UNITS){
        const sh = document.createElement('div');
        sh.className = 'we-shade';
        sh.style.left = (n / UNITS * 100) + '%';
        sh.style.width = (1 / UNITS * 100) + '%';
        sh.textContent = d.getDay() === 6 ? '周' : '末';
        els.bar.appendChild(sh);
      }
      const line = document.createElement('div');
      line.className = 'grid-line ' + (d.getDay() === 1 ? 'major' : 'minor');
      line.style.left = (n / UNITS * 100) + '%';
      els.bar.appendChild(line);

      const lbl = document.createElement('div');
      lbl.className = 'number-label' + (isWE(d) ? ' we' : '');
      lbl.style.left = (n / UNITS * 100) + '%';
      lbl.textContent = fmtMD(d);
      els.numberLabels.appendChild(lbl);
    }
  }

  const FLAG_HEXES = ['#ff6b6b','#ffa94d','#f5c211','#94d82d','#51cf66',
                      '#20c997','#22b8cf','#4dabf7','#845ef7','#f06595'];
  const hexToRgb = h => { const n = parseInt(h.slice(1),16); return {r:(n>>16)&255, g:(n>>8)&255, b:n&255}; };
  function mix(hex, target, amount){
    const c1 = hexToRgb(hex), c2 = hexToRgb(target);
    const f = c => Math.round(c1[c]*amount + c2[c]*(1-amount));
    return 'rgb(' + f('r') + ', ' + f('g') + ', ' + f('b') + ')';
  }
  const segColor = i => mix(FLAG_HEXES[i], '#ffffff', 0.42);

  function labelRow(i){
    const row = document.createElement('div');
    row.className = 'row';
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = FLAG_HEXES[i];
    row.appendChild(sw);
    const name = STAGES[i];
    const label = document.createElement('span');
    if (name.length > 4){
      // 長名字折成兩行，不要把這一格撐寬去擠隔壁
      label.className = 'label-2line';
      const mid = Math.ceil(name.length/2);
      label.innerHTML = '<div></div><div></div>';
      label.children[0].textContent = name.slice(0,mid);
      label.children[1].textContent = name.slice(mid);
    } else label.textContent = name;
    row.appendChild(label);
    return row;
  }

  /* 這一天在做哪一段：第一個「還沒結束」的就是它。0 天的那一段結束日跟前一支一樣，
     所以它分不到任何一天 —— 那正是「同日結束」的意思。 */
  function stageOfDay(d){
    const t = +atMid(d);
    for (let i = 0; i < N; i++) if (t <= +atMid(flagDates[i])) return i;
    return -1;
  }
  /* 一天一塊。週末不畫（不算天數）、開工日之前不畫。 */
  function paintDayBlocks(){
    els.bar.querySelectorAll('.day-blk').forEach(n => n.remove());
    const start = +atMid(baseDay());
    for (let n = 0; n < UNITS; n++){
      const d = addDays(START, n);
      if (isWE(d) || +atMid(d) <= start) continue;
      const i = stageOfDay(d);
      if (i < 0) continue;
      const el = document.createElement('div');
      el.className = 'day-blk';
      el.style.left  = (n / UNITS * 100) + '%';
      el.style.width = (1 / UNITS * 100) + '%';
      el.style.background = segColor(i);
      el.title = STAGES[i] + '　' + fmtMDW(d);
      els.bar.appendChild(el);
    }
  }

  function render(){
    /* 旗子插在「最後一塊的尾巴」，不是那一天的開頭 —— 期限是那天下班前，
       旗子就該站在那一格的右緣。所以是 +1 格寬。 */
    const pos = flagDates.map(f => Math.min(1, (dayOffset(START, f) + 1) / UNITS));
    paintDayBlocks();

    // 同一天結束的幾段疊成一支
    const groups = [];
    flagDates.forEach((f,i) => {
      const g = groups.find(g => +flagDates[g[0]] === +f);
      if (g) g.push(i); else groups.push([i]);
    });

    flagEls.forEach((el,i) => {
      const group = groups.find(g => g.includes(i));
      el.style.left = (pos[i]*100) + '%';
      el.style.color = FLAG_HEXES[group[0]];      // 疊起來就讀成一支，用它收尾那一段的顏色
      el.classList.toggle('selected', i === selected);
      el.classList.toggle('stack-member', group.length > 1 && i !== group[0]);
      el.querySelector('.taglabel').textContent = fmtMD(flagDates[i]);
    });

    /* 軌道上面那排階段名。疊在一起的共用一塊，超過 MAX_STACK_ROWS 就分兩欄 ——
       往旁邊長，不要疊成一座塔。 */
    const MAX_STACK_ROWS = 4;
    els.stackLayer.innerHTML = '';
    const wraps = [];
    groups.forEach(group => {
      const wrap = document.createElement('div');
      wrap.className = 'stacklabel';
      wrap.style.left = (pos[group[0]]*100) + '%';
      const colCount = group.length > MAX_STACK_ROWS ? 2 : 1;
      const perCol = Math.ceil(group.length / colCount);
      for (let c = 0; c < colCount; c++){
        const col = document.createElement('div');
        col.className = 'col';
        group.slice(c*perCol, (c+1)*perCol).forEach(gi => col.appendChild(labelRow(gi)));
        wrap.appendChild(col);
      }
      els.stackLayer.appendChild(wrap);
      wraps.push({ el:wrap, pos:pos[group[0]] });
    });
    /* 貪心地往上疊：每一塊掉進「最下面那個已經讓開的列」，都擋住就再開一列。
       這樣保證兩塊永遠不會重疊 —— 固定兩列的年代，名字一長就疊在一起了。 */
    const GAP = 8, ROW_H = 34, rowRight = [];
    wraps.forEach(w => {
      const width = w.el.offsetWidth;
      const left = w.pos * els.stackLayer.offsetWidth - width/2;
      let row = 0;
      while (row < rowRight.length && left < rowRight[row] + GAP) row++;
      if (row === rowRight.length) rowRight.push(-Infinity);
      rowRight[row] = left + width;
      w.el.style.bottom = (row * ROW_H) + 'px';
    });

    syncDurRow();
  }

  /* ---- 拖旗子 ----
     週末沒有方塊，旗子也就不該停在那裡：拖到週末就退到前一個工作天。
     往前不往後 —— 期限提前趕得上，延後就是遲交。 */
  const snapWeekday = d => isWE(d) ? prevWork(d) : d;
  function setFlagDate(i, date){
    date = snapWeekday(atMid(date));
    const lo = firstValid(), hi = lastValid();
    if (date < lo) date = lo;
    if (date > hi) date = hi;          // 軸的盡頭是一面牆，不是推得動的東西
    flagDates[i] = date;
    /* 順序靠「把鄰居收攏到同一天」維持，不是把它們往外推 ——
       所以拖曳永遠不會把時程拉得比你放手的地方更長 */
    for (let j = i+1; j < N; j++){ if (flagDates[j] < flagDates[j-1]) flagDates[j] = flagDates[j-1]; else break; }
    for (let j = i-1; j >= 0; j--){ if (flagDates[j] > flagDates[j+1]) flagDates[j] = flagDates[j+1]; else break; }
  }
  /* 游標指著的是哪一天。週末在軸上照樣佔兩天的寬度，但旗子不能停在那裡 ——
     把週末的寬度分給兩邊（週六算週五、週日算週一），兩個方向都是 1.5 天，左右對稱。
     全部算給前面那個週五的話，週五拖到週一要走 2.5 天寬，同一個手勢突然變得很重。 */
  function nearestWorkday(d){
    const w = d.getDay();
    if (w === 6) return prevWork(d);
    if (w === 0) return nextWork(d);
    return d;
  }
  /* 旗子畫在「那一格的右緣」，所以四捨五入抓到的是最近的格線，減一格才是那一天本人 */
  function dateFromClientX(clientX){
    const r = els.track.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    return nearestWorkday(addDays(START, Math.max(0, Math.round(p * UNITS) - 1)));
  }

  function renderTags(){
    els.tagBox.querySelectorAll('.tag-chip').forEach(el => el.remove());
    tags.forEach((t,i) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.textContent = t;
      const x = document.createElement('b');
      x.textContent = '×';
      x.addEventListener('click', () => { tags.splice(i,1); renderTags(); });
      chip.appendChild(x);
      els.tagBox.insertBefore(chip, els.tagInput);
    });
    els.presetTags.querySelectorAll('.pt')
       .forEach(b => b.classList.toggle('on', tags.indexOf(b.textContent) >= 0));
  }
  const selectedType = () => els.typeBtns.querySelector('.type-btn.on').textContent;

  /* ---- 帶入：照過去某一檔開 ------------------------------------------------
     同一檔期年年在跑，版位怎麼切、每一塊放哪些品類多半是照抄上一次的 ——
     只帶天數、讓人對著上一次的版重切一遍，才是真的白工。所以帶入連版面一起帶。 */
  const IMP_TYPES = ['全部'].concat(DM_TYPES);
  const TOTAL_TOL = 2;              // 總長那個條件容許 ±2 個工作天
  let impTagChips = [], impTotal = null, impType = '全部';
  let impTagSel = 0, impTagShown = [];
  let impLayout = null;             // 帶到的版面：按「下一步」時才用得上
  let imp = null;                   // 這一張的 DOM，第一次開才抓

  const totalDurs = p => (p.durs || []).reduce((a,b) => a + (+b || 0), 0);
  /* 只列真的有人用過的標籤 —— 用一個沒人用的標籤去篩，篩出來一定是空的。
     內建的排前面，常用的就在你以為的位置。 */
  function allTags(){
    const used = new Set();
    plans.forEach(p => (p.tags || []).forEach(t => used.add(t)));
    return PRESET_TAGS.filter(t => used.has(t))
           .concat([...used].filter(t => PRESET_TAGS.indexOf(t) < 0));
  }

  /* 這一份切了幾塊。帶不帶得到版面是挑哪一份的關鍵 —— 有版位的那幾份才省得掉重切一次 */
  function planSegCount(p){
    const L = p && p.layout;
    if (!L) return 0;
    let n = 0;
    const walk = x => { if (!x) return; x.children ? x.children.forEach(walk) : n++; };
    walk(treeOf(L.front)); walk(treeOf(L.back));
    return n;
  }
  /* 舊檔期的 layout 可能還是兩段 HTML（行銷用更早的版本提交的）。
     開機時 normalizeLayout() 會把它轉成樹，但那是**存在資料庫裡的那一份**；
     這裡再擋一次，帶入才不會因為撿到一份沒轉過的就整個炸掉。 */
  function treeOf(side){
    if (typeof side === 'string') { try { return parseExportLayout(side); } catch (e){ return null; } }
    return side || null;
  }

  /* ⚠️ **只複製骨架。** 整棵樹直接 clone 會把上一檔挑好的貨、便利貼、走到第幾關
     連同格子本身一起搬過來 —— 那是別人一整季的工作，不是版型。
     blk() 會給全新的 id 和一份空的 sheet，這正是要的。
     （原本那支存的是 HTML 字串，天然不帶這些東西；改成樹之後就會帶了。） */
  function cloneSkeleton(node){
    if (!node) return null;
    if (!node.children){
      const groups = (node.groups || []).map(g => ({ name: g.name || '未命名', count: g.count || 0 }));
      return blk(node.name || '未命名',
                 groups.length ? groups : [{ name:'未命名', count:0 }],
                 node.size,
                 node.noMasthead ? { noMasthead:true } : null);
    }
    return { dir: node.dir, fold: !!node.fold, size: node.size,
             children: (node.children || []).map(cloneSkeleton) };
  }

  function impMatches(p){
    if (impType !== '全部' && p.type !== impType) return false;
    const tg = p.tags || [];
    if (!impTagChips.every(t => tg.indexOf(t) >= 0)) return false;
    if (impTotal != null && Math.abs(totalDurs(p) - impTotal) > TOTAL_TOL) return false;
    const q = imp.search.value.trim().toLowerCase();
    // 框裡只打數字＝那是還沒送出的「總長」，不是在搜名字
    if (q && !/^\d+$/.test(q) && (p.name || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }

  function renderImpPresets(){
    imp.presets.innerHTML = '';
    const list = allTags();
    if (!list.length){
      const e = document.createElement('span');
      e.style.cssText = 'font-size:14px;font-weight:700;color:var(--muted)';
      e.textContent = '（還沒有標籤）';
      imp.presets.appendChild(e);
      return;
    }
    list.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pt' + (impTagChips.indexOf(t) >= 0 ? ' on' : '');
      b.textContent = t;
      b.addEventListener('click', () => {
        const i = impTagChips.indexOf(t);
        if (i >= 0) impTagChips.splice(i,1); else impTagChips.push(t);
        renderImpChips(); renderImpResults();
      });
      imp.presets.appendChild(b);
    });
  }

  function renderImpChips(){
    imp.chips.innerHTML = '';
    impTagChips.forEach(t => {
      const c = document.createElement('span');
      c.className = 'pill tag';
      c.textContent = t;
      const x = document.createElement('b');
      x.textContent = '×';
      x.addEventListener('click', () => {
        impTagChips = impTagChips.filter(v => v !== t);
        renderImpChips(); renderImpResults();
      });
      c.appendChild(x);
      imp.chips.appendChild(c);
    });
    if (impTotal != null){
      const c = document.createElement('span');
      c.className = 'pill total';
      c.textContent = '總長 ' + impTotal + '天';
      const x = document.createElement('b');
      x.textContent = '×';
      x.addEventListener('click', () => { impTotal = null; renderImpChips(); renderImpResults(); });
      c.appendChild(x);
      imp.chips.appendChild(c);
    }
    renderImpPresets();          // 常用標籤那一排的 on 狀態跟著走
  }

  /* 打字時的標籤建議：跟現有的標籤前綴比對 */
  function renderImpTagMenu(){
    const q = imp.search.value.trim().toLowerCase();
    impTagShown = q ? allTags().filter(t => t.toLowerCase().indexOf(q) === 0 && impTagChips.indexOf(t) < 0) : [];
    if (!impTagShown.length){ imp.tagMenu.hidden = true; return; }
    if (impTagSel >= impTagShown.length) impTagSel = 0;
    imp.tagMenu.innerHTML = '';
    impTagShown.forEach((t,i) => {
      const o = document.createElement('div');
      o.className = 'opt' + (i === impTagSel ? ' sel' : '');
      o.textContent = '# ' + t;
      o.addEventListener('mousedown', e => { e.preventDefault(); addImpTag(t); });
      imp.tagMenu.appendChild(o);
    });
    imp.tagMenu.hidden = false;
  }
  function addImpTag(t){
    if (impTagChips.indexOf(t) < 0) impTagChips.push(t);
    imp.search.value = '';
    impTagSel = 0;
    imp.tagMenu.hidden = true;
    renderImpChips(); renderImpResults();
  }

  function renderImpResults(){
    /* 只列已經提交過的：草稿是別人還在切的半成品，照它開一份沒有意義。
       正在改的那一份自己也不列（改時程時帶入是收起來的，但保險） */
    const list = plans.filter(p => !isDraft(p) && p !== editingPlan).reverse().filter(impMatches);
    imp.count.textContent = '符合 ' + list.length + ' 筆';
    imp.results.innerHTML = '';
    if (!list.length){
      const e = document.createElement('div');
      e.className = 'imp-empty';
      e.textContent = '沒有符合的檔期，試著移除一些條件';
      const br = document.createElement('div');
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '清除全部條件';
      btn.addEventListener('click', resetImpFilters);
      br.appendChild(btn);
      e.appendChild(br);
      imp.results.appendChild(e);
      return;
    }
    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'imp-card';
      const r1 = document.createElement('div');
      r1.className = 'row1';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = p.name || '(未命名)';
      r1.appendChild(nm);
      const tp = document.createElement('span');
      tp.className = 'pill';
      tp.textContent = p.type;
      r1.appendChild(tp);
      (p.tags || []).forEach(t => {
        const g = document.createElement('span');
        g.className = 'pill tag' + (impTagChips.indexOf(t) >= 0 ? ' hit' : '');
        g.textContent = t;
        r1.appendChild(g);
      });
      const tt = document.createElement('span');
      tt.className = 'pill total';
      tt.textContent = '總長 ' + totalDurs(p) + ' 天';
      r1.appendChild(tt);
      const segs = planSegCount(p);
      const sg = document.createElement('span');
      sg.className = 'pill';
      sg.textContent = segs ? ('版位 ' + segs + ' 塊') : '沒有版面';
      r1.appendChild(sg);
      card.appendChild(r1);
      const d = document.createElement('div');
      d.className = 'durs';
      d.textContent = STAGES.map((st,i) => st + ((p.durs || [])[i] == null ? 0 : p.durs[i])).join('・');
      card.appendChild(d);
      card.addEventListener('click', () => importSettings(p));
      imp.results.appendChild(card);
    });
  }

  function resetImpFilters(){
    imp.search.value = '';
    impTagChips = []; impTotal = null; impType = '全部';
    imp.types.querySelectorAll('.type-btn').forEach((b,i) => b.classList.toggle('on', i === 0));
    imp.tagMenu.hidden = true;
    renderImpChips(); renderImpResults();
  }

  /** 把那一份的設定（類別／標籤／各階段天數）和版面搬進現在這張表。 */
  function importSettings(p){
    const btns = [].slice.call(els.typeBtns.querySelectorAll('.type-btn'));
    btns.forEach(b => b.classList.toggle('on', b.textContent === p.type));
    if (!btns.some(b => b.classList.contains('on'))) btns[0].classList.add('on');
    tags = (p.tags || []).slice(); renderTags();
    if (Array.isArray(p.durs)) flagsFromDurs(p.durs);
    fitTotalToFlags(); buildGrid(); render();   // 帶進來的時程自己算一次軸長
    const L = p.layout;
    impLayout = L ? { front: cloneSkeleton(treeOf(L.front)), back: cloneSkeleton(treeOf(L.back)) } : null;
    if (impLayout && !impLayout.front && !impLayout.back) impLayout = null;
    const segs = planSegCount(p);
    closeImport();
    toast('已帶入「' + (p.name || '檔案') + '」的設定'
          + (impLayout && segs ? ('，版位和品類（' + segs + ' 塊）在下一步') : ''), 'ok', 3000);
  }

  const closeImport = () => { imp.mask.classList.remove('on'); imp.tagMenu.hidden = true; };

  function buildImport(){
    imp = {
      mask: $('impMask'), search: $('impSearch'), tagMenu: $('impTagMenu'),
      chips: $('impChips'), presets: $('impPresets'), types: $('impTypes'),
      count: $('impCount'), results: $('impResults')
    };
    IMP_TYPES.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'type-btn' + (t === '全部' ? ' on' : '');
      b.textContent = t;
      b.addEventListener('click', () => {
        impType = t;
        imp.types.querySelectorAll('.type-btn').forEach(x => x.classList.toggle('on', x === b));
        renderImpResults();
      });
      imp.types.appendChild(b);
    });
    imp.search.addEventListener('input', () => { impTagSel = 0; renderImpTagMenu(); renderImpResults(); });
    imp.search.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' && impTagShown.length){
        e.preventDefault(); impTagSel = (impTagSel + 1) % impTagShown.length; renderImpTagMenu(); return;
      }
      if (e.key === 'ArrowUp' && impTagShown.length){
        e.preventDefault(); impTagSel = (impTagSel - 1 + impTagShown.length) % impTagShown.length; renderImpTagMenu(); return;
      }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const q = imp.search.value.trim();
      if (impTagShown.length){ addImpTag(impTagShown[impTagSel]); return; }   // 標籤優先
      if (/^\d+$/.test(q)){                                                  // 純數字＝總長
        impTotal = parseInt(q, 10);
        imp.search.value = '';
        renderImpChips(); renderImpResults();
      }
    });
    $('impCancel').addEventListener('click', closeImport);
    imp.mask.addEventListener('click', e => { if (e.target === imp.mask) closeImport(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && imp.mask.classList.contains('on')) closeImport();
    });
    $('impOpenBtn').addEventListener('click', () => {
      resetImpFilters();               // 每次都從乾淨的條件開始
      imp.mask.classList.add('on');
      imp.search.focus();
    });
  }

  /* ---- 只在第一次 open() 跑：抓 DOM、建旗子、掛事件 ---- */
  function build(){
    els = {
      name: $('nameInput'), start: $('startInput'), totalInput: $('totalInput'),
      typeBtns: $('typeBtns'), tagBox: $('tagBox'), tagInput: $('tagInput'),
      presetTags: $('presetTags'), durRow: $('durRow'), tlPanel: $('tlPanel'),
      bar: $('bar'), numberLabels: $('numberLabels'), track: $('track'),
      stackLayer: $('stackLayer'), title: $('planTitle'), next: $('planNextBtn')
    };

    DM_TYPES.forEach((t,i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'type-btn' + (i === 0 ? ' on' : '');
      b.textContent = t;
      els.typeBtns.appendChild(b);
    });
    els.typeBtns.addEventListener('click', e => {
      const b = e.target.closest('.type-btn');
      if (!b) return;
      els.typeBtns.querySelectorAll('.type-btn').forEach(x => x.classList.toggle('on', x === b));
    });

    PRESET_TAGS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pt'; b.textContent = t;
      b.addEventListener('click', () => {
        const i = tags.indexOf(t);
        if (i >= 0) tags.splice(i,1); else tags.push(t);
        renderTags();
      });
      els.presetTags.appendChild(b);
    });
    els.tagBox.addEventListener('click', () => els.tagInput.focus());
    els.tagInput.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        const v = els.tagInput.value.trim();
        if (v && tags.indexOf(v) < 0){ tags.push(v); renderTags(); }
        els.tagInput.value = '';
      } else if (e.key === 'Backspace' && els.tagInput.value === ''){
        tags.pop(); renderTags();
      }
    });

    for (let i = 0; i < N; i++){
      const el = document.createElement('div');
      el.className = 'flag';
      el.tabIndex = 0;
      el.dataset.index = i;
      el.innerHTML = '<div class="stem"></div><div class="handle"></div><div class="taglabel"></div>';
      els.track.appendChild(el);
      flagEls.push(el);
    }
    buildDurRow();

    els.track.addEventListener('pointerdown', e => {
      const flagEl = e.target.closest('.flag');
      if (!flagEl) return;
      const i = +flagEl.dataset.index;
      els.track.setPointerCapture(e.pointerId);
      /* 一支標記底下可能疊了好幾支：先等一下看往哪邊拖，再從那一頭剝一支下來 */
      const candidates = [];
      for (let k = 0; k < N; k++) if (+flagDates[k] === +flagDates[i]) candidates.push(k);
      if (candidates.length === 1) dragging = selected = i;
      else { pending = { candidates: candidates, startX: e.clientX }; selected = i; }
      render();
    });
    els.track.addEventListener('pointermove', e => {
      if (pending){
        const dx = e.clientX - pending.startX;
        if (Math.abs(dx) < 3) return;
        const c = pending.candidates;
        dragging = selected = dx > 0 ? c[c.length-1] : c[0];
        pending = null;
      }
      if (dragging < 0) return;
      setFlagDate(dragging, dateFromClientX(e.clientX));
      render();
    });
    const endDrag = () => { dragging = -1; pending = null; };
    els.track.addEventListener('pointerup', endDrag);
    els.track.addEventListener('pointercancel', endDrag);
    els.track.addEventListener('keydown', e => {
      const i = +(e.target.dataset ? e.target.dataset.index : NaN);
      if (Number.isNaN(i)) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
        e.preventDefault();
        selected = i;
        setFlagDate(i, e.key === 'ArrowRight' ? nextWork(flagDates[i]) : prevWork(flagDates[i]));
        render();
      }
    });

    els.totalInput.addEventListener('change', () => setTotal(parseInt(els.totalInput.value, 10)));
    // 滾輪橫向捲時間軸 —— 不必去拉那條捲軸
    const scroll = els.tlPanel.parentElement;
    scroll.addEventListener('wheel', e => {
      const amount = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (!amount || scroll.scrollWidth <= scroll.clientWidth) return;
      scroll.scrollLeft += amount;
      e.preventDefault();
    }, { passive: false });

    els.start.addEventListener('change', () => {
      if (!els.start.value){ els.start.value = toYMD(START); return; }
      const durs = dursFromFlags();
      START = parseYMD(els.start.value);
      flagsFromDurs(durs);
      fitTotalToFlags(); buildGrid(); render();   // 換了開始日就重算自己的軸長
    });

    $('planBackBtn').addEventListener('click', showList);
    els.next.addEventListener('click', save);
    buildImport();
  }

  /** 這張表現在是「開檔」還是「改時程」—— 標題和那顆鈕都要說得出來。 */
  function syncMode(){
    els.title.textContent = editingPlan ? '改時程' : '開一個新檔期';
    els.next.textContent  = editingPlan ? '儲存' : '下一步：切版';
    // 帶入是「照上一次的抄一份」—— 那是開新檔期才有的動作
    $('impOpenBtn').hidden = !!editingPlan;
  }

  /* 新開的檔期給一張**空白**的版：一面兩半，什麼都還沒填。
     不是 buildLayout() 那份四個版位的示範資料 —— 那是給 ?seed=1 看的，
     真的開檔期時冒出「刮鬍刀 14 支」只會讓人以為程式記錯了。 */
  function blankSide(){
    return { dir:'row', fold:true, size:null, children:[
      blk('未命名', [{ name:'未命名', count:0 }], 50),
      blk('未命名', [{ name:'未命名', count:0 }], null)
    ]};
  }

  function save(){
    const name = els.name.value.trim() || ('未命名檔期 ' + fmtMD(new Date()));
    /* 改的是已經開過的檔期：同一張表、同一條時間軸，只是存回去而不是往下開一張版。
       日期改的次數比想像多（印廠改期、檔期提前），為了改兩個天數重開一個檔期
       是最貴的做法。 */
    if (editingPlan){
      editingPlan.name  = name;
      editingPlan.type  = selectedType();
      editingPlan.tags  = tags.slice();
      editingPlan.start = toYMD(START);
      editingPlan.durs  = dursFromFlags();
      savePlans();
      const s = sync(); if (s) s.queueUpsert(editingPlan);
      const done = editingPlan;
      editingPlan = null;
      showList();
      toast('已更新「' + done.name + '」的時程', 'ok', 2400);
      return;
    }
    const plan = {
      id: 'p' + Date.now(),
      name: name, type: selectedType(), tags: tags.slice(),
      start: toYMD(START), durs: dursFromFlags(),
      submitted: false,               // 草稿：切完版按「提交給設計」才輪到別人看見
      // 帶入過就接著上一次的版位和品類改，沒帶入就是一張空白的版
      layout: impLayout && (impLayout.front || impLayout.back)
        ? { front: impLayout.front || blankSide(), back: impLayout.back || blankSide() }
        : { front: blankSide(), back: blankSide() }
    };
    plans.push(plan);
    savePlans();
    const s = sync(); if (s) s.queueUpsert(plan);
    openPlan(plan);                   // 直接進 總體 開始切版 —— 下一步本來就在那裡
    toast('版是空白的：用左邊的 ✂ 切分 切出版位，再用 ✏ 品類 填內容', 'info', 5200);
  }

  /** plan ＝ null 就是開一張新的；給了就是回頭改那一個檔期的時程。 */
  function open(plan){
    if (!els) build();               // 第一次才建：頂層執行是這支程式最常見的死法
    editingPlan = plan || null;
    impLayout = null;                // 上一次帶入的版面不要跟到這一張
    els.name.value = plan ? (plan.name || '') : '';
    tags = plan ? (plan.tags || []).slice() : [];
    renderTags();
    const type = plan ? plan.type : DM_TYPES[0];
    const btns = [].slice.call(els.typeBtns.querySelectorAll('.type-btn'));
    btns.forEach(b => b.classList.toggle('on', b.textContent === type));
    if (!btns.some(b => b.classList.contains('on'))) btns[0].classList.add('on');
    START = plan ? parseYMD(plan.start) : atMid(new Date());
    els.start.value = toYMD(START);
    flagsFromDurs(((plan && plan.durs) || DEFAULT_DURS).slice());
    selected = 0;
    syncMode();
    fitTotalToFlags();
    showPlanForm();                  // 要先看得見才量得到寬度
    buildGrid(); render();
  }

  return { open: open };
})();

/* the countdown pills only exist on the 檔期 list, so the timer does nothing
   at all while a 檔期 is open in the editor */
setInterval(() => {
  if (currentPlan || !planList.offsetParent) return;
  planList.querySelectorAll('.pill.count').forEach(tickPill);
}, 30000);

/* ==========================================================================
   IMPORT — a 落版單 export is the plan as JSON (older ones wrap it in HTML),
   carrying its board layout as split-container markup. Both are converted
   here: the plan becomes a timeline, the markup becomes this app's layout tree.
   ========================================================================== */

const pctOf = flex => {
  if (!flex || /^1\s+1\s+0/.test(flex)) return null;      // the fill child
  const m = /calc\(([\d.]+)%/.exec(flex) || /([\d.]+)%/.exec(flex);
  return m ? parseFloat(m[1]) : null;
};

function parseLayoutNode(el){
  const dir = (el.style.flexDirection === 'column') ? 'col' : 'row';
  const kids = [];
  let fold = false;
  [...el.children].forEach(c => {
    if (c.classList.contains('fold')){ fold = true; return; }
    if (c.classList.contains('resizer')) return;
    kids.push(parseLayoutChild(c));
  });
  return { dir, fold, size: null, children: kids };
}
function parseLayoutChild(el){
  const size = pctOf(el.style.flex);
  const inner = el.querySelector(':scope > .split-container');
  if (inner && !el.classList.contains('window-node')){
    const node = parseLayoutNode(inner);
    node.size = size;
    return node;
  }
  let items = [];
  try { items = JSON.parse(el.getAttribute('data-items') || '[]'); } catch (e) {}
  const groups = items.length
    ? items.map(i => ({ name: i.cat || '未命名', count: i.qty == null ? 0 : i.qty }))
    : [{ name: '未命名', count: 0 }];
  const name = groups.map(g => g.name).join('・');
  return blk(name, groups, size, groups[0].name === '無刊頭' ? { noMasthead: true } : null);
}
function parseExportLayout(html){
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const root = wrap.querySelector('.split-container');
  return root ? parseLayoutNode(root) : null;
}

/* 更早以前，行銷那一支存的 plan.layout 是兩段 HTML（直接存 wsFront.innerHTML），
   這支要的是樹。那一支已經併進來了，但資料庫裡還躺著那時候提交的檔期。
   以前只有「從檔案帶入」會轉；現在兩邊共用同一份資料，所以改成誰先開這個檔期誰就轉，
   轉完存回去 —— 之後不管誰拿到的都是樹，這個函式就不再做事了。
   沒轉的話：檔期列表會安靜地算錯版位數，一按開啟就 sheetOf() 整頁死掉。 */
function normalizeLayout(plan){
  const L = plan && plan.layout;
  if (!L || typeof L.front !== 'string') return false;   // 已經是樹，或還沒切版
  const front = parseExportLayout(L.front);
  const back  = parseExportLayout(L.back);
  if (!front || !back) return false;                     // 認不得就別動，維持原樣
  plan.layout = { front, back };
  return true;
}


/* 行銷現在匯出的是純 .json；在那之前出的是一張 HTML 落版單，同一份資料夾在
   <script id="plandata"> 裡面。欄位兩邊一模一樣，只是外面那層裝飾沒了 ——
   舊檔還躺在人家的下載資料夾裡，所以兩種都收。 */
function planFromText(text){
  text = text.trim();
  if (text[0] === '{') return JSON.parse(text);
  const tag = new DOMParser().parseFromString(text, 'text/html').getElementById('plandata');
  if (!tag) throw new Error('no plandata');
  return JSON.parse(tag.textContent);
}

function importFiles(fileList){
  const files = [...fileList];
  let added = 0, failed = 0, pending = files.length;
  const imported = [];
  if (!pending) return;

  const finish = () => {
    savePlans();
    renderPlans();
    // 從檔案帶入的檔期也要上去，不然只有這台機器看得到
    const s = sync();
    if (s) { imported.forEach(p => s.queueUpsert(p)); }
    if (failed && added) toast(`匯入完成：成功 ${added} 個，失敗 ${failed} 個（讀不到檔期資料）`, 'warn', 3600);
    else if (failed)     toast(`匯入失敗 ${failed} 個檔案（讀不到檔期資料）`, 'warn', 3600);
    else                 toast(`已匯入 ${added} 個檔期`, 'ok');
  };

  files.forEach(file => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = planFromText(String(fr.result));
        if (!d.start || !Array.isArray(d.durs)) throw new Error('bad plandata');

        const plan = {
          id: d.id || ('imp-' + Date.now() + '-' + added),
          name: d.name || file.name.replace(/\.(json|html?)$/i, ''),
          type: d.type || '未指定', tags: d.tags || [],
          start: d.start, durs: d.durs
        };
        // carry the sheet's real board layout across, when it has one
        if (d.layout && d.layout.front && d.layout.back){
          const front = parseExportLayout(d.layout.front);
          const back  = parseExportLayout(d.layout.back);
          if (front && back) plan.layout = { front, back };
        }
        if (d.guides) plan.guides = d.guides;      // 參考線 travel with the plan
        const at = plans.findIndex(pl => pl.id === plan.id);
        if (at >= 0){ plan.layout = plan.layout || plans[at].layout; plans[at] = plan; }
        else plans.push(plan);
        imported.push(plan);
        added++;
      } catch (err){ failed++; }
      if (--pending === 0) finish();
    };
    fr.onerror = () => { failed++; if (--pending === 0) finish(); };
    fr.readAsText(file);
  });
}

/* 測試用：所有東西都在 localStorage 這幾把鑰匙底下，一起拿掉就等於重灌。
   會問一次 —— 這一按是救不回來的。 */
document.getElementById('wipeBtn').addEventListener('click', async () => {
  const n = Array.isArray(plans) ? plans.length : 0;
  const ok = await modalConfirm({
    title: '清空資料',
    body: `會刪掉這台瀏覽器上的 ${n} 個檔期，連同 PM 名單和身分設定，而且救不回來。`
        + '（別人電腦上的資料不受影響。）'
        /* 接了後端之後這顆按鈕只清本機，重新整理又會從 Supabase 拉回來 ——
           不講清楚會被當成壞掉。真的要全刪要去 Supabase 那邊。 */
        + (sync() ? '共用資料庫上的檔期不會被清掉，重新整理會再拉回來。' : '')
        + '確定要清掉嗎？',
    ok: '全部清掉', cancel: '取消', danger: true
  });
  if (!ok) return;
  [LS_KEY, PM_KEY, PM_OWN_KEY, PM_AT_KEY, USER_KEY, USER_AT_KEY].forEach(k => {
    try { localStorage.removeItem(k); } catch (e){}
  });
  location.reload();
});
