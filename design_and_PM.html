     to the cell array on release. */
  if (cellDrag){
    const hit = resolveTarget(cellDrag.rects, e.clientX, e.clientY);
    const target = hit && hit.el;

    clearDropFeedback();

    if (!target || target === cellDrag.cell){
      cellDrag.mode = null; cellDrag.target = null;
      return;
    }
    // clamped: a pointer in the gap sits outside the card, which should still
    // read as "at that edge" rather than falling off the scale
    const rel = Math.max(0, Math.min(1, (e.clientX - hit.l) / hit.w));

    /* The middle of a card is its own target: land there and the two cards
       trade places, keeping every other card put. The outer thirds still
       insert, so re-ordering a run of cards works as before. */
    if (rel > SWAP_BAND && rel < 1 - SWAP_BAND){
      cellDrag.mode = 'swap'; cellDrag.target = target;
      target.classList.add('cell-target');
      highlighted = target;
      return;
    }
    cellDrag.mode = 'insert'; cellDrag.target = target;
    cellDrag.before = rel <= 0.5;          // whichever side of the card is nearer
    showDropLine(target, cellDrag.before);
  }
});

function endRowCellDrag(e){
  if (activeTab !== 'sheet' && !rowDrag && !cellDrag) return;
  if (rowDrag){
    const row = rowDrag.row;
    slideHome(row);                             // ease into the slot, not snap
    /* .dragging carries the z-index, so it has to outlive the slide or the row
       would duck under its neighbours on the way down. Bail out if the same
       row has been grabbed again in the meantime. */
    setTimeout(() => { if (!rowDrag || rowDrag.row !== row) row.classList.remove('dragging'); },
               noMotion ? 0 : SLIDE_MS);
    rowDrag = null;
    document.body.style.userSelect = '';
    syncOrderFromDOM();
    commitAction();
  }
  if (cellDrag){
    const { cell, mode, target, before } = cellDrag;
    cell.classList.remove('cell-dragging');
    clearDropFeedback();
    document.body.style.userSelect = '';
    cellDrag = null;

    // commit the intent previewed during the drag
    const sh = sheetOf(activeBlock);
    const from = sh.cells.findIndex(c => c.id === cell.dataset.cellId);
    if (mode && target && from >= 0){
      const toId = target.dataset.cellId;
      const to = sh.cells.findIndex(c => c.id === toId);
      if (to >= 0){
        const was = captureCells();          // where every card sits right now
        if (mode === 'swap'){
          // straight trade — nothing else on the sheet shifts
          [sh.cells[from], sh.cells[to]] = [sh.cells[to], sh.cells[from]];
        } else {
          const [moved] = sh.cells.splice(from, 1);
          // re-find after the removal so the index stays valid
          let idx = sh.cells.findIndex(c => c.id === toId);
          if (!before) idx += 1;
          sh.cells.splice(idx, 0, moved);
        }
        /* 拼板 走它自己的重畫，畫布和貼紙才會跟著回來。那邊也不播滑動動畫：
           格子裡是 iframe，一格一格滑過去既貴、又會讓畫布在半路重載。 */
        if (activeTab === 'board') redrawSheet();
        else { renderGrid(activeBlock); playCells(was); }
        commitAction();
      }
    }
  }
}
boardEl.addEventListener('pointerup', endRowCellDrag);
boardEl.addEventListener('pointercancel', endRowCellDrag);

/* ==========================================================================
   TOOLS (工具 rail)
   搬移 — drag a card onto the MIDDLE of another and the two trade places
          (blockswap.html's model); drop on either outer third and it inserts
          at that boundary instead. The insert zones of two neighbours meet
          across the gap between them, so the whole space between cards is one
          continuous target with no dead spot, marked by a single line down the
          gap. Swapping matters here because the cards carry typed copy — it
          moves one product without pushing every card after it along.
   縮放 — wheel scales the grid. Zoom is applied to the COMPUTED layout
          (widths/heights/type), not as a CSS transform, so every pointer
          coordinate stays in real px and the drag maths needs no scale term.
   選取 — drags off; for reading the grid without disturbing it.
   ========================================================================== */

/* 上限放到 6 倍：拼板 要看清楚一格裡的價格和 SKU，2.5 倍根本不夠近 */
/* 上限 6 → 14：拼一格的時候常常要湊很近看價格對不對齊、SKU 有沒有落在框裡，
   六倍就到頂了。縮放只是把畫面拉近看，不會改變印出來的東西，所以放寬沒有代價。 */
const ZOOM_MIN = 0.4, ZOOM_MAX = 14, ZOOM_STEP = 1.12;
/* outer third of a card inserts, the middle third swaps */
const SWAP_BAND = 1 / 3;
let activeTool = 'edit';     // 預設是「在格子裡搬零件」；搬移要鎖定後才出現
let sheetZoom = 1;

const zoomVal = document.getElementById('zoomVal');

/* the blue insert indicator, re-attached by renderGrid on every rebuild */
const dropLine = document.createElement('div');
dropLine.className = 'drop-line';

const prevCell = el => { let p = el.previousElementSibling;
  while (p && !p.classList.contains('cell')) p = p.previousElementSibling; return p; };
const nextCell = el => { let n = el.nextElementSibling;
  while (n && !n.classList.contains('cell')) n = n.nextElementSibling; return n; };

/* Nothing on the board moves for the whole of a card drag, so every card is
   measured once at pointerdown. Hit-testing then costs arithmetic instead of
   an elementFromPoint plus a getBoundingClientRect per card per pointermove,
   each of which forces the browser to flush layout. */
function measureCells(){
  const out = [];
  boardEl.querySelectorAll('.cell').forEach(el => {
    const r = el.getBoundingClientRect();
    out.push({ el, l: r.left, t: r.top, rt: r.right, b: r.bottom, w: r.width });
  });
  return out;
}

/** Nearest card to the pointer — so the gaps between cards are never dead. */
function resolveTarget(rects, x, y){
  let best = null, bestD = Infinity;
  for (const c of rects){
    // inside the card: an exact hit, nothing can beat it
    if (x >= c.l && x <= c.rt && y >= c.t && y <= c.b) return c;
    const dx = x < c.l ? c.l - x : x > c.rt ? x - c.rt : 0;
    const dy = y < c.t ? c.t - y : y > c.b ? y - c.b : 0;
    const d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = c; }
  }
  return best;
}

/* One line per boundary: drawn down the MIDDLE of the gap, so approaching
   from either neighbouring card marks the same insertion point. */
function showDropLine(target, before){
  const br = boardEl.getBoundingClientRect();
  const r = target.getBoundingClientRect();
  const nb = before ? prevCell(target) : nextCell(target);

  let x;
  if (nb){
    const nr = nb.getBoundingClientRect();
    x = before ? (nr.right + r.left) / 2 : (r.right + nr.left) / 2;
  } else {
    x = before ? r.left - 3 : r.right + 3;      // outer edge of the row
  }

  const rowEl = target.closest('.row');
  const rr = rowEl ? rowEl.getBoundingClientRect() : r;
  // appearing from nowhere must not animate; moving between boundaries should
  dropLine.style.transition = dropLine.style.display === 'block' ? '' : 'none';
  dropLine.style.display = 'block';
  dropLine.style.left = (x - br.left - 1.5) + 'px';
  dropLine.style.top = (rr.top - br.top) + 'px';
  dropLine.style.height = rr.height + 'px';
}
/* At most one card is ever highlighted, so hold onto it rather than sweeping
   the whole board for the class on every pointermove. */
let highlighted = null;
function clearDropFeedback(){
  dropLine.style.display = 'none';
  if (highlighted){ highlighted.classList.remove('cell-target'); highlighted = null; }
}

/* Each hint is the same three zones so the eye always lands in the same place:
   which tool it is, the single thing it does, then at most two keys. Anything
   rarer stays in the shortcut table at the top of this script instead of
   crowding the bar — the old one-line-of-everything version was unreadable. */
const hint = (ico, name, key, main, keys) =>
  `<span class="ico">${ico}</span>` +
  `<span class="hint-name">${name}<kbd>${key}</kbd></span>` +
  `<span class="hint-main">${main}</span>` +
  `<span class="hint-keys">${keys.join('')}</span>`;

const HINTS = {
  move: hint('⇄', '搬移', 'V',
    '拖曳卡片：放在<b>中央</b>兩張互換，放在<b>邊緣</b>插入',
    ['<span><kbd>按住空白鍵</kbd>拖曳移動畫面</span>', '<span><kbd>Esc</kbd>取消</span>']),

  edit: hint('✥', '選零件', 'S',
    '在格子裡選、拖<b>品名／價格／商品圖</b>；拖格子以外的空地移動畫面',
    ['<span><kbd>Alt</kbd>這一下不要吸</span>']),

  pan: hint('✋', '拖畫面', 'D',
    '拖<b>哪裡都是移動畫面</b>，包括格子上：不怕碰到格子裡的東西',
    ['<span><kbd>⌘/Ctrl+0</kbd>符合視窗</span>']),



  /* 這一個不是工具，是開關（見 .tgl）—— 但滑過去一樣要講得出自己在做什麼 */
  gridsnap: hint('⊞', '顯示格線', 'G',
    '開著就一直鋪一層<b>格線</b>給你看，關著就沒有。它<b>只是尺</b>，零件不會被吸到線上',
    ['<span><kbd>Alt</kbd>連對齊線也不吸</span>'])
};

/* 滑過工具才出現的小提示，貼在那一顆旁邊。圖示只有一個符號，猜錯的代價是
   「換了工具、動到東西、再換回來」—— 所以它要在你按下去之前就講完。
   用自己的 tooltip 不用瀏覽器的 title：title 要等一秒才出來，而且排不進
   快捷鍵那一行。 */
function showHint(name, anchor){
  const el = document.getElementById('toolHint');
  if (!name || !HINTS[name]){ el.style.display = 'none'; return; }
  el.innerHTML = HINTS[name];
  el.style.display = 'block';
  /* 先量再擺：內容是剛剛才換的，寬高要重新問一次。
     擺在工具的右邊、垂直對齊它；貼到視窗邊就往回收。 */
  const a = anchor.getBoundingClientRect(), r = el.getBoundingClientRect();
  let x = a.right + 10;
  if (x + r.width > innerWidth - 8) x = Math.max(8, a.left - r.width - 10);
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(Math.min(Math.max(8, a.top + a.height / 2 - r.height / 2),
                                      innerHeight - r.height - 8)) + 'px';
  el.classList.remove('pop');
  void el.offsetWidth;                 // restart the animation
  el.classList.add('pop');
  syncZoomHint();
}
function hideHint(){ document.getElementById('toolHint').style.display = 'none'; }

/* 綁在工具列上（事件委派），不是綁在每一顆按鈕上 —— 按鈕會被 syncTools 顯示／隱藏，
   一顆一顆綁的話，之後多一顆工具就多一個「忘記綁」的機會。 */
const toolRailEl = document.getElementById('toolRail');
toolRailEl.addEventListener('mouseover', e => {
  const b = e.target.closest && e.target.closest('.tool,#snapBtn');
  if (!b) return;
  showHint(b.id === 'snapBtn' ? 'gridsnap' : b.dataset.tool, b);
});
toolRailEl.addEventListener('mouseout', e => {
  const b = e.target.closest && e.target.closest('.tool,#snapBtn');
  if (b && !(e.relatedTarget && b.contains(e.relatedTarget))) hideHint();
});
toolRailEl.addEventListener('mouseleave', hideHint);
// 換了工具就把提示收起來：那一刻你已經知道自己拿了什麼，留著只會擋住版面
document.addEventListener('pointerdown', hideHint, true);

function syncZoomHint(){
  const z = document.getElementById('hintZoom');
  if (z) z.textContent = Math.round(sheetZoom * 100) + '%';
}

/* 搬移 only makes sense once the rows are settled. PS greys out a tool that
   cannot be used rather than removing it, so the button stays put and says
   why it is unavailable. */
function syncTools(){
  const tool = n => document.querySelector(`.tool[data-tool="${n}"]`);
  const moveBtn = tool('move');
  /* 搬移一直都在。以前要「確認列排列」之後才開得起來 —— 那顆鈕現在只剩「送給 PM」，
     不再是一道把版面凍住的門，工具就沒有理由跟著它開關。 */
  if (moveBtn){
    moveBtn.disabled = false;
    moveBtn.style.display = '';
    moveBtn.title = '搬移 (V)：拖到卡片中央＝交換，拖到邊緣＝插入';
  }
  /* 工具列不因身分收起來。收過一版（行銷在 拼板 整條藏掉），後來收回：
     少一半的按鈕會讓人以為是壞了或載不完全，而「這一下做不做得到」本來就有
     擋在動作那一層（開格子、蓋章、貼紙、畫布裡的零件都各自問過身分了）。 */
  const rail = document.getElementById('toolRail');
  if (rail) rail.style.display = '';
}

/* ==========================================================================
   整格複製（照 cell_clipboard_demo 那支的做法：一格就是一份東西）
   同一支商品常常要在版上出現好幾次。點一格、Ctrl+C，再點另一格、Ctrl+V，
   品名和拼好的內容一起過去 —— 貼紙不跟，那是留言，不是版面的一部分。
   ========================================================================== */

const cellById = id => (activeBlock ? (sheetOf(activeBlock).cells || []) : [])
  .find(c => String(c.id) === String(id));

function setTool(name){
  activeTool = name;
  /* 只認 data-tool 那幾顆：總體 那條小工具列長得一樣（同一個 .tool），
     但它是另一組模式（data-ttool），掃到它會把兩條工具列的亮法攪在一起。 */
  document.querySelectorAll('.tool[data-tool]').forEach(t =>
    t.classList.toggle('active', t.dataset.tool === name));
  sheetMainEl.classList.toggle('tool-zoom', name === 'pan');
  sheetMainEl.classList.toggle('tool-move', name === 'move');
  /* 拼板 那一層平常關著滑鼠（只留格子當入口）。拿起會動到版面的工具就把整張版
     還給滑鼠。用 getElementById 不用上面那個 const boardOv —— 那個宣告在這個
     函式下面，開機時 setTool 會比它早跑到。 */
  const ov = document.getElementById('boardOverview');
  if (ov) ov.classList.toggle('tooling', name !== 'edit');
}
document.querySelectorAll('.tool[data-tool]').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool)));

/* ==========================================================================
   ZOOM — one path for the wheel, the keyboard and the 縮放 tool's clicks
   ========================================================================== */

/** 重畫這張版。在 拼板 時要走 拼板 那條路，畫布和貼紙才會跟著回來。 */
function redrawSheet(){
  if (activeTab === 'board') reflowBoard();
  else renderGrid(activeBlock);
}

/** Apply a new zoom, keeping the point under (cx,cy) where it is. Client
    coords; omit them and the centre of the pane is held instead. */
/* 縮放要「釘住游標下那一點」。本來的算法把縮放當成「以捲動原點為中心的等比例放大」
   （scrollLeft = px*k - ax），但這裡兩個前提都不成立：#sheetMain 四周有一大圈
   padding（30vh／40%，見 centreSheet），而且版面比視窗窄的時候是**置中**的 ——
   版面的左上角會跟著大小移動，不是釘在原點。所以那個模型算出來的捲動量是錯的，
   看起來就是「一縮放整張版就跳到中間」。

   改成量出來再修正：先記下游標落在版面的哪一個比例位置（0～1），重畫之後量那一點
   現在畫在哪裡，差多少就捲多少。不必假設任何模型 —— padding、置中、reflow
   全部自動成立。 */
function zoomKeepPoint(clientX, clientY, redraw){
  const r0 = boardEl.getBoundingClientRect();
  const fx = r0.width  ? (clientX - r0.left) / r0.width  : .5;
  const fy = r0.height ? (clientY - r0.top)  / r0.height : .5;
  redraw();
  const r1 = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (r1.left + fx * r1.width)  - clientX;
  sheetMainEl.scrollTop  += (r1.top  + fy * r1.height) - clientY;
}

/* ---- 滾輪縮放：把游標指的那一塊帶到眼前 ---------------------------------
   來歷和量測見 zoom-at-cursor-demo.html。純粹釘在游標下（一般地圖那種）在這裡不夠
   用：指著右下角那一格滾，它就一路在右下角長大，看得到卻永遠沒被端到面前。所以每滾
   一發除了放大，還把目標往視窗中央收 ZOOM_PULL。

   但「往中央帶」會讓目標從游標底下溜走，於是下一發滾輪再讀一次游標，讀到的已經是
   滑過來的別人 —— 換它被帶去中央，再換下一個。手明明沒動，版面卻一路橫著爬，停不
   下來（示範上量過：連滾 16 下，錨點從第 17 格滑進格線縫再跳到隔壁格，捲動量
   128→3841 一路沒收斂）。所以錨點在**手勢的第一發就鎖住**，之後每一發都拉同一個
   點，它才會愈走愈靠中間然後定住。手停一下（GESTURE_MS）或游標真的移動了
   （MOVE_TOL）才重新挑。 */
const ZOOM_PULL = .35, ZOOM_GESTURE_MS = 500, ZOOM_MOVE_TOL = 6;
let zLatch = null, zLatchTime = 0, zLatchCx = 0, zLatchCy = 0;

/* 錨點記的是「佔版面的幾成」，不是 client 座標 —— 版面一縮放，同一個 client 座標
   底下就換成別的東西了，下一發根本對不回來。比例縮放前後不變，正好當錨。 */
function zoomLatch(clientX, clientY){
  const now = performance.now();
  const moved = Math.hypot(clientX - zLatchCx, clientY - zLatchCy) > ZOOM_MOVE_TOL;
  if (!zLatch || moved || now - zLatchTime > ZOOM_GESTURE_MS){
    const r = boardEl.getBoundingClientRect();
    zLatch = { fx: r.width  ? (clientX - r.left) / r.width  : .5,
               fy: r.height ? (clientY - r.top)  / r.height : .5 };
  }
  zLatchTime = now; zLatchCx = clientX; zLatchCy = clientY;
  return zLatch;
}

/* 滾輪縮放走這一條（鍵盤 ＋／− 不走：沒有游標就沒有「指著誰」，setZoom 照舊釘中央）。
   redraw 由呼叫端給 —— 落版 是 renderGrid、拼板 是 reflowBoard。 */
function zoomWheelTo(next, clientX, clientY, redraw){
  const from = sheetZoom;
  const to = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
  if (to === from) return;

  const L = zoomLatch(clientX, clientY);
  const r0 = boardEl.getBoundingClientRect();
  const nowX = r0.left + L.fx * r0.width, nowY = r0.top + L.fy * r0.height;

  /* 放大才往中央帶；縮小是「退遠一點看全部」，再往中央拉只會把畫面拖著跑。 */
  const vr = sheetMainEl.getBoundingClientRect();
  const k = to > from ? ZOOM_PULL : 0;
  const destX = nowX + (vr.left + vr.width  / 2 - nowX) * k;
  const destY = nowY + (vr.top  + vr.height / 2 - nowY) * k;

  sheetZoom = to;
  redraw();
  // 重畫之後量那一點現在畫在哪，差多少就捲多少（同 zoomKeepPoint，只是終點換成 dest）
  const r1 = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (r1.left + L.fx * r1.width)  - destX;
  sheetMainEl.scrollTop  += (r1.top  + L.fy * r1.height) - destY;
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
}

function setZoom(next, cx, cy){
  if (!activeBlock) return;
  const from = sheetZoom;
  const to = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
  if (to === from) return;
  sheetZoom = to;

  /* 沒帶座標進來（鍵盤 ＋／−）就以視窗中央當那一點 */
  const r = sheetMainEl.getBoundingClientRect();
  zoomKeepPoint(cx == null ? r.left + r.width / 2 : cx,
                cy == null ? r.top + r.height / 2 : cy,
                redrawSheet);
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
  syncZoomHint();
}

/* 把版面挪到畫布正中間。#sheetMain 四周留了很大一圈 padding（30vh／40%）讓人
   可以把版面拖到旁邊看，所以捲到 0,0 是停在那圈留白上，不是停在版面上 ——
   要置中只能量出來：兩個中心點差多少，就捲多少。 */
function centreSheet(){
  const pr = sheetMainEl.getBoundingClientRect();
  const br = boardEl.getBoundingClientRect();
  sheetMainEl.scrollLeft += (br.left + br.width  / 2) - (pr.left + pr.width  / 2);
  sheetMainEl.scrollTop  += (br.top  + br.height / 2) - (pr.top  + pr.height / 2);
}

/** Ctrl/Cmd+0 — shrink until the whole 版位 is inside the pane, then centre it.
    quiet＝換版位時自己跑的那一次，不用每次都跳一個提示出來。 */
function zoomToFit(quiet){
  if (!activeBlock) return;
  // measure the 100% layout, then render once at whatever ratio fits it
  sheetZoom = 1;
  redrawSheet();
  const availW = sheetMainEl.clientWidth - 12;
  const availH = sheetMainEl.clientHeight - blockHead.offsetHeight - 34;
  const w = boardEl.scrollWidth, h = boardEl.scrollHeight;
  /* 取小的那一個＝比較擠的那一邊剛好進得來，長的那一邊自然也就進得來 */
  const k = (w > 0 && h > 0) ? Math.min(availW / w, availH / h) : 1;

  sheetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, k));
  redrawSheet();
  centreSheet();
  zoomVal.textContent = Math.round(sheetZoom * 100) + '%';
  syncZoomHint();
  if (!quiet) toast(`符合視窗 ${Math.round(sheetZoom * 100)}%`, 'info', 1400);
}

/* A wheel fires far faster than the screen repaints, so the handler only does
   arithmetic and the actual re-layout happens once per frame. */
let zoomFrame = 0, zoomAnchor = null, zoomTo = 0;

/* 滾輪就是縮放 — 跟 拼板 同一套手感，不必先切 縮放 工具。
   在 拼板 時這張版是借過去的，那邊有自己的滾輪處理，這裡就別再算一次。 */
sheetMainEl.addEventListener('wheel', e => {
  if (!activeBlock || activeTab === 'board') return;
  e.preventDefault();

  /* 倍率先累起來、下一幀才重畫。累的是 zoomTo 不是 sheetZoom —— 中途改掉 sheetZoom
     的話，這一幀還沒重畫，畫面和數字就已經對不上了。 */
  const base = zoomTo || sheetZoom;
  const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX,
    base * (e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP)));
  if (next === base) return;
  zoomTo = next;

  /* 一連好幾發滾輪合成一次重畫；「游標在哪」記第一發那一下。
     真正的釘點交給 zoomWheelTo（量出來再修正）—— 這裡本來也是那個
     以捲動原點為中心的模型，量到過縮放一次就跑掉 59×38px。 */
  if (!zoomAnchor) zoomAnchor = { cx: e.clientX, cy: e.clientY };

  if (!zoomFrame) zoomFrame = requestAnimationFrame(() => {
    zoomFrame = 0;
    const { cx, cy } = zoomAnchor;
    zoomAnchor = null;
    const to = zoomTo; zoomTo = 0;
    zoomWheelTo(to, cx, cy, () => renderGrid(activeBlock));
    syncZoomHint();
  });
}, { passive: false });

/* ==========================================================================
   手形工具 — hold Space to pan (PS's single most ingrained habit)
   The tool is temporary: it borrows the pointer for as long as the key is
   down and hands it straight back on release.
   ========================================================================== */

let handMode = false, handPrevTool = null, panning = null;

function setHandMode(on){
  if (on === handMode) return;
  handMode = on;
  sheetMainEl.classList.toggle('tool-hand', on);
  if (on){
    handPrevTool = activeTool;
  } else {
    sheetMainEl.classList.remove('panning');
    panning = null;
    handPrevTool = null;
  }
}

/* 縮放 工具就是「看版面」的工具：滾輪縮放，按著拖就移動畫面。
   空白鍵的手形照舊，兩個共用同一套平移。 */
sheetMainEl.addEventListener('pointerdown', e => {
  // 落版 的工具（縮放／手形）不該管到拼板 —— 那一頁自己有一套平移
  if (activeTab !== 'sheet') return;
  /* ⋮⋮ 和刊頭是「抓著這個東西」，不是「抓著畫面」。
     版位標題那一行也是：那裡的按鈕和欄位是拿來按的，不是拿來拖畫面的
     —— 平移在捕獲階段就把事件吃掉了，不放行的話 ＋刊頭 永遠按不到。 */
  if (!handMode && e.target.closest
      && e.target.closest('.grip,.masthead,.mh-zone,#blockHead,button,input,select,textarea')) return;

  /* 移動畫面不是某一個工具的專利：不管手上拿著什麼，拖空白處都是移動畫面。
     差別只在卡片身上 ——
       看版／空白鍵／中鍵：整片都能拖，卡片也一樣，這個工具本來就碰不到東西
       搬移：卡片是要拖去換位置的，這一下不歸平移
       輸入／複製：先不吃掉，手沒動＝點卡片，手一動＝拖畫面（見 pointermove） */
  const free = handMode || e.button === 1 || activeTool === 'pan';
  const onCell = e.target.closest && e.target.closest('.cell');
  if (!free && onCell && activeTool === 'move') return;

  panning = { x: e.clientX, y: e.clientY,
              left: sheetMainEl.scrollLeft, top: sheetMainEl.scrollTop,
              pending: !free && !!onCell };
  if (panning.pending) return;
  e.preventDefault();
  e.stopPropagation();
  sheetMainEl.classList.add('panning');
  try { sheetMainEl.setPointerCapture(e.pointerId); } catch (err) {}
}, true);

sheetMainEl.addEventListener('pointermove', e => {
  if (!panning) return;
  const dx = e.clientX - panning.x, dy = e.clientY - panning.y;
  /* 從卡片上起手的：超過幾 px 才算拖畫面。一旦算數了就把游標和選字收掉，
     不然拖出來的會是一條反白的字。 */
  if (panning.pending){
    if (Math.abs(dx) + Math.abs(dy) < 5) return;
    panning.pending = false;
    sheetMainEl.classList.add('panning');
    document.body.style.userSelect = 'none';
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  // drag right and the sheet follows the hand, so scroll goes the other way
  sheetMainEl.scrollLeft = panning.left - dx;
  sheetMainEl.scrollTop  = panning.top  - dy;
});

function endPan(){
  if (!panning) return;
  panning = null;
  sheetMainEl.classList.remove('panning');
  document.body.style.userSelect = '';
}
sheetMainEl.addEventListener('pointerup', endPan);
sheetMainEl.addEventListener('pointercancel', endPan);

/* ==========================================================================
   KEYBOARD — see the shortcut table at the top of this script
   ========================================================================== */

/** True while the caret is somewhere the keystroke belongs to the user. */
function typingInField(){
  const el = document.activeElement;
  if (!el) return false;
  return el.isContentEditable || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
}

/** Esc: abandon whatever gesture is running and put things back. */
function cancelEverything(){
  let did = false;

  if (mhPlacing){ mhDrag = null; closeMhPlacer(); did = true; }

  // the pointer is still down: its eventual click must not open the 公分欄
  if (drag){ endDrag(null, true); divClickSuppressed = true; did = true; }

  if (guideDrag){
    const { key, g, created, orig } = guideDrag;
    const list = guidesFor(key);
    if (created){ const at = list.indexOf(g); if (at >= 0) list.splice(at, 1); }
    else g.unit = orig;
    guideDrag = null;
    document.body.style.userSelect = '';
    drawGuides(key);
    did = true;
  }

  if (rowDrag){
    rowDrag.row.style.transform = '';
    rowDrag.row.classList.remove('dragging');
    rowDrag = null;
    document.body.style.userSelect = '';
    boardSig = null;                    // the DOM order is dirty; rebuild it
    renderGrid(activeBlock);            // straight back from state
    did = true;
  }

  if (cellDrag){
    cellDrag.cell.classList.remove('cell-dragging');
    clearDropFeedback();
    cellDrag = null;
    document.body.style.userSelect = '';
    did = true;
  }

  if (mhResize){
    // put the 刊頭 back to the height it had when the drag started
    mhResize.sh.mastheadH = mhResize.startH;
    if (mhFrame){ cancelAnimationFrame(mhFrame); mhFrame = 0; }
    mhResize = null;
    document.body.classList.remove('mh-resizing');
    renderHead(); renderGrid(activeBlock);
    did = true;
  }

  if (did) toast('已取消', 'info', 1200);
  return did;
}

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  /* ---- Esc works everywhere, including out of a field ---- */
  if (e.key === 'Escape'){
    if (divField){ closeDividerField(); return; }
    if (modalClose){ modalClose(); return; }
    if (typingInField() && document.activeElement.isContentEditable){
      document.activeElement.blur(); return;
    }
    if (cancelEverything()) e.preventDefault();
    return;
  }

  /* ---- undo / redo, allowed even mid-typing ---- */
  if (mod && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    if (typingInField() && document.activeElement.isContentEditable)
      document.activeElement.blur();     // commit the field, then step back
    e.shiftKey ? redo() : undo();
    return;
  }
  if (mod && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }

  if (typingInField()) return;           // everything below is a bare key

  /* ---- zoom：落版 和 拼板 同一套 ---- */
  if ((activeTab === 'sheet' || activeTab === 'board') && mod){
    if (e.key === '+' || e.key === '='){ e.preventDefault(); setZoom(sheetZoom * ZOOM_STEP); return; }
    if (e.key === '-' || e.key === '_'){ e.preventDefault(); setZoom(sheetZoom / ZOOM_STEP); return; }
    if (e.key === '0'){ e.preventDefault(); zoomToFit(); return; }
  }
  if (mod) return;                       // leave every other Ctrl combo alone

  /* ---- Space = 手形, held ---- */
  if (e.code === 'Space' && activeTab === 'sheet'){
    e.preventDefault();
    if (!e.repeat) setHandMode(true);
    return;
  }

  /* ---- single-key tools ---- */
  // 工具列 拼板 也有一份，快捷鍵就跟著它走（Space 手形還是只有 落版：拼板 的平移
  // 是拖空白處，那邊沒有 handMode 那一套）
  if (activeTab !== 'sheet' && activeTab !== 'board') return;
  const k = e.key.toLowerCase();
  /* S／D 挨在一起（跟 Ctrl+C／Ctrl+V 同一個道理：常一起用的鍵手不必換位置）：
     S＝選東西（在格子裡挑零件、拖零件），D＝拖畫面。搬移還是 V。 */
  if (k === 'v'){ e.preventDefault(); setTool('move'); }
  else if (k === 's'){ e.preventDefault(); setTool('edit'); }
  else if (k === 'd'){ e.preventDefault(); setTool('pan'); }
  // 顯示格線是開關不是工具，但快捷鍵放在一起最順手
  else if (k === 'g'){ e.preventDefault(); setGridLines(!gridLines); }
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space' && handMode){
    const prev = handPrevTool;           // setHandMode clears it
    setHandMode(false);
    if (prev) setTool(prev);
  }
});
/* a lost focus would otherwise strand the hand tool on */
window.addEventListener('blur', () => { if (handMode) setHandMode(false); });

const confirmBtn = document.getElementById('confirmBtn');
const submitBtn = document.getElementById('submitBtn');
const bannerProg = document.getElementById('bannerProg');

/** 球在哪：在 PM 幾格、在設計幾格 — 正面背面一起算。
    數的是格不是版位（「12 個版位交了 5 個」會把「另外七個各交了一半」講成沒進度），
    而且不講「完成度」—— 棒子會來回傳，沒有單調遞增的那種進度。 */
function planProgress(pl){
  if (!pl || !pl.layout) return null;
  const all = collectBlocks(pl.layout.front, []).concat(collectBlocks(pl.layout.back, []));
  if (!all.length) return null;
  let pm = 0, total = 0;
  all.forEach(b => {
    const cells = (b.sheet && b.sheet.cells) || [];
    total += cells.length;
    pm    += cellsAt(b.sheet, 'pm').length;
  });
  return total ? { pm, design: total - pm, total } : null;
}

function updateProgress(){
  const p = planProgress(currentPlan);
  bannerProg.innerHTML = p
    ? `在 PM <b>${p.pm}</b>・在設計 <b>${p.design}</b> 格` : '';
}

/* ==========================================================================
   草稿 → 提交給設計
   ==========================================================================
   行銷開了檔期、還在切版的那段時間，這一份不該出現在設計和 PM 的列表上 ——
   切到一半的版流到別人眼前，他只會問「這是不是壞了」。
   **沒有 submitted 這個欄位＝已經提交**。判斷寫成 `=== false`，所以在這之前
   建立的每一個檔期都不會突然變成草稿（那會是最嚇人的一種 regression）。 */
const isDraft = p => !!p && p.submitted === false;

/** 這一份裡還沒填完的版位。切出來卻沒填品類的，對設計就是一塊不知道要放什麼的空白。
    「填齊」＝有品類、而且每一項都有支數。只填品類沒填支數一樣算沒填完：
    版位切好了、要放什麼也寫了，卻沒說要放幾樣 —— 設計還是排不了版，
    而它看起來像填過了，那更糟。兩種分開數，不然被擋下來的人不知道要補哪一種。 */
function unfilledBlocks(){
  const named = g => g && g.name && g.name !== '未命名';
  const noCat = [], noQty = [];
  allBlocks().forEach(b => {
    const gs = b.groups || [];
    if (!gs.length || !gs.some(named)) noCat.push(b);
    else if (gs.some(g => !(g.count > 0))) noQty.push(b);
  });
  return { noCat, noQty, all: noCat.concat(noQty) };
}

/** 提交鈕：只有行銷、只有草稿、只有在 總體（切版是在那一頁做的）。 */
function renderSubmitBtn(){
  const on = isMkt() && isDraft(currentPlan) && activeTab === 'total';
  submitBtn.hidden = !on;
  editorHost.classList.toggle('drafting', on);
  if (!on) return;
  const { noCat, noQty, all } = unfilledBlocks();
  const by = new Map(allBlocks().map(b => [b.id, b]));
  editorHost.querySelectorAll('.window-node').forEach(el => {
    const b = by.get(el.dataset.blockId);
    el.classList.toggle('empty-seg', !!b && all.includes(b));
  });
  const parts = [];
  if (noCat.length) parts.push(`${noCat.length} 個沒填品類`);
  if (noQty.length) parts.push(`${noQty.length} 個沒填支數`);
  const msg = parts.length ? '還有 ' + parts.join('、') : '';
  submitBtn.disabled = !!msg;
  submitBtn.textContent = msg || '提交給設計';
  submitBtn.title = msg ? msg + '　—— 框紅的那幾塊點一下，用 ✏ 品類 補完' : '送給設計和 PM，他們的列表上就看得到這一檔';
}

submitBtn.addEventListener('click', async () => {
  if (submitBtn.disabled || !isDraft(currentPlan)) return;
  const ok = await modalConfirm({
    title: '提交給設計',
    body: `「${currentPlan.name}」會出現在設計和 PM 的檔期列表上，他們就可以開始落版。`
        + '版面之後照樣改得動 —— 這不是一道鎖，只是「可以開始了」。',
    ok: '提交', cancel: '再等等'
  });
  if (!ok) return;
  currentPlan.submitted = true;
  markDirty();
  renderSubmitBtn();
  toast(`已提交「${currentPlan.name}」給設計`, 'ok', 2600);
});

/* 「送給 PM」：把這個版位還在設計手上的格一次往前推一關。
   它不是一道門，是一個動作 —— 按幾次都行（第二次推的是這期間又退回來的那幾格），
   也沒有相對的「收回」：要拿回某一格就去 拼板 蓋章退回它，那條路一直都在。
   （這裡本來是「確認列排列（鎖定）」：一顆鈕同時管交件和「別再搬列了」，
     於是想交件就得先接受版面被鎖住。鎖定整條拿掉了，剩下交件這一件事。） */
function renderConfirmBtn(){
  // 拼板 borrows the 落版 grid, but 送給 PM stays a 落版 decision
  // 行銷不交件：棒子是設計和 PM 在傳的
  if (!activeBlock || activeTab === 'board' || isMkt()){ confirmBtn.style.display = 'none'; return; }
  const sh = sheetOf(activeBlock);
  confirmBtn.style.display = 'block';
  const n = cellsAt(sh, 'design').length;
  /* 數字寫在鈕上：按下去會動到幾格，按之前就看得見。一格都不在設計手上就沒事可做，
     鈕自己說出來（而不是按了沒反應）。 */
  confirmBtn.innerHTML = n
    ? `<span class="lk">📮</span>送給 PM<br>（${n} 格往前一關）`
    : '<span class="lk">✓</span>都送出去了<br>（沒有在你手上的格）';
  confirmBtn.classList.toggle('is-confirmed', !n);
  confirmBtn.disabled = !n;
}

confirmBtn.addEventListener('click', () => {
  if (!activeBlock) return;
  const sh = sheetOf(activeBlock);
  /* 棒子還是一格一顆（cell.st），這裡只是一次把設計那邊的每一格都往前推一關 ——
     設計排完之後本來就沒事了，還要再去 拼板 一格一格蓋一次章是白工。
     推一關、不是直接跳到某一關：一改跟二改是不同的關，硬塞同一個值等於把
     走到哪裡這件事洗掉。已經在 PM 那一關的格不動（不然就變成幫 PM 蓋了章）。 */
  const moved = cellsAt(sh, 'design');
  if (!moved.length){ toast('這個版位沒有在你手上的格', 'info', 1800); return; }
  moved.forEach(c => setCellStage(c, stageNext(cellStage(c))));
  toast(`${moved.length} 格${stampWord(moved, true)}（個別格子可以到 拼板 蓋章退回）`, 'ok', 3000);
  renderMinimap();
  renderHead();
  renderGrid(activeBlock);
  renderConfirmBtn();
  updateProgress();
  commitAction();
});

const snapWrap = document.getElementById('snapWrap');

const VIEWS = {

      if (fresh && activeBlock) zoomToFit(true);
      else if (activeBlock) requestAnimationFrame(centreSheet);
    },

  },
  /* 拼板 has two states: the whole sheet (so you can see where you are), and a
     single 版位 opened in 2cell-product-pick.html — a separate app in an iframe,
     with its own styles and script, so nothing of this editor applies inside. */
  board: {

      snapWrap.style.display = 'none';
      markWrap.style.display = 'flex';

    },
