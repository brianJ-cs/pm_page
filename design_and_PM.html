/* ==========================================================================
   ROUTER — 檔期列表  <->  設計開檔
   ========================================================================== */

const listChrome = document.getElementById('listChrome');
const editorChrome = document.getElementById('editorChrome');
const editorHost = document.getElementById('view-total');
const modeBar = document.getElementById('modeBar');
const backBtn = document.getElementById('backBtn');
let currentPlan = null;

/* 設計 and PM are two identities, not two views: whoever you are is decided at
   登入 and carries into every 檔期 you open. 設計 gets 總體/落版/拼板 and
   arranges the board; PM only gets 拼板 and only fills it with 商品. The 拼板 app
   itself enforces that split — it is told the identity when it loads.
   activeMode 是登入的那個人的 role，不再是一顆隨手撥得動的開關（見 login()）。
   登入之前先當設計 —— 那時候整個畫面被登入頁蓋著，只是要有個值可以用。 */
let activeMode = 'design';
let designTab = 'total';           // where 設計 was left when PM took over

/* The 拼板 app is a separate document, so the identity has to be handed over:
   once at load through the URL, and again on every switch. */
function tellBoardRole(){
  const frames = [document.getElementById('boardFrame')]
    .concat([...boardEl.querySelectorAll('.ccanvas')]);   // 版上那些畫布也是它
  frames.forEach(f => {
    if (!f || !f.src || !f.contentWindow) return;
    try { f.contentWindow.postMessage({ boardRole: canvasRole() }, '*'); } catch(_){}
  });
}

/** 那個名牌：現在是誰在看。身分列上那三顆拿掉之後，這是唯一寫著「你是誰」的
    地方，所以登入、加人都要跟著更新。 */
function syncListTitle(){
  const t = document.getElementById('whoName');
  if (t) t.textContent = currentUser ? currentUser.name : '';
}

/* 名牌永遠是**同一顆** DOM，在三條列之間搬來搬去（跟小地圖的 hostSheet() 同一個做法）：
   檔期列表、編輯器的工具列、開檔表的標題列。每一條各放一份的話，遲早有一份忘記
   跟著更新 —— 而它寫的是「你是誰」，那是最不能寫錯的一件事。
   搬 DOM 不會掉事件，所以登出那顆的 listener 只掛一次就好。 */
const whoBadge = document.getElementById('whoBadge');
function hostWho(host){
  if (host && whoBadge.parentNode !== host) host.appendChild(whoBadge);
}

function applyMode(){
  const pm = activeMode === 'pm';
  syncListTitle();
  document.querySelectorAll('.tab').forEach(b =>
    b.style.display = (pm && b.dataset.tab !== 'board') ? 'none' : '');
  // 復原/重做 only ever touch the 落版 tree, which PM never sees（行銷改得動落版，所以留著）
  document.querySelector('.bar .hist').style.display = pm ? 'none' : 'flex';
  paintStickTray();                  // 貼紙欄的顏色跟著身分走
  /* 換身分就是換一個人在看：不要把上一個人開著的那一格留在畫面上。
     拼板一律退回總覽，該身分不能用的面板也就跟著收掉了。 */
  closeBoardCell();
  setStampMode(false);               // 換身分＝換一個人在看，別讓他一進來就站在別人開的模式裡
  tellBoardRole();
  /* 工具列跟著身分走。本來只在 renderGrid 裡跟 —— 換身分之後如果落在 總體
     （那一頁不畫版面），行銷那套「只給看」的收法就會留在工具列上，換回設計
     還是少一半的按鈕，要再點一次分頁才回得來。 */
  syncTools();
  /* 登入之後才知道是誰，而檔期列表在那之前就畫好了 —— 草稿只有行銷看得到，
     所以換人（登入）就要重畫一次，不然行銷會看不到自己昨天開到一半的那一份。 */
  if (currentPlan) setTab(pm ? 'board' : designTab);
  else renderPlans();
}

/* ==========================================================================
   登入 —— 假的，沒有密碼：一張「你是誰」的名單
   ==========================================================================
   身分不再是身分列上隨手撥得動的開關。撥得動的時候，「這一格在誰手上」
   和「我現在是誰」是同一個人在三秒內切換的兩個答案 —— 便利貼簽名、壓暗、
   蓋章方向全部跟著飄。登入一次、記住、要換就登出，這三件事才站得住。
   ========================================================================== */
const loginGate = document.getElementById('loginGate');

function renderLogin(){
  const cols = document.getElementById('lgCols');
  cols.innerHTML = '';
  ROLE_ORDER.forEach(role => {
    const col = document.createElement('div');
    col.className = 'lg-col';

    const head = document.createElement('div');
    head.className = 'lg-role';
    /* 那一顆點＝這個身分貼出來的便利貼是什麼顏色。行銷不貼便利貼，所以沒有點 ——
       名單這一頁順便就把「黃色是誰貼的」教掉了。 */
    if (role !== 'marketing'){
      const dot = document.createElement('span');
      dot.className = 'lg-dot ' + role;
      head.appendChild(dot);
    }
    head.appendChild(document.createTextNode(ROLE_LABEL[role]));
    col.appendChild(head);

    usersOf(role).forEach(u => {
      const b = document.createElement('button');
      b.className = 'lg-user';
      b.textContent = u.name;
      b.addEventListener('click', () => login(u));
      col.appendChild(b);
    });

    const add = document.createElement('button');
    add.className = 'lg-add';
    add.textContent = '＋ 加人';
    add.addEventListener('click', () => addUser(role));
    col.appendChild(add);

    cols.appendChild(col);
  });
}

/* 一次可以加好幾位：用逗號或換行分開。id 帶時間戳 —— 名字可以重複、可以改，
   但便利貼認的是 id，所以 id 只能是新的，絕不重用。 */
function addUser(role){
  const raw = prompt(`新增${ROLE_LABEL[role]}（可以一次多位，用逗號分開）`) || '';
  const names = raw.split(/[,，;；\r\n]+/).map(t => t.trim()).filter(Boolean);
  if (!names.length) return;
  names.forEach((name, i) => USERS.push({ id: role[0] + Date.now() + i, role, name }));
  saveUsers();
  renderLogin();
}

function login(u){
  currentUser = u;
  activeMode = u.role;
  try { localStorage.setItem(USER_AT_KEY, u.id); } catch (e){}
  loginGate.hidden = true;
  applyMode();
}

/* 換人＝整支重載。半路把身分抽換掉要重畫的東西太多（版上的畫布、壓暗、
   工具列、左邊那一欄），漏一個就是一個看不出來的錯 —— 重載一定對。
   走之前先把還沒寫出去的存檔擠出去。 */
async function logout(){
  flushSave();
  const s = sync();
  if (s) { try { await s.flush(); } catch (e){} }
  try { localStorage.removeItem(USER_AT_KEY); } catch (e){}
  location.reload();
}
document.getElementById('logoutBtn').addEventListener('click', logout);

/* 進來的時候是誰：網址指定 > 上次那位 > 問。
   `?as=design|pm|mkt|marketing` 挑那個身分的第一位、`?user=<id>` 挑指定那位 ——
   測試腳本每次都是乾淨的瀏覽器，沒有這條旁路就會全部卡在登入頁。 */
function bootLogin(){
  renderLogin();
  const q = new URLSearchParams(location.search);
  const asked = q.get('user');
  const as = q.get('as');
  const role = as === 'mkt' ? 'marketing' : as;
  let last = '';
  try { last = localStorage.getItem(USER_AT_KEY) || ''; } catch (e){}
  const u = (asked && USERS.find(x => x.id === asked))
         || (role && usersOf(role)[0])
         || (last && USERS.find(x => x.id === last));
  if (u) login(u);
  else loginGate.hidden = false;
}

/* ---- the bar hides against the top edge and drops when the mouse comes up ---- */
let barTimer = 0;
const barPinned = () => modeBar.classList.contains('pinned');
function showBar(on){
  if (barPinned()) return;              // 檔期列表上不收
  clearTimeout(barTimer);
  modeBar.classList.toggle('show', on);
}
/** 檔期列表：一直在。開了檔期：躲上去，滑鼠靠近才下來。 */
function pinBar(on){
  clearTimeout(barTimer);
  modeBar.classList.toggle('pinned', on);
  modeBar.classList.toggle('show', on);
  document.querySelector('.app').classList.toggle('bar-pinned', on);
}
document.addEventListener('mousemove', e => {
  if (e.clientY <= 8) showBar(true);      // the sliver itself is 7px tall
  // clear of the bar and not on it: retract. No dead band — on the 檔期列表 the
  // bar covers the title and 匯入, so anything that leaves it hanging is in
  // the way of the page underneath.
  else if (e.clientY > modeBar.offsetHeight && !e.target.closest('#modeBar')) showBar(false);
});
modeBar.addEventListener('mouseenter', () => showBar(true));
// leaving the bar sideways or upwards never crosses the threshold above
modeBar.addEventListener('mouseleave', () => {
  if (barPinned()) return;
  clearTimeout(barTimer);
  barTimer = setTimeout(() => modeBar.classList.remove('show'), 140);
});
// pointer out of the window entirely (or into the iframe) — nothing left to hover
document.addEventListener('mouseleave', () => showBar(false));

/* Rebuild both 總體 boards (and the 落版 view, if it is the one showing) from
   whatever tree `layout` now points at. Undo/redo swaps the tree wholesale, so
   every DOM node that referenced the old one has to go — `keepId` re-finds the
   block the user was working on inside the new tree. */
function rebuildAll(keepId){
  layout = currentPlan.layout;
  boards = {};
  clearBoards();
  editorHost.appendChild(buildBoard('front', '正面'));
  editorHost.appendChild(buildBoard('back',  '背面'));
  fitBoards();
  drawGuides('front'); drawGuides('back');

  const all = collectBlocks(layout.front, []).concat(collectBlocks(layout.back, []));
  activeBlock = all.find(b => b.id === keepId) || null;
  boardSig = null;                 // the old board DOM is gone; force a rebuild

  if (activeTab === 'sheet'){
    if (!activeBlock) activeBlock = all[0] || null;
    renderMinimap(); renderHead(); renderGrid(activeBlock); renderConfirmBtn();
  }
  /* 拼板那一頁一樣要重畫：復原的多半就是這裡搬的圖和貼的便利貼，
     不重畫的話按了 Ctrl+Z 畫面上什麼都沒發生。 */
  if (activeTab === 'board'){
    if (!activeBlock) activeBlock = all[0] || null;
    closeBoardCell();                 // 那一格的 DOM 換過了，面板不能再貼著舊的
    if (activeMode === 'pm') renderPmPlans();
    renderMinimap();
    renderHead(); renderGrid(activeBlock);
    paintBoardThumbs(); renderRail(); applyFocusCell();
    renderStampBar();               // 復原掉的可能就是幾個章，那一列的數字要跟著回去
  }
  updateProgress();
  /* 切一刀、改品類、Undo 都走這裡 —— 「還有幾塊沒填」跟著重算，
     不然按了 ✏ 品類 補完，那顆鈕還停在「還有 3 個沒填品類」。 */
  renderSubmitBtn();
}

/* 對齊線存的是「尺規上的第幾格」。格從 20×10 改成公分之後，同一個數字會指到
   別的地方 —— 所以舊檔期第一次開起來就換算過去，並蓋一個章免得換算第二次。
   （不換算的話，畫在版面正中間的線會自己跑到左邊四分之一。） */
const OLD_DIVS = { len: 20, side: 10 };     // 「尺」那個年代的格數
function migrateGuidesToCm(plan){
  if (!plan || plan.guidesCm) return;
  plan.guidesCm = true;
  const cm = DM_SIZE[plan.type] || DM_SIZE_FALLBACK;
  ['front', 'back'].forEach(side => {
    (plan.guides[side] || []).forEach(g => {
      const k = g.axis === 'len' ? cm.w / OLD_DIVS.len : cm.h / OLD_DIVS.side;
      g.unit = Math.round(g.unit * k * 10) / 10;
    });
  });
  /* 那個章要當場存下去：開了檔期卻什麼都沒改就離開的話，下次進來會再換算一次
     ——同一條線就被乘了兩次，跑到版外面去。 */
  savePlans();
}

function openPlan(plan){
  currentPlan = plan;
  resetRemoteWatch();              // 換一檔＝重新開始算：還沒動過手，也還沒撞到誰
  beatNow();                       // 馬上報位置，別讓人看到你還在上一檔
  if (!plan.layout) plan.layout = buildLayout();   // fresh tree per 檔期
  if (!plan.guides) plan.guides = { front: [], back: [] };
  migrateGuidesToCm(plan);           // 舊檔期的對齊線是「尺」那套 20×10 的格
  layout = plan.layout;
  migratePlan();                     // 舊檔期的欄位搬到現在的寫法（cell.ok → cell.st）

  // reset editor state for the newly opened plan
  activeBlock = null;
  sheetZoom = 1;
  zoomVal.textContent = '100%';
  boards = {};
  clearBoards();
  editorHost.appendChild(buildBoard('front', '正面'));
  editorHost.appendChild(buildBoard('back',  '背面'));

  document.getElementById('bannerName').textContent  = plan.name;
  document.getElementById('bannerRange').textContent = planRangeLabel(plan);

  listChrome.style.display = 'none';
  backBtn.style.display = '';
  pinBar(false);                     // 版面要用滿，身分列改成靠近才下來
  editorChrome.style.display = 'flex';
  hostWho(document.getElementById('whoSlot').parentNode);
  document.getElementById('view-plans').classList.remove('active');
  // 開檔表也要收：從那一張按「下一步」進來的話，兩頁會疊在一起
  document.getElementById('view-plan').classList.remove('active');
  activeTab = 'total';
  designTab = 'total';
  applyMode();                       // open as whoever you already are
  drawGuides('front'); drawGuides('back');
  updateProgress();
  setSaveState('done');              // nothing changed yet, so it is saved

  // the baseline every undo eventually walks back to
  histStack = []; histAt = -1;
  pushHistory();
}


/* ==========================================================================
   壓力測試 devtool：一鍵生一個「做到一半」的假檔期
   ==========================================================================
   舊的那一顆是在還沒有 cell.at 的年代寫的：它只管把每一格塞滿商品，然後看
   幾十格畫布同時排版卡不卡。那件事還是要壓，但現在壓不到重點 —— 全部塞滿、
   全部在設計手上的檔期，看起來跟真實情境完全不像。

   真實情境是**來回**：行銷排檔期 → 設計落版 → PM 填格 → 設計排版 → PM review → …
   同一頁上永遠有好幾個版位停在不同的一步。所以這一顆生出來的假檔期，十個版位
   各自停在不同的地方（見 STRESS_RECIPE），一打開就同時看得到：
     ・總體 三種底色、拼板 小地圖多出來的那一種綠（鎖定）
     ・版位角落的「在 PM 8/14 格」、橫幅的「在 PM n・在設計 m 格」
     ・不是你的回合的格壓暗但還看得見、上面還貼著別人的便利貼
     ・切換身分／切換 PM 之後看得到的東西會變（一個版位一位 PM）
   真實檔期完全不動：這是 unshift 一筆新的，不是改現有的。
   ========================================================================== */

/* 沒接上共用目錄時的後備商品（＝畫布內建那份的縮影，SKU 對得上就查得到價格）。
   只留 name/sku，價格由畫布自己那份 ROWS 查 —— 兩邊同一份資料，對得起來。 */
const STRESS_FALLBACK_ROWS = [
  ['iPhone 17 Pro Max','2156742'],['iPhone 17 Pro Max','2156739'],['iPhone 17 Pro Max','2156738'],
  ['iPhone 17 Pro','2156751'],['iPhone 17 Pro','2156749'],['iPhone 17 Pro','2156735'],
  ['Galaxy A5','2162613'],['Galaxy A5','2162614'],
  ['iPad Air','2154566'],['iPad Air','2154562'],
  ['iPad A16','2154573'],['iPad A16','2154572'],
  ['MacBook Pro','2158956'],
  ['MacBook Neo Air M5','2162848'],['MacBook Neo Air M5','2162864'],['MacBook Neo Air M5','2162868'],
  ['AirPods 4','2150080'],['AirPods 4','2150081'],
  ['AirPods Pro 3','2157982'],
  ['ANKER 30W 自帶線行動電源','2157669'],
].map(r => ({ name: r[0], sku: r[1] }));

/* 一種商品一組（同名的 SKU 才會被畫布併成同一張卡）。優先用共用目錄，沒有就用後備。 */
function stressProducts(){
  const rows = (CATALOGUE && Array.isArray(CATALOGUE.rows) && CATALOGUE.rows.length)
    ? CATALOGUE.rows : STRESS_FALLBACK_ROWS;
  const by = new Map();
  rows.forEach(r => { const n = r.name; if (!by.has(n)) by.set(n, []); by.get(n).push(String(r.sku)); });
  return [...by.values()].filter(a => a.length);
}

/* 認得出哪些是壓力測試用的假檔期（type 蓋章、id 前綴都行）—— 清舊的靠它。
   真檔期不會是這個 type，所以誤刪不到。 */
const isStressPlan = p => !!p && (p.type === '壓力測試' || String(p.id || '').startsWith('stress-'));

/* 十個版位各自停在流程的不同一步。
   at   格怎麼分：'design' 全在設計｜'pm' 全在 PM｜'half' 前面一片交出去｜
        'few' 零星幾格｜'ok' 用**舊欄位** cell.ok 存（開檔期時該被 migrateCellOk 搬掉，
        搬不動的話這個版位會靜靜地整塊回到設計手上 —— 那就是要看的東西）
   fill 這個版位的格要不要塞商品。留兩個空的：沒挑貨的格長什麼樣也要看得到，
        而且「未填寫」跟「在對方手上」是兩件事，混在一起才分得出有沒有搞混。 */
const STRESS_RECIPE = [
  { at:'design', fill:true  },
  { at:'half',   fill:true  },
  { at:'pm',     fill:true  },
  { at:'design', fill:true  },
  { at:'half',   fill:true  },
  { at:'few',    fill:false },
  { at:'pm',     fill:true  },
  { at:'half',   fill:true  },
  { at:'few',    fill:true  },
  { at:'ok',     fill:false }
];

/** 把棒子照配方分下去。'half' 是連續的一片（像真的框選蓋章那樣），
    'few' 是零星幾格（像一格一格點的）—— 兩種手勢留下的痕跡本來就不一樣。
    關（cell.st）照版位序號輪：十個版位攤開來，八個關名都要出現得到 ——
    標籤塞不塞得下、名字會不會撞到 PM 那個字，只有真的看到才知道。 */
function stressHandOut(cells, how, idx){
  const half = Math.round(cells.length / 2);
  const pmSt = [0, 2, 4, 6][idx % 4];       // 提明細／一校／二校／蓋章
  const dsSt = [1, 3, 5, 7][idx % 4];       // 製作／一改／二改／蓋章修改
  cells.forEach((c, i) => {
    const toPm = how === 'pm' || how === 'ok' ? true
               : how === 'half' ? i < half
               : how === 'few'  ? i % 9 === 0
               : false;
    if (how === 'ok'){ if (toPm) c.ok = true; return; }   // 故意用舊欄位，看搬移有沒有接住
    setCellStage(c, toPm ? pmSt : dsSt);
  });
}

const STRESS_TEXTS = ['價格再確認一下','這張圖要換','補一個加價購','SKU 對嗎？',
                      '位置往上一點','','客訴要注意，文案別寫太滿','要不要做貼紙'];

/* 便利貼也塞一些，才看得出貼滿標記、意見欄排一長串的樣子。
   誰貼的照規矩來：設計只貼得出「留言」，補貼紙／補贈品是 PM 才有的（kindsFor）——
   假資料要是違反這條，看起來就會像程式壞了。PM 那一邊用的是**這個版位自己的 PM**，
   所以切到別位 PM 的時候，這些便利貼該跟著版位一起看不見。 */
function stressNotes(idx, pm, dz){
  const out = [];
  for (let j = 0; j < idx % 3; j++){          // 0、1、2 顆：三格裡兩格有便利貼
    const byPm = (idx + j) % 2 === 1;
    const who   = byPm ? pm.name : dz.name;
    const whoId = byPm ? 'pm:' + pm.id : 'design:' + dz.id;
    out.push({
      id: 'sn' + idx + '-' + j,
      key: byPm ? ['sticker','gift','other'][(idx * 2 + j) % 3] : 'other',
      text: STRESS_TEXTS[(idx + j) % STRESS_TEXTS.length],
      who, whoId, time: stamp(), done: (idx + j) % 4 === 0,
      x: 18 + ((idx * 17 + j * 37) % 64),
      y: 18 + ((idx * 23 + j * 13) % 58),
      // 有回覆的那幾則要看得出一問一答排起來是什麼樣子
      replies: (idx + j) % 5 === 0
        ? [{ who: byPm ? dz.name : pm.name,
             whoId: byPm ? ('design:' + dz.id) : ('pm:' + pm.id),
             text: '收到，改好了', time: stamp() }]
        : []
    });
  }
  return out;
}

function makeStressPlan(){
  const prods = stressProducts();
  if (!prods.length){ alert('沒有商品可塞'); return; }

  /* 一頁 5 個版位（左欄 3、右欄 2），前後兩頁共 10 個，一個版位約 60 格。
     群組數也混著給：一組的、兩組的、三組的 —— 版位標題那幾行、挑貨面板的分組
     都吃這個。 */
  let n = 0;
  const b = (size, groups) => blk('壓測' + String(++n).padStart(2, '0'), groups, size);
  const G1 = [{ name:'商品', count:60 }];
  const G2 = [{ name:'手機', count:36 }, { name:'平板', count:24 }];
  const G3 = [{ name:'冰箱', count:24 }, { name:'洗衣機', count:22 }, { name:'小家電', count:14 }];
  const stressPage = () => ({ dir:'row', fold:true, size:null, children:[
    { dir:'col', size:50, children:[ b(34, G1), b(33, G2), b(null, G3) ] },
    { dir:'col', size:50, children:[ b(50, G2), b(null, G1) ] }
  ]});

  const plan = {
    id: 'stress-' + Date.now(),
    name: '壓力測試（假檔期）',
    type: '壓力測試',
    tags: ['壓測'],
    start: SEED_PLANS[0].start,
    durs: SEED_PLANS[0].durs.slice(),
    layout: { front: stressPage(), back: stressPage() }
  };

  /* 商品和棒子在開檔期之前就塞好 —— 尤其是 'ok' 那一個版位：它要趕在 openPlan
     裡的 migrateCellOk 之前存在，不然就測不到搬移。 */
  const blocks = collectBlocks(plan.layout.front, []).concat(collectBlocks(plan.layout.back, []));
  let ci = 0;
  blocks.forEach((blkNode, bi) => {
    const r = STRESS_RECIPE[bi % STRESS_RECIPE.length];
    const sh = sheetOf(blkNode);
    (sh.cells || []).forEach(c => {
      // 同商品的前 6 個 SKU＝跨價位，畫布那邊會排成 1~3 個價格欄
      if (r.fill) c.board = { state: { picked: prods[ci % prods.length].slice(0, 6) } };
      ci++;
    });
    stressHandOut(sh.cells || [], r.at, bi);
  });

  // 只留一個：舊的壓力測試檔期整批清掉（本機＋遠端），不然每按一次就多一筆同名的
  // 堆在列表裡。只清 localStorage 的話，下次 bootSync 又會把它們從 Supabase 拉回來。
  const s = sync();
  for (let i = plans.length - 1; i >= 0; i--) if (isStressPlan(plans[i])){
    if (s) s.queueRemove(plans[i].id);
    plans.splice(i, 1);
  }
  plans.unshift(plan);
  savePlans();
  openPlan(plan);                     // 這裡才會搬掉 cell.ok

  /* 便利貼要簽在真的存在的人身上（whoId 認 id），所以從名單裡輪流拿一位 PM ——
     簽一個查無此人的 id，那些貼紙就變成誰都改不動的。 */
  const pms = usersOf('pm'), dzs = usersOf('design');
  let ni = 0;
  blocks.forEach((blkNode, bi) => {
    (sheetOf(blkNode).cells || []).forEach(c => {
      const pm = pms[bi % pms.length] || { id:'pm1', name:'PM A' };
      const dz = dzs[bi % dzs.length] || { id:'d1', name:'設計 A' };
      c.notes = stressNotes(ni++, pm, dz);
    });
  });
  markDirty();                        // 假資料不進復原，Ctrl+Z 退不回「還沒塞」那一步

  /* 直接落在拼板；mount 會自己選第一個版位、畫好。
     用 setTab 不用 switchTab：PM 進來就已經站在拼板了，switchTab 遇到同一個分頁
     什麼都不做 —— 而上面那些便利貼是「畫完之後」才塞進去的，不重掛一次
     意見欄就停在還沒有貼紙的那一刻（PM 按這顆會看到一片「還沒有人標東西」）。 */
  setTab('board');
}

/* 拖著檔案在版面上的時候，把畫布那層打開讓它自己收 drop（見 .filedrag 那條 CSS）。

(function enableFileDropOnBoards(){

/* ==========================================================================
   三方合併：兩個人改同一份檔期，改的多半不是同一個東西
   ==========================================================================
   一份 plan 的 JSON 裡住著四種東西，各有各的主人和節奏：檔期資料（行銷）、
   版面骨架（設計）、每個版位的列和刊頭（設計）、每一格的內容（PM 和設計，
   而且是資料量的大宗）。設計搬一列的同時 PM 在挑貨 —— 他們改的是**不同的東西**，
   只是剛好住在同一列裡。所以要修的不是「把衝突變細」，是別再把不相干的東西一起覆蓋。

   做法是三方合併：拿「上次同步時的樣子」當祖先，一塊一塊比。
     我沒動、他動了  → 用他的
     我動了、他沒動  → 用我的
     兩邊都動了      → 用我的，然後**講出來**（不默默選一邊）

   ⚠️ **就地改 mine**，不回傳新物件：currentPlan／layout／activeBlock 都握著那個
   物件的參考，換成新的就全變孤兒。版面骨架換掉之後叫 rebuildAll() —— 那支本來
   就是為了「整棵樹被換掉」而寫的（Ctrl+Z 走的是同一條）。

   不做的事：不猜、不自動三方合併同一格裡面的東西。同一格兩個人都動了就是用我的
   加一句話 —— 那一格的內容是一整組互相有關係的東西（挑了哪些貨、零件擺哪、
   便利貼），拆開來各取一半只會做出一個誰都沒排過的版。
   ========================================================================== */

const j = v => JSON.stringify(v);
const jclone = v => JSON.parse(JSON.stringify(v));

/* plan 裡除了 layout 以外的欄位，一個一個比（它們彼此不相干）。 */
const META_KEYS = ['name','type','tags','start','durs','submitted','stageOverride',
                   'guides','guidesCm'];
/** 一格扣掉便利貼之後長什麼樣 —— 拿來判斷「除了話以外，還有東西撞到嗎」。 */
const stripNotes = c => { const o = Object.assign({}, c); delete o.notes; return o; };
/* lastBy／lastById 刻意不在上面那一串裡：它們是記帳欄位，**每一次合併兩邊都不一樣**
   （各自蓋自己的名字），列進去的話每次都會報一個假衝突，把真的那一個淹掉。
   寫的人是我，所以就是我的名字。 */

/** 版面骨架：樹的形狀 ＋ 每一塊的品類／名字／比例／列／刊頭 ＋ 每個版位有哪幾格（只留 id）。
    格子的**內容**不在這裡 —— 那是 cells 那一半的事。 */
function structOf(node){
  if (!node) return null;
  if (!node.children){
    const sh = node.sheet || {};
    return { id:node.id, name:node.name, size:node.size, groups:node.groups,
             noMasthead:!!node.noMasthead,
             cellIds: (sh.cells || []).map(c => c.id),
             rows: sh.rows, masthead: sh.masthead, mhSide: sh.mhSide,
             mastheadW: sh.mastheadW, mastheadH: sh.mastheadH,
             mastheadRow: sh.mastheadRow, mhRev: sh.mhRev };
  }
  return { dir:node.dir, fold:!!node.fold, size:node.size,
           children:(node.children || []).map(structOf) };
}
const planStruct = p => p && p.layout ? { front: structOf(p.layout.front),
                                          back:  structOf(p.layout.back) } : null;

/** 每一格的內容，攤成 cellId → cell。 */
function planCells(p){
  const out = Object.create(null);
  if (!p || !p.layout) return out;
  const walk = n => {
    if (!n) return;
    if (n.children){ n.children.forEach(walk); return; }
    ((n.sheet && n.sheet.cells) || []).forEach(c => { out[c.id] = c; });
  };
  walk(p.layout.front); walk(p.layout.back);
  return out;
}

/** 把一份 plan 的每一格換成 map 裡對應的那一個（就地）。 */
function grinCells(p, map){
  const walk = n => {
    if (!n) return;
    if (n.children){ n.children.forEach(walk); return; }
    const sh = n.sheet;
    if (!sh || !sh.cells) return;
    sh.cells = sh.cells.map(c => map[c.id] || c);
  };
  walk(p.layout.front); walk(p.layout.back);
}

/* ---- 商品目錄 ------------------------------------------------------------
   目錄是 { rows:[{name,spec,color,sku,price}], model, brand, bimg, img }，
   **全公司只有這一列**。兩個人各自貼一批商品進來，後存的把先存的整批抹掉 ——
   所以它也要合，而且它比檔期好合：一列一個 SKU，SKU 就是那個商品的身分。

   刪掉的規則跟便利貼一樣：**只有我刪的才算刪**。別人下架了、我這邊還留著就留著 ——
   多一個商品在挑貨清單裡沒什麼，一整批不見要重貼一次。 */
function mergeCatalogueInto(mine, base, theirs){
  const out = { took: 0, conflicts: 0 };
  if (!mine || !theirs) return out;
  if (!base) base = { rows: [], model:{}, brand:{}, bimg:{}, img:{} };

  const bySku = list => { const m = Object.create(null);
                          (list || []).forEach(r => { if (r && r.sku != null) m[String(r.sku)] = r; });
                          return m; };
  const b = bySku(base.rows), m = bySku(mine.rows), t = bySku(theirs.rows);
  const rows = [];
  (mine.rows || []).forEach(r => {
    const k = String(r.sku), tr = t[k];
    if (!tr || j(tr) === j(r)){ rows.push(r); return; }
    if (j(r) === j(b[k])){ rows.push(jclone(tr)); out.took++; return; }   // 我沒動 → 用他的
    if (j(tr) === j(b[k])){ rows.push(r); return; }                       // 他沒動 → 用我的
    rows.push(r); out.conflicts++;                                        // 兩邊都動了
  });
  (theirs.rows || []).forEach(r => {                 // 他新加的（祖先沒有、我也沒有）
    const k = String(r.sku);
    if (m[k] || b[k]) return;
    rows.push(jclone(r)); out.took++;
  });
  mine.rows = rows;

  // model／brand／bimg／img 是「商品名 → 值」的對照表，一把鑰匙一把鑰匙合
  ['model','brand','bimg','img'].forEach(field => {
    const bo = base[field] || {}, mo = mine[field] || {}, to = theirs[field] || {};
    const merged = Object.assign({}, mo);
    Object.keys(to).forEach(k => {
      if (j(to[k]) === j(mo[k])) return;
      if (!(k in mo) || j(mo[k]) === j(bo[k])){ merged[k] = jclone(to[k]); out.took++; return; }
      if (j(to[k]) === j(bo[k])) return;            // 他沒動
      out.conflicts++;                              // 兩邊都動了：用我的
    });
    mine[field] = merged;
  });
  return out;
}

/** 合併完要讓每一塊畫布都拿到新的那一份，不然只有動手的那一格是對的。 */
function afterCatalogueMerge(data, report){
  CATALOGUE = data;
  pushCatalogue();
  if (report.conflicts)
    toast(`商品目錄跟別人的改動合併了，有 ${report.conflicts} 筆兩邊都改過 —— 用了你的`, 'warn', 6000);
  else if (report.took)
    toast(`商品目錄合併了別人的 ${report.took} 筆`, 'info', 3200);
}

/* ---- 一格裡面：只有便利貼往下合 ------------------------------------------
   一格的內容（挑了哪些貨、零件擺哪、走到第幾關）是一整組互相有關係的東西，
   各取一半只會做出一個誰都沒排過的版 —— 所以那些一律用我的。

   **便利貼是例外**，而且是最常撞到的那一種：PM 在某一格貼了一則問題，同時設計在
   那一格裡搬零件。整格用我的話，那一則問題就沒了 —— 而它是一句話，不是版面的一部分。
   便利貼的 id 是 `'n' + Date.now() + 亂數`，全域唯一，所以照 id 取聯集就對了。

   刪掉的規則：**只有我撕掉的才算撕掉**。祖先有、我沒有 → 我撕的，維持撕掉；
   祖先有、他沒有、我還有 → 他撕的，但我可能剛回覆過，留著比較安全（撕錯了再撕一次
   很便宜，話不見了要不回來）。 */
function mergeNotes(bN, mN, tN){
  const by = list => { const m = Object.create(null); (list || []).forEach(n => { if (n && n.id) m[n.id] = n; }); return m; };
  const b = by(bN), m = by(mN), t = by(tN);
  const out = [];
  let took = 0;
  // 我這邊有的先照原本的順序放進去（順序是「誰先貼的」，不要洗掉）
  (mN || []).forEach(n => {
    const tn = t[n.id];
    if (tn && j(tn) !== j(n)){
      /* 同一則兩邊都動過：回覆是往後接的，取比較長的那一串就不會掉話。
         其他欄位（處理完了沒、位置）用我的。 */
      const mine = jclone(n);
      if ((tn.replies || []).length > (mine.replies || []).length){ mine.replies = jclone(tn.replies); took++; }
      out.push(mine);
      return;
    }
    out.push(n);
  });
  // 他新貼的（祖先沒有、我也沒有）接在後面
  (tN || []).forEach(n => {
    if (m[n.id] || b[n.id]) return;
    out.push(jclone(n)); took++;
  });
  return { notes: out, took };
}

/** 兩邊都動過同一格：內容用我的，便利貼合起來。 */
function mergeCell(b, m, t){
  const out = jclone(m);
  const r = mergeNotes(b && b.notes, m.notes, t && t.notes);
  if (r.took) out.notes = r.notes;
  return { cell: out, notes: r.took };
}

/* ------------------------------------------------------------------------ */

/** 就地把 theirs 裡「我沒動過」的部分合進 mine。回傳做了什麼。 */
function mergePlanInto(mine, base, theirs){
  const report = { took: 0, notes: 0, conflicts: [], rebuilt: false,
                   by: (theirs && theirs.lastBy) || '' };
  if (!mine || !theirs) return report;
  /* 沒有祖先就沒得三方比（這台機器沒同步過它）。這時候不要猜 —— 保留我的，
     讓上層照「有衝突」處理，使用者自己看一眼。 */
  if (!base){ report.conflicts.push('整份'); return report; }

  /* ---- 檔期資料：一個欄位一個欄位 ---- */
  META_KEYS.forEach(k => {
    const b = j(base[k]), m = j(mine[k]), t = j(theirs[k]);
    if (m === t) return;                 // 兩邊一樣，沒事
    if (m === b){ mine[k] = jclone(theirs[k]); report.took++; return; }   // 我沒動 → 用他的
    if (t === b) return;                                                  // 他沒動 → 用我的
    report.conflicts.push(k === 'durs' || k === 'start' ? '時程' : k);     // 兩邊都動了
  });

  if (!mine.layout || !theirs.layout) return report;

  /* ---- 版面骨架 ---- */
  const bS = j(planStruct(base)), mS = j(planStruct(mine)), tS = j(planStruct(theirs));
  const myCells = planCells(mine), theirCells = planCells(theirs), baseCells = planCells(base);
  const structTookTheirs = mS === bS && tS !== bS;

  if (structTookTheirs){
    /* 我沒動版面、他動了 → 換成他的骨架。格子的內容等一下再接回去。
       換的是 mine.layout 這個欄位，不是 mine 本身，所以 currentPlan 的參考還活著。 */
    mine.layout = jclone(theirs.layout);
    report.took++;
    report.rebuilt = true;
  } else if (mS !== bS && tS !== bS && mS !== tS){
    report.conflicts.push('版面');        // 兩邊都動了骨架：用我的
  }

  /* ---- 一格一格 ---- */
  const merged = Object.create(null);
  const now = planCells(mine);            // 換過骨架的話，這時候的格子是他那一份
  Object.keys(now).forEach(id => {
    const b = baseCells[id], m = myCells[id], t = theirCells[id];
    const jb = j(b), jm = j(m), jt = j(t);
    if (jm === jt){ merged[id] = m || t; return; }
    if (m === undefined){ merged[id] = t; return; }          // 只有他那邊有
    if (t === undefined){ merged[id] = m; return; }          // 只有我這邊有
    if (jm === jb){ merged[id] = jclone(t); report.took++; return; }   // 我沒動 → 用他的
    if (jt === jb){ merged[id] = m; return; }                          // 他沒動 → 用我的
    /* 兩邊都動了同一格：內容用我的，但便利貼往下合 —— 那是話，不是版面。 */
    const r = mergeCell(b, m, t);
    merged[id] = r.cell;
    report.notes += r.notes;
    /* 只有便利貼不一樣的話不算衝突：那一格已經整個合好了，沒有東西被丟掉。 */
    if (j(stripNotes(m)) !== j(stripNotes(t))) report.conflicts.push('一格');
  });
  grinCells(mine, merged);
  return report;
}

/* 合併完要讓畫面跟上。骨架換過就整棵重建（rebuildAll 本來就是為這件事寫的，
   Ctrl+Z 走同一條）；只有格子變的話重畫那幾張圖就好 —— 重建的成本高，而且會把
   使用者正在做的動作打斷。 */
function afterMerge(planId, report){
  const open = currentPlan && currentPlan.id === planId;
  if (open){
    if (report.rebuilt) rebuildAll(activeBlock ? activeBlock.id : null);
    else if (activeTab === 'board'){ paintBoardThumbs(); renderRail(); }
    else if (activeTab === 'sheet') redrawSheet();
    renderMinimap();
    updateProgress();
    /* 檔期本身的欄位也可能是合進來的（對方改了名字或時程）—— 橫幅上那兩行寫的
       就是它們，不重畫的話畫面會停在舊名字，而資料庫上已經是新的了。 */
    document.getElementById('bannerName').textContent = currentPlan.name;
    document.getElementById('bannerRange').textContent = planRangeLabel(currentPlan);
  }
  savePlans();
  if (!currentPlan) renderPlans();

  const who = report.by || '別人';
  const n = (report.conflicts || []).length;
  if (report.notes) toast(`合併了 ${who} 的 ${report.notes} 則便利貼`, 'info', 3200);
  if (n){
    /* 兩邊都改了同一塊：用了我的，但一定要講出來 —— 默默選一邊才是最糟的。 */
    const what = [...new Set(report.conflicts)].join('、');
    toast(`跟 ${who} 的改動合併了，但有 ${n} 處兩邊都動過（${what}）—— 用了你的版本`,
          'warn', 7000);
  } else if (report.took){
    toast(`已跟 ${who} 的改動合併`, 'ok', 2600);
  }
}

/* ==========================================================================
   輪詢：對方改了什麼，這邊要知道
   ==========================================================================
   以前只有開機拉一次，之後除非重整，對方的改動永遠不會來。這一段每隔幾秒去問
   一次「哪幾個檔期的 updated_at 跟我上次看到的不一樣」（只撈 id 和時間，
   二十個檔期大概 1～2 KB），有變的才把那幾筆抓回來。

   ⚠️ **只比「一不一樣」，不比「誰比較新」**：`updated_at` 是用戶端自己寫上去的
   （見 supabase-sync 的 upsert），兩台電腦時鐘差幾秒就會排錯順序。
   比相等就不怕時鐘歪。

   ⚠️ **開著的那一檔絕對不換掉。** currentPlan／layout／activeBlock 都是直接握著
   那個物件的參考，換成遠端拉回來的新物件，手上那個就變孤兒 —— 之後每一筆編輯
   寫進孤兒裡，存的卻是新的那份，改了半天全部不見而且完全不會報錯。
   所以那一檔改成掛一條提示，讓人自己決定。

   這一步**不會解決互相覆蓋**，它把「安靜地弄丟一天的工作」變成「有人問你一句」。
   真正的解法是把格子拆成一列一列、逐格版本檢查（見計畫的第二步）。
   ========================================================================== */
const POLL_MS = 5000;
const POLL_MAX = 60000;          // 後端掛掉就退到一分鐘一次，不要一直敲
let pollTimer = 0, pollWait = POLL_MS;
let remoteHit = null;            // 開著的那一檔被改到了：{ stamp, by }
let planTouched = false;         // 開著這一檔之後有沒有動過手

const remoteBar = document.getElementById('remoteBar');
/* 合併的規矩交給同步層：它負責「怎麼安全地寫進去」，這裡負責「怎麼合」。 */
if (window.PlanSync && window.PlanSync.setMerge){
  window.PlanSync.setMerge(mergePlanInto, afterMerge);
  window.PlanSync.setCatalogueMerge(mergeCatalogueInto);
  window.PlanSync.setCatalogueAfter(afterCatalogueMerge);
}

/** 存檔時把「最後是誰」寫進 plan 自己的 JSON —— 不必改 schema 就講得出是誰改的。 */
function stampLastBy(plan){
  if (!plan || !currentUser) return;
  plan.lastBy = currentUser.name;
  plan.lastById = currentUser.id;
}

function renderRemoteBar(){
  if (!remoteHit || !currentPlan){ remoteBar.classList.remove('on'); return; }
  const who = remoteHit.by ? `<b>${escapeHtml(remoteHit.by)}</b>` : '別人';
  document.getElementById('remoteMsg').innerHTML = planTouched
    ? `${who} 也在改這一檔`
      + '<span class="sub">你們改的不是同一塊的話，存檔時會自動合併 —— 想直接看他那一份就重新載入</span>'
    : `${who} 剛剛改過這一檔`
      + '<span class="sub">你還沒動過手，重新載入就是最新的</span>';
  remoteBar.classList.add('on');
}

/** 開一個檔期＝重新開始算：這一檔還沒被動過，也還沒撞到誰。 */
function resetRemoteWatch(){
  remoteHit = null; planTouched = false;
  renderRemoteBar();
}

async function pollRemote(){
  const s = sync();
  if (!s) return;
  let index;
  try {
    index = await s.pullIndex();
  } catch (e){
    pollWait = Math.min(POLL_MAX, pollWait * 2);   // 連不上就退避，別一直敲
    return;
  }
  pollWait = POLL_MS;
  pullBeats();                     // 順便問一次誰在看哪裡（很小，不必等它）
  if (!Array.isArray(index)) return;

  const here = new Set(index.map(r => r.id));
  const changed = index.filter(r => r.updated_at !== s.stampOf(r.id)).map(r => r.id);

  /* 開著的那一檔另外處理：不換，只提示。 */
  const openId = currentPlan ? currentPlan.id : null;
  const others = changed.filter(id => id !== openId);

  if (openId && changed.includes(openId)){
    const row = index.find(r => r.id === openId);
    /* 同一個時間戳只吵一次 —— 使用者按了「先不要」之後，下一次輪詢不該再跳出來。
       「是誰改的」直接從 index 上拿（pullIndex 順便帶了），所以這裡**不去抓那一檔的
       內容** —— 抓了就會把時間戳記成「看過了」，可是資料根本沒吃進來。 */
    if (!remoteHit || remoteHit.stamp !== row.updated_at){
      remoteHit = { stamp: row.updated_at, by: row.lastBy || '' };
      renderRemoteBar();
    }
  }

  /* 沒開著的那些：直接換掉，這是安全的（沒有人握著它們的參考）。 */
  if (others.length){
    try {
      const rows = await s.pullSome(others);
      const byId = new Map(plans.map(p => [p.id, p]));
      rows.forEach(r => { if (r && r.id && r.data) byId.set(r.id, r.data); });
      plans = [...byId.values()];
      plans.filter(normalizeLayout);
      savePlans();
      if (!currentPlan) renderPlans();
    } catch (e){}
  }

  /* 遠端已經不見的：別人刪掉了。**只刪我知道它上去過的那些** ——
     本機剛開、還沒上傳的檔期也不在 index 裡，那不是「被刪掉」。 */
  const gone = plans.filter(p => !here.has(p.id) && s.stampOf(p.id) && p.id !== openId);
  if (gone.length){
    const ids = new Set(gone.map(p => p.id));
    plans = plans.filter(p => !ids.has(p.id));
    savePlans();
    if (!currentPlan) renderPlans();
  }
}

function schedulePoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    // 切走的分頁不必問：問了也沒人在看，而且會白白吃掉別人的額度
    if (document.visibilityState === 'visible' && sync()){
      try { await pollRemote(); } catch (e){}
    }
    schedulePoll();
  }, pollWait);
}
schedulePoll();

/* 切回這個分頁就馬上問一次 —— 離開的那段時間別人多半改過東西了。
   反過來切走的時候把排隊中的推出去：不推的話那幾筆要等你切回來才會走。 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    pollWait = POLL_MS;
    schedulePoll();
    if (sync()) pollRemote().catch(() => {});
  } else {
    flushSave();
    const s = sync();
    if (s) s.flush();
  }
});

document.getElementById('remoteReload').addEventListener('click', async () => {
  const s = sync();
  if (!s || !currentPlan) return;
  if (planTouched){
    const go = await modalConfirm({
      title: '重新載入這一檔',
      body: '你在這一檔上做過的、還沒送出去的變更會不見，換成別人那一份。確定嗎？',
      ok: '重新載入', cancel: '取消', danger: true
    });
    if (!go) return;
  }
  const id = currentPlan.id;
  let rows = [];
  try { rows = await s.pullSome([id]); } catch (e){ toast('拉不到最新的那一份', 'warn', 2600); return; }
  const fresh = rows[0] && rows[0].data;
  if (!fresh){ toast('這一檔在共用資料庫上已經不見了', 'warn', 3200); return; }
  const at = plans.findIndex(p => p.id === id);
  if (at >= 0) plans[at] = fresh; else plans.push(fresh);
  normalizeLayout(fresh);
  savePlans();
  resetRemoteWatch();
  openPlan(fresh);                 // 整個檔期重開：手上的參考全部換成新的那一份
  toast('已換成最新的那一份', 'ok', 2400);
});

document.getElementById('remoteDismiss').addEventListener('click', () => {
  /* 只收起這一條，不解除擋上傳 —— 「先不要」是「等一下再說」，不是「我要覆蓋」。
     remoteHit 留著，所以同一個時間戳不會再吵你；下一次別人再改才會再跳。 */
  remoteBar.classList.remove('on');
});

/* ==========================================================================
   誰在看哪裡
   ==========================================================================
   這一段**擋不住任何事**，它做的是另一件事：讓碰撞在發生之前就被避開。
   人看到「設計 B 正在這一塊」自己會讓 —— 那比任何合併演算法都便宜。

   一人一列（`__presence:<userId>`，借 plans 那張表，見 supabase-sync），
   所以心跳之間永遠不會互相覆蓋。過期就當作走了：三拍沒訊號就不畫。
   ========================================================================== */
const BEAT_MS = 15000;        // 心跳
const BEAT_DEAD = 45000;      // 三拍沒訊號就當作人走了
let beatTimer = 0;
let presence = [];            // 別人在哪裡（已經濾掉自己和過期的）

const fresh = p => p && p.at && (Date.now() - p.at) < BEAT_DEAD;
/* 這一塊上有誰（不含自己）。
   ⚠️ **一定要連 planId 一起比**：版位 id 是 `blk()` 每次開檔期從 1 開始編的
   （'b'+(++uid)），所以 `b1` 在每一份檔期裡都存在 —— 只比 blockId 的話，
   別人在另一檔的 b1，會在你這一檔的 b1 上亮起來。 */
const whoOnBlock = blockId => presence.filter(p =>
  p.blockId === blockId && currentPlan && p.planId === currentPlan.id);
/** 這一檔裡有誰（不含自己）。 */
const whoOnPlan  = planId  => presence.filter(p => p.planId === planId);
/** 名字最後一個字：「設計 B」→ B。跟便利貼角落那一個字同一條規矩。 */
const beatMark = p => String(p.name || '?').trim().slice(-1);

async function beat(){
  const s = sync();
  if (!s || !currentUser) return;
  await s.pushPresence(currentUser.id, {
    name: currentUser.name, role: currentUser.role,
    planId: currentPlan ? currentPlan.id : null,
    blockId: (currentPlan && activeBlock) ? activeBlock.id : null,
    at: Date.now()
  });
}

async function pullBeats(){
  const s = sync();
  if (!s) return;
  let rows = [];
  try { rows = await s.pullPresence(); } catch (e){ return; }
  const me = currentUser ? currentUser.id : '';
  const next = rows.filter(p => p.userId !== me && fresh(p));
  /* 沒變就不重畫 —— 每 5 秒重畫一次小地圖，你正在拖的東西會跳一下。 */
  const sig = next.map(p => p.userId + ':' + p.planId + ':' + p.blockId).sort().join('|');
  if (sig === pullBeats.sig) return;
  pullBeats.sig = sig;
  presence = next;
  paintPresence();
}

/** 只更新記號，不重建版面：重建的成本高，而且會把正在做的動作打斷。 */
function paintPresence(){
  // 小地圖上：哪一塊有別人
  document.querySelectorAll('#sheetSide .mini-blk, #pmStack .mini-blk').forEach(el => {
    const on = whoOnBlock(el.dataset.blockId);
    let tag = el.querySelector('.who-here');
    if (!on.length){ if (tag) tag.remove(); return; }
    if (!tag){
      tag = document.createElement('span');
      tag.className = 'who-here';
      el.appendChild(tag);
    }
    tag.textContent = on.map(beatMark).join('');
    tag.title = on.map(p => p.name).join('、') + ' 正在看這一塊';
  });
  // 檔期列表上：哪一檔有別人
  document.querySelectorAll('#planList .plan-card[data-plan-id]').forEach(card => {
    const on = whoOnPlan(card.dataset.planId);
    let tag = card.querySelector('.pill.here');
    if (!on.length){ if (tag) tag.remove(); return; }
    if (!tag){
      tag = document.createElement('span');
      tag.className = 'pill here';
      card.querySelector('.plan-head').appendChild(tag);
    }
    tag.textContent = on.map(p => p.name).join('、') + ' 在看';
  });
  // 開著檔期的時候：同一檔還有誰
  const line = document.getElementById('hereNow');
  if (line){
    const on = currentPlan ? whoOnPlan(currentPlan.id) : [];
    line.textContent = on.length ? on.map(p => p.name).join('、') + ' 也在這一檔' : '';
    line.classList.toggle('on', !!on.length);
  }
}

function startBeats(){
  clearTimeout(beatTimer);
  beatTimer = setTimeout(async () => {
    if (document.visibilityState === 'visible' && sync() && currentUser){
      try { await beat(); } catch (e){}
    }
    startBeats();
  }, BEAT_MS);
}
startBeats();

/* 換人／換檔期／換版位都立刻報一次 —— 等下一拍的話，別人會有十幾秒看到你還在舊的位置。 */
function beatNow(){ if (sync() && currentUser) beat().catch(() => {}); }

/* 關分頁就把自己那一列清掉。用 sendBeacon 不行（要帶 apikey 這個 header），
   所以走 keepalive 的 fetch —— 送不出去也沒關係，反正 45 秒後會自己過期。 */
window.addEventListener('pagehide', () => {
  const s = sync();
  if (s && currentUser) s.dropPresence(currentUser.id);
});

showList();
/* 最後才問「你是誰」：上面已經把整個畫面建好了，登入只是把蓋著的那一頁收起來。
   反過來先問的話，login() 裡的 applyMode() 會踩到還沒宣告完的東西。 */
bootLogin();

/* ---- 共用資料庫：開機先用 localStorage 秒開（上面都做完了），再拉一次遠端 ----
   刻意放在最後、而且不 await：後端慢或掛掉都不影響這一頁開得起來。 */
(async function bootSync(){
  const s = sync();
  const want = new URLSearchParams(location.search).get('plan');

  if (s){
    /* 目錄先拉：畫布掛上來的時候就要有得用。拉不到（表還沒建、網路不通）
       就維持 null，畫布照舊用它自己寫死的那份。 */
    try {
      const cat = await s.pullCatalogue();
      if (cat && Array.isArray(cat.rows) && cat.rows.length){ CATALOGUE = cat; pushCatalogue(); }
    } catch (e){ console.warn('商品目錄同步失敗，先用內建的', e); }

    try {
      const rows = await s.pullAll();
      if (rows && rows.length){
        /* 同一個 id 以遠端為準。這是 MVP 的取捨：兩個人同時改同一個檔期，後存的贏。
           只在遠端有的才蓋，本機獨有的檔期留著（還沒上傳過的不會被吃掉）。 */
        const byId = new Map(plans.map(p => [p.id, p]));
        rows.forEach(r => {
          if (!r || !r.id || !r.data) return;
          /* 正在編輯的那一個絕對不能換掉。currentPlan／layout／activeBlock 都是直接
             握著那個物件的參考，把它換成遠端拉回來的新物件，手上那個就變成孤兒 ——
             之後每一筆編輯都寫進孤兒裡，savePlans() 存的卻是新的那份，
             改了半天全部不見而且完全不會報錯。 */
          if (currentPlan && r.id === currentPlan.id) return;
          byId.set(r.id, r.data);
        });
        plans = [...byId.values()];
        plans.filter(normalizeLayout);      // 行銷剛提交的還是 HTML，轉成樹再用
        savePlans();                        // localStorage 當本機快取
        if (!currentPlan) renderPlans();    // 已經開著檔期就別把人踢回列表
      }
    } catch (e){
      console.warn('開機同步失敗，先用本機資料', e);
    }
  }

  /* 行銷「提交給設計」會帶著 ?plan=<id> 跳過來，直接開到那一個檔期。
     沒接後端也要能用 —— 檔案帶入之後自己貼網址也是這條路。 */
  if (want && !currentPlan){
    // 草稿不給別人開：網址是最容易繞過清單的一條路
    const p = visiblePlans().find(x => x.id === want);
    if (p) openPlan(p);
    else toast(`找不到檔期（${want}）—— 可能還沒同步過來`, 'warn', 4000);
  }
})();
/* A window resize streams events; re-fitting the boards redraws every ruler
   tick and re-flows the sheet, so do it once per frame instead of per event. */
let resizeFrame = 0;
window.addEventListener('resize', () => {
  if (!currentPlan || resizeFrame) return;
  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = 0;
    fitBoards();
    syncRailTop();
    /* 拼板 也要跟著重排：以前只有 落版 重畫，於是在 拼板 縮視窗版位不動，
       等你下一次動到版面才一次跳過去。 */
    if (activeBlock) redrawSheet();
    if (boardCell) placeBoardStage(cardEl(boardCell.cell.id));
  });
});
})();
</script>
