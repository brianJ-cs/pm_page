    `${block.name}<span class="sub">第 ${at + 1} 格${
      cells[at].text ? '・' + cells[at].text : ''}</span>`;
  boardEl.querySelectorAll('.cell.editing').forEach(n => n.classList.remove('editing'));
  if (anchor) anchor.classList.add('editing');
  placeBoardStage(anchor);          // 設計釘左下角，PM 貼著那一格

  const f = document.getElementById('boardFrame');
  if (boardLoaded !== boardCell.cell.id){
    // ui=panel：那一頁只出借面板（PM 挑貨／設計 圖層），不是整個編輯器
    setPickFrame(f, 'ui=panel&role=' + canvasRole()
                  + '&block=' + encodeURIComponent(block.name)
                  + '&cell=' + encodeURIComponent(boardCell.cell.id));
    boardLoaded = boardCell.cell.id;
  } else tellBoardRole();      // 同一格再打開：iframe 沒重載，內容還在
  tellStageEditing();
}


function closeBoardCell(){
  boardCell = null;
  document.getElementById('boardStage').classList.remove('on');
  updateRailTab();
  boardEl.querySelectorAll('.cell.editing').forEach(n => n.classList.remove('editing'));
  tellStageEditing();
}

/* 哪一格正在編輯 —— 版上每一塊畫布都要知道，因為只有正在編輯的那一格
   摸得到（其餘的 pointer-events 是關的）。畫布靠這個決定要不要露出自己的
   小工具列和「刪掉的」那顆 ＋：關掉面板之後還留著一條工具列浮在版上，
   看起來就像那一格還開著。每塊畫布自己比對 id，這裡只管廣播。 */
function tellStageEditing(){
  const id = boardCell ? String(boardCell.cell.id) : '';
  boardEl.querySelectorAll('.ccanvas').forEach(f => {
    try { f.contentWindow.postMessage({ stageEditing: id }, '*'); } catch (_){}
  });
}

/* 格線看不看得到的開關。狀態留在這一頁（它是「你現在想怎麼看」，不是這個檔期的內容，
   所以不進 plan、也不必存），每一塊畫布各自照著做。
   開＝一直看得到，關＝一直看不到。格線不吸 —— 它是尺，不是軌道；還在吸的只有
   對齊線和格子中線（那是「跟某個東西切齊」，講得出名字），按住 Alt 連那個也不吸。 */
let gridLines = false;
function tellGridLines(){
  boardEl.querySelectorAll('.ccanvas').forEach(f => {
    try { f.contentWindow.postMessage({ gridLines }, '*'); } catch (_){}
  });
}
function setGridLines(on){
  gridLines = !!on;
  const b = document.getElementById('snapBtn');
  if (b) b.classList.toggle('on', gridLines);
  tellGridLines();
  toast(gridLines ? '顯示格線：開' : '顯示格線：關', 'ok', 1200);
}
document.getElementById('snapBtn').addEventListener('click', () => setGridLines(!gridLines));

/* 面板放哪裡，兩種身分不一樣。

   設計（圖層）：釘死在畫面左下角，壓在左邊那一欄上。圖層是「這一格裡有哪幾塊、
   誰疊在誰上面」，一邊拖版面一邊看，位置固定才不用一直重新找它；蓋住的左欄在
   拼一格的時候本來就用不到。高度也砍一半 —— 圖層通常只有幾筆，原本大半是空的。

   PM（挑貨）：維持原本的做法，貼著正在改的那一格放。PM 是一格一格挑貨，面板和
   「現在在挑哪一格」必須看得出是同一件事，跑掉就要重新對。

   兩種都一樣：版面本身一步都不動，開面板不該讓你盯著的那一格自己跑掉。 */
function placeBoardStage(anchor){
  const st = document.getElementById('boardStage');
  const gap = 10;
  const W = innerWidth, H = innerHeight;

  /* 面板大小固定 —— 不跟著內容伸縮。試過收到剛好包住內容，但那會讓面板每挑一次貨、
     每加一個圖層就跳一次高度，手要重新找它在哪，比底下留一塊空白更難用。 */
  if (myRole() !== 'pm'){                       // 設計：左下角，固定
    const w = Math.max(280, Math.min(470, W - gap * 2));
    const h = Math.max(150, Math.min(310, (H - gap * 2) / 2));
    st.style.width = w + 'px'; st.style.height = h + 'px';
    st.style.left  = gap + 'px';
    /* 用 bottom 定位，不是 top：收短的時候要從上緣收，下緣照樣貼著畫面底部。
       用 top 的話高度一變，整塊會浮起來，離下緣一段空白。 */
    st.style.bottom = gap + 'px';
    st.style.top = 'auto';
    return;
  }

  let w = Math.max(280, Math.min(470, W - gap * 2));
  let h = Math.max(240, Math.min(620, H - gap * 2));

  const r = anchor && anchor.getBoundingClientRect();
  if (!r || !r.width){
    st.style.width = w + 'px'; st.style.height = h + 'px';
    st.style.left = ((W - w) / 2) + 'px';
    st.style.top  = ((H - h) / 2) + 'px';
    return;
  }

  /* 面板浮在整個畫面上，蓋到小地圖、意見欄、旁邊的格子都沒關係 —— 唯一不能蓋的
     是正在改的那一格。所以看的是「整個視窗」剩多少空間，不是版面那一欄剩多少。 */
  const room = {
    r: W - (r.right + gap),
    l: r.left - gap,
    b: H - (r.bottom + gap),
    t: r.top - gap
  };
  const order = ['r', 'l', 'b', 't'];          // 左右優先：面板高、版面寬
  const need = k => (k === 'r' || k === 'l') ? w + gap : h + gap;

  let side = order.find(k => room[k] >= need(k));
  if (!side){                                   // 四邊都不夠：挑最大的一邊縮進去
    side = order.slice().sort((x, y) => room[y] - room[x])[0];
    if (side === 'r' || side === 'l') w = Math.max(260, Math.min(w, room[side] - gap));
    else                              h = Math.max(200, Math.min(h, room[side] - gap));
  }

  let x, y;
  if (side === 'r'){ x = r.right + gap; y = r.top + r.height / 2 - h / 2; }
  else if (side === 'l'){ x = r.left - gap - w; y = r.top + r.height / 2 - h / 2; }
  else if (side === 'b'){ y = r.bottom + gap; x = r.left + r.width / 2 - w / 2; }
  else { y = r.top - gap - h; x = r.left + r.width / 2 - w / 2; }

  // 收進視窗裡，但收完仍然不准壓到那一格
  x = Math.max(gap, Math.min(W - w - gap, x));
  y = Math.max(gap, Math.min(H - h - gap, y));
  if (side === 'r') x = Math.max(x, r.right + gap);
  if (side === 'l') x = Math.min(x, r.left - gap - w);
  if (side === 'b') y = Math.max(y, r.bottom + gap);
  if (side === 't') y = Math.min(y, r.top - gap - h);

  st.style.width = w + 'px';
  st.style.height = h + 'px';
  st.style.left = x + 'px';
  st.style.top  = y + 'px';
  st.style.bottom = 'auto';
}

/* PM 的面板是跟著那一格的，版面一捲就得重新對位，否則會跟那一格分家。
   設計那邊釘死在左下角，捲動不必重算 —— 所以這裡先問身分再決定要不要動。 */
let stageFrame = 0;
sheetMainEl.addEventListener('scroll', () => {
  if (!boardCell || stageFrame || myRole() !== 'pm') return;
  stageFrame = requestAnimationFrame(() => {
    stageFrame = 0;
    if (boardCell) placeBoardStage(cardEl(boardCell.cell.id));
  });
});

/** The card element for a cell id in whichever grid is on screen. */
const cardEl = id => boardEl.querySelector(`.cell[data-cell-id="${id}"]`);

/* ---- 那一格裡跑的畫布 ------------------------------------------------------
   有內容的格子裡放一個 iframe，載的是拼板那頁的畫布模式：它照這一格的大小把
   540×420 縮進去，所以版上看到的就是拼板本人，不是它的照片。
   旁邊那塊面板勾了什麼 → 這裡轉給該格的畫布 → 畫布自己排好、再把排好的樣子
   報回來存進檔期。存的只有資料，沒有畫面。 */
const canvasFrame = id => { const el = cardEl(id); return el && el.querySelector('.ccanvas'); };
const pickedOf = c => ((c.board && c.board.state && c.board.state.picked) || []);

addEventListener('message', e => {
  const d = e.data || {};
  if (!d.boardCell || !activeBlock) return;
  /* 認格子看 id，不是看「現在開著哪一格」 — 面板關掉的瞬間可能還有一份剛剛
     勾好的內容在路上，那也要收下來，不然那一下就白勾了。 */
  const target = (sheetOf(activeBlock).cells || [])
    .find(c => String(c.id) === String(d.boardCell));
  if (!target) return;

  /* 焦點在畫布裡的時候 Ctrl+Z 到不了這一層 —— 畫布把它轉過來，這裡照常走
     自己的歷史。畫布只轉「按了什麼」，回不回得去是這邊說了算。 */
  if (d.boardHistory){
    d.boardHistory === 'redo' ? redo() : undo();
    return;
  }

  if (d.ready){                       // iframe 起來了：身分、共用目錄和上次的內容送回去
    e.source.postMessage({ boardRole: canvasRole(),
                           catalogue: CATALOGUE || undefined,
                           /* 版面重畫時畫布是整批重掛的，開著的那一格也在裡面 ——
                              它一起來就要知道自己是不是那一格。 */
                           stageEditing: boardCell ? String(boardCell.cell.id) : '',
                           gridLines,       // 工具列那顆開關現在是開是關
                           boardRestore: (target.board || {}).state || null }, '*');
    return;
  }

  /* 面板那邊按了「刪掉」（圖層那一排）。面板報上來的版面狀態這裡一律不收，
     所以刪掉這件事是單獨一句話轉給那一格的畫布 —— 畫布刪完會自己報一份新的
     狀態上來，那一份才是存下來的。 */
  if (d.boardOff){
    const f = canvasFrame(target.id);
    if (f && f.contentWindow)
      try { f.contentWindow.postMessage({ boardOff: d.boardOff }, '*'); } catch (_){}
    return;
  }

  /* 後台改了商品目錄（加一列、貼一批、改機型或品牌）。目錄是全公司共用的，
     所以由這裡收下來、存上去、再發給其他每一塊畫布 —— 不然只有動手的那一格會變。 */
  if (d.catalogueSave){
    CATALOGUE = d.catalogueSave;
    const s = sync();
    if (s) s.queueCatalogue(CATALOGUE);
    /* 連動手的那一格也發回去。它的 ROWS 雖然已經是新的，但版面上的零件是照舊的
       名字排好的 —— 要走一次 applyCatalogue 才會清掉 layoutKey 重排。
       applyCatalogue 不會再往上報，所以不會繞回來。 */
    pushCatalogue();
    return;
  }

  /* 畫布拖進來一張商品圖。上傳由這裡做，不由畫布做 —— 金鑰只放在主程式這一邊，
     畫布在單檔版是 srcdoc 塞進去的，不該再拿到一份。畫布只負責把縮好的圖遞上來。 */
  if (d.imgUpload){
    const q = d.imgUpload;
    const back = m => { try { e.source.postMessage(m, '*'); } catch (_){} };
    const s = sync();
    if (!s || !s.uploadImage){
      back({ imgUploaded: { reqId: q.reqId, error: '還沒接上共用資料庫，圖存不起來' } });
      return;
    }
    (async () => {
      try {
        const blob = await (await fetch(q.dataUrl)).blob();
        back({ imgUploaded: { reqId: q.reqId, url: await s.uploadImage(q.name, blob) } });
      } catch (err){
        back({ imgUploaded: { reqId: q.reqId, error: String((err && err.message) || err) } });
      }
    })();
    return;
  }

  if (!d.state) return;

  if (d.src === 'panel'){
    /* 面板說了算的只有「挑了哪些」。位置歸畫布管，所以只把品項轉過去，
       讓那一格自己重排 — 畫好之後它會再報一次，那份才是最後存下來的。 */
    const had = pickedOf(target).length;
    const was = boardStateJson(target);
    /* 面板說了算的只有「挑了哪些」—— 它報上來的 blocks 一律不要。
       為什麼：面板那一頁沒有格子尺寸（它是挑貨面板，不是版面），所以它算版面時
       用的是預設的框；把它的座標存進來，畫布下次開起來就照著那個框的座標擺，
       跟自己真正的框對不上 —— 量到過整格內容擠在上半部（價格停在 49.7% 高）。
       位置永遠是畫布算的：picked 一變，畫布的 layoutKey 就對不上，自己會重排、
       再報一次，那一份才是存下來的。 */
    const prev = (target.board && target.board.state) || null;
    target.board = { state: Object.assign({}, prev || {}, { picked: d.state.picked || [] }) };
    const f = canvasFrame(target.id);
    if (f && f.contentWindow && had)
      try { f.contentWindow.postMessage({ boardPicked: d.state.picked || [] }, '*'); } catch (_){}
    else paintOneCanvas(target);      // 本來是空的：現在才長出畫布來
    markBadge(target);
    noteBoardChange(target, was);      // 勾了什麼是一步；沒變就不要多一步
    return;
  }
  /* 畫布開機時會先報一次「還沒排好」的空狀態，那一下不能把已經指派給這一格的
     品項清掉 —— 挑了什麼是面板（src==='panel'）說了算，畫布這一路只管位置。
     一次鋪滿 60 格特別容易撞到：整排畫布同時開機、同時報空，就把塞好的洗光。 */
  if ((!d.state.picked || !d.state.picked.length) && pickedOf(target).length) return;
  const wasBoard = boardStateJson(target);
  target.board = { state: d.state };  // 畫布報的（含每一塊的位置）
  if (!pickedOf(target).length) paintOneCanvas(target);   // 全取消了就把畫布撤掉
  else markBadge(target);
  /* 這一格報了新的需求＝同組的最小值可能變了，整個版位重算一次再發回去。
     排隊等一下：一次挑好幾格會連著報好幾次，收在一起算一次就好。 */
  queueType();
  noteBoardChange(target, wasBoard);  // 圖搬到哪裡是一步；只是開起來看不是
});

/* pushType 會讓每一塊畫布重排，所以不要一報就跑一次。 */
let typeTimer = 0;
function queueType(block){
  const b = block || activeBlock;
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => { pushType(b); syncTypeBar(); }, 80);
}

/* ---- 字級那一排 ---- */
const typeWrap  = document.getElementById('typeWrap');
const skuSizeEl = document.getElementById('skuSize');
const priceEls  = [1, 2, 3].map(n => document.getElementById('price' + n));

/** 把現在的設定寫回輸入框；沒設過的留空，placeholder 會顯示「自動」。 */
function syncTypeBar(){
  // 字級（SKU／價格大小）是設計排版的事，PM 只挑貨，不給他這一條。
  const on = activeTab === 'board' && !!activeBlock && activeMode !== 'pm';
  typeWrap.classList.toggle('on', on);
  if (!on) return;
  const t = typeOf(sheetOf(activeBlock));
  if (document.activeElement !== skuSizeEl) skuSizeEl.value = t.skuSize;
  priceEls.forEach((el, i) => {
    if (document.activeElement === el) return;     // 正在打字就別去動它
    const v = t.priceByCount[i + 1];
    el.value = v == null ? '' : v;
  });
}

skuSizeEl.addEventListener('input', () => {
  if (!activeBlock) return;
  const v = +skuSizeEl.value;
  if (!v || v < 4 || v > 60) return;               // 打到一半的數字先不要套
  typeOf(sheetOf(activeBlock)).skuSize = v;
  pushType(activeBlock);
  markDirty();                                     // 進歷史等放開手（change）
});
skuSizeEl.addEventListener('change', () => { if (activeBlock) commitAction(); });

priceEls.forEach((el, i) => {
  el.addEventListener('input', () => {
    if (!activeBlock) return;
    const raw = el.value.trim();
    const v = raw === '' ? null : +raw;
    if (v !== null && (!v || v < 8 || v > 200)) return;
    typeOf(sheetOf(activeBlock)).priceByCount[i + 1] = v;
    pushType(activeBlock);
    markDirty();
  });
  el.addEventListener('change', () => { if (activeBlock) commitAction(); });
});

/* 交還給自動：三個轉盤一起清掉，價格回到「同組取最小」那一套。 */
document.getElementById('typeReset').addEventListener('click', () => {
  if (!activeBlock) return;
  const t = typeOf(sheetOf(activeBlock));
  t.priceByCount = { 1:null, 2:null, 3:null };
  syncTypeBar();
  pushType(activeBlock);
  commitAction();
  toast('價格字級交回自動', 'info', 1400);
});

/* 商品版面那一頁要怎麼載進來。
   兩個檔案分開放：照原本的相對網址載。
   合成單檔（build-single.mjs）：整頁已經被塞在 window.__PICK_HTML 裡，
   改用 srcdoc 載 —— 那時候沒有網址可以帶參數，所以把參數先寫成一小段
   script 插在 <head> 後面，那一頁自己會去讀 window.__PICK_PARAMS。 */
function setPickFrame(f, query){
  if (window.__PICK_HTML){
    f.srcdoc = window.__PICK_HTML.replace('<head>',
      '<head><script>window.__PICK_PARAMS=' + JSON.stringify(query) + '<\/script>');
  } else {
    f.src = '2cell-product-pick.html?' + query;
  }
}

/** 這一格拼過了沒有。數字不再另外標 — 畫布本身就看得到裡面有什麼。 */
/* 畫布回報的狀態現在長什麼樣（沒有就是 null）。拿來比對「這一次回報有沒有真的變」。 */
const boardStateJson = c => JSON.stringify((c.board && c.board.state) || null);

/** 畫布回報之後：真的變了才算一步，只是開起來看不算。
    為什麼需要這個：一格第一次被打開時，畫布會把它算好的版面回報上來，於是
    `cell.board` 從沒有變成有 —— 資料上確實變了，但使用者什麼都沒做。
    照樣 commitAction() 的話，光是點開一格看一眼，復原鍵就亮起來說「剩 1 步」，
    而那一步退回去會把畫布狀態整個拿掉。存檔照舊（markDirty），只是不進歷史。 */
function noteBoardChange(c, was){
  const now = boardStateJson(c);
  const boot = was === 'null' && !pickedOf(c).length;   // 空格子開機報到
  if (!boot && now !== was) commitAction(); else markDirty();
}

function markBadge(c){
  if (activeTab !== 'board') return;
  const el = cardEl(c.id);
  if (!el) return;
  el.classList.toggle('filled', !!pickedOf(c).length);
  const b = el.querySelector('.cbadge');
  if (b) b.remove();                  // 舊版留下來的那顆，順手收掉
}

/* ==========================================================================
   標記／留言  (block-comment-demo_v3 + block-review-demo-v3 的做法搬進來)
   貼紙是實體：從右邊那欄拖一張下去，貼在你放手的位置，那就是一則問題。
   拖不動的時候先點貼紙、再點格子，一樣。
   每一則在右邊排成一張卡（像 Word 的註解欄）：誰標的、哪一格、什麼類型、
   說明、回覆、處理完沒有。點卡片就只看那一格。
   資料存在格子上（cell.notes），跟著檔期一起存。
   ========================================================================== */

/* 三種貼紙，但**不是兩邊都看得到**：
     PM   → 三種都有。補貼紙／補贈品是「請設計補一個東西」，那是 PM 在提需求。
     設計 → 只有留言。設計是收需求、回需求的那一方，對自己開「補贈品」講不通，
            但還是需要在某一格留一句話（這裡等圖、這格先別動）。
   誰看得到哪幾種寫在 kindsFor() 裡，NOTE_KINDS 本身是完整的三種 ——
   意見欄要認得出別人貼的是哪一種，所以清單不能照身分砍。
   留言沒有圖示：另外兩種是「要補一個東西」，這一種只是講一句話，沒有東西可以
   畫成符號，硬給一個點反而看起來像少了什麼。 */
const NOTE_KINDS = [
  { key:'sticker', icon:'★', label:'補貼紙', color:'#ffd447' },
  { key:'gift',    icon:'⊕', label:'補贈品', color:'#8ce29b' },
  { key:'other',   icon:'',  label:'留言',   color:'#dfe4ee' }
];
/** 這個身分貼得出哪幾種。設計只有留言，PM 三種都有。 */
const kindsFor = role => role === 'pm' ? NOTE_KINDS : NOTE_KINDS.filter(k => k.key === 'other');
// 認不得的（含舊檔裡的 補商品／補 logo）一律當留言看
const kindOf = k => NOTE_KINDS.find(n => n.key === k) || NOTE_KINDS[NOTE_KINDS.length - 1];
/* 沒有圖示的那一種不要留一個空的 <span> —— 它照樣佔 gap，看起來像圖示掉了 */
const icoHTML = k => k.icon ? `<span class="ico">${k.icon}</span>` : '';
const notesOf = c => (c.notes || (c.notes = []));
const openNotes = c => notesOf(c).filter(n => !n.done).length;

/* 一個版位上還沒處理的貼紙，照種類點一遍。小地圖上一塊只有幾十 px，
   放不下一張一張的貼紙 —— 所以每一種只畫一枚，數量寫在旁邊。
   只算沒處理的，跟格子上那顆紅色數字（openNotes）同一個意思：
   同一個數字在兩個地方要講同一件事，不然對不起來。 */
/* 貼紙一增一減一處理完，小地圖上那顆數字就得跟著動 —— 不然它講的是上一次
   進來的事。PM 那邊左欄是品類樹、沒有這個統計，所以不用重畫。 */
function refreshNoteCounts(){
  if (activeMode !== 'pm') renderMinimap();
}

function noteRollup(block){
  const cells = (block && block.sheet && block.sheet.cells) || [];
  const byKind = new Map();
  let total = 0;
  cells.forEach(c => notesOf(c).forEach(n => {
    if (n.done) return;
    const k = kindOf(n.key);
    byKind.set(k.key, (byKind.get(k.key) || 0) + 1);
    total++;
  }));
  return {
    total,
    kinds: NOTE_KINDS.filter(k => byKind.has(k.key))
                     .map(k => ({ k, n: byKind.get(k.key) }))
  };
}
/* 顏色回答「誰貼的」，圖示回答「哪一種」，角落那個字回答「哪一位」。
   一個管道一件事 —— 以前顏色管種類，結果版上最搶眼的訊號在回答最不急的問題。
   只分兩色：設計一色、PM 一色。十一位 PM 十一個顏色沒有人記得住。 */
/* 設計＝淡紫、PM＝黃。兩個都不用藍（藍是「你正在點的東西」）、不用綠
   （綠是「在對方手上」）、不用粉（粉是小地圖上的版位）—— 一個顏色只講一件事。 */
/* 便利貼的顏色＝誰貼的。設計本來是淡紫（#d9d3f4），在白底版面上太淺看不清 ——
   改成看得見的天藍 #87CEEB。PM 維持黃。 */
const ROLE_COLOR = { design:'#87CEEB', pm:'#ffd447' };
const roleOfNote = n => {
  if (n && n.whoId) return n.whoId === 'design' ? 'design' : 'pm';
  return (n && n.who === '設計') ? 'design' : 'pm';       // 舊資料照名字認
};
const noteColor = n => ROLE_COLOR[roleOfNote(n)] || ROLE_COLOR.pm;
const myRole = () => activeMode === 'pm' ? 'pm' : 'design';
/* 行銷：版面是他開的檔，所以 落版 照樣改得動；拼板 是設計和 PM 在做事的地方，
   他只能看。他不在那串關裡（提明細→製作→…全是 PM 和設計），所以也不蓋章、
   不指派、不貼貼紙 —— 那些都是「在做這件事的人」之間的動作。
   myRole() 對他回 'design'：棒子、貼紙顏色那些地方要有一個答案，而他站在
   設計這一邊看版。真正擋住他的是下面幾個 isMkt() 的閘。 */
const isMkt = () => activeMode === 'marketing';
/* 畫布裡的身分只有兩種。行銷送 'pm' 過去 —— 那一邊的規矩就是「零件只能看不能搬」，
   正好是要給行銷的。 */
const canvasRole = () => (activeMode === 'pm' || isMkt()) ? 'pm' : 'design';
/* 先不分工：一位 PM 顧整本 DM。分工的程式碼原封不動留著 —— 要恢復「每個 PM
   顧不同品類」，把這一行改回 true 就好，其他地方都問這個旗標。 */
const PM_SPLIT = false;
const ownedByMe = name => !PM_SPLIT || pmOwner[name] === activePM;
/* 誰貼的：名字給人看，id 給程式認（改名字不該讓舊的便利貼變成別人的）。 */
const whoAmI = () => activeMode === 'pm' ? (pmName(activePM) || 'PM')
                   : (activeMode === 'marketing' ? '行銷' : '設計');
const whoIdNow = () => activeMode === 'pm' ? ('pm:' + activePM) : 'design';
const isMine = n => {
  if (!n) return false;
  if (n.whoId) return n.whoId === whoIdNow();
  /* 舊的便利貼只記了「PM」或「設計」，沒記是哪一位 —— 那時候 PM 只有一個。
     現在 whoAmI() 會回「PM 甲」，直接比字串的話那些舊貼紙就變成沒有人的，
     連貼的人自己都動不了。所以舊資料一律照身分算。 */
  if (n.who === 'PM') return activeMode === 'pm';
  return n.who === whoAmI();
};
/* 便利貼角落那一個字：認得出是誰貼的，又不佔地方。PM 甲 → 甲，設計 → 設。 */
const whoMark = name => {
  const t = String(name || '').trim();
  if (!t) return '?';
  if (t.indexOf('設計') === 0) return '設';
  return t.slice(-1);
};
const stamp = () => {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${
    String(d.getMinutes()).padStart(2,'0')}`;
};
const escapeHtml = t => String(t).replace(/[&<>"]/g,
  ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[ch]));

/* ⚠️ 便利貼的任何動作都不進復原：貼、搬、寫字、標已處理、撕掉，一律只 markDirty()。
   復原是「版面排錯了，退回去」——而便利貼不是版面，是兩個人之間的對話。
   把對話丟進同一個 Ctrl+Z 裡會很難解釋：設計按一次復原，PM 剛剛問的那句話就沒了，
   而 PM 那邊完全不知道發生什麼事。要收回自己那則就用「撕掉」，那是講得清楚的動作。 */
const boardOv = document.getElementById('boardOverview');
let showMarks = true;
let armedKind = null;     // 點了貼紙、還沒點格子
let focusCell = null;     // 意見欄只看這一格
let selNote = null;       // 展開中的那一則
let typeFilter = null;    // 只看某一種貼紙

/* ---- 貼紙欄 ---- */
NOTE_KINDS.forEach(k => {
  const b = document.createElement('div');
  b.className = 'stick';
  b.draggable = true;
  b.dataset.key = k.key;
  b.dataset.role = '';                 // 顏色由 paintStickTray() 照身分上
  b.title = `拖到格子上＝標一則「${k.label}」`;
  b.innerHTML = `${icoHTML(k)}${k.label}`;
  b.addEventListener('dragstart', e => {
    armKind(null);
    e.dataTransfer.setData('text/plain', 'note:' + k.key);
    e.dataTransfer.effectAllowed = 'copy';
  });
  b.addEventListener('click', () => armKind(armedKind === k.key ? null : k.key));
  document.getElementById('stickRow').appendChild(b);
});

/** 貼紙欄那三張＝你自己的顏色。換身分就換一疊，看得出等一下貼出去是什麼顏色。 */
/* 貼紙欄照身分給：PM 三種、設計只有留言（見 kindsFor）。
   三張都先建好、這裡再收掉不該有的那幾張 —— 換身分是常常在做的事，
   每換一次就重建一次 DOM，拖曳中的狀態、剛按下去的那張都會跟著不見。 */
function paintStickTray(){
  // 行銷不貼貼紙：便利貼是設計和 PM 之間的對話
  const allow = new Set(isMkt() ? [] : kindsFor(myRole()).map(k => k.key));
  document.querySelectorAll('.stick').forEach(b => {
    b.style.display = allow.has(b.dataset.key) ? '' : 'none';
  });
  if (armedKind && !allow.has(armedKind)) armKind(null);   // 換身分時手上那張要放下
  const c = ROLE_COLOR[myRole()];
  document.querySelectorAll('.stick').forEach(b => { b.style.background = c; });
  const hint = document.querySelector('#stickTray .hint');
  if (hint) hint.textContent = `${whoAmI()}的貼紙 — 拖到格子上（或先點貼紙，再點格子）`;
}
/* 注意：這個函式問的是 activeMode / activePM，兩個都在這一行之後才宣告 ——
   所以不要在這裡直接叫它（會 ReferenceError，整支程式就停在這裡）。
   換身分時 applyMode() 會叫，開檔期列表時最下面那段開場也會叫。 */

/** 點了貼紙就是「拿在手上」，下一次點格子就貼上去。 */
function armKind(key){
  armedKind = key;
  document.querySelectorAll('.stick').forEach(b =>
    b.classList.toggle('armed', b.dataset.key === key));
  const hint = document.getElementById('armHint');
  hint.classList.toggle('on', !!key);
  if (key) hint.textContent = `手上拿著「${kindOf(key).label}」— 點一格貼上去（Esc 放下）`;
  document.getElementById('boardOverview').classList.toggle('arming', !!key);
}

/* ---- 拖到格子上 ---- */
const cellUnder = (x, y) => {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest ? el.closest('#boardOverview .cell') : null;
  /* 別人手上的格不能往上面貼新的便利貼：那是他正在動的地方，貼上去等於插話。
     已經貼在上面的照樣看得到、回得了 —— 擋的是「新貼」，不是「看」。 */
  return (cell && cell.classList.contains('notmine')) ? null : cell;
};
let dropHot = null;
function hotCell(el){
  if (dropHot === el) return;
  if (dropHot) dropHot.classList.remove('drop');
  dropHot = el;
  if (dropHot) dropHot.classList.add('drop');
}
boardOv.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  hotCell(cellUnder(e.clientX, e.clientY));
});
boardOv.addEventListener('dragleave', e => { if (e.target === boardOv) hotCell(null); });
boardOv.addEventListener('drop', e => {
  e.preventDefault();
  const data = e.dataTransfer.getData('text/plain') || '';
  hotCell(null);
  if (data.indexOf('note:') !== 0) return;
  const el = cellUnder(e.clientX, e.clientY);
  if (el) dropNote(data.slice(5), el, e.clientX, e.clientY);
});

/** 貼上去：位置記成那一格的百分比，縮放、換視窗都還是貼在同一個地方。 */
function dropNote(key, el, cx, cy){
  if (!activeBlock) return;
  const c = (sheetOf(activeBlock).cells || []).find(x => String(x.id) === el.dataset.cellId);
  if (!c) return;
  const r = el.getBoundingClientRect();
  const n = {
    id: 'n' + Date.now() + Math.random().toString(36).slice(2,5),
    key, text: '', who: whoAmI(), whoId: whoIdNow(), time: stamp(), done: false,
    x: Math.max(8, Math.min(92, ((cx - r.left) / r.width) * 100)),
    y: Math.max(8, Math.min(92, ((cy - r.top) / r.height) * 100)),
    replies: []
  };
  notesOf(c).push(n);
  markDirty();                        // 便利貼不進復原（見 renderRail 那段說明）
  selNote = n.id;
  focusCell = c.id;                 // 貼完就只看這一格，話講完再回去
  armKind(null);
  setRail(true);                      // 貼完要看得到那張卡
  paintAllNoteMarks();
  renderRail();
  refreshNoteCounts();
  applyFocusCell();
  toast(`貼上「${kindOf(key).label}」`, 'ok', 1500);

  /* 卡片同時開在貼紙旁邊，不是只出現在右邊那一欄。剛貼完的下一件事一定是打字，
     而你的眼睛還在剛剛放手的位置 —— 要人先去右邊找那張卡才能打，等於每貼一張
     都要重新對焦一次。這跟點一張已經貼好的貼紙走的是同一條路（selectNote）。 */
  const mark = boardEl.querySelector(`.cmk[data-note="${n.id}"]`);
  const at = (sheetOf(activeBlock).cells || []).indexOf(c);
  if (mark) openNotePop(c, n, at, mark);
  else {
    const ta = document.querySelector('.icard.sel textarea');
    if (ta) ta.focus();
  }
}

/* ---- 格子上的貼紙 ---- */
function paintNoteMarks(c){
  if (activeTab !== 'board') return;      // 落版 的卡片上不該有貼紙
  const el = cardEl(c.id);
  if (!el) return;
  el.querySelectorAll('.cmk,.cnb').forEach(n => n.remove());
  const list = notesOf(c);
  if (!list.length) return;

  fanOut(list.filter(n => !typeFilter || n.key === typeFilter)).forEach(({ n, x, y }) => {
    const k = kindOf(n.key);
    const i = document.createElement('i');
    i.className = 'cmk' + (n.done ? ' done' : '') + (selNote === n.id ? ' sel' : '');
    i.dataset.note = n.id;          // 剛貼完要立刻把卡片開在它旁邊，得找得到這一張
    i.contentEditable = 'false';
    i.style.background = noteColor(n);
    i.style.left = x + '%';
    i.style.top  = y + '%';
    // 每張歪的角度不一樣，像是一張一張用手貼上去的
    i.style.setProperty('--rot', noteTilt(n.id) + 'deg');
    const mine = isMine(n);
    i.classList.toggle('theirs', !mine);
    i.title = `${k.label}${n.text ? '：' + n.text : ''}\n${n.who} 貼的\n`
            + (mine ? '拖＝換位置，點＝看那一則' : '點＝看那一則（別人的貼紙不能搬）');
    i.textContent = k.icon;
    // 角落那一個字：一眼看得出是誰貼的
    const sig = document.createElement('b');
    sig.className = 'cmk-who';
    sig.textContent = whoMark(n.who);
    i.appendChild(sig);
    i.addEventListener('pointerdown', e => startNoteDrag(e, c, n, i));
    el.appendChild(i);
  });

  const open = openNotes(c);
  if (open){
    const b = document.createElement('span');
    b.className = 'cnb';
    b.contentEditable = 'false';
    b.title = open + ' 則還沒處理';
    b.textContent = open;
    el.appendChild(b);
  }
}
function paintAllNoteMarks(){
  if (activeTab !== 'board' || !activeBlock) return;
  (sheetOf(activeBlock).cells || []).forEach(paintNoteMarks);
}

/* 兩張貼在同一個地方＝下面那張等於不存在。畫的時候把疊在一起的往外撥開，
   撥的是「畫面上的位置」，資料不動 —— 你貼在哪裡還是貼在哪裡。 */
const FAN_R = 7;                     // 撥開的距離（格子寬的 %）
function fanOut(list){
  const placed = [];
  const near = (a, b) => Math.abs(a.x - b.x) < 6 && Math.abs(a.y - b.y) < 6;
  return list.map(n => {
    let x = n.x, y = n.y, step = 0;
    while (step < 12 && placed.some(p => near(p, { x, y }))){
      step++;
      const a = step * 2.4;          // 一圈一圈往外的螺旋
      const r = FAN_R * (1 + step * .13);
      x = n.x + Math.cos(a) * r;
      y = n.y + Math.sin(a) * r;
    }
    x = Math.max(6, Math.min(94, x));
    y = Math.max(6, Math.min(94, y));
    placed.push({ x, y });
    return { n, x, y };
  });
}

/** 同一則永遠歪同一個角度（-5°～5°），重畫也不會自己跳。 */
function noteTilt(id){
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 1000;
  return (h % 101) / 10 - 5;
}
const cellOfEl = el => el && activeBlock
  ? (sheetOf(activeBlock).cells || []).find(c => String(c.id) === el.dataset.cellId)
  : null;

/** 點一張便利貼 = 在意見欄裡挑出那一則。不開格子的面板：
    貼紙講的是「這裡有問題」，不是「我要編這一格」。
    也不動意見欄現在在看哪一份名單 —— 點下去只是把那張卡挑出來、捲到眼前，
    放開之後名單還在原地，不會自己跳回「全部問題」。 */
/* 點一張貼紙，就在那張貼紙旁邊開一張卡 —— 話是講那個位置的事，眼睛不必離開
   版面跑到右邊那一欄去找。意見欄還在：那邊回答「這個版位還欠哪些」，
   這裡回答「這一張說了什麼」。
   卡片掛在 <body> 上，不掛進格子裡：格子會裁切、會跟著版面捲，掛進去就被切掉。 */
let notePop = null;

function closeNotePop(){
  if (!notePop) return;
  notePop.remove();
  notePop = null;
}

function positionNotePop(){
  if (!notePop || !notePop._anchor || !notePop._anchor.isConnected){ closeNotePop(); return; }
  const a = notePop._anchor.getBoundingClientRect();
  const r = notePop.getBoundingClientRect();
  // 先站右邊；右邊放不下就翻到左邊。兩邊都塞不下才貼著邊界。
  let x = a.right + 10;
  if (x + r.width + 8 > innerWidth) x = a.left - r.width - 10;
  x = Math.max(8, Math.min(x, innerWidth - r.width - 8));
  let y = Math.max(8, Math.min(a.top - 6, innerHeight - r.height - 8));
  notePop.style.left = x + 'px';
  notePop.style.top  = y + 'px';
}

function openNotePop(cell, n, at, anchorEl){
  closeNotePop();
  if (!anchorEl) return;
  const host = document.createElement('div');
  host.className = 'note-pop';
  host.appendChild(noteCard({ n, cell, at }));
  document.body.appendChild(host);
  host._anchor = anchorEl;
  notePop = host;
  positionNotePop();
  const t = host.querySelector('textarea');
  if (t) t.focus();
}

function selectNote(c, n, anchorEl){
  if (boardCell) closeBoardCell();
  /* 同一則再點一次＝放開它。但卡片可能剛剛因為資料變動被收掉了（寫完說明、
     標成已處理），這一則卻還選著 —— 那時候再點的意思是「把卡片再開一次」，
     不是取消，不然你得點兩下才看得到它。 */
  if (selNote === n.id && notePop){ clearNoteSel(); return; }
  selNote = n.id;
  // 那一則正被篩選擋著（在看別格、或只看某一種）：先把篩選拿掉，不然點了沒東西出來
  const shown = (!focusCell || focusCell === c.id) && (!typeFilter || typeFilter === n.key);
  if (!shown){ focusCell = null; typeFilter = null; }
  setRail(true);
  renderRail(); applyFocusCell(); paintAllNoteMarks();
  const card = document.querySelector('.icard.sel');
  if (card) card.scrollIntoView({ block:'nearest' });
  /* 貼紙是重畫過的，剛剛點的那一個 DOM 已經不在了 —— 照 id 去找現在那一張 */
  const live = anchorEl && !anchorEl.isConnected
    ? boardEl.querySelector(`.cmk.sel`) : anchorEl;
  const at = (sheetOf(activeBlock).cells || []).indexOf(c);
  if (live) openNotePop(c, n, at, live);
  else if (card){
    const t = card.querySelector('textarea');
    if (t) t.focus();
  }
}

/** 放開手上那一則：意見欄回到「全部問題」—— 只看某一格、只看某一種，
    這些篩選也一起拿掉，回來就是完整的一份名單。 */
function clearNoteSel(){
  closeNotePop();
  if (!selNote && !focusCell && !typeFilter) return;
  selNote = null; focusCell = null; typeFilter = null;
  renderRail(); applyFocusCell(); paintAllNoteMarks();
}

/* ---- 把貼在格子上的便利貼再挪一次：拖到哪就黏到哪，跨格也行 ---- */
let noteDrag = null;
function startNoteDrag(e, c, n, el){
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();                 // 這是拖貼紙，不是拖整張版
  /* 別人的便利貼不給搬：它貼的位置就是它在講的地方，被人挪走了，那句話就沒有
     對象了。點還是點得開 —— 看和回覆是所有人的事。 */
  noteDrag = { c, n, el, host: el.parentElement, target: el.parentElement,
               x: e.clientX, y: e.clientY, moved: false, locked: !isMine(n) };
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
}
document.addEventListener('pointermove', e => {
  if (!noteDrag || noteDrag.locked) return;
  if (!noteDrag.moved){
    if (Math.abs(e.clientX - noteDrag.x) + Math.abs(e.clientY - noteDrag.y) < 5) return;
    noteDrag.moved = true;
    noteDrag.el.classList.add('dragging');
    hideTip();
  }
  // 經過哪一格就跟到哪一格，位置一律記成那一格的百分比
  const over = cellUnder(e.clientX, e.clientY) || noteDrag.target;
  if (over !== noteDrag.target){
    noteDrag.target = over;
    over.appendChild(noteDrag.el);
  }
  const r = noteDrag.target.getBoundingClientRect();
  noteDrag.px = Math.max(8, Math.min(92, ((e.clientX - r.left) / r.width) * 100));
  noteDrag.py = Math.max(8, Math.min(92, ((e.clientY - r.top)  / r.height) * 100));
  noteDrag.el.style.left = noteDrag.px + '%';
  noteDrag.el.style.top  = noteDrag.py + '%';
});
function endNoteDrag(){
  if (!noteDrag) return;
  const d = noteDrag;
  noteDrag = null;
  d.el.classList.remove('dragging');
  if (d.locked){ selectNote(d.c, d.n, d.el); return; }     // 別人的：只能看，不能搬
  if (!d.moved){ selectNote(d.c, d.n, d.el); return; }

  const to = cellOfEl(d.target) || d.c;
  d.n.x = d.px; d.n.y = d.py;
  if (to !== d.c){                     // 挪到別格去了：那一則就換人家的了
    const list = notesOf(d.c), i = list.indexOf(d.n);
    if (i >= 0) list.splice(i, 1);
    notesOf(to).push(d.n);
    if (focusCell === d.c.id) focusCell = to.id;
  }
  markDirty();                       // 便利貼不進復原
  paintAllNoteMarks(); renderRail(); applyFocusCell();
}
document.addEventListener('pointerup', endNoteDrag);
document.addEventListener('pointercancel', endNoteDrag);

/* 版面一捲一縮，貼紙就跑了 —— 卡片是 fixed 的，不跟著跑就會指著空白的地方。
   捲動不會冒泡，所以要用捕獲階段收；視窗變大變小同理。 */
addEventListener('scroll', positionNotePop, true);
addEventListener('resize', positionNotePop);

/* ---- 意見欄 ---- */
const railList = document.getElementById('railList');

/** 這張版上所有的問題，攤平成一列，記得它是第幾格的。 */
function allNotes(){
  if (!activeBlock) return [];
  const out = [];
  (sheetOf(activeBlock).cells || []).forEach((c, at) => {
    notesOf(c).forEach(n => out.push({ n, cell:c, at }));
  });
  return out;
}
function railNotes(){
  return allNotes().filter(x =>
    (!focusCell || x.cell.id === focusCell) &&
    (!typeFilter || x.n.key === typeFilter));
}

function renderRail(){
  /* 跳出來那張卡是複製的一份，內容一改（寫了說明、標成已處理、撕掉）就過期了 ——
     意見欄每次重畫都代表資料動過，順手把它收掉。點貼紙那條路是先重畫、
     再開一張新的，所以不會把自己關掉。 */
  closeNotePop();
  const list = railNotes();
  const open = list.filter(x => !x.n.done).length;
  const here = focusCell ? allNotes().find(x => x.cell.id === focusCell) : null;
  document.getElementById('railTitle').textContent =
    focusCell ? `第 ${here ? here.at + 1 : 1} 格的問題` : '全部問題';
  document.getElementById('railBack').classList.toggle('on', !!focusCell);
  document.getElementById('railSub').textContent =
    `${list.length} 則・${open} 則還沒處理`;
  updateRailTab();
  renderLegend();

  railList.innerHTML = '';
  if (!list.length){
    railList.innerHTML =
      '<div id="railEmpty">還沒有人標東西<br>把上面的貼紙拖到格子上</div>';
    return;
  }
  // 沒處理的一律在上面：要動手的事不能被壓在底下
  /* 選中的那一則排到最上面：點了版上那張便利貼，這一欄就該把它端到眼前，
     而不是讓你自己在清單裡找。其次才是「還沒處理的在前面」。 */
  list.slice().sort((a,b) =>
        (a.n.id === selNote ? -1 : b.n.id === selNote ? 1 : 0)
        || (a.n.done?1:0) - (b.n.done?1:0))
      .forEach(x => railList.appendChild(noteCard(x)));
}

function renderLegend(){
  const host = document.getElementById('railLegend');
  /* 篩選鈕列的是「版上有哪幾種」，不是「我貼得出哪幾種」—— 設計只貼得了留言，
     但他要看得到 PM 貼的補貼紙、補贈品，也要篩得動。所以這裡用完整的 NOTE_KINDS。
     只剩一種的話這一排按不出任何差別，整排收起來。 */
  if (NOTE_KINDS.length < 2){ host.innerHTML = ''; host.style.display = 'none'; return; }
  host.style.display = '';
  const base = allNotes().filter(x => !focusCell || x.cell.id === focusCell);
  host.innerHTML = '';
  NOTE_KINDS.forEach(k => {
    const n = base.filter(x => x.n.key === k.key && !x.n.done).length;
    const b = document.createElement('button');
    b.className = 'lg' + (typeFilter === k.key ? ' on' : '') + (n ? '' : ' zero');
    b.style.setProperty('--lc', '#c9d8f8');   // 顏色歸「誰貼的」用，種類看圖示
    b.textContent = `${k.icon ? k.icon + ' ' : ''}${k.label} ${n}`;
    b.addEventListener('click', () => {
      typeFilter = typeFilter === k.key ? null : k.key;   // 單選，再點一次取消
      selNote = null;
      renderRail(); paintAllNoteMarks();
    });
    host.appendChild(b);
  });
}

function noteCard(x){
  const n = x.n, cell = x.cell, at = x.at;
  const k = kindOf(n.key);
  const sel = selNote === n.id;
  const d = document.createElement('div');
  d.className = 'icard' + (n.done ? ' done' : '') + (sel ? ' sel' : '');
  d.style.setProperty('--nc', noteColor(n));
  d.innerHTML =
    `<div class="chead"><span class="who">${escapeHtml(n.who)}</span>
       <span class="where">第 ${at + 1} 格</span>
       <span class="state">${n.done ? '已處理' : '還沒處理'}</span></div>
     <div class="kind">${icoHTML(k)}${k.label}</div>
     <div class="body${n.text ? '' : ' blank'}">${
       n.text ? escapeHtml(n.text) : '（貼上去的，還沒寫說明）'}</div>
     <div class="meta">${n.time}</div>`;

  if (n.replies && n.replies.length){
    const rp = document.createElement('div');
    rp.className = 'replies';
    n.replies.forEach(r => {
      const w = document.createElement('div');
      w.className = 'reply';
      w.innerHTML = `<div class="who">${escapeHtml(r.who)}</div>
        <div class="rtext">${escapeHtml(r.text)}</div>
        <div class="meta">${r.time}</div>`;
      rp.appendChild(w);
    });
    d.appendChild(rp);
  }

  /* 誰標的就是誰的話：別人只能在下面接話，不能動上面那句。
     自己那則、而且還沒寫過說明，才輪得到「寫上說明」。 */
  const mine = isMine(n);
  const canWrite = mine && !n.text;

  // 展開時才給輸入框：沒展開的卡片維持一眼掃得完
  const box = document.createElement('div');
  box.className = 'box';
  if (!mine){
    const own = document.createElement('div');
    own.className = 'owned';
    own.textContent = `這則是「${n.who}」標的 — 你可以回覆，但不能改它`;
    box.appendChild(own);
  }
  const ta = document.createElement('textarea');
  ta.placeholder = canWrite ? '寫說明…（Enter 送出，可以不寫）' : '回覆…（Enter 送出）';
  const acts = document.createElement('div');
  acts.className = 'acts';
  const send = document.createElement('button');
  send.className = 'send';
  send.textContent = canWrite ? '寫上說明' : '回覆';
  const ok = document.createElement('button');
  ok.className = 'ok';
  ok.textContent = n.done ? '改回沒處理' : '標成已處理';
  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '撕掉';

  const commit = () => {
    const v = ta.value.trim();
    if (!v) return;
    // 只有本人補得了自己那則的內容，其他人一律變成一則回覆
    if (canWrite && !n.text) n.text = v;
    else (n.replies || (n.replies = [])).push({ who: whoAmI(), whoId: whoIdNow(),
                                                text: v, time: stamp() });
    ta.value = '';
    markDirty(); renderRail(); paintNoteMarks(cell);   // 便利貼不進復原
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commit(); }
    e.stopPropagation();
  });
  send.addEventListener('click', e => { e.stopPropagation(); commit(); });
  ok.addEventListener('click', e => {
    e.stopPropagation();
    n.done = !n.done;
    markDirty(); renderRail(); paintNoteMarks(cell); refreshNoteCounts();
  });
  del.addEventListener('click', e => {
    e.stopPropagation();
    const list = notesOf(cell), i = list.indexOf(n);
    if (i >= 0) list.splice(i, 1);
    if (selNote === n.id) selNote = null;
    markDirty(); renderRail(); paintNoteMarks(cell); refreshNoteCounts();
  });
  acts.append(send);
  /* 「標成已處理」只有設計按得到。便利貼多半是 PM 提的問題，而處理掉它的人是設計 ——
     讓提問的人自己勾「已處理」，那個勾就不再代表「這件事解決了」，只代表「我覺得可以了」，
     於是那個數字（還沒處理 N 則）就不能當進度看。PM 想收回自己那則就用「撕掉」。 */
  if (myRole() !== 'pm') acts.append(ok);
  if (mine) acts.append(del);          // 撕掉別人的標記不是你的權限
  box.append(ta, acts);
  d.appendChild(box);

  d.addEventListener('click', e => {
    if (e.target.closest('.box')) return;
    selNote = sel ? null : n.id;
    if (!focusCell) focusCell = cell.id;            // 從全部點進來 = 只看那一格
    renderRail(); applyFocusCell(); paintAllNoteMarks();
    const t = document.querySelector('.icard.sel textarea');
    if (t) t.focus();
  });
  return d;
}

document.getElementById('railBack').addEventListener('click', () => {
  focusCell = null; selNote = null;
  renderRail(); applyFocusCell(); paintAllNoteMarks();
});

/* 意見欄要不要收成一條，由你決定 — 不再跟著面板自動開合，版面才不會自己挪。
   面板是浮的，擋到意見欄就擋到，關掉就看得見。 */
let railPushedW = '';        // 你自己推出來的寬度，收起來的時候先收在這裡
function setRail(open){
  const rail = document.getElementById('boardRail');
  const app = document.querySelector('.app');
  rail.classList.toggle('mini', !open);
  app.classList.toggle('rail-mini', !open);
  /* 推過寬度的話，那個寬度是寫在 .app 身上的行內樣式 —— 它會蓋過收合用的規則。
     所以收起來時先把它拿下來，展開時再放回去。 */
  if (!open){
    railPushedW = app.style.getPropertyValue('--railw');
    app.style.removeProperty('--railw');
  } else if (railPushedW){
    app.style.setProperty('--railw', railPushedW);
  }
  if (railFold) railFold.paint();
  updateRailTab();
}
function updateRailTab(){
  if (!railFold || !railFold.tabCount) return;
  const n = allNotes().filter(x => !x.n.done).length;
  railFold.tabCount.textContent = n;
  railFold.tabCount.className = 'n' + (n ? '' : ' zero');
}
/* 意見欄的把手：貼在它左緣的正中間，凸在版面上，收起來也還在原地。
   上面那顆紅點是「還沒處理」的數量 —— 收起來了也看得到還欠幾件。 */
const railFold = makeFoldBar('right', () => document.getElementById('boardRail'),
                             '收起／展開意見欄');
railFold.tabCount = document.createElement('span');
railFold.tabCount.className = 'n';
railFold.querySelector('.fold-tab').appendChild(railFold.tabCount);
document.getElementById('boardRail').appendChild(railFold);

/** 只看一格的時候，版上其他格子讓開 — 眼睛不必自己找。 */
function applyFocusCell(){
  const ov = document.getElementById('boardOverview');
  ov.classList.toggle('focusing', !!focusCell);
  boardEl.querySelectorAll('.cell').forEach(el =>
    el.classList.toggle('focus', !!focusCell && el.dataset.cellId === focusCell));
  if (focusCell){
    const el = cardEl(focusCell);
    if (el) el.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
  }
}

document.getElementById('markToggle').addEventListener('change', e => {
  showMarks = e.target.checked;
  document.getElementById('boardOverview').classList.toggle('nomarks', !showMarks);
  toast(showMarks ? '顯示便利貼' : '便利貼先收起來', 'info', 1400);
});

// Esc：先放下手上的貼紙，再收合卡片，最後回到全部
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || activeTab !== 'board') return;
  if (armedKind){ armKind(null); e.stopPropagation(); return; }
  if (selNote){ selNote = null; renderRail(); paintAllNoteMarks(); e.stopPropagation(); return; }
  if (focusCell){
    focusCell = null; renderRail(); applyFocusCell(); paintAllNoteMarks();
    e.stopPropagation();
  }
}, true);

/** 這一格該不該有畫布：有挑東西就給它一個，沒有就撤掉。 */
/* ---- 字級：一個版位一套 ----------------------------------------------------
   規格談定的是「同一個版位裡，價格數一樣的格子，價格就一樣大」——
   作用範圍是版位，不是整份 DM，版位跟版位之間本來就可以不一樣。

   住在 sheet 身上（跟 rows／masthead 放一起），也就住在 plan.layout
   底下 —— snapshot() 一序列化就有了，存檔和 Ctrl+Z 是免費的。

   priceByCount 存的是絕對 px：轉盤蓋過自動縮放，「一樣大」就該是一樣的 px。
   null ＝ 還沒動過那一組，用畫布自己算出來、同組取最小的那個值。 */
const TYPE_DEFAULT = { skuSize: 12, priceByCount: { 1:null, 2:null, 3:null } };
function typeOf(sh){
  if (!sh.type) sh.type = JSON.parse(JSON.stringify(TYPE_DEFAULT));
  if (!sh.type.priceByCount) sh.type.priceByCount = { 1:null, 2:null, 3:null };
  if (!+sh.type.skuSize) sh.type.skuSize = TYPE_DEFAULT.skuSize;
  return sh.type;
}

/* 同一個版位裡，所有價格一樣大：取全部格子裡最擠的那一個當共同上限 —— 一組（不管
   幾個價格）頂到不能再放大，其他組也就一起停在那裡，不會這格大那格小。回傳單一比例。
   四個價格以上不進來（談定的：只走自動縮放、沒有轉盤），也不被它拉小。null＝沒得算。 */
/* 回傳「價格數 → 這一組要縮到多少」。
   本來是整個版位取一個最小值，於是一價、二價、三價的格子全被拉成同一級 ——
   但一格只放一個價的時候，那個數字就是主角，沒有理由跟著三個價的那一格縮。
   而且旁邊那三格轉盤（一價／二價／三價）本來就是分開的，自動那一段也該分開。
   同一組（同樣價格數）之間還是取最小值：那一條規矩沒有變 ——
   同一個版位裡同樣價格數的格子要一樣大。 */
function priceGroupFs(sh){
  const g = {};
  (sh.cells || []).forEach(c => {
    const st = (c.board && c.board.state) || null;
    if (!st || !st.nPrice || st.nPrice > 3) return;
    const n = st.nPrice, w = +st.wantFs || 1;
    g[n] = g[n] == null ? w : Math.min(g[n], w);
  });
  return g;
}

/* 這個版位的「參考格」：字級照它算，整個版位共用一個。
   為什麼需要它：畫布現在照原版的比例排版（品名佔 7.14% 格高、價格 12.38%…），
   照比例算的話同一個版位裡 6cm 高和 12cm 高的格子字會差一倍 —— 那正是
   CW=540 那次修掉的 bug。所以比例照原版，但基準是整個版位的參考格。
   取**最矮**的那一格：字級照它算，別的格子只會更空，不會裝不下。
   絕大多數版位每一格一樣大 → 參考格就是自己 → 跟原版一模一樣。 */
function sheetRefCmH(block){
  let min = 0;
  (sheetOf(block).cells || []).forEach(c => {
    const cm = cellCm(c, cardEl(c.id));
    if (cm && cm.h > 0) min = min ? Math.min(min, cm.h) : cm.h;
  });
  return min;
}

/** 把這個版位的字級設定送給它底下每一塊畫布。 */
function pushType(block){
  if (!block) return;
  const sh = sheetOf(block), t = typeOf(sh), g = priceGroupFs(sh), refH = sheetRefCmH(block);
  (sh.cells || []).forEach(c => {
    const f = canvasFrame(c.id);
    if (!f || !f.contentWindow) return;
    const st = (c.board && c.board.state) || null;
    const n = st && st.nPrice;
    const dial = (n && n <= 3) ? t.priceByCount[n] : null;
    try {
      f.contentWindow.postMessage({ type: {
        skuSize: t.skuSize,
        pricePx: +dial || 0,                       // 0 ＝ 沒設，用全版位共同上限
        groupFs: (n && n <= 3 && g[n]) ? g[n] : 0,
        refCmh: refH || 0          // 字級的基準格高（cm）—— 一個版位一個
      } }, '*');
    } catch (_){}
  });
}

/* 這一格在版上實際多大（cm）。畫布的排版座標系照這個開，「1cm」在每一格
   都一樣長 —— 本來每一格都用固定 540 寬，窄格子等於被整個壓小，寫死的
   字級跟著失真。cm 是實際尺寸，跟縮放無關：r.width 和 pxPerCm 都含了
   sheetZoom，除完就約掉了。 */
function cellCm(c, el){
  if (!activeBlock || !el) return null;
  const k = sheetMetrics(activeBlock).pxPerCm;
  if (!k || !isFinite(k) || k <= 0) return null;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return { w: +(r.width / k).toFixed(3), h: +(r.height / k).toFixed(3) };
}

function paintOneCanvas(c){
  if (activeTab !== 'board') return;
  const el = cardEl(c.id);
  if (!el) return;
  /* 不是你的回合的格：壓暗，但照樣畫。版面和對話不是權限 —— 排版是整張版的事，
     看不到另外半張就排不了；貼在那一格上的話也一樣該看得到。 */
  paintCellTurn(c);
  const n = pickedOf(c).length;
  let f = el.querySelector('.ccanvas');
  if (!n){ if (f) f.remove(); markBadge(c); paintNoteMarks(c); paintCellState(c); return; }
  const cm = cellCm(c, el);
  if (!f){
    f = document.createElement('iframe');
    f.className = 'ccanvas';
    f.setAttribute('scrolling', 'no');
    f.title = '';
    setPickFrame(f, 'ui=stage&cell=' + encodeURIComponent(c.id)
      + (cm ? '&cmw=' + cm.w + '&cmh=' + cm.h : ''));
    el.appendChild(f);
  } else if (cm){
    /* 版面改過了（列數、刊頭大小）＝這一格的實際尺寸變了，畫布要換座標系。
       畫布自己會比對，沒變就不重排。 */
    try { f.contentWindow.postMessage({ stageCm: cm }, '*'); } catch (_){}
  }
  markBadge(c);
  paintNoteMarks(c);        // 標記跟著這一格走，重畫版面也不會掉
  paintCellState(c);
}

/** 換手之後那一格畫面上要跟著變的兩件事：壓不壓暗、框是什麼顏色。
    只動這一格，不重畫整張版 —— 框選一次會換掉一片，一片重畫一次就是一片閃。 */
function paintCellTurn(c){
  const el = cardEl(c.id);
  // 行銷不在那串關裡，壓暗對他沒有意義：整張版對他一律是亮的
  if (el) el.classList.toggle('notmine', !isMkt() && !cellMine(c));
  paintCellState(c);
}

/** 這一格現在在誰手上：右上角一枚小標籤，加上滑過去那句話。
    壓暗只講得出「不是你的回合」，講不出「在誰手上」—— 兩個身分都能蓋章，所以暗的
    那一格可能在設計、也可能在 PM，亮的那一格也一樣。標籤補的就是這一句。
    （框那一版收掉了：一格一圈，整片看起來是彩色格線，不是版面。） */
function paintCellState(c){
  const el = cardEl(c.id);
  if (!el) return;
  /* 標籤掛在列上（見 .cst 的註解），所以認它要照 data-for，不能問那一格自己 */
  const row = el.parentElement;
  const old = row && row.querySelector(`.cst[data-for="${c.id}"]`);
  if (old) old.remove();
  const pm = cellAt(c) === 'pm';
  /* 落版 平常不畫這枚標籤 —— 那一頁在決定形狀，不談誰做到哪。但指派模式開著的
     時候要畫：不然就是在一片沒有標示的格子上瞎指，指完也看不出來指到哪幾格。 */
  const show = activeTab === 'board' || (activeTab === 'sheet' && assignMode);
  if (!show || !row){
    el.removeAttribute('title');
    return;
  }
  const tag = document.createElement('div');
  tag.className = 'cst';
  tag.dataset.for = c.id;
  /* 「走到第幾關」和「歸誰」寫在同一枚標籤上：格子的右上角只有一個角，兩枚標籤
     疊在那裡就是誰也讀不到。兩邊都只寫得下一個短名 —— 關名用簡稱（蓋章修改 → 蓋改）、
     人名只留天干那個字（PM 甲 → 甲）。一格頂多幾十 px 寬，寫全名就是兩個都讀不到；
     全名留在滑過去那一句裡。 */
  const st  = stageOf(c);
  const who = pmName(cellPm(c));
  tag.textContent = st.k + (who ? '・' + pmStem(who) : '');
  tag.style.setProperty('--cst', ROLE_COLOR[pm ? 'pm' : 'design']);
  row.appendChild(tag);
  placeCellTag(row, el, tag);
  el.title = `${st.t}（${st.by}）`
    + (cellMine(c) ? '：這一關是你的，做完了就蓋章進下一關'
                   : '：在對方那一關，看得到、碰不到。要退回來就開蓋章，點它一下')
    + (who ? `\n負責：${who}` : '\n未指派 PM（每位 PM 都看得到）');
}

/* 貼那一格的右上角；往左上退出去是 CSS 的 transform 做的。
   位置用量的，不用 offsetLeft/offsetWidth —— 那兩個是整數，而格子是 flex:1 1 0 分出來
   的小數寬，一格差不到 1px，一列排下去就歪掉十幾 px（量過 -3.8 一路到 -12.5）。 */
function placeCellTag(row, el, tag){
  const rr = row.getBoundingClientRect(), er = el.getBoundingClientRect();
  tag.style.left = (er.right - rr.left) + 'px';
  tag.style.top  = (er.top   - rr.top)  + 'px';
}

/** 量出來的位置放著就會過期：格子寬是 flex 分的，捲軸一出現、縮放一動就重排，
    而縮放走的是「只改大小」那條路（reflowBoard），根本不會重畫標籤。
    所以每次重排都整批重量一次 —— 少了這一步，量過整列歪到 30px。 */
function placeCellTags(){
  boardEl.querySelectorAll('.row').forEach(row => {
    row.querySelectorAll('.cst').forEach(tag => {
      const el = row.querySelector(`.cell[data-cell-id="${tag.dataset.for}"]`);
      if (el) placeCellTag(row, el, tag); else tag.remove();
    });
  });
}

/** 整張版：每一格該有畫布的都給它。只有 拼板 這一頁會叫。 */
function paintBoardThumbs(){
  if (activeTab !== 'board' || !activeBlock) return;
  queueType(activeBlock);        // 畫布重新掛上來，字級設定要跟著再送一次
  (sheetOf(activeBlock).cells || []).forEach(paintOneCanvas);
  document.getElementById('boardOverview').classList.toggle('nomarks', !showMarks);
  /* 再量一次：剛剛那一輪是在版面還沒安定下來時量的（捲軸這時候才出現，一出現
     格子就變窄）。下一幀量到的才是使用者真正看到的那一版。 */
  placeCellTags();
  requestAnimationFrame(placeCellTags);
}

/* 拼板往格子裡塞的東西（畫布、貼紙、數字）全部是這一頁自己加的，換頁時要清乾淨：
   落版 借的是同一批 .cell，留著就會疊在未填寫／有填寫那兩個字上面。 */
function clearBoardThumbs(){
  boardEl.querySelectorAll('.ccanvas,.cbadge,.cmk,.cnb,.cst').forEach(n => n.remove());
  boardEl.querySelectorAll('.cell').forEach(n => {
    n.classList.remove('filled', 'dim', 'editing', 'focus', 'drop', 'notyet', 'stamp-sel');
    n.removeAttribute('title');       // 「在誰手上」那句話只有拼板要
  });
}

/* 總覽裡的格子只是入口：不給打字、不給搬，點下去就在旁邊開面板。
   mousedown 先擋掉，否則 contentEditable 的格子會直接吃到游標。 */

boardOv.addEventListener('mousedown', e => {
  if (e.target.closest('.cell')) e.preventDefault();
});
boardOv.addEventListener('click', e => {
  if (boardDragged){ boardDragged = false; return; }   // 那是拖版面，不是點格子
  // 便利貼自己處理點擊（挑出那一則），不要順手把這一格的面板開起來
  if (e.target.closest('.cmk')) return;
  clearNoteSel();            // 點到便利貼以外的地方＝放開它，意見欄回到全部問題
  const el = e.target.closest('.cell');
  if (!el || !activeBlock) return;
  const cells = sheetOf(activeBlock).cells || [];
  const at = cells.findIndex(c => String(c.id) === el.dataset.cellId);
  if (at < 0) return;
  /* 蓋章模式：點格子＝進下一關，Alt＝退回上一關，不是進去編輯（一個手勢不能同時
     是兩件事）。跟拖框那條同一個規矩（Alt＝退回），而不是「我的往前、別人的退回」——
     關有八個，「看它在誰手上」猜方向只在兩個狀態的年代成立；而且蓋錯了就得退得回來，
     停在第一關的格子照那個舊規矩會退無可退、誰也推不動。 */
  if (stampMode && stampable()){ stampCells([cells[at]], !e.altKey); return; }
  // 指派模式：點格子＝這一格歸選著的那位 PM，按 Alt 是改回未指派
  if (assignMode && assignable()){ assignCells([cells[at]], e.altKey ? '' : assignTo); return; }
  /* 不是你的回合也開得起來。本來這裡擋著（「看得到、碰不到」），但確認列排列會
     一次把整個版位推給 PM —— 擋著的話設計一鎖完，自己的拼板就一格都點不開了，
     等於做完最後一步就被關在門外。
     壓暗和右上角那枚標籤已經說清楚棒子在誰手上；真的要動手才需要蓋章拿回來。
     擋新貼紙那條沒有跟著放（見 armedKind 那一段）—— 那是往別人的格子上加東西。 */
  if (!cellMine(cells[at]) && armedKind) return;
  // 手上拿著貼紙：這一下是貼上去，不是進去編輯
  if (armedKind){ dropNote(armedKind, el, e.clientX, e.clientY); return; }
  /* 手上拿著 搬移／複製：點一格是那個工具的事（pointerdown 已經接走了），
     不是進去編輯。蓋章和貼紙排在前面 —— 那兩個是模式，比工具更優先。 */
  if (activeTool !== 'edit') return;
  /* 行銷：拼板 是看的。整張版看得到、意見欄讀得到，但不開那一格的挑貨面板 ——
     那一格裡面要放什麼是 PM 和設計的事。（落版 照樣改得動，那是他開的檔。） */
  if (isMkt()){ toast('行銷只能看拼板；要改版面請到 落版', 'info', 2000); return; }
  hideTip();
  openBoardCell(el, activeBlock, cells, at);
});
document.getElementById('boardBack').addEventListener('click', closeBoardCell);
/* 點到面板以外就收起來 — 點另一格的話，這裡先收，後面的 click 再開新的那一格。
   面板裡面是 iframe，滑鼠在裡面按不會傳到這裡，所以不會自己把自己關掉。 */
document.addEventListener('mousedown', e => {
  if (!boardCell || e.target.closest('#boardStage')) return;
  closeBoardCell();
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (boardCell){ closeBoardCell(); e.stopPropagation(); return; }
  // 由近到遠，跟關視窗一樣：先放掉選起來的格子，再來才是離開蓋章
  if (stampMode){ setStampMode(false); e.stopPropagation(); return; }
  if (assignMode){ setAssignMode(false); e.stopPropagation(); }
}, true);

/* ---- 總覽的手感：滾輪縮放、按著拖動平移 ---------------------------------
   跟拼板那頁同一套動作，所以從這裡點進去、再回來，手不用換方式。
   縮放走的是 落版 那份 sheetZoom，兩邊看到的比例才是同一個。 */
let bZoomFrame = 0, bZoomAnchor = null, bZoomTo = 0;

/* Re-run the grid at the current zoom. The size-only path keeps the cards (and
   the canvases inside them) alive; each canvas re-fits itself to its new size. */
function reflowBoard(){
  const before = boardSig;
  renderGrid(activeBlock);
  if (boardSig !== before){ paintBoardThumbs(); applyPmFocus(); }
  // 只改大小那條路不會重畫標籤，但格子已經換寬度了 —— 位置得自己跟上
  else placeCellTags();
}

/* 游標在格子裡的畫布上時，滾輪被那個 iframe 吃掉，這一層收不到 —— 而格子幾乎
   佔滿整張版，等於縮放整片失靈。畫布那邊沒用到的滾輪會 postMessage 轉過來
   （見 2cell 的 relayWheel），這裡當成同一件事處理。
   用 screenX/screenY 換算回這一頁的座標：那是唯一跨 iframe 還對得起來的座標系。 */
/* 畫布報上來「零件工具列現在開在哪」：把壓在它上面的那幾張貼紙請開。
   認是哪一格看 e.source，不看「現在開著哪一格」—— 版面重畫時畫布是整批重掛的。 */
addEventListener('message', e => {
  const d = e.data || {};
  if (!('propsBar' in d)) return;
  boardOv.querySelectorAll('.cmk.dodge').forEach(n => n.classList.remove('dodge'));
  const r = d.propsBar;
  if (!r) return;
  const f = [...boardOv.querySelectorAll('.ccanvas')].find(x => x.contentWindow === e.source);
  const cell = f && f.closest('.cell');
  if (!cell) return;
  const fr = f.getBoundingClientRect();
  const L = fr.left + r.left, T = fr.top + r.top, R = fr.left + r.right, B = fr.top + r.bottom;
  cell.querySelectorAll('.cmk').forEach(n => {
    const b = n.getBoundingClientRect();
    if (b.right > L && b.left < R && b.bottom > T && b.top < B) n.classList.add('dodge');
  });
});

addEventListener('message', e => {
  const w = e.data && e.data.stageWheel;
  if (!w) return;
  /* 認出是哪一塊畫布（跟 propsBar 那條路同一個做法：比 contentWindow），
     再用那個 iframe 的 rect 把「格子裡的座標」換成這一頁的座標。
     iframe 沒有被 CSS 縮放（格子是照 sheetMetrics 算出真實大小的），所以是 1:1。
     這樣就沒有任何值要猜 —— 縮放才真的以游標為中心。 */
  let x, y;
  const f = w.cx != null
    ? [...boardOv.querySelectorAll('.ccanvas')].find(n => n.contentWindow === e.source)
    : null;
  if (f){
    const r = f.getBoundingClientRect();
    x = r.left + w.cx; y = r.top + w.cy;
  } else {
    /* 退路：拿螢幕座標減掉視窗位置和瀏覽器外框去猜。外框高度是猜的、Windows 顯示
       縮放 125% 時 screenX 跟 CSS px 又不是同一把尺 —— 所以只有在認不出 iframe
       的時候才走這裡。 */
    x = w.x - screenX - (outerWidth - innerWidth);
    y = w.y - screenY - (outerHeight - innerHeight);
  }
  boardZoom(w.deltaY, x, y);
});

boardOv.addEventListener('wheel', e => {
  // 面板是浮在版面上的東西，不是版面的一部分：在它上面滾輪不關這張版的事
  if (e.target.closest && e.target.closest('#boardStage')){ e.stopPropagation(); return; }
  e.preventDefault();
  boardZoom(e.deltaY, e.clientX, e.clientY);
}, { passive: false });

function boardZoom(deltaY, clientX, clientY){
  if (activeTab !== 'board' || !activeBlock) return;
  // 倍率先累起來、下一幀才重畫；理由同 落版 那邊
  const base = bZoomTo || sheetZoom;
  const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX,
    base * (deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP)));
  if (next === base) return;
  bZoomTo = next;

  /* 一連好幾發滾輪合成一次重畫（rAF），但「游標在哪」記的是第一發那一下 ——
     手沒有移動，那就是使用者指著的那一點。 */
  if (!bZoomAnchor) bZoomAnchor = { cx: clientX, cy: clientY };
  if (!bZoomFrame) bZoomFrame = requestAnimationFrame(() => {
    bZoomFrame = 0;
    const { cx, cy } = bZoomAnchor;
    bZoomAnchor = null;
    const to = bZoomTo; bZoomTo = 0;
    zoomWheelTo(to, cx, cy, reflowBoard);
  });
}

/* 拖空地移動畫面 —— 只有空地。按在格子上一律不平移：格子裡的空白處是拖零件用的，
   兩個手勢共用同一下的話，想挪一塊零件卻挪到整張版（或反過來）是隨機發生的。
   不用 pointer capture：捕捉會把接在後面那個 click 換掉目標，而格子要那個 click。 */
let boardPan = null, boardDragged = false;

/* 從畫布轉出來的那一下（見 2cell 的 stagePass）：它按在格子裡的空白處，所以這一下
   講的是格子，不是格子裡的零件 —— 而在格子上拖曳不平移（平移只給格子以外的空地），
   所以這裡沒有「到底是點還是拖」要等，直接當成點那一格。
   補的是 click 不是直接開面板：點一格要先過蓋章／不是你的回合／手上拿著貼紙／
   拿著工具那一串判斷，那些只寫在 click 裡面一份，重寫一份遲早會跟本尊分岔。 */
addEventListener('message', e => {
  const p = e.data && e.data.stagePass;
  if (!p || activeTab !== 'board' || p.button !== 0) return;
  const f = [...boardOv.querySelectorAll('.ccanvas')].find(n => n.contentWindow === e.source);
  const cell = f && f.closest('.cell');
  if (!cell) return;
  const r = f.getBoundingClientRect();
  cell.dispatchEvent(new MouseEvent('click',
    { bubbles: true, clientX: r.left + p.cx, clientY: r.top + p.cy }));
});

boardOv.addEventListener('pointerdown', e => {
  if (e.button !== 0 || activeTab !== 'board') return;
  if (e.target.closest && e.target.closest('#boardStage')) return;   // 面板不是版面
  /* 蓋章中，同一個手勢是框選 —— 平移讓位。兩個都收下的話，你框到哪版面就跟著
     跑到哪，框子和格子永遠對不齊。 */
  if (stampMode || assignMode) return;
  /* 拿著 移動畫面：拖哪裡都是移動畫面，格子上也算 —— 那正是這顆工具存在的理由
     （格子幾乎鋪滿整張版，只能拖空地的話等於沒得拖）。畫布這時是關著滑鼠的
     （tooling，見 .ccanvas 的 pointer-events），所以不會誤抓到格子裡的零件。
     其他工具在格子上按下去都不平移：那一下是那個工具的手勢（選零件＝搬零件、
     搬移＝換格子的位置），順便把整張版拖著走的話兩邊都對不準。 */
  if (activeTool !== 'pan' && e.target.closest && e.target.closest('.cell')) return;
  if (e.target.closest && e.target.closest('.rowbtns')) return;   // 那一下是加／減一格
  boardPan = { x: e.clientX, y: e.clientY, moved: false,
               left: sheetMainEl.scrollLeft, top: sheetMainEl.scrollTop };
});
document.addEventListener('pointermove', e => {
  if (!boardPan) return;
  const dx = e.clientX - boardPan.x, dy = e.clientY - boardPan.y;
  // a few px of slop, so a click with a shaky hand is still a click
  if (!boardPan.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
  if (!boardPan.moved){ boardPan.moved = true; boardOv.classList.add('panning'); hideTip(); }
  sheetMainEl.scrollLeft = boardPan.left - dx;
  sheetMainEl.scrollTop  = boardPan.top  - dy;
});
function endBoardPan(){
  if (!boardPan) return;
  boardDragged = boardPan.moved;      // swallowed by the click handler above
  boardPan = null;
  boardOv.classList.remove('panning');
}
document.addEventListener('pointerup', endBoardPan);
document.addEventListener('pointercancel', endBoardPan);

/* ==========================================================================
   PM — 是哪一位 PM，和他負責哪些品類
   一個檔期上的品類是設計那邊帶進來的，PM 這邊只決定「誰管哪一類」。那是人的
   分工，不是這個檔期的內容，所以存在瀏覽器裡，跟著人走、不跟著檔期走。
   ========================================================================== */

const PM_KEY = 'board_pms_v1', PM_OWN_KEY = 'board_pm_owner_v1',
      PM_AT_KEY = 'board_pm_active_v1';
const readLS = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) || fb; }
                            catch (e){ return fb; } };

let PMS = readLS(PM_KEY, null) ||
          [{ id:'pm1', name:'PM 甲' }, { id:'pm2', name:'PM 乙' }, { id:'pm3', name:'PM 丙' }];
let pmOwner = readLS(PM_OWN_KEY, {}) || {};       // 品類名 -> PM id
let activePM = localStorage.getItem(PM_AT_KEY) || PMS[0].id;
let pmFocus = null;                                // 左邊選中的品類

const pmName = id => (PMS.find(p => p.id === id) || {}).name || '';
/* 「PM 甲」→「甲」。格子右上角那枚標籤只有幾十 px，塞得下的就這一個字。 */
const pmStem = name => String(name || '').replace(/^PM\s*/, '') || name || '';
const savePMs = () => { try { localStorage.setItem(PM_KEY, JSON.stringify(PMS)); } catch (e){} };
const savePmOwner = () => { try { localStorage.setItem(PM_OWN_KEY, JSON.stringify(pmOwner)); } catch (e){} };

const pmSel = document.getElementById('pmSel');
function renderPmSel(){
  pmSel.innerHTML = PMS.map(p =>
    `<option value="${p.id}"${p.id === activePM ? ' selected' : ''}>${p.name}</option>`).join('');
}
pmSel.addEventListener('change', () => {
  activePM = pmSel.value;
  try { localStorage.setItem(PM_AT_KEY, activePM); } catch (e){}
  pmFocus = null;
  paintStickTray();
  if (activeTab === 'board') showBoardOverview();
  syncListTitle();                   // 列表那行標題寫的是哪一位 PM
  toast(`目前是 ${pmName(activePM)}`, 'info', 1400);
});
/* 一次可以加好幾位：用逗號或換行分開。一個版位一位 PM 的話，名單一開始就要
   建齊 —— 十一個版位就是十一位，一個一個問十一次太蠢。 */
document.getElementById('pmAdd').addEventListener('click', () => {
  const raw = prompt('新增 PM 名稱（可以一次多位，用逗號分開）') || '';
  const names = raw.split(/[,，;；\r\n]+/).map(t => t.trim()).filter(Boolean);
  if (!names.length) return;
  let last = null;
  names.forEach((name, i) => {
    last = { id: 'pm' + Date.now() + i, name };
    PMS.push(last);
  });
  savePMs();
  activePM = last.id;
  try { localStorage.setItem(PM_AT_KEY, activePM); } catch (e){}
  renderPmSel();
  renderHead();                       // 版位標題那顆下拉要看得到新加的人
  if (activeTab === 'board') showBoardOverview();
  toast(names.length > 1 ? `新增了 ${names.length} 位 PM` : `新增了 ${names[0]}`, 'ok', 1800);
});

/* 一格一位 PM（cell.pm）。開檔期的時候先照版位順序鋪一輪：第一個版位的格子
   都給 PM 甲、第二個給 PM 乙，以此類推；名單不夠就照天干補到夠。鋪完之後
   一格一格調 —— 拼板 右邊那顆「指派」就是幹這個的。
   已經指派過的格不動 —— 這只是把空的填滿，不會覆蓋你調過的。 */
const PM_STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
function ensurePmPerCell(){
  if (!layout) return;
  const blocks = collectBlocks(layout.front, []).concat(collectBlocks(layout.back, []));
  let grew = false, dirty = false;
  blocks.forEach((b, i) => {
    while (PMS.length <= i){
      const n = PMS.length;
      PMS.push({ id: 'pm' + (n + 1),
                 name: 'PM ' + (PM_STEMS[n] || (n + 1)) });
      grew = true;
    }
    const sh = sheetOf(b);
    /* 舊檔期記在版位身上（sh.pm）。把它攤到底下每一格，然後把舊欄位收掉 ——
       同一個問題不留兩個答案，不然「這一格歸誰」就得先問「先看哪一個」。
       攤下去是對的：那位 PM 本來就負責這個版位的全部。 */
    const legacy = sh.pm;
    if (legacy){ delete sh.pm; dirty = true; }
    (sh.cells || []).forEach(c => {
      // 那位 PM 後來被刪掉了也算沒指派，重新給一個，格子才不會沒人管
      if (c.pm && PMS.some(p => p.id === c.pm)) return;
      c.pm = legacy || PMS[i].id;
      dirty = true;
    });
  });
  if (grew){ savePMs(); renderPmSel(); }
  if (dirty) markDirty();            // 這是開檔期時補的，不算你做的一步
  migrateCellOk(blocks);
}

/* 短命的中間版本用過 cell.ok（true ＝已交給 PM）。那一版只活了一個下午，但測試
   時存下來的檔期還在瀏覽器裡 —— 不搬的話那些格會靜靜地回到設計手上，
   而使用者只會看到「我明明交出去了」。搬完就把舊欄位拿掉，不留兩份真相。 */
function migrateCellOk(blocks){
  let moved = 0;
  blocks.forEach(b => ((b.sheet && b.sheet.cells) || []).forEach(c => {
    if (!('ok' in c)) return;
    if (c.ok && !c.at) c.at = 'pm';
    delete c.ok; moved++;
  }));
  if (moved) markDirty();
  migrateCellStage(blocks);
}

/* cell.at（'design'／'pm'）換成 cell.st（第幾關）。舊資料只知道棒子在哪一邊，
   那就落在那一邊最前面的那一關：在 PM ＝ 還沒提明細，在設計 ＝ 正在製作。
   猜錯一關的代價是蓋一次章就對了，留著兩份真相的代價是每次都要問「先看哪一個」。 */
function migrateCellStage(blocks){
  let moved = 0;
  blocks.forEach(b => ((b.sheet && b.sheet.cells) || []).forEach(c => {
    if (!('at' in c)) return;
    if (!('st' in c)) setCellStage(c, c.at === 'pm' ? 0 : 1);
    delete c.at; moved++;
  }));
  if (moved) markDirty();
}

/* 一格一顆棒子，兩邊來回傳。這不是一道單向的閘門 —— 真正的流程是一個循環，
   而且每一趟都有自己的名字（提明細作業 → 製作 → 一校 → 一改 → …，見 CELL_STAGES）。
   而且不會交一整個版位。所以每一格記的是「走到第幾關」，蓋章＝「我這邊好了，
   換你」＝進到下一關，來回跑到雙方都沒意見為止。

   不是你的回合的格是壓暗，不是消失：排版是整張版的事，看不到另外半張就排不了；
   棒子傳出去之後你也還得看得到它變成什麼樣。

   格子生出來停在第一關（提明細作業）—— 沒有明細，設計沒有東西可以做。
   （落版 那顆「送給 PM」是同一件事的一次做完版：把這個版位還在設計手上的格
     一次往前推一關。它不鎖任何東西 —— 版面永遠搬得動。）
   寫成 function 而不是 const 箭頭：這幾支被畫版面的程式碼叫，而那些程式碼
   寫在檔案更上面 —— 用 const 的話只要有人在載入途中叫一次就是 ReferenceError。 */
function cellAt(c){ return stageOf(c).side; }
function cellMine(c){ return cellAt(c) === myRole(); }
function cellsAt(sh, who){ return ((sh && sh.cells) || []).filter(c => cellAt(c) === who); }
/* 一格一位 PM。記在格子身上（cell.pm），所以跟著檔期存、跟著 Ctrl+Z 復原。
   它是「這一格找誰」，**不是權限** —— 每位 PM 都看得到整本 DM（見 pmSees），
   不是他的格也照樣點得進去。指派留著是為了看得出責任歸屬，以後真的要分權限
   （各人只動自己的）也是從這個欄位長出來的。
   （以前記在版位身上，一個版位一位 PM。一個版位裡本來就會有好幾個品類、
     由不同的人顧，硬要整塊歸一個人，剩下的人就只能請他代點。） */
function cellPm(c){ return (c && c.pm) || ''; }
// 留著沒人叫：以後要恢復「只看自己的格」就是從這一支開始
function cellOwnedBy(c, who){ return !cellPm(c) || cellPm(c) === who; }
/* 這個版位上出現過哪幾位 PM（去重、照格子順序）。一個版位好幾位是常態。 */
function blockPms(sh){
  const out = [];
  ((sh && sh.cells) || []).forEach(c => {
    const id = cellPm(c);
    if (id && !out.includes(id)) out.push(id);
  });
  return out;
}
function blockHasPm(sh){ return blockPms(sh).length > 0; }
/* 每位 PM 都看得到整本 DM。指派（cell.pm）留著，但它只是「這一格找誰」，不是權限 ——
   一本 DM 是一件事，看不到隔壁版位就對不出前後的關係，而真正擋得住的是流程本身
   （不是這一關就碰不了），不是把版位藏起來。
   （原本這裡問「有沒有一格在他手上又指給他」，答不是就整個版位從他的清單消失。） */
const pmSees = () => true;

/** 這個檔期有哪些品類，每一類散在哪些版位。（PM 只看得到交出來的那些） */
function pmTypes(){
  const map = new Map();
  ['front','back'].forEach(side => {
    if (!layout || !layout[side]) return;
    collectBlocks(layout[side], []).filter(pmSees).forEach(b => {
      b.groups.forEach((g, gi) => {
        const k = g.name || '未命名';
        if (!map.has(k)) map.set(k, { name:k, count:0, blocks:[] });
        const t = map.get(k);
        t.count += g.count;
        t.blocks.push({ block:b, gi, count:g.count, side });
      });
    });
  });
  return [...map.values()];
}

/** 沒人認領的品類就先隨機發下去 — 分工本來就是先分了再調，空著誰都不會動它。
    發完寫進 localStorage，所以只會發一次，之後每次進來看到的都一樣。 */
function ensurePmAssignments(types){
  if (!PM_SPLIT || !PMS.length) return;      // 不分工就沒有「誰的品類」這回事
  let changed = false;
  types.forEach(t => {
    if (pmOwner[t.name] && PMS.some(p => p.id === pmOwner[t.name])) return;
    pmOwner[t.name] = PMS[Math.floor(Math.random() * PMS.length)].id;
    changed = true;
  });
  if (changed) savePmOwner();
}

function renderPmTree(){
  const host = document.getElementById('pmTree');
  const types = pmTypes();
  ensurePmAssignments(types);
  const wasMini = host.classList.contains('mini');
  host.innerHTML = '';
  host.classList.toggle('mini', wasMini);

  const mine = types.filter(t => ownedByMe(t.name));
  const qty  = mine.reduce((a, t) => a + t.count, 0);

  /* 這棵樹只回答一件事：我這次要顧的是哪些貨、在哪幾個版位。
     誰是誰、誰管什麼，不是這裡要說的 —— 名字寫上去只會佔位置。 */
  const root = document.createElement('div');
  root.className = 'pt-root';
  const blocks = new Set();
  mine.forEach(t => t.blocks.forEach(bi => blocks.add(bi.block)));
  root.innerHTML = `${currentPlan ? currentPlan.name : ''}<span class="sub">${
    pmName(activePM) || 'PM'}・${blocks.size} 個版位・${mine.length} 個品類・共 ${qty} 支</span>`;
  host.appendChild(root);

  // 通常就一類：那就直接翻開，省一次點擊
  if (mine.length === 1 && !pmFocus) pmFocus = mine[0].name;

  mine.forEach(t => pmTypeRow(host, t, 'pt-mine'));
  if (!mine.length) host.appendChild(pmSep('沒有交給你的版位'));
}

/** 別讓 PM 開進一個整片壓暗的版位 — 沒有他的貨就換到第一個有他的貨的版位。 */
function pickPmDefaultBlock(){
  const types = pmTypes();
  ensurePmAssignments(types);
  const mine = types.filter(t => ownedByMe(t.name));
  if (!mine.length){ activeBlock = null; pmFocus = null; return; }   // 還沒有東西可看
  // 手上那個版位設計收回去改了、或換成別人負責：換到還看得到的第一個
  if (activeBlock && pmSees(activeBlock)) return;
  const first = mine[0].blocks[0];
  if (first){ activeBlock = first.block; pmFocus = mine[0].name; }
  else { activeBlock = null; pmFocus = null; }
}

function pmSep(text){
  const d = document.createElement('div');
  d.className = 'pt-sep';
  d.textContent = text;
  return d;
}

function pmTypeRow(host, t, tone){
  const open = pmFocus === t.name;
  const row = document.createElement('div');
  row.className = 'pt-type ' + tone + (open ? ' open' : '');
  row.innerHTML = `<span class="caret">${open ? '▾' : '▸'}</span>
    <span class="nm">${t.name}</span><span class="n">${t.count} 支</span>`;

  row.addEventListener('click', () => {
    if (open){ pmFocus = null; renderPmTree(); applyPmFocus(); return; }
    selectPmBlock(t.blocks[0] && t.blocks[0].block, t.name);
  });
  host.appendChild(row);

  const kids = document.createElement('div');
  kids.className = 'pt-kids';
  t.blocks.forEach(bi => {
    const b = document.createElement('div');
    b.className = 'pt-blk' + (activeBlock === bi.block && open ? ' active' : '');
    b.innerHTML = `<span>${bi.side === 'front' ? '正' : '背'}・${bi.block.name}</span>
                   <span class="n">${bi.count} 支</span>`;
    b.addEventListener('click', ev => { ev.stopPropagation(); selectPmBlock(bi.block, t.name); });
    kids.appendChild(b);
  });
  host.appendChild(kids);
}

/** 左邊選了品類／版位：右邊換成那個版位，並把不是這一類的格子壓暗。 */
function selectPmBlock(block, typeName){
  if (!block || !pmSees(block)) return;
  pmFocus = typeName || null;
  closeBoardCell();
  activeBlock = block;
  focusCell = null; selNote = null;
  renderHead();
  renderGrid(block);
  paintBoardThumbs();
  applyPmFocus();
  renderPmTree();
  renderRail();
  applyFocusCell();
}

/** 每位 PM 都看得到整本 DM，所以這裡不再照「指給誰」壓暗 —— 指派是「這一格找誰」，
    不是權限（cell.pm 照樣存著、照樣指得動，右上角那枚標籤上就寫著）。
    真正會壓暗的只剩「不是這一關」（.notmine，見 paintCellTurn），那是流程，不是身分。
    （PM_SPLIT 那條「按品類分」的舊路留著，要恢復分工把那個旗標改回 true。） */
function applyPmFocus(){
  const on = activeMode === 'pm' && activeBlock;
  boardEl.querySelectorAll('.cell').forEach(el => {
    const g = activeBlock && activeBlock.groups[+el.dataset.gi];
    const off = !!on && PM_SPLIT && !(g && ownedByMe(g.name));
    el.classList.toggle('dim', off);
    el.classList.remove('locked');     // 壓暗不擋：見上面
  });
}

let activeTab = 'total';

function setTab(id){
  if (!VIEWS[id]) return;
  if (VIEWS[activeTab]) VIEWS[activeTab].unmount();
  activeTab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  ['total','sheet','board'].forEach(v =>
    document.getElementById('view-' + v).classList.toggle('active', v === id));
  document.getElementById('view-plans').classList.remove('active');
  VIEWS[id].mount();
  /* 批次交接只活在 拼板：切走就關掉，免得下次回來還掛著上一輪的選取。 */
  if (id !== 'board') setStampMode(false);          // 蓋章只在 拼板
  /* 指派 落版 和 拼板 都有，換頁不必關掉 —— 中途被關掉的話，「在落版指一輪、
     切去拼板看一眼、再回來補幾格」就得每次重開一次模式。只有 總體 沒有格子可指。 */
  if (id === 'total') setAssignMode(false);
  renderStampBar();
  renderAssignBar();
  // 換頁＝換一批 .cell，指派中的標籤要在新的那一批上重畫
  if (assignMode) repaintCellTags();
}
function switchTab(id){ if (id !== activeTab) setTab(id); }
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

/* ==========================================================================
   蓋章：一格一格換手
   一格一顆棒子，兩邊來回傳：蓋章＝「我這邊好了，換你」。設計排完換 PM 填貨、
   PM 填完換設計排版、設計排完換 PM 看過 —— 同一個動作的兩個方向，所以兩個身分
   都能蓋。為什麼在 拼板 不在 落版：這個來回就發生在 拼板，落版 是決定形狀的地方。
   做成一個模式，不是隨手點就蓋 —— 點格子本來就有用途（開那一格的面板），
   一個手勢不能同時是兩件事。
   ========================================================================== */
const stampBar = document.getElementById('stampBar');
let stampMode = false;
let stampDrag = null;                       // 框選中：{x,y,add,box,before}

/** 這個檔期的所有版位，正面接背面。 */
function allBlocks(){
  if (!currentPlan || !layout) return [];
  return collectBlocks(layout.front, []).concat(collectBlocks(layout.back, []));
}

/** 現在這一版位的格。蓋章一次只對「正在看的那一個版位」動手。 */
function stampCellsOf(){
  return activeBlock ? (sheetOf(activeBlock).cells || []) : [];
}

/** 誰是對面那一邊。 */
function otherSide(){ return myRole() === 'pm' ? 'design' : 'pm'; }

/** 在 拼板、而且真的有一個版位攤在眼前，才談得上換手。兩個身分都能換 ——
    設計排完說「換你填」，PM 填完說「換你排」，是同一個動作的兩個方向。 */
function stampable(){
  return activeTab === 'board' && !!currentPlan && !!activeBlock && !isMkt();
}

/** 貼紙旁邊那顆換手鍵。按鈕上寫的是「我這一關做完了」，不是關名 —— 一個版位裡
    每一格走到的關可能不一樣，寫哪一關都會有一半的格對不上。 */
function renderStampBtn(){
  const b = document.getElementById('stampBtn');
  if (!b) return;
  b.hidden = !stampable();
  b.classList.toggle('on', stampMode);
  const pm = myRole() === 'pm';
  b.querySelector('.tx').innerHTML = stampMode
    ? '<b>蓋章中 — 下一關</b><small>點一格＝進下一關・拖出一個框＝一次一片・Alt＝退回</small>'
    : (pm ? '<b>交回設計</b><small>蓋章：這幾格我這一關做完了</small>'
          : '<b>交給 PM</b><small>蓋章：這幾格我這一關做完了</small>');
  b.title = stampMode ? '再按一次就離開蓋章'
                      : '蓋了章的那一格就走到下一關（' + CELL_STAGES.map(s => s.t).join(' → ') + ' → 蓋章 → …）';
}

/** 一批格子蓋完之後那句話。全都停在同一關就講關名 —— 那才是使用者現在想知道的；
    參差不齊的時候講關名只會挑到其中一格，反而騙人。 */
function stampWord(cells, forward){
  const set = new Set(cells.map(cellStage));
  if (set.size === 1) return (forward ? '進到' : '退回') + '「' + CELL_STAGES[[...set][0]].t + '」';
  return forward ? '往前一關' : '退回一關';
}

function renderStampBar(){
  renderStampBtn();
  if (!stampMode || !stampable()){ stampBar.classList.remove('on'); return; }
  stampBar.classList.add('on');
  const cells = stampCellsOf();
  const mine = cells.filter(cellMine).length;
  /* 兩邊的數字一起講：這一列講的是「球在哪」，不是「進度到哪」——
     來回的流程裡沒有單調遞增的那種進度。 */
  document.getElementById('stampCount').innerHTML =
    `在你手上 <b>${mine}</b>・在對方 <b>${cells.length - mine}</b>`;
  document.getElementById('stampAll').hidden  = !mine;
  document.getElementById('stampNone').hidden = mine === cells.length;
}

/** 開關蓋章模式。關掉的時候把框選殘留一起收乾淨。 */
function setStampMode(on){
  on = !!on && stampable();
  if (on === stampMode) return;
  if (on) setAssignMode(false);      // 跟指派互斥：一下點擊不能同時是換手和換人
  stampMode = on;
  boardOv.classList.toggle('stamping', on);
  if (!on) endStampDrag(true);
  renderStampBar();
  renderAssignBar();
}

/** 蓋章／退回。forward＝走到下一關（棒子跟著換到對面），false＝退回上一關。
    一次一批只算一步復原 —— 框一片起來蓋，在使用者心裡就是一個動作。 */
function stampCells(cells, forward){
  let changed = 0;
  cells.forEach(c => {
    const i = cellStage(c);
    const j = forward ? stageNext(i) : stagePrev(i);
    if (j === i) return;                     // 已經在第一關，退無可退
    setCellStage(c, j);
    changed++;
  });
  if (!changed) return 0;
  commitAction();
  cells.forEach(paintCellTurn);
  paintTotalStates();
  renderMinimap();
  updateProgress();
  renderStampBar();
  return changed;
}

const sideName = who => who === 'pm' ? 'PM' : '設計';
document.getElementById('stampAll').addEventListener('click', () => {
  const picked = stampCellsOf().filter(cellMine);
  const n = stampCells(picked, true);
  if (n) toast(`${n} 格${stampWord(picked, true)}`, 'ok', 2000);
});
document.getElementById('stampNone').addEventListener('click', async () => {
  const picked = stampCellsOf().filter(c => !cellMine(c));
  if (!picked.length) return;
  /* 退回＝對方那邊那幾格就碰不到了，值得問一次。版面和便利貼都不會動。 */
  const ok = await modalConfirm({
    title: '全部退回上一關',
    body: `${picked.length} 格會從${sideName(otherSide())}那邊退回上一關（回到你手上，他就碰不到了）。`
        + '已經拼好的內容、貼在上面的便利貼都會留著。要繼續嗎？',
    ok: '退回', cancel: '取消', danger: true
  });
  if (!ok) return;
  const n = stampCells(picked, false);
  if (n) toast(`${n} 格${stampWord(picked, false)}`, 'info', 2000);
});
document.getElementById('stampExit').addEventListener('click', () => setStampMode(false));
document.getElementById('stampBtn').addEventListener('click', () => setStampMode(!stampMode));

/* ---- 框選：按著拖出一個框，框到的格子一次蓋完 ----------------------------
   用視窗座標畫框（position:fixed），不換算成版面座標 —— 版面本身會縮放、
   會平移，換算一次就多一個會算錯的地方，而框只活在按住的那幾秒。
   拖版面（平移）在蓋章模式下讓位：那幾秒你是在選格子，不是在看別的地方。 */
function stampCellElsIn(box){
  const cells = stampCellsOf();
  const out = [];
  cells.forEach(c => {
    const el = cardEl(c.id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.right > box.l && r.left < box.r && r.bottom > box.t && r.top < box.b) out.push(c);
  });
  return out;
}

function stampBoxOf(e){
  return { l: Math.min(stampDrag.x, e.clientX), r: Math.max(stampDrag.x, e.clientX),
           t: Math.min(stampDrag.y, e.clientY), b: Math.max(stampDrag.y, e.clientY) };
}

function paintStampBox(box){
  const el = stampDrag.box;
  el.style.left = box.l + 'px'; el.style.top = box.t + 'px';
  el.style.width = (box.r - box.l) + 'px'; el.style.height = (box.b - box.t) + 'px';
  el.classList.toggle('take', !stampDrag.add);
  const hit = new Set(stampCellElsIn(box).map(c => String(c.id)));
  stampCellsOf().forEach(c => {
    const cel = cardEl(c.id);
    if (cel) cel.classList.toggle('stamp-sel', hit.has(String(c.id)));
  });
}

function endStampDrag(cancel){
  if (!stampDrag) return;
  stampDrag.box.remove();
  boardEl.querySelectorAll('.stamp-sel').forEach(n => n.classList.remove('stamp-sel'));
  const d = stampDrag;
  stampDrag = null;
  if (cancel || !d.moved) return;
  const hit = stampCellElsIn(d.last);
  const n = stampCells(hit, d.add);
  if (n) toast(`${n} 格${stampWord(hit, d.add)}`, d.add ? 'ok' : 'info', 1800);
}

boardOv.addEventListener('pointerdown', e => {
  if (!stampMode || !stampable() || e.button !== 0) return;
  if (e.target.closest && e.target.closest('#boardStage')) return;
  e.preventDefault();
  const box = document.createElement('div');
  box.className = 'stamp-box';
  document.body.appendChild(box);
  // 按住 Alt 是收回：跟蓋章反過來，同一個手勢不必再找一顆按鈕
  stampDrag = { x:e.clientX, y:e.clientY, add:!e.altKey, box, moved:false, last:null };
  stampDrag.last = stampBoxOf(e);
  paintStampBox(stampDrag.last);
});
document.addEventListener('pointermove', e => {
  if (!stampDrag) return;
  if (!stampDrag.moved &&
      Math.abs(e.clientX - stampDrag.x) + Math.abs(e.clientY - stampDrag.y) < 5) return;
  stampDrag.moved = true;                  // 沒動就當成一次點擊，交給 click 那條路
  stampDrag.box.classList.add('on');
  stampDrag.last = stampBoxOf(e);
  paintStampBox(stampDrag.last);
});
document.addEventListener('pointerup', () => endStampDrag(false));
document.addEventListener('pointercancel', () => endStampDrag(true));

/* ==========================================================================
   指派：這一格歸哪位 PM
   蓋章答的是「棒子在哪一邊」（設計／PM），指派答的是「PM 那一邊的哪一位」——
   兩個問題，所以兩個模式，但同一隻手、同一種手勢：點一格、拖一個框、Alt 反過來。
   為什麼是一格一格：一個版位裡本來就有好幾個品類，由不同的人顧。以前記在版位
   身上（sheet.pm），整塊只能歸一個人，剩下的人就只能請他代點。
   設計專用 —— 指派是分工，不是做事。PM 那邊看得到自己被指到哪幾格就夠了。
   ========================================================================== */
const assignBar = document.getElementById('assignBar');
const assignWho = document.getElementById('assignWho');
let assignMode = false;
let assignTo = (PMS[0] || {}).id || '';
let assignDrag = null;                      // 框選中：{x,y,to,box,moved,last}

/* 落版 也能指派。分工是「排完之後這幾格給誰」，那件事在 落版 就想好了 ——
   逼人先切到 拼板 才指得動，等於為了一個決定多走一趟。兩頁共用同一個 #board，
   所以框選、標籤、指派本身完全是同一套，只有那顆按鈕各站各的位置。 */
function assignable(){
  return (activeTab === 'board' || activeTab === 'sheet')
    && !!currentPlan && !!activeBlock && activeMode === 'design';
}
/** 這一頁的格子重畫一次「在誰手上・歸誰」那枚標籤。進出指派模式時整批換。 */
function repaintCellTags(){
  ((activeBlock && sheetOf(activeBlock).cells) || []).forEach(paintCellState);
  placeCellTags();
}

/** 指給誰的那個下拉。名單會長（ensurePmPerCell 補人），所以每次開模式都重畫一次。 */
function renderAssignWho(){
  if (!PMS.some(p => p.id === assignTo)) assignTo = (PMS[0] || {}).id || '';
  assignWho.innerHTML = PMS.map(p =>
    `<option value="${p.id}"${p.id === assignTo ? ' selected' : ''}>${p.name}</option>`).join('');
}

/* 兩顆按鈕、一個狀態：拼板 那顆站在蓋章旁邊（同一隻手做的兩件事），
   落版 那顆站在工具列裡確認鍵上面（那一條就是「對這個版位做的事」）。
   各自只在自己那一頁露臉 —— 工具列在 拼板 是接在 字級 底下的，不分頁的話
   拼板 上會同時看到兩顆一模一樣的指派。 */
function renderAssignBtn(){
  const b = document.getElementById('assignBtn');
  if (b){
    b.hidden = !(assignable() && activeTab === 'board');
    b.classList.toggle('on', assignMode);
    b.querySelector('.tx').innerHTML = assignMode
      ? '<b>指派中</b><small>點一格＝指給他・拖出一個框＝一次指一片・Alt＝改回未指派</small>'
      : '<b>指派 PM</b><small>一格一格指：這幾格歸誰</small>';
    b.title = assignMode ? '再按一次就離開指派' : '一格一格指定這幾格歸哪位 PM';
  }
  const s = document.getElementById('assignBtnSheet');
  if (s){
    s.hidden = !(assignable() && activeTab === 'sheet');
    s.classList.toggle('on', assignMode);
    s.textContent = assignMode ? '指派中…' : '指派 PM';
    s.title = assignMode
      ? '再按一次就離開指派。點一格＝指給他、拖出一個框＝一次指一片、Alt＝改回未指派'
      : '一格一格指定這幾格歸哪位 PM';
  }
}

function renderAssignBar(){
  renderAssignBtn();
  if (!assignMode || !assignable()){ assignBar.classList.remove('on'); return; }
  assignBar.classList.add('on');
  const cells = stampCellsOf();
  const his = cells.filter(c => cellPm(c) === assignTo).length;
  const none = cells.filter(c => !cellPm(c)).length;
  /* 三個數字講的是同一件事的三面：他的、沒人的、剩下的（別人的）。
     只講「他的」看不出還有沒有漏掉的格。 */
  document.getElementById('assignCount').innerHTML =
    `他的 <b>${his}</b>・未指派 <b>${none}</b>・其他人 <b>${cells.length - his - none}</b>`;
  document.getElementById('assignNone').hidden = !cells.some(c => cellPm(c));
}

/** 開關指派模式。跟蓋章互斥 —— 同一下點擊不能同時是「換手」和「換人」。 */
function setAssignMode(on){
  on = !!on && assignable();
  if (on === assignMode) return;
  if (on) setStampMode(false);
  assignMode = on;
  boardOv.classList.toggle('assigning', on);
  boardEl.classList.toggle('assigning', on);   // 落版 沒有 #boardOverview 這一層
  if (on) renderAssignWho(); else endAssignDrag(true);
  /* 落版 的標籤是跟著這個模式來去的（見 paintCellState），開關都要整批重畫一次 */
  if (activeTab === 'sheet') repaintCellTags();
  renderAssignBar();
  renderStampBar();                 // 蓋章那顆可能剛被關掉，文案要跟著回去
}

/** 指派／取消指派。to＝PM id，空字串＝改回未指派（大家都看得到）。
    一次一批只算一步復原 —— 框一片起來指，在使用者心裡就是一個動作。 */
function assignCells(cells, to){
  let changed = 0;
  cells.forEach(c => {
    if (cellPm(c) === to) return;
    if (to) c.pm = to; else delete c.pm;   // 未指派不留欄位，存檔小一點
    changed++;
  });
  if (!changed) return 0;
  commitAction();
  cells.forEach(paintCellState);           // 右上角那枚標籤上寫著是誰的
  paintTotalStates();
  renderMinimap();
  renderHead();                            // 標題那行「PM：甲、乙」跟著變
  renderAssignBar();
  return changed;
}

assignWho.addEventListener('change', () => {
  assignTo = assignWho.value || '';
  renderAssignBar();
});
document.getElementById('assignAll').addEventListener('click', () => {
  const n = assignCells(stampCellsOf(), assignTo);
  if (n) toast(`${n} 格指給 ${pmName(assignTo)}`, 'ok', 2000);
});
document.getElementById('assignNone').addEventListener('click', async () => {
  const picked = stampCellsOf().filter(c => cellPm(c));
  if (!picked.length) return;
  /* 一次清掉整個版位的分工值得問一次：清完誰都看得到，但也等於誰都沒被指名。 */
  const ok = await modalConfirm({
    title: '全部改回未指派',
    body: `${picked.length} 格會變成未指派（每位 PM 都看得到，但沒有指名誰負責）。要繼續嗎？`,
    ok: '改回未指派', cancel: '取消', danger: true
  });
  if (!ok) return;
  const n = assignCells(picked, '');
  if (n) toast(`${n} 格改回未指派`, 'info', 2000);
});
document.getElementById('assignExit').addEventListener('click', () => setAssignMode(false));
['assignBtn','assignBtnSheet'].forEach(id => {
  const b = document.getElementById(id);
  if (b) b.addEventListener('click', () => setAssignMode(!assignMode));
});

/* ---- 框選：跟蓋章同一套（見 stampCellElsIn 那一段的理由），只是指的是人不是手 ---- */
function endAssignDrag(cancel){
  if (!assignDrag) return;
  assignDrag.box.remove();
  boardEl.querySelectorAll('.stamp-sel').forEach(n => n.classList.remove('stamp-sel'));
  const d = assignDrag;
  assignDrag = null;
  if (cancel || !d.moved) return;
  const n = assignCells(stampCellElsIn(d.last), d.to);
  if (n) toast(d.to ? `${n} 格指給 ${pmName(d.to)}` : `${n} 格改回未指派`,
               d.to ? 'ok' : 'info', 1800);
}

function paintAssignBox(box){
  const el = assignDrag.box;
  el.style.left = box.l + 'px'; el.style.top = box.t + 'px';
  el.style.width = (box.r - box.l) + 'px'; el.style.height = (box.b - box.t) + 'px';
  el.classList.toggle('take', !assignDrag.to);
  const hit = new Set(stampCellElsIn(box).map(c => String(c.id)));
  stampCellsOf().forEach(c => {
    const cel = cardEl(c.id);
    if (cel) cel.classList.toggle('stamp-sel', hit.has(String(c.id)));
  });
}

/* 落版 上的指派。拼板 那邊點格子已經在 boardOv 的 click 裡分流了（那一頁的點擊
   本來就有別的用途，要排在蓋章和貼紙後面）；落版 的格子平常沒有 click 可做，
   所以這裡自己接一條，只在這一頁生效。 */
boardEl.addEventListener('click', e => {
  if (activeTab !== 'sheet' || !assignMode || !assignable()) return;
  const el = e.target.closest && e.target.closest('.cell');
  if (!el) return;
  const c = (sheetOf(activeBlock).cells || [])
    .find(x => String(x.id) === el.dataset.cellId);
  if (c) assignCells([c], e.altKey ? '' : assignTo);
});

/* 框選在兩頁都掛：拼板 掛在 #boardOverview（版面外面那一圈空地也要收得到），
   落版 掛在 #board 本身 —— 那一頁的空地是 #sheetMain 的，而那裡的 pointerdown
   是平移在捕獲階段吃的，搶不過也不該搶。 */
[boardOv, boardEl].forEach(host => host.addEventListener('pointerdown', e => {
  if (!assignMode || !assignable() || e.button !== 0) return;
  if (host === boardOv && activeTab !== 'board') return;
  if (host === boardEl && activeTab !== 'sheet') return;
  if (assignDrag) return;                       // 兩層都收得到，只認第一下
  if (e.target.closest && e.target.closest('#boardStage')) return;
  e.preventDefault();
  const box = document.createElement('div');
  box.className = 'stamp-box';
  document.body.appendChild(box);
  // 按住 Alt 是清掉：跟指派反過來，同一個手勢不必再找一顆按鈕
  assignDrag = { x:e.clientX, y:e.clientY, to: e.altKey ? '' : assignTo,
                 box, moved:false, last:null };
  assignDrag.last = { l:e.clientX, r:e.clientX, t:e.clientY, b:e.clientY };
  paintAssignBox(assignDrag.last);
}));
document.addEventListener('pointermove', e => {
  if (!assignDrag) return;
  if (!assignDrag.moved &&
