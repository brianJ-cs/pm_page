<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計組・檔期 → 設計開檔</title>
<style>
  :root{
    --blue:#4a6fdc;
    --ink:#333a45;
    --muted:#7a8494;
    --bg:#f2f4f8;
    --card:#ffffff;
    --line:#e2e6ee;
    --amber-bg:#fff4d6; --amber:#c07f00;
    --rule:#98a0ae;
    --pink:#fbe3d8;            /* block fill, per slide A */
    --pink-rule:#d8b6a6;
    --green:#cdeeda; --green-rule:#5aa678; --green-ink:#2e7d52;
    --accent:#c0392b;          /* the red counts */
    --g2:#eef1f6; --g2-rule:#d6dde6;   /* dm-block-zoom two-tone group */
    /* ruler chrome, after 1排版切割.html (light palette to suit this app) */
    --ruler-w:30px;
    --ruler-bg:#eef1f6; --ruler-line:#d5dbe6;
    --ruler-tick:#9aa3b2; --ruler-label:#7a8494;
    --align:#8b3dff;           /* Canva-ish alignment guide */

    /* ---- 顏色代號：照「做什麼用」取名，不照「是什麼顏色」 --------------------
       之前顏色是一路寫下來的，光是「淡藍色的互動底」就有六個相近的值，
       「接近白的底」也有六個 —— 沒有人選過它們，它們只是長出來的。
       改皮膚、加深色模式、查為什麼這行字看不見，都是從這裡開始。
       規則：新的顏色一律先在這裡取個名字，不要再往下面塞 hex。 */
    --surface:#ffffff;         /* 卡片、面板、紙 */
    --surface-2:#fafbfd;       /* 次一層的底（欄位、內凹的區塊） */
    --surface-3:#f1f4fb;       /* 淺色底上的 hover */
    --line-strong:#c9d6e2;     /* 比 --line 明顯一點的分隔線 */
    --ink-strong:#101828;      /* 最黑的字（便利貼、標題強調） */
    --ink-dim:#4b5566;         /* 次一級的字 */
    --grip:#e7ebf3;            /* ⋮⋮ 這類把手的底 */
    --grip-hover:#d8deea;

    /* 藍色＝「你正在點的東西」：分頁、選取、放下去的位置。東西本身不用藍。 */
    --accent:#4a6fdc;          /* ＝ --blue，語意名 */
    --accent-strong:#3f61c6;   /* 按下去／hover 的深藍 */
    --accent-tint:#eef2fc;     /* 淡藍底 */
    --accent-tint-2:#e2e9fa;   /* 淡藍底的 hover */
    --accent-line:#ccd8f5;     /* 淡藍框 */
    --accent-ink:#cfd9f2;      /* 深色底上的藍字 */
    --accent-ink-strong:#2b3a5c;

    /* 三個狀態色。紅只用在「還沒處理／價格」，綠只用在「好了」，黃只用在「注意」 */
    --ok:#17663a; --ok-ink:#17663a; --ok-tint:#e6f6ea;
    --warn:#f5a623; --warn-line:#f0dcae; --warn-tint:#fff3e0;
    --danger:#d92d20; --danger-ink:#b42318; --danger-tint:#fdeceb;

    /* 「這一格的棒子在誰手上」不再上顏色（框變成格線，見 #boardOverview .cell）。
       便利貼那兩顆身分色還在，那是貼紙自己的事： */
    /* 便利貼的顏色＝誰貼的。兩個都不用藍（藍是「你正在點的東西」）、不用綠
       （綠是「在對方手上」）、不用粉（粉是小地圖上的版位）。
       設計本來是淡紫 #d9d3f4，在白底版面上太淺看不清，改成看得見的天藍。
       JS 那邊的 ROLE_COLOR 直接讀這兩個名字 —— 同一個顏色不留兩份。 */
    --sticky-design:#87CEEB;
    --sticky-pm:#ffd447;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height: 80%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .app{height:100vh;display:flex;flex-direction:column;padding:16px 24px 10px;gap:11px;
       position:relative}

  /* ---- tab bar + toolbar ---- */
  .bar{display:flex;align-items:center;gap:12px;min-height:38px}
  .tab{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--accent-line);border-radius:999px;padding:7px 22px;
    background:var(--accent-tint);color:var(--blue);
  }
  .tab:hover{background:var(--accent-tint-2)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}

  .bar .right{margin-left:auto;display:flex;align-items:center;gap:16px}

  /* ---- 復原 / 重做 (步驟記錄) ---- */
  .hist{display:flex;gap:6px;margin-left:6px}
  .btn.icon{
    position:relative;padding:7px 13px 11px;font-size:17px;line-height:1;
    color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint);
  }
  /* same corner-key treatment as the tool rail, so the two read as one system */
  .btn.icon[data-key]::after{
    content:attr(data-key);position:absolute;right:3px;bottom:2px;
    font-size:8.5px;font-weight:800;line-height:1;opacity:.62;
  }
  .btn.icon:hover:not(:disabled){background:var(--accent-tint-2)}
  .btn.icon:disabled{opacity:.38;cursor:not-allowed;background:var(--card)}
  /* 鎖定鈕浮在畫面右邊、垂直置中：這是整個 落版 最後要做的那一件事，
     大一點、固定在同一個地方，不必每次去找它在哪。
     只有 落版 會出現，而 意見欄 是 拼板 才有的 —— 右邊這一帶不會撞到東西。 */
  #confirmBtn{
    position:fixed;right:26px;top:132px;
    z-index:60;white-space:nowrap;text-align:center;line-height:1.3;
    font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;
    border:2px solid var(--blue);border-radius:14px;padding:18px 26px;
    background:var(--blue);color:var(--surface);display:none;
    box-shadow:0 10px 28px rgba(0,0,0,.34);
    transition:background-color .13s ease,box-shadow .13s ease;
  }
  #confirmBtn .lk{display:block;font-size:30px;line-height:1;margin-bottom:7px}
  #confirmBtn:hover{background:var(--accent-strong);box-shadow:0 12px 32px rgba(0,0,0,.42)}
  #confirmBtn.is-confirmed{background:var(--surface);color:var(--green-ink);border-color:var(--green-rule)}

  /* 還有格子在你手上的時候，外圈跑一圈虛線 —— 這顆按鈕是 落版 的出口，
     但它就只是靜靜站在角落，很容易被當成一塊說明文字。
     會動的東西才看得出「這裡等你按」。都送出去之後就停：那時它已經是狀態顯示。
     四條邊各自是一張重複漸層，動的是 background-position —— 虛線沒辦法直接動，
     這是唯一不用多包一層 DOM 的做法。圓角會把四個角落切掉，看起來就是四條邊
     各自在跑，那正好。 */
  #confirmBtn:not(.is-confirmed)::after{
    content:'';position:absolute;inset:-7px;border-radius:19px;pointer-events:none;
    background-image:
      repeating-linear-gradient(90deg, var(--blue) 0 11px, transparent 11px 22px),
      repeating-linear-gradient(90deg, var(--blue) 0 11px, transparent 11px 22px),
      repeating-linear-gradient(0deg,  var(--blue) 0 11px, transparent 11px 22px),
      repeating-linear-gradient(0deg,  var(--blue) 0 11px, transparent 11px 22px);
    background-size:100% 3px, 100% 3px, 3px 100%, 3px 100%;
    background-position:0 0, 0 100%, 0 0, 100% 0;
    background-repeat:no-repeat;
    animation:confirmAnts 1.1s linear infinite;
  }
  @keyframes confirmAnts{
    to{ background-position:22px 0, -22px 100%, 0 -22px, 100% 22px; }
  }
  /* 會動的東西對某些人是干擾，系統設定關掉動畫時就別跑 —— 虛線框本身留著，
     指的還是同一件事。 */
  @media (prefers-reduced-motion: reduce){
    #confirmBtn:not(.is-confirmed)::after{ animation:none }
  }

  /* 字級那一條：拼板 的左邊直條，長得跟 落版 的 #toolRail 一樣（同一個藍、同一個
     位置、同樣的直排標題）—— 兩頁的「對這個版位做的事」就站在同一個地方。
     沒選版位的時候整條收起來：沒有東西可以調。 */
  #typeWrap{
    display:none;flex:none;width:104px;margin:2px 18px 10px;border-radius:8px;
    background:var(--blue);color:var(--surface);
    flex-direction:column;align-items:stretch;gap:7px;padding:12px 8px 10px;user-select:none;
  }
  #typeWrap.on{display:flex}
  /* 字級這條的標題橫著寫：這條比工具列寬、每一列本來就是橫的（「SKU 12」），
     標題再直排就跟下面對不上，也白佔一截高度。工具列那條窄、還是直的。 */
  #typeWrap .rail-title{writing-mode:horizontal-tb;text-orientation:mixed;
                        letter-spacing:2px;text-align:center;margin-bottom:8px}
  /* 名字在左、格子在右 —— 一列讀完就是「一價 52」，比上下疊少一半的視線移動。
     直排標題還是直的，那是這一條在講什麼；每一列自己是橫的。 */
  #typeWrap .tw-n{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
                  gap:6px;font-size:11.5px;font-weight:800;color:var(--surface);white-space:nowrap}
  #typeWrap input{width:52px;flex:none;padding:4px 5px;border-radius:6px;text-align:center;
                  border:1px solid rgba(255,255,255,.45);
                  background:rgba(255,255,255,.14);color:var(--surface);
                  font-family:inherit;font-size:12.5px;font-weight:800}
  #typeWrap input:focus{outline:none;border-color:var(--surface);background:rgba(255,255,255,.28)}
  /* 沒設過的那一格顯示 placeholder「自動」，要看得出來它是空的 */
  #typeWrap input::placeholder{color:rgba(255,255,255,.62);font-weight:700}
  /* 「還原成自動」用那個轉一圈的箭頭 —— 跟 Ctrl+Z 是同一個手勢，不必讀字。
     只有圖示，字靠 title 說明。 */
  #typeWrap #typeReset{align-self:center;margin-top:3px;padding:5px;line-height:0;
                       display:flex;align-items:center;justify-content:center;
                       background:rgba(255,255,255,.14);color:var(--surface);
                       border:1px solid rgba(255,255,255,.45);border-radius:8px}
  #typeWrap #typeReset svg{width:17px;height:17px;display:block}
  #typeWrap #typeReset:hover{background:rgba(255,255,255,.28)}
  /* 工具接在 字級 下面：同一條直條，不是第二條。自己的底色、外距、圓角都拿掉，
     只留一條分隔線 —— 讓它讀起來是這一條的下半截。
     （標題不必特別處理：上面 #typeWrap .rail-title 那條會一起把「工具」轉成橫的。）
     按鈕還是直排 —— 一顆 40px，三顆橫著排比這一條還寬。 */
  #typeWrap #toolRail{
    width:auto;margin:9px 0 0;padding:9px 0 0;border-radius:0;background:none;
    border-top:1px solid rgba(255,255,255,.32);gap:7px;
  }

  .toggle{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{position:absolute;opacity:0;pointer-events:none}
  .track{width:42px;height:23px;border-radius:999px;background:#cfd6e3;position:relative;transition:background .16s}
  .track::after{
    content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
    background:var(--surface);box-shadow:0 1px 3px rgba(30,40,60,.3);transition:transform .16s;
  }
  .toggle input:checked + .track{background:var(--blue)}
  .toggle input:checked + .track::after{transform:translateX(19px)}

  /* ---- header banner ---- */
  /* 檔期名和進度只要看得到就好，不必佔一整條 */
  /* 檔期名站在分頁左邊，靠一條分隔線跟分頁分開 —— 不用底色，那一列才不會
     被兩塊顏色切成兩半。 */
  .banner{
    display:flex;align-items:baseline;gap:9px;flex:none;
    padding:2px 16px 2px 2px;margin-right:2px;border-right:1px solid var(--chrome-line);
  }
  .banner .nm{font-size:15.5px;font-weight:800;color:var(--ink)}
  .banner .rg{font-size:13px;font-weight:800;color:var(--amber)}

  /* ---- 檔期列表 (from design_team.html) ---- */
  /* ---- 身分列 (設計 / PM) — pinned to the top edge, pulls down on approach.
     It is fixed, so it costs the page no vertical space while hidden. ---- */
  .modebar{
    position:fixed;left:0;right:0;top:0;z-index:120;
    display:flex;align-items:center;gap:10px;
    background:var(--blue);padding:6px 16px;
    /* parked with a 7px sliver still showing, so the bar is never invisible */
    transform:translateY(calc(-100% + 7px));transition:transform .18s ease;
    box-shadow:0 3px 14px rgba(74,111,220,.28);
  }
  .modebar.show{transform:none}
  /* 檔期列表上沒有版面要讓位，身分列就一直停在那；.app 讓出等高的位置，
     標題和 匯入 才不會被壓在下面 */
  .modebar.pinned{transform:none}
  .app.bar-pinned{padding-top:52px}
  /* the sliver: a deeper blue than the bar so it reads as a deliberate edge */
  .modebar::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
    background:linear-gradient(#3355c9,#1f3ea6);transition:opacity .18s ease;
  }
  .modebar.show::after{opacity:0}
  /* a pale grabber on the sliver, saying the edge is something you can pull */
  .modebar .handle{
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:1;
    width:56px;height:3px;border-radius:2px;background:rgba(255,255,255,.75);
    transition:opacity .18s ease;
  }
  .modebar.show .handle{opacity:0}
  /* the back button lives on blue now, so it has to read as white-on-blue */
  .modebar .back{
    background:transparent;border-color:rgba(255,255,255,.5);color:var(--surface);
    padding:4px 12px;font-size:13px;
  }
  .modebar .back:hover{background:rgba(255,255,255,.16)}
  /* 身分列上只剩「← 檔期列表」。設計／PM／行銷那三顆和換 PM 的下拉都拿掉了 ——
     你是誰在登入頁決定，要換人就登出重登，不再是隨手撥一下的開關。 */

  /* ---- 登入頁 ----------------------------------------------------------
     沒有密碼，就是一張「你是誰」的名單。它蓋在整支程式上面（fixed），
     所以底下的畫面照舊建好、登入之後不必重畫任何東西。
     淺色底，所以每一段字都自己寫 color —— 深色那一段在 stylesheet 最後面，
     不寫就會繼承它那套淺灰，白底上直接看不見。 */
  #loginGate{
    position:fixed;inset:0;z-index:900;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  }
  #loginGate[hidden]{display:none}
  #loginGate .lg-title{font-size:26px;font-weight:800;color:var(--ink)}
  #loginGate .lg-title small{
    display:block;margin-top:6px;font-size:13.5px;font-weight:800;color:var(--muted);
  }
  #loginGate .lg-cols{display:flex;gap:18px;align-items:flex-start}
  #loginGate .lg-col{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px;min-width:210px;display:flex;flex-direction:column;gap:9px;
    box-shadow:0 2px 10px rgba(35,42,55,.06);
  }
  #loginGate .lg-role{
    display:flex;align-items:center;gap:7px;
    font-size:15px;font-weight:800;color:var(--ink);margin-bottom:2px;
  }
  /* 那一顆點＝這個身分貼出來的便利貼是什麼顏色。行銷不貼便利貼，所以沒有點 */
  #loginGate .lg-dot{width:11px;height:11px;border-radius:50%;flex:none}
  #loginGate .lg-dot.design{background:var(--sticky-design)}
  #loginGate .lg-dot.pm{background:var(--sticky-pm)}
  #loginGate .lg-user{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;text-align:left;
    border:1.5px solid var(--line-strong);border-radius:9px;
    padding:9px 13px;background:var(--surface-2);color:var(--ink);
  }
  #loginGate .lg-user:hover{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent-ink-strong)}
  #loginGate .lg-add{
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    border:1.5px dashed var(--line-strong);border-radius:9px;
    padding:7px 13px;background:transparent;color:var(--muted);
  }
  #loginGate .lg-add:hover{border-color:var(--accent-line);color:var(--accent)}
  /* ---- 開檔表＋時間軸（從 落版單系統 搬過來）---------------------------
     整片站在深色的操作區上，但它自己是一張白紙 —— 所以**每一段字都自己寫
     color**。不寫就會繼承 stylesheet 最後那段深色底的淺灰，白底上直接看不見。 */
  #view-plan{flex-direction:column;gap:14px;overflow:auto}
  #view-plan .head-row{display:flex;align-items:center;gap:14px}
  #view-plan .head-row h2{font-size:23px;font-weight:800;color:var(--chrome-ink)}
  #view-plan .head-row .spacer{flex:1}
  #view-plan .form-grid{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;display:flex;flex-direction:column;gap:12px;color:var(--ink);
  }
  #view-plan .form-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #view-plan .form-line label{font-size:16px;font-weight:800;min-width:68px;color:var(--ink)}
  #view-plan .form-line input[type=text],#view-plan .form-line input[type=date]{
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:16px;
    font-family:inherit;outline:none;background:var(--surface);color:var(--ink);
  }
  #view-plan .form-line input:focus{border-color:var(--blue)}
  #view-plan #nameInput{width:340px}
  #view-plan #totalInput{
    width:72px;text-align:center;border:1px solid var(--line);border-radius:6px;
    padding:9px 6px;font-size:16px;font-family:inherit;outline:none;
    background:var(--surface);color:var(--ink);
  }
  #view-plan .unit-tail{font-size:15px;color:var(--muted);margin-left:-4px}
  #view-plan .type-btn{
    border:1px solid var(--line);background:var(--surface);border-radius:6px;
    padding:9px 18px;font-size:16px;font-weight:800;color:var(--ink);
    cursor:pointer;font-family:inherit;
  }
  #view-plan .type-btn.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  #view-plan .tagbox{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:6px;padding:4px 8px;
    min-width:340px;min-height:36px;background:var(--surface);cursor:text;
  }
  #view-plan .tagbox:focus-within{border-color:var(--blue)}
  #view-plan .tagbox .tag-chip{
    background:var(--accent-tint);color:var(--blue);border-radius:5px;
    font-size:15px;font-weight:800;padding:4px 7px 4px 9px;
    display:flex;align-items:center;gap:4px;
  }
  #view-plan .tag-chip b{cursor:pointer;font-weight:900;opacity:.55}
  #view-plan .tag-chip b:hover{opacity:1}
  #view-plan #tagInput{
    border:none;outline:none;font-size:16px;flex:1;min-width:120px;
    font-family:inherit;background:transparent;color:var(--ink);
  }
  #view-plan .preset-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #view-plan .preset-tags .pt{
    border:1px dashed var(--accent-line);border-radius:6px;background:var(--surface);
    color:var(--blue);font-size:14px;font-weight:800;font-family:inherit;
    padding:4px 10px;cursor:pointer;
  }
  #view-plan .preset-tags .pt:hover{background:var(--accent-tint)}
  #view-plan .preset-tags .pt.on{background:var(--blue);border-style:solid;border-color:var(--blue);color:var(--surface)}

  #view-plan .dur-row{display:flex;gap:8px;overflow-x:auto;padding:2px;flex:none}
  #view-plan .dur-cell{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;text-align:center;min-width:82px;flex:none;color:var(--ink);
  }
  #view-plan .dur-cell .dn{font-size:15px;font-weight:800;white-space:nowrap;color:var(--ink)}
  #view-plan .dur-cell input{
    width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;
    padding:5px 2px;font-size:17px;font-weight:800;margin-top:5px;
    font-family:inherit;outline:none;background:var(--surface);color:var(--ink);
  }
  #view-plan .dur-cell input:focus{border-color:var(--blue)}
  #view-plan .dur-cell .dd{font-size:13.5px;color:var(--muted);margin-top:4px}
  #view-plan .dur-cell .unit{font-size:13px;color:var(--muted)}

  /* ---- 時間軸 ---- */
  #view-plan .tl-scroll{
    flex:1;min-height:230px;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:6px 14px;
  }
  #view-plan .tl-panel{padding:6px 6px 2px;user-select:none;-webkit-user-select:none}
  #view-plan .stack-layer{position:relative;height:130px;margin:0 7px}
  #view-plan .bar-wrap{position:relative;padding:0 7px}
  /* 用 id 不用 class：`.bar`（工具列）和 `.track`（磁吸對齊那顆開關）在這支程式
     裡本來就有別的意思，連 padding 和 width 都會漏進來 —— 撞名的東西不要硬用
     權重壓過去，換一個選得準的選擇器就好。 */
  #view-plan #bar{
    position:relative;height:40px;border:1px solid var(--line-strong);
    border-radius:4px;overflow:hidden;background:var(--surface);
  }
  /* 一天一塊：這個階段做幾天，就有幾塊。本來是一條漸層，看得出顏色換在哪裡，
     但數不出「這一段是幾天」—— 現在一格就是一天，用數的。 */
  #view-plan .day-blk{position:absolute;top:0;bottom:0;z-index:0}
  #view-plan .grid-line{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;z-index:2}
  #view-plan .grid-line.major{background:rgba(20,30,50,.35)}
  #view-plan .grid-line.minor{background:rgba(20,30,50,.12)}
  /* 週末塗成白的：在彩色的軌道上打一個空格，寫著 周／末 */
  #view-plan .we-shade{
    position:absolute;top:0;bottom:0;pointer-events:none;background:var(--surface);z-index:1;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;color:var(--ink-strong);
  }
  #view-plan .number-labels{position:relative;height:14px;margin:3px 7px 0}
  #view-plan .number-label{
    position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;
    color:var(--muted);white-space:nowrap;
  }
  #view-plan .number-label.we{color:var(--danger-ink)}
  #view-plan #track{position:relative;width:auto;height:56px;margin:2px 7px 0;touch-action:none;
                    background:none;border-radius:0;transition:none}
  #view-plan #track::after{content:none}
  #view-plan .flag{
    position:absolute;top:0;width:30px;height:40px;transform:translateX(-50%);
    cursor:grab;outline:none;z-index:2;display:flex;justify-content:center;
  }
  #view-plan .flag:active{cursor:grabbing}
  #view-plan .flag .stem{position:absolute;top:0;width:2px;height:8px;background:currentColor;opacity:.6;border-radius:1px}
  #view-plan .flag .handle{
    position:absolute;top:8px;width:19px;height:19px;border-radius:5px 5px 5px 0;
    transform:rotate(45deg);background:currentColor;
    box-shadow:0 2px 5px rgba(30,40,60,.35);transition:transform .08s;
  }
  #view-plan .flag:hover .handle{transform:rotate(45deg) scale(1.1)}
  #view-plan .flag.selected .handle{box-shadow:0 0 0 2px var(--surface),0 0 0 3px currentColor,0 3px 7px rgba(30,40,60,.4)}
  #view-plan .flag:focus-visible .handle{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
  /* 疊在同一天的旗子：只有最前面那一支畫日期 */
  #view-plan .flag.stack-member .handle,#view-plan .flag.stack-member .stem{opacity:.45}
  #view-plan .flag.stack-member .taglabel{display:none}
  #view-plan .taglabel{
    position:absolute;top:32px;left:50%;transform:translateX(-50%);
    font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;pointer-events:none;
  }
  #view-plan .stacklabel{
    position:absolute;bottom:0;transform:translateX(-50%);
    display:flex;flex-direction:row;align-items:flex-end;gap:12px;pointer-events:none;
  }
  #view-plan .stacklabel .col{display:flex;flex-direction:column;gap:6px}
  #view-plan .stacklabel .row{
    display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;
    line-height:1.1;color:var(--ink);white-space:nowrap;
  }
  #view-plan .stacklabel .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  #view-plan .stacklabel .label-2line{display:flex;flex-direction:column;line-height:1.05;text-align:left}
  #view-plan .plan-actions{display:flex;justify-content:flex-end;gap:12px;flex:none}

  /* ---- 帶入：照舊檔期開（從 落版單系統 搬過來）------------------------
     用 #impMask 自己一組，不共用 .modal —— 那個是 modalConfirm 的小方框
     （max-width 470px），這一張是兩欄的大視窗。撞名的東西換一個選擇器就好。 */
  #impMask{
    position:fixed;inset:0;z-index:600;display:none;
    align-items:center;justify-content:center;background:rgba(30,40,60,.34);
  }
  #impMask.on{display:flex}
  #impMask .imp-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;width:92vw;max-width:1440px;height:88vh;
    display:flex;flex-direction:column;min-width:0;color:var(--ink);
    box-shadow:0 18px 48px rgba(30,40,60,.3);
  }
  #impMask h4{font-size:19px;font-weight:800;margin-bottom:14px;color:var(--ink)}
  #impMask .imp-panes{flex:1;display:flex;gap:16px;min-height:0}
  #impMask .imp-side{
    width:330px;flex:none;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;padding-right:4px;
  }
  #impMask .imp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  #impResults{flex:1;overflow-y:auto;padding-right:4px}
  #impMask .imp-search{position:relative}
  #impSearch{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;
    font-size:16px;font-weight:700;font-family:inherit;outline:none;
    background:var(--surface);color:var(--ink);
  }
  #impSearch:focus{border-color:var(--blue)}
  #impTagMenu{
    position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:5;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.14);max-height:190px;overflow-y:auto;
  }
  #impTagMenu[hidden]{display:none}
  #impTagMenu .opt{padding:9px 12px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
  #impTagMenu .opt:hover,#impTagMenu .opt.sel{background:var(--accent-tint);color:var(--blue)}
  #impChips{display:flex;flex-wrap:wrap;gap:6px}
  #impChips:empty{display:none}
  #impChips .pill{display:flex;align-items:center;gap:6px}
  #impChips .pill b{cursor:pointer;font-weight:900;opacity:.55}
  #impChips .pill b:hover{opacity:1}
  #impMask .pill.total{color:var(--amber);border-color:var(--warn-line);background:var(--amber-bg)}
  #impMask .imp-label{font-size:14px;font-weight:800;color:var(--muted);margin-top:4px}
  #impMask .imp-types{display:flex;flex-direction:column;gap:6px}
  #impMask .imp-types .type-btn{width:100%;text-align:left}
  #impMask .imp-count{font-size:15px;font-weight:800;color:var(--muted);flex:none}
  #impMask .imp-card{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:border-color .12s,background .12s,transform .12s;
  }
  #impMask .imp-card:hover{border-color:var(--blue);background:var(--accent-tint);transform:translateX(2px)}
  #impMask .imp-card .row1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  #impMask .imp-card .nm{font-weight:800;font-size:17px;margin-right:2px;color:var(--ink)}
  #impMask .imp-card .pill.tag.hit{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  #impMask .imp-card .durs{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.5}
  #impMask .imp-empty{
    text-align:center;padding:48px 20px;color:var(--muted);
    font-size:16px;font-weight:700;line-height:1.9;
  }
  #impMask .imp-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  /* 這一張裡的 .pt / .type-btn 借 #view-plan 那組樣式，但它不在 #view-plan 底下，
     所以那幾條要自己再寫一次 —— 隔開的代價，換來的是不會踩到別人。 */
  #impMask .pt{
    border:1px dashed var(--accent-line);border-radius:6px;background:var(--surface);
    color:var(--blue);font-size:14px;font-weight:800;font-family:inherit;
    padding:4px 10px;cursor:pointer;
  }
  #impMask .pt:hover{background:var(--accent-tint)}
  #impMask .pt.on{background:var(--blue);border-style:solid;border-color:var(--blue);color:var(--surface)}
  #impMask .type-btn{
    border:1px solid var(--line);background:var(--surface);border-radius:6px;
    padding:9px 18px;font-size:16px;font-weight:800;color:var(--ink);
    cursor:pointer;font-family:inherit;
  }
  #impMask .type-btn.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  #impMask .preset-tags{display:flex;flex-wrap:wrap;gap:6px}

  /* ---- 誰在看哪裡（心跳）------------------------------------------------
     它擋不住任何事，只是讓人看得到彼此、自己讓開。所以一律做得小、做得靜：
     不搶版位狀態的顏色（那是資料），只在角落掛一個字。 */
  .mini-blk .who-here{
    position:absolute;right:2px;bottom:2px;z-index:2;
    min-width:13px;height:13px;padding:0 2px;border-radius:7px;
    background:var(--blue);color:var(--surface);
    font-size:9.5px;font-weight:800;line-height:13px;text-align:center;
    box-shadow:0 0 0 1.5px var(--surface);
  }
  .pill.here{color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint)}
  #hereNow{display:none;font-size:12.5px;font-weight:800;color:var(--accent-ink)}
  #hereNow.on{display:inline}

  /* ---- 「這一檔剛剛被別人改過」-------------------------------------------
     跟蓋章列同一族（浮在下緣的一條），因為講的是同一種事：現在有一個狀況，
     這裡是你能做的動作。差別是它是**警告**，所以邊是琥珀色的。
     用 toast 不行 —— toast 會自己消失，而這件事沒處理掉就一直存在。 */
  #remoteBar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:70;
    display:none;align-items:center;gap:10px;
    background:var(--chrome);border:1px solid var(--warn);border-radius:999px;
    padding:8px 10px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.34);
    font-size:13px;font-weight:800;color:var(--chrome-ink);max-width:min(92vw,760px);
  }
  #remoteBar.on{display:flex}
  #remoteBar .msg{min-width:0}
  #remoteBar .msg b{color:var(--warn)}
  #remoteBar .sub{display:block;font-weight:800;font-size:11.5px;color:var(--chrome-muted)}
  #remoteBar button{
    font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;flex:none;
    border:1px solid var(--chrome-line);border-radius:999px;padding:5px 13px;
    background:var(--chrome-2);color:var(--chrome-ink);
  }
  #remoteBar button:hover{background:#3a4457;border-color:var(--blue)}
  #remoteBar button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  #remoteBar button.primary:hover{filter:brightness(1.08)}
  #remoteBar button[hidden]{display:none}

  /* ---- 卡片下半：這一檔挑到哪了 ＋ 可以拉開的小地圖（從 落版單系統 搬回來）----
     一張卡上要回答的是「這一檔還缺哪裡」。收起來的樣子是一條方塊，一格一個版位，
     看得出「還有幾塊沒做」；真的要知道是版上哪一塊，才拉開小地圖。 */
  .pm-row{
    display:flex;flex-direction:column;align-items:flex-start;gap:9px;
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  }
  .pm-row.empty{display:none}
  .pm-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pm-sum{
    font-size:13.5px;font-weight:800;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--surface-2);
  }
  .pm-sum.all{color:var(--ok-ink);background:var(--ok-tint);border-color:var(--green)}
  .pm-who{font-size:13.5px;font-weight:700;color:var(--ink-dim)}
  .pm-who.all{color:var(--ok-ink);font-weight:800}
  .pm-map{display:flex;gap:3px;flex-wrap:wrap;max-width:300px}
  .pm-blk{width:11px;height:11px;border-radius:3px;background:var(--g2);border:1px solid var(--g2-rule)}
  .pm-blk.part{
    background:linear-gradient(to top,var(--green-rule) var(--fill,50%),var(--surface) var(--fill,50%));
    border-color:var(--green-rule);
  }
  .pm-blk.done{background:var(--green-rule);border-color:var(--green-rule)}
  /* 拉開小地圖的把手：從卡片下緣凸出來一塊，像書籤。不做成按鈕是因為它不是一個
     「動作」，是這張卡片本身還有一截沒拉開。 */
  .mm-tab{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;z-index:3;
    appearance:none;font-family:inherit;font-size:12px;font-weight:800;line-height:1;
    padding:0 16px;height:22px;cursor:pointer;
    border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
    background:var(--card);color:var(--ink-dim);
    display:flex;align-items:center;gap:5px;box-shadow:0 3px 6px rgba(30,40,60,.10);
  }
  .mm-tab:hover{background:var(--accent-tint);border-color:var(--blue);color:var(--blue)}
  .mm-tab .arw{font-size:10px;display:inline-block;transition:transform .15s}
  .mm-tab.on .arw{transform:rotate(180deg)}
  /* 兩張版平均分掉整行，中間留一大段 —— 正面和背面是兩張不同的紙，
     貼在一起會看成一張被切開的版。 */
  .mm-wrap{display:flex;gap:36px;width:100%;align-items:flex-start}
  .mm-wrap.shut{display:none}
  .mm-side{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .mm-tag{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:3px}
  .mm-page{border:2px solid var(--ink);background:var(--surface);display:flex;overflow:hidden}
  .mm-split{display:flex;width:100%;height:100%;overflow:hidden}
  .mm-fold{width:3px;background:var(--rule);flex:none}
  .mm-blk{
    border:1.5px solid var(--ink);background:var(--g2);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.15;color:var(--ink-dim);font-weight:800;text-align:center;
  }
  .mm-blk b{font-size:1em;font-weight:800}
  .mm-blk span{font-size:.82em;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}
  /* 三種狀態只換底色和字色，**邊線一律不碰** —— 本來 .done 把 border-color 蓋成綠的，
     於是整張版做完之後那些黑線就消失了，十塊綠色黏成一大片。
     分隔線講的是「版面切在哪裡」，跟做到哪無關。 */
  .mm-blk.part{
    background:linear-gradient(to top,var(--green) var(--fill,50%),var(--surface) var(--fill,50%));
    color:var(--ok-ink);
  }
  .mm-blk.done{background:var(--green-rule);color:var(--surface)}
  .mm-blk.unlaid{background:var(--g2);color:var(--muted)}

  /* ---- 目前階段管理列（從 落版單系統 搬過來）--------------------------
     它站在檔期列表最上面。這是一條**淺色**的帶子，坐在深色的操作區上，
     所以每一段字都自己寫 color —— 不寫就繼承深色那套淺灰，看不見。 */
  #statusBar{
    flex:none;background:linear-gradient(180deg,#eaf0fd,#e2ebfb);
    border:1px solid var(--accent-line);border-radius:12px;padding:12px 16px;
    display:flex;flex-direction:column;gap:10px;position:relative;margin-bottom:14px;
  }
  #statusBar[hidden]{display:none}
  /* 收起來的把手：貼在下緣正中間。收起來之後**它自己還在**（見 .folded），
     不然收掉就再也開不回來。 */
  #statusBar .sb-pull{
    position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--accent-line);
    border-radius:0 0 9px 9px;border-top:0;color:var(--accent-ink-strong);
    font:inherit;font-size:12.5px;font-weight:800;
    padding:2px 14px 3px;cursor:pointer;line-height:1.4;z-index:2;
  }
  #statusBar .sb-pull:hover{border-color:var(--blue);color:var(--blue)}
  /* 收起來：整塊只剩那條把手，位置留著（不是消失，是折起來） */
  #statusBar.folded{padding:0;min-height:11px;background:transparent;
    border-color:transparent;box-shadow:none}
  #statusBar.folded > *:not(.sb-pull){display:none}
  #statusBar.folded .sb-pull{bottom:0;border-radius:9px;border-top:1px solid var(--accent-line)}
  #statusBar .sb-title{
    font-size:15px;font-weight:800;color:var(--accent-ink-strong);
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  #statusBar .sb-sub{font-size:13.5px;font-weight:700;color:var(--muted)}
  #statusBar .sb-names{display:flex;gap:8px;flex-wrap:wrap}
  #statusBar .sb-name{
    display:flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;
    background:var(--surface);border:1px solid var(--accent-line);
    border-radius:9px;padding:7px 12px;box-shadow:0 1px 3px rgba(40,60,110,.08);
  }
  #statusBar .sb-name:hover{border-color:var(--blue)}
  #statusBar .sb-name.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--accent-tint-2)}
  #statusBar .sb-name .nm{font-size:16px;font-weight:800;color:var(--ink)}
  #statusBar .sb-name .st{font-size:15px;font-weight:800;color:var(--amber)}
  #statusBar .sb-cd{font-size:14px;font-weight:700;color:var(--muted)}
  #statusBar .sb-editor{
    display:flex;flex-direction:column;gap:8px;
    border-top:1px dashed var(--accent-line);padding-top:10px;
  }
  #statusBar .sb-editrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #statusBar .sb-edit-lead{font-size:15px;font-weight:800;color:var(--ink)}
  #statusBar .sb-editrow .spacer{flex:1}
  #statusBar .sb-linkbtn{
    background:none;border:none;color:var(--blue);font-size:15px;font-weight:800;
    cursor:pointer;padding:6px 8px;border-radius:6px;font-family:inherit;
  }
  #statusBar .sb-linkbtn:hover{background:var(--accent-tint-2)}
  #statusBar .sb-track{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
  /* 編輯器裡的階段格永遠是可以點的（編輯器只在編輯模式存在），
     虛線外框就是在說「這個點得下去」 */
  #statusBar .sb-track .stage-chip{
    flex:none;cursor:pointer;background:var(--surface);
    outline:2px dashed var(--blue);outline-offset:2px;
  }
  #statusBar .sb-track .stage-chip:hover{border-color:var(--blue)}
  #statusBar .sb-hint{font-size:13.5px;color:var(--muted)}
  /* 手動指定過的檔期：卡片和管理列上都掛一枚，看得出這一格不是算出來的 */
  .pill.manual{color:var(--amber);border-color:var(--warn-line);background:var(--amber-bg)}
  .pill.manual.drift{border-style:dashed}

  /* ---- 過往檔期／回收桶（從 落版單系統 搬過來）------------------------ */
  #pastMask,#trashMask{
    position:fixed;inset:0;z-index:600;display:none;
    align-items:center;justify-content:center;background:rgba(30,40,60,.34);
  }
  #pastMask.on,#trashMask.on{display:flex}
  #pastMask .past-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;width:88vw;max-width:1200px;height:80vh;
    display:flex;flex-direction:column;color:var(--ink);
    box-shadow:0 18px 48px rgba(30,40,60,.3);
  }
  #trashMask .trash-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;min-width:460px;max-width:min(92vw,760px);color:var(--ink);
    box-shadow:0 18px 48px rgba(30,40,60,.3);
  }
  #pastMask h4,#trashMask h4{font-size:19px;font-weight:800;margin-bottom:14px;color:var(--ink)}
  #pastList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
  #pastMask .past-acts,#trashMask .trash-acts{display:flex;justify-content:flex-end;margin-top:12px}
  /* 過往的檔期畫淡一點：它們還在，只是不再是今天的事 */
  #pastList .plan-card{opacity:.82}
  .trash-item{
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .trash-item .nm{font-weight:800;font-size:16px;color:var(--ink)}
  .trash-item .when{font-size:13.5px;color:var(--muted);margin-left:auto}
  .trash-item .mini{
    border:1px solid var(--line);background:var(--surface);border-radius:6px;
    padding:6px 12px;font-size:14.5px;font-weight:800;cursor:pointer;
    color:var(--ink);font-family:inherit;
  }
  .trash-item .mini:hover{border-color:var(--blue);color:var(--blue)}
  .trash-item .mini.del:hover{border-color:var(--danger);color:var(--danger-ink)}
  .trash-empty{color:var(--muted);text-align:center;padding:26px 0;font-size:16px}

  /* 現在是誰：檔期列表那一行的右邊。它是唯一寫著「你是誰」的地方了。
     這一行站在深色的操作區上（見 stylesheet 最後的 操作區調深色），所以
     顏色要用 --chrome-* 那一組 —— 用淺底那組（--ink）會是深字配深底，
     看起來就像沒有登入。 */
  /* 「你是誰」那個名牌。**同一顆 DOM 搬來搬去**（hostWho()），不是每一條列各放
     一份 —— 兩份就會有一份忘記跟著更新。三條列的底都是深色，所以顏色同一套。
     用 id 不用 class：`.who` 已經是便利貼卡片上「誰貼的」那一個。 */
  #whoBadge{
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:800;color:var(--chrome-muted);
  }
  #whoBadge b{color:var(--chrome-ink)}
  /* 檔期列表那一條：靠自己推到最右邊。編輯器那一條的 .right 已經是 margin-left:auto
     的一整組，再推一次就會把它跟旁邊那些擠開。 */
  .topbar > #whoBadge{margin-left:auto}
  #whoBadge .btn{padding:4px 11px;font-size:12.5px}

  .topbar{display:flex;align-items:center;gap:10px;flex:none}
  .topbar h1{font-size:22px;font-weight:800}
  .btn{
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;padding:7px 16px;
    background:var(--card);color:var(--ink);
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  /* 清空資料：測試用的東西，站在角落、講清楚它很危險，但不要搶匯入的位置 */
  .btn.danger{margin-left:auto;color:var(--danger-ink);border-color:#f0c2bd;background:var(--danger-tint)}
  .btn.danger:hover{background:#fbdad7}
  .btn.primary:hover{background:var(--accent-strong)}
  /* 按不下去就不要長得像按得下去。藍色是「你正在點的東西」，而這顆現在不能點 */
  .btn:disabled{
    cursor:default;background:var(--surface-2);border-color:var(--line);
    color:var(--muted);
  }
  .btn:disabled:hover{background:var(--surface-2)}
  .btn.back{padding:6px 14px;font-size:13.5px;color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint)}
  .btn.back:hover{background:var(--accent-tint-2)}
  .btn.open{
    margin-left:14px;padding:6px 16px;font-size:13.5px;
    color:var(--surface);background:var(--blue);border-color:var(--blue);
  }
  .btn.open:hover{background:var(--accent-strong)}

  #view-plans{flex-direction:column}
  #planList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
  .plan-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;box-shadow:0 2px 8px rgba(30,40,60,.06);
    position:relative;              /* 小地圖那根把手掛在下緣，要有這個才定得住 */
  }
  .plan-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .plan-name{font-size:20px;font-weight:800}
  .pill{
    font-size:14px;font-weight:800;border:1px solid var(--line);border-radius:6px;
    padding:3px 10px;color:var(--muted);background:var(--surface-2);
  }
  .pill.tag{color:var(--blue);border-color:var(--accent-line);background:var(--accent-tint)}
  .pill.count{color:var(--amber);border-color:var(--warn-line);background:var(--amber-bg)}
  /* 草稿：虛線邊，看得出它跟旁邊那幾張「已經在跑」的卡不是同一件事 */
  .pill.draft{
    color:var(--muted);border-style:dashed;border-color:var(--line-strong);
    background:transparent;
  }
  .plan-out{margin-left:auto;font-size:16px;font-weight:800;color:var(--muted)}
  .plan-out b{color:var(--ink)}
  .stage-row{display:flex;gap:8px;flex-wrap:wrap}
  .stage-chip{
    min-width:86px;text-align:center;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px 7px;background:var(--surface-2);
  }
  .stage-chip .n{font-size:15px;font-weight:800;color:#5d6675}
  .stage-chip .d{font-size:13.5px;color:var(--muted);margin-top:2px}
  .stage-chip.done{background:var(--green-bg,var(--ok-tint));border-color:#cdeeda}
  .stage-chip.done .n,.stage-chip.done .d{color:#2e8b57}
  .stage-chip.now{background:var(--amber-bg);border-color:var(--warn-line);position:relative}
  .stage-chip.now .n,.stage-chip.now .d{color:var(--amber)}
  .stage-chip.now::after{
    content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;
    border-radius:50%;background:var(--warn);
  }
  .empty-hint{color:var(--muted);text-align:center;margin-top:60px;font-size:18px}
  #editorChrome{display:flex;flex-direction:column;gap:11px}

  /* ---- view panels ---- */
  .panel{flex:1;min-height:0;display:none}
  .panel.active{display:flex}
  #view-total{align-items:flex-start;justify-content:center;gap:34px;overflow:auto;padding-top:4px}
  /* 拼板：小地圖固定在左邊（不管在哪一層都看得到自己在哪），右邊換內容 */
  #view-board{padding-top:6px;gap:0;align-items:stretch}
  #boardSide{flex:none;display:flex}
  /* 同一欄兩種左邊：設計就是小地圖本人，PM 是一疊三段（檔期／品類樹／小地圖）。
     PM 那一疊是一根捲軸捲到底 —— 三段各自捲的話，你永遠不知道下面還有沒有東西。 */
  #pmStack{
    /* 比設計那一欄寬一點：小地圖那張 .mini-page 是固定 252px，這裡還要多讓出
       一根捲軸和段落的內距，不讓的話兩張版面會被切掉右邊那一條 */
    display:none;flex-direction:column;flex:none;width:286px;
    overflow-y:auto;overflow-x:hidden;padding-right:8px;margin-right:10px;
    border-right:1px solid var(--line);transition:width .14s ease;
  }
  #boardSide.pm #pmStack{display:flex}
  #boardSide:not(.pm) #pmStack{display:none}
  #pmStack.mini{width:0;padding-right:0;margin-right:0;border-right:0}
  #pmStack.mini > *{display:none}
  /* 進了這一疊就不再是「一欄」：自己的寬度、捲軸、分隔線全交出去，只留內容 */
  #pmStack #sheetSide{
    width:auto;flex:none;overflow:visible;border-right:0;margin-right:0;padding-right:0;
  }
  #boardMain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  /* 浮在版面左上角，貼著左欄：白底小藥丸，壓在淺色畫布上才讀得清楚 */
  #markWrap{
    position:absolute;top:8px;left:10px;z-index:40;
    gap:8px;font-size:12.5px;color:var(--ink);
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px 5px 8px;box-shadow:0 3px 10px rgba(16,24,40,.14);
  }
  #markWrap .track{width:34px;height:19px}
  #markWrap .track::after{width:15px;height:15px}
  #markWrap input:checked + .track::after{transform:translateX(15px)}
  /* 總覽：借用 落版 的格子，只是這裡不編輯，純粹挑一格 */
  #boardOverview{flex:1;min-height:0;display:none;align-items:stretch}
  #boardOverview.on{display:flex}
  /* 工具列 拼板 也有一份。搬移 和 整格複製 本來就是「鎖定之後」才用得到的東西
     （見 syncTools），而鎖定之後人就在 拼板 上做事了 —— 工具留在 落版 等於
     放在一個已經做完的房間裡。
     但**不另外長一條**：它接在 字級 底下，同一條藍色直條的下半截（見 #typeWrap
     #toolRail）。並排兩條就是左邊兩塊一樣的藍，而它們本來是同一件事的兩半 ——
     「對這個版位做的事」。PM 兩半都看不到：字級 那條對他就是收起來的。 */
  /* 刊頭尺寸、鎖定狀態 — 那些是 落版 在處理的事，拼板 不必看 */
  #boardOverview #blockHead{display:none}
  /* 這一層平常不編輯版面：整張版關掉滑鼠，只把「格子」開回來當入口。
     拿起 搬移／複製 的時候要把整張版還給滑鼠，不然拖不到卡片。 */
  /* 這一層本來是 pointer-events:none（「只留格子當入口」），但捲軸是它自己的東西 ——
     關掉滑鼠等於連捲軸都抓不動。事件反正會冒泡到 #boardOverview，平移那邊看的是
     e.target 有沒有落在 .cell 上，所以開著不影響誰收到那一下。 */
  #boardOverview #sheetMain{pointer-events:auto}
  /* 左右各留一整片空地：最邊邊那一格也能被拖到畫面中間來看，
     不必歪著頭看螢幕邊緣。空地只是捲動範圍，不影響版面本身。 */
  /* 拼板 也是同一套空地 */
  #boardOverview #sheetMain{padding:30vh 40%}
  /* 那兩片空地會把內容欄壓得很窄。版面自己有寬度不受影響，但刊頭那行標題會被
     擠成一個字一行 — 讓它不要斷行，寧可超出內容欄。 */
  /* 空地會把內容欄壓窄，標題那行不要跟著斷行 */
  #blockHead{white-space:nowrap;flex:none}
  #boardOverview .cell{pointer-events:auto;cursor:pointer;user-select:none;
    transition:outline-color .12s,background .12s,opacity .12s}
  /* 搬列用的 ⋮⋮ 是 落版 的工具：PM 不搬列，那條就不該在他眼前 */
  #boardOverview.pm .grip{display:none}
  /* 不歸這位 PM 管的格子：看得到位置，但不是他的活，點不進去 */
  #boardOverview .cell.dim{opacity:.26}
  /* 滾輪縮放、按著拖曳平移：整片版面在手上，跟拼板那頁同一套手感 */
  #boardOverview{cursor:grab;user-select:none}
  #boardOverview.panning{cursor:grabbing}
  #boardOverview.panning .cell{cursor:grabbing}
  #boardOverview .cell:hover{outline:2px solid var(--blue);outline-offset:-2px;background:var(--accent-tint)}
  /* 那一格裡面跑的就是拼板本人（2cell-product-pick.html 的畫布模式），照這一格
     的大小把 540×420 整個縮進去。所以這不是縮圖，是同一塊畫布 —
     旁邊面板勾了什麼，這裡當場就長出來。
     isolate 讓卡片自己開一層，畫布 z-index:-1 壓在卡片底色之上、文字之下。 */
  #boardOverview .cell{position:relative;isolation:isolate}
  .ccanvas{
    position:absolute;inset:0;z-index:-1;width:100%;height:100%;
    border:0;background:transparent;pointer-events:none;
  }
  /* 正在拼的那一格，設計可以直接在版上搬東西；PM 只挑貨，不搬版 */
  /* 每一格的畫布都收得到滑鼠 —— 要拖一塊零件就直接拖，不必先點開那一格。
     （本來只有 .editing 那一格收得到，於是每次都是「點一下、再拖」兩個動作。）
     三種時候要把整片還給外面，因為那時候手勢講的是格子、不是格子裡的零件：
       tooling  拿著 搬移／複製
       stamping 蓋章（點一格＝進下一關、拖一個框＝一次一片）
       assigning 指派（點一格＝歸這位 PM、拖一個框＝一次指一片）
       arming   手上拿著貼紙，下一下是貼上去
     按在格子裡的空白處不必特別處理：那一下畫布會轉出來（stagePass），而在格子上
     本來就不平移，所以外面直接當成「點這一格」就好。 */
  #boardOverview:not(.pm):not(.tooling):not(.stamping):not(.assigning):not(.arming)
    .ccanvas{pointer-events:auto}
  /* 從桌面拖一張圖進來的那幾秒：畫布整個浮上來收 drop。平常它 pointer-events:none
     又壓在卡片底下（z-index:-1），不先點進那一格根本收不到 —— 但拖圖換商品圖
     不該還要先點兩下，看到哪一格就丟哪一格。 */
  #boardOverview.filedrag .ccanvas{pointer-events:auto;z-index:1}
  /* 拼過的格子上，落版打的字收起來 —— 那裡畫布才是主角。
     還沒拼的格子沒有東西可看，字就是它唯一的身分，一直留著。
     （以前有一顆「顯示落版文字」可以把字叫回來。落版 已經不打品名了，
       那顆按鈕對新檔期永遠是空的，留著只是一顆按了沒反應的鈕。） */
  #boardOverview .cell.filled{font-size:0}
  /* 編輯那一格 = 貼在那一格右邊的一塊版面，不是另外開的視窗：它跟著版面一起
     捲動、一起平移，所以它永遠黏在那一格旁邊。擋住旁邊幾格沒關係。 */
  #boardStage{
    /* 220：壓過版面上所有東西 —— 便利貼、紅色數字、身分列（120）、尺標（100）。
       面板是「你現在正在動的那一格」，被一張貼紙蓋住就等於用不了。
       比 toast(400)、modal(500) 低是刻意的：那兩種本來就該蓋在它上面。 */
    position:fixed;z-index:220;display:none;flex-direction:column;gap:6px;
    overscroll-behavior:contain;
    pointer-events:auto;                 /* 總覽把整張版關掉了，這塊要開回來 */
    background:var(--surface);border:2px solid var(--blue);border-radius:10px;
    box-shadow:0 6px 22px rgba(31,62,166,.18);padding:8px;
  }
  #boardStage.on{display:flex;animation:pop-in .14s ease-out both}
  @keyframes pop-in{from{opacity:0}to{opacity:1}}
  #boardStageBar{display:flex;align-items:center;gap:10px;flex:none;user-select:none}
  #boardWhich{font-size:14px;font-weight:800;color:var(--ink)}
  #boardWhich .sub{color:var(--muted);font-weight:800;margin-left:8px;font-size:12.5px}
  #boardStage .close{
    margin-left:auto;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);
    line-height:1;padding:5px 10px;
  }
  #boardStage .close:hover{background:var(--surface-2);color:var(--ink)}
  /* 面板開著的時候，被拼的那一格自己亮起來，兩邊才對得上 */
  #boardOverview .cell.editing{outline:3px solid var(--blue);outline-offset:-3px;background:var(--accent-tint)}
  #boardFrame{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

  /* ---- 標記／留言（貼紙欄 + 意見欄）------------------------------------------
     照 block-comment-demo / block-review-demo 那兩支的做法搬過來：貼紙是實體，
     用拖的貼到格子上；貼上去就是一則問題，右邊那欄像 Word 的註解欄一樣，
     一則一張卡，可以回覆、可以標成處理完。
     字一律大而粗、按鈕至少 48px：這是站在版子前面看的東西。 */
  /* 意見欄靠著畫面右邊站，從分頁列底下一路到底 —— 它蓋過上面那兩條，
     因為問題清單比檔期名重要。版面那邊讓出等寬的位置，不會被壓到。 */
  #boardRail{
    position:absolute;top:var(--rail-top,60px);right:0;bottom:0;z-index:60;
    width:var(--railw,340px);display:flex;flex-direction:column;gap:7px;
    background:var(--surface);border-left:2px solid var(--line);
    padding:10px 12px;overflow:visible;
    transition:width .14s ease;
  }
  #view-board{padding-right:calc(var(--railw,340px) + 10px)}
  .app.rail-mini{--railw:26px}
  #boardRail.mini{padding:10px 4px}
  /* 開著某一格的面板時，意見欄讓位，只留一條看得懂的邊：紅字就是還欠幾則。
     面板和意見欄輪流上場，畫面上永遠只有一個「右邊」。 */
  #boardRail.mini > *:not(.fold-bar){display:none}
  /* 書籤獨立撐滿整條欄位的高度，才會停在畫面的正中央 */
  #boardRail .fold-bar{position:absolute;left:0;top:0;bottom:0;width:0;align-self:auto}
  #railHead{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  #railTitle{font-size:14px;font-weight:800;color:var(--ink)}
  #railSub{font-size:11.5px;font-weight:800;color:var(--muted);width:100%}
  #railBack{
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:none;
    border:2px solid var(--blue);border-radius:9px;padding:5px 10px;
    background:var(--accent-tint);color:var(--blue);
  }
  #railBack.on{display:block}
  /* 類型篩選：一顆一種，數字是還沒處理的 */
  /* 分類按鈕一定排一列：擠一點沒關係，換行會把下面的問題擠掉 */
  #railLegend{display:flex;gap:5px;flex-wrap:nowrap;flex:none}
  .lg{
    flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    border:2px solid var(--line);border-radius:999px;padding:4px 5px;background:var(--surface);color:var(--ink-dim);
  }
  .lg:hover{border-color:var(--lc)}
  .lg.on{background:var(--lc);border-color:var(--lc);color:var(--ink-strong)}
  .lg.zero{opacity:.45}

  /* 貼紙欄：拖一張下去就是一則 */
  /* 貼紙一列排開，整疊一定看得到 —— 它是入口，不該被塞進一個小捲軸裡。
     上面那些字讓小一點就排得下，會捲的只有下面的問題清單。 */
  #stickTray{flex:none;overflow:visible;
             border:2px dashed var(--line);border-radius:12px;padding:6px}
  #stickTray .hint{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
  #stickRow{display:flex;gap:6px;flex-wrap:nowrap}
  /* 換手鍵：綠色，跟版位、格子「在對方手上」同一個顏色 —— 按下去之後版上會
     長出來的就是那個綠。它不是便利貼，所以不做成方的一張，也不歪 —— 一眼要看得出
     它跟旁邊那疊是兩種東西。 */
  #stampBtn{
    display:flex;align-items:center;gap:9px;width:100%;margin-top:8px;
    font:inherit;text-align:left;cursor:pointer;
    border:2px solid var(--green-rule);border-radius:10px;padding:8px 10px;
    background:var(--ok-tint);color:var(--ok-ink);
  }
  #stampBtn[hidden]{display:none}
  #stampBtn:hover{filter:brightness(.97)}
  #stampBtn .ico{font-size:20px;line-height:1;flex:none}
  #stampBtn .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
  #stampBtn .tx b{font-size:13.5px;font-weight:800}
  #stampBtn .tx small{font-size:11px;font-weight:800;opacity:.8}
  /* 開著的時候整顆反白：這是一個模式，不是按一下就結束的動作 —— 現在點格子
     的意思跟平常不一樣，那件事要一直看得見。 */
  #stampBtn.on{background:var(--green-ink,#1a7f47);border-color:var(--green-ink,#1a7f47);color:#fff}
  #stampBtn.on .tx small{opacity:.9}
  /* 指派長得跟蓋章同一種，只是換一個顏色：蓋章講的是「換手了沒」（綠＝在對方
     手上），指派講的是「換的是誰」—— 兩件事同一隻手做，但答的不是同一個問題，
     所以不共用同一個綠。用藍是因為它就是「你正在點的東西」那一套。 */
  /* 落版 工具列裡那顆：藍的一小條，跟 拼板 那顆同一個顏色（同一個模式），
     但長得像工具列的鄰居，不像意見欄裡那疊便利貼。 */
    font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;width:100%;
    border:2px solid var(--blue);border-radius:9px;padding:7px 6px;
    background:var(--accent-tint);color:var(--blue);
  }
  /* 指派中的 落版：格子是拿來指的，游標和 hover 都照 拼板 那一套 */
  #board.assigning .cell{cursor:crosshair}
  #board.assigning .cell:hover{outline:3px solid var(--blue);outline-offset:-3px}
  #board.assigning .grip{cursor:crosshair}
  /* 貼紙欄裡的也是便利貼：方的一疊，拿起來就往版面上貼 */
  .stick{
    /* max-width 是為了「只剩一種」：flex:1 會讓單獨一張撐滿整條意見欄，變成一塊
       跟真正的便利貼一點都不像的大色塊。112px 就是以前三張並排時各自的寬度。 */
    position:relative;flex:1 1 0;min-width:0;max-width:112px;aspect-ratio:1/1;
    font-family:inherit;font-size:13px;font-weight:800;
    cursor:grab;border:0;border-radius:1px;color:var(--ink-strong);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    user-select:none;
    background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(0,0,0,.06));
    box-shadow:1px 1px 0 rgba(0,0,0,.06), 3px 4px 9px rgba(16,24,40,.24);
    clip-path:polygon(0 0,100% 0,100% 82%,82% 100%,0 100%);
    transform:rotate(-1.5deg);transition:transform .1s;
  }
  .stick::after{
    content:"";position:absolute;right:0;bottom:0;width:18%;height:18%;
    background:linear-gradient(135deg,rgba(0,0,0,.18),rgba(0,0,0,.02));
  }
  .stick:nth-child(even){transform:rotate(1.5deg)}
  .stick .ico{font-size:21px;line-height:1}
  .stick:hover{transform:rotate(0deg) scale(1.03)}
  .stick:active{cursor:grabbing}
  .stick.armed{outline:3px solid var(--ink-strong);outline-offset:2px;transform:rotate(0deg)}
  #armHint{
    display:none;flex:none;font-size:13.5px;font-weight:800;color:#8a4b00;
    background:var(--warn-tint);border:2px solid var(--warn-line);border-radius:10px;padding:7px 9px;
  }
  #armHint.on{display:block}

  /* 意見欄：一則一張卡 */
  /* 問題清單是這一欄的主角：至少佔四分之三，其他東西自己讓 */
  #railList{
    flex:1 1 auto;min-height:0;overflow:auto;
    display:flex;flex-direction:column;gap:10px;
  }
  .icard{
    border:2px solid var(--line);border-left:10px solid var(--nc,#98a2b3);
    border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;
  }
  .icard:hover{background:var(--surface-2)}
  .icard.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,111,220,.22)}
  .icard.done{background:#f6f8fa}
  .icard .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .icard .who{font-size:15px;font-weight:800;color:var(--ink)}
  .icard .where{
    font-size:13px;font-weight:800;color:var(--blue);
    background:var(--accent-tint);border-radius:999px;padding:2px 9px;
  }
  .icard .state{
    margin-left:auto;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;
    background:var(--danger-tint);color:var(--danger-ink);
  }
  .icard.done .state{background:var(--ok-tint);color:var(--ok-ink)}
  .icard .kind{font-size:16px;font-weight:800;color:var(--nc,#374151);margin-top:6px;
    display:flex;align-items:center;gap:6px}
  .icard .kind .ico{font-size:20px;line-height:1}
  /* 人寫的字自己寫死顏色。意見欄站在深色的桌面上，卡片卻是白的 —— 不寫就會
     繼承桌面那套淺灰（#eaeef7），白卡片上幾乎看不見。 */
  .icard .body{font-size:17px;font-weight:700;line-height:1.5;margin-top:5px;
    color:var(--ink-strong);white-space:pre-wrap;word-break:break-word}
  .icard.done .body{text-decoration:line-through;color:var(--muted)}
  .icard .body.blank{color:var(--muted)}
  .icard .meta{font-size:13.5px;font-weight:800;color:var(--muted);margin-top:5px}
  .icard .replies{margin:9px 0 0 4px;padding-left:10px;border-left:4px solid var(--line);
    display:flex;flex-direction:column;gap:8px}
  .icard .reply .who{font-size:14px;font-weight:800;color:var(--blue)}
  .icard .reply .rtext{font-size:16px;font-weight:700;line-height:1.45;
    color:var(--ink-strong);white-space:pre-wrap}
  .icard .box{display:none;margin-top:10px}
  .icard.sel .box{display:block}
  .icard .box textarea{
    width:100%;font-family:inherit;font-size:16px;font-weight:700;line-height:1.4;
    border:2px solid var(--line);border-radius:9px;padding:9px 10px;resize:none;height:64px;
  }
  .icard .box textarea:focus{outline:none;border-color:var(--blue)}
  .icard .acts{display:flex;gap:8px;margin-top:8px}
  .icard .acts button{
    flex:1;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;min-height:48px;
    border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);
  }
  .icard .acts .send{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .icard .acts .ok{border-color:var(--ok-ink);color:var(--ok-ink)}
  .icard .acts .ok:hover{background:var(--ok-tint)}
  .icard .acts .del{border-color:var(--danger-ink);color:var(--danger-ink)}
  .icard .acts .del:hover{background:var(--danger-tint)}
  #railEmpty{font-size:17px;font-weight:800;color:var(--muted);text-align:center;padding:26px 8px}
  .icard .owned{
    font-size:14.5px;font-weight:800;color:#8a4b00;background:var(--warn-tint);
    border:2px solid var(--warn-line);border-radius:9px;padding:8px 10px;margin-bottom:8px;
  }

  /* ---- 格子上的貼紙：貼在放下去的那個位置，大到掃一眼就看得到 ---- */
  /* 貼紙就是便利貼：方的、微微歪一點、右下角有影子，像真的黏上去 */
  .cmk{
    position:absolute;z-index:3;
    /* 便利貼可以用手挪：拖它換位置，點它就是點那一則 */
    pointer-events:auto;cursor:grab;touch-action:none;
    /* 便利貼是貼在版面「某一個點」上的：它指著那一格裡的某個東西。所以放大版面
       看細節時，它得跟著長大，才還指得準；縮小時也跟著縮，才不會一張貼紙蓋掉
       整格。上下各留一個界限 —— 太小抓不住，太大就把版面蓋掉了。 */
    --zs:clamp(.55, var(--z,1), 1.7);
    width:30px;height:30px;border-radius:0;
    transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(var(--zs));
    display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:15px;font-weight:800;color:var(--ink-strong);
    /* 紙：左上受光、右下沉，中間有一點點紙的紋路 */
    background-image:
      linear-gradient(155deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.10) 42%,rgba(0,0,0,.09) 100%);
    /* 一張紙只黏得住上緣，下緣會微微翹起來 —— 影子從上到下越拉越開 */
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 1px 1px rgba(16,24,40,.14),
      2px 5px 10px rgba(16,24,40,.30);
    clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  /* 右下角折起來的那一小塊：斜邊旁邊是紙的背面，比正面暗 */
  .cmk::after{
    content:"";position:absolute;right:0;bottom:0;width:26%;height:26%;
    clip-path:polygon(100% 0,100% 100%,0 100%);
    background:linear-gradient(135deg,rgba(0,0,0,.30),rgba(0,0,0,.06));
  }
  /* 黏在牆上的那條膠：上緣中間一小段半透明 */
  .cmk::before{
    content:"";position:absolute;left:28%;right:28%;top:-3px;height:7px;
    background:rgba(255,255,255,.42);
    box-shadow:0 1px 2px rgba(16,24,40,.16);
  }
  .cmk:hover{transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(calc(var(--zs) * 1.06))}
  .cmk.dragging{
    /* 拖的時候讓它自己「透明」，底下才問得出來現在在哪一格上面 */
    cursor:grabbing;z-index:9;transition:none;pointer-events:none;
    transform:translate(-50%,-50%) rotate(var(--rot,-2.5deg)) scale(calc(var(--zs) * 1.14));
    box-shadow:4px 12px 22px rgba(16,24,40,.38);
  }
  /* 角落那一個字＝誰貼的。壓在紙的左下角，不擋中間那個圖示 */
  .cmk-who{
    position:absolute;left:2px;bottom:1px;font-size:8.5px;font-weight:800;line-height:1;
    color:rgba(16,24,40,.6);font-style:normal;pointer-events:none;
  }
  /* 別人的便利貼：看得到、點得開，但搬不動 */
  .cmk.theirs{cursor:pointer}
  .cmk.done{opacity:.4}
  /* 讓開：畫布裡選了一塊零件，工具列剛好開在這張貼紙底下。工具列在 iframe 裡面，
     貼紙在外面，iframe 裡的 z-index 壓不過外面 —— 只好讓貼紙自己退開。
     只退「真的疊到」的那幾張，其餘照樣看得見；一放掉選取就回來。 */
  .cmk.dodge{opacity:0;pointer-events:none}
  .cmk.sel{outline:3px solid var(--ink-strong);outline-offset:1px}
  /* 格子本身 overflow:hidden，而且最邊上那排格子外面就是版面邊界 —
     所以這顆數字貼在格子「裡面」的角落，不掛在外面，才不會被切掉。 */
  .cnb{
    /* 貼左上角：右上角是畫布自己那顆 ＋（放回刪掉的零件）的位置。兩顆數字長得像、
       意思完全不同，疊在一起只會讓人點錯 —— 讓開的是這一顆，它是外面貼上去的提示，
       ＋ 才是版面自己的東西。 */
    position:absolute;left:3px;top:3px;z-index:4;pointer-events:none;
    /* 跟便利貼同一套：大小是固定的，縮放走 transform，數字才不會抖。
       只往下縮、不往上長：版面縮小它跟著縮，放大時它就停在原本大小 ——
       它是一個提示，不是版面的一部分，湊近看不該變成一顆紅球。 */
    transform:scale(min(1, var(--z,1)));transform-origin:0 0;
    min-width:20px;height:20px;padding:0 5px;border-radius:999px;
    background:var(--danger);color:var(--surface);font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--surface);box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  /* 這一格在誰手上。右上角本來就是留給它的一角（畫布那顆 ＋ 因此讓到左下，
     見 2cell 的 restoreBar）—— 左上是紅色未處理數字，版面自己的品牌品名在左上、
     價格在右下，四個角各有各的東西。
     只給一個角，不給一圈框：格子是一格挨著一格的，每一格框一圈之後版面上看到的
     是格與格之間一條一條的彩色線，那是格線不是版面（那一版收掉過，見下面）。 */
  /* 掛在列上，不掛在格子裡：格子是 overflow:hidden 的（版面最邊上那排格子外面就是
     版面邊界），掛在格子裡就只能貼在角落內側，往上一移就被自己那一格切掉。
     列沒有裁切，所以標籤掛在列上才浮得到格子上緣外面 —— 像從格子上緣探出來的標籤。
     位置是 paintCellState 照那一格的 offsetLeft/Width 算的。 */
  .cst{
    position:absolute;z-index:6;pointer-events:none;
    /* 貼齊那一格的右上角，然後整個往左上退出去：右緣對齊格子右緣、下緣坐在格子上緣 */
    transform:translate(-100%,-100%);
    /* 固定大小 —— 它是外面貼上去的提示，不是版面的一部分，版面放大它不該跟著長。
       格子的 font-size 乘了 --z，所以這裡自己寫死 px 把那一份蓋掉。 */
    font-size:9px;line-height:1;font-weight:800;
    padding:2px 5px 3px;border-radius:4px 4px 0 0;
    white-space:nowrap;color:var(--ink-strong);
    /* 顏色＝在誰手上，跟便利貼同一套（ROLE_COLOR）：同一條「設計／PM」的軸，
       就不要再發明第二種配色讓人多記一張對照表。 */
    background:var(--cst,#ffd447);
    box-shadow:0 -1px 2px rgba(16,24,40,.14);
  }
  #boardOverview.nomarks .cmk,#boardOverview.nomarks .cnb,
  #boardOverview.nomarks .cst{display:none}
  /* 這一格在誰手上曾經是整格一圈框（設計淡紫／PM 黃）。框拿掉了 ——
     格子是一格挨著一格的，每一格都框一圈之後，版面上看到的是格與格之間
     一條一條的彩色線，那是格線，不是版面。剩下的兩個記號夠用：不是你的
     回合就壓暗，滑過去 title 會說你現在能做什麼。 */
  /* 不是你的回合：壓暗、碰不到，但整張版一直都在 —— 排版是整張版的事，
     而且棒子傳出去之後你還得看得到它變成什麼樣。 */
  #boardOverview .cell.notmine{opacity:.45;cursor:default}
  #boardOverview .cell.notmine:hover{outline:none}
  /* 蓋章模式例外：那時候你就是在管棒子，對方那幾格也要點得到（蓋錯了要拿得回來）。 */
  #boardOverview.stamping .cell.notmine{opacity:.75;cursor:crosshair}
  /* 拖著貼紙經過時，那一格自己站出來 */
  #boardOverview .cell.drop{outline:4px solid var(--warn);outline-offset:-4px;background:#fff6e6}
  #boardOverview.arming .cell{cursor:copy}
  /* 意見欄點到某一格：其他格子讓開 */
  #boardOverview .cell.focus{outline:4px solid var(--blue);outline-offset:-4px}
  #boardOverview.focusing .cell:not(.focus){opacity:.35}

  /* ---- PM 的左欄：不是小地圖，是「這個檔期有哪些品類」 ---- */
    position:relative;width:230px;flex:none;overflow:auto;padding-right:8px;
    border-right:1px solid var(--line);margin-right:10px;
    display:flex;flex-direction:column;transition:width .14s ease;
  }
    font-size:14.5px;font-weight:800;color:var(--ink);
    padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;
  }
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:5px 6px;border-radius:7px;font-size:13.5px;font-weight:800;color:var(--ink);
  }
    display:flex;align-items:center;gap:6px;cursor:pointer;
    padding:4px 8px;border-radius:6px;font-size:13px;color:var(--ink-dim);
  }
    font-size:11.5px;font-weight:800;color:var(--muted);
    margin:10px 4px 4px;padding-top:8px;border-top:1px dashed var(--line);
  }

  /* ---- PM 左欄的段落：三段疊起來比一個螢幕高，所以每一段都收得起來。
     標題整條可以點，右邊那個數字是「這一段裡有多少東西」—— 收起來之後它就是
     這一段唯一還看得到的資訊，所以不能只放三角形。 */
  .pm-sec .sec-head{
    display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    padding:9px 6px 8px;margin-top:6px;border-top:1px solid var(--line);
    font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  }
  #pmStack > .pm-sec:first-child .sec-head{margin-top:0;border-top:0}
  .pm-sec .sec-head .caret{font-size:10px;width:10px;flex:none}
  .pm-sec .sec-head .n{margin-left:auto;font-weight:800;font-size:11.5px;opacity:.85}
  /* 選擇器要帶著 #pmStack：這一段裡收的是 #sheetSide，它自己那條
     `display:flex` 是 id 選擇器 —— 只寫 .closed 的話權重贏不了，按了會沒反應。 */
  #pmStack .pm-sec.closed > :not(.sec-head){display:none}

  /* ---- 第一段：檔期列表。首頁那張 .plan-card 有 20px 內距、20px 的名字，
     整張搬進 286px 只剩名字看得到 —— 所以這裡是它的窄版：名字一行、出稿日和
     「我的幾支」一行。點一檔＝換一本 DM，不必退回列表再點進來。 */
  .pl-row{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    border:1px solid var(--line);border-radius:9px;
    background:var(--surface-2);color:var(--ink);
    padding:8px 10px;margin-bottom:6px;
  }
  .pl-row:hover{border-color:var(--blue)}
  .pl-row.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .pl-row .nm{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800}
  /* 這一檔正走在某一段裡（跟檔期卡上那顆倒數藥丸同一個意思，這裡只剩一顆點） */
  .pl-row .nm .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line-strong)}
  .pl-row .nm .dot.now{background:var(--warn)}
  .pl-row .sub{display:flex;gap:8px;margin-top:3px;font-size:11.5px;color:var(--muted)}
  .pl-row .sub .mine{font-weight:800;color:var(--amber)}
  .pl-row.active .sub{color:rgba(255,255,255,.85)}
  .pl-row.active .sub .mine{color:#ffe6b8}
  .pl-note{font-size:11px;color:var(--muted);padding:0 6px 4px;line-height:1.5}

  /* ================= 總體 : board + rulers ================= */
  .board{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .board h3{font-size:16px;font-weight:800;color:var(--muted)}

  /* ruler chrome sits OUTSIDE the workspace in a grid, per 1排版切割.html:
     corner + top strip + left strip, all fixed size regardless of board scale */
  .board-grid{display:grid;grid-template-columns:var(--ruler-w) auto;grid-template-rows:var(--ruler-w) auto}
  .ruler-corner{
    grid-column:1;grid-row:1;background:var(--ruler-bg);
    border-right:1px solid var(--ruler-line);border-bottom:1px solid var(--ruler-line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--muted);user-select:none;
  }
  .ruler-top,.ruler-left{position:relative;overflow:hidden;background:var(--ruler-bg)}
  .ruler-top{grid-column:2;grid-row:1;border-bottom:1px solid var(--ruler-line)}
  .ruler-left{grid-column:1;grid-row:2;border-right:1px solid var(--ruler-line)}

  .tick{position:absolute;background:var(--ruler-tick)}
  .tick.hi{background:var(--blue);box-shadow:0 0 0 .5px var(--blue)}
  .tick-label{position:absolute;color:var(--ruler-label);font-size:10px;font-weight:800;user-select:none;white-space:nowrap}
  .tick-label.hi{color:var(--blue)}
  .ruler-cap{position:absolute;font-size:11px;font-weight:800;color:var(--muted)}

  /* live cursor marker + value badge (1排版切割.html .ruler-marker) */
  .ruler-marker{position:absolute;background:var(--blue);z-index:100;pointer-events:none;display:none}
  .ruler-marker.on{display:block}
  .ruler-marker-x{top:0;bottom:0;width:1px}
  .ruler-marker-y{left:0;right:0;height:1px}
  .ruler-marker::after{
    content:attr(data-val);position:absolute;background:var(--blue);color:var(--surface);
    font-size:10px;font-weight:800;padding:1px 5px;border-radius:3px;white-space:nowrap;
  }
  .ruler-marker-x::after{top:2px;left:3px}
  .ruler-marker-y::after{left:2px;top:3px}

  .board-ws{grid-column:2;grid-row:2;position:relative;background:var(--surface);box-shadow:0 0 0 1px var(--rule);overflow:hidden}

  .split-container{display:flex;width:100%;height:100%;overflow:hidden}
  .fold{width:2px;background:#5b6472;flex:none}
  .window-node{
    box-sizing:border-box;border:1px solid var(--line-strong);position:relative;
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .window-node.unowned{background:#e9ecf2;border-color:#cdd4e0}
  .window-node.handed{background:#dff0e5;border-color:var(--green-rule)}
  /* 切出來卻沒填品類／支數的那幾塊：草稿還沒提交時自己框起來。
     不用底色 —— 底色講的是「球在哪」，這一條講的是「這裡還沒填完」。 */
  #view-total.drafting .window-node.empty-seg{
    outline:2.5px solid var(--danger);outline-offset:-2.5px;
  }

  /* 總體上點版位＝選它。藍色是「你正在點的東西」，所以選取畫成藍框而不是藍底 ——
     底色已經被狀態用掉了（灰／白／綠），再拿去表示選取，兩件事就混在一起。 */
  #view-total .window-node{cursor:pointer}
  #view-total .window-node.sel{
    outline:3px solid var(--blue);outline-offset:-3px;
    box-shadow:inset 0 0 0 9999px rgba(74,111,220,.07);
  }
  /* ---- 總體 的小工具列。照 #toolRail 那條長，只是矮一點：這一頁的工具只有三個，
     不必佔滿整個高度。 ---- */
  /* 釘在左邊：這一頁的兩張版比畫面寬，而且是置中排的 —— 不釘的話工具列會被推到
     捲軸的左邊外面，變成一條看不到也捲不回來的東西。 */
  #totalRail{
    position:sticky;left:4px;z-index:20;
    flex:none;width:52px;margin:26px 10px 10px 4px;border-radius:8px;align-self:flex-start;
    background:var(--blue);color:var(--surface);display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:11px 0 10px;user-select:none;
  }
  #totalRail .rail-title{font-size:15px;letter-spacing:3px;margin-bottom:4px}
  #totalRail .tool{width:36px;height:36px;font-size:17px}
  /* 方向那兩顆是 切分 的下半截：小一號、接在同一條上，讀起來是「切分怎麼切」，
     不是第四、第五個工具。 */
  #cutDirs{
    display:none;flex-direction:column;align-items:center;gap:6px;
    margin-top:3px;padding-top:8px;border-top:1px solid rgba(255,255,255,.32);
  }
  #totalRail .tool.sub{width:30px;height:30px;font-size:14px}
  #totalRail .tool.sub.on{background:var(--surface);color:var(--blue);border-color:var(--surface);font-weight:800}

  /* 切分：紅色那條線就是這一刀會落在哪，旁邊寫著它離那一塊的邊幾公分 ——
     跟行銷開檔那支（落版單系統 #cutPreview）同一個樣子、同一個單位。
     position:fixed 掛在 body 上，不塞進版位裡面。 */
  #cutPreview{
    position:fixed;z-index:400;pointer-events:none;display:none;
    background:var(--danger);box-shadow:0 0 0 1px rgba(255,255,255,.55);
  }
  #cutPreview .lbl{
    position:absolute;background:var(--danger);color:var(--surface);
    font-size:12px;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap;
  }
  #cutPreview.v .lbl{left:3px;top:0}
  #cutPreview.h .lbl{top:3px;left:0}
  /* 這個數字超出那一塊：線貼在邊上、整條淡掉 —— 看得出「這一刀不成立」 */
  #cutPreview.over{opacity:.45}
  /* 指著的那一塊：紅框。手移到「切下去」那顆鈕之後，靠它才知道切的是誰 */
  .window-node.cut-aim{outline:2px solid var(--danger);outline-offset:-2px}

  /* 品類／支數：貼在那一塊旁邊的小卡。白底 —— 它是「紙上的東西」，不是桌面的控制項，
     所以不跟著深色那一套（深色底上的白卡要自己寫 color，不寫會繼承成看不見的淺灰）。 */
  #itemPop{
    position:fixed;z-index:420;display:none;width:268px;
    background:var(--surface);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 32px rgba(16,24,40,.28);padding:10px 12px 11px;
  }
  #itemPop.on{display:block}
  #itemPop .ip-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  #itemPop .ip-title{font-size:14px;font-weight:800;color:var(--ink);flex:1;
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #itemPop .ip-x{
    font:inherit;font-size:13px;font-weight:800;line-height:1;cursor:pointer;
    border:1px solid var(--line);border-radius:7px;padding:3px 8px;
    background:var(--surface-2);color:var(--ink-dim);
  }
  #itemPop .ip-x:hover{border-color:var(--blue);color:var(--blue)}
  #itemPop .ip-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  #itemPop input{
    font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:var(--surface);
  }
  #itemPop input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  #itemPop .ip-name{flex:1;min-width:0}
  #itemPop .ip-qty{width:62px;text-align:right}
  #itemPop .ip-del,#itemPop .ip-plus{
    font:inherit;font-size:14px;font-weight:800;line-height:1;cursor:pointer;flex:none;
    width:28px;height:28px;border-radius:7px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink-dim);
  }
  #itemPop .ip-del:hover{border-color:var(--danger);color:var(--danger-ink);background:var(--danger-tint)}
  #itemPop .ip-plus{border-color:var(--accent-line);background:var(--accent-tint);color:var(--blue)}
  #itemPop .ip-plus:hover{background:var(--accent-tint-2)}
  /* 加一筆的那一列跟已經有的那幾列之間畫一條線：上面是「現在有什麼」，下面是「再加一個」 */
  #itemPop .ip-add{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:9px;
                   border-top:1px dashed var(--line)}
  #itemPop .ip-note{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.5}

  /* 切在幾公分：跟開檔那支一樣站在最上面那條，只有 切分 拿起來時才出現 ——
     它是那一顆工具的參數，不是整頁的設定。 */
  #cutBar{
    display:none;align-items:center;gap:6px;flex:none;
    font-size:13.5px;font-weight:800;color:var(--chrome-ink);
    background:rgba(255,255,255,.09);border:1px solid var(--chrome-line);
    border-radius:8px;padding:5px 10px;
  }
  #cutBar.on{display:flex}
  #cutBar input{
    width:66px;font:inherit;font-size:13.5px;text-align:right;
    border:1px solid var(--chrome-line);border-radius:5px;padding:3px 6px;
    background:var(--surface);color:var(--ink);
  }
  /* 這個長度切不下去（比那一塊還長）：閃一下紅，不要靜靜地不動 */
  #cutBar.bad input{border-color:var(--danger);background:var(--danger-tint)}
  #cutBar .btn{padding:4px 11px;font-size:13px}
  /* 一顆切分工具，方向由那兩顆鈕（或滾輪）決定 —— 所以游標自己說現在是哪一種，
     圖案跟開檔那支同一個（寫著「直」／「橫」的那兩顆，見 --cursor-v/h）。 */
  #view-total.t-cut.dir-v .window-node{cursor:var(--cursor-v)}
  #view-total.t-cut.dir-h .window-node{cursor:var(--cursor-h)}
  #view-total.t-swap .window-node{cursor:grab}
  #view-total.t-swap .window-node:active{cursor:grabbing}
  /* 拿起來的那一塊淡掉、要換過去的那一塊亮起來：一眼看得出「誰跟誰換」 */
  #view-total .window-node.swap-from{opacity:.45}
  #view-total .window-node.swap-to{outline:3px dashed var(--blue);outline-offset:-3px}

  /* 狀態小字：固定大小 —— 它是標記，不是版面的一部分，版位縮到多小都要讀得到 */
  .blk-state{
    position:absolute;top:3px;left:4px;z-index:2;pointer-events:none;
    font-size:10.5px;font-weight:800;line-height:1.2;
    border-radius:999px;padding:1px 7px;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
  }
  .blk-state.s-done{background:var(--ok-tint);border-color:var(--green-rule);color:var(--ok-ink)}
  .blk-state.s-wip {background:var(--surface);border-color:#c9d8f8;color:var(--ink-dim)}
  .blk-state.s-none{background:#e9ecf2;border-color:#cdd4e0;color:#8b95a6}
  /* 交出一半：黃的。綠色代表「這塊沒你的事了」，交一半還不到那個程度。 */
  .blk-state.s-half{background:var(--warn-tint,#fff6e6);border-color:#e8c98a;color:#8a5a12}

  /* 蓋章列：浮在 拼板 下緣正中間。深色的一條，壓在淺色的版面上才看得清楚，
     而且擺在中間不會跟右邊那顆確認鍵、左邊的尺搶位置。 */
  #stampBar{
    /* bottom 抬高到 76：toast 就站在 bottom:34 的正中間，擺 24 的話每蓋一次章，
       跳出來的 toast 就正好蓋住這一列 —— 剛動完手的地方被遮住最惱人。 */
    position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;
    display:none;align-items:center;gap:9px;
    background:var(--chrome);border:1px solid var(--chrome-line);border-radius:999px;
    padding:8px 10px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.34);
    font-size:13px;font-weight:800;color:var(--chrome-ink);
  }
  #stampBar.on{display:flex}
  #stampBar .hint{color:var(--chrome-muted);font-weight:800}
  #stampBar .n b{color:#fff}
  #stampBar button{
    font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    border:1px solid var(--chrome-line);border-radius:999px;padding:5px 13px;
    background:var(--chrome-2);color:var(--chrome-ink);
  }
  #stampBar button:hover{background:#3a4457;border-color:var(--blue)}
  #stampBar button.primary{
    background:var(--blue);border-color:var(--blue);color:#fff}
  #stampBar button.primary:hover{filter:brightness(1.08)}
  #stampBar button[hidden]{display:none}
  /* 指給誰：這一條裡唯一「你要先選」的東西，所以它長得像個欄位不像個鈕 */
    font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    border:1px solid var(--blue);border-radius:999px;padding:5px 10px;
    background:var(--chrome-2);color:var(--chrome-ink);
  }
  /* 蓋章中：游標換成章，格子一格一格清楚地分開（平常那是連在一起的一張版）。 */
  #boardOverview.stamping,#boardOverview.assigning{cursor:crosshair}
  #boardOverview.stamping .cell,#boardOverview.assigning .cell{cursor:crosshair}
  #boardOverview.stamping .cell:hover,#boardOverview.assigning .cell:hover{
    outline:3px solid var(--blue);outline-offset:-3px}
  /* 指派中：不是你的回合那幾格也要點得到、也要看得清楚是誰的 —— 指派管的是
     「歸誰」，跟棒子現在在哪一邊無關（見 .notmine 那一段的同理由）。 */
  #boardOverview.assigning .cell.notmine{opacity:.75;cursor:crosshair}
  /* 框選中被框到的格子：藍色＝「你正在點的東西」，跟分頁、選取同一套 */
  #boardOverview .cell.stamp-sel{outline:3px solid var(--blue);outline-offset:-3px;
    background:var(--accent-tint)}
  /* 橡皮筋框本身。畫在視窗座標上（position:fixed），所以版面怎麼縮放平移都不影響。 */
  .stamp-box{
    position:fixed;z-index:210;display:none;pointer-events:none;
    border:1.5px solid var(--blue);background:rgba(31,110,235,.12);border-radius:2px;
  }
  .stamp-box.on{display:block}
  /* 按住 Alt 是拿回來：框子自己換個顏色，不必回頭看提示才知道現在是哪一種 */
  .stamp-box.take{border-color:var(--danger);background:rgba(200,40,40,.12)}
  .window-node.unowned .region-label div,
  .window-node.unowned .region-label .cnt{color:#98a1b2}
  .window-node.handed .region-label div,
  .window-node.handed .region-label .cnt{color:var(--green-ink)}
  .region-label{pointer-events:none;text-align:center;padding:2px}
  .region-label div{font-weight:800;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  /* 支數用紅的，跟小地圖同一套：數量是「還有多少要處理」，不是可以點的東西 */
  .region-label .cnt{color:var(--danger-ink)}

  /* z-index keeps the bar (and its fat hit area) above BOTH siblings —
     without it the following sibling paints over half the grab zone */
  .resizer{background:rgba(90,60,40,.55);flex:none;position:relative;touch-action:none;z-index:3}
  .resizer-vertical{width:1px;cursor:col-resize}
  .resizer-horizontal{height:1px;cursor:row-resize}
  .resizer::before{content:"";position:absolute;inset:0}
  /* ±7px grab zone — a 1px line is far too fine a target to hunt for */
  .resizer-vertical::before{left:-7px;right:-7px}
  .resizer-horizontal::before{top:-7px;bottom:-7px}
  .resizer.dragging{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}

  .guide{position:absolute;background:var(--blue);opacity:0;pointer-events:none;transition:opacity .1s;z-index:5}
  .guide.v{top:0;bottom:0;width:1px}
  .guide.h{left:0;right:0;height:1px}
  .guide.on{opacity:.85}
  /* Canva-style alignment guide: a distinct violet line, shown when the
     boundary lines up with ANOTHER divider rather than with the 公分 grid */
  .guide.obj{background:var(--align);box-shadow:0 0 0 .5px var(--align)}
  .guide.obj.v{width:2px}
  .guide.obj.h{height:2px}
  #tip.aligned{background:var(--align)}
  .ruler-marker.aligned{background:var(--align)}
  .ruler-marker.aligned::after{background:var(--align)}

  /* tool hint, after dm-block-zoom.html's #hint */
  /* 提示是浮在工具旁邊的小標籤，不是佔一整條的橫幅：它只在滑過去的時候出現，
     講的是「這一顆會做什麼」。橫幅那一版一直佔著版面的寬度，而它大部分時間
     沒有人在讀 —— 那條空間該留給版面。 */
  /* 工具提示：滑過工具才出現的一張小卡，貼在那一顆旁邊。
     深色底 —— 它會浮在深色工具列上，也會浮在白色版面上，只有深色兩邊都看得清楚。
     直的分三行（名字／做什麼／按鍵），不是橫的一條：橫的那一版是給整頁寬的橫幅用的，
     擠進一張小卡之後四段互相搶寬度，說明會被壓成一行一個字。 */
  #toolHint{
    position:fixed;z-index:60;pointer-events:none;display:none;
    width:max-content;max-width:230px;
    background:var(--ink-strong);color:#e9edf7;
    font-size:12.5px;font-weight:700;line-height:1.5;letter-spacing:.01em;
    padding:8px 11px;border-radius:9px;
    box-shadow:0 10px 26px rgba(16,24,40,.4);
  }
  /* 第一行：圖示＋名字＋快捷鍵 */
  #toolHint .ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;border-radius:5px;margin-right:6px;vertical-align:-4px;
    background:var(--blue);color:var(--surface);font-size:12px;
  }
  #toolHint .hint-name{font-weight:800;color:#fff}
  /* 說明和按鍵各自一行 —— 小卡裡沒有橫著排的空間 */
  #toolHint .hint-main{display:block;margin-top:5px;font-weight:600;color:#c6cfe4}
  #toolHint b{color:#9fc0ff;font-weight:800}
  #toolHint .hint-keys{
    display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);
    font-size:11.5px;font-weight:600;color:#95a1bd;
  }
  #toolHint .hint-keys span+span{margin-left:10px}
  #toolHint kbd{
    font-family:inherit;font-size:10.5px;font-weight:800;line-height:1;
    background:rgba(255,255,255,.13);color:#dbe4f7;border:0;
    border-radius:4px;padding:2px 5px;margin-right:4px;
  }
  #toolHint.pop{animation:hintPop .12s ease-out}
  @keyframes hintPop{from{transform:translateY(2px);opacity:0}to{transform:translateY(0);opacity:1}}

  #tip{
    position:fixed;z-index:99;pointer-events:none;display:none;
    background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:800;
    padding:4px 9px;border-radius:6px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(30,40,60,.3);
  }
  #tip.snapped{background:var(--blue)}
  body.dragging-col,body.dragging-col *{cursor:col-resize !important}
  body.dragging-row,body.dragging-row *{cursor:row-resize !important}
  body.dragging *{user-select:none}

  /* ================= 落版 : shell ================= */
  #view-sheet{gap:0;align-items:stretch}

  /* --- minimap sidebar (adapted from dm-block-zoom.html #minimap) --- */
  /* Sized and weighted to dm-block-zoom.html's minimap: 13px/700 labels,
     1.5px block rules, a 2px page frame, and a FILLED active state (its
     .mini-blk.active) rather than a thin outline — tuned for legibility. */
  /* 兩邊的欄位都收得起來：版面要看大的時候，把它們推到旁邊去 */
  #sheetSide{
    position:relative;flex:none;width:270px;overflow-y:auto;padding:2px 14px 10px 2px;
    display:flex;flex-direction:column;gap:9px;border-right:1px solid var(--line);
    transition:width .14s ease;
  }
  #sheetSide.mini{width:0;padding-left:0;padding-right:0;border-right:0}
  #sheetSide.mini > *{display:none}

  /* 收合的把手：站在欄位外緣的正中間，凸出來一塊，像書籤一樣 —— 一眼就看得到，
     而且不管欄位裡有什麼、捲到哪裡，它都在同一個地方。 */
  .fold-bar{
    flex:none;width:0;position:relative;align-self:stretch;
  }
  .fold-tab{
    position:absolute;top:50%;transform:translateY(-50%);z-index:8;
    width:20px;height:74px;padding:0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;line-height:1;
    border:2px solid var(--line);background:var(--bg);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;
    box-shadow:2px 0 6px rgba(16,24,40,.12);
  }
  .fold-tab:hover{background:#e9edf6;border-color:var(--blue);color:var(--blue)}
  /* 這根書籤是用推的：左右拖＝把欄位推寬推窄，點一下＝整條收起來 */
  .fold-tab{cursor:ew-resize;touch-action:none}
  .fold-bar.no-push .fold-tab{cursor:pointer}
  .fold-bar.pushing .fold-tab{border-color:var(--blue);color:var(--blue)}
  /* 推的時候不要有寬度動畫，欄位才跟得上手 */
  .no-anim{transition:none !important}
  .fold-bar.at-left .fold-tab{left:0;border-radius:0 9px 9px 0;border-left:0}
  .fold-bar.at-right .fold-tab{right:0;border-radius:9px 0 0 9px;border-right:0;
                               box-shadow:-2px 0 6px rgba(16,24,40,.12)}
  .fold-tab .n{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    min-width:20px;padding:1px 5px;border-radius:999px;
    background:var(--danger);color:var(--surface);font-size:12px;font-weight:800;
  }
  .fold-tab .n.zero{display:none}
  .mini-label{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.08em}
  /* 270 的欄寬扣掉捲軸和內距，剩 252 — 版面比例照舊（350:248），高度跟著縮 */
  .mini-page{position:relative;width:252px;height:179px;border:2px solid var(--ink);background:var(--surface);flex:none}
  .mini-split{display:flex;width:100%;height:100%;overflow:hidden}
  .mini-fold{width:3px;background:#3d444f;flex:none}
/* 小地圖是一張進度表，不是裝飾：底色只講這一塊走到哪了。
   灰＝還沒人管／還沒提明細　白＝還在設計手上　綠＝整塊都在 PM。三個都不搶眼 ——
   整個畫面上最有顏色的東西應該是版面本身和貼在上面的便利貼。 */
  .mini-blk{
    position:relative;
    border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.28;user-select:none;
    transition:background .12s,border-color .12s;padding:2px;
  }
  .mini-blk .cnt{color:var(--danger-ink);font-weight:800}
  .mini-blk:hover{background:var(--surface-3);border-color:var(--accent);color:var(--ink)}
  /* 還沒指派 PM：整塊灰掉，一眼看得出這一塊還沒有人管 */
  .mini-blk.unowned{background:#e9ecf2;border-color:#cdd4e0;color:#98a1b2}
  .mini-blk.unowned .cnt{color:#98a1b2}
  /* 選中：藍框，底色照舊 —— 換掉底色就看不出它本來是什麼狀態了 */
  .mini-blk.active{outline:3px solid var(--blue);outline-offset:-3px;
