}

/* ---- label auto-fit ----
   The text reflows and scales to whatever shape its segment happens to be:
   binary-search the largest size in [MIN, MAX] whose wrapped text still fits
   inside the region. Must re-run on anything that resizes a region — cutting,
   dragging a line, undo/redo, or a window resize. */
const LABEL_MAX = 15, LABEL_MIN = 6;
function fitLabel(node){
  const label = node.querySelector(':scope > .region-label');
  if (!label) return;
  const availW = node.clientWidth - 4, availH = node.clientHeight - 4;
  if (availW < 14 || availH < 12) { label.style.visibility = 'hidden'; return; }
  label.style.visibility = '';
  label.style.maxWidth = availW + 'px';
  const fits = () => label.scrollWidth <= availW + 0.5 && label.scrollHeight <= availH + 0.5;
  label.style.fontSize = LABEL_MAX + 'px';
  if (fits()) return;                        // roomy enough: keep full size
  let lo = LABEL_MIN, hi = LABEL_MAX;
  for (let i = 0; i < 6; i++) {
    const mid = (lo + hi) / 2;
    label.style.fontSize = mid + 'px';
    if (fits()) lo = mid; else hi = mid;
  }
  label.style.fontSize = lo.toFixed(2) + 'px';
}
function fitLabels(root){
  (root || boardsWrap).querySelectorAll('.window-node').forEach(fitLabel);
}

/* ---- history over both boards ---- */
let history = [], historyIndex = -1;
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
function clearTransient(){
  boardsWrap.querySelectorAll('.swap-src,.swap-target').forEach(n => n.classList.remove('swap-src','swap-target'));
}
function saveState(){
  clearTransient();
  history = history.slice(0, historyIndex + 1);
  history.push({ f: wsFront.innerHTML, b: wsBack.innerHTML });
  historyIndex++;
  updateHistoryButtons();
}
function updateHistoryButtons(){
  undoBtn.disabled = historyIndex <= 0;
  redoBtn.disabled = historyIndex >= history.length - 1;
}
function restore(i){
  wsFront.innerHTML = history[i].f;
  wsBack.innerHTML = history[i].b;
  fitLabels();
  updateHistoryButtons();
}
undoBtn.addEventListener('click', () => { if (historyIndex > 0) restore(--historyIndex); });
redoBtn.addEventListener('click', () => { if (historyIndex < history.length - 1) restore(++historyIndex); });
document.addEventListener('keydown', e => {
  if (views.layout.classList.contains('hidden')) return;
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === 'z' || e.key === 'Z') {
    e.preventDefault();
    if (e.shiftKey) redoBtn.click(); else undoBtn.click();
  } else if (e.key === 'y' || e.key === 'Y') {
    e.preventDefault();
    redoBtn.click();
  }
});

/* every board opens as a 對開 spread: two halves either side of a fixed fold.
   Both halves are flex:1 1 0 and nothing can resize them, so the fold stays
   dead centre no matter how the halves are cut up afterwards. */
function initBoards(){
  [wsFront, wsBack].forEach(ws => {
    ws.innerHTML = '';
    const spread = document.createElement('div');
    spread.className = 'split-container';
    spread.style.flexDirection = 'row';
    const half1 = document.createElement('div');
    const half2 = document.createElement('div');
    [half1, half2].forEach(h => {
      h.className = 'window-node';
      // pinned to exactly half the board minus half the fold. Not 'flex:1 1 0',
      // which would let border/content differences between the two halves
      // shift the fold once one of them is cut up.
      h.style.flex = '0 0 calc(50% - 1px)';
      h.style.minWidth = '0';
      h.style.backgroundColor = pastel();
    });
    const fold = document.createElement('div');
    fold.className = 'fold';
    spread.appendChild(half1);
    spread.appendChild(fold);
    spread.appendChild(half2);
    ws.appendChild(spread);
  });
  history = []; historyIndex = -1;
  saveState();
}

/* ---- board geometry: a landscape spread, two portrait halves across the fold ---- */
const BOARD_RATIO = 1.414;   // A3 landscape = two A4 portrait pages
const RULER = 26, BOARD_GAP = 22;
function layoutBoards(){
  const slot = boardsWrap.querySelector('.board-slot');
  const titleH = slot.querySelector('h3').offsetHeight + 6;
  const availH = boardsWrap.clientHeight - titleH - RULER;
  const availW = (boardsWrap.clientWidth - BOARD_GAP) / 2 - RULER;
  if (availH <= 0 || availW <= 0) return;   // view still hidden
  let w = availW, h = w / BOARD_RATIO;
  if (h > availH) { h = availH; w = h * BOARD_RATIO; }
  // even width => (w - fold) splits into two whole pixels, so the fold lands
  // exactly on centre instead of drifting a pixel on odd widths
  w = Math.floor(w / 2) * 2;
  [wsFront, wsBack].forEach(ws => {
    ws.style.width = w + 'px';
    ws.style.height = Math.floor(h) + 'px';
  });
  drawRulers();
  fitLabels();
}
window.addEventListener('resize', () => {
  if (!views.layout.classList.contains('hidden')) layoutBoards();
});

/* ---- rulers (per board), ported from 1排版切割 ---- */
function drawRuler(ws, rail, horizontal){
  rail.querySelectorAll('.tick,.tick-label').forEach(el => el.remove());
  const len = horizontal ? ws.clientWidth : ws.clientHeight;
  for (let i = 0; i <= len; i += 10) {
    const major = i % 100 === 0, medium = i % 50 === 0;
    const size = major ? '10px' : medium ? '7px' : '4px';
    const tick = document.createElement('div');
    tick.className = 'tick';
    if (horizontal) {
      tick.style.left = i + 'px'; tick.style.width = '1px';
      tick.style.bottom = '0';    tick.style.height = size;
    } else {
      tick.style.top = i + 'px';  tick.style.height = '1px';
      tick.style.right = '0';     tick.style.width = size;
    }
    rail.appendChild(tick);
    if (major && i > 0) {
      const label = document.createElement('div');
      label.className = 'tick-label';
      label.textContent = i;
      if (horizontal) {
        label.style.left = (i + 2) + 'px'; label.style.top = '1px';
      } else {
        label.style.top = (i - 11) + 'px'; label.style.left = '2px';
        label.style.transform = 'rotate(-90deg)';
        label.style.transformOrigin = 'left bottom';
      }
      rail.appendChild(label);
    }
  }
}
function drawRulers(){
  boardsWrap.querySelectorAll('.editor-layout').forEach(layout => {
    const ws = layout.querySelector('.board-ws');
    drawRuler(ws, layout.querySelector('.ruler-top'), true);
    drawRuler(ws, layout.querySelector('.ruler-left'), false);
  });
}
function updateRulerMarkers(clientX, clientY, ws){
  const layout = ws.closest('.editor-layout');
  const r = ws.getBoundingClientRect();
  const x = Math.max(0, Math.min(clientX - r.left, r.width));
  const y = Math.max(0, Math.min(clientY - r.top, r.height));
  const mx = layout.querySelector('.ruler-marker-x');
  const my = layout.querySelector('.ruler-marker-y');
  mx.style.left = x + 'px'; mx.setAttribute('data-val', Math.round(x) + 'px');
  my.style.top  = y + 'px'; my.setAttribute('data-val', Math.round(y) + 'px');
}

/* ---- cut (event delegation so undo keeps working) ---- */
boardsWrap.addEventListener('click', e => {
  if (mode !== 'cut') return;
  const target = e.target.closest('.window-node');
  if (!target) return;

  const rect = target.getBoundingClientRect();
  const isVertical = cutDir === 'vertical';
  const percent = isVertical
    ? (e.clientX - rect.left) / rect.width * 100
    : (e.clientY - rect.top) / rect.height * 100;

  const container = document.createElement('div');
  container.className = 'split-container';
  container.style.flexDirection = isVertical ? 'row' : 'column';

  const child1 = document.createElement('div');
  const child2 = document.createElement('div');
  child1.className = 'window-node';
  child2.className = 'window-node';
  child1.style.backgroundColor = target.style.backgroundColor;
  child2.style.backgroundColor = pastel();
  child1.style.flex = `0 0 calc(${percent}% - ${REZ / 2}px)`;
  child1.style.minWidth = '0';
  child1.style.minHeight = '0';
  child2.style.flex = '1 1 0%';
  child2.style.minWidth = '0';
  child2.style.minHeight = '0';
  setItems(child1, getItems(target)); // content stays with the first half

  const resizer = document.createElement('div');
  resizer.className = 'resizer ' + (isVertical ? 'resizer-vertical' : 'resizer-horizontal');

  container.appendChild(child1);
  container.appendChild(resizer);
  container.appendChild(child2);

  target.classList.remove('window-node');
  target.style.backgroundColor = 'transparent';
  target.style.border = 'none';
  target.removeAttribute('data-items');
  target.innerHTML = '';
  target.appendChild(container);

  fitLabels(container);   // the inherited text now lives in a smaller box
  saveState();
});

/* wheel switches the cut direction, exactly as in 1排版切割 */
boardsWrap.addEventListener('wheel', e => {
  if (mode !== 'cut') return;
  e.preventDefault();
  cutDir = e.deltaY > 0 ? 'horizontal' : 'vertical';
  applyBodyClass();
  moveChip(e.clientX, e.clientY, e.target);
}, { passive: false });

/* ---- resizer drag (any mode) ---- */
boardsWrap.addEventListener('mousedown', e => {
  const resizer = e.target;
  if (!resizer.classList || !resizer.classList.contains('resizer')) return;
  e.preventDefault();
  e.stopPropagation();

  const container = resizer.parentElement;
  const child1 = resizer.previousElementSibling;
  const ws = resizer.closest('.board-ws');
  const isVertical = resizer.classList.contains('resizer-vertical');
  document.body.classList.add(isVertical ? 'dragging-vertical' : 'dragging-horizontal');
  document.body.style.userSelect = 'none';

  const onMove = ev => {
    const r = container.getBoundingClientRect();
    let p = isVertical
      ? (ev.clientX - r.left) / r.width * 100
      : (ev.clientY - r.top) / r.height * 100;
    p = Math.max(5, Math.min(95, p));
    child1.style.flex = `0 0 calc(${p}% - ${REZ / 2}px)`;
    fitLabels(container);   // both sides just changed size; refit their text
    moveChip(ev.clientX, ev.clientY, child1);
    updateRulerMarkers(ev.clientX, ev.clientY, ws);
  };
  const onUp = () => {
    document.body.classList.remove('dragging-vertical','dragging-horizontal');
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    saveState();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

/* ---- assign popup (點選) ---- */
const assignPop = document.getElementById('assignPop');
const catInput = document.getElementById('catInput');
const catMenu = document.getElementById('catMenu');
const qtyInput = document.getElementById('qtyInput');
const itemList = document.getElementById('itemList');
const plusBtn = document.getElementById('addItemBtn');
let assignTarget = null, assignDirty = false;

/* The cross shows when there is actually something to add — i.e. a 品類 is
   typed. Tying it to "an item already exists" meant it sat there permanently
   doing nothing once you'd added one, which read as decoration. */
function syncPopUI(){
  plusBtn.classList.toggle('show', !!catInput.value.trim());
}

/* ---- 品類清單 ----
   看得到公司現有的品類、點一下填進去，不是自動完成：沒有反白、沒有上下鍵、
   Enter 也不會替你選 —— 打什麼就是什麼。清單只負責「讓你想起來有哪些」。
   跟你打的字一模一樣的那一筆不列（那一筆是廢話），沒有相符的就整條收起來。 */
/* 開學季資訊排第一：檔期一開始就在填它，排在最後每次都要滑到底。
   「無刊頭」拿掉了 —— 它不是一個品類，是「這一塊沒有刊頭」這個設定，
   混在品類清單裡只會被當成一種商品挑進去。真的要用還是打得出來
   （編輯器那邊照舊認 groups[0].name === '無刊頭'）。 */
const CATEGORIES = ['開學季資訊','刮鬍刀','小家電','空調','五機','季節家電','冰箱','洗衣機',
                    '電視','聲霸','通訊數位商品','揪居家','配件'];
/* 3 = 開頭就是、2 = 中間有、1 = 照順序出現（模糊）、-1 = 不像 */
function scoreCat(c, q){
  const i = c.indexOf(q);
  if (i === 0) return 3;
  if (i > 0) return 2;
  let k = 0;
  for (const ch of c) if (ch === q[k]) k++;
  return k === q.length ? 1 : -1;
}
function renderCatMenu(){
  const q = catInput.value.trim();
  syncPopUI();                       // 「＋」要不要出現跟著這個框走
  const shown = (q
    ? CATEGORIES.map(c => ({ c, s: scoreCat(c, q) })).filter(o => o.s > 0)
        .sort((a, b) => b.s - a.s).map(o => o.c)
    : CATEGORIES.slice()
  ).filter(c => c !== q);
  catMenu.innerHTML = '';
  shown.forEach(c => {
    const o = document.createElement('div');
    o.className = 'opt';
    o.textContent = c;
    o.addEventListener('mousedown', e => {   // mousedown：比 input 失焦早一步
      e.preventDefault();
      catInput.value = c;
      renderCatMenu();
      qtyInput.focus();
    });
    catMenu.appendChild(o);
  });
}

function renderItemList(){
  itemList.innerHTML = '';
  syncPopUI();
  if (!assignTarget) return;
  getItems(assignTarget).forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'it';
    const nm = document.createElement('span');
    nm.textContent = it.cat;
    row.appendChild(nm);
    if (it.qty) {
      const c = document.createElement('span');
      c.className = 'cnt';
      c.textContent = `(${it.qty})`;
      row.appendChild(c);
    }
    const x = document.createElement('b');
    x.textContent = '×';
    x.addEventListener('click', () => {
      const items = getItems(assignTarget);
      items.splice(idx, 1);
      setItems(assignTarget, items);
      assignDirty = true;
      renderItemList();
    });
    row.appendChild(x);
    itemList.appendChild(row);
  });
}
function openAssign(node, x, y){
  if (assignTarget && assignTarget !== node) closeAssign(true); // don't drop the last region's work
  assignTarget = node;
  assignDirty = false;
  catInput.value = '';
  qtyInput.value = '';
  renderItemList();
  renderCatMenu();
  assignPop.classList.remove('hidden');
  const w = 250, h = assignPop.offsetHeight || 160;
  assignPop.style.left = Math.min(x + 10, innerWidth - w - 12) + 'px';
  assignPop.style.top = Math.min(y + 10, innerHeight - h - 12) + 'px';
  catInput.focus();
}
/* commits whatever is typed into the two fields. Called on every exit route,
   so a品類 that was typed but never 加入-ed still lands on the segment. */
function addPending(){
  const cat = catInput.value.trim();
  if (!assignTarget || !cat) return false;
  const qty = parseInt(qtyInput.value, 10);
  const items = getItems(assignTarget);
  items.push({ cat, qty: Number.isFinite(qty) && qty > 0 ? qty : null });
  setItems(assignTarget, items);
  assignDirty = true;
  catInput.value = '';
  qtyInput.value = '';
  renderItemList();
  renderCatMenu();
  return true;
}
function closeAssign(commit){
  if (commit) addPending();
  if (assignTarget && assignDirty && commit) saveState();
  assignPop.classList.add('hidden');
  assignTarget = null;
}
plusBtn.addEventListener('click', () => {
  addPending();
  catInput.focus();
});
// 打字時重排清單（順便讓「＋」該不該出現跟著變）
catInput.addEventListener('input', renderCatMenu);
// Enter walks 品類 -> 數量 -> 加入, so the whole entry is keyboard-only
catInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); qtyInput.focus(); }
});
qtyInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addPending(); catInput.focus(); }
});
document.getElementById('clearItemsBtn').addEventListener('click', () => {
  if (!assignTarget) return;
  catInput.value = '';
  qtyInput.value = '';
  setItems(assignTarget, []);
  assignDirty = true;
  renderItemList();
  renderCatMenu();
});
document.getElementById('doneAssignBtn').addEventListener('click', () => closeAssign(true));

boardsWrap.addEventListener('click', e => {
  if (mode !== 'assign') return;
  const node = e.target.closest('.window-node');
  if (node) openAssign(node, e.clientX, e.clientY);
});
document.addEventListener('pointerdown', e => {
  if (!assignPop.classList.contains('hidden') &&
      !assignPop.contains(e.target) &&
      !(mode === 'assign' && e.target.closest('.window-node'))) {
    closeAssign(true);
  }
});

/* ---- swap (拖曳互換): trade the contents of two regions ---- */
let swapSrc = null;
boardsWrap.addEventListener('pointerdown', e => {
  if (mode !== 'swap') return;
  const node = e.target.closest('.window-node');
  if (!node) return;
  e.preventDefault();
  swapSrc = node;
  node.classList.add('swap-src');
});
document.addEventListener('pointermove', e => {
  if (!swapSrc) return;
  boardsWrap.querySelectorAll('.swap-target').forEach(n => n.classList.remove('swap-target'));
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const node = over && over.closest ? over.closest('.window-node') : null;
  if (node && node !== swapSrc) node.classList.add('swap-target');
});
document.addEventListener('pointerup', e => {
  if (!swapSrc) return;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const node = over && over.closest ? over.closest('.window-node') : null;
  if (node && node !== swapSrc) {
    const a = getItems(swapSrc), b = getItems(node);
    setItems(swapSrc, b);
    setItems(node, a);
    saveState();
  }
  clearTransient();
  swapSrc = null;
});

/* ---- cursor-following status chip ---- */
function chipText(node){
  let txt = mode === 'cut' ? (cutDir === 'vertical' ? '直切' : '橫切') : MODE_NAMES[mode];
  if (node) {
    const r = node.getBoundingClientRect();
    txt += ` <span class="sub">${Math.round(r.width)}×${Math.round(r.height)}px</span>`;
    const items = getItems(node);
    if (items.length) {
      const s = items.map(it => it.cat + (it.qty ? `(${it.qty})` : '')).join('、');
      txt += ` <span class="sub">${s}</span>`;
    }
  }
  return txt;
}
function moveChip(x, y, target){
  const node = target && target.closest ? target.closest('.window-node') : null;
  if (!node && !(target && target.classList && target.classList.contains('resizer'))) {
    cursorChip.style.display = 'none';
    return;
  }
  cursorChip.innerHTML = chipText(node);
  cursorChip.style.display = 'block';
  cursorChip.style.left = Math.min(x + 16, innerWidth - cursorChip.offsetWidth - 8) + 'px';
  cursorChip.style.top = (y + 18) + 'px';
}
boardsWrap.addEventListener('mousemove', e => {
  moveChip(e.clientX, e.clientY, e.target);
  const ws = e.target.closest('.board-ws');
  if (ws) updateRulerMarkers(e.clientX, e.clientY, ws);
});
boardsWrap.addEventListener('mouseleave', () => { cursorChip.style.display = 'none'; });

/* ================= delete / recycling bin ================= */
const confirmMask  = document.getElementById('confirmMask');
const confirmTitle = document.getElementById('confirmTitle');
const confirmMsg   = document.getElementById('confirmMsg');
const confirmOk    = document.getElementById('confirmOk');
const confirmCancel = document.getElementById('confirmCancel');
const trashMask    = document.getElementById('trashMask');
const trashList    = document.getElementById('trashList');

/* generic two-step confirm; the caller supplies what to do on 確定。
   opts 是後來加的：問「要不要下載」這種不會弄壞東西的問題時，紅色的確定鍵會讓
   人以為按下去要出事，所以顏色和取消鍵的字都可以換；而且「取消」在那種問法下
   不是「什麼都別做」而是「不要那個，但流程照走」—— onCancel 就是走給它看的。 */
let confirmCb = null, confirmCancelCb = null;
function askConfirm(title, msg, okLabel, cb, opts){
  const o = opts || {};
  confirmTitle.textContent = title;
  confirmMsg.textContent = msg;
  confirmOk.textContent = okLabel || '刪除';
  confirmOk.classList.toggle('danger', o.danger !== false);
  confirmCancel.textContent = o.cancelLabel || '取消';
  confirmCb = cb;
  confirmCancelCb = o.onCancel || null;
  confirmMask.classList.remove('hidden');
}
function closeConfirm(){
  confirmMask.classList.add('hidden');
  const cc = confirmCancelCb;
  confirmCb = null; confirmCancelCb = null;
  if (cc) cc();
}
confirmOk.addEventListener('click', () => {
  const cb = confirmCb;
  confirmCancelCb = null;          // 按了確定就不算取消，別把兩條路都跑一遍
  closeConfirm();
  if (cb) cb();
});
confirmCancel.addEventListener('click', closeConfirm);
confirmMask.addEventListener('click', e => { if (e.target === confirmMask) closeConfirm(); });

// the 回收桶 button lives in the dev panel now, so its count is redrawn with it
function updateTrashBtn(){ renderStatusBar(); }

/* Add the running demo 檔期 to a store that already has plans. Purely additive —
   the seed only fires on an empty store, so this is how you pull it in without
   throwing anything away. */
function addDemoPlan(){
  const demo = Object.assign({}, SEED_PLANS[SEED_PLANS.length - 1], { id: 'demo-' + Date.now() });
  demo.tags = demo.tags.slice();
  demo.durs = demo.durs.slice();
  plans.push(demo);
  savePlans(demo);
  renderHome();
  toast(`已加入示範檔期「${demo.name}」`);
}
function openTrash(){ renderTrash(); trashMask.classList.remove('hidden'); }

/* ---- 過往檔期: finished 檔期, kept off the home view ---- */
const pastMask = document.getElementById('pastMask');
const pastList = document.getElementById('pastList');
const pastBtn  = document.getElementById('pastBtn');
const finishedPlans = () => [...plans].reverse().filter(isFinished);
function updatePastBtn(){
  const n = finishedPlans().length;
  pastBtn.textContent = n ? `📁 過往檔期 (${n})` : '📁 過往檔期';
}
function renderPast(){
  pastList.innerHTML = '';
  const list = finishedPlans();
  if (!list.length){
    pastList.innerHTML = '<div class="empty-hint">還沒有結束的檔期</div>';
    return;
  }
  const now = new Date();
  list.forEach(plan => pastList.appendChild(buildCard(plan, now, true)));
}
function closePast(){ pastMask.classList.add('hidden'); }
pastBtn.addEventListener('click', () => { renderPast(); pastMask.classList.remove('hidden'); });
document.getElementById('pastClose').addEventListener('click', closePast);
pastMask.addEventListener('click', e => { if (e.target === pastMask) closePast(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !pastMask.classList.contains('hidden')) closePast();
});

/* delete a 檔期: confirm, then move it (not erase) into the 回收桶 */
function askDeletePlan(plan){
  askConfirm('刪除檔期', `確定要刪除「${plan.name}」嗎？\n刪除後會移到回收桶，可再還原。`, '刪除', () => {
    const i = plans.indexOf(plan);
    if (i < 0) return;
    plans.splice(i, 1);
    trash.push(Object.assign({}, plan, { deletedAt: Date.now() }));
    savePlans(); saveTrash();
    /* 回收桶只在這台機器上。共用資料庫那邊直接把這一列拿掉，
       別台機器之後開才不會又看到它。 */
    { const s = sync(); if (s) s.queueRemove(plan.id); }
    renderHome();
    if (!pastMask.classList.contains('hidden')) renderPast();   // deleted from the 過往檔期 list
    toast(`已將「${plan.name}」移到回收桶`);
  });
}

function renderTrash(){
  trashList.innerHTML = '';
  if (trash.length === 0) {
    trashList.innerHTML = '<div class="trash-empty">回收桶是空的</div>';
    return;
  }
  [...trash].reverse().forEach(plan => {
    const row = document.createElement('div');
    row.className = 'trash-item';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = plan.name;
    const tp = document.createElement('span');
    tp.className = 'pill';
    tp.textContent = plan.type;
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = plan.deletedAt ? '刪除於 ' + fmtMD(new Date(plan.deletedAt)) : '';
    const restore = document.createElement('button');
    restore.className = 'mini';
    restore.textContent = '↩ 還原';
    restore.addEventListener('click', () => restorePlan(plan));
    const purge = document.createElement('button');
    purge.className = 'mini del';
    purge.textContent = '永久刪除';
    purge.addEventListener('click', () => askPurge(plan));
    row.appendChild(nm); row.appendChild(tp); row.appendChild(when);
    row.appendChild(restore); row.appendChild(purge);
    trashList.appendChild(row);
  });
}
function restorePlan(plan){
  const i = trash.indexOf(plan);
  if (i < 0) return;
  trash.splice(i, 1);
  const clean = Object.assign({}, plan);
  delete clean.deletedAt;
  plans.push(clean);
  savePlans(clean); saveTrash();
  renderTrash(); updateTrashBtn(); renderHome();
  toast(`已還原「${plan.name}」`);
}
function askPurge(plan){
  askConfirm('永久刪除', `「${plan.name}」將被永久刪除，無法復原。確定嗎？`, '永久刪除', () => {
    const i = trash.indexOf(plan);
    if (i < 0) return;
    trash.splice(i, 1);
    saveTrash();
    renderTrash(); updateTrashBtn();
    toast('已永久刪除');
  });
}
document.getElementById('trashClose').addEventListener('click', () => trashMask.classList.add('hidden'));
trashMask.addEventListener('click', e => { if (e.target === trashMask) trashMask.classList.add('hidden'); });

/* ================= navigation & submit ================= */
/* 切到設計／PM 那一支。網址帶 ?plan= 的話（從編輯器那顆「← 行銷」跳回來的），
   再跳回去時把同一個檔期帶著走，兩邊就會停在同一個檔期上。 */
(function(){
  const btn = document.getElementById('toEditor');
  const to = (window.SUPABASE || {}).editorUrl;
  if (!to || !/^https?:$/.test(location.protocol)) return;
  btn.style.display = '';
  btn.addEventListener('click', async () => {
    const want = new URLSearchParams(location.search).get('plan');
    const s = sync();
    if (s) { try { await s.flush(); } catch (e){} }   // 先確保存上去，那邊才拉得到
    location.href = to + (want ? '?plan=' + encodeURIComponent(want) : '');
  });
})();

document.getElementById('newPlanBtn').addEventListener('click', () => {
  resetPlanForm();
  show('plan');
  buildGrid(); render(); // re-measure after becoming visible
});
document.getElementById('backHomeBtn').addEventListener('click', () => { renderHome(); show('home'); });
document.getElementById('backPlanBtn').addEventListener('click', () => { show('plan'); buildGrid(); render(); });

document.getElementById('nextBtn').addEventListener('click', () => {
  const name = nameInput.value.trim() || `未命名檔期 ${fmtMD(new Date())}`;
  draft = {
    id: 'p' + Date.now(),
    name,
    type: selectedType(),
    tags: tags.slice(),
    start: toYMD(START),
    durs: dursFromFlags(),
    layout: null
  };
  layoutTitle.textContent = `${name}　${fmtMDW(firstValid())}-${fmtMDW(flagDates[N-1])}`;
  show('layout');
  cutDir = 'vertical';
  setMode('assign'); // open in the safe 點選 mode; cut is a deliberate pick
  applyBodyClass();
  initBoards();
  layoutBoards();   // needs the view visible to measure
  syncSubmitBtn();  // 一進來就是整版空的，提交要先關起來
});

/* ---- self-contained 落版單 export (no backend: a Blob download) ---- */
const safeName = s => (String(s || '落版單').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim() || '落版單');
function downloadFile(filename, text, mime){
  const blob = new Blob([text], { type:(mime || 'application/json') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
/* 匯出＝一份純資料的 .json。以前出的是一張看得到版面的 HTML，資料偷偷夾在
   <script id="plandata"> 裡面 —— 設計／PM 從頭到尾只讀那一段，外面那層沒人
   用程式碰過。純 .json 少了那層裝飾，但傳給對方的內容一個欄位都沒變，
   所以兩邊不必改讀法（design_and_PM 的匯入同時吃舊的 .html 和這個 .json）。
   縮排排版過 —— 這個檔會被人打開來看、被貼進信裡。 */
function exportPlanJson(plan){
  downloadFile(`落版單_${safeName(plan.name)}.json`, JSON.stringify(plan, null, 2), 'application/json');
}

/* ---- 每一塊都要填齊了才能提交 -----------------------------------------------
   切出來卻沒填品類的區塊，對設計來說就是一塊不知道要放什麼的空白 —— 與其讓它
   一路流到編輯器再回頭問，不如在這裡就擋住。空的那幾塊會自己框起來，不用一格
   一格找。用 MutationObserver 盯著整張版：切、換、刪、Undo、填品類都會動到
   DOM，一個一個去呼叫遲早會漏掉一條路。

   「填齊」＝ 有品類，而且每一項都有數量。只寫品類、沒寫數量（qty 存成 null）
   一樣擋下來：版位切好了、要放什麼也寫了，卻沒說要放幾樣 —— 設計還是排不了版，
   跟整塊空著的差別只在於它看起來像填過了，那更糟。
   兩種缺法分開數，不然被擋下來的人只知道「有問題」，不知道要去補哪一種。 */
const submitBtn = document.getElementById('submitBtn');
const emptyHint = document.getElementById('emptyHint');
function unfilledSegments(){
  const nodes = [...boardsWrap.querySelectorAll('.window-node')];
  const noCat = nodes.filter(n => !getItems(n).length);
  const noQty = nodes.filter(n => {
    const items = getItems(n);
    return items.length && items.some(it => !(it.qty > 0));
  });
  return { noCat, noQty, all: noCat.concat(noQty) };
}
function syncSubmitBtn(){
  if (!boardsWrap.querySelector('.window-node')) return;   // 還沒進到這一頁
  const { noCat, noQty, all } = unfilledSegments();
  boardsWrap.querySelectorAll('.window-node').forEach(n => n.classList.remove('empty-seg'));
  all.forEach(n => n.classList.add('empty-seg'));
  submitBtn.disabled = all.length > 0;
  const parts = [];
  if (noCat.length) parts.push(`${noCat.length} 個沒填品類`);
  if (noQty.length) parts.push(`${noQty.length} 個沒填數量`);
  const msg = parts.length ? '還有 ' + parts.join('、') : '';
  submitBtn.title = msg;
  emptyHint.textContent = msg;
  emptyHint.classList.toggle('hidden', !msg);
}
new MutationObserver(syncSubmitBtn).observe(boardsWrap, {
  subtree: true, childList: true, attributes: true, attributeFilter: ['data-items'],
});

submitBtn.addEventListener('click', () => {
  if (submitBtn.disabled) return;
  closeAssign(true);
  clearTransient();
  draft.layout = { front: wsFront.innerHTML, back: wsBack.innerHTML };
  plans.push(draft);
  const submitted = draft;
  savePlans(submitted);
  draft = null;
  document.body.className = '';
  renderHome();
  show('home');

  /* 提交本身已經做完了，檔案只是備份 —— 所以這裡是「要不要」，不是「請稍候」。
     以前不問就往下載資料夾丟一個檔，接了共用資料庫之後那個檔多半沒人打開。
     問完才走 afterSubmit：跳編輯器那一下會直接離開這一頁，先跳就沒得問了。 */
  askConfirm(
    '要下載一份備份嗎？',
    `會存成「落版單_${safeName(submitted.name)}.json」，`
    + '內容跟送給設計／PM 的完全一樣。接得上共用資料庫的話他們那邊已經看得到了，'
    + '這個檔只有在後端連不上、要用檔案傳給對方的時候才需要。',
    '下載 .json',
    () => { exportPlanJson(submitted); afterSubmit(submitted, true); },
    { danger:false, cancelLabel:'不用', onCancel: () => afterSubmit(submitted, false) }
  );
});

/* 有接共用資料庫就直接把人送進編輯器。先 await flush() 把這個檔期真的寫上去，
   不然跳過去的編輯器會拉不到它。
   刻意不帶 ?plan= —— 帶了那邊會直接開進那一個檔期的總體，等於替設計決定了下一步。
   提交完該看到的是整排檔期（這一筆就排在裡面），要開哪一個是他自己的事。
   file:// 打開的時候不跳（本機沒有 /editor 這個網址）。 */
async function afterSubmit(submitted, downloaded){
  const s = sync();
  const to = (window.SUPABASE || {}).editorUrl;
  if (s && to && /^https?:$/.test(location.protocol)){
    toast('已提交給設計，正在開啟編輯器…');
    try { await s.flush(); } catch (e) { console.warn('提交同步失敗', e); }
    location.href = to;
    return;
  }
  toast(downloaded ? '已提交給設計，並已下載 .json' : '已提交給設計');
}

/* ================= boot ================= */
startInput.value = toYMD(START);
flagsFromDurs(DEFAULT_DURS);
fitTotalToFlags(); buildGrid(); render();
renderHome();
show('home');

/* ---- 共用資料庫：上面已經用 localStorage 把首頁畫出來了，這裡再拉一次遠端 ----
   不 await：後端慢或掛掉都不影響這一頁開得起來（關網路照樣能用，這是保底）。 */
(async function bootSync(){
  const s = sync();
  if (!s) return;
  try {
    const rows = await s.pullAll();
    if (!rows || !rows.length) return;
    /* 同一個 id 以遠端為準；本機獨有的（還沒上傳過的）留著。
       MVP 是 last-write-wins，兩個人同時改同一個檔期，後存的贏。 */
    const byId = new Map(plans.map(p => [p.id, p]));
    rows.forEach(r => { if (r && r.id && r.data) byId.set(r.id, r.data); });
    plans = [...byId.values()];
    savePlans();            // 只寫本機快取，不要反過來整包再送上去
    if (!views.layout.classList.contains('hidden')) return;   // 正在切版就別重畫首頁
    renderHome();
  } catch (e){
    console.warn('開機同步失敗，先用本機資料', e);
  }
})();
})();
</script>
