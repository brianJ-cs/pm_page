<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行銷落版單系統</title>
<style>
  :root{
    --blue:#4a6fdc;
    --blue-dark:#3a5bc0;
    --ink:#333a45;
    --muted:#7a8494;
    --bg:#f2f4f8;
    --card:#ffffff;
    --line:#e2e6ee;
    --green-bg:#e6f6ea; --green:#2e8b57;
    --amber-bg:#fff4d6; --amber:#c07f00;
    --red:#c0392b;
    --ruler-bg:#eef1f6; --ruler-tick:#9aa3b2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;
  }
  button{font-family:inherit}
  .view{height:100vh;display:flex;flex-direction:column;padding:22px 34px;gap:16px}
  .hidden{display:none !important}

  .btn{
    background:var(--blue);color:#fff;border:none;border-radius:6px;
    padding:11px 30px;font-size:17px;font-weight:800;cursor:pointer;
    box-shadow:0 2px 6px rgba(74,111,220,.35);
  }
  .btn:hover{background:var(--blue-dark)}
  .btn.ghost{
    background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;
  }
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue);background:#fff}

  /* ============ VIEW 1 : HOME ============ */
  #viewHome .topbar{display:flex;justify-content:flex-end;gap:10px}
  .btn.ghost.demo{margin-right:auto;color:#8b93a5;border-color:#dfe3ea;font-size:14px}
  #planList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
  .section-title{
    font-size:16px;font-weight:800;color:var(--muted);letter-spacing:.04em;
    margin:6px 2px -2px;display:flex;align-items:center;gap:8px;
  }
  .section-title .count-tag{
    font-size:13px;font-weight:800;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:20px;padding:1px 9px;
  }
  .plan-card.past{opacity:.9}
  .plan-card.past .plan-name{color:#5d6675}
  .pill.manual{color:#6b4bbd;border-color:#d8cdf3;background:#f1ecfb}
  .pill.manual.drift{border-style:dashed;border-color:#c0a8ec}

  /* ---- status bar: a coloured control strip, deliberately NOT white so it
         doesn't read as another plan card / duplicate timeline ---- */
  .status-bar{
    flex:none;background:linear-gradient(180deg,#eaf0fd,#e2ebfb);
    border:1px solid #c4d3f2;border-radius:12px;padding:12px 16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .sb-title{font-size:15px;font-weight:800;color:var(--blue-dark);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sb-title .sb-sub{font-size:13.5px;font-weight:700;color:#6b7ba6}
  .sb-names{display:flex;gap:8px;flex-wrap:wrap}
  .sb-name{
    display:flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;
    background:#fff;border:1px solid #cdd9f2;border-radius:9px;padding:7px 12px;
    box-shadow:0 1px 3px rgba(40,60,110,.08);
  }
  .sb-name:hover{border-color:var(--blue)}
  .sb-name.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(74,111,220,.25)}
  .sb-name .nm{font-size:16px;font-weight:800;color:var(--ink)}
  .sb-name .st{font-size:15px;font-weight:800;color:var(--amber)}
  .sb-name .sb-cd{font-size:14px;font-weight:700;color:var(--muted)}
  .sb-editor{display:flex;flex-direction:column;gap:8px;border-top:1px dashed #bcccef;padding-top:10px}
  .sb-editrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sb-edit-lead{font-size:15px;font-weight:800;color:var(--ink)}
  .sb-editrow .spacer{flex:1}
  .sb-linkbtn{
    background:none;border:none;color:var(--blue);font-size:15px;font-weight:800;
    cursor:pointer;padding:6px 8px;border-radius:6px;
  }
  .sb-linkbtn:hover{background:#dfe7fb}
  .sb-linkbtn.danger{color:var(--red)}
  .sb-linkbtn.danger:hover{background:#fbe3df}
  /* dev-panel actions, pushed to the right of the title */
  .sb-acts{margin-left:auto;display:flex;gap:8px}
  .sb-devbtn{
    background:#fff;border:1px solid #c4d3f2;border-radius:7px;color:#5a6b93;
    font-size:14px;font-weight:800;font-family:inherit;padding:5px 12px;cursor:pointer;
  }
  .sb-devbtn:hover{border-color:var(--blue);color:var(--blue)}
  .sb-track{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
  /* chips in the editor are always live (the editor only exists in edit mode),
     the dashed outline signals they're clickable */
  .sb-track .stage-chip{flex:none;cursor:pointer;background:#fff;outline:2px dashed var(--blue);outline-offset:2px}
  .sb-track .stage-chip.done{background:var(--green-bg)}
  .sb-track .stage-chip.now{background:var(--amber-bg)}
  .sb-track .stage-chip:hover{border-color:var(--blue)}
  .sb-hint{font-size:13.5px;color:#6b7ba6}
  .plan-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;box-shadow:0 2px 8px rgba(30,40,60,.06);
    position:relative;                 /* 小地圖的把手掛在下緣，要有這個才定得住 */
  }
  /* 把手凸出卡片外，所以卡片之間要多留一點，否則會壓到下一張 */
  #planList .plan-card{margin-bottom:6px}
  .plan-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .plan-name{font-size:20px;font-weight:800}
  .pill{
    font-size:14px;font-weight:800;border:1px solid var(--line);border-radius:6px;
    padding:3px 10px;color:var(--muted);background:#fafbfd;
  }
  .pill.tag{color:var(--blue);border-color:#ccd8f5;background:#eef2fc}
  .pill.count{color:var(--amber);border-color:#f0dcae;background:var(--amber-bg)}
  .plan-out{margin-left:auto;font-size:16px;font-weight:800;color:var(--muted)}
  .plan-out b{color:var(--ink)}
  .stage-row{display:flex;gap:8px;flex-wrap:wrap}
  .stage-chip{
    min-width:86px;text-align:center;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px 7px;background:#fafbfd;
  }
  .stage-chip .n{font-size:15px;font-weight:800;color:#5d6675}
  .stage-chip .d{font-size:13.5px;color:var(--muted);margin-top:2px}
  .stage-chip.done{background:var(--green-bg);border-color:#cdeeda}
  .stage-chip.done .n,.stage-chip.done .d{color:var(--green)}
  .stage-chip.now{background:var(--amber-bg);border-color:#f0dcae;position:relative}
  .stage-chip.now .n,.stage-chip.now .d{color:var(--amber)}
  .stage-chip.now::after{
    content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;
    border-radius:50%;background:#f5a623;
  }
  /* ---- PM 進度小地圖：一位 PM 一列，一個小方塊一個版位 ----------------
     顏色照編輯器那一套（小地圖和總體共用的）：灰＝還沒輪到、白＝手上、綠＝完成。
     方塊只是狀態，不是可以點的東西 —— 這一頁是看板，動手要回編輯器。 */
  .pm-row{
    display:flex;flex-direction:column;align-items:flex-start;gap:9px;
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  }
  .pm-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pm-who{font-size:13.5px;font-weight:700;color:#5d6675}
  .pm-who.all{color:var(--green);font-weight:800}

  /* ---- 收起來的樣子：一條方塊，一格一個版位。平常只要看得出「還有幾塊沒做」，
         真的要知道是版上哪一塊，才點開小地圖。 */
  .pm-map{display:flex;gap:3px;flex-wrap:wrap;max-width:300px}
  .pm-blk{width:11px;height:11px;border-radius:3px;background:#eef0f4;border:1px solid #dfe3ea}
  .pm-blk.part{background:linear-gradient(to top,var(--green) var(--fill,50%),#fff var(--fill,50%));
               border-color:#9fc4ae}
  .pm-blk.done{background:var(--green);border-color:var(--green)}
  /* 展開小地圖的把手：從卡片下緣凸出來一塊，像書籤 —— 跟編輯器那根收合把手
     同一個講法（.fold-tab）。不做成按鈕是因為它不是一個「動作」，
     是這張卡片本身還有一截沒拉開。 */
  .mm-tab{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;z-index:3;
    appearance:none;font-family:inherit;font-size:12px;font-weight:800;line-height:1;
    padding:0 16px;height:22px;cursor:pointer;
    border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
    background:var(--card);color:#5d6675;
    display:flex;align-items:center;gap:5px;
    box-shadow:0 3px 6px rgba(30,40,60,.10);
  }
  .mm-tab:hover{background:#eef2fc;border-color:var(--blue);color:var(--blue)}
  .mm-tab .arw{font-size:10px;display:inline-block;transition:transform .15s}
  .mm-tab.on .arw{transform:rotate(180deg)}

  /* ---- 小地圖：跟編輯器裡那一張是同一張（同一棵 layout 樹、同一套比例），
         只是不能點。形狀就是版面本人，所以「哪一塊還沒做」看得出是版上哪裡。 */
  /* 兩張版平均分掉整行，中間留一大段 —— 正面和背面是兩張不同的紙，
     貼在一起會看成一張被切開的版。標籤也各自站在自己那張的上面。 */
  .mm-wrap{display:flex;gap:36px;width:100%;align-items:flex-start}
  .mm-wrap.shut{display:none}
  .mm-side{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .mm-tag{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:3px}
  .mm-page{border:2px solid var(--ink);background:#fff;display:flex;overflow:hidden}
  .mm-split{display:flex;width:100%;height:100%;overflow:hidden}
  .mm-fold{width:3px;background:#3d444f;flex:none}
  /* 底色＝這一塊挑到哪了。灰＝還沒開始、半綠＝挑了一部分、全綠＝每一格都有貨 */
  /* 版位之間用黑線分開。淡灰在白底上等於沒有，兩塊沒做的版位會黏成一大片；
     黑線跟外框（也是 var(--ink)）同一個顏色，整張版看起來就是切出來的。 */
  .mm-blk{
    border:1.5px solid var(--ink);background:#f4f6f9;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.15;color:#5d6675;font-weight:800;text-align:center;
  }
  /* 字級是 miniNode 照這一塊真正多大算好寫在 style 上的，這兩行跟著它縮。
     版位名是主角（要認得出是版上哪一塊），PM 和進度是副標。 */
  .mm-blk b{font-size:1em;font-weight:800}
  .mm-blk span{font-size:.82em;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}
  /* 三種狀態只換底色和字色，**邊線一律不碰** —— 本來 .done 把 border-color
     蓋成綠的、.part 蓋成淺綠，於是整張版做完之後那些黑線就消失了，
     十塊綠色黏成一大片。分隔線講的是「版面切在哪裡」，跟做到哪無關。 */
  .mm-blk.part{background:linear-gradient(to top,#cfe9d8 var(--fill,50%),#fff var(--fill,50%));
               color:#33724d}
  .mm-blk.done{background:var(--green);color:#fff}
  /* 沒指派 PM 的版位：整塊更灰，跟編輯器的小地圖同一個講法 */
  .mm-blk.unowned{background:#e9ecf2;color:#a5adbb}
  .pm-cnt{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .pm-cnt.all{color:var(--green)}
  .pm-sum{
    font-size:13px;font-weight:800;color:#5d6675;background:#f3f5f9;
    border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-right:4px;
    font-variant-numeric:tabular-nums;
  }
  .pm-sum.all{color:var(--green);background:var(--green-bg);border-color:#cdeeda}
  /* 還沒進編輯器排過版的檔期，layout 是空的 —— 那就一個字都不要說 */
  .pm-row.empty{display:none}

  .empty-hint{color:var(--muted);text-align:center;margin-top:60px;font-size:18px}

  /* ============ VIEW 2 : PLANNING ============ */
  .head-row{display:flex;align-items:center;gap:14px}
  .head-row h2{font-size:23px;font-weight:800}
  .head-row .spacer{flex:1}
  .form-grid{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;display:flex;flex-direction:column;gap:12px;
  }
  .form-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .form-line label{font-size:16px;font-weight:800;min-width:68px}
  .form-line input[type=text],.form-line input[type=date]{
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:16px;
    font-family:inherit;outline:none;
  }
  .form-line input:focus{border-color:var(--blue)}
  #nameInput{width:340px}
  #totalInput{width:72px;text-align:center}
  .unit-tail{font-size:15px;color:var(--muted);margin-left:-4px}
  .type-btn{
    border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:9px 18px;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;
  }
  .type-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tagbox{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:340px;min-height:36px;
    background:#fff;cursor:text;
  }
  .tagbox:focus-within{border-color:var(--blue)}
  .tagbox .tag-chip{
    background:#eef2fc;color:var(--blue);border-radius:5px;font-size:15px;font-weight:800;
    padding:4px 7px 4px 9px;display:flex;align-items:center;gap:4px;
  }
  .tag-chip b{cursor:pointer;font-weight:900;opacity:.55}
  .tag-chip b:hover{opacity:1}
  #tagInput{border:none;outline:none;font-size:16px;flex:1;min-width:120px;font-family:inherit}
  /* one-click built-in tags under the tag box */
  .preset-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .preset-tags .pt{
    border:1px dashed #ccd8f5;border-radius:6px;background:#fff;color:var(--blue);
    font-size:14px;font-weight:800;font-family:inherit;padding:4px 10px;cursor:pointer;
  }
  .preset-tags .pt:hover{background:#eef2fc}
  .preset-tags .pt.on{background:var(--blue);border-style:solid;border-color:var(--blue);color:#fff}

  .dur-row{display:flex;gap:8px;overflow-x:auto;padding:2px}
  .dur-cell{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;text-align:center;min-width:82px;flex:none;
  }
  .dur-cell .dn{font-size:15px;font-weight:800;white-space:nowrap}
  .dur-cell input{
    width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;
    padding:5px 2px;font-size:17px;font-weight:800;margin-top:5px;font-family:inherit;outline:none;
  }
  .dur-cell input:focus{border-color:var(--blue)}
  .dur-cell .dd{font-size:13.5px;color:var(--muted);margin-top:4px}
  .dur-cell .unit{font-size:13px;color:var(--muted)}

  /* ---- timeline (adapted from time_line_v3) ---- */
  .tl-scroll{
    flex:1;min-height:0;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:6px 14px;
  }
  .tl-panel{padding:6px 6px 2px;user-select:none;-webkit-user-select:none}
  .stack-layer{position:relative;height:130px;margin:0 7px}
  .bar-wrap{position:relative;padding:0 7px}
  .bar{position:relative;height:40px;border:1px solid #d5dae4;border-radius:4px;overflow:hidden;
       background:#fff}
  /* 一天一塊：這個階段做幾天，就有幾塊。本來是一條漸層，看得出顏色換在哪裡，
     但數不出「這一段是幾天」—— 現在一格就是一天，用數的。
     上下要頂滿整條 bar：留白會讓它看起來像浮在軌道上的貼紙，而不是軌道本身。
     一格一格的分界交給本來就在的 grid-line，不必再自己畫白邊。 */
  .day-blk{position:absolute;top:0;bottom:0;z-index:0}
  .grid-line{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;z-index:2}
  .grid-line.major{background:rgba(20,30,50,.35)}
  .grid-line.minor{background:rgba(20,30,50,.12)}
  /* weekends/holidays are painted solid white — they punch a blank gap in the
     coloured bar, labelled 周 / 末 (one character per day-block). */
  .we-shade{
    position:absolute;top:0;bottom:0;pointer-events:none;background:#fff;z-index:1;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;color:#1e2530;
  }
  .number-labels{position:relative;height:14px;margin:3px 7px 0}
  .number-label{
    position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;
    color:var(--muted);white-space:nowrap;
  }
  .number-label.we{color:#c05555}
  .track{position:relative;height:56px;margin:2px 7px 0;touch-action:none}
  .flag{
    position:absolute;top:0;width:30px;height:40px;transform:translateX(-50%);
    cursor:grab;outline:none;z-index:2;display:flex;justify-content:center;
  }
  .flag:active{cursor:grabbing}
  .flag .stem{position:absolute;top:0;width:2px;height:8px;background:currentColor;opacity:.6;border-radius:1px}
  .flag .handle{
    position:absolute;top:8px;width:19px;height:19px;border-radius:5px 5px 5px 0;
    transform:rotate(45deg);background:currentColor;
    box-shadow:0 2px 5px rgba(30,40,60,.35);transition:transform .08s;
  }
  .flag:hover .handle{transform:rotate(45deg) scale(1.1)}
  .flag.selected .handle{box-shadow:0 0 0 2px #fff,0 0 0 3px currentColor,0 3px 7px rgba(30,40,60,.4)}
  .flag:focus-visible .handle{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
  /* stacked flags sit on the exact same day; only the anchor draws the date */
  .flag.stack-member .handle,.flag.stack-member .stem{opacity:.45}
  .flag.stack-member .taglabel{display:none}
  .taglabel{
    position:absolute;top:32px;left:50%;transform:translateX(-50%);
    font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;pointer-events:none;
  }
  .stacklabel{
    position:absolute;bottom:0;transform:translateX(-50%);
    display:flex;flex-direction:row;align-items:flex-end;gap:12px;pointer-events:none;
  }
  .stacklabel.lift-1{bottom:34px}
  .stacklabel .col{display:flex;flex-direction:column;gap:6px}
  .stacklabel .row{
    display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;
    line-height:1.1;color:var(--ink);white-space:nowrap;
  }
  .stacklabel .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .stacklabel .label-2line{display:flex;flex-direction:column;line-height:1.05;text-align:left}
  /* the day-count entry now lives on the timeline itself (integrated), one per
     stage marker. pointer-events re-enabled since the label wrap disables them */
  .stacklabel .dur-in{
    width:38px;text-align:center;border:1px solid var(--line);border-radius:5px;
    padding:2px 2px;font-size:13px;font-weight:800;font-family:inherit;outline:none;
    pointer-events:auto;background:#fff;color:var(--ink);
  }
  .stacklabel .dur-in:hover{border-color:var(--blue)}
  .stacklabel .dur-in:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(74,111,220,.2)}
  .stacklabel .dur-unit{font-size:11px;font-weight:700;color:var(--muted)}
  .stacklabel .date-tip{font-size:10px;font-weight:700;color:var(--muted)}
  .plan-actions{display:flex;justify-content:flex-end;gap:12px}

  /* ============ VIEW 3 : LAYOUT EDITOR ============ */
  #layoutTitle{
    background:#ffef7a;padding:4px 12px;border-radius:4px;font-size:21px;font-weight:800;
  }
  .editor-body{flex:1;min-height:0;display:flex;gap:16px}
  .toolcol{
    display:flex;flex-direction:column;gap:8px;padding-top:26px;flex:none;width:62px;
  }
  .tool{
    position:relative;width:54px;height:54px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .tool:hover{border-color:var(--blue)}
  .tool.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tool:disabled{opacity:.35;cursor:not-allowed}
  .tool .tip{
    display:none;position:absolute;left:62px;top:50%;transform:translateY(-50%);
    background:#26303f;color:#fff;font-size:14.5px;font-weight:700;line-height:1.5;
    padding:8px 12px;border-radius:7px;white-space:nowrap;z-index:400;pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .tool .tip b{color:#ffd66e}
  .tool:hover .tip{display:block}
  .tool .tip::before{
    content:"";position:absolute;left:-5px;top:50%;transform:translateY(-50%);
    border:5px solid transparent;border-left:none;border-right:5px solid #26303f;
  }
  .tool-sep{height:1px;background:var(--line);margin:4px 6px}

  #boardsWrap{flex:1;min-width:0;display:flex;gap:22px;justify-content:center;align-items:center;overflow:hidden}
  .board-slot{display:flex;flex-direction:column;flex:none}
  .board-slot h3{font-size:16px;font-weight:800;color:var(--muted);margin-bottom:6px}

  /* rulers frame the board on two sides; the auto tracks take their size from
     the board, so tick 0 always lands on the board's own left/top edge */
  .editor-layout{display:grid;grid-template-columns:26px auto;grid-template-rows:26px auto}
  .ruler-corner{background:var(--ruler-bg);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ruler-top,.ruler-left{position:relative;background:var(--ruler-bg);overflow:hidden}
  .ruler-top{border-bottom:1px solid var(--line)}
  .ruler-left{border-right:1px solid var(--line)}
  .tick{position:absolute;background:var(--ruler-tick)}
  .tick-label{position:absolute;color:#8b93a2;font-size:9px;user-select:none}
  .ruler-marker{position:absolute;background:var(--blue);z-index:100;pointer-events:none}
  .ruler-marker-x{top:0;bottom:0;width:1px;left:-40px}
  .ruler-marker-y{left:0;right:0;height:1px;top:-40px}
  .ruler-marker::after{
    content:attr(data-val);position:absolute;background:var(--blue);color:#fff;
    font-size:10px;font-weight:bold;padding:1px 3px;border-radius:3px;white-space:nowrap;
  }
  .ruler-marker-x::after{top:1px;left:3px}
  .ruler-marker-y::after{left:1px;top:3px}

  /* sized in JS to a fixed landscape ratio; box-shadow edge keeps the box
     geometry identical to the ruler tracks */
  .board-ws{position:relative;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #98a0ae}
  .split-container{display:flex;width:100%;height:100%;overflow:hidden}
  /* the 對開 fold: always dead centre, never draggable */
  .fold{width:2px;background:#5b6472;flex:none;pointer-events:none;z-index:11}
  .window-node{
    box-sizing:border-box;border:1px solid rgba(90,60,40,.45);position:relative;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .window-node:hover::after{
    content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);pointer-events:none;
  }
  /* font-size and max-width are set by fitLabel(); the rows inherit the size,
     and wrap anywhere so CJK reflows into whatever shape the segment is */
  .region-label{pointer-events:none;text-align:center;padding:2px;z-index:1}
  .region-label div{font-weight:800;color:#5a4a3c;line-height:1.35;overflow-wrap:anywhere}
  .region-label .cnt{color:var(--red)}
  /* 還沒填東西的區塊：虛線框起來。提交前一定要填，不圈起來的話一張版切了
     十幾塊，漏掉的那一塊得自己一格一格找。 */
  .window-node.empty-seg{outline:2px dashed var(--red);outline-offset:-2px}
  .btn:disabled{background:#c3cbd8;box-shadow:none;cursor:not-allowed}
  .hint.warn{color:var(--red);font-weight:800}
  .window-node.swap-src{outline:3px solid var(--blue);outline-offset:-3px}
  .window-node.swap-target{outline:3px dashed #e0662f;outline-offset:-3px}
  /* a cut line reads as part of the layout, not as UI furniture: 1px of real
     estate matching the region borders, with an invisible ±3px hit box so it
     is still easy to grab and 調整 */
  .resizer{background:rgba(90,60,40,.55);z-index:10;flex:none;position:relative}
  .resizer::before{content:"";position:absolute;z-index:1}
  .resizer-vertical{width:1px;cursor:var(--cursor-vadj)}
  .resizer-vertical::before{top:0;bottom:0;left:-3px;right:-3px}
  .resizer-horizontal{height:1px;cursor:var(--cursor-hadj)}
  .resizer-horizontal::before{left:0;right:0;top:-3px;bottom:-3px}
  .resizer:hover,.resizer:active{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
  body.dragging-vertical,body.dragging-vertical *{cursor:var(--cursor-vadj) !important}
  body.dragging-horizontal,body.dragging-horizontal *{cursor:var(--cursor-hadj) !important}
  /* one cut tool; the wheel picks the direction, the cursor announces it */
  body.mode-cut.dir-vertical .window-node{cursor:var(--cursor-v)}
  body.mode-cut.dir-horizontal .window-node{cursor:var(--cursor-h)}
  body.mode-assign .window-node{cursor:pointer}
  body.mode-swap .window-node{cursor:grab}
  .hint{font-size:14.5px;color:var(--muted);background:#e9edf4;padding:8px 14px;border-radius:6px}

  /* cursor-following status chip */
  #cursorChip{
    position:fixed;z-index:500;pointer-events:none;display:none;
    background:#26303f;color:#fff;font-size:14px;font-weight:700;
    padding:5px 10px;border-radius:6px;white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
  }
  #cursorChip .sub{color:#9fb4d8;font-weight:600}

  /* ============ modals / popups ============ */
  .modal-mask{
    position:fixed;inset:0;background:rgba(20,26,36,.45);z-index:600;
    display:flex;align-items:center;justify-content:center;
  }
  /* the delete confirm can open on top of the 回收桶 modal, so it sits above it */
  #confirmMask{z-index:680}
  .modal{
    background:#fff;border-radius:12px;padding:20px 22px;min-width:420px;max-width:560px;
    box-shadow:0 14px 44px rgba(0,0,0,.3);
  }
  .modal h3{font-size:19px;font-weight:800;margin-bottom:14px}
  .import-item{
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;
    cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .import-item:hover{border-color:var(--blue);background:#f5f8ff}
  .import-item .nm{font-weight:800;font-size:16px}

  /* ---- 帶入: two-pane search popup ---- */
  .import-modal{
    width:92vw;max-width:1440px;height:88vh;
    display:flex;flex-direction:column;min-width:0;
  }
  /* past 檔期 browser — same cards as the home view, just in a modal */
  .past-modal{width:88vw;max-width:1200px;height:80vh;display:flex;flex-direction:column}
  #pastList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px}
  .import-panes{flex:1;display:flex;gap:16px;min-height:0}
  .imp-side{
    width:330px;flex:none;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;padding-right:4px;
  }
  .imp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  #impResults{flex:1;overflow-y:auto;padding-right:4px}
  .imp-search{position:relative}
  #impSearch{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;
    font-size:16px;font-weight:700;font-family:inherit;outline:none;
  }
  #impSearch:focus{border-color:var(--blue)}
  /* tag suggestions, same white treatment as the 品類 list */
  #impTagMenu{
    position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:5;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.14);max-height:190px;overflow-y:auto;
  }
  #impTagMenu .opt{padding:9px 12px;font-size:15px;font-weight:700;cursor:pointer}
  #impTagMenu .opt:hover,#impTagMenu .opt.sel{background:#eef2fc;color:var(--blue)}
  #impChips{display:flex;flex-wrap:wrap;gap:6px}
  #impChips:empty{display:none}
  #impChips .pill{display:flex;align-items:center;gap:6px}
  #impChips .pill b{cursor:pointer;font-weight:900;opacity:.55}
  #impChips .pill b:hover{opacity:1}
  .pill.total{color:var(--amber);border-color:#f0dcae;background:var(--amber-bg)}
  .imp-label{font-size:14px;font-weight:800;color:var(--muted);margin-top:4px}
  .imp-types{display:flex;flex-direction:column;gap:6px}
  .imp-types .type-btn{width:100%;text-align:left}
  .imp-count{font-size:15px;font-weight:800;color:var(--muted);flex:none}
  .imp-card{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:border-color .12s,background .12s,transform .12s;
  }
  .imp-card:hover{border-color:var(--blue);background:#f5f8ff;transform:translateX(2px)}
  .imp-card .row1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .imp-card .nm{font-weight:800;font-size:17px;margin-right:2px}
  .imp-card .pill.tag.hit{background:var(--blue);border-color:var(--blue);color:#fff}
  .imp-card .durs{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.5}
  .imp-empty{
    text-align:center;padding:48px 20px;color:var(--muted);
    font-size:16px;font-weight:700;line-height:1.9;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  .btn.danger{background:var(--red);box-shadow:none}
  .btn.danger:hover{background:#a5301f}
  .trash-item{
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .trash-item .nm{font-weight:800;font-size:16px}
  .trash-item .when{font-size:13.5px;color:var(--muted);margin-left:auto}
  .trash-item .mini{
    border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;
    font-size:14.5px;font-weight:800;cursor:pointer;color:var(--ink);
  }
  .trash-item .mini:hover{border-color:var(--blue);color:var(--blue)}
  .trash-item .mini.del:hover{border-color:var(--red);color:var(--red)}
  .trash-empty{color:var(--muted);text-align:center;padding:26px 0;font-size:16px}

  .pop{
    position:fixed;z-index:650;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px;box-shadow:0 10px 32px rgba(0,0,0,.25);width:250px;
  }
  .pop .pop-line{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px}
  .pop input{
    border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px;
    font-family:inherit;outline:none;min-width:0;
  }
  .pop input:focus{border-color:var(--blue)}
  .cat-field{flex:1;display:flex;flex-direction:column;min-width:0}
  #catInput{width:100%}
  #qtyInput{width:64px;flex:none}
  /* 品類清單：看得到現有品類、點一下就填進去。
     沒有「反白最接近的那一筆」了 —— 你已經把字打完了，再反白一筆一模一樣的
     只是重複；而且那一列是藍的，藍色在這個專案是「你正在點的東西」，
     一個沒被點過的建議不該長那樣。 */
  #catMenu{
    margin-top:4px;max-height:132px;overflow-y:auto;background:#fff;
    border:1px solid var(--line);border-radius:6px;font-size:15px;
  }
  #catMenu:empty{display:none}
  #catMenu .opt{
    padding:7px 10px;cursor:pointer;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #catMenu .opt:hover{background:#f2f5fa}
  /* 加入 is a small blue cross that appears only when there IS something to add */
  .pop .plus{
    display:none;width:36px;height:36px;flex:none;padding:0;border:none;border-radius:50%;
    background:var(--blue);color:#fff;font-size:20px;font-weight:900;line-height:1;
    cursor:pointer;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(43,108,255,.4);transition:transform .12s ease;
  }
  .pop .plus.show{display:flex;animation:plusIn .16s ease-out}
  .pop .plus:hover{transform:scale(1.12)}
  @keyframes plusIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .pop .mini{
    border:none;background:var(--blue);color:#fff;border-radius:6px;padding:8px 12px;
    font-size:15px;font-weight:800;cursor:pointer;
  }
  .pop .mini.grey{background:#e7eaf0;color:var(--ink)}
  #itemList{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  #itemList .it{
    display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;
    background:#f6f7fa;border-radius:6px;padding:6px 10px;
  }
  #itemList .it .cnt{color:var(--red)}
  #itemList .it b{margin-left:auto;cursor:pointer;opacity:.5}
  #itemList .it b:hover{opacity:1}
  .pop-actions{display:flex;justify-content:space-between}

  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:700;
    background:#26303f;color:#fff;font-size:16px;font-weight:800;
    padding:12px 26px;border-radius:8px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
</style>
</head>

    </div>
    <input type="number" id="qtyInput" min="1" placeholder="數量">
    <button class="plus" id="addItemBtn" title="加入這一項（或按 Enter）">＋</button>
  </div>
  <div id="itemList"></div>
  <div class="pop-actions">
    <button class="mini grey" id="clearItemsBtn">清除</button>
    <button class="mini" id="doneAssignBtn">完成</button>
  </div>
</div>

<div id="toast"></div>

<!-- 共用資料層。選配：檔案不在（或 config.js 還是佔位符）時 PlanSync.ok() 回 false，
     整支就走原本純 localStorage 的路徑。 -->
<script src="config.js"></script>
<script src="supabase-sync.js"></script>

<script>
(function(){
'use strict';

/* ================= date utils (weekend-aware) ================= */
const MS = 86400000;
const WD = '日一二三四五六';
const atMid = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const parseYMD = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); };
const toYMD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWE = d => d.getDay() === 0 || d.getDay() === 6;
const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const nextWork = d => { let r = addDays(d,1); while (isWE(r)) r = addDays(r,1); return r; };
const prevWork = d => { let r = addDays(d,-1); while (isWE(r)) r = addDays(r,-1); return r; };
const addWork = (d,n) => { let r = new Date(d); for (let c = 0; c < n; c++) r = nextWork(r); return r; };
const workBetween = (a,b) => { let c = 0, r = new Date(a); while (r < b) { r = addDays(r,1); if (!isWE(r)) c++; } return c; };
const dayOffset = (base,d) => Math.round((atMid(d) - atMid(base)) / MS);
const fmtMD = d => `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
const fmtMDW = d => `${fmtMD(d)}(${WD[d.getDay()]})`;

/* ================= plan store ================= */
const STAGES = ['提品','製作','一校','一改','二校','二改','蓋章','蓋章修改','審稿','出稿'];
/* built-in tags — offered as one-click chips in the form and in 帶入, so the
   same 檔期 doesn't end up tagged 「父親節」/「父親節檔」/「父親節DM」 */
const PRESET_TAGS = [
  '春節','開學季','母親節','父親節','中元節','中秋節','週年慶','年中慶','雙11','聖誕節',
  '大DM','小DM','線上','實體店','單店','全省','新品','促銷','清倉','會員'
];
const DEFAULT_DURS = [2,2,1,1,1,1,2,1,1,1];
const LS_KEY = 'catalogue_plans_v1';

/* 有接 Supabase 就回那個物件，沒接回 null。所有同步的呼叫都先過這一關，
   後端不在的時候整支程式一行都不會走到網路上。 */
const sync = () => (window.PlanSync && window.PlanSync.ok()) ? window.PlanSync : null;

/* two fake 檔期: one finished (過往檔期 modal) and one still in flight (home) */
const SEED_PLANS = [
  { id:'seed-1', name:'6月父親節檔・全省對開大DM', type:'全省對開大DM', tags:['父親節','大DM'],
    start:'2026-06-08', durs:[2,2,1,1,1,1,2,1,1,1], layout:null },
  { id:'seed-2', name:'7月中檔・全省對開大DM', type:'全省對開大DM', tags:['大DM','促銷'],
    start: (() => { let d = atMid(new Date()); for (let i = 0; i < 4; i++) d = prevWork(d); return toYMD(d); })(),
    durs:[2,2,1,1,1,1,2,1,1,1], layout:null }
];

const ATTR_TAGS = ['大DM','小DM','線上','實體店','單店','全省','新品','促銷','清倉','會員'];
/* give a 檔期 that has no tags 2-3 random built-in ones — purely additive, it
   never touches a plan's name, type, dates or existing tags */
function fillRandomTags(p){
  if ((p.tags || []).length) return false;
  const pool = ATTR_TAGS.slice();
  const seasonal = PRESET_TAGS.slice(0, 10);
  const tags = [seasonal[Math.floor(Math.random() * seasonal.length)]];
  const n = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) tags.push(...pool.splice(Math.floor(Math.random() * pool.length), 1));
  p.tags = tags;
  return true;
}

let plans;
try { plans = JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { plans = null; }
let justSeeded = false;
if (!Array.isArray(plans) || plans.length === 0) { plans = SEED_PLANS.slice(); justSeeded = true; }
// tag up any untagged 檔期 once, so the tag filter has something to work with
if (plans.filter(fillRandomTags).length) justSeeded = true;
/* touched = 這次動到的是哪一個檔期。給了就順手往共用資料庫送那一個 ——
   整包送會讓設計正在改的檔期被我們手上的舊版蓋掉。沒給就只存本機。 */
function savePlans(touched){
  try { localStorage.setItem(LS_KEY, JSON.stringify(plans)); } catch (e) {}
  const s = sync();
  if (s && touched) s.queueUpsert(touched);
}
// persist once, or the random tags would be redrawn on every reload
// （示範檔期只存本機，不往上送 —— 每台新機器開一次就多兩個假檔期太吵）
if (justSeeded) savePlans();

/* deleted 檔期 live here until restored or purged for good */
const LS_TRASH = 'catalogue_trash_v1';
let trash;
try { trash = JSON.parse(localStorage.getItem(LS_TRASH)) || []; } catch (e) { trash = []; }
if (!Array.isArray(trash)) trash = [];
function saveTrash(){ try { localStorage.setItem(LS_TRASH, JSON.stringify(trash)); } catch (e) {} }

/* a stage closes at the end of its last working day */
const DEADLINE_HOUR = 18;
function stageDeadline(s){
  const d = new Date(s.to);
  d.setHours(DEADLINE_HOUR, 0, 0, 0);
  return d;
}
function fmtCountdown(ms){
  const h = ms / 3600000;
  if (h < 1) return `倒數 ${Math.max(1, Math.round(ms/60000))} 分`;
  if (h < 24) return `倒數 ${Math.round(h*2)/2} 小時`;
  return `倒數 ${Math.ceil(h/24)} 天`;
}

/* ================= PM 進度（讀編輯器存下來的東西） =================
   版位、負責 PM、挑好的貨全都在 plan.layout 裡（編輯器那邊的 snapshot 就是它），
   所以這一頁不必另外存什麼，讀就有。這裡一律唯讀 —— 要動手是回編輯器的事。 */
const PM_LIST_KEY = 'board_pms_v1';
function pmRoster(){
  try { return JSON.parse(localStorage.getItem(PM_LIST_KEY)) || null; } catch (e){ return null; }
}
/* 名單是編輯器那邊維護的。版位記的是 id，名單被改過（有人被刪掉、或這台
   瀏覽器還沒開過編輯器）就查不到名字 —— 那就照 id 講，總比一片空白好。 */
const pmLabel = id => ((pmRoster() || []).find(p => p.id === id) || {}).name
                   || String(id || '').replace(/^pm/i, 'PM ');

/* 樹葉節點就是一個版位（跟編輯器的 collectBlocks 同一個判斷：沒有 children） */
function planBlocks(plan){
  const out = [];
  const walk = n => { if (!n) return; n.children ? n.children.forEach(walk) : out.push(n); };
  if (plan.layout){ walk(plan.layout.front); walk(plan.layout.back); }
  return out.filter(b => b.sheet);
}

/* 一個版位對 PM 來說走到哪了：
     wait  一格都還沒挑
     doing 挑了一部分
     done  每一格都挑好貨了
   「做完了」用「每一格都有貨」認，因為那正是 PM 在拼板要做的事；
   編輯器裡「PM 動過手」也是看同一件事（見 makeCard 的 pmFilled）。

   確認列排列（sheet.confirmed）不拿來當條件，只拿來解釋為什麼還沒開始 ——
   本來是「沒鎖定就一律算還沒開始」，結果每一格都塞滿了卻整條是灰的，
   等於在說 PM 什麼都沒做。看板要說的是「實際做到哪」，不是「流程跑到哪」。 */
function blockProgress(b){
  const cells = (b.sheet.cells) || [];
  const done = cells.filter(c => ((c.board && c.board.state && c.board.state.picked) || []).length).length;
  const state = !cells.length || !done ? 'wait' : done === cells.length ? 'done' : 'doing';
  return { done, total: cells.length, state };
}
const blockPmState = b => blockProgress(b).state;

/* ---- 小地圖：把編輯器那一張搬過來 --------------------------------------
   照抄的是形狀的算法（renderMiniNode／effSizes）：同一棵樹、同一套百分比，
   所以這裡畫出來的比例跟設計在編輯器裡看到的一模一樣。差別只有兩點 ——
   這裡不能點，而且每一塊寫的是「PM 挑到哪」而不是版位名稱。 */
function effSizes(node){
  const out = node.children.map(k => k.size);
  const i = out.indexOf(null);
  if (i >= 0) out[i] = Math.max(0, 100 - out.reduce((s,v) => s + (v || 0), 0));
  return out;
}

const MM_RATIO = 174 / 246;   // 一張版的長寬比（跟編輯器那張小地圖同一個比例）
const MM_GAP   = 36;          // 正面和背面中間留多少（要跟 .mm-wrap 的 gap 一樣）
/* 哪幾張卡的小地圖是開著的。放在這裡而不是 DOM 上，因為卡片會被整批重建。 */
const mapOpen = new Set();

function miniNode(node, wpx, hpx){
  if (!node.children){
    const p = blockProgress(node);
    const who = node.sheet.pm ? pmLabel(node.sheet.pm) : '';
    const el = document.createElement('div');
    el.className = 'mm-blk ' + (p.state === 'doing' ? 'part' : p.state === 'done' ? 'done' : '')
                 + (who ? '' : ' unowned');
    if (p.state === 'doing' && p.total)
      el.style.setProperty('--fill', Math.round(p.done / p.total * 100) + '%');
    /* 字級照這一塊真正有多大算，跟編輯器的 miniFontSize 同一個道理：窄的版位
       分到的可能不到 60px 寬，寫死字級就會被切掉半截。
       除數和上下限都是「原本的 ÷ 1.8 / × 1.8」—— 談定字要大 80%，
       所以整條公式一起放大，不是只把上限拉高（那樣小格子還是小）。 */
    const fs = Math.max(13, Math.min(25, Math.floor(Math.min(hpx / 1.6, wpx / 2.4))));
    el.style.fontSize = fs + 'px';
    /* 版位名是主角 —— 「小家電」才認得出是版上哪一塊，PM 的名字認不出來。
       PM 只留後面那個字（「PM 甲」→「甲」），全名在 title 裡。
       太薄的版位（版面上真的有那種一長條的）就只留顏色，塞字進去只會被切掉
       半個字，看起來像壞掉。 */
    /* 字變大了，塞得下的門檻也跟著抬高（原本的 14 / 30 × 1.8） */
    el.innerHTML = hpx < 25 ? ''
                 : `<b>${node.name || '版位'}</b>`
                   + (hpx > 54 ? `<span>${who ? who.replace(/^PM\s*/, '') : '未指派'}${
                       p.total ? '　' + p.done + '/' + p.total : ''}</span>` : '');
    el.title = `${node.name || '版位'}・${who || '未指派 PM'}　`
             + (p.total ? `${p.done}/${p.total} 格挑好貨` : '還沒排版');
    return el;
  }
  const el = document.createElement('div');
  el.className = 'mm-split';
  const row = node.dir === 'row';
  el.style.flexDirection = row ? 'row' : 'column';

  const sizes = effSizes(node);
  const folds = node.fold ? 2 * (node.children.length - 1) : 0;   // .mm-fold 的寬
  const availW = row ? wpx - folds : wpx;
  const availH = row ? hpx : hpx - folds;

  node.children.forEach((kid, i) => {
    if (i > 0 && node.fold){
      const f = document.createElement('div');
      f.className = 'mm-fold';
      el.appendChild(f);
    }
    const kw = row ? (sizes[i] / 100) * availW : availW;
    const kh = row ? availH : (sizes[i] / 100) * availH;
    const k = miniNode(kid, kw, kh);
    k.style.flex = `${sizes[i]} 1 0%`;
    k.style.minWidth = '0px';
    k.style.minHeight = '0px';
    el.appendChild(k);
  });
  return el;
}

/* 版面上每一個版位一筆，照版上的順序（正面到背面）。
   一個版位一位 PM 是編輯器的規矩（ensurePmPerBlock），所以「一位 PM 一條小地圖」
   會變成每個人只有一格 —— 小地圖畫整張 DM，PM 的名字掛在各自那一格上。 */
function pmProgress(plan){
  return planBlocks(plan).map(b => {
    const p = blockProgress(b);
    return { block: b.name || '版位',
             who: b.sheet.pm ? pmLabel(b.sheet.pm) : '未指派',
             state: p.state, done: p.done, total: p.total };
  });
}

/* stage schedule of a plan: [{name, from:Date, to:Date}] */
function planStages(plan){
  const start = parseYMD(plan.start);
  /* 天數是「工作天」：週末沒有人上班，所以不佔天數，時間軸上也不會有它的方塊。
     （中間試過改成日曆天，談定還是工作天。） */
  const base = addDays(isWE(start) ? nextWork(start) : start, -1); // day before first valid workday
  let prev = base;
  return plan.durs.map((dur, i) => {
    const to = addWork(prev, dur);
    // 0 天 = this stage closes the same day as the one before it (stacked flags)
    const from = dur === 0 ? to : nextWork(prev);
    prev = to;
    return { name: STAGES[i], from, to };
  });
}

/* the stage the auto-logic thinks is current: first whose 18:00 hasn't passed.
   -1 once every deadline has passed (a finished plan). */
function autoStageIndex(plan){
  const now = new Date();
  return planStages(plan).findIndex(s => stageDeadline(s) >= now);
}
/* the current stage everything on the home view agrees on: a manual override if
   one is set, otherwise the auto-computed live stage. Bar and cards both read
   this so they can never disagree. */
function currentStageOf(plan){
  const o = plan.stageOverride;
  if (o != null && o >= 0 && o < STAGES.length) return o;
  return autoStageIndex(plan);
}
/* a stage's date range, matching the chip labels on the cards */
function stageRange(s){
  return dayOffset(s.from, s.to) === 0
    ? fmtMD(s.from)
    : (s.from.getMonth() === s.to.getMonth()
        ? `${fmtMD(s.from)}-${String(s.to.getDate()).padStart(2,'0')}`
        : `${fmtMD(s.from)}-${fmtMD(s.to)}`);
}

/* ================= router ================= */
const views = {
  home: document.getElementById('viewHome'),
  plan: document.getElementById('viewPlan'),
  layout: document.getElementById('viewLayout')
};
function show(name){
  Object.entries(views).forEach(([k,el]) => el.classList.toggle('hidden', k !== name));
}

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 2200);
}

/* ================= VIEW 1 : home list ================= */
const planList = document.getElementById('planList');

/* the pill counts down live, so an open page never shows a stale figure */
function tickPill(el){
  el.textContent = `● ${el.dataset.stage}截止 ${fmtCountdown(+el.dataset.deadline - Date.now())}`;
}
setInterval(() => {
  planList.querySelectorAll('.pill.count').forEach(tickPill);
  updateBarCountdown();
}, 30000);

/* a 檔期 is 過往 once its final stage (出稿) deadline has passed */
function isFinished(plan){
  const stages = planStages(plan);
  return stageDeadline(stages[stages.length - 1]) < new Date();
}

function buildCard(plan, now, past){
  const stages = planStages(plan);
  const out = stages[stages.length - 1].to;
  // the shared idea of "current stage" — override or auto (see currentStageOf)
  const curIdx = currentStageOf(plan);
  const autoIdx = autoStageIndex(plan);
  const overriding = plan.stageOverride != null;
  const live = curIdx >= 0 ? stages[curIdx] : null;

  const card = document.createElement('div');
  card.className = 'plan-card' + (past ? ' past' : '');

  const head = document.createElement('div');
  head.className = 'plan-head';
  const nm = document.createElement('span');
  nm.className = 'plan-name';
  nm.textContent = plan.name;
  head.appendChild(nm);
  const tp = document.createElement('span');
  tp.className = 'pill';
  tp.textContent = plan.type;
  head.appendChild(tp);
  (plan.tags || []).forEach(t => {
    const el = document.createElement('span');
    el.className = 'pill tag';
    el.textContent = t;
    head.appendChild(el);
  });
  if (live) {
    const cd = document.createElement('span');
    cd.className = 'pill count';
    cd.dataset.deadline = stageDeadline(live).getTime();
    cd.dataset.stage = live.name;
    tickPill(cd);
    head.appendChild(cd);
  }
  if (overriding) {
    const mp = document.createElement('span');
    mp.className = 'pill manual';
    mp.textContent = '手動';
    if (autoIdx !== curIdx && autoIdx >= 0) {
      mp.classList.add('drift');
      mp.title = `系統推算目前為：${STAGES[autoIdx]}`;
    }
    head.appendChild(mp);
  }
  const outEl = document.createElement('span');
  outEl.className = 'plan-out';
  outEl.innerHTML = `出稿 <b>${fmtMD(out)} 09:00</b>`;
  head.appendChild(outEl);
  // no 🗑 on the card — deleting lives in the dev panel (目前階段管理)
  card.appendChild(head);

  const row = document.createElement('div');
  row.className = 'stage-row';
  stages.forEach((s,i) => {
    const chip = document.createElement('div');
    chip.className = 'stage-chip';
    // curIdx < 0 = finished plan: fall back to deadline for the done shading
    if (curIdx < 0 ? stageDeadline(s) < now : i < curIdx) chip.classList.add('done');
    else if (i === curIdx) chip.classList.add('now');
    chip.innerHTML = `<div class="n"></div><div class="d"></div>`;
    chip.querySelector('.n').textContent = s.name;
    chip.querySelector('.d').textContent = stageRange(s);
    row.appendChild(chip);
  });
  card.appendChild(row);

  /* 誰負責哪幾個版位、做到哪裡。排過版才有東西可講，沒有就整條不出現。 */
  const blks = pmProgress(plan);
  const pmRow = document.createElement('div');
  pmRow.className = 'pm-row' + (blks.length ? '' : ' empty');
  if (blks.length){
    const done = blks.filter(b => b.state === 'done').length;
    const line = document.createElement('div');
    line.className = 'pm-line';

    const sum = document.createElement('span');
    sum.className = 'pm-sum' + (done === blks.length ? ' all' : '');
    sum.textContent = `版位 ${done}/${blks.length} 挑完`;
    line.appendChild(sum);

    /* 誰身上還有事。列沒做完的人就好 —— 全部列出來的話，做完的人也佔一個名字，
       就變成「一排名字」而不是「還缺誰」。 */
    const owing = [...new Set(blks.filter(b => b.state !== 'done').map(b => b.who))];
    const all   = [...new Set(blks.map(b => b.who))];
    const who = document.createElement('span');
    who.className = 'pm-who' + (owing.length ? '' : ' all');
    /* 一個都還沒動的時候，「還沒挑完」等於把全公司的名字念一遍 —— 那不是在
       點名，是在報名冊。這種時候只說一句還沒開始；真的只剩幾個人才值得列名字。 */
    who.textContent = !owing.length          ? '都挑完了'
                    : owing.length === all.length ? '還沒開始'
                    : owing.length > 3       ? '還沒挑完：' + owing.slice(0,3).join('、') + ` 等 ${owing.length} 人`
                    : '還沒挑完：' + owing.join('、');
    /* 收起來的樣子：一塊版位一個方塊，填多少＝挑了幾格。看的是「還剩幾塊」，
       要知道是版上哪一塊才點開小地圖 —— 每張卡都攤開一張版，列表就沒法看了。 */
    const map = document.createElement('span');
    map.className = 'pm-map';
    blks.forEach(b => {
      const sq = document.createElement('i');
      sq.className = 'pm-blk' + (b.state === 'done' ? ' done' : b.state === 'doing' ? ' part' : '');
      if (b.state === 'doing' && b.total)
        sq.style.setProperty('--fill', Math.round(b.done / b.total * 100) + '%');
      sq.title = `${b.block}・${b.who}　${b.total ? `${b.done}/${b.total} 格挑好貨` : '還沒排版'}`;
      map.appendChild(sq);
    });
    line.appendChild(map);
    line.appendChild(who);

    const wrap = document.createElement('div');
    /* 開合狀態記在 mapOpen 裡，不是記在 DOM 上 —— renderHome 每次都把卡片整批
       重建，記在 DOM 上的話倒數計時一跳（每分鐘）你打開的小地圖就自己收起來。 */
    const open = mapOpen.has(plan.id);
    wrap.className = 'mm-wrap' + (open ? '' : ' shut');

    /* 兩張版是打開的時候才畫的 —— 要照卡片實際多寬去分，那件事得等它進到
       畫面上才量得到。順便：關著的卡片一張都不用畫。 */
    const drawMaps = () => {
      wrap.innerHTML = '';
      const room = wrap.clientWidth || 700;
      // 滿寬的 0.7：談定版面縮 30%（字反而放大了，所以看起來更滿）
      const w = Math.max(150, Math.floor((room - MM_GAP) / 2 * 0.7));
      const h = Math.round(w * MM_RATIO);
      [['front','正面'], ['back','背面']].forEach(([side, title]) => {
        if (!plan.layout[side]) return;
        const box = document.createElement('div');
        box.className = 'mm-side';
        const tag = document.createElement('span');
        tag.className = 'mm-tag';
        tag.textContent = title;
        const page = document.createElement('div');
        page.className = 'mm-page';
        page.style.width = w + 'px';
        page.style.height = h + 'px';
        page.appendChild(miniNode(plan.layout[side], w - 3, h - 3));
        box.append(tag, page);
        wrap.appendChild(box);
      });
    };

    /* 把手掛在卡片下緣（不是這一行裡）—— 它是「這張卡還有一截沒拉開」的意思，
       所以站在卡片的邊上，不是站在資訊列裡當一顆按鈕。 */
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'mm-tab' + (open ? ' on' : '');
    tab.innerHTML = '小地圖<span class="arw">▾</span>';
    tab.title = open ? '收起小地圖' : '展開小地圖';
    tab.addEventListener('click', () => {
      const now = !mapOpen.has(plan.id);
      now ? mapOpen.add(plan.id) : mapOpen.delete(plan.id);
      wrap.classList.toggle('shut', !now);
      tab.classList.toggle('on', now);
      tab.title = now ? '收起小地圖' : '展開小地圖';
      if (now) drawMaps();
    });
    card.appendChild(tab);
    pmRow.appendChild(line);
    pmRow.appendChild(wrap);
    // 重畫卡片時本來就開著的那幾張要補畫（clientWidth 要等它進 DOM 才量得到）
    if (open) setTimeout(drawMaps, 0);
  }
  card.appendChild(pmRow);
  return card;
}

/* ================= sticky status bar (focus plan) ================= */
const statusBar = document.getElementById('statusBar');
let focusPlanId = null;   // which plan the bar is showing
let barEditMode = false;  // Layer 1: chips only clickable in edit mode
let editTimer = null;     // auto-exit edit mode after inactivity

function activePlans(){ return plans.filter(p => !isFinished(p)); }
/* the next auto deadline, used only to pick a default focus plan */
function nextDeadline(plan){
  const i = autoStageIndex(plan);
  return i >= 0 ? stageDeadline(planStages(plan)[i]).getTime() : Infinity;
}

function updateBarCountdown(){
  statusBar.querySelectorAll('.sb-cd[data-deadline]').forEach(el => {
    el.textContent = fmtCountdown(+el.dataset.deadline - Date.now());
  });
}

function resetEditTimer(){
  clearTimeout(editTimer);
  editTimer = setTimeout(exitEditMode, 10000);
}
/* clicking a name opens its editor; clicking the open one again closes it */
function selectForEdit(id){
  if (barEditMode && focusPlanId === id) { exitEditMode(); return; }
  focusPlanId = id;
  barEditMode = true;
  renderStatusBar();
  resetEditTimer();
}
function exitEditMode(){
  if (!barEditMode) return;
  barEditMode = false;
  clearTimeout(editTimer);
  renderStatusBar();
}

function renderStatusBar(){
  // a dev tool: it lists EVERY 檔期, not just the in-flight ones, or it would
  // disappear exactly when all your 檔期 are finished
  const actives = plans.slice();
  if (actives.length === 0) {            // no 檔期 at all → no bar
    statusBar.classList.add('hidden');
    statusBar.innerHTML = '';
    barEditMode = false;
    return;
  }
  // keep the focus if still valid, else default to the nearest deadline
  if (!focusPlanId || !actives.some(p => p.id === focusPlanId)) {
    focusPlanId = actives.slice().sort((a,b) => nextDeadline(a) - nextDeadline(b))[0].id;
  }
  statusBar.classList.remove('hidden');
  statusBar.innerHTML = '';

  /* ---- title + dev actions ---- */
  const title = document.createElement('div');
  title.className = 'sb-title';
  title.innerHTML = '目前階段管理<span class="sb-sub">點選檔期即可調整目前階段</span>';
  const acts = document.createElement('span');
  acts.className = 'sb-acts';
  const demoBtn = document.createElement('button');
  demoBtn.className = 'sb-devbtn';
  demoBtn.textContent = '＋ 示範檔期';
  demoBtn.addEventListener('click', e => { e.stopPropagation(); addDemoPlan(); });
  acts.appendChild(demoBtn);
  const binBtn = document.createElement('button');
  binBtn.className = 'sb-devbtn';
  binBtn.textContent = trash.length ? `🗑 回收桶 (${trash.length})` : '🗑 回收桶';
  binBtn.addEventListener('click', e => { e.stopPropagation(); openTrash(); });
  acts.appendChild(binBtn);
  title.appendChild(acts);
  statusBar.appendChild(title);

  /* ---- the list of timeline NAMES (this panel replaces the old duplicate
         chip timeline; the editable chips only appear once a name is clicked) ---- */
  const names = document.createElement('div');
  names.className = 'sb-names';
  actives.forEach(plan => {
    const stages = planStages(plan);
    const curIdx = currentStageOf(plan);
    const autoIdx = autoStageIndex(plan);
    const overriding = plan.stageOverride != null;
    const drift = overriding && autoIdx !== curIdx && autoIdx >= 0;
    const cur = curIdx >= 0 ? stages[curIdx] : null;

    const btn = document.createElement('button');
    btn.className = 'sb-name' + (barEditMode && plan.id === focusPlanId ? ' selected' : '');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = plan.name; btn.appendChild(nm);
    if (cur) {
      const st = document.createElement('span'); st.className = 'st'; st.textContent = '· ' + cur.name; btn.appendChild(st);
      const cd = document.createElement('span');
      cd.className = 'sb-cd';
      cd.dataset.deadline = stageDeadline(cur).getTime();
      cd.textContent = fmtCountdown(stageDeadline(cur).getTime() - Date.now());
      btn.appendChild(cd);
    }
    if (overriding) {
      const mp = document.createElement('span');
      mp.className = 'pill manual' + (drift ? ' drift' : '');
      mp.textContent = '手動';
      if (drift) mp.title = `系統推算目前為：${STAGES[autoIdx]}`;
      btn.appendChild(mp);
    }
    btn.addEventListener('click', e => { e.stopPropagation(); selectForEdit(plan.id); });
    names.appendChild(btn);
  });
  statusBar.appendChild(names);

  /* ---- editor: only after a name is clicked ---- */
  if (barEditMode) {
    const plan = actives.find(p => p.id === focusPlanId);
    const stages = planStages(plan);
    const curIdx = currentStageOf(plan);
    const overriding = plan.stageOverride != null;

    const editor = document.createElement('div');
    editor.className = 'sb-editor';

    const row = document.createElement('div');
    row.className = 'sb-editrow';
    const lead = document.createElement('span');
    lead.className = 'sb-edit-lead';
    lead.textContent = `變更『${plan.name}』目前階段：`;
    row.appendChild(lead);
    const spacer = document.createElement('span'); spacer.className = 'spacer'; row.appendChild(spacer);
    if (overriding) {
      const auto = document.createElement('button');
      auto.className = 'sb-linkbtn';
      auto.textContent = '回復自動';
      auto.addEventListener('click', e => { e.stopPropagation(); resetEditTimer(); openStageConfirm(plan, 'auto'); });
      row.appendChild(auto);
    }
    const del = document.createElement('button');
    del.className = 'sb-linkbtn danger';
    del.textContent = '刪除檔期';
    del.addEventListener('click', e => { e.stopPropagation(); exitEditMode(); askDeletePlan(plan); });
    row.appendChild(del);
    const done = document.createElement('button');
    done.className = 'sb-linkbtn';
    done.textContent = '完成';
    done.addEventListener('click', e => { e.stopPropagation(); exitEditMode(); });
    row.appendChild(done);
    editor.appendChild(row);

    const track = document.createElement('div');
    track.className = 'sb-track';
    stages.forEach((s,i) => {
      const chip = document.createElement('div');
      chip.className = 'stage-chip';
      if (curIdx < 0 ? stageDeadline(s) < new Date() : i < curIdx) chip.classList.add('done');
      else if (i === curIdx) chip.classList.add('now');
      chip.innerHTML = `<div class="n"></div><div class="d"></div>`;
      chip.querySelector('.n').textContent = s.name;
      chip.querySelector('.d').textContent = stageRange(s);
      chip.addEventListener('click', e => { e.stopPropagation(); resetEditTimer(); openStageConfirm(plan, i); });
      track.appendChild(chip);
    });
    editor.appendChild(track);

    const hint = document.createElement('div');
    hint.className = 'sb-hint';
    hint.textContent = '點選上方階段即可設為目前進度（會再次確認）';
    editor.appendChild(hint);

    statusBar.appendChild(editor);
  }
}

/* ---------------- editable timeline (from time_line_v3, weekend-aware) ---------------- */
const bar          = document.getElementById('bar');
const track        = document.getElementById('track');
const numberLabels = document.getElementById('numberLabels');
const stackLayer   = document.getElementById('stackLayer');
const tlPanel      = document.getElementById('tlPanel');
const durRow       = document.getElementById('durRow');
const totalInput   = document.getElementById('totalInput');

const N = STAGES.length;
const PX_PER_BLOCK = 56;
const MIN_UNITS = 5;   // total length has no upper cap — only the 總長 field sets it

let START = atMid(new Date());  // day 0 of the axis
let flagDates = [];             // end date of each stage; non-decreasing weekdays
let UNITS = 15;
let selected = 0, dragging = -1, pending = null;

function firstValid(){ return isWE(START) ? nextWork(START) : START; }
function baseDay(){ return addDays(firstValid(), -1); }
// 提品 must own at least one day; every later stage may collapse onto its
// predecessor (0 天 = 同日結束, i.e. the two flags stack)
function minDur(i){ return i === 0 ? 1 : 0; }

function flagsFromDurs(durs){
  let prev = baseDay();
  flagDates = durs.map((d,i) => { prev = addWork(prev, Math.max(minDur(i), d)); return prev; });
}
function dursFromFlags(){
  let prev = baseDay();
  return flagDates.map(f => { const d = workBetween(prev, f); prev = f; return d; });
}
// last weekday the axis can hold; flags may never be dragged past it
/* 軸上只有 UNITS 格（n = 0…UNITS-1），最後一支旗子要站在最後一格的尾巴上，
   所以最遠只能到 UNITS-1 那一天 —— 再往右就沒有方塊給它站了。 */
function lastValid(){
  const d = addDays(START, UNITS - 1);
  return isWE(d) ? prevWork(d) : d;
}
function clampFlags(){
  const lo = firstValid(), hi = lastValid();
  // clamping preserves order, so flags that run off the end simply stack there
  flagDates = flagDates.map(f => f < lo ? lo : (f > hi ? hi : f));
}
/* the axis length is set ONLY by the 總長 field (or auto-fit on fresh form /
   帶入 / 開始日 change) — never by dragging a flag, and there is no drag grip.
   No upper cap: whatever number is typed is the length (min MIN_UNITS). */
function setTotal(v){
  if (!Number.isFinite(v)) v = UNITS;
  UNITS = Math.max(MIN_UNITS, Math.round(v));
  totalInput.value = UNITS;
  clampFlags();
  buildGrid();
  render();
}
function fitTotalToFlags(){
  UNITS = Math.max(15, dayOffset(START, flagDates[N-1]) + 2);
  totalInput.value = UNITS;
}

/* duration inputs row (the number boxes above the timeline) */
const durInputs = [], durDateEls = [];
STAGES.forEach((name, i) => {
  const cell = document.createElement('div');
  cell.className = 'dur-cell';
  const dn = document.createElement('div');
  dn.className = 'dn';
  dn.textContent = name;
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = minDur(i);   // no upper cap
  const unit = document.createElement('span');
  unit.className = 'unit';
  unit.textContent = ' 天';
  const dd = document.createElement('div');
  dd.className = 'dd';
  cell.appendChild(dn); cell.appendChild(inp); cell.appendChild(unit); cell.appendChild(dd);
  durRow.appendChild(cell);
  durInputs.push(inp); durDateEls.push(dd);

  inp.addEventListener('change', () => {
    let v = parseInt(inp.value, 10);
    if (!Number.isFinite(v) || v < minDur(i)) v = minDur(i);
    inp.value = v;
    const durs = dursFromFlags();
    durs[i] = v;
    flagsFromDurs(durs);
    // increasing a stage's counter grows the total to fit — the axis extends,
    // it doesn't clamp the flag at the end. Length only changes here or via the
    // 總長 field; never by dragging the timeline. Never shrinks on an edit.
    UNITS = Math.max(UNITS, dayOffset(START, flagDates[N-1]) + 2);
    totalInput.value = UNITS;
    buildGrid();
    render();
  });
});
function syncDurRow(){
  const durs = dursFromFlags();
  durs.forEach((d,i) => {
    durInputs[i].value = d;
    durDateEls[i].textContent = fmtMDW(flagDates[i]);
  });
}

/* grid */
function buildGrid(){
  // panel padding (12) + bar-wrap padding (14) — makes the bar exactly
  // UNITS * PX_PER_BLOCK wide, so one day is always PX_PER_BLOCK on screen
  tlPanel.style.width = (UNITS * PX_PER_BLOCK + 26) + 'px';
  bar.innerHTML = '';
  numberLabels.innerHTML = '';
  for (let n = 0; n <= UNITS; n++) {
    const d = addDays(START, n);
    if (isWE(d) && n < UNITS) {
      const sh = document.createElement('div');
      sh.className = 'we-shade';
      sh.style.left = (n / UNITS * 100) + '%';
      sh.style.width = (1 / UNITS * 100) + '%';
      sh.textContent = d.getDay() === 6 ? '周' : '末';   // Sat → 周, Sun → 末
      bar.appendChild(sh);
    }
    const line = document.createElement('div');
    line.className = 'grid-line ' + (d.getDay() === 1 ? 'major' : 'minor');
    line.style.left = (n / UNITS * 100) + '%';
    bar.appendChild(line);

    const lbl = document.createElement('div');
    lbl.className = 'number-label' + (isWE(d) ? ' we' : '');
    lbl.style.left = (n / UNITS * 100) + '%';
    lbl.textContent = fmtMD(d);
    numberLabels.appendChild(lbl);
  }
}

/* flag elements */
const els = [];
for (let i = 0; i < N; i++) {
  const el = document.createElement('div');
  el.className = 'flag';
  el.tabIndex = 0;
  el.dataset.index = i;
  el.innerHTML = '<div class="stem"></div><div class="handle"></div><div class="taglabel"></div>';

const FLAG_HEXES = ['#ff6b6b','#ffa94d','#f5c211','#94d82d','#51cf66','#20c997','#22b8cf','#4dabf7','#845ef7','#f06595'];
const TAIL_HEX = '#8d97a8';
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return {r:(n>>16)&255, g:(n>>8)&255, b:n&255}; }
function mix(hex, target, amount){
  const c1 = hexToRgb(hex), c2 = hexToRgb(target);
  const f = c => Math.round(c1[c]*amount + c2[c]*(1-amount));
  return `rgb(${f('r')}, ${f('g')}, ${f('b')})`;
}
function segColor(i){ return mix(i < N ? FLAG_HEXES[i] : TAIL_HEX, '#ffffff', 0.42); }

/* one label row above the bar: color swatch + stage name (the editable 天數
   inputs live in the duration row above the timeline) */
function labelRow(i){
  const row = document.createElement('div');
  row.className = 'row';
  const sw = document.createElement('span');
  sw.className = 'swatch';
  sw.style.background = FLAG_HEXES[i];
  row.appendChild(sw);
  const name = STAGES[i];
  const label = document.createElement('span');
  if (name.length > 4) {
    // long names wrap instead of widening the row into its neighbour
    label.className = 'label-2line';
    const mid = Math.ceil(name.length/2);
    label.innerHTML = '<div></div><div></div>';
    label.children[0].textContent = name.slice(0,mid);
    label.children[1].textContent = name.slice(mid);
  } else {
    label.textContent = name;
  }
  row.appendChild(label);
  return row;
}

/* 這一天在做哪一個階段：第一個「還沒結束」的就是它。0 天的階段結束日跟前一支
   一樣，所以它不會分到任何一天 —— 那正是「同日結束」的意思。 */
function stageOfDay(d){
  const t = +atMid(d);
  for (let i = 0; i < N; i++) if (t <= +atMid(flagDates[i])) return i;
  return -1;                       // 最後一支旗子之後，沒人認領
}

/* 一天一塊。週末不畫（不算天數）、開工日之前不畫。 */
function paintDayBlocks(){
  bar.querySelectorAll('.day-blk').forEach(n => n.remove());
  const start = +atMid(baseDay());
  for (let n = 0; n < UNITS; n++){
    const d = addDays(START, n);
    if (isWE(d) || +atMid(d) <= start) continue;
    const i = stageOfDay(d);
    if (i < 0) continue;
    const el = document.createElement('div');
    el.className = 'day-blk';
    el.style.left  = (n / UNITS * 100) + '%';
    el.style.width = (1 / UNITS * 100) + '%';
    el.style.background = segColor(i);
    el.title = `${STAGES[i]}　${fmtMDW(d)}`;
    bar.appendChild(el);
  }
}

function render(){
  /* 旗子插在「最後一塊的尾巴」，不是那一天的開頭 —— 期限是那天下班前，
     旗子就該站在那一格的右緣。所以是 +1 格寬。 */
  const pos = flagDates.map(f => Math.min(1, (dayOffset(START, f) + 1) / UNITS));
  paintDayBlocks();

  // stages ending on the same day form one stack
  const groups = [];
  flagDates.forEach((f,i) => {
    const g = groups.find(g => +flagDates[g[0]] === +f);
    if (g) g.push(i); else groups.push([i]);
  });

  /* 這裡本來是一條 linear-gradient，色標算得很細（同日結束的階段還要在同一段裡
     漸層過去）。改成一天一塊之後那整段都不需要了 —— 顏色由 paintDayBlocks() 一格
     一格畫，同日結束的階段本來就分不到方塊，看到的就是「它沒有佔到任何一天」。 */

  els.forEach((el,i) => {
    const group = groups.find(g => g.includes(i));
    const isStack = group.length > 1;
    el.style.left = (pos[i]*100) + '%';
    // a stack reads as one marker, in the color of the segment it closes
    el.style.color = FLAG_HEXES[group[0]];
    el.classList.toggle('selected', i === selected);
    el.classList.toggle('stack-member', isStack && i !== group[0]);
    el.querySelector('.taglabel').textContent = fmtMD(flagDates[i]);
  });

  /* stage-name labels above the bar; stacked flags share one block, which
     splits into two columns past MAX_STACK_ROWS so it grows sideways
     instead of towering. Lifted only on real collision. */
  const MAX_STACK_ROWS = 4;
  stackLayer.innerHTML = '';
  const wraps = [];
  groups.forEach(group => {
    const wrap = document.createElement('div');
    wrap.className = 'stacklabel';
    wrap.style.left = (pos[group[0]]*100) + '%';
    const colCount = group.length > MAX_STACK_ROWS ? 2 : 1;
    const perCol = Math.ceil(group.length / colCount);
    for (let c = 0; c < colCount; c++) {
      const col = document.createElement('div');
      col.className = 'col';
      group.slice(c*perCol, (c+1)*perCol).forEach(gi => col.appendChild(labelRow(gi)));
      wrap.appendChild(col);
    }
    stackLayer.appendChild(wrap);
    wraps.push({el:wrap, pos:pos[group[0]]});
  });
  // greedy multi-row packing: each label drops into the lowest row whose last
  // label has cleared, else a new row above. The wider name+input labels need
  // more than the old two rows, and this guarantees no two ever overlap.
  const GAP = 8, ROW_H = 34, rowRight = [];
  wraps.forEach(w => {
    const width = w.el.offsetWidth;
    const left = w.pos * stackLayer.offsetWidth - width/2;
    let row = 0;
    while (row < rowRight.length && left < rowRight[row] + GAP) row++;
    if (row === rowRight.length) rowRight.push(-Infinity);
    rowRight[row] = left + width;
    w.el.style.bottom = (row * ROW_H) + 'px';
  });

  syncDurRow();
}

/* drag: snap to weekdays; order is kept by collapsing neighbours onto the
   dragged flag's day (they stack) rather than shoving them further out, so
   dragging never stretches the schedule beyond where you dropped the flag */
/* 週末沒有方塊，旗子也就不該停在那裡：拖到週末就退到前一個工作天（六→五、日→五）。
   往前不往後 —— 期限提前趕得上，延後就是遲交。 */
function snapWeekday(d){
  return isWE(d) ? prevWork(d) : d;
}
function setFlagDate(i, date){
  date = snapWeekday(atMid(date));
  const lo = firstValid(), hi = lastValid();
  if (date < lo) date = lo;
  if (date > hi) date = hi;   // the axis end is a wall, not something to push
  flagDates[i] = date;
  for (let j = i+1; j < N; j++) {
    if (flagDates[j] < flagDates[j-1]) flagDates[j] = flagDates[j-1];
    else break;
  }
  for (let j = i-1; j >= 0; j--) {
    if (flagDates[j] > flagDates[j+1]) flagDates[j] = flagDates[j+1];
    else break;
  }
}
/* 游標指著的是哪一天。週末在軸上照樣佔兩天的寬度（56px 一天），但旗子不能停在
   那裡 —— 以前那兩天的判定「整份」都算給前面的週五，於是週五拖到週一要走
   2.5 天 ＝ 140px，週間換一天卻只要 56px，同一個手勢突然變得很重。
   改成把週末的寬度分給兩邊：週六離週五近就算週五，週日離週一近就算週一。
   兩個方向都變成 1.5 天 ＝ 84px，而且左右對稱（以前往左只要 0.5 天，太滑了）。

   要再更短就得讓旗子跑在游標前面（週末完全不佔判定），但那樣游標停在週六、
   旗子已經插在週二，拖曳就不再是「抓著它走」了 —— 這裡選擇讓旗子貼著游標。

   snapWeekday 不動：那是「旗子不准停在週末，而且寧可提前不要延後」的規矩，
   跟「游標現在指著哪一天」是兩件事。 */
function nearestWorkday(d){
  const w = d.getDay();
  if (w === 6) return prevWork(d);      // 週六 → 退回週五
  if (w === 0) return nextWork(d);      // 週日 → 進到週一
  return d;
}
/* 旗子畫在「那一格的右緣」，所以游標落在第 n 格中間時要換算回第 n 天：
   四捨五入抓到的是最近的格線（第 n+1 條），減一格才是那一天本人。 */
function dateFromClientX(clientX){
  const r = track.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  return nearestWorkday(addDays(START, Math.max(0, Math.round(p * UNITS) - 1)));
}

track.addEventListener('pointerdown', e => {
  const flagEl = e.target.closest('.flag');
  if (!flagEl) return;
  const i = +flagEl.dataset.index;
  track.setPointerCapture(e.pointerId);

  // a stack hides several flags under one marker: wait to see which way the
  // drag goes, then peel off the end that's heading that way
  const candidates = [];
  for (let k = 0; k < N; k++) if (+flagDates[k] === +flagDates[i]) candidates.push(k);
  if (candidates.length === 1) {
    dragging = selected = i;
  } else {
    pending = { candidates, startX: e.clientX };
    selected = i;
  }
  render();
});
track.addEventListener('pointermove', e => {
  if (pending) {
    const dx = e.clientX - pending.startX;
    if (Math.abs(dx) < 3) return;
    const c = pending.candidates;
    dragging = selected = dx > 0 ? c[c.length-1] : c[0];
    pending = null;
  }
  if (dragging < 0) return;
  setFlagDate(dragging, dateFromClientX(e.clientX));
  render();
});
function endDrag(){ dragging = -1; pending = null; }
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);

track.addEventListener('keydown', e => {
  const i = +(e.target.dataset ? e.target.dataset.index : NaN);
  if (Number.isNaN(i)) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    selected = i;
    setFlagDate(i, e.key === 'ArrowRight' ? nextWork(flagDates[i]) : prevWork(flagDates[i]));
    render();
  }
});

/* mouse wheel scrolls the timeline horizontally — no need to drag the scrollbar */
const tlScroll = tlPanel.parentElement;
tlScroll.addEventListener('wheel', e => {

  if (!amount) return;
  if (tlScroll.scrollWidth <= tlScroll.clientWidth) return;   // nothing to scroll
  tlScroll.scrollLeft += amount;
  e.preventDefault();
}, { passive: false });

/* 帶入 popup: copy type/tags/durations from a past plan */
const importMask = document.getElementById('importMask');
const impSearch  = document.getElementById('impSearch');
const impTagMenu = document.getElementById('impTagMenu');
const impChips   = document.getElementById('impChips');
const impPresets = document.getElementById('impPresets');
const impTypes   = document.getElementById('impTypes');
const impCount   = document.getElementById('impCount');
const impResults = document.getElementById('impResults');

const IMP_TYPES = ['全部','全省對開大DM','網路素材','單店制作物','A3'];
const TOTAL_TOL = 2;            // 總長 chip matches within ±2 working days

/* filter state — all three combine (AND) */
let impTagChips = [];           // tag names
let impTotal = null;            // a single 總長 number, or null
let impType = '全部';
let impTagSel = 0;              // highlighted row in the tag dropdown
let impTagShown = [];

const totalDurs = p => (p.durs || []).reduce((a, b) => a + (+b || 0), 0);
/* only tags some plan actually carries — filtering by an unused tag is a dead
   end. Built-in tags come first so the common ones are where you expect them. */
const allTags = () => {
  const used = new Set(plans.flatMap(p => p.tags || []));
  return [...PRESET_TAGS.filter(t => used.has(t)),
          ...[...used].filter(t => !PRESET_TAGS.includes(t))];
};

/* one-click 常用標籤 row in the filter pane */
function renderImpPresets(){
  impPresets.innerHTML = '';
  const list = allTags();
  if (!list.length){
    impPresets.innerHTML = '<span style="font-size:14px;font-weight:700;color:var(--muted)">（還沒有標籤）</span>';
    return;
  }
  list.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pt' + (impTagChips.includes(t) ? ' on' : '');
    b.textContent = t;
    b.addEventListener('click', () => {
      if (impTagChips.includes(t)) impTagChips = impTagChips.filter(v => v !== t);
      else impTagChips.push(t);
      renderImpChips(); renderImpResults();
    });
    impPresets.appendChild(b);
  });
}

IMP_TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = 'type-btn' + (t === '全部' ? ' on' : '');
  b.textContent = t;
  b.addEventListener('click', () => {
    impType = t;
    impTypes.querySelectorAll('.type-btn').forEach(x => x.classList.toggle('on', x === b));
    renderImpResults();
  });
  impTypes.appendChild(b);
});

function resetImpFilters(){
  impSearch.value = '';
  impTagChips = [];
  impTotal = null;
  impType = '全部';
  impTypes.querySelectorAll('.type-btn').forEach((b, i) => b.classList.toggle('on', i === 0));
  impTagMenu.classList.add('hidden');
  renderImpChips();
  renderImpResults();
}

function renderImpChips(){
  impChips.innerHTML = '';
  impTagChips.forEach(t => {
    const c = document.createElement('span');
    c.className = 'pill tag';
    c.textContent = t;
    const x = document.createElement('b');
    x.textContent = '×';
    x.addEventListener('click', () => {
      impTagChips = impTagChips.filter(v => v !== t);
      renderImpChips(); renderImpResults();
    });
    c.appendChild(x);
    impChips.appendChild(c);
  });
  if (impTotal != null){
    const c = document.createElement('span');
    c.className = 'pill total';
    c.textContent = `總長 ${impTotal}天`;
    const x = document.createElement('b');
    x.textContent = '×';
    x.addEventListener('click', () => { impTotal = null; renderImpChips(); renderImpResults(); });
    c.appendChild(x);
    impChips.appendChild(c);
  }
  renderImpPresets();   // keep the 常用標籤 row's on-state in sync
}

/* tag suggestions: exact or prefix match against every tag in use */
function renderImpTagMenu(){
  const q = impSearch.value.trim().toLowerCase();
  impTagShown = q
    ? allTags().filter(t => t.toLowerCase().startsWith(q) && !impTagChips.includes(t))
    : [];
  if (!impTagShown.length){ impTagMenu.classList.add('hidden'); return; }
  if (impTagSel >= impTagShown.length) impTagSel = 0;
  impTagMenu.innerHTML = '';
  impTagShown.forEach((t, i) => {
    const o = document.createElement('div');
    o.className = 'opt' + (i === impTagSel ? ' sel' : '');
    o.textContent = `# ${t}`;
    o.addEventListener('mousedown', e => { e.preventDefault(); addImpTag(t); });
    impTagMenu.appendChild(o);
  });
  impTagMenu.classList.remove('hidden');
}
function addImpTag(t){
  if (!impTagChips.includes(t)) impTagChips.push(t);
  impSearch.value = '';
  impTagSel = 0;
  impTagMenu.classList.add('hidden');
  renderImpChips(); renderImpResults();
}

function impMatches(p){
  if (impType !== '全部' && p.type !== impType) return false;
  const tags = p.tags || [];
  if (!impTagChips.every(t => tags.includes(t))) return false;
  if (impTotal != null && Math.abs(totalDurs(p) - impTotal) > TOTAL_TOL) return false;
  const q = impSearch.value.trim().toLowerCase();
  // a pure number in the box is a pending 總長, not a name search
  if (q && !/^\d+$/.test(q) && !(p.name || '').toLowerCase().includes(q)) return false;
  return true;
}

function renderImpResults(){
  const list = [...plans].reverse().filter(impMatches);
  impCount.textContent = `符合 ${list.length} 筆`;
  impResults.innerHTML = '';
  if (!list.length){
    const e = document.createElement('div');
    e.className = 'imp-empty';
    e.textContent = '沒有符合的檔期，試著移除一些條件';
    const br = document.createElement('div');
    const btn = document.createElement('button');
    btn.className = 'btn ghost';
    btn.textContent = '清除全部條件';
    btn.addEventListener('click', resetImpFilters);
    br.appendChild(btn);
    e.appendChild(br);
    impResults.appendChild(e);
    return;
  }
  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'imp-card';
    const r1 = document.createElement('div');
    r1.className = 'row1';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = p.name || '(未命名)';
    r1.appendChild(nm);
    const tp = document.createElement('span');
    tp.className = 'pill';
    tp.textContent = p.type;
    r1.appendChild(tp);
    (p.tags || []).forEach(t => {
      const g = document.createElement('span');
      g.className = 'pill tag' + (impTagChips.includes(t) ? ' hit' : '');
      g.textContent = t;
      r1.appendChild(g);
    });
    const tt = document.createElement('span');
    tt.className = 'pill total';
    tt.textContent = `總長 ${totalDurs(p)} 天`;
    r1.appendChild(tt);
    card.appendChild(r1);
    const d = document.createElement('div');
    d.className = 'durs';
    d.textContent = STAGES.map((s, i) => `${s}${(p.durs || [])[i] ?? 0}`).join('・');
    card.appendChild(d);
    card.addEventListener('click', () => importSettings(p));
    impResults.appendChild(card);
  });
}

impSearch.addEventListener('input', () => { impTagSel = 0; renderImpTagMenu(); renderImpResults(); });
impSearch.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && impTagShown.length){
    e.preventDefault(); impTagSel = (impTagSel + 1) % impTagShown.length; renderImpTagMenu(); return;
  }
  if (e.key === 'ArrowUp' && impTagShown.length){
    e.preventDefault(); impTagSel = (impTagSel - 1 + impTagShown.length) % impTagShown.length; renderImpTagMenu(); return;
  }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const q = impSearch.value.trim();
  if (impTagShown.length){ addImpTag(impTagShown[impTagSel]); return; }   // tag wins
  if (/^\d+$/.test(q)){                                                  // pure number -> 總長 chip
    impTotal = parseInt(q, 10);
    impSearch.value = '';
    renderImpChips(); renderImpResults();
  }
});

/* apply a plan's settings (類別/標籤/各階段天數) into the open form */
function importSettings(p){

}

/* 從檔案帶入 — read an exported 落版單 (.html with embedded JSON, or a .json) */
function planFromText(text){
  text = text.trim();
  if (text[0] === '{') return JSON.parse(text);
  const m = text.match(/<script id="plandata"[^>]*>([\s\S]*?)<\/script>/i);
  if (m) return JSON.parse(m[1]);
  throw new Error('no embedded plan data');
}
const importFile = document.getElementById('importFile');
importFile.addEventListener('change', () => {

  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { importSettings(planFromText(String(r.result))); }
    catch (e) { toast('無法從此檔案讀取檔期資料'); }
    importFile.value = '';
  };
  r.readAsText(f);
});

function pastel(){

/* region content: data-items = JSON [{cat, qty|null}] — survives innerHTML history snapshots */
function getItems(node){
  try { return JSON.parse(node.dataset.items || '[]'); } catch (e) { return []; }
}
function setItems(node, items){
  node.dataset.items = JSON.stringify(items);
  let label = node.querySelector(':scope > .region-label');
  if (!items.length) { if (label) label.remove(); return; }
  if (!label) {
