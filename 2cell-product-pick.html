<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>格子商品帶入</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--line:#e3e7ef;--bg:#f4f5f8;--accent:#d31f2b;--cw:540px;--ch:420px;
  --drop:#4a6fdc;   /* 藍＝放下去的位置 */
  --missing:#d31f2b;   /* 紅＝這裡還缺東西（還沒換上商品圖） */
  --select:#007acc;   /* 藍＝你正在點的東西：選中的零件（多選時每一塊各描一圈） */
  --picked:#e33;   /* 紅＝這一下會動到整個版位（集體移動開著時的選取）。刻意不是藍：
                      藍是「你正在點的東西」，只動眼前這一格；紅是每一格都跟著走 */
  --danger-ink:#b3261e; --danger-tint:rgba(179,38,30,.08)}   /* 刪掉東西的那顆按鈕 */
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;padding-top:52px;box-sizing:border-box;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;display:flex}

/* ---------- 左 sidebar：後台 ---------- */
/* 後台改為覆蓋層，開合不推動中間格子 */
#side{position:fixed;left:0;top:0;bottom:0;z-index:80;width:0;flex:0 0 0;
  background:#fff;border-right:1px solid var(--line);overflow:hidden;
  box-shadow:6px 0 24px rgba(0,0,0,.08);
  transition:flex-basis .18s,width .18s;display:flex;flex-direction:column}
#side.on{width:460px;flex-basis:460px}
#side.on ~ #stage{pointer-events:auto}
.side-hd{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:space-between}
.side-bd{flex:1;overflow:auto;padding:12px}

/* ---------- 中間工作區 ---------- */
#topbar{position:fixed;left:0;right:0;top:0;height:52px;z-index:90;background:#fff;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
.tlabel{font-size:12.5px;font-weight:800;color:#666;margin-left:10px}
.num{width:52px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  font:inherit;font-size:13px;text-align:center}
.num:focus{outline:none;border-color:var(--accent)}
.tx{font-weight:800;color:#888}
.tinfo{font-size:12px;color:#999;font-weight:700;min-width:34px}
.tsep{width:1px;height:22px;background:var(--line);margin:0 6px}
#pad{width:140px;accent-color:var(--accent)}
/* 格子陣列 */
/* --paper ＝**這一格**印什麼顏色的底（主程式的 落版 有一支 上色 工具）。
   主程式用 postMessage 送過來（見 d.paper），單獨開這一頁時沒有人送，就是白的。
   真正吃到它的是 ui=panel（挑貨面板畫的就是那一格）—— 嵌在格子裡的那一份是
   透明的，顏色由主程式那邊的 .cell 在畫。 */
#grid{display:grid;gap:0;justify-content:center;box-shadow:0 6px 26px rgba(0,0,0,.07);background:var(--paper,#fff)}
#grid .cell{width:var(--cw);height:var(--ch)}
/* 內容以 540×CH 排版再整體縮放：CH 照這一格真正的長寬比算出來，
   所以版面永遠填滿那一格 —— 不會為了保持 4:3 在兩側留下空白帶。 */
/* 內容照原版的比例排在 --lw×--lh 的框裡，--cs 把整份縮到這一格多大。
   只有一個縮放變數 —— 「裝不下再整份縮」那一層（--fit）已經不需要了，
   因為比例排版不會超出框（見 buildBlocks）。 */
.cstage{position:absolute;left:0;top:0;width:var(--lw,540px);height:var(--lh,420px);
  transform-origin:0 0;transform:scale(var(--cs,1))}
/* 安全邊界那條紅線：**四邊都畫**，因為四邊都擋著（見 clampAll）。
   框是拿來瞄準的，它說謊比沒有還糟 —— 以前只畫上下、左右卻拖得過去，
   就是那種謊；現在左右也擋，線也就補回來。
   ⚠️ 線寬要除以 --cs：整個 .cstage 被縮到這一格多大（版面上一格常常只有
   0.2 倍），寫死 1px 縮完是 0.2px —— 那條線畫不出來，等於沒有。 */
.safe{position:absolute;inset:var(--pad,8px);
  border:calc(1.4px / var(--cs,1)) dashed rgba(211,31,43,.55);
  pointer-events:none;display:none}
/* **只有在調邊界的時候才看得到**（body.padding ＝ 手正放在那條拉桿／＋−上）。
   它是一把尺，不是版面的一部分：一直畫著的話，每一格上都有一個紅框，
   而排版的人整天看的是那張版長什麼樣。 */
body.padding .cell.cur .safe{display:block}
/* 印出去的是紙，尺不印 —— 主程式列印時每一格的畫布是另一份文件，
   那邊的 @media print 管不到這裡，所以這條要寫在這一頁自己身上。 */
@media print{ .safe{display:none !important} }
/* 目前作用中的格子：只用內陰影標示，不加框線以免破壞黏合外觀 */
.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}
/* 只有非第一列的格子去掉上虛線，避免橫向相鄰時誤消 */
#grid .cell:not(.row1){border-top:none}
#stage{flex:1;min-width:0;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;position:relative}
/* 版面錨點：格子永遠置中不動，左右面板各自佔預留欄位 */
#rig{display:grid;grid-template-columns:auto 400px;align-items:center;column-gap:0}
/* 右欄：選商品在上、圖層在下，之間留空隙 */
#rcol{grid-column:2;margin-left:28px;display:flex;flex-direction:column;gap:16px;
  max-height:calc(100vh - 100px)}
/* 圖層面板與格子零間距貼合 */
#wrap{position:relative;display:flex;align-items:stretch;gap:0;grid-column:1}


/* ---------- 格子 ---------- */
.cell{position:relative;width:var(--cw);height:var(--ch);background:var(--paper,#fff);
  border:none;border-top:1px dashed #c9d0dc;border-bottom:1px dashed #c9d0dc;border-radius:0;
  cursor:pointer;padding:0;display:block}

.cell{overflow:hidden}

.cell.empty{align-items:center;justify-content:center;color:#aab;font-size:20px;font-weight:700}
/* 格子內每個元素都是可自由移動的 block */
/* 框線、圓角、內距也要跟著格子縮。原版寫的是 1.5／6／2／4 px，而它的格子永遠是
   540×420 —— 那些數字其實也是比例。矮格子裡如果它們維持絕對 px，光是框線和內距
   就吃掉好幾成格高，右下那一疊會被推到格子外面（量到過價格掉出去 1.98mm）。 */
.blk{position:absolute;cursor:move;user-select:none;
  border:var(--bd,1.5px) solid transparent;border-radius:var(--r,6px);
  padding:var(--pv,2px) var(--ph,4px);transition:border-color .1s}
/* 字永遠壓在圖上：商品圖是背景，價格、SKU、品名是要讀的東西，不能被蓋住。
   圖片自己有 z-index（疊放順序），所以這裡把「不是圖」的一律抬到它們之上。 */
.blk:not(.img){z-index:60}
.blk:hover{border-color:#c3cbd8}
/* 選中的零件**不上色也不加框**：那一圈紅底加藍線畫在版面正中間，看起來像
   這個商品自己就長那樣 —— 而它只是「你正在動哪一個」。八顆把手已經把這件事
   說完了（跟 Word 一樣），再加一圈只是把版面弄髒。 */
.blk.drop{border-color:#0a7;background:rgba(0,170,119,.12)}
/* --bs＝這一塊自己被放大縮小過幾倍（工具列上的 ＋／−，見 SC_STEP）。基準的數字
   留在這裡不搬進 JS：改版面規範的人是在改 CSS，不該還要去程式裡找 30 在哪。
   沒調過就沒有 --bs，calc 吃預設的 1，跟以前一模一樣。價格不走 CSS 這條路 ——
   它的字級是 JS 算好寫成 inline style 的，但**規矩是同一條**：
   基準（轉盤／同組）乘上這一塊自己的倍率（見 priceFsRaw）。 */
.blk.name{font-size:calc(var(--fs-name,30px) * var(--bs,1));font-weight:800;letter-spacing:.5px;line-height:1.12}
/* ⚠️ font-weight 已經頂到 900 了，再往上沒有東西 —— 這個字型堆疊裡 700／800／900
   對到的是同一個粗體face（量過：400 是 279.6，700 之後一律 286.5，只差 2.5%）。
   小字配淺灰看起來就是不夠重，所以再補兩件事：描邊把筆畫真的加粗，顏色壓深一點。
   描邊用 currentColor，選取變色時不會露出舊顏色的邊。 */
.blk.model{font-size:calc(var(--fs-model,13px) * var(--bs,1));font-weight:900;color:#4a4a4a;
  letter-spacing:.3px;-webkit-text-stroke:.028em currentColor}
/* 品牌：實際 PNG 或長形 placeholder，高度約等同品牌字級 */
.blk.brand .bimg{height:calc(var(--h-brand,26px) * var(--bs,1));display:block;pointer-events:none}
/* 去背匯出的圖四周留著一大圈透明，那圈空白會頂著品名 —— 這一層把它切掉，
   框的大小就是看得見的那一塊（見 brandGeom）。寬高都由 inline style 指定，
   所以上面那條 --h-brand 在這裡要讓開。 */
.blk.brand .bcrop{display:block;overflow:hidden;pointer-events:none}
.blk.brand .bcrop .bimg{height:auto;max-width:none;display:block}
.bph{position:relative;display:inline-block;
  width:calc(var(--bph-w,120px) * var(--bs,1));height:calc(var(--bph-h,28px) * var(--bs,1))}
.bph svg{width:100%;height:100%;display:block}
.bph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:12px;font-weight:800;color:#98a2b3;letter-spacing:.5px}
.blk.img img,.blk.img .ph{width:100%;display:block;pointer-events:none}
/* 貼圖：照模板現場排出來的一疊圖層（sticker-render.js），跟商品圖同一種擺法——
   寬是 b.w，高是寬乘這張貼紙自己的長寬比。
   ⚠️ 舊資料裡的貼圖只有一張烤好的圖（b.svg），那一種還是照原樣當圖片貼，
   只是改不了字 —— 見 stickerArt。 */
/* ⚠️ 貼圖**不留那一圈內距和框線**（.blk 給每一塊零件留的那一圈）。那一圈是給文字
   零件不要貼著框線用的，而貼紙是一整張畫好的東西：畫進去的框比 b.w 小十幾個點，
   字級卻是照 b.w 算的 —— 圓會被畫成橢圓（橫向和縱向被吃掉的量不一樣），字對它
   自己的框也永遠偏大。手放上去那一圈提示改用 outline：它不佔位置。 */
.blk.sticker{overflow:visible;padding:0;border-width:0}
.blk.sticker:hover{outline:1px solid #c3cbd8;outline-offset:0}
.blk.sticker > img{width:100%;display:block;pointer-events:none}
.blk.sticker:hover .tobtn,.blk.sticker.actimg .tobtn{display:block}
.blk.sticker.sel .tobtn{display:none}
/* 滾輪切到這一張（跟商品圖的 .actimg 同一個記號）。貼圖沒有框線（見上面），
   所以那一圈藍畫在 outline 上。 */
.blk.sticker.actimg{outline:2px solid #007acc;outline-offset:0;box-shadow:0 0 12px rgba(0,122,204,.45);opacity:1!important}
/* 下面這幾條是那支渲染器畫出來的節點要的定位規則。貼紙庫那一頁的 stylesheet 裡
   有同樣一份（那邊還多了選取框和把手）—— 幾行定位改壞了自己那一頁一眼看得到，
   真正會悄悄走鐘的是那幾百行怎麼排，所以共用的是程式不是這幾條。 */
.stk-art{position:relative;width:100%;height:100%}
.stk-art .lyr{position:absolute;pointer-events:none}
.stk-art .lyr svg{width:100%;height:100%;display:block;overflow:visible}
.stk-art .lyr img{width:100%;height:100%;display:block;object-fit:fill;-webkit-user-drag:none}
.stk-art .lyr.tx{display:flex;overflow:visible}
.stk-art .lyr.sh{display:flex}
.stk-art .lyr .lbl{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;pointer-events:none;overflow:visible;z-index:1}
.stk-art .lyr .lbl .ft,.stk-art .lyr.tx .ft{width:100%;outline:none;
  white-space:pre-wrap;word-break:break-word}
/* 第一下選這張貼紙，選起來之後文字才點得到（第二下才進去改字）——
   照貼紙庫那一頁的手感。沒選起來時整張貼紙就是一塊可以搬的東西。 */
.blk.sticker.sel .stk-art .lyr.tx,
.blk.sticker.sel .stk-art .lyr .lbl{pointer-events:auto;cursor:text}
/* 正在改的那一塊框起來：游標在字裡面的時候，看不出改的是哪一塊很容易打錯格 */
.stk-art .lyr .lbl.editing,.stk-art .lyr.tx.editing{
  box-shadow:inset 0 0 0 1.5px var(--picked,#e33)}
/* 版面上的零件 margin 一律 0，而且用兩個 class 的選擇器蓋過單一 class 的規則。
   CSS 的 top/left 定位的是 **margin 邊**：只要有哪一條規則給了 margin，
   這一塊畫出來就會離我們寫的座標差那麼多。
   踩過：挑貨清單那條 .price{margin-top:4px} 也命中 .blk.price（而且寫在後面），
   於是每個價格都比座標低 4 個單位 —— 預設版面得靠 nudge 補、拖曳夾邊界又剛好
   漏掉那 4，看起來就是「價格拖得出下邊界」。 */
.cstage .blk{margin:0}

/* 單向拉伸（.sized／object-fit:fill）整組拿掉了：圖不能再被拉扁。 */
/* 預留圖是正方形：高度跟著寬度走，不要寫死。寫死 170 的話，三支商品擠一格、
   圖被縮窄之後就變成細長條，看起來不像「一張商品圖」而像一根柱子。 */
/* 原版的預留圖高度是寫死的（170，佔 41.9% 格高），不是跟著寬度變成正方形 ——
   正方形那一版三張圖一分格寬就各剩 8% 格寬，整格空著（量到過）。 */
/* 預留圖是正方形（談定）—— 原版寫死 170 高配 190 寬，其實是扁的。
   **只有預留圖畫小一點**（框的 70%，四周留 15% 置中）：那張灰圖是「這裡還沒有圖」
   的記號，不是內容，佔滿整個框的話一格看起來就像已經排好了。
   ⚠️ 動的只有 `.ph`，**框（b.w）一個 px 都沒改** —— 換上真的商品圖之後
   還是原來那個大小（談定：真圖現在的大小是對的）。
   `margin:15%` 也讓框的高度維持 70%+15%+15% ＝ 100% 寬，正方形不變，
   所以貼在它上面的那一疊、下面的價格都不會跟著移動。 */
.blk.img .ph{aspect-ratio:1/1;height:auto;width:70%;margin:15% auto}
/* 還沒有圖的那一塊：「你在動哪一個」的每一個記號都**貼著灰圖畫**，不是貼著框
   （2026-09-11）。框比灰圖大一圈（上面那 15%），記號畫在框上的話，選起來那一圈
   比看得到的東西大很多 —— 看起來像選到了一塊空氣。
   ・框線、光暈（滑過／滾輪切到／多選）→ 換成灰圖身上的 outline 和 box-shadow
   ・四個角的把手 → paintHandles 量灰圖的位置擺（placeHandles）
   ・集體移動那圈螞蟻線 → 用 --iw（框寬）把灰圖的位置算回來
   點得到的範圍也跟著縮：框是透明的，旁邊那一圈空白底下可能壓著別的東西。
   ⚠️ 框本身（b.w）一個 px 都不動：換上真圖之後還是原來那個大小。 */
.blk.img.noimg{border-color:transparent!important;box-shadow:none!important;pointer-events:none;
  --cw:calc(var(--iw) - 2 * var(--ph,4px) - 2 * var(--bd,1.5px))}   /* 框的內容寬 */
.blk.img.noimg > .ph{pointer-events:auto;border-radius:3px}
.blk.img.noimg > .rz,.blk.img.noimg > .tobtn{pointer-events:auto}
/* 「最上面」也站進灰圖的下緣：站在框的下緣的話，滑鼠從灰圖往下走去按它，
   中間那一圈空白已經不算滑過了，鈕在手到之前就收起來。 */
.blk.img.noimg > .tobtn{bottom:calc(var(--pv,2px) + var(--cw) * .15 + 3px)}
.blk.img.noimg:hover > .ph{outline:var(--bd,1.5px) solid #c3cbd8}
.blk.img.noimg.actimg > .ph{outline:var(--bd,1.5px) solid #007acc;box-shadow:0 0 12px rgba(0,122,204,.45)}
.blk.img.noimg.msel > .ph{outline:var(--bd,1.5px) solid var(--select);box-shadow:0 0 0 1px var(--select)}
.blk.img.noimg.bpick::after{
  inset:auto;
  left:calc(var(--ph,4px) + var(--cw) * .15 - 3px);
  top:calc(var(--pv,2px) + var(--cw) * .15 - 3px);
  width:calc(var(--cw) * .7 + 6px);height:calc(var(--cw) * .7 + 6px);
}
/* 52 是原版的值，跟 priceBase() 是同一個數字；實際字級由 JS 依格高換算 */
.blk.price{font-family:Anton,sans-serif;color:var(--accent);font-size:var(--fs-price,52px);line-height:1}
.spec{display:inline-block;border:var(--bd,1.5px) solid #111;border-radius:var(--r,6px);
  padding:var(--sp-v,1px) var(--sp-h,8px);
  font-size:calc(var(--fs-spec,14px) * var(--bs,1));font-weight:800;margin-bottom:var(--sp-mb,3px)}
/* SKU 的基準是版位那支轉盤（--sku-fs），單塊微調是再乘上去 —— 乘的是轉盤現在
   那一級，不是寫死的 12，所以轉盤一動，調過的那幾塊也跟著一起動。 */
/* 顏色、字重、字距一律跟機型（.blk.model）同一套 —— 那兩行是同一種東西
   （這是哪一台），本來 SKU 比機型深一階（#1f1f1f 對 #4a4a4a），
   併排在同一行之後那一階看起來就是「這兩行不同類」。 */
.sku{font-size:calc(var(--sku-fs,12px) * var(--bs,1));font-weight:900;color:#4a4a4a;
  letter-spacing:.3px;
  line-height:1.35;white-space:nowrap;-webkit-text-stroke:.028em currentColor}
/* 規格／SKU／價格整欄靠右：右緣對齊欄的右邊界，字級放大時往左溢出、右緣不動。
   靠的是 autoSpace 量好的欄寬（b.w2）當固定寬度框 + text-align:right —— 這樣
   轉盤把價格放大也不會把右緣推出格子外（本來是靠左，一放大就往右頂）。 */
.blk.price,.blk.skub,.blk.specb{text-align:right}
/* direction:rtl 是右緣的保險絲。text-align:right 只在內容塞得進 w2 的時候有效，
   一溢位就從左緣往右畫 —— 那正是價格衝出格子右邊的樣子。rtl 把行的起點換到右緣，
   於是溢位只能往左長，右緣釘死。數字和逗號是強 LTR，「1,234」不會被翻過來。 */
.blk.price{white-space:nowrap;direction:rtl}
.blk.skub .sku{text-align:right}
/* 排在左邊那一疊的 SKU（沒有 rx，用 left 定位）跟機型共用同一條左邊界，
   所以靠左 —— 靠右是「整欄對齊右邊界」那件事的一部分，這裡沒有欄。 */
.blk.skub.atleft,.blk.skub.atleft .sku{text-align:left}
/* 剛排好的那一格先藏起來量寬高，靠右對齊、圖讓開都定位完才顯示 ——
   不然會看到價格先閃在估算的位置、再跳到定位（就是那個「先在中間閃一下」）。 */
.cstage.measuring{visibility:hidden}
.guide{position:absolute;background:#e0329b;pointer-events:none;z-index:60}
.guide.gv{top:0;bottom:0;width:1px}
.guide.gh{left:0;right:0;height:1px}
.marquee{position:absolute;display:none;border:1.5px dashed var(--accent);
  background:rgba(211,31,43,.07);pointer-events:none;z-index:50}
.price{font-family:Anton,sans-serif;color:var(--accent);font-size:44px;line-height:1;margin-top:4px}

/* ---------- 選商品面板 ---------- */
.panel{width:400px;height:380px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:14px;
  display:none;flex-direction:column;overflow:hidden;box-shadow:0 6px 26px rgba(0,0,0,.07)}
.panel.on{display:flex}
.pcats{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px;border-bottom:1px solid var(--line)}
.pcats:empty{display:none}
.pcats button{
  appearance:none;border:1px solid var(--line);background:#fbfcfe;border-radius:999px;
  padding:4px 11px;font:inherit;font-size:12px;font-weight:800;color:#666;cursor:pointer;
}
.pcats button:hover{border-color:var(--drop);color:var(--drop)}
/* 藍＝你正在看的那一類（跟這個專案其他地方同一條規矩） */
.pcats button.on{background:var(--drop);border-color:var(--drop);color:#fff}
.psearch{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.psearch input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px}
.psearch input:focus{outline:none;border-color:var(--accent)}
.pbody{flex:1;overflow:auto;padding:12px}
.pcats{display:flex;gap:6px;padding:9px 10px;border-top:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.pcats button{appearance:none;white-space:nowrap;border:1px solid var(--line);background:#fbfcfe;
  border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.pcats button.on{background:var(--accent);border-color:var(--accent);color:#fff}

.item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
/* 主標之外的那幾段（型號通常最長）：小一級、灰的，長了就切掉尾巴 ——
   一列擠不下的時候，該讓步的是它們，不是右邊的 SKU 和價格 */
/* 主標＝型號，黑體：一群裡分辨得出誰是誰的就是它，不能跟旁邊那幾段灰字一樣淡 */
.item b{flex:none;white-space:nowrap;color:#111;font-weight:800}
.item .sub{font-size:12.5px;color:#666;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:#f4f6fa}
.item input{width:16px;height:16px;accent-color:var(--accent)}
.grp{font-size:12px;font-weight:800;color:#888;margin:10px 0 4px}
.grpline td{border-top:2px solid #b9c1cf}
.imgrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-radius:6px}
/* 放圖只有拖曳一種手勢（整支程式都不開檔案視窗），所以這一列自己就是落點。
   平常那句提示是灰的，拖著東西經過才亮起來 —— 藍＝「放下去的位置」。 */
.imgrow.dragover{background:rgba(74,111,220,.1);outline:2px solid var(--drop);outline-offset:-2px}
.imgrow .hint{font-size:11.5px;color:#98a2b3;flex-shrink:0}
.imgrow.dragover .hint{color:var(--drop)}
.imgrow.imgbusy{opacity:.45}
.ithumb{width:34px;height:34px;flex-shrink:0;display:block;overflow:hidden;border-radius:5px;background:#f0f2f6}
.ithumb img,.ithumb svg{width:100%;height:100%;object-fit:cover;display:block}
.iname{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bthumb{width:76px;flex-shrink:0;display:block}
.bthumb .bph{width:76px;height:20px}
.bthumb .bph i{font-size:9px}
.bthumb .bimg{height:20px;width:auto;max-width:76px;object-fit:contain}
.binput{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 7px;
  font:inherit;font-size:12px}
.binput:focus{outline:none;border-color:var(--accent)}
.var{font-size:12.5px;color:#555;margin-left:auto}
.empty-hint{color:#aab;font-size:13px;padding:14px;text-align:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid var(--line);padding:3px 4px}
th{background:#f6f8fb;font-size:11px}
td input,.grp input{border:none;font:inherit;padding:2px;background:transparent;width:100%}
td input:focus,.grp input:focus{outline:1px solid var(--accent)}
.mini{appearance:none;border:1px solid var(--line);background:#fbfcfe;border-radius:7px;
  padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin:6px 4px 0 0}
.mini:hover{border-color:var(--accent);color:var(--accent)}

/* 把手長得跟 Word 的圖片一樣：八個白色小圓點（四角＋四邊中點），
   選取框是一圈實線。四角等比、四邊單向 —— 手感跟 Word／PPT 對得起來。
   固定大小、不跟著版面縮放：它是操作用的，不是版面的一部分。
   （試過改成 Canva 那一套：細藍框＋圓點角＋長條邊中點、把手固定螢幕大小。
     談定不要 —— 版面上多一圈線就是多一圈線，不好看。） */
/* 只有四個角 —— 邊中點那四顆拿掉了，見 paintHandles。 */
/* 白底、細環、正圓 —— 照 canvas-image-editor 那一套（顏色留這裡原本的藍，
   也沒有旋轉那一顆）。實際大小由 paintHandles 逐顆算：螢幕上固定大小，
   而且夾住不讓它蓋掉要改的那塊零件。 */
.rz{
  position:absolute;width:10px;height:10px;z-index:70;
  background:#fff;border:1.5px solid #2b7fd4;border-radius:50%;
  box-shadow:0 1px 2px rgba(0,0,0,.28);
}
/* 把手貼在邊框「裡面」，不是掛在外面：靠右下的零件（價格、SKU 本來就對齊右下）
   如果把手往外突出，就會掉到畫布外被裁掉 —— 看不到也抓不到。 */
.rz-nw{left:0;top:0;cursor:nwse-resize}
.rz-ne{right:0;top:0;cursor:nesw-resize}
.rz-se{right:0;bottom:0;cursor:nwse-resize}
.rz-sw{left:0;bottom:0;cursor:nesw-resize}
/* 選取框拿掉了（見上面 .blk.sel 那一段）—— 八顆把手自己就站得出來，
   它們本來是「騎在框上」的，現在就是選取本身。
   ⚠️ 只有「剛好選了一塊」才有把手，所以多選要自己畫得出來：框一圈藍
   （藍＝你正在點的東西）。這幾塊會一起被拖走，看不見就等於沒選到。 */
.blk.msel{border-color:var(--select);box-shadow:0 0 0 1px var(--select)}
/* 一把看得到的尺，開著就一直在。壓在最底下（z-index:0）—— 它是背景不是內容，
   蓋在商品圖上會被當成版面的一部分。 */
/* 集體移動開著時選起來的那幾塊：外圈跑一圈虛線，跟 落版「送給 PM」那顆鈕同一個做法
   （四條邊各是一張重複漸層，動的是 background-position —— 虛線本身沒辦法動）。
   紅沿用本來那條波浪線的顏色 —— 會動已經夠明顯了，但紅在滿是藍的畫布上才跳得出來。
   底線本來得分文字和圖兩套寫法，會動的框一套就夠，圖和字都吃得到。
   線是固定 px 的標記，不跟著格子縮 —— 它不是印出去的東西。 */
.blk.bpick::after{
  content:'';position:absolute;inset:-3px;border-radius:calc(var(--r,6px) + 3px);pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg, var(--picked) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(90deg, var(--picked) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(0deg,  var(--picked) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(0deg,  var(--picked) 0 6px, transparent 6px 12px);
  background-size:100% 2px, 100% 2px, 2px 100%, 2px 100%;
  background-position:0 0, 0 100%, 0 0, 100% 0;
  background-repeat:no-repeat;
  animation:pickAnts 1.1s linear infinite;
}
@keyframes pickAnts{
  to{ background-position:12px 0, -12px 100%, 0 -12px, 100% 12px; }
}
/* 會動的東西對某些人是干擾：關掉動畫時虛線框留著，指的還是同一件事。 */
@media (prefers-reduced-motion: reduce){
  .blk.bpick::after{ animation:none }
}
.gridlines{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(to right,rgba(0,122,204,.16) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(0,122,204,.16) 1px,transparent 1px);
  background-size:10px 10px;
}
.blk.img{overflow:visible}
.blk.img.actimg{border-color:#007acc;box-shadow:0 0 12px rgba(0,122,204,.45);opacity:1!important}
/* 「最上面」是在幾張圖疊在一起的時候用的，它不該把圖本身蓋掉 —— 圖一小就整塊
   被它佔滿，連拖都拖不動。所以縮小、改貼在下緣正中間：四個角是縮放把手的地盤。
   字留著不換成箭頭：一個 ⬆ 可以是「往上一層」也可以是「移到最上面」，
   而右邊圖層面板那一排按鈕寫的就是「最上面」—— 同一件事只該有一個名字。 */
.tobtn{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);display:none;appearance:none;
  border:1px solid rgba(0,0,0,.18);
  background:rgba(255,255,255,.94);color:#1b3a57;font:inherit;font-size:10px;line-height:1;font-weight:800;
  white-space:nowrap;padding:4px 7px;border-radius:999px;cursor:pointer;z-index:5;
  box-shadow:0 2px 5px rgba(0,0,0,.18)}
.tobtn:hover{background:#fff;border-color:#007acc;color:#007acc}
.tobtn:active{transform:translateX(-50%) translateY(1px);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.blk.img:hover .tobtn,.blk.img.actimg .tobtn{display:block}
/* 選中就收起來：那正是要拖、要縮的時候，一顆按鈕站在圖上只會擋路。
   要換疊放順序，右邊圖層面板那一排「最上面」一直都在。 */
.blk.img.sel .tobtn{display:none}
/* 拿掉這張貼圖。以前唯一的辦法是選起來按 Delete —— 那要先知道有這回事，而且要那一格
   先收得到鍵盤，按下去沒反應看起來就是程式壞了。看得到的東西才按得到。
   ⚠️ 站在框的**外面**一點點：選起來的時候四個角是改大小的把手，擠在一起就會按錯。
   ⚠️ 「最上面」選起來就收掉（那時候要拖、要縮，一顆鈕站在圖上只會擋路），
   ✕ 反過來要留著 —— 選起來正是打算對它做點什麼的時候。 */
/* ⚠️ 大小照**螢幕**算，不照版面（跟四個角的把手同一條理由）：整份畫布被 --cs 縮進格子、
   外面那層 .ccanvas 又縮一次（--ss），寫死 18px 的話在整張版上只剩五六個 px，
   根本按不到。除回去讓它在螢幕上約 24px；但夾一個上限：不超過那張貼紙寬的 45%
   （--bw，blockHTML 寫在那一塊上）—— 縮到很小的時候 1/縮放 會很大，
   一顆 ✕ 比它要刪的那張貼紙還大，看起來就像那張貼紙本身。 */
.delbtn{--dz:min(calc(24px / (var(--cs,1) * var(--ss,1))), calc(var(--bw,80px) * .45));
  position:absolute;top:calc(var(--dz) * -.5);right:calc(var(--dz) * -.5);display:none;appearance:none;
  width:var(--dz);height:var(--dz);padding:0;border-radius:999px;
  border:max(1px, calc(var(--dz) / 20)) solid rgba(0,0,0,.2);
  background:rgba(255,255,255,.96);color:#c0392b;font:inherit;font-size:calc(var(--dz) * .62);line-height:1;
  font-weight:800;cursor:pointer;z-index:6;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.delbtn:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.blk.sticker:hover .delbtn,.blk.sticker.sel .delbtn{display:block}
/* 圖層面板：位於選商品面板正下方，獨立窗口 */
#lay{display:none;width:400px;flex:1;min-height:150px;background:#fff;
  border:1px solid var(--line);border-radius:14px;flex-direction:column;overflow:hidden;
  box-shadow:0 6px 26px rgba(0,0,0,.07)}
#lay.on{display:flex}
#lay .side-hd{padding:10px 12px;font-size:12px}
#lay .side-bd{flex:1;overflow:auto;padding:8px}
/* ⚠️ 這一列叫 .lrow 不叫 .lyr：**.lyr 是貼紙那一疊圖層的名字**（sticker-render.js
   畫出來的，兩邊共用）。撞名的下場不是版面亂掉，是下面這幾個點的內距和框線
   悄悄套到每一層貼紙上 —— 而貼紙的字級是照「整張貼紙多大」算的，框卻被擠小了
   十幾個點（而且那十幾個點不隨貼紙縮放），於是字對它自己的框永遠太大：
   一擠過臨界點，「48」就折成上下兩行整個爆出紅圈外。看起來像貼紙做壞了。 */
.lrow{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;cursor:pointer;
  border:1.5px solid transparent;font-size:13px}
.lrow:hover{background:#f4f6fa}
.lrow.on{border-color:#007acc;background:rgba(0,122,204,.08)}
.lrow{cursor:grab}
.lrow:active{cursor:grabbing}
.lrow.dragging{opacity:.45}
.lrow.over{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.lgrip{color:#b9c1cf;font-size:11px;flex-shrink:0}
.lrow .mini{font-size:10.5px;padding:3px 7px;opacity:0;flex-shrink:0}
.lrow:hover .mini,.lrow.on .mini{opacity:1}
.mini.danger{color:var(--danger-ink)}
.mini.danger:hover{border-color:var(--danger-ink);color:var(--danger-ink);background:var(--danger-tint)}
.lthumb{width:30px;height:30px;flex-shrink:0;overflow:hidden;border-radius:5px;background:#f0f2f6}
.lthumb img,.lthumb svg{width:100%;height:100%;object-fit:cover;display:block}
/* 貼圖的縮圖整張放進來（形狀本身就是它的樣子，裁掉一截就認不出是哪一張） */
.lthumb.stk img{object-fit:contain}
.lthumb.stk{display:flex;align-items:center;justify-content:center;font-size:15px}
.lname{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lz{font-size:10px;color:#999;font-weight:800}
.spec.dark{background:#111;color:#fff;border-color:#111}
/* 劃線：兩條對角線橫跨整個價格，線條隨字級縮放 */
.blk.price.crossed{overflow:visible}
.blk.price.crossed::before,.blk.price.crossed::after{
  content:'';position:absolute;left:-6%;top:50%;width:112%;height:0;
  border-top:.07em solid #111;pointer-events:none}
.blk.price.crossed::before{transform:rotate(15deg)}
.blk.price.crossed::after{transform:rotate(-15deg)}
/* 浮動小工具列：貼在被選元素正上方 */
#props{position:absolute;display:none;gap:5px;z-index:70;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;
  box-shadow:0 4px 14px rgba(0,0,0,.16)}
#props.on{display:flex}
#props::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  width:9px;height:9px;background:#fff;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);rotate:45deg}
/* 選到最上面那一排時工具列改掛在下面，箭頭跟著翻上去 */
#props.under::after{bottom:auto;top:-5px;rotate:225deg}
.pbtn{appearance:none;border:1px solid var(--line);background:#fbfcfe;border-radius:6px;
  padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.pbtn:hover{border-color:#111}
.pbtn.act{background:#111;color:#fff;border-color:#111}
/* ＋／− 是同一顆按鈕的兩半，做成方的才看得出是一組 */
.pbtn.sq{padding:5px 0;width:26px;text-align:center;font-size:14px}
.pbtn.dis{opacity:.35;cursor:default}
.pbtn.dis:hover{border-color:var(--line)}
.pbtn.danger{color:var(--danger-ink)}
.pbtn.danger:hover{border-color:var(--danger-ink);background:var(--danger-tint)}
/* 目前是幾成大。調過才顯示，沒調過不佔位置 */
.pnum{font-size:11px;font-weight:800;color:#999;padding:0 3px;align-self:center;min-width:30px;
  text-align:center}
/* 藏起來的零件：格子左下角一顆 ＋，數字是藏了幾個。點開是一張清單，
   打勾就回來 —— 跟 devtools 刪掉節點還找得回來是同一件事。
   跟著 --cs 縮放：它疊在版面上，固定 px 的話同一顆鈕在縮小的格子裡佔掉三分之一、
   放大之後又變成一粒芝麻 —— 看起來就是「這顆東西自己會忽大忽小」。
   只縮不放：--cs 大於 1 的時候不跟著長大，一顆比商品還大的按鈕就不是記號了。 */
#restore{position:absolute;display:none;z-index:71;transform-origin:left bottom;
  transform:translateY(-100%) scale(min(1, var(--cs,1)))}
#restore.on{display:block}
.rbtn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:4px 9px;font:inherit;font-size:12px;font-weight:800;color:#666;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.14);display:flex;align-items:center;gap:5px}
.rbtn:hover{border-color:#111;color:#111}
.rbtn .rn{font-size:11px;color:#fff;background:#999;border-radius:999px;padding:0 5px;min-width:16px;
  text-align:center}
.rbtn:hover .rn{background:#111}
/* 清單往上開：按鈕在左下角，往下開會掉到格子外面 */
.rlist{display:none;position:absolute;left:0;bottom:calc(100% + 5px);width:210px;max-height:210px;
  overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.18)}
#restore.open .rlist{display:block}
.ritem{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:#444}
.ritem:hover{background:#f4f6fa}
.ritem input{width:15px;height:15px;accent-color:var(--accent);flex-shrink:0}
.ritem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 空框點得下去（開那個庫）。手勢要看得出來 —— 不然它跟畫上去的灰框沒有兩樣。 */
.blk.img.noimg,.blk.brand .bph{cursor:pointer}
/* 還沒換圖的商品圖本來框一圈紅（一眼看得出還缺幾張圖）。拿掉了 ——
   原版沒有這個記號，而紅框是版面上最搶眼的東西，看起來像版面壞了。
   還缺幾張圖從預留圖本身就看得出來（那是一張灰色的虛線占位圖）。
   class 還留著，要恢復只要把外框加回來。 */

/* ---------- 身分：設計 只排版；PM 只帶商品 ---------- */
/* 設計 拿不到選商品面板與後台，所以無法新增任何東西 */
body.role-design #panel,
body.role-design #sideToggle{display:none !important}
/* PM 只能點選，不能搬動，游標也要說清楚 */
body.role-pm .blk{cursor:default}
/* 疊放順序是排版的事，PM 沒有圖層面板 */
body.role-pm #lay{display:none !important}

/* ---------- 只出借一塊面板（?ui=panel） ----------
   嵌在落版旁邊時，這一頁只露出「挑貨」／「圖層」那塊面板，貼在那一格旁邊。
   格子本身還是要照畫 — 縮圖是從它身上複製的 — 所以版面不是 display:none，
   而是搬到畫面外：照樣有版面、有尺寸，只是看不到。 */
body.ui-panel{padding-top:0;background:transparent}
body.ui-panel #topbar,
body.ui-panel #side{display:none !important}
body.ui-panel #stage{padding:0;display:block;overflow:hidden}
body.ui-panel #rig{display:block;height:100%}
body.ui-panel #wrap{position:absolute;left:-10000px;top:0;visibility:hidden}
/* 用 100vh 不是 100%：這一頁被嵌成 iframe 的時候，視窗就是那塊面板，所以 vh 剛好
   等於面板高度。用 % 的話要一路從 html/body 都有高度才算得出來，而這一頁沒有，
   於是 #lay 只會長到內容那麼高 —— 下面那截就露出 iframe 自己的白底，看起來像
   面板裡面又疊了一個空白箱子。 */
body.ui-panel #rcol{margin:0;width:100%;height:100vh;max-height:none;gap:0}
body.ui-panel .panel,
body.ui-panel #lay{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
/* 被嵌在落版旁邊時，這塊面板捲到底就停 — 不要把剩下的滾輪推給外面那張版，
   不然名單一到底，整片版面就跟著動起來。 */
body.ui-panel,body.ui-panel .pbody,body.ui-panel .side-bd{overscroll-behavior:contain}

/* ---------- 只出借畫布（?ui=stage） ----------
   落版上那一格裡面放的就是這個：同一支程式、同一份內容，只是照那一格的大小
   整個縮起來。所以那一格不是縮圖，它就是畫布本人。 */
body.ui-stage{padding-top:0;background:transparent}
/* #props（浮動小工具列）以前也關在這裡。拼板就是這個模式 —— 關掉它等於
   「格子裡的零件不能改大小、不能刪」，所以現在留著。#tip 還是關：那是跟著
   游標跑的說明，一格一個 iframe 會滿版都是。 */
body.ui-stage #topbar,body.ui-stage #side,body.ui-stage #rcol,
body.ui-stage #tip{display:none !important}
body.ui-stage #stage{padding:0;overflow:hidden;height:100vh}
body.ui-stage #rig{display:block;height:100%}
body.ui-stage #wrap{height:100%;justify-content:center;align-items:center}
body.ui-stage #grid{box-shadow:none;background:transparent;align-content:center;
  justify-content:center;width:100%;height:100%}
body.ui-stage .cell{border:0;background:transparent;cursor:default}
body.ui-stage .cell.cur{box-shadow:none}
body.ui-stage .cell.empty{font-size:0}     /* 空的就真的空著，字由落版那邊寫 */
/* 版面上的格子也要看得到那條紅線 —— 邊界調的就是版上那些格子，
   看不到的話只能靠「東西好像往裡面縮了一點」猜。 */
</style>

<script>
/* ⚠️ 這一段非在 <body> 的第一行不可。整支程式收在最下面那個 <script> 裡，
   而 `ui-stage`／`ui-panel` 這個 class 是它加的 —— 等輪到它的時候，瀏覽器早就
   把上面那條工具列、左邊的後台、那顆「產生格子」整個畫出來了。嵌在版面裡的
   那幾十支 iframe 於是每一支都先閃一次完整的操作介面（後台／版面 1×1／邊界／
   壓力測試），格子才長出來 —— 那正是「挑完貨，格子先閃一下奇怪的東西」。
   （每一支 iframe 都要重新 parse 這一整份檔案，所以那一閃不短。）
   這裡只判斷 `ui=`，不重複任何邏輯；下面那支照樣會再加一次（同一個 class，
   加兩次沒有差別），單獨開這一頁時兩邊都不動。
   參數兩種來源都要看：單檔版是 srcdoc，沒有網址，上層把它塞在 __PICK_PARAMS
   （插在 <head> 後面，所以這時候讀得到）。 */
try{
  var u = new URLSearchParams(window.__PICK_PARAMS || location.search).get('ui') || '';
  if(u === 'panel' || u === 'stage') document.body.classList.add('ui-' + u);
}catch(e){}
</script>

/* 型號：配件/充電器類才有，手機平板通常沒有。以商品名為 key，
   所以同商品的不同顏色與容量共用同一型號。 */
let MODEL = {
  'ANKER 30W 自帶線行動電源':'A1654H21',
  'AirPods Pro 3':'MTJV3',
  'AirPods 4':'',
  'iPhone 17 Pro Max':'',
  'iPhone 17 Pro':'',
  'Galaxy A5':'',
  'iPad Air':'',
  'iPad A16':'',
  'MacBook Pro':'',
  'MacBook Neo Air M5':''
};
function modelOf(n){ return MODEL[n]||''; }
/* 品牌和型號**先問那一列自己**，再回頭問「商品名 → 值」那兩張對照表。
   對照表假設的是「同一個商品名就是同一個品牌、同一個型號」。公司實際的資料不是：
     空調,HITACHI,變頻冷暖空調,RAC-28NP1/RAS-28NJP1
     空調,Panasonic,變頻冷暖空調,CU-UJ28BHA2/CS-UJ28BA2
   同一個「變頻冷暖空調」跨三個品牌，同一個品牌底下每一筆的型號也都不一樣 ——
   對照表存不下這件事，所以商品目錄那一頁（product.html）把它們放回列上。
   對照表沒有拿掉：舊資料還躺在裡面，沒有列上那一份的就照舊讀它。 */
function rowBrand(r){ return (r && (r.brand || BRAND[r.name])) || ''; }
function rowModel(r){ return (r && (r.model || MODEL[r.name])) || ''; }
/* 上層送下來的品牌 Logo 庫：`正規化過的品牌名 → 公開網址`。
   商品目錄說這一列的牌子是 HITACHI，這一份說 HITACHI 的圖在哪 ——
   接上之後，「這個牌子長什麼樣」不必一個商品一個商品上傳。 */
let LOGOS = null;
const normBrand = v => String(v == null ? '' : v)
  .trim().toLowerCase().replace(/[\s　._\-]+/g, '');
function logoOf(brand){
  const k = normBrand(brand);
  return (LOGOS && k && LOGOS[k]) || '';
}

/* 品牌圖，三層，前面的贏：
     1. 手動上傳、照品牌名存的（後台那顆「上傳」）
     2. 手動上傳、照商品名存的（更早以前的做法，舊資料還在裡面）
     3. **品牌 Logo 庫**（logo_page）—— 正常情況下就是這一層在供圖
   手動的排前面是刻意的：有人特地為某個牌子換過一張，那就是他要的那一張，
   不該被庫裡那張蓋掉。庫是「沒有人特別指定時的正確答案」。 */
function bimgOf(r){
  const b = rowBrand(r);
  return (b && BIMG[b]) || (r && BIMG[r.name]) || logoOf(b);
}

/* 畫 brand 零件的時候**當場再查一次**，不要用存檔裡那一串網址。
   零件是排版當下存下來的，`b.bimg` 是「那一天庫裡的那一張」——
   有人在 Logo 庫把圖換掉之後，這一格會永遠停在舊的那張（restoreBoard 把它

   ⚠️ 只有查得出來才換。查不出來分兩種：庫還沒送到（LOGOS 是 null，例如單獨開
   這一頁、或 Logo 那個專案被暫停）就沿用存檔那張 —— 那時候把圖清成空框，
   等於一次連線問題就讓整本 DM 的品牌圖全部消失；庫送到了而這個牌子沒有圖，
   才是真的被刪了，那就跟著空。 */
function blockBimg(b){
  /* 舊存檔的 brand 零件只有 name（那時候品牌是照商品名查的）。 */
  const brand = b.brand != null ? b.brand : (BRAND[b.name] || '');
  const live = bimgOf({ brand, name: b.name });
  if(live) return live;
  return LOGOS ? '' : (b.bimg != null ? b.bimg : (BIMG[b.name] || ''));
}

/* 品牌：同商品共用。BRAND 存品牌名，BIMG 存上傳的品牌 PNG(dataURL)。
   沒上傳圖時顯示長方形 placeholder，高度與品牌字級相當。 */
let BRAND = {
  'iPhone 17 Pro Max':'Apple','iPhone 17 Pro':'Apple','iPad Air':'Apple','iPad A16':'Apple',
  'MacBook Pro':'Apple','MacBook Neo Air M5':'Apple','AirPods 4':'Apple','AirPods Pro 3':'Apple',
  'Galaxy A5':'Samsung','ANKER 30W 自帶線行動電源':'ANKER'
};
let BIMG = {};
function brandOf(n){ return BRAND[n]||''; }

/* ====== 商標畫多大 ======
   這個位子談好的框是 120 寬 × 26 高（placeholder 那個框）。以前不管哪一張都
   固定「26 高」，於是別家的商標一律比 HITACHI 小一大截。

   ⚠️ 光看圖檔的長寬**不夠**：這些圖多半是去背工具匯出來的，四周留著一大圈透明。
   量過庫裡那五張（2026-08-13）：
     HITACHI   836×194，字佔 724×119 → 佔畫布 53%
     Panasonic 600×600，字佔 540×80  → 佔畫布 **12%**
     Mitsubishi 980×980，圖佔 516×563 → 佔畫布 30%
   所以照畫布配大小的話，Panasonic 那一張畫出來看得見的字只有 HITACHI 的四分之一
   —— 「還是太小」講的就是這件事。

   做法：量出**看得見的那一塊**（墨水框），然後
     1. **每一張都畫成一樣高**（BRAND_INK_H），寬度照它自己的比例走 —— 不拉伸、
        不夾寬度，所以沒有一張會變形。這是談定的規矩：預設大小＝一樣高。
     2. 把四周那圈空白**裁掉**（外面一層 overflow:hidden，裡面那張圖照比例放大並
        位移）—— 不裁的話，「一樣高」量到的是畫布，看得見的字還是各高各的
        （Panasonic 那張只有 12% 是字，量畫布等於量一張空白）。
   所以「一樣高」講的是**看得見的那一塊一樣高**，那才是眼睛看到的東西。 */
const BRAND_W = 120, BRAND_H = 26;
/* 統一高度＝ HITACHI 那張本來畫出來的墨水高度（119/194 × 26 ≒ 16）。
   選它是因為那一張就是這個位子的標準答案（見 CLAUDE.md 的最高原則：長得像 rule.png），
   而且它是最扁的那幾張之一 —— 訂在這裡，Panasonic（比例 6.75）畫出來 108 寬，
   還在這個位子談好的 120 以內。**要整排一起變大就改這一個數字。** */
const BRAND_INK_H = 16;

/* 只有在**讀不到像素**（跨來源擋住、量不到墨水框）的時候才走這裡：那時候只知道
   畫布的長寬，量不出看得見的那一塊，「一樣高」就無從談起 —— 退回照畫布的面積配，
   至少不會有人特別小。正常情況（庫裡的圖）走的是 brandGeom 那條。 */
function brandBaseH(ratio){
  if(!(ratio > 0)) return BRAND_H;                 // 還沒量到：照舊
  let h = Math.sqrt(BRAND_W * BRAND_H / ratio);
  if(h * ratio > BRAND_W) h = BRAND_W / ratio;     // 比 HITACHI 還扁的：改夾寬度
  return h;
}

/* 網址 → { r:畫布長寬比, ink:{w,h,ix,iy,iw,ih}|null }。量一次就記著：
   重畫很頻繁，而同一張圖不會自己變。 */
const LOGO_M = new Map();
/* 量商標最多等這麼久。等的期間那一格是藏著的，所以這個數字是「最久空白多久」——
   一張 logo 幾十 KB，正常幾十毫秒就回來了；吊著的那一種不能陪它一直等。 */
const LOGO_WAIT = 1200;

/* 墨水框用 canvas 讀像素量。Storage 那邊回 `access-control-allow-origin: *`，
   所以掛 crossOrigin 之後畫布不會被污染 —— 萬一還是讀不到（換了來源、舊瀏覽器），
   ink 就是 null，退回照畫布的長寬比配大小，也就是沒有裁切的那一版。
   量的時候先縮到 256px：要的是一個框，不是原尺寸的精度。 */
function measureLogo(url){
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => {
    const r = im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0;
    let ink = null;
    try{
      const S = 256, k = Math.min(1, S / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.max(1, Math.round(im.naturalWidth * k));
      const h = Math.max(1, Math.round(im.naturalHeight * k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.drawImage(im, 0, 0, w, h);
      const d = cx.getImageData(0, 0, w, h).data;
      /* jpg 沒有透明，那種圖的空白是**白的**。四個角都接近白才把白當背景 ——
         不然一張真的白底 logo 會被從中間裁開。 */
      const near = i => d[i]>245 && d[i+1]>245 && d[i+2]>245;
      const corner = i => d[i+3]<16 || near(i);
      const bgWhite = corner(0) && corner((w-1)*4) && corner((h-1)*w*4) && corner(((h-1)*w+w-1)*4);
      let x0=w, y0=h, x1=-1, y1=-1;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        if(d[i+3] <= 16) continue;
        if(bgWhite && near(i)) continue;
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }
      /* 整張都是空白就當作量不到（裁完什麼都不剩）。剛好填滿畫布的圖照樣記下來 ——
         那時候墨水框就等於畫布，配大小走的還是同一條路，只是不必真的裁。 */
      if(x1>=x0 && y1>=y0){
        const inv = 1 / k;
        ink = { w: im.naturalWidth, h: im.naturalHeight,
                ix: x0*inv, iy: y0*inv, iw: (x1-x0+1)*inv, ih: (y1-y0+1)*inv };
      }
    }catch(_){ ink = null; }        // 跨來源讀不到像素：照畫布算，不裁
    LOGO_M.set(url, { r, ink });
    repaintBrand(url);
  };
  /* 畫不出來的圖另有人講 —— 但**還是要重畫**：量不到的時候那幾格是藏著的
     （見 renderOne 的 waitLogo），沒有這一句就永遠藏著。 */
  im.onerror = () => { LOGO_M.set(url, { r:0, ink:null }); repaintBrand(url); };
  /* 沒有回應的那一種（網址還在、伺服器不回）不會走 onerror，會一直吊著。
     藏著等下去就是「那一格永遠空白」，比閃一下糟得多 —— 到時間就當作量不到。 */
  setTimeout(() => {
    if(LOGO_M.get(url) !== null) return;
    LOGO_M.set(url, { r:0, ink:null });
    repaintBrand(url);
  }, LOGO_WAIT);
  im.src = url;
}

/* 商標的大小量出來了（或量不到了），左上那一疊要跟著讓開，不然品名會壓在
   商標身上。正在編的那一格量得到 DOM，交給 force 那一趟的 spreadStack；
   別的格子不量 DOM，所以照差額把那一疊挪一挪（refitBrandStack）。
   只動用得到這張圖的格。 */
function repaintBrand(url){
  CELLS.forEach((c,i)=>{
    const bs = (i===curCell ? BLOCKS : c.blocks) || [];
    if(!bs.some(b => b.kind==='brand' && blockBimg(b) === url)) return;
    if(i===curCell) renderOne(i, true);
    else { refitBrandStack(bs); renderOne(i); }
  });
}

/* 這張商標還在量（LOGO_M 裡是 null ＝已經開始、還沒有結果）。
   量到之前 brandGeom 回 null，整疊照「26 高」那個暫代值排 —— 那不是它最後的
   位置，而量到的那一刻整疊會跳一次。所以這段時間那一格先藏起來（見 renderOne）。 */
function logoPending(url){
  if(!url) return false;
  if(!LOGO_M.has(url)){ LOGO_M.set(url, null); measureLogo(url); return true; }
  return LOGO_M.get(url) === null;
}

/* 這一張商標畫成什麼樣（全部是排版座標的單位）：
     h/w      ＝ 看得見的那一塊要多大（也就是這一塊零件佔多少位子）
     iw/ih    ＝ 裡面那張圖要放多大
     ox/oy    ＝ 圖要往左上位移多少，才會讓墨水剛好落在框裡
   量到之前回 null —— 那時候照舊 26 高，量到了會自己重畫。 */
function brandGeom(url){
  if(!url) return null;
  if(!LOGO_M.has(url)){ LOGO_M.set(url, null); measureLogo(url); return null; }
  const m = LOGO_M.get(url);
  if(!m || !(m.r > 0)) return null;
  const ink = m.ink;
  if(!ink){                                   // 讀不到像素：照畫布配，不裁
    const h = brandBaseH(m.r);
    return { h, w: h*m.r, iw: h*m.r, ih: h, ox: 0, oy: 0, crop: false };
  }
  const ri = ink.ih ? ink.iw / ink.ih : m.r;
  let h = BRAND_INK_H;                        // 一律一樣高
  /* 唯一會讓它變矮的情況：寬到快掉出格子。那時候整張等比例縮小（還是不變形）——
     這是「別掉出去」的保險，不是版面規矩，正常的商標碰不到。 */
  const room = Math.max(BRAND_W, CW - MARGIN*2);
  if(h * ri > room) h = room / ri;
  const s = h / ink.ih;                       // 一個原圖 px 換算成幾個排版單位
  /* 本來就填滿畫布的圖不必真的裁 —— 少一層 DOM，畫出來一模一樣。 */
  const crop = ink.iw < ink.w * .98 || ink.ih < ink.h * .98;
  return { h, w: ink.iw*s, iw: ink.w*s, ih: ink.h*s, ox: ink.ix*s, oy: ink.iy*s, crop };
}

/* 這一塊商標在排版座標裡佔多高。buildBlocks 拿它留位子（品名要從商標底下開始），
   blockHTML 拿它寫成實際的高度 —— 兩邊一定要是同一個數字，不然留的位子
   跟畫出來的高度對不起來。 */
function brandSlotH(b){
  const img = typeof b === 'string' ? b : blockBimg(b);
  if(!img) return BRAND_H;
  const g = brandGeom(img);
  return g ? g.h : BRAND_H;
}

/* 商標當初留了多少位子（brand 零件上的 hres），跟現在該留多少的差額，
   補在左上那一疊身上。量到比例、或那個牌子換了一張別的比例的圖，都會走到這裡。
   手動搬過的（placed）和右下那一組（rx）不碰 —— 那是使用者放的位置。 */
function refitBrandStack(blocks){
  const br = (blocks||[]).find(b=>b.kind==='brand');
  if(!br) return false;
  const now = brandSlotH(br) + 8, was = br.hres != null ? br.hres : BRAND_H + 8;
  br.hres = now;
  const d = ty((now - was) * SZ_BRAND);
  if(Math.abs(d) < .5) return false;
  blocks.forEach(b=>{
    if(b===br || b.placed || b.rx!=null) return;
    /* 貼著那一疊底下的商品圖也要一起走（見 buildBlocks 的 stackBottom）——
       只推字不推圖的話，圖會被壓到品名身上。 */
    if(['name','model','sku'].includes(b.kind) || (b.kind==='img' && b.stick && !b.w0))
      b.y = (+b.y||0) + d;
  });
  return true;
}

/* 品牌圖：有上傳用圖，否則畫長形 placeholder（內嵌，斷網可用）。
   收的是「品牌名 ＋ 圖」兩個字串，不是商品名 —— 呼叫的人手上有那一列，
   它比這裡更知道這一列的品牌是誰（見 rowBrand）。 */
function brandHTML(b, img){
  if(img) return `<img class="bimg" src="${img}" alt="" draggable="false" decoding="sync">`;
  return `<span class="bph"><svg viewBox="0 0 120 28" preserveAspectRatio="none">
      <rect x="0.6" y="0.6" width="118.8" height="26.8" rx="4" fill="#f0f2f6"
        stroke="#c9d0dc" stroke-width="1.2" stroke-dasharray="4 3"/>
    </svg><i>${b||'品牌'}</i></span>`;
}

/* 一格放得下的是「同一個商品、**同一個品牌**」。
   光比商品名不夠：公司的資料裡同一個「變頻冷暖空調」跨 HITACHI／Panasonic／…，
   只比名字的話兩家會一起落進同一格，而格子左上只畫得出一張 logo
   （buildBlocks 的品牌問的是第一列）—— 印出來就是 Panasonic 的機器掛著
   HITACHI 的牌子，而且畫面上完全看不出哪裡不對。
   品牌照 normBrand 比（大小寫、空白、`.` `-` `_` 都不算差別），
   跟貼 logo 那條用同一把尺 —— 兩邊各一套的話會有「圖貼得上、卻不准放在一起」。 */
function pickKey(r){ return (r ? r.name : '') + '|' + normBrand(rowBrand(r)); }

/* 就地成群：連續且**同商品同品牌**的列 → 一群。斷開的規矩就是 pickKey，
   所以清單上看到的一段就是可以一起勾進同一格的那一段。 */
function groups(){
  const out=[];
  for(const r of ROWS){
    const last=out[out.length-1];
    if(last && pickKey(last.rows[0])===pickKey(r)) last.rows.push(r);
    else out.push({name:r.name,rows:[r]});
  }
  return out;
}

/* ====== 多格：每一格有自己的 picked / BLOCKS / layoutKey ====== */
/* 安全邊界：原版上下左右都是 20（在它那個 540×420 的框裡）。
   這裡換算成「這一格」的座標，所以佔格子的百分比跟原版一樣：20/540、20/420。
   本來是寫死的 10（左右）＋ 10（上下）＋ 價格例外的 5，那三個數字跟原版都不一樣，
   於是每一個元素離邊界的距離都只有原版的一半。 */
/* 每一格的邊界：四邊都是這一個數字（座標單位）。
   刻意只留一個名字 —— 以前是 MARGIN（左右）＋ MARGIN（上下）＋ PRICE_BOTTOM（價格例外）
   三個，於是「四邊一樣寬」只是剛好都填了同一個數字，誰改一個就破功。
   一個常數之後，那件事是結構保證的，不是巧合。 */
/* 邊界。上層用**座標單位（px）**給（一個版位一個），這裡直接就是它 ——
   跟這一頁單獨開時那條拉桿是同一個數字，紅線畫的也是同一個數字。
   ⚠️ 座標框是照長寬比正規化的（見 adoptStageCm），所以同樣的 8 個單位在
   高格子和扁格子上不是同一個實際長度。談定用 px：拉桿上看到幾就是幾，
   紅線就是那個位置，不再有「你調 2mm、扁格子只拿到 0.9mm」那種說不清的事。 */
const MARGIN_PX_DEFAULT = 8;
/* 集體移動：開著的時候，放手那一下要把位移報給上層，由它發給其他每一格。 */
let BULK_MOVE = false;
/** 這一格：1cm 是幾個座標單位。兩軸一樣 —— 座標框是照長寬比開的（CW/CH ＝
    CM_W/CM_H），所以 CW/CM_W 和 CH/CM_H 是同一個數。 */
const unitsPerCm = () => (CM_W && CW) ? CW / CM_W : 0;
/* 集體移動的目標不是「哪一種」，是「哪一種的第幾個」——「三個價格」的格子裡，
   拖第二個價格就只該動每一格的第二個價格，不是三個一起飛。
   右下那幾組本來就帶欄號（b.col）；沒有欄號的（品名、商標、商品圖）用它在同種
   裡的順序 —— 那是 buildBlocks 排出來的，穩定。 */
function slotOf(b){
  if(!b) return 0;
  if(b.col != null) return +b.col;
  const same = BLOCKS.filter(x => x.kind === b.kind);
  return Math.max(0, same.indexOf(b));
}
const bulkKey = b => b.kind + '#' + slotOf(b);
/* 挑法只有一種：選取（點、Ctrl／Shift＋點、框選）。集體移動開著的時候，
   選起來的那幾塊外圈跑一圈紅虛線 —— **紅色專講「這一下會動到整個版位」**，
   不是另一種選取。以前是 Ctrl＋點另外挑一份清單，等於同一個畫面上兩套選取，
   而它們長得不一樣、清空的時機也不一樣。 */
let bulkTick = 0;
/** 這一趟要搬哪幾個。拖的是選起來的其中一塊 → 選起來的那幾塊都算；
    拖一塊沒選過的就只搬它 —— 三個價格的格子拖第二個，就只有第二個會動。 */
const bulkTargets = src => {
  if(!selected.has(src.id)) return [bulkKey(src)];
  const ks = [...selected].map(id => BLOCKS.find(x => x.id === id))
                          .filter(Boolean).map(bulkKey);
  return ks.length ? [...new Set(ks)] : [bulkKey(src)];
};
const matchKeys = keys => BLOCKS.filter(b => keys.indexOf(bulkKey(b)) >= 0);
function bulkPreviewTick(src){
  if(bulkTick) return;                       // 這一幀已經排過了
  bulkTick = requestAnimationFrame(()=>{
    bulkTick = 0;
    if(!drag || !drag.orig || !drag.orig[src.id]) return;
    const per = unitsPerCm(); if(!(per > 0)) return;
    const dx = (+src.x||0) - (+drag.orig[src.id].x||0);
    const dy = (+src.y||0) - (+drag.orig[src.id].y||0);
    const keys = bulkTargets(src);
    showBulkPreview(keys, dx, dy, drag.ids);
    try{ parent.postMessage({ bulkPreview:{ keys,
      dxMm:+(dx/per*10).toFixed(3), dyMm:+(dy/per*10).toFixed(3) } }, '*'); }catch(_){}
  });
}
let MARGIN = MARGIN_PX_DEFAULT;
/* 紅線是 CSS 畫的（.safe 讀 --pad），數字只有這裡一個來源 —— 兩邊各算一次的話
   遲早會有一條線指著別的地方，而那條線的用途就是「照著它擺」。 */
function setMargin(m){
  if(m != null) MARGIN = Math.max(0, +m || 0);
  document.documentElement.style.setProperty('--pad', MARGIN + 'px');
}
/* 邊界變大時，把已經站在外面的零件拉回線內。四邊都夾 —— 紅線是牆，
   牆往內移了，站在牆外的就得跟著進來，不然那條線又開始說謊。
   拉桿（單獨開這一頁）和上層送下來的邊界走同一條：兩邊各寫一份的話，
   版面上那一種永遠會少做一半（而且要拖一下才看得出來）。 */
function clampToMargin(){
  CELLS.forEach((c,i)=>{
    const bs = (c===cell())?BLOCKS:c.blocks;
    const el = document.getElementById('cell'+i);
    if(!el||!bs.length) return;
    const k=(el.clientWidth||CW)/CW;
    bs.forEach(b=>{
      const n=el.querySelector(`[data-b="${b.id}"]`);
      const w=n?n.getBoundingClientRect().width/k:0;
      const h=n?n.getBoundingClientRect().height/k:0;
      b.x=Math.max(MARGIN,Math.min(b.x,CW-MARGIN-w));
      b.y=Math.max(MARGIN,Math.min(b.y,CH-MARGIN-h));
    });
  });
}
/* 排版座標系：1 cm ＝ U_PER_CM 個座標單位，每一格都一樣。

   本來每一格的寬都固定 540，不管它在版上其實多大 —— 於是 cs（= 格子的實際
   像素寬 / CW）每一格都不一樣，寫死的 12px SKU 在窄格子裡被壓成 7px、在寬
   格子裡是 11px。同一個版位裡量到過 34% 的落差，而品名根本沒有任何自動縮放
   邏輯，卻一樣大小不一 —— 那就證明問題出在座標系，不在排版程式。

   改成照真實尺寸開座標系之後 cs = pxPerCm / U_PER_CM，是整個版位的常數，
   寫死的 px 才真的到處一樣大。60 是挑來讓「一列四格」那種常見格子
   （約 9cm 寬）算出來差不多還是 540，舊檔換算過去幅度最小。 */
const U_PER_CM = 60;
const LEGACY_CW = 540;          // 舊檔的座標是照這個寬存的
/* 真正的尺寸是上層用網址參數帶進來的，而 PICK_Q 在下面才宣告 —— 這裡只能先
   放預設值，讀參數要等到 PICK_Q 之後（見 adoptStageCm 的呼叫）。
   在這裡讀 PICK_Q 會 ReferenceError，然後整支程式停在這一行。 */
let CM_W = 0, CM_H = 0;
let CW = LEGACY_CW, CH = 420;

/* ---- 原版是規範：每個元素佔一格的百分比照 2cellOriginal.html ----------------
   原版的格子永遠是 540×420，所以它那些寫死的數字（MARGIN 20、品名 30、價格 52、
   商品圖 190×170、斜疊 14…）其實都是**比例**：20/540 的邊界、30/420 的品名。
   ox()／oy() 就是把那些數字換算到這一格的座標系 —— 換算完，比例跟原版一模一樣，
   而且不管格子是高的、扁的、大的、小的都成立。

   為什麼這樣就不會再溢出：每個元素佔的比例是固定的，加起來永遠在 100% 以內。
   本來是「字級寫死、格子大小卻是實際公分」，格子一矮內容就比框大 —— 那才是
   之前要靠 --ts／--fit／IMG_FIT 三層補丁去救的原因。照比例排，那些補丁不必存在。 */
const O_W = 540, O_H = 420;
/* 原版的 x 是在 540 寬裡量的、y 是在 420 高裡量的 —— 各自換算到這一格的框。
   有一邊會是恆等式（見 adoptStageCm：扁的格子固定高、瘦的格子固定寬），
   另一邊照長寬比拉開。 */
const ox = v => v * CW / O_W;
const oy = v => v * CH / O_H;

/* ---- 字級的基準：一個版位一個，不是一格一個 --------------------------------
   照比例算的話，同一個版位裡 6cm 高和 12cm 高的格子，字會差一倍 —— 那正是
   CW=540 那次修掉的 bug（量到過同一版位 34% 落差）。所以字級不看自己那一格，
   看整個版位的參考格（上層送 refCm 下來，取最小的那一格）。
   格子大小一致時（絕大多數情況）參考格就是自己，＝ 原版的比例，一模一樣。 */
/* 字級：座標框的高固定，所以「字級 52」在每一格都是同一個座標值 —— 但畫出來多大
   要乘 --cs，而 --cs 是照這一格的實際尺寸算的。所以物理大小仍然跟格高成正比。
   同一個版位裡格子高度不一樣的時候，就照參考格（上層送最矮的那一格 cm）打折，
   讓實際印出來一樣大。格子一樣高（絕大多數）→ 比例是 1 → 就是原版的數字。 */
let REF_CM_H = 0;                      // 參考格高（cm）；0 ＝ 沒有，就用自己的
/* 這一格的座標是不是已經是新座標系（v4）。新排的（buildBlocks）當然是；
   舊檔要換算成功才算。沒換算成功就不能蓋 v4 那個版本章 —— 見 restoreBoard。 */
let COORDS_V4 = true;
const ty = v => v * (REF_CM_H && CM_H ? REF_CM_H / CM_H : 1);

/* ---- 字級：照原版的比例算，一個版位一個基準 ----------------------------
   PRICE_BASE 不再是寫死的 px，而是「原版那個 52」換算到這一格（priceBase()）。
   SKU 跟價格一樣照「這一格有幾個」分三組（SKU_BY_COUNT），乘在 SKU_BASE 上。
   PRICE_MUL：轉盤那兩顆 ＋／− 調出來的**倍率**（1＝沒調過）。
   本來是一個絕對 px（在轉盤還是數字輸入框的年代），蓋過自動那一段 ——
   換成 ＋／− 之後「多大」不再由人指定，只有「比現在大一點／小一點」，
   所以它乘在自動算出來的基準上，不再蓋掉它。
   GROUP_FS：上層廣播回來的同組比例 —— 照比例排之後同組本來就一樣大，
   這一條只剩「轉盤調過」時還有意義，留著不擋路。 */
/* 2026-08 談定的預設大小：原版那幾個數字（52、30、26、12、190/200）在實際版面上
   都偏小。倍率乘在**畫出來**這一層，不動存下來的值 —— 轉盤存的是 12、舊檔期存的
   也是 12，改存的值等於把每個人自己調過的那一級一起改掉，而且舊檔期不會跟著變大。
   乘在這裡的話，新舊檔期一律照新的比例畫，轉盤的 ＋／− 照樣在它上面加減。 */
/* SKU 的預設**跟機型同一級**（談定的，見 rule.png）：機型是 `13 * SZ_MODEL` ＝ 19.5，
   SKU 的基準是 12，所以 19.5/12 ＝ 1.625。
   本來是 2.25 ＝ 27，比機型大了快四成，而那兩行講的是同一件事（這是哪一台）——
   一個比另一個大一號，看起來像 SKU 比較重要。長的型號配上放大的 SKU，
   併排那一行還會頂出格子（量到過「KU：2156742黑/44橋」左邊被切掉）。
   ⚠️ 這只是**預設**：上層那支 SKU 轉盤（SKU_BY_COUNT）照樣乘在它上面。 */
const SZ_PRICE = 1.5, SZ_SKU = 1.625, SZ_NAME = 1.6, SZ_BRAND = 2, SZ_IMG = 2, SZ_MODEL = 1.5;

const priceBase = () => ty(52 * SZ_PRICE);
const SKU_BASE = 12;             // 原版那個數字，跟價格的 52 同一個地位
let SKU_BY_COUNT = { 1:1, 2:1, 3:1 };   // 上層轉盤：照這一格有幾個 SKU 分組
/* 上層那條 字級 上的商標／品名／型號／商品圖：一個版位一組倍率（1＝沒調過）。
   跟 SZ_* 那組談定的預設值是兩件事 —— SZ_* 是「這支程式長什麼樣」，
   這一組是「這一檔的這個版位要再大一點」。兩個相乘。 */
let TYPE_MUL = { brand:1, name:1, model:1, img:1 };
let PRICE_MUL = 1;
let GROUP_FS = 0;
let priceWanted = 1;            // 保留給上層那條協商用；照比例排之後永遠是 1
/** 這一格有幾個價格。分組（同組要一樣大）和舊資料的相容都看它。
    藏起來的不算：版上看不到的價格不該把這一格拖進「三個價格」那一組。 */
function priceCount(bs, off){
  const o = off || {};
  return (bs || BLOCKS).filter(b => b.kind === 'price' && !o[b.uid]).length;
}

/* 幾個價格就用哪一級字。**1 ＝ 不動**，只有三組以上小一級（0.9）——
   三組是沿著下緣攤開的（見 buildBlocks），一欄只剩三分之一格寬，
   維持原來那一級的話數字會頂到隔壁那一欄。
   四個以上沿用三個那一級：再往下分，每一級都只有一兩格用得到。
   ⚠️ 這張表本來是 {1:1.55, 2:1.25}，可是 countFs() **從來沒有人叫過** ——
   整張表是死的。照那組數字接回去會讓一價的價格一口氣大 55%，
   而現在一價、二價長什麼樣是談定過的，所以那兩格改成 1（維持現狀）。
   三價那一級 2026-08 從 0.9 再往下 30%（0.9 × 0.7 = 0.63，談定）：
   攤開的那三欄一欄只有三分之一格寬，0.9 那一級的數字幾乎把整欄佔滿。 */
const PRICE_COUNT_FS = { 3: 0.63 };
const countFs = () => PRICE_COUNT_FS[Math.min(3, priceCount())] || 1;

/** 這一格有幾個 SKU（藏起來的不算，理由同 priceCount）。
    ⚠️ BLOCKS 是後面才宣告的 let，而 applyMetrics 在頂層就跑過一次（座標系一定案
    就要算字級）—— 直接讀會踩到 TDZ，整支程式從那一行死掉、畫面全白。
    這裡接住它：那個時候本來就還沒有零件，算出來是 0。 */
function skuCount(bs, off){
  const o = off || {};
  let list = bs;
  if(!list){ try{ list = BLOCKS; }catch(_){ list = []; } }
  return (list || []).filter(b => b.kind === 'sku' && !o[b.uid]).length;
}
/** 這一格該用哪一級 SKU 倍率。四個以上就沿用三個那一級 —— 再細分下去，
    每一級都只會有一兩格用到，調了也看不出差別。 */
const skuMul = () => SKU_BY_COUNT[Math.min(3, Math.max(1, skuCount()))] || 1;

/** 這一組價格的基準比例：自動（同組最小，＝原版的 52 換算過的 priceBase()）× 轉盤倍率
    × 這一格有幾個價格那一級（countFs，見 PRICE_COUNT_FS）。
    幾個價格是**這一格的事實**，不是誰調出來的，所以乘在基準上、轉盤照樣在它上面加減。 */
function priceBaseFs(){ return (GROUP_FS || 1) * (PRICE_MUL || 1) * countFs(); }
/** 要求的比例，還沒過「絕不溢出」那道夾子。
    ⚠️ 單格微調（b.fsFix）是**乘上去**的，不是蓋過去的：轉盤是「這一組價格多大」，
    單格微調是「這一塊比它的同伴大幾成」，兩件不同的事。
    以前是 `if(b.fsFix) return b.fsFix`（微調一設，轉盤對它就完全失效）——
    於是自己拉過的那幾塊會卡在原地不動，轉盤看起來像壞了。
    SKU、品名、規格那幾種本來就是這樣（CSS 的 `--sku-fs * --bs`），價格只是漏了。 */
function priceFsRaw(b){ return priceBaseFs() * (b.fsFix || 1); }
/* autoSpace 要「這一塊本來想要多大」時用這個。跟 priceFsRaw 同一條式子 ——
   兩支分開是因為以前最後那一段不一樣（priceFsRaw 會回 b.fs，而 b.fs 是 autoSpace
   自己上一輪算完寫回去的：排版吃自己的上一個結果，每次縮放都要多排一次才收斂）。
   b.fs 這個欄位早就沒有人寫了，留著只會讓人以為那條路還在。 */
const priceReq = priceFsRaw;
/* b.shrink 是最後那道夾子：要求的字級整列排不下時，autoSpace 算出剛好排得下的
   比例存在每一塊上（整組同一個值，數字之間的相對關係不變）。1 ＝ 沒夾。
   存在 block 上而不是放一個全域的，是因為 blockHTML 也會畫「不是現在這一格」的
   格子，而 autoSpace 只跑現在這一格 —— 全域的會把這一格的夾子套到別格頭上。
   轉盤本來允許溢出，談定改成不准 —— 寧可字小一點，也不要壓到隔壁版位。 */
function priceFs(b){ return priceFsRaw(b) * (b.shrink || 1); }

/** 上層把這個版位的字級設定送下來。 */
function applyType(t){
  if(!t) return;
  let hit = false;
  if(t.skuByCount){
    for(const n of [1,2,3]){
      const v = +t.skuByCount[n] || 1;
      if(Math.abs(v - SKU_BY_COUNT[n]) > .0005){ SKU_BY_COUNT[n] = v; hit = true; }
    }
  }
  const mul = +t.priceMul || 1;
  if(mul !== PRICE_MUL){ PRICE_MUL = mul; hit = true; }
  const g = +t.groupFs || 0;
  if(g !== GROUP_FS){ GROUP_FS = g; hit = true; }
  /* 字級的基準格：整個版位一個（上層取最矮的那一格）。收到就重算一次 ——
     沒有它的話（單獨開這一頁）就用自己這一格，＝ 原版的數字本人。 */
  const rh = +t.refCmh || 0;
  if(rh && Math.abs(rh - REF_CM_H) > .001){ REF_CM_H = rh; applyMetrics(); hit = true; }
  let marginHit = false;
  if(t.marginPx != null){
    const px = Math.max(0, +t.marginPx || 0);
    if(Math.abs(px - MARGIN) > .0005){ setMargin(px); marginHit = hit = true; }
  }
  if(t.mul){
    for(const k in TYPE_MUL){
      const v = +t.mul[k] || 1;
      if(Math.abs(v - TYPE_MUL[k]) > .0005){ TYPE_MUL[k] = v; hit = true; }
    }
  }
  if(!hit) return;
  applyMetrics();        // SKU 轉盤的值是原版單位（預設 12），換算在 applyMetrics 裡
  // 邊界往內移了：站在線外的零件先拉回來，再重畫（見 clampToMargin）
  if(marginHit) clampToMargin();
  /* renderOne 會把整格的 innerHTML 重寫，四顆把手跟著沒了 —— 而調字級的時候
     那一塊通常正選著（你就是為了它才去按 ＋／−）。補畫一次，選取才不會
     每按一下就掉一次。 */
  if(BLOCKS.length){ renderOne(curCell, true); paintHandles(); }
}
let CELLS=[];          // [{id, picked:Set, blocks:[], layoutKey:''}]
let curCell=0;         // 目前作用中的格子索引
let GC=1, GR=1;        // 版面 欄×列

function cell(i){ return CELLS[i===undefined?curCell:i]; }
/* 所有既有邏輯都透過這兩個 getter/setter 存取當前格 */
function cellEl(i){ return document.getElementById('cell'+(i===undefined?curCell:i)); }

function makeCells(cols,rows){
  GC=cols; GR=rows;
  const n=cols*rows;
  const old=CELLS;
  CELLS=[]; 
  for(let i=0;i<n;i++) CELLS.push(old[i]||{picked:new Set(),blocks:[],layoutKey:''});
  if(curCell>=n) curCell=0;
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${cols},var(--cw))`;
  g.innerHTML=CELLS.map((c,i)=>
    `<div class="cell empty${i===curCell?' cur':''}${i<cols?' row1':''}" id="cell${i}" data-cell="${i}">點一下選商品</div>`).join('');
  document.getElementById('ginfo').textContent=`${n} 格`;
  CELLS.forEach((c,i)=>renderOne(i));
  renderLayers();
}

let picked = new Set();   // 選中的商品，存 SKU

/* 舊檔的 picked 存的是「第幾列」。商品目錄一改（多一列、換順序）那個數字就會
   指到別的商品 —— 而且不會報錯，只會默默挑錯貨。所以改存 SKU，那是商品的真名。
   讀到數字就照當下的目錄換算一次，之後存下去的就都是 SKU 了。 */
function toSkus(list){
  const out = new Set();
  (list||[]).forEach(v=>{
    if(typeof v === 'number'){ const r = ROWS[v]; if(r) out.add(r.sku); }
    else if(v != null) out.add(String(v));
  });
  return out;
}
let q = '';
const $=s=>document.querySelector(s);

/* 參數平常從網址來（?ui=stage&cell=…）。單檔版把這一頁整個塞進 srcdoc，
   那時候 location 是 about:srcdoc、沒有 query，所以上層改成先塞一個
   window.__PICK_PARAMS 進來 —— 兩種載入方式都走這一行。 */
const PICK_Q = new URLSearchParams(window.__PICK_PARAMS || location.search);

/* ====== 身分：design = 只排版；pm = 只帶商品 ======
   由上層頁面決定：載入時寫在網址 ?role=，之後切換用 postMessage 通知。 */
let ROLE = PICK_Q.get('role')==='pm' ? 'pm' : 'design';
/* 只出借面板：被落版嵌在那一格旁邊時，這頁只露出他要用的那一塊面板
   （PM 挑貨、設計 圖層），版面本身在外面那張版上看。 */
const UI_MODE = PICK_Q.get('ui') || '';
const UI_PANEL = UI_MODE==='panel', UI_STAGE = UI_MODE==='stage';
if(UI_PANEL) document.body.classList.add('ui-panel');
if(UI_STAGE) document.body.classList.add('ui-stage');

/* 上層告訴這一格在版上實際多大（cm），座標系照它開。
   回傳有沒有真的變 —— 沒變就不必重排。 */
/* 座標系的**高度永遠是 420**（原版那個框的高），寬度照這一格的長寬比算出來。
   為什麼不是「1cm = 60 單位」那一套：字級照比例算的話，矮格子的座標框會很小
   （0.93cm 高 → 56 單位），於是 SKU 的字級算出來是 1.87 單位 —— 而瀏覽器有
   最小字級（Chrome 約 6px），小於它就被撐回去。撐回去的那幾塊就不再是比例了：
   量到過規格那一塊預估 3.47 單位、實際畫出來 24 單位，右下那一疊因此被推出格子。

   高度固定 420 之後，字級就是原版那些數字本人（52、30、14、12…），
   永遠在瀏覽器畫得出來的範圍內；縮到這一格多大是 --cs 的事（fitStage）。
   這正是原版的做法 —— 它的框永遠 540×420，只有 --cs 在變。 */
/* 換座標系是很貴的一件事（下面 applyStageCm 會把每一塊的座標乘一次、整格重畫），
   所以「形狀真的變了」和「數字抖了一下」一定要分得開。
   上層送來的 cm 現在是照版面的數字算的、對縮放嚴格不變（見 cellCm），所以這條
   死區只要擋得住浮點的最後一位就夠 —— 開太大反而會把真的改動（拉一格、改列數）
   吃掉，而那些是該重排的。 */
const REFRAME_TOL = .005;

function adoptStageCm(w, h){
  w = +w || 0; h = +h || 0;
  if(!w || !h) return false;
  /* 框的長寬比照這一格（版面才填得滿），大小取「兩邊都不小於原版」那一個：
       扁的格子（比 540:420 寬）→ 高度定在 420，寬度照長寬比拉長
       瘦的格子（比 540:420 窄）→ 寬度定在 540，高度照長寬比拉高
     為什麼要兩邊都顧：原版的數字（價格 52、三欄各 168 寬…）是照 540×420 排的。
     只固定高度的話，瘦格子的框只有 279 寬，三個價格並排就爆出右邊界 ——
     那張圖是「44900 被切掉一半」。只固定寬度的話，扁格子換成上下爆。
     取大的那一邊 → 原版的數字永遠放得進去 → 兩個方向都不會溢出。
     剛好是 540:420 的格子兩條算出來一樣，＝ 原版本人（對帳就是拿那個比例驗的）。 */
  const aspect = w / h;
  let nw, nh;
  if(aspect >= O_W / O_H){ nh = O_H; nw = Math.round(O_H * aspect); }
  else                   { nw = O_W; nh = Math.round(O_W / aspect); }
  nw = Math.max(80, nw); nh = Math.max(80, nh);
  if(nw === CW && nh === CH && CM_W) return false;
  /* ⚠️ 縮放不准換座標系。換一次＝每一塊的 x/y/w 乘一次（版面被縮放改掉，而且
     會存下去）＋ renderOne(force) 整格 innerHTML 重寫（商品圖那個 <img> 重生，
     連續滾輪時圖幾乎一直是空的）＋ CM_H 一變字級跟著抖（見 ty()）。
     量到過 60 格的版位滾 12 下＝重建 240 次。
     真正的修法在上層（cellCm 改成照版面的數字算，對縮放嚴格不變）；這裡這條
     只是最後一道，擋浮點的最後一位。真的改了形狀（加減格子）差的是幾十個
     百分點，照樣穿得過去。 */
  if(CM_W && Math.abs(nw - CW) <= CW * REFRAME_TOL
          && Math.abs(nh - CH) <= CH * REFRAME_TOL) return false;
  CM_W = w; CM_H = h; CW = nw; CH = nh;
  return true;
}
adoptStageCm(PICK_Q.get('cmw'), PICK_Q.get('cmh'));
applyMetrics();          // 邊界和字級都是照格子比例算的，座標系一定案就要算

/* 畫布模式：這一格有多大由外面那張版決定，程式照自己的視窗把座標系縮進去。 */
function fitStage(){
  if(!UI_STAGE) return;
  // 進來先不算比例：CH 可能在下面才被算出來，算完再叫 applyMetrics（見結尾）
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  /* 帶了真實尺寸進來就照它 —— CH 已經是那一格自己的高度，不必再從視窗形狀
     反推。沒帶（單獨開這一頁）才退回舊做法：照視窗比例湊一個高度出來。 */
  if(!CM_W) CH = Math.max(160, Math.round(CW * h / w));
  /* 寬高都要進得來，取小的那個比例。本來只看寬度（w/CW），可是上層那一格的
     像素長寬比和 cm 長寬比對不齊時（放大拼板時特別明顯），照寬度撐滿會讓高的
     那一邊溢出下緣 —— 價格貼在最底 5px，正好被 overflow:hidden 裁掉半截。
     取小的就兩邊都不溢；差那一點點讓 #wrap 置中補成兩側等寬的細邊。 */
  const cs = Math.max(.02, Math.min(w / CW, h / CH));
  const r = document.documentElement.style;
  r.setProperty('--cs', cs.toFixed(4));
  r.setProperty('--lw', CW + 'px');
  r.setProperty('--lh', CH + 'px');
  /* 格子正好包住縮完的畫布（不是撐滿整個視窗），#wrap 再把它置中 —— 這樣
     scaleOf（clientWidth/CW）量到的就是真正套上去的 cs，拖曳座標才不會歪。 */
  r.setProperty('--cw', Math.round(CW * cs) + 'px');
  r.setProperty('--ch', Math.round(CH * cs) + 'px');
  applyMetrics();
}

/* 字級是「原版那個數字換算到這一格」，所以只要格子的尺寸或參考格變了，
   就得重算一次。放在一個地方算，不要散在各處 —— 散開就會有一半忘記更新，
   然後畫面上一半元素照新比例、一半照舊比例（這種錯最難看出來）。 */
function applyMetrics(){
  setMargin();           // 邊界本身不跟著尺標變（它是座標單位），但那條紅線要重寫
  const r = document.documentElement.style;
  r.setProperty('--fs-name',  ty(30 * SZ_NAME * TYPE_MUL.name).toFixed(2) + 'px');
  r.setProperty('--fs-model', ty(13 * SZ_MODEL * TYPE_MUL.model).toFixed(2) + 'px');
  r.setProperty('--fs-price', ty(52 * SZ_PRICE).toFixed(2) + 'px');
  r.setProperty('--fs-spec',  ty(14).toFixed(2) + 'px');
  r.setProperty('--h-brand',  ty(26 * SZ_BRAND * TYPE_MUL.brand).toFixed(2) + 'px');
  // 品牌那塊是圖（或圖的預留位）—— 跟商品圖同一個道理，寬度不跟著長寬比拉
  r.setProperty('--bph-w',    ty(120 * SZ_BRAND * TYPE_MUL.brand).toFixed(2) + 'px');
  r.setProperty('--bph-h',    ty(28 * SZ_BRAND * TYPE_MUL.brand).toFixed(2) + 'px');
  r.setProperty('--h-ph',     oy(170).toFixed(2) + 'px');   // 預留圖高度 170/420
  r.setProperty('--sku-fs',   ty(SKU_BASE * SZ_SKU * skuMul()).toFixed(2) + 'px');
  /* 框線／圓角／內距：原版的 1.5、6、2、4、1、8、3 也是在 540×420 裡量的 */
  r.setProperty('--bd',    oy(1.5).toFixed(2) + 'px');
  r.setProperty('--r',     oy(6).toFixed(2) + 'px');
  r.setProperty('--pv',    oy(2).toFixed(2) + 'px');
  /* 內距／圓角走 ty()，不走 ox()：它們是零件自己的裝飾，該跟著字一起變，
     不是跟著格子的寬度變。扁格子的框有四千多寬，ox(4) 會變成 34px 的內距 ——
     於是「看得見的右緣」離邊界 35px，而上下只有 10（量到過）。 */
  r.setProperty('--ph',    ty(4).toFixed(2) + 'px');
  r.setProperty('--sp-v',  oy(1).toFixed(2) + 'px');
  r.setProperty('--sp-h',  ty(8).toFixed(2) + 'px');
  r.setProperty('--sp-mb', oy(3).toFixed(2) + 'px');
}
/* 這一格被拉寬拉高＝版面的形狀變了，要重排一次：靠下的那一疊得重新找到底在哪。
   （本來這裡叫的是 paint()，但那是 renderOne 裡面的區域變數，外面根本看不到 ——
   一縮放就 ReferenceError。改叫 renderOne 自己重畫。） */
let fitTimer = 0;
if(UI_STAGE) addEventListener('resize', () => {
  const was = CW + 'x' + CH;
  fitStage();
  /* 座標系沒換＝這一趟只是縮放。--cs 是 transform（見 .cstage），底下的排版
     用的又都是 offsetTop/offsetWidth 這種版面單位，量出來的東西一個都不會變 ——
     重排一次的唯一效果就是把 innerHTML 重寫一遍，商品圖跟著閃一下。
     （拼板上滾一格 = resize 一次，所以這條路是「縮放時圖一直是空的」的另一半。） */
  if(CM_W && CW + 'x' + CH === was){
    resizeHandles();      // 版面沒動，但 --cs 變了 —— 把手要重新換算螢幕大小
    return;
  }
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { if(BLOCKS.length) renderOne(curCell, true); }, 80);
});

/* 上層說這一格的實際尺寸換了（列數變了、刊頭大小改了）：換座標系再重排一次。
   座標系換了尺標，已經擺好的零件要照同一個比例跟著走 —— 自動排的那些下面
   會重排看不出來，但手動搬過的位置不跟著換就整個跑掉。
   BLOCKS 和 cell().blocks 常常是同一個陣列，所以記下處理過的，別縮兩次。 */
function applyStageCm(cm){
  const pw = CW, ph = CH;
  const firstCm = !CM_W;
  if(!cm || !adoptStageCm(cm.w, cm.h)) return;
  /* 尺寸是現在才第一次拿到的，而手上這份座標還是舊的（restoreBoard 當時沒得換算）
     —— 補做那一次換算，然後才輪到下面的等比例調整。 */
  if(firstCm && !COORDS_V4 && CM_W && CM_H){
    const kx = CW / (CM_W * U_PER_CM), ky = CH / (CM_H * U_PER_CM);
    if(isFinite(kx) && isFinite(ky) && kx > 0 && ky > 0){
      const seen = new Set();
      const conv = arr => {
        if(!arr || seen.has(arr)) return;
        seen.add(arr);
        arr.forEach(b => { b.x=(+b.x||0)*kx; b.y=(+b.y||0)*ky; if(b.w) b.w=(+b.w||0)*kx; delete b.w2; });
      };
      CELLS.forEach(c => conv(c.blocks));
      conv(BLOCKS);
      COORDS_V4 = true;
      saveCell();
      if(BLOCKS.length) renderOne(curCell, true);
      return;                 // 這一輪已經換算＋重畫了，不要再走下面的等比例調整
    }
  }
  /* 兩軸要各自換算。本來只乘寬度的比例（k = CW/prev），因為那時候框是 cm×60，
     寬高一定同時等比例變。現在框的高和寬是各自算的（見 adoptStageCm）——
     只換算寬度的話，格子形狀一變，整份版面就留在舊的高度尺標裡：
     量到過價格停在 49.7% 高、整格內容擠在上半部，而框已經是 813 高了。 */
  const kx = pw ? CW / pw : 1, ky = ph ? CH / ph : 1;
  if(kx !== 1 || ky !== 1){
    const seen = new Set();
    const scale = arr => {
      if(!arr || seen.has(arr)) return;
      seen.add(arr);
      arr.forEach(b => {
        b.x = (+b.x || 0) * kx;
        b.y = (+b.y || 0) * ky;
        if(b.w) b.w = (+b.w || 0) * kx;      // 商品圖的寬也在同一套尺標裡
      });
    };
    CELLS.forEach(c => scale(c.blocks));
    scale(BLOCKS);
  }
  fitStage();
  if(BLOCKS.length) renderOne(curCell, true);
}

/* 把右緣錨點換成絕對座標。右下那一組是用 rx（離右邊界多遠）擺的，直接改 b.x
   根本沒人在看，放手後會跳回右邊界。拖曳和集體移動都要先過這一手，所以放在頂層。 */
function unpin(b){
  if(!b || b.rx == null) return;
  const n = bEl(b.id);
  b.x = n ? n.offsetLeft : (CW - MARGIN - (+b.rx||0));
  delete b.rx;
}

/* ---- 集體移動的預覽 -----------------------------------------------------
   拖的過程只改 style（transform），**不動資料也不重建** —— 重建一次要重排、重量、
   重畫，一格就頓，六十格就是投影片。放手才寫進座標（applyBulkMove）。
   這是 editor(6).html 那支的做法：「過程中只改 style，不重建」。 */
function clearBulkPreview(){
  document.querySelectorAll('.blk[data-bprev]').forEach(n=>{
    n.style.transform=''; n.removeAttribute('data-bprev');
  });
}
function showBulkPreview(keys, dxU, dyU, except){
  clearBulkPreview();
  if(!keys || !keys.length) return;
  const skip = except || [];
  matchKeys(keys).filter(b => skip.indexOf(b.id) < 0).forEach(b => {
    const n = bEl(b.id); if(!n) return;
    n.style.transform = 'translate(' + dxU.toFixed(1) + 'px,' + dyU.toFixed(1) + 'px)';
    n.setAttribute('data-bprev','1');
  });
}
/** 上層轉來的集體移動：這一格所有同一種零件走同樣的**實際距離**。
    照 mm 換算回自己的座標單位 —— 每一格的尺標不一樣，照單位搬會參差不齊。
    走完照樣夾在格子裡（clampAll），所以某一格擠不下時它就停在邊上，
    不會被推出去看不見。 */
function applyBulkMove(m, except){
  if(!m || !m.keys || !m.keys.length) return;
  const per = unitsPerCm(); if(!(per > 0)) return;
  const dx = (+m.dxMm || 0) / 10 * per, dy = (+m.dyMm || 0) / 10 * per;
  if(!dx && !dy) return;
  const hit = matchKeys(m.keys).filter(b => (except||[]).indexOf(b.id) < 0);
  if(!hit.length) return;
  /* 先量再搬：墨水框的 w/h/ox/oy 跟位置無關，所以搬之前量到的一樣能用，
     而 clampAll 沒有 sizes 會直接 return（＝完全沒夾到）。 */
  const sizes = {};
  hit.forEach(b => { try{ sizes[b.id] = inkBox(b.id); }catch(_){} });
  hit.forEach(b => { unpin(b); b.x = (+b.x||0) + dx; b.y = (+b.y||0) + dy; holdPlace(b); });
  try{ clampAll(hit.map(b=>b.id), sizes); }catch(_){}
  saveCell();
  renderCell();
}

/* 面板模式：滾輪在面板上任何地方都是捲名單 — 不必先把游標移到捲軸上，
   也不會漏給外面那張版。 */
if(UI_PANEL) addEventListener('wheel', e => {
  const scrollable = el => el && el.scrollHeight > el.clientHeight;
  // 游標正在哪份名單上就捲哪一份；不在名單上，就捲這塊面板裡捲得動的那一份
  const under = e.target.closest ? e.target.closest('.pbody, #lay .side-bd') : null;
  const pane = scrollable(under) ? under
    : [...document.querySelectorAll('.pbody, #lay .side-bd')]
        .find(el => el.offsetParent && scrollable(el));
  if(pane) pane.scrollTop += e.deltaY;        // 一律自己捲：交給瀏覽器就會漏出去
  e.preventDefault();                         // 沒得捲也別傳出去
}, { passive:false });

function applyRole(r){
  ROLE = r;
  document.body.classList.toggle('role-pm', r==='pm');
  document.body.classList.toggle('role-design', r==='design');
  if(r==='design'){                     // 設計 手上不該留著任何新增入口
    document.getElementById('side').classList.remove('on');
    if(!UI_PANEL) document.getElementById('panel').classList.remove('on');
  }
  if(r==='pm' && !UI_PANEL) document.getElementById('lay').classList.remove('on');
  if(UI_PANEL) openPanels(true);        // 這個模式下面板就是全部，永遠開著
}
/* 版上正在編輯的是不是我這一格。只有那一格摸得到（其餘的 pointer-events 是關的），
   所以工具列和「刪掉的」那顆 ＋ 也只有那一格該露出來 —— 面板一關就把選取清掉，
   不然那條工具列會一直浮在版上，看起來像那一格還開著。
   單獨開這一頁（不是拼板裡的畫布）沒有人會講，所以預設就是開著的。 */
let STAGE_EDIT = !UI_STAGE || window.parent === window;
function applyStageEditing(id){
  const on = String(id||'') === String(CELL_ID);
  /* ⚠️ 不是這一格的話，選取一定要收掉 —— 不能只看 STAGE_EDIT 有沒有變。
     版上任何一格都直接點得到零件（不必先開那一格），所以「從來沒開過」的格子
     照樣可能留著一個藍框和四顆把手；只比 STAGE_EDIT 的話它永遠等不到清除，
     關掉面板之後那個框就一直留在版上。 */
  const stale = !on && (selected.size || activeImg);
  if(on === STAGE_EDIT && !stale) return;
  STAGE_EDIT = on;
  if(!on){ selected.clear(); activeImg=null; }
  renderCell();                 // 重畫會順手把工具列和 ＋ 一起重算
}

/* 把選取收起來。上層要匯出乾淨版之前會對每一格喊一次 —— 選取的藍框和那幾顆
   把手是螢幕上的東西，印出來的版面上不該有。
   為什麼不走 applyStageEditing('')：沒開著的那一格 STAGE_EDIT 本來就是 false，
   那支會直接 return，選取留在原地。而選取在哪一格都做得出來（每一格的畫布都
   收得到滑鼠，見拼板那邊 .ccanvas 的 pointer-events），所以要一支專門的。 */
function clearStageSel(){
  if(!selected.size && !activeImg) return;
  selected.clear(); activeImg=null;
  renderCell();
}

addEventListener('message',e=>{
  const d = e.data || {};
  if(d.boardRole==='pm'||d.boardRole==='design') applyRole(d.boardRole);
  /* 這一格的底色。只改一個 CSS 變數，不重畫任何東西 —— 零件座標跟顏色無關。 */
  if(d.paper !== undefined)
    document.documentElement.style.setProperty('--paper', d.paper || '#fff');
  /* 尺寸要在 restoreBoard 之前收 —— 舊檔的座標換算是拿 CW 去算的，
     CW 還停在預設值的話就會照錯的比例縮。 */
  if(d.stageCm) applyStageCm(d.stageCm);
  if(d.stageScale){ STAGE_SCALE = +d.stageScale || 1; resizeHandles();
    document.documentElement.style.setProperty('--ss', STAGE_SCALE.toFixed(4)); }
  /* 上層轉過來的 Delete：焦點停在上層那一頁（例如剛把貼紙拖進來）時，
     這一格收不到鍵盤，上層認得出選取在哪一格，就轉給那一格。 */
  if(d.stageDelete) keyDelete();
  /* 開關集體移動＝已經選起來的那幾塊要換個顏色（藍↔紅），所以要重畫。
     沒有選取就什麼都不必動。 */
  if(d.bulkMode !== undefined){
    const was = BULK_MOVE; BULK_MOVE = !!d.bulkMode;
    if(was !== BULK_MOVE && selected.size) renderCell();
  }
  if(d.bulkPreview){
    const per = unitsPerCm();
    if(per > 0) showBulkPreview(d.bulkPreview.keys,
      (+d.bulkPreview.dxMm||0)/10*per, (+d.bulkPreview.dyMm||0)/10*per);
  }
  if(d.bulkPreviewEnd) clearBulkPreview();
  if(d.bulkApply){ clearBulkPreview(); applyBulkMove(d.bulkApply); }
  if(d.stageEditing !== undefined) applyStageEditing(d.stageEditing);
  if(d.stageClearSel) clearStageSel();      // 上層要印乾淨版了，把選取收起來
  if(d.stageSnapshot) snapshotStage(d.stageSnapshot);   // 上層要這一格的點陣圖
  /* 上層的手正放在邊界那條拉桿上 → 把紅線亮出來。純 CSS，不重畫任何東西。 */
  if(d.marginGuide !== undefined) document.body.classList.toggle('padding', !!d.marginGuide);
  /* 工具列那顆「顯示格線」：開＝一直看得到，關＝一直看不到。它不再跟拖曳綁在一起，
     所以按下去的當下就要重畫，不然要等下一次動到版面才看得到。 */
  if(d.gridLines !== undefined){
    const g = !!d.gridLines;
    if(g !== SHOW_GRID){ SHOW_GRID = g; setTimeout(()=>{ try{ renderCell(); }catch(_){} },0); }
  }
  if(d.type) applyType(d.type);          // 這個版位的字級設定（SKU、價格）
  if(d.addSticker) addStickerBlock(d.addSticker);   // 拼板 那顆「貼圖」工具點了這一格
  /* 共用的商品目錄要在 restoreBoard 之前收：picked 存的是 SKU，目錄還是內建的
     那份時對不上，畫布會整格空掉。 */
  if(d.catalogue) applyCatalogue(d.catalogue);
  if(d.logos) applyLogos(d.logos);
  /* 上層把這一格上次拼到哪裡送回來（restoreBoard 定義在下面，執行時才會用到）。
     收完就回報「我畫好了」（那一句還會等圖和字型，見 tellPainted）——
     上層那張蓋布是照這一句掀的。
     ⚠️ 空的那一格（boardRestore 是 null）也要回報：restoreBoard 會直接 return，
     不報的話那一格會被蓋到 6 秒的保險才掀開，而它根本沒有東西要等。 */
  if(d.boardRestore !== undefined){ restoreBoard(d.boardRestore); tellPainted(); }
  // 旁邊那塊面板剛剛勾了什麼 — 畫布照著重排（挑了什麼是面板說了算）
  if(d.boardPicked) applyPicked(d.boardPicked);
  // 面板那邊按了「刪掉」— uid 兩邊算出來是同一個，所以指名就認得出是哪一塊
  if(d.boardOff) applyOff(d.boardOff);
  /* 圖層那一排：畫布報的那一份（面板照它畫），和面板按下去轉回來的那一下（畫布照做）。 */
  if(d.stageLayers && UI_PANEL){
    STAGE_LAYERS=d.stageLayers; STAGE_ACTIVE=d.activeLayer||'';
    renderLayers();
  }
  if(d.layerAct && UI_STAGE) applyLayerAct(d.layerAct);
  /* 別的地方（別一格的畫布、商品目錄那一頁）換了某一個商品的圖。
     只補這一把鑰匙、只重畫用得到它的格 —— 這正是不走整包 catalogue 的理由：
     那條路會把每一格的 layoutKey 清掉重排一次。 */
  if(d.imgPatch){
    const k = d.imgPatch.key, u = d.imgPatch.url || '';
    if(k){
      if(u) IMG[k] = u;
      else if(IMG[k]) delete IMG[k];
      else delete IMG[imgKeyBase(k)];
      repaintImgKey(k);
    }
  }
  // 上層把剛剛那張圖傳完了（或失敗了）
  if(d.imgUploaded){
    const w = imgWaiting.get(d.imgUploaded.reqId);
    if(w){
      imgWaiting.delete(d.imgUploaded.reqId);
      d.imgUploaded.error ? w.no(new Error(d.imgUploaded.error)) : w.ok(d.imgUploaded.url);
    }
  }
});

/* ====== 把 PNG 拖到灰方塊上就換圖 ======
   圖不留在這一頁：縮好之後交給上層傳去 Storage，換回一串網址才存下來。
   金鑰只有上層有 —— 單檔版這一頁是 srcdoc 塞進去的，不該碰到它。 */

const IMG_MAX_PX = 900;   // 版面上最大也才幾百 px，再大只是白佔頻寬

let sayTimer = 0;
function say(msg){
  const el = document.getElementById('imgsay');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(()=>el.classList.remove('on'), 2400);
}

/* 縮圖出 WebP：商品圖常常是去背的，所以不能轉 JPEG（那會給它一塊白底），
   但 PNG 存照片會胖上好幾倍 —— WebP 兩件事都做得到：留得住透明，又小。
   老瀏覽器的 toBlob 給不出 WebP 就退回 PNG，副檔名照回傳的 blob.type 決定。
   **回傳 Blob，不是 dataURL**：這一份要 postMessage 給上層，base64 先胖三分之一，
   上層還得再 fetch() 解回二進位 —— Blob 本來就傳得過去（structured clone）。
   壓完比原檔還大就用原檔：去背的小 PNG 常常是這樣（重壓一次只是變糊又變大）。 */
function shrinkImage(file){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onerror=()=>no(new Error('讀不到這個檔案'));
    fr.onload=()=>{
      const im=new Image();
      /* 最常見的一種是 iPhone 的 HEIC：檔名寫著 .jpg、type 也報 image/jpeg，
         但瀏覽器畫不出來 —— 所以要指名，不然看到的只是「不是看得懂的圖」，
         而檔案總管裡那個檔看起來明明就是一張 jpg。 */
      im.onerror=()=>no(new Error('瀏覽器畫不出這個檔案（iPhone 的 HEIC 常常這樣，副檔名還是寫 .jpg）—— 請先另存成 PNG 或 JPG'));
      im.onload=()=>{
        const k=Math.min(1, IMG_MAX_PX/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.width*k));
        cv.height=Math.max(1,Math.round(im.height*k));
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const take=b=>{
          if(!b) return no(new Error('這個檔案壓不下來'));
          ok(b.size < file.size ? b : file);
        };
        cv.toBlob(b=>{ b ? take(b) : cv.toBlob(take,'image/png'); }, 'image/webp', .92);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const imgExt = blob => blob && blob.type==='image/webp' ? '.webp'
                     : blob && blob.type==='image/jpeg' ? '.jpg' : '.png';

let imgReqN = 0;
const imgWaiting = new Map();
/* name 不帶副檔名 —— 副檔名是壓完才知道的（見 shrinkImage），由這裡接上去。 */
function askUpload(name, blob){
  return new Promise((ok,no)=>{
    if(window.parent===window) return no(new Error('單獨開這一頁沒有地方可以存'));
    const reqId = 'u'+(++imgReqN);
    imgWaiting.set(reqId,{ok,no});
    try{ parent.postMessage({ boardCell:CELL_ID,
                             imgUpload:{ reqId, name: name + imgExt(blob), blob } }, '*'); }
    catch(err){ imgWaiting.delete(reqId); return no(err); }
    setTimeout(()=>{
      if(imgWaiting.has(reqId)){ imgWaiting.delete(reqId); no(new Error('上傳等太久了')); }
    }, 30000);
  });
}

/* 品牌 logo 走另一個庫（logo_page 那個 Supabase），所以是另一句話 ——
   回覆共用 imgUploaded 那條路：等的是同一件事（傳完了沒、網址是什麼）。 */
function askLogoUpload(brand, blob, fileName){
  return new Promise((ok,no)=>{
    if(window.parent===window) return no(new Error('單獨開這一頁沒有地方可以存'));
    const reqId = 'u'+(++imgReqN);
    imgWaiting.set(reqId,{ok,no});
    try{ parent.postMessage({ boardCell:CELL_ID,
                             logoUpload:{ reqId, brand, name: fileName, blob } }, '*'); }
    catch(err){ imgWaiting.delete(reqId); return no(err); }
    setTimeout(()=>{
      if(imgWaiting.has(reqId)){ imgWaiting.delete(reqId); no(new Error('上傳等太久了')); }
    }, 30000);
  });
}

/* 一列一個落點（後台那兩排：品牌圖、商品圖）。
   **整支程式都不開檔案視窗了**，所以每一個「可以放圖的地方」都得自己接得住拖曳 ——
   以前那幾顆「上傳」是點一下開檔案總管，那個手勢只講得出「一個檔案」，
   講不出「哪一張」，手一滑就換掉了別的東西。
   只認從桌面拖進來的**檔案**（types 裡有 Files），不然拖一塊零件經過也會亮起來。 */
function dropRow(el, then){
  el.addEventListener('dragover', e=>{
    if(![...(e.dataTransfer.types||[])].includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    el.classList.add('dragover');
  });
  ['dragleave','drop'].forEach(t=>el.addEventListener(t, ()=>el.classList.remove('dragover')));
  el.addEventListener('drop', e=>{
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if(!f) return;
    e.preventDefault();
    e.stopPropagation();
    then(f);
  });
}

/* 可以放圖的零件有兩種：商品圖和品牌 logo。兩個落點長得一樣（拖進來、亮起來、
   放手就換），去處不一樣 —— 商品圖進共用目錄，logo 進品牌 Logo 庫。 */
const imgBlkAt = t => (t && t.closest) ? t.closest('.blk.img, .blk.brand') : null;
let dropHot = null;
function markDrop(el){
  if(dropHot===el) return;
  if(dropHot) dropHot.classList.remove('imgdrop');
  dropHot = el;
  if(el) el.classList.add('imgdrop');
}

addEventListener('dragover', e=>{
  const el = imgBlkAt(e.target);
  if(!el){ markDrop(null); return; }
  /* 圖層本身是可以拖著搬的，所以只有「從桌面拖檔案進來」才算換圖 */
  if(![...(e.dataTransfer.types||[])].includes('Files')){ markDrop(null); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  markDrop(el);
});
addEventListener('dragleave', e=>{ if(!e.relatedTarget) markDrop(null); });

addEventListener('drop', async e=>{
  const el = imgBlkAt(e.target);
  if(!el || !e.dataTransfer.files.length) return;
  e.preventDefault();
  markDrop(null);

  const b = BLOCKS.find(x=>String(x.id)===el.dataset.b);
  if(!b) return;
  if(b.kind==='brand') putLogo(b, e.dataTransfer.files[0], el);
  else putProductImage(b.key, e.dataTransfer.files[0], el);
});

/* 放一張圖進去＝換掉**這個商品**的圖，存進共用目錄（IMG），不是存進這一格。
   以前拖進來的圖寫在 cellImgs() 上，於是同一支商品在別格、別本 DM 還是一個灰框，
   而且那一格的 override 會一直贏過後來補上的正確答案 —— 有人幫它補了圖，
   最早拖過圖的那一格永遠看不到，看起來像「換不動」。
   ⚠️ 換的是**這一把鑰匙**（品名|規格|顏色|SKU），不是同名的每一列：
   同一個商品名底下 256G 黑 和 512G 橘 本來就是兩張不同的照片。 */
async function putProductImage(key, file, el){
  if(!file) return;
  if(!/^image\//.test(file.type)){ say('只收圖片檔'); return; }
  if(el) el.classList.add('imgbusy');
  say('傳圖中…');
  try{
    const url = await askUpload('item-'+key, await shrinkImage(file));
    /* 這一格自己換過的那張會贏過目錄（見 imgUrlOf）—— 不清掉的話畫面上不會變，
       而剛剛那個人要的就是他手上這一張。 */
    const c = cellImgs();
    delete c[key]; delete c[imgKeyBase(key)];
    saveCell();
    setProductImg(key, url);
    reportBoard();         // 這一格的 img override 少了一筆，要存回檔期
    say('換好了');
  }catch(err){
    say(String(err && err.message || err));
  }finally{
    if(el) el.classList.remove('imgbusy');
  }
}

/* 品牌圖走的是整包目錄那條路，不是上面那個「只補一把鑰匙」的近路 ——
   **品牌圖的有無會改變左上那一疊的落點**（有品牌圖，品名要往下讓一行，
   見 buildBlocks 的 hasBrand），所以每一格都得重排一次，而那正是 reportCatalogue
   → applyCatalogue 做的事。商品圖換一張不動任何位置，才有近路可以走。 */
async function putBrandImage(name, file, el){
  if(!file) return;
  if(!/^image\//.test(file.type)){ say('只收圖片檔'); return; }
  if(el) el.classList.add('imgbusy');
  say('傳圖中…');
  try{
    BIMG[name] = await askUpload('brand-'+name, await shrinkImage(file));
    refreshAll();
    reportCatalogue();
    say('換好了');
  }catch(err){
    say(String(err && err.message || err));
  }finally{
    if(el) el.classList.remove('imgbusy');
  }
}

/* 拖到左上那張 logo 上＝換掉**這個品牌**的 logo，而且是換進品牌 Logo 庫裡那一張。
   為什麼不是存在這一格、也不是存進商品目錄：Logo 庫才是「這個牌子長什麼樣」的
   正確答案（見 CLAUDE.md 那三個庫）—— 存在別的地方的話，同一個牌子在別格、
   別本 DM 還是舊的那張，下一個人再換一次，而兩張都還在庫外面。
   上傳由上層做（金鑰在那邊），換完上層會把新的那一份發給每一塊畫布。 */
async function putLogo(b, file, el){
  if(!file) return;
  if(!/^image\//.test(file.type)){ say('只收圖片檔'); return; }
  const brand = (b.brand != null ? b.brand : (BRAND[b.name]||'')) || rowBrand(b.row);
  if(!brand){ say('這一格沒有品牌名，先去商品目錄填上'); return; }
  if(el) el.classList.add('imgbusy');
  say('傳圖中…');
  try{
    await askLogoUpload(brand, await shrinkImage(file), file.name);
    /* 有人以前照品牌名（或商品名）手動傳過一張的話，那一張排在庫前面（見 bimgOf）——
       不清掉的話剛剛拖進去的那張永遠看不到，看起來像「換不動」。 */
    const manual = BIMG[brand] ? brand : (BIMG[b.name] ? b.name : '');
    if(manual){ delete BIMG[manual]; reportCatalogue(); }
    say('換好了 —— Logo 庫裡那一張也換了');
  }catch(err){
    say(String(err && err.message || err));
  }finally{
    if(el) el.classList.remove('imgbusy');
  }
}

/* 目錄裡那一格換掉，然後只重畫用得到它的那幾格。
   **不走 reportCatalogue()**：那會把整份目錄（幾千列）往上丟，上層整包寫回資料庫、
   再發給每一塊畫布，每一塊又把每一格的 layoutKey 清掉重排一次 —— 為了一串網址。
   換成一句 catalogueImg：上層只補那一個 key，再原樣轉給其他畫布。 */
function setProductImg(key, url){
  if(url) IMG[key] = url;
  /* 清除的時候：這一列自己那張沒有的話，畫面上看到的是舊鑰匙底下那一張共用的。 */
  else if(IMG[key]) delete IMG[key];
  else delete IMG[imgKeyBase(key)];
  repaintImgKey(key);
  if(window.parent !== window)
    try{ parent.postMessage({ boardCell:CELL_ID, catalogueImg:{ key, url: url||'' } }, '*'); }catch(_){}
}

/* 只有那幾張圖要換，版面一個 px 都沒動 —— 所以 renderOne 不帶 force：
   layoutKey 沒變它就只是照現成的零件重畫一次 HTML，不會重排。 */
function repaintImgKey(key){
  const base = imgKeyBase(key);
  CELLS.forEach((c,i)=>{
    const bs = (i===curCell ? BLOCKS : c.blocks) || [];
    if(bs.some(b=>b.kind==='img' && (b.key===key || imgKeyBase(b.key)===base))) renderOne(i);
  });
}

/* ====== 共用商品目錄 ======
   目錄是全公司一份，存在上層那邊（上層才有連線的金鑰）。這一頁只負責：
   收到就換掉、改到就往上報。上層沒給（單獨開這一頁、或還沒接後端）就繼續用
   檔案裡寫死的那份，跟以前一模一樣。 */
/* 品牌 Logo 庫換了一份就每一格重畫一次 HTML，**但不重排**：品牌圖是畫的時候
   才查的（blockBimg），零件的位置一個都不用動。
   以前這裡是清掉 layoutKey 整批重建 —— 那會把使用者搬過的零件位置全部洗掉，
   只為了換一張圖；而且重建出來的那一份又把新網址存進 b.bimg，下一次還是舊的。 */
function applyLogos(map){
  if(!map || typeof map !== 'object') return;
  const before = JSON.stringify(LOGOS||null), now = JSON.stringify(map);
  if(before === now) return;                 // 沒變就別重畫（每次掛上來都會送一次）
  LOGOS = map;
  CELLS.forEach((c,i)=>renderOne(i));        // 不帶 force：layoutKey 沒變就只重畫
}

function applyCatalogue(cat){
  if(!cat || !Array.isArray(cat.rows) || !cat.rows.length) return;
  /* cat／brand／model 一定要帶著走。少抄一個欄位，這一頁就會把商品目錄那一頁
     存好的類別和品牌整批洗掉 —— 因為 catalogueNow() 是照 ROWS 重新序列化的，
     讀進來時掉的欄位，寫回去就真的不見了（而那是全公司共用的一列）。 */
  ROWS  = cat.rows.map(r=>({name:r.name,spec:r.spec,color:r.color,sku:String(r.sku),
                            price:+r.price||0, cat:r.cat||'', brand:r.brand||'', model:r.model||''}));
  if(cat.model) MODEL = cat.model;
  if(cat.brand) BRAND = cat.brand;
  if(cat.bimg)  BIMG  = cat.bimg;
  if(cat.img)   IMG   = cat.img;
  /* 每一格都要重排，不是只有正在看的那一格 —— 每個格子各自記著自己的 layoutKey，
     只清掉模組上那一份的話，其他格會繼續顯示改名前的品名。 */
  layoutKey = '';
  CELLS.forEach(c=>{ c.layoutKey = ''; });
  saveCell();
  refreshAll();
}

/** 現在的目錄長什麼樣 —— 往上報就是報這一包。
    img（後台上傳的商品圖）也在裡面：它跟品牌圖一樣是「這個商品長什麼樣」，
    不屬於任何一格。以前漏掉它，於是後台上傳完看得到、重整就沒了。
    存的都是 Storage 網址，不是圖本身。 */
function catalogueNow(){
  return { rows: ROWS.map(r=>({name:r.name,spec:r.spec,color:r.color,sku:r.sku,price:r.price,
                              cat:r.cat||'', brand:r.brand||'', model:r.model||''})),
           model: MODEL, brand: BRAND, bimg: BIMG, img: IMG };
}

/* 後台動過目錄就往上報。跟 reportBoard 一樣壓一下：改一個字會觸發很多次。 */
let catTimer = 0;
function reportCatalogue(){
  if(window.parent === window) return;
  clearTimeout(catTimer);
  catTimer = setTimeout(()=>{
    try{ parent.postMessage({ boardCell:CELL_ID, catalogueSave: catalogueNow() }, '*'); }catch(_){}
  }, 250);
}

/** 只換「挑了哪些」，位置讓 buildBlocks 重新排一次。 */
function applyPicked(list){
  const want = toSkus(list);
  const next = [...want].sort().join(',');
  if(next === sig()) return;
  picked = want;
  layoutKey = '';                       // 逼它重排
  saveCell();
  selected.clear();
  refreshAll();
}

/* ====== 核心合併：同 spec 同 price → SKU 合併；價不同 → 各自一欄 ====== */
/* 價格是唯一的分欄依據。
   同價 → 同一欄，不管規格是否相同；欄內再依規格分行列出各自的 SKU。
   價格不同 → 各自一欄（左 / 左中右）。 */
function buildCols(rows){
  const byPrice=new Map();
  for(const v of rows){
    if(!byPrice.has(v.price)) byPrice.set(v.price,new Map());
    const bySpec=byPrice.get(v.price);
    if(!bySpec.has(v.spec)) bySpec.set(v.spec,[]);
    bySpec.get(v.spec).push(v);
  }
  return [...byPrice.entries()].map(([price,bySpec])=>({
    price, lines:[...bySpec.entries()].map(([spec,vs])=>({spec,vs}))
  }));
}
/* SKU 串規則：
   1. 只有一筆 → 不寫顏色，只寫完整 SKU。
   2. 多筆 → 第一筆完整，其後只留尾碼，顏色貼在各自 SKU 之後。
   3. 連號且該段皆無顏色 → 併成範圍：2000041/42/43 → 2000041-43
      （有顏色的不併，否則顏色對應會遺失。） */
function skuLine(vs){
  if(vs.length===1) return 'SKU：'+vs[0].sku;

  const skus=vs.map(v=>v.sku);
  let pre=skus[0];
  for(const t of skus.slice(1)){let i=0;while(i<pre.length&&pre[i]===t[i])i++;pre=pre.slice(0,i)}
  const usePre = pre.length>=3;
  const tail=(v,i)=>{
    if(i===0||!usePre) return v.sku;
    const t=v.sku.slice(pre.length);
    return t.length<2 ? v.sku.slice(-2) : t;   // 尾碼至少 2 位
  };

  const parts=[];
  let i=0;
  while(i<vs.length){
    // 找連號且無顏色的一段
    let j=i;
    while(j+1<vs.length && !vs[j].color && !vs[j+1].color &&
          vs[j+1].sku.length===vs[j].sku.length &&
          (+vs[j+1].sku)===(+vs[j].sku)+1) j++;
    if(j-i>=2){                       // 至少三筆才值得用 -
      const a=tail(vs[i],i);
      // 結尾用去掉共同前綴的尾碼，但至少留 2 位，避免出現 2000041-3
      let b = usePre ? vs[j].sku.slice(pre.length) : vs[j].sku;
      if(b.length<2) b = vs[j].sku.slice(-2);
      parts.push(a+'-'+b);
    }else{
      for(let k=i;k<=j;k++) parts.push(tail(vs[k],k)+(vs[k].color||''));
      j=i>j?i:j;
    }
    i=j+1;
  }
  return 'SKU：'+parts.join('/');
}

/* ====== 版面：每個元素 = 一個可自由移動的 block ======
   block.kind: name | img | sku | price
   sku block 帶 vs（該塊包含哪些 row），拖曳合併就是把兩塊的 vs 併起來。
   pos 以格子左上為原點，px。 */
/* 每個選項各自一張圖：key = 名稱|規格|顏色〔|誰是誰〕
   ------------------------------------------------------------------------
   ⚠️ **前三段一個字都不能動**。已經上傳的圖、每一格自己換過的圖（cell.img）、
   藏起來的零件（cell.off，uid 是 `img|`＋這把鑰匙算出來的）全都存著這個字串。
   改了前三段＝舊檔期一開起來圖全部不見、藏起來的零件全部跑回來，而且不報錯。
   所以要加的東西只能**往後接，而且只在本來就會撞在一起的時候接**。

   第四段回答「同名、同規格、同顏色的那幾列，誰是誰」。公司很多品類根本沒有
   規格和顏色欄 —— 空調就是：
     空調,HITACHI,變頻冷暖空調,RAC-28NP1/RAS-28NJP1
     空調,HITACHI,變頻冷暖空調,RAC-36NP1/RAS-36NJP1
   前三段算出來三支一模一樣（`變頻冷暖空調||`），於是三支共用一張圖：在商品目錄
   給其中一支放圖，另外兩支跟著變，而版面上看起來就是「這一格三張圖是同一張」。

   用 SKU 當那一段：那本來就是這一列的身分（共用目錄也是照 SKU 合的），一定唯一。
   沒有 SKU 的列才退回列上的型號；兩個都沒有就只好跟以前一樣併在一起 ——
   那時候手上真的沒有東西分得出它們。
   ⚠️ 型號讀的是 `r.model`（列上那一份），不走 rowModel()：對照表那一份是
   「這個商品名的型號」，同名的每一列都一樣，拿它當鑰匙又併回去了。
   ⚠️ product.html 有一份一模一樣的（那一頁載不了共用的 .js —— 畫布是 srcdoc 塞進去的）。
   改這裡就要改那裡：對不起來的時候兩邊都不會報錯，只是圖沒出現。
   有一支在盯：`.claude/skills/run-pm-page/imgkey-parity.mjs`（scenario.mjs 每次都會先跑）。 */
let IMG = {};
function imgKey(r){
  const spec = (r && r.spec) || '', color = (r && r.color) || '';
  const head = ((r && r.name) || '') + '|' + spec + '|' + color;
  if (spec || color) return head;                      // 分得出來了，維持老鑰匙
  const tie = String((r && r.sku) || '').trim() || String((r && r.model) || '').trim();
  return tie ? head + '|' + tie : head;
}
/* 這把鑰匙的前三段 ＝ 這一版之前那把。讀圖的時候要退回去找一次，
   不然所有沒有規格也沒有顏色的商品，圖會在使用者眼前一次全部消失。
   只從字串上切，不必手上有那一列 —— 呼叫的地方有些只有 key。 */
const imgKeyBase = k => String(k).split('|').slice(0, 3).join('|');

/* 圖在哪：這一格自己換過的 > 目錄裡的；新鑰匙 > 舊鑰匙。
   「這一格換過的」永遠排前面 —— 有人特地為這一格換過一張，那就是他要的那一張
   （跟品牌圖那三層同一個道理）。 */
function imgUrlOf(k){
  const c = cellImgs(), o = imgKeyBase(k);
  return c[k] || (o !== k && c[o]) || IMG[k] || (o !== k && IMG[o]) || '';
}
function keyLabel(k){
  const a = String(k).split('|');
  /* 第四段是 SKU 或型號 —— 它就是「這一支跟隔壁那一支差在哪」，
     不寫的話圖庫清單上三支空調會列出三行一模一樣的字。 */
  return a[0] + (a[1] ? '　' + a[1] : '') + (a[2] ? '　' + a[2] : '')
             + (a[3] ? '　' + a[3] : '');
}
let BLOCKS = [];
/* picked 與 BLOCKS 是「目前格」的視圖，切格時同步 */
