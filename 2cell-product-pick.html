<div id="imgsay"></div>

<script>
/* ====== 資料：商品 = name + cat + variants(spec,sku,price) ====== */
/* ====== 後台資料 = 一列一筆，扁平：名稱 / 規格 / SKU / 價格 ======
   不自動分類。相同名稱的列在渲染時「就地成群」（連續同名視為同一商品），
   所以 SKU 相近但名稱不同的列不會被硬併在一起。 */
let ROWS = [
  ['iPhone 17 Pro Max','256G','黑','2156742',44900],
  ['iPhone 17 Pro Max','256G','橘','2156744',44900],
  ['iPhone 17 Pro Max','512G','黑','2156739',51900],
  ['iPhone 17 Pro Max','512G','橘','2156740',51900],
  ['iPhone 17 Pro Max','512G','白','2156745',51900],
  ['iPhone 17 Pro Max','1TB','','2156738',58900],
  ['iPhone 17 Pro Max','1TB','','2156741',58900],
  ['iPhone 17 Pro Max','1TB','','2156724',58900],
  ['iPhone 17 Pro','256G','','2156751',39900],
  ['iPhone 17 Pro','256G','','2156748',39900],
  ['iPhone 17 Pro','512G','','2156749',46900],
  ['iPhone 17 Pro','512G','','2156746',46900],
  ['iPhone 17 Pro','1TB','','2156735',53900],
  ['iPhone 17 Pro','1TB','','2156734',53900],
  ['Galaxy A5','256G 12GB','','2162613',12900],
  ['Galaxy A5','512G 12GB','','2162614',14900],
  ['iPad Air','128G','','2154566',19900],
  ['iPad Air','128G','','2154569',19900],
  ['iPad Air','256G','','2154562',23400],
  ['iPad Air','256G','','2154565',23400],
  ['iPad A16','128G','','2154573',10900],
  ['iPad A16','128G','','2154575',10900],
  ['iPad A16','256G','','2154572',19900],
  ['iPad A16','256G','','2154570',19900],
  ['MacBook Pro','512G','','2158956',52900],
  ['MacBook Pro','512G','','2158957',52900],
  ['MacBook Pro','512G','','2158954',52900],
  ['MacBook Pro','512G','','2158955',52900],
  ['MacBook Neo Air M5','256G','','2162848',22900],
  ['MacBook Neo Air M5','256G','','2162849',22900],
  ['MacBook Neo Air M5','256G','','2162850',22900],
  ['MacBook Neo Air M5','512G','','2162864',35900],
  ['MacBook Neo Air M5','512G','','2162865',35900],
  ['MacBook Neo Air M5','1TB','','2162868',42900],
  ['MacBook Neo Air M5','1TB','','2162869',42900],
  ['AirPods 4','降噪款','','2150080',5490],
  ['AirPods 4','一般款','','2150081',4290],
  ['AirPods Pro 3','標準','','2157982',7490],
  ['ANKER 30W 自帶線行動電源','','白','2157669',1290],
  ['ANKER 30W 自帶線行動電源','','黑','2157670',1290]
].map((r,i)=>({name:r[0],spec:r[1],color:r[2],sku:r[3],price:r[4],_i:i}));

/* 型號：配件/充電器類才有，手機平板通常沒有。以商品名為 key，
   所以同商品的不同顏色與容量共用同一型號。 */
let MODEL = {
  'ANKER 30W 自帶線行動電源':'A1654H21',
  'AirPods Pro 3':'MTJV3',
  'AirPods 4':'',
  'iPhone 17 Pro Max':'',
  'iPhone 17 Pro':'',
  'Galaxy A5':'',
  'iPad Air':'',
  'iPad A16':'',
  'MacBook Pro':'',
  'MacBook Neo Air M5':''
};
function modelOf(n){ return MODEL[n]||''; }

/* 品牌：同商品共用。BRAND 存品牌名，BIMG 存上傳的品牌 PNG(dataURL)。
   沒上傳圖時顯示長方形 placeholder，高度與品牌字級相當。 */
let BRAND = {
  'iPhone 17 Pro Max':'Apple','iPhone 17 Pro':'Apple','iPad Air':'Apple','iPad A16':'Apple',
  'MacBook Pro':'Apple','MacBook Neo Air M5':'Apple','AirPods 4':'Apple','AirPods Pro 3':'Apple',
  'Galaxy A5':'Samsung','ANKER 30W 自帶線行動電源':'ANKER'
};
let BIMG = {};
function brandOf(n){ return BRAND[n]||''; }

/* 品牌圖：有上傳用圖，否則畫長形 placeholder（內嵌，斷網可用） */
function brandHTML(n){
  const b=brandOf(n);
  if(BIMG[n]) return `<img class="bimg" src="${BIMG[n]}" alt="" draggable="false">`;
  return `<span class="bph"><svg viewBox="0 0 120 28" preserveAspectRatio="none">
      <rect x="0.6" y="0.6" width="118.8" height="26.8" rx="4" fill="#f0f2f6"
        stroke="#c9d0dc" stroke-width="1.2" stroke-dasharray="4 3"/>
    </svg><i>${b||'品牌'}</i></span>`;
}

/* 就地成群：連續且同名的列 → 一個商品。名稱不同即斷開。 */
function groups(){
  const out=[];
  for(const r of ROWS){
    const last=out[out.length-1];
    if(last && last.name===r.name) last.rows.push(r);
    else out.push({name:r.name,rows:[r]});
  }
  return out;
}

/* ====== 多格：每一格有自己的 picked / BLOCKS / layoutKey ====== */
let PAD=10;            // 左右的安全邊界(px，排版座標)，由上方 slider 控制
const PAD_Y=10;        // 上下也留 10：左上那疊離上緣 10，右下那疊離下緣 10
const PRICE_BOTTOM=5;  // 價格那一疊例外，離下緣只留 5
/* 排版座標系：1 cm ＝ U_PER_CM 個座標單位，每一格都一樣。

   本來每一格的寬都固定 540，不管它在版上其實多大 —— 於是 cs（= 格子的實際
   像素寬 / CW）每一格都不一樣，寫死的 12px SKU 在窄格子裡被壓成 7px、在寬
   格子裡是 11px。同一個版位裡量到過 34% 的落差，而品名根本沒有任何自動縮放
   邏輯，卻一樣大小不一 —— 那就證明問題出在座標系，不在排版程式。

   改成照真實尺寸開座標系之後 cs = pxPerCm / U_PER_CM，是整個版位的常數，
   寫死的 px 才真的到處一樣大。60 是挑來讓「一列四格」那種常見格子
   （約 9cm 寬）算出來差不多還是 540，舊檔換算過去幅度最小。 */
const U_PER_CM = 60;
const LEGACY_CW = 540;          // 舊檔的座標是照這個寬存的
/* 真正的尺寸是上層用網址參數帶進來的，而 PICK_Q 在下面才宣告 —— 這裡只能先
   放預設值，讀參數要等到 PICK_Q 之後（見 adoptStageCm 的呼叫）。
   在這裡讀 PICK_Q 會 ReferenceError，然後整支程式停在這一行。 */
let CM_W = 0, CM_H = 0;
let CW = LEGACY_CW, CH = 420;

/* ---- 字級：一個版位一套，上層說了算 ------------------------------------
   PRICE_BASE 是價格的基準字級（CSS 裡 .blk.price 就是這個數字）。
   自動縮放只負責「回報這一格需要縮到多少」，真正用哪一個由上層決定 ——
   同一個版位裡同樣價格數的格子要一樣大，那件事只有看得到全部格子的人算得出來。
   PRICE_PX：轉盤指定的絕對大小，蓋過自動縮放，允許溢出（談定的）。
   GROUP_FS：上層收齊同組的需求、取最小之後廣播回來的比例。 */
/* 52 → 64：紅色數字是這張版上最先被看到的東西，本來的預設偏保守。
   這只是「起點」—— 擠不下的時候 autoSpace 照樣會把它縮回去，
   所以調大不會讓任何一格溢出，只會讓有空間的格子把數字放到該有的大小。
   CSS 的 .blk.price 是同一個數字，改這裡要一起改。 */
const PRICE_BASE = 64;
let SKU_FS = 12;
let PRICE_PX = 0;
let GROUP_FS = 0;
let priceWanted = 1;            // 這一格自己算出來、剛好裝得下的比例
/** 這一格有幾個價格 —— 分組就是照這個分的。
    藏起來的不算：版上看不到的價格不該把這一格拖進「三個價格」那一組，
    不然它會照別人的字級縮，而且會把同組其他格子一起帶偏。 */
function priceCount(bs, off){
  const o = off || {};
  return (bs || BLOCKS).filter(b => b.kind === 'price' && !o[b.uid]).length;
}

/* 一格裡的價格越多，每一個就得小一點 —— 同樣一塊寬度要塞更多組數字，
   而且數字之間還要留得出間隔。所以「預設多大」是照價格數決定的：
     一個價 → 最大（一格只講一個價，那個數字就是主角）
     兩個價 → 中間
     三個以上 → PRICE_BASE 本身，也就是最小的那一級
   這只是「起點」：排不下的時候 autoSpace 照樣會把整組再夾小，所以放大不會溢出。
   分組本來就是照價格數分的（見 priceCount），所以同一組裡每一格拿到的起點一樣，
   一個版位裡同樣價格數的格子還是一樣大。 */
const PRICE_COUNT_FS = { 1: 1.55, 2: 1.25 };
const countFs = () => PRICE_COUNT_FS[priceCount()] || 1;

/** 要求的比例，還沒過「絕不溢出」那道夾子。單格微調 > 轉盤 > 同組最小 > 自己算的。 */
function priceFsRaw(b){
  if(b.fsFix) return b.fsFix;
  if(PRICE_PX) return PRICE_PX / PRICE_BASE;
  if(GROUP_FS) return GROUP_FS;
  return b.fs || countFs();
}
/* autoSpace 要「這一塊本來想要多大」時用這個，不用 priceFsRaw —— 差別在最後那一段：
   priceFsRaw 沒有轉盤／同組時會回 b.fs，而 b.fs 正是 autoSpace 自己上一輪算完寫回去的。
   拿它當這一輪的輸入 → 排版吃自己的上一個結果 → 每次縮放（轉盤忽大忽小、放大又還原）
   都要多排一次才收斂，中間那一幀位置是舊的。這裡把自動那段固定回基準 1，autoSpace
   一次就算得準；b.fs 只當輸出，不再回頭當輸入。 */
function priceReq(b){
  if(b.fsFix) return b.fsFix;
  if(PRICE_PX) return PRICE_PX / PRICE_BASE;
  if(GROUP_FS) return GROUP_FS;
  return countFs();          // 自動那一段的基準：照這一格有幾個價格
}
/* b.shrink 是最後那道夾子：要求的字級整列排不下時，autoSpace 算出剛好排得下的
   比例存在每一塊上（整組同一個值，數字之間的相對關係不變）。1 ＝ 沒夾。
   存在 block 上而不是放一個全域的，是因為 blockHTML 也會畫「不是現在這一格」的
   格子，而 autoSpace 只跑現在這一格 —— 全域的會把這一格的夾子套到別格頭上。
   轉盤本來允許溢出，談定改成不准 —— 寧可字小一點，也不要壓到隔壁版位。 */
function priceFs(b){ return priceFsRaw(b) * (b.shrink || 1); }

/** 上層把這個版位的字級設定送下來。 */
function applyType(t){
  if(!t) return;
  let hit = false;
  if(+t.skuSize && +t.skuSize !== SKU_FS){ SKU_FS = +t.skuSize; hit = true; }
  const px = +t.pricePx || 0;
  if(px !== PRICE_PX){ PRICE_PX = px; hit = true; }
  const g = +t.groupFs || 0;
  if(g !== GROUP_FS){ GROUP_FS = g; hit = true; }
  if(!hit) return;
  document.documentElement.style.setProperty('--sku-fs', SKU_FS + 'px');
  if(BLOCKS.length) renderOne(curCell, true);
}
let CELLS=[];          // [{id, picked:Set, blocks:[], layoutKey:''}]
let curCell=0;         // 目前作用中的格子索引
let GC=1, GR=1;        // 版面 欄×列

function cell(i){ return CELLS[i===undefined?curCell:i]; }
/* 所有既有邏輯都透過這兩個 getter/setter 存取當前格 */
function cellEl(i){ return document.getElementById('cell'+(i===undefined?curCell:i)); }

function makeCells(cols,rows){
  GC=cols; GR=rows;
  const n=cols*rows;
  const old=CELLS;
  CELLS=[]; 
  for(let i=0;i<n;i++) CELLS.push(old[i]||{picked:new Set(),blocks:[],layoutKey:''});
  if(curCell>=n) curCell=0;
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${cols},var(--cw))`;
  g.innerHTML=CELLS.map((c,i)=>
    `<div class="cell empty${i===curCell?' cur':''}${i<cols?' row1':''}" id="cell${i}" data-cell="${i}">點一下選商品</div>`).join('');
  document.getElementById('ginfo').textContent=`${n} 格`;
  CELLS.forEach((c,i)=>renderOne(i));
  renderLayers();
}

let picked = new Set();   // 選中的商品，存 SKU

/* 舊檔的 picked 存的是「第幾列」。商品目錄一改（多一列、換順序）那個數字就會
   指到別的商品 —— 而且不會報錯，只會默默挑錯貨。所以改存 SKU，那是商品的真名。
   讀到數字就照當下的目錄換算一次，之後存下去的就都是 SKU 了。 */
function toSkus(list){
  const out = new Set();
  (list||[]).forEach(v=>{
    if(typeof v === 'number'){ const r = ROWS[v]; if(r) out.add(r.sku); }
    else if(v != null) out.add(String(v));
  });
  return out;
}
let q = '';
const $=s=>document.querySelector(s);

/* 參數平常從網址來（?ui=stage&cell=…）。單檔版把這一頁整個塞進 srcdoc，
   那時候 location 是 about:srcdoc、沒有 query，所以上層改成先塞一個
   window.__PICK_PARAMS 進來 —— 兩種載入方式都走這一行。 */
const PICK_Q = new URLSearchParams(window.__PICK_PARAMS || location.search);

/* ====== 身分：design = 只排版；pm = 只帶商品 ======
   由上層頁面決定：載入時寫在網址 ?role=，之後切換用 postMessage 通知。 */
let ROLE = PICK_Q.get('role')==='pm' ? 'pm' : 'design';
/* 只出借面板：被落版嵌在那一格旁邊時，這頁只露出他要用的那一塊面板
   （PM 挑貨、設計 圖層），版面本身在外面那張版上看。 */
const UI_MODE = PICK_Q.get('ui') || '';
const UI_PANEL = UI_MODE==='panel', UI_STAGE = UI_MODE==='stage';
if(UI_PANEL) document.body.classList.add('ui-panel');
if(UI_STAGE) document.body.classList.add('ui-stage');

/* 上層告訴這一格在版上實際多大（cm），座標系照它開。
   回傳有沒有真的變 —— 沒變就不必重排。 */
function adoptStageCm(w, h){
  w = +w || 0; h = +h || 0;
  if(!w || !h) return false;
  const nw = Math.max(40, Math.round(w * U_PER_CM));
  const nh = Math.max(40, Math.round(h * U_PER_CM));
  if(nw === CW && nh === CH && CM_W) return false;
  CM_W = w; CM_H = h; CW = nw; CH = nh;
  return true;
}
adoptStageCm(PICK_Q.get('cmw'), PICK_Q.get('cmh'));

/* 畫布模式：這一格有多大由外面那張版決定，程式照自己的視窗把座標系縮進去。 */
function fitStage(){
  if(!UI_STAGE) return;
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  /* 帶了真實尺寸進來就照它 —— CH 已經是那一格自己的高度，不必再從視窗形狀
     反推。沒帶（單獨開這一頁）才退回舊做法：照視窗比例湊一個高度出來。 */
  if(!CM_W) CH = Math.max(160, Math.round(CW * h / w));
  /* 寬高都要進得來，取小的那個比例。本來只看寬度（w/CW），可是上層那一格的
     像素長寬比和 cm 長寬比對不齊時（放大拼板時特別明顯），照寬度撐滿會讓高的
     那一邊溢出下緣 —— 價格貼在最底 5px，正好被 overflow:hidden 裁掉半截。
     取小的就兩邊都不溢；差那一點點讓 #wrap 置中補成兩側等寬的細邊。 */
  const cs = Math.max(.02, Math.min(w / CW, h / CH));
  const r = document.documentElement.style;
  r.setProperty('--cs', cs.toFixed(4));
  r.setProperty('--lw', CW + 'px');
  r.setProperty('--lh', CH + 'px');
  /* 格子正好包住縮完的畫布（不是撐滿整個視窗），#wrap 再把它置中 —— 這樣
     scaleOf（clientWidth/CW）量到的就是真正套上去的 cs，拖曳座標才不會歪。 */
  r.setProperty('--cw', Math.round(CW * cs) + 'px');
  r.setProperty('--ch', Math.round(CH * cs) + 'px');
}
/* 這一格被拉寬拉高＝版面的形狀變了，要重排一次：靠下的那一疊得重新找到底在哪。
   （本來這裡叫的是 paint()，但那是 renderOne 裡面的區域變數，外面根本看不到 ——
   一縮放就 ReferenceError。改叫 renderOne 自己重畫。） */
let fitTimer = 0;
if(UI_STAGE) addEventListener('resize', () => {
  fitStage();
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { if(BLOCKS.length) renderOne(curCell, true); }, 80);
});

/* 上層說這一格的實際尺寸換了（列數變了、刊頭大小改了）：換座標系再重排一次。
   座標系換了尺標，已經擺好的零件要照同一個比例跟著走 —— 自動排的那些下面
   會重排看不出來，但手動搬過的位置不跟著換就整個跑掉。
   BLOCKS 和 cell().blocks 常常是同一個陣列，所以記下處理過的，別縮兩次。 */
function applyStageCm(cm){
  const prev = CW;
  if(!cm || !adoptStageCm(cm.w, cm.h)) return;
  if(prev && CW !== prev){
    const k = CW / prev, seen = new Set();
    const scale = arr => {
      if(!arr || seen.has(arr)) return;
      seen.add(arr);
      arr.forEach(b => { b.x = (+b.x || 0) * k; b.y = (+b.y || 0) * k; });
    };
    CELLS.forEach(c => scale(c.blocks));
    scale(BLOCKS);
  }
  fitStage();
  if(BLOCKS.length) renderOne(curCell, true);
}

/* 面板模式：滾輪在面板上任何地方都是捲名單 — 不必先把游標移到捲軸上，
   也不會漏給外面那張版。 */
if(UI_PANEL) addEventListener('wheel', e => {
  const scrollable = el => el && el.scrollHeight > el.clientHeight;
  // 游標正在哪份名單上就捲哪一份；不在名單上，就捲這塊面板裡捲得動的那一份
  const under = e.target.closest ? e.target.closest('.pbody, #lay .side-bd') : null;
  const pane = scrollable(under) ? under
    : [...document.querySelectorAll('.pbody, #lay .side-bd')]
        .find(el => el.offsetParent && scrollable(el));
  if(pane) pane.scrollTop += e.deltaY;        // 一律自己捲：交給瀏覽器就會漏出去
  e.preventDefault();                         // 沒得捲也別傳出去
}, { passive:false });

function applyRole(r){
  ROLE = r;
  document.body.classList.toggle('role-pm', r==='pm');
  document.body.classList.toggle('role-design', r==='design');
  if(r==='design'){                     // 設計 手上不該留著任何新增入口
    document.getElementById('side').classList.remove('on');
    if(!UI_PANEL) document.getElementById('panel').classList.remove('on');
  }
  if(r==='pm' && !UI_PANEL) document.getElementById('lay').classList.remove('on');
  if(UI_PANEL) openPanels(true);        // 這個模式下面板就是全部，永遠開著
}
/* 版上正在編輯的是不是我這一格。只有那一格摸得到（其餘的 pointer-events 是關的），
   所以工具列和「刪掉的」那顆 ＋ 也只有那一格該露出來 —— 面板一關就把選取清掉，
   不然那條工具列會一直浮在版上，看起來像那一格還開著。
   單獨開這一頁（不是拼板裡的畫布）沒有人會講，所以預設就是開著的。 */
let STAGE_EDIT = !UI_STAGE || window.parent === window;
function applyStageEditing(id){
  const on = String(id||'') === String(CELL_ID);
  if(on === STAGE_EDIT) return;
  STAGE_EDIT = on;
  if(!on){ selected.clear(); activeImg=null; }
  renderCell();                 // 重畫會順手把工具列和 ＋ 一起重算
}

addEventListener('message',e=>{
  const d = e.data || {};
  if(d.boardRole==='pm'||d.boardRole==='design') applyRole(d.boardRole);
  /* 尺寸要在 restoreBoard 之前收 —— 舊檔的座標換算是拿 CW 去算的，
     CW 還停在預設值的話就會照錯的比例縮。 */
  if(d.stageCm) applyStageCm(d.stageCm);
  if(d.stageEditing !== undefined) applyStageEditing(d.stageEditing);
  if(d.type) applyType(d.type);          // 這個版位的字級設定（SKU、價格）
  /* 共用的商品目錄要在 restoreBoard 之前收：picked 存的是 SKU，目錄還是內建的
     那份時對不上，畫布會整格空掉。 */
  if(d.catalogue) applyCatalogue(d.catalogue);
  // 上層把這一格上次拼到哪裡送回來（restoreBoard 定義在下面，執行時才會用到）
  if(d.boardRestore !== undefined) restoreBoard(d.boardRestore);
  // 旁邊那塊面板剛剛勾了什麼 — 畫布照著重排（挑了什麼是面板說了算）
  if(d.boardPicked) applyPicked(d.boardPicked);
  // 上層把剛剛那張圖傳完了（或失敗了）
  if(d.imgUploaded){
    const w = imgWaiting.get(d.imgUploaded.reqId);
    if(w){
      imgWaiting.delete(d.imgUploaded.reqId);
      d.imgUploaded.error ? w.no(new Error(d.imgUploaded.error)) : w.ok(d.imgUploaded.url);
    }
  }
});

/* ====== 把 PNG 拖到灰方塊上就換圖 ======
   圖不留在這一頁：縮好之後交給上層傳去 Storage，換回一串網址才存下來。
   金鑰只有上層有 —— 單檔版這一頁是 srcdoc 塞進去的，不該碰到它。 */

const IMG_MAX_PX = 900;   // 版面上最大也才幾百 px，再大只是白佔頻寬

let sayTimer = 0;
function say(msg){
  const el = document.getElementById('imgsay');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(()=>el.classList.remove('on'), 2400);
}

/* 縮圖一律出 PNG：商品圖常常是去背的，轉成 JPEG 會給它一塊白底。 */
function shrinkImage(file){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onerror=()=>no(new Error('讀不到這個檔案'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>no(new Error('這個檔案不是看得懂的圖'));
      im.onload=()=>{
        const k=Math.min(1, IMG_MAX_PX/Math.max(im.width,im.height));
        if(k>=1) return ok(fr.result);            // 本來就夠小，別重壓一次
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        ok(cv.toDataURL('image/png'));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let imgReqN = 0;
const imgWaiting = new Map();
function askUpload(name, dataUrl){
  return new Promise((ok,no)=>{
    if(window.parent===window) return no(new Error('單獨開這一頁沒有地方可以存'));
    const reqId = 'u'+(++imgReqN);
    imgWaiting.set(reqId,{ok,no});
    try{ parent.postMessage({ boardCell:CELL_ID, imgUpload:{ reqId, name, dataUrl } }, '*'); }
    catch(err){ imgWaiting.delete(reqId); return no(err); }
    setTimeout(()=>{
      if(imgWaiting.has(reqId)){ imgWaiting.delete(reqId); no(new Error('上傳等太久了')); }
    }, 30000);
  });
}

const imgBlkAt = t => (t && t.closest) ? t.closest('.blk.img') : null;
let dropHot = null;
function markDrop(el){
  if(dropHot===el) return;
  if(dropHot) dropHot.classList.remove('imgdrop');
  dropHot = el;
  if(el) el.classList.add('imgdrop');
}

addEventListener('dragover', e=>{
  const el = imgBlkAt(e.target);
  if(!el){ markDrop(null); return; }
  /* 圖層本身是可以拖著搬的，所以只有「從桌面拖檔案進來」才算換圖 */
  if(![...(e.dataTransfer.types||[])].includes('Files')){ markDrop(null); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  markDrop(el);
});
addEventListener('dragleave', e=>{ if(!e.relatedTarget) markDrop(null); });

addEventListener('drop', async e=>{
  const el = imgBlkAt(e.target);
  if(!el || !e.dataTransfer.files.length) return;
  e.preventDefault();
  markDrop(null);

  const b = BLOCKS.find(x=>String(x.id)===el.dataset.b);
  if(!b) return;
  const f = e.dataTransfer.files[0];
  if(!/^image\//.test(f.type)){ say('只收圖片檔'); return; }

  el.classList.add('imgbusy');
  try{
    const small = await shrinkImage(f);
    const url = await askUpload(b.key + '.png', small);
    cellImgs()[b.key] = url;
    saveCell();
    refreshAll();          // 同一格裡同一個商品的圖層一起換掉
    reportBoard();         // 上層收到才會寫進檔期、才會同步出去
    say('換好了');
  }catch(err){
    say(String(err && err.message || err));
  }finally{
    el.classList.remove('imgbusy');
  }
});

/* ====== 共用商品目錄 ======
   目錄是全公司一份，存在上層那邊（上層才有連線的金鑰）。這一頁只負責：
   收到就換掉、改到就往上報。上層沒給（單獨開這一頁、或還沒接後端）就繼續用
   檔案裡寫死的那份，跟以前一模一樣。 */
function applyCatalogue(cat){
  if(!cat || !Array.isArray(cat.rows) || !cat.rows.length) return;
  ROWS  = cat.rows.map(r=>({name:r.name,spec:r.spec,color:r.color,sku:String(r.sku),price:+r.price||0}));
  if(cat.model) MODEL = cat.model;
  if(cat.brand) BRAND = cat.brand;
  if(cat.bimg)  BIMG  = cat.bimg;
  /* 每一格都要重排，不是只有正在看的那一格 —— 每個格子各自記著自己的 layoutKey，
     只清掉模組上那一份的話，其他格會繼續顯示改名前的品名。 */
  layoutKey = '';
  CELLS.forEach(c=>{ c.layoutKey = ''; });
  saveCell();
  refreshAll();
}

/** 現在的目錄長什麼樣 —— 往上報就是報這一包。 */
function catalogueNow(){
  return { rows: ROWS.map(r=>({name:r.name,spec:r.spec,color:r.color,sku:r.sku,price:r.price})),
           model: MODEL, brand: BRAND, bimg: BIMG };
}

/* 後台動過目錄就往上報。跟 reportBoard 一樣壓一下：改一個字會觸發很多次。 */
let catTimer = 0;
function reportCatalogue(){
  if(window.parent === window) return;
  clearTimeout(catTimer);
  catTimer = setTimeout(()=>{
    try{ parent.postMessage({ boardCell:CELL_ID, catalogueSave: catalogueNow() }, '*'); }catch(_){}
  }, 250);
}

/** 只換「挑了哪些」，位置讓 buildBlocks 重新排一次。 */
function applyPicked(list){
  const want = toSkus(list);
  const next = [...want].sort().join(',');
  if(next === sig()) return;
  picked = want;
  layoutKey = '';                       // 逼它重排
  saveCell();
  selected.clear();
  refreshAll();
}

/* ====== 核心合併：同 spec 同 price → SKU 合併；價不同 → 各自一欄 ====== */
/* 價格是唯一的分欄依據。
   同價 → 同一欄，不管規格是否相同；欄內再依規格分行列出各自的 SKU。
   價格不同 → 各自一欄（左 / 左中右）。 */
function buildCols(rows){
  const byPrice=new Map();
  for(const v of rows){
    if(!byPrice.has(v.price)) byPrice.set(v.price,new Map());
    const bySpec=byPrice.get(v.price);
    if(!bySpec.has(v.spec)) bySpec.set(v.spec,[]);
    bySpec.get(v.spec).push(v);
  }
  return [...byPrice.entries()].map(([price,bySpec])=>({
    price, lines:[...bySpec.entries()].map(([spec,vs])=>({spec,vs}))
  }));
}
/* SKU 串規則：
   1. 只有一筆 → 不寫顏色，只寫完整 SKU。
   2. 多筆 → 第一筆完整，其後只留尾碼，顏色貼在各自 SKU 之後。
   3. 連號且該段皆無顏色 → 併成範圍：2000041/42/43 → 2000041-43
      （有顏色的不併，否則顏色對應會遺失。） */
function skuLine(vs){
  if(vs.length===1) return 'SKU：'+vs[0].sku;

  const skus=vs.map(v=>v.sku);
  let pre=skus[0];
  for(const t of skus.slice(1)){let i=0;while(i<pre.length&&pre[i]===t[i])i++;pre=pre.slice(0,i)}
  const usePre = pre.length>=3;
  const tail=(v,i)=>{
    if(i===0||!usePre) return v.sku;
    const t=v.sku.slice(pre.length);
    return t.length<2 ? v.sku.slice(-2) : t;   // 尾碼至少 2 位
  };

  const parts=[];
  let i=0;
  while(i<vs.length){
    // 找連號且無顏色的一段
    let j=i;
    while(j+1<vs.length && !vs[j].color && !vs[j+1].color &&
          vs[j+1].sku.length===vs[j].sku.length &&
          (+vs[j+1].sku)===(+vs[j].sku)+1) j++;
    if(j-i>=2){                       // 至少三筆才值得用 -
      const a=tail(vs[i],i);
      // 結尾用去掉共同前綴的尾碼，但至少留 2 位，避免出現 2000041-3
      let b = usePre ? vs[j].sku.slice(pre.length) : vs[j].sku;
      if(b.length<2) b = vs[j].sku.slice(-2);
      parts.push(a+'-'+b);
    }else{
      for(let k=i;k<=j;k++) parts.push(tail(vs[k],k)+(vs[k].color||''));
      j=i>j?i:j;
    }
    i=j+1;
  }
  return 'SKU：'+parts.join('/');
}

/* ====== 版面：每個元素 = 一個可自由移動的 block ======
   block.kind: name | img | sku | price
   sku block 帶 vs（該塊包含哪些 row），拖曳合併就是把兩塊的 vs 併起來。
   pos 以格子左上為原點，px。 */
/* 每個選項各自一張圖：key = 名稱|規格|顏色 */
let IMG = {};
function imgKey(r){ return r.name+'|'+(r.spec||'')+'|'+(r.color||''); }
function keyLabel(k){ const a=k.split('|'); return a[0]+(a[1]?'　'+a[1]:'')+(a[2]?'　'+a[2]:''); }
let BLOCKS = [];
/* picked 與 BLOCKS 是「目前格」的視圖，切格時同步 */
function loadCell(i){
  if(cell(i)===undefined) return;
  curCell=i; picked=cell().picked; BLOCKS=cell().blocks; layoutKey=cell().layoutKey;
}
function saveCell(){ if(cell()){ cell().picked=picked; cell().blocks=BLOCKS; cell().layoutKey=layoutKey; } }
let selected = new Set();     // 選中的 block id
let layoutKey = '';           // 資料簽章，變了才重排

function sig(){ return [...picked].sort().join(','); }

function buildBlocks(){
  const sel = ROWS.filter(r=>picked.has(r.sku));
  if(!sel.length){ BLOCKS=[]; return; }
  const name = sel[0].name;
  const rows = sel.filter(r=>r.name===name);
  const cols = buildCols(rows);
  const single = cols.length===1;
  let id=0;
  const B=[];
  const hasBrand = !!(brandOf(name)||BIMG[name]);
  if(hasBrand) B.push({id:'b'+id++,kind:'brand',name,x:PAD,y:PAD});
  const nameY = hasBrand?PAD+34:PAD;
  B.push({id:'b'+id++,kind:'name',text:name,x:PAD,y:nameY});
  const mdl=modelOf(name);
  if(mdl) B.push({id:'b'+id++,kind:'model',text:mdl,name,x:PAD,y:nameY+34});

  if(single){
    /* 一支的時候也照同一條規矩：數字（SKU、價格）整組靠右下，品牌品名靠左上。
       所以這裡的 SKU 跟價格一律算成「第 0 欄」—— 多欄那套排版程式會把整欄
       貼到右下角，兩種情況看起來就是同一張版。 */
    stackImgs(B, rows, 200, Math.round(CH*.28), () => 'b'+id++, 340);   // 340＝下面那組數字的左緣
    let y = CH-PAD_Y-58-cols[0].lines.length*24;   // 先估，autoSpace 再貼準
    for(const l of cols[0].lines){
      B.push({id:'b'+id++,kind:'sku',vs:l.vs.slice(),x:340,y,col:0});
      y+=24;
    }
    B.push({id:'b'+id++,kind:'price',price:cols[0].price,x:340,y:y+2,col:0});
  }else{
    /* 規格／SKU／價格整組靠右下角：最後一欄貼齊右邊界，往左依序排。
       x0 要先算出來 —— 圖得知道自己可以排到哪裡為止，才不會壓到價格。 */
    const n=cols.length, gap=Math.min(170,(CW-PAD*2)/n);
    const groupW=gap*n;
    const x0=CW-PAD-groupW;           // 整組左緣，使右緣落在 CW-PAD
    stackImgs(B, rows, 190, Math.round(CH*.17), () => 'b'+id++, x0);
    // 每欄高度：規格(26)+SKU(24) 各行 + 價格(約56)
    const rowsH = Math.max(...cols.map(c=>
      c.lines.reduce((a,l)=>a+(l.spec?26:0)+24,0)));
    const yTop = CH-PAD-58-rowsH;     // 由下往上推算起點（價格塊約 56 高 +2 間距）
    /* 這裡先按估算的欄寬、行高擺；規格和 SKU 有多寬、價格有多高，都要等它畫出來
       才量得到，所以真正的間距交給 autoSpace() 在渲染後重排。col 是欄號。 */
    cols.forEach((c,ci)=>{
      const cx=x0+ci*gap;
      let y=yTop;
      for(const l of c.lines){
        if(l.spec){ B.push({id:'b'+id++,kind:'spec',spec:l.spec,x:cx,y,col:ci}); y+=26; }
        B.push({id:'b'+id++,kind:'sku',vs:l.vs.slice(),x:cx,y,col:ci});
        y+=24;
      }
      B.push({id:'b'+id++,kind:'price',price:c.price,x:cx,y:y+2,col:ci});
    });
  }
  BLOCKS=B;
  assignUids(BLOCKS);
}

/* 每一塊在版面上的「身分」，跟 b.id 不一樣：id 是重建時從 0 數的流水號，
   換一組商品之後同一個號碼就是別人了。藏起來的零件記在格子身上（c.off），
   重選商品整批重建之後還要認得出誰是誰，靠的就是這個。
   認的是「哪一種、第幾欄、同類的第幾個」—— 這些都是照 picked 推出來的，
   同一組商品重建幾次都一樣。 */
function assignUids(B){
  const n={};
  B.forEach(b=>{
    const base = b.kind==='img' ? 'img|'+b.key : b.kind+'|'+(b.col==null?'-':b.col);
    n[base]=(n[base]||0)+1;
    b.uid = base+'#'+n[base];
  });
}
/* 舊檔沒有 uid。補的時候要整批一起補（跟重建時同一套規則），
   補一半會撞號。 */
function ensureUids(B){ if(B && B.length && !B[0].uid) assignUids(B); }

/* 這一格藏起來的零件：{uid: 顯示用的名字}。名字要一起存 —— 清單得說得出
   「你藏起來的是哪一塊」，而那一塊已經不在版上了，問不到它自己。
   跟換過的商品圖（cellImgs）一樣掛在格子上，理由也一樣：掛在零件身上，
   重選商品整批重做就跟著不見了。 */
function offMap(c){
  c = c || cell();
  if(!c) return {};
  if(!c.off) c.off = {};
  return c.off;
}
function isOff(b, c){ return !!offMap(c)[b.uid]; }
/* 還在版上的（沒被藏起來的）。排版、對齊、分組一律只算這些。 */
function liveBlocks(){ return BLOCKS.filter(b=>!isOff(b)); }

/** 商品圖並排，彼此不重疊，而且停在數字那一疊前面。
    limit＝右界（數字那一疊的左緣）；沒給就用格子的右邊界。

    以前是「固定寬度、往右疊一點點」（間距上限 18px），所以三張圖幾乎疊成一坨。
    直接把間距拉開又會壓到價格 —— 圖寬 190、數字從 x=190 開始，三張 190 寬的圖
    要並排得 570px，而畫布總共才 540：**固定寬度時，不重疊是幾何上做不到的**。
    所以這裡改成先決定寬度：n 張要塞進 [PAD, limit] 這一段，每張最多 band/n。
    圖會變小，但那是這一格真實的樣子 —— 三支商品擠一格，圖本來就該小。 */
function stackImgs(B, rows, w, y, nextId, limit){
  const n = rows.length;
  const band = Math.max(60, (limit == null ? CW - PAD : limit) - PAD);
  const ww = Math.max(44, Math.min(w, band / n));      // 44 是「還看得出是什麼」的下限
  const step = n > 1 ? (band - ww) / (n - 1) : 0;
  const x0 = PAD;                 // 圖靠左：左上是品牌品名，圖接著站在同一條左邊界上
  rows.forEach((r, i) => B.push({ id:nextId(), kind:'img', row:r, key:imgKey(r),
                                  x:x0 + i*step, y, w:ww, z:i+1 }));
}

/* 這一格自己換過的商品圖：key 是商品（品名|規格|顏色），值是 Storage 的網址。
   為什麼掛在「格子」上而不是掛在零件上：勾選一變動 buildBlocks() 就把零件整批
   重做，掛在零件上的東西會跟著不見。掛在格子上，重排幾次都還在。 */
function cellImgs(){
  const c = cell();
  if(!c) return {};
  if(!c.img) c.img = {};
  return c.img;
}

/* 商品圖：這一格換過的優先，其次是圖庫上傳的，都沒有就畫 placeholder
   （內嵌 SVG，斷網也看得到） */
function imgHTML(k){
  const mine = cellImgs()[k];
  if(mine) return `<img src="${mine}" alt="" draggable="false">`;
  if(IMG[k]) return `<img src="${IMG[k]}" alt="" draggable="false">`;
  const a=k.split('|'), tag=[a[1],a[2]].filter(Boolean).join(' ')||'—';
  return `<svg class="ph" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect x="0" y="0" width="100" height="100" rx="3" fill="#f0f2f6" stroke="#d5dae3"
      stroke-width="0.7" stroke-dasharray="3 2"/>
    <g fill="none" stroke="#b9c1cf" stroke-width="1.6" stroke-linejoin="round">
      <rect x="30" y="34" width="40" height="32" rx="2.5"/>
      <path d="M30 58 L41 47 L50 56 L59 50 L70 60"/>
    </g>
    <circle cx="41" cy="43" r="3.2" fill="#b9c1cf"/>
    <text x="50" y="80" text-anchor="middle" font-size="7" fill="#8a94a6"
      font-family="sans-serif" font-weight="700">${tag}</text>
  </svg>`;
}

let activeImg=null;          // 滾輪循環中的目前圖層 id
let stackUnder=[];           // 游標下的圖層(由上到下)
let cycleIndex=0;

/* 擋在 active 前面(z 較大)的圖層降為 0.5，其餘 1 */
function xrayDim(b){
  if(!activeImg) return 1;
  const a=BLOCKS.find(x=>x.id===activeImg);
  if(!a||b.id===a.id) return 1;
  return b.z>a.z ? .5 : 1;
}

/* 這一塊自己調過的倍率。沒調過就不寫，CSS 那邊 var(--bs,1) 吃預設值。 */
function bsVar(b){ return (b.sc && b.sc!==1) ? `;--bs:${b.sc}` : ''; }

function blockHTML(b,isCur=true){
  const on = (isCur&&selected.has(b.id))?' sel':'';
  const bs = bsVar(b);
  if(b.kind==='name')  return `<div class="blk name${on}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${bs}">${b.text}</div>`;
  if(b.kind==='img'){
    const dim = isCur?xrayDim(b):1;
    const noimg = (cellImgs()[b.key]||IMG[b.key]) ? '' : ' noimg';   // 還沒換圖＝框紅的
    return `<div class="blk img${on}${noimg}${(isCur&&activeImg===b.id)?' actimg':''}" data-b="${b.id}"
      style="left:${b.x}px;top:${b.y}px;width:${b.w}px;z-index:${b.z};opacity:${dim}">
      ${imgHTML(b.key)}
      <button class="tobtn" data-top="${b.id}" title="移到最上層">⬆</button></div>`;
  }
  if(b.kind==='brand') return `<div class="blk brand${on}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${bs}">${brandHTML(b.name)}</div>`;
  if(b.kind==='model') return `<div class="blk model${on}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${bs}">機型：${b.text}</div>`;
  if(b.kind==='spec')  return `<div class="blk specb${on}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${bs}${b.w2?`;width:${b.w2}px`:''}"><div class="spec${b.dark?' dark':''}">${b.spec}</div></div>`;
  /* 價格用哪一級字由 priceFs() 決定：單格微調 > 轉盤 > 同組最小 > 自己算的。
     轉盤是允許溢出的（談定的），所以這裡不夾上限。 */
  if(b.kind==='price'){
    const fs=priceFs(b);
    return `<div class="blk price${on}${b.cross?' crossed':''}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${
      b.w2?`;width:${b.w2}px`:''}${
      fs&&fs!==1?`;font-size:${(PRICE_BASE*fs).toFixed(1)}px`:''}">${b.price}</div>`;
  }
  // sku
  return `<div class="blk skub${on}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px${bs}${b.w2?`;width:${b.w2}px`:''}">`+
    `<div class="sku">${skuLine(b.vs)}</div></div>`;
}

function renderCell(){ renderOne(curCell); paintHandles(); reportBoard(); }

/* 選中一塊就在四個角長出把手，拖角落等比放大縮小 —— 跟 PPT 一樣的手感。
   只在「剛好選一塊」時出現：多選時每一塊各自的基準倍率不同，一個角落沒辦法
   同時代表全部，硬做出來的結果只會跟你想的不一樣。工具列上的 ＋／− 才是多選用的。
   在 render 之後補上去，不塞進 blockHTML —— 那支函式一種零件一條分支，
   每條都補一次把手，遲早漏掉一種。 */
function paintHandles(){
  if(ROLE==='pm' || selected.size!==1) return;
  const el=bEl([...selected][0]); if(!el) return;
  /* 只有四個角。每一塊零件的「大小」只有一個倍率（圖是 b.w、價格是 b.fsFix、
     其他是 b.sc），沒有分開的寬和高可以拉 —— 所以邊中點那四顆做出來也只會等比縮放，
     長得像 Word 卻不是 Word 的行為，比沒有更糟。真的要單向拉伸，得先讓零件有
     寬高兩個維度，那是另一件事。 */
  ['nw','ne','sw','se'].forEach(c=>{
    const h=document.createElement('i');
    h.className='rz rz-'+c;
    h.dataset.corner=c;
    h.title='拖曳改大小（按住 Shift 微調）';
    el.appendChild(h);
  });
}

/* 渲染單一格子（i 可為任一格） */
function renderOne(i, force){
  const el=document.getElementById('cell'+i);
  if(!el) return;
  const c=CELLS[i]; if(!c) return;
  const isCur = i===curCell;
  const row1 = i<GC ? ' row1':'';
  const pk = isCur?picked:c.picked;
  if(!pk.size){
    el.className='cell empty'+(isCur?' cur':'')+row1;
    el.innerHTML='點一下選商品';
    // 必須清掉 layoutKey，否則之後重選同一組會與舊 key 相同而不重建
    c.layoutKey='';
    if(isCur){ BLOCKS=[]; layoutKey=''; } else c.blocks=[];
    return;
  }
  const k=[...pk].sort((a,b)=>a-b).join(',');
  const rebuilt = k!==c.layoutKey;
  if(rebuilt){
    c.layoutKey=k;
    if(isCur){ layoutKey=k; selected.clear(); activeImg=null; }
    const savedP=picked, savedB=BLOCKS;
    picked=pk; buildBlocks(); c.blocks=BLOCKS;
    if(isCur){ setTimeout(()=>{
        document.getElementById('lay').classList.toggle('on',panelsOn&&ROLE!=='pm');
        renderLayers();
      },0); }
    else { picked=savedP; BLOCKS=savedB; }
  }
  /* 藏起來的零件在這裡就被濾掉：不畫、不量、不參與排版。留在 c.blocks 裡不刪，
     所以打勾放回來的時候它連位置、調過的大小都還在原地，不必整組重建。 */
  const hid = c.off || {};
  const blocks = (isCur?BLOCKS:c.blocks).filter(b=>!hid[b.uid]);
  el.className='cell'+(isCur?' cur':'')+row1;
  if(isCur) setTimeout(()=>{ renderProps(); renderRestore(); },0);
  const paint = hidden => {
    el.innerHTML = '<div class="cstage'+(hidden?' measuring':'')+'">'
      /* 只在拖曳中鋪格線：平常不該有一層網子壓在版面上，那會干擾你看真正的排版 */
      + ((isCur && drag && drag.moved) ? '<div class="gridlines"></div>' : '')
      + blocks.map(b=>blockHTML(b,isCur)).join('')
      + (isCur?guides.map(g=>g.dir==='v'
          ? `<div class="guide gv" style="left:${g.pos}px"></div>`
          : `<div class="guide gh" style="top:${g.pos}px"></div>`).join(''):'')
      + '<div class="marquee" id="marquee'+i+'"></div>'
      + '<div class="safe"></div>'
      + '</div>';
  };
  /* 剛排好（或字型到齊後強制重排）的那一格：先照內容寬度藏著畫一次、量真正的
     寬高，autoSpace 把價格 SKU 靠右對齊、圖讓開，定位完才顯示。b.w2 是靠右用的
     固定寬度框，量之前先清掉，不然量到的是上一輪的框寬、欄寬會越算越死。 */
  const measuring = (rebuilt||force||c.respace) && isCur;
  if(measuring){ c.respace=false; blocks.forEach(b=>{ if(b.col!=null) b.w2=0; }); }
  paint(measuring);
  // paint(false) 一定要跑到：不然萬一 autoSpace 出錯，這一格就永遠藏著了
  if(measuring){
    try{ autoSpace(); }catch(_){} paint(false);
    /* 量到的高和真正畫出來的高會差幾個 px（padding／border 的捨入，字級越小差越明顯），
       價格貼底這種「差 4px 就看得出來」的地方受不了這個誤差 —— 設 5 只看得到 1。
       所以畫完再對一次下緣：差多少就把右下那一整組搬多少，一次就準。 */
    try{ if(nudgeGroupBottom(blocks)) paint(false); }catch(_){}
  }
}

/* 數字的下緣不等於 block 的下緣。Anton 的字框是 1.51 em（ascent 1.18 ＋ descent
   0.33），line-height:1 撐不住，上下各溢出 0.255 em —— 而數字本身只到基線，
   離 block 下緣還有一段空的。這兩段都跟著字級等比例變，所以「離下緣 5」量框
   算出來的，字越大留白就越多：一價 52px 和二價 68px 明明都設 5，看起來卻不
   一樣高。這裡改量看得到的那一段（含逗號的尾巴），5 就真的是 5。
   量不到字體資訊（舊瀏覽器）就退回量框，至少不會比以前差。 */
let inkCanvas=null;
function priceInkBottom(n){
  const cs=getComputedStyle(n), fs=parseFloat(cs.fontSize);
  if(!fs) return null;
  /* 字型沒到齊就別用這一套：替代字的 ascent 比 Anton 少了約 0.1 em，照它算會把
     整組往下推 5px（就是「有時候對、有時候低一截」）。量不準就退回量框，等
     whenPriceFont() 那一輪再來對一次。這個判斷不能拿去快取 —— 字型是中途到的。 */
  if(!document.fonts || !document.fonts.check || !document.fonts.check(fs+'px Anton')) return null;
  try{
    const g=inkCanvas||(inkCanvas=document.createElement('canvas').getContext('2d'));
    g.font='100px '+cs.fontFamily;
    const m0=g.measureText('0');
    if(!m0.fontBoundingBoxAscent) return null;
    const asc=m0.fontBoundingBoxAscent/100, desc=m0.fontBoundingBoxDescent/100;
    g.font=fs+'px '+cs.fontFamily;
    const m=g.measureText(n.textContent.trim());
    // line-height:1 → 行高就是 fs，半行距是負的（字框比行高大），基線就落在這裡
    const half=(fs-(asc+desc)*fs)/2;
    return n.clientTop+parseFloat(cs.paddingTop||0)+half+asc*fs
           +(m.actualBoundingBoxDescent||0);
  }catch(_){ return null; }
}

/* fonts.ready 只保證「現在排隊中的字型」都好了。Anton 要等到真的有東西用它才會
   被抓下來 —— 一進來還沒有任何價格，ready 就已經 resolve 了，價格是之後才畫的，
   那一次量到的是替代字，而且再也沒有人回來重量。所以改成明講要 Anton：
   load() 會真的去抓，抓到才重排。已經在快取裡就立刻 resolve，不會多跑。 */
function whenPriceFont(){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  return document.fonts.load('52px Anton').catch(()=>{});
}

/* 把「規格／SKU／價格」那一整組上下對準：最低的那一塊離下緣正好 PRICE_BOTTOM。
   整組一起搬，欄與欄、上下行的相對關係都不動。有搬過才回 true。
   釘住的價格（b.placed）不貼底 —— 它的位置是手動放的；連它那一欄的 SKU／規格
   也一起排除，不然整組被貼底就把手動的價格又拉回下緣（就是那個「y 跳回去」）。 */
function nudgeGroupBottom(blocks){
  const placedCols=new Set((blocks||[])
    .filter(b=>b.kind==='price'&&b.placed).map(b=>b.col));
  const grp=(blocks||[]).filter(b=>b.col!=null&&!placedCols.has(b.col));
  if(!grp.length) return false;
  let low=-Infinity;
  grp.forEach(b=>{ const n=bEl(b.id); if(!n) return;
    const ink=b.kind==='price'?priceInkBottom(n):null;
    low=Math.max(low, n.offsetTop+(ink==null?n.offsetHeight:ink)); });
  if(low===-Infinity) return false;
  const d=(CH-PRICE_BOTTOM)-low;
  if(Math.abs(d)<.5) return false;
  grp.forEach(b=>{ b.y+=d; });
  return true;
}

/* Anton 是外部字型，而且是 display=swap —— 第一次畫的時候它還沒下載完，
   量到的是替代字型的高度，比真正的 Anton 矮。價格是靠著底線排的，就照那個
   矮高度擺下去；等 Anton 換上來字長高了，就從底線凸出去被裁掉半截。
   看起來像「只有第一個會壞、之後都正常」，其實是「只有還沒載到字型的那一次會壞」。
   字型到齊再量一次、重排一次。fonts.ready 只會 resolve 一次，所以不會反覆跑；
   字型已經在快取裡的話它立刻就 resolve，那時 BLOCKS 還是空的，直接跳過 ——
   那種情況第一次量到的本來就是對的。 */
whenPriceFont().then(()=>{ if(BLOCKS.length) renderOne(curCell, true); });

/** 這組 block 是不是舊版排的：有價格，卻沒有一塊帶欄號或右下角錨點。 */
function oldLayout(bs){
  const ps=(bs||[]).filter(b=>b.kind==='price');
  return ps.length>0 && ps.every(b=>b.col==null && !b.anchor);
}

/* 自動排版是照估算的字寬擺的，字一長就疊在一起。畫出來以後才量得到每一塊
   真正多寬多高 — 量完把同一欄的往下順排、每一欄往右讓開，價格貼右下角。
   回傳有沒有動過，動過才值得重畫。 */
function autoSpace(){
  const el=cellEl(); if(!el || !BLOCKS.length) return false;
  /* 藏起來的不排：它沒有畫出來，量到的是 null，跟著排會佔掉一個欄位、
     把後面的整排往旁邊推 —— 看起來就是「刪掉一個價格，其他價格還是分那麼開」。 */
  const VIS=liveBlocks();
  /* offsetWidth/offsetHeight 本來就是排版座標，不必再除縮放 —— 以前是量
     getBoundingClientRect() 再除 scaleOf()，那條路會吃掉 padding 那 4px，
     於是價格離下緣永遠少 4（設 5 只看得到 1）。這裡量的就是 CSS 定位用的同一套數字。 */
  const size=id=>{ const n=bEl(id); if(!n) return null;
    return { w:n.offsetWidth, h:n.offsetHeight }; };

  const COLGAP=14, LINEGAP=4;
  let moved=false;
  const put=(b,x,y)=>{ if(Math.abs(b.x-x)>.5||Math.abs(b.y-y)>.5) moved=true; b.x=x; b.y=y; };

  /* 上面留白也是白費的空間：品牌／品名這一疊貼齊上緣（PAD），
     價格那一排本來就貼齊下緣 —— 兩頭都到底，中間留給商品圖。 */
  let hy=PAD_Y;
  ['brand','name','model'].map(kind=>VIS.find(b=>b.kind===kind)).filter(Boolean)
    .forEach(b=>{
      const sz=size(b.id)||{w:0,h:0};
      put(b, PAD, hy);
      hy += sz.h + 2;
    });

  // 多欄：規格／SKU／價格整組靠右下，欄與欄之間留得下最寬的那一塊
  const cols=new Map();
  VIS.forEach(b=>{ if(b.col==null) return;
    if(!cols.has(b.col)) cols.set(b.col,[]);
    cols.get(b.col).push(b); });

  let gTop = null;                  // 右下那一疊的頂端，圖不能越過這條線
  if(cols.size){
    const keys=[...cols.keys()].sort((a,b)=>a-b);
    const sizes=new Map();
    /* 量到的是「畫出來當下那一級字」的尺寸 —— 價格的 font-size 是 PRICE_BASE*priceFs(b)，
       不是基準的 52。下面還要再乘一次最後的比例，所以這裡得先把當時那個比例除掉，
       還原成基準字級的尺寸。少了這一步縮放就做了兩遍：
         轉盤放大 → 欄寬行高被高估 → 欄跟欄之間被撐開、整疊往上飄（愈放大差愈多）
         轉盤縮小 → 被低估 → need 太小、整疊被推到太右邊，而且 w2 比字還窄，
                    text-align:right 在內容溢位時是無效的，字就從右邊噴出去。
       「40 會溢出、52 不會」就是這麼來的 —— 52 剛好是基準，除以 1 等於沒錯。 */
    /* padding 和 border 不會跟著字級縮（CSS 寫死的 px），所以要把它們從量到的
       尺寸裡拆出來，只有字的部分才乘比例。整塊一起乘的話，縮小時會把框算得比
       實際窄，數字就從框的左邊漏出去 —— 量到過漏 5px。 */
    keys.forEach(key=>sizes.set(key, cols.get(key).map(b=>{
      const s=size(b.id)||{w:0,h:0};
      if(b.kind!=='price') return s;                 // 只有價格會縮字
      const e0=priceFs(b)||1;
      const n=bEl(b.id); let cw=0, ch=0;
      if(n){ const cs=getComputedStyle(n);
        cw=(n.offsetWidth-n.clientWidth)+parseFloat(cs.paddingLeft||0)+parseFloat(cs.paddingRight||0);
        ch=(n.offsetHeight-n.clientHeight)+parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0); }
      return { w:(s.w-cw)/e0, h:(s.h-ch)/e0, cw, ch };
    })));
    const avail=CW-PAD*2;

    /* 數字自己排一列，不跟著欄寬走 ------------------------------------------
       本來欄寬取「這一欄最寬的那一塊」，價格再靠右對齊塞進去。價格一旦比 SKU 窄，
       左邊就多出一塊空白，那塊空白看起來就是「數字之間的距離」—— 於是字級調小、
       或 SKU 比較長的時候，數字就被推得忽遠忽近（量到過 24 → 74）。
       改成價格自己一列：右緣釘在 CW-PAD，往左依序擺，數字和數字之間永遠是 COLGAP。
       規格／SKU 仍然各自對齊自己那個價格的右緣，所以看得出來誰是誰的。 */
    const prices=[];
    keys.forEach(key=>{ const list=cols.get(key), hs=sizes.get(key);
      list.forEach((b,j)=>{ if(b.kind==='price') prices.push({b,key,j}); }); });

    /* 拖過的價格（b.placed）不再自動排：位置是你放的，字級是它當下那一級。
       沒拖過的（autoP）才走「貼右下、等距、絕不溢出」那條路。兩種價格的 SKU／
       規格都要對齊「自己那個價格」，所以 placed 的也得先量出寬高、記下自己的頂端。 */
    const autoP  = prices.filter(p=>!p.b.placed);
    const fixedP = prices.filter(p=> p.b.placed);

    let priceTop=null, priceH=0;

    // 已釘住的：位置照舊，只把寬高量出來給 SKU／規格靠。p.top 是它自己的上緣。
    fixedP.forEach(p=>{
      const s=sizes.get(p.key)[p.j], e=priceFs(p.b)||1;   // 它現在用的那一級字
      p.w=s.w*e+s.cw; p.h=s.h*e+s.ch;
      sizes.get(p.key)[p.j]={ w:p.w, h:p.h };
      /* 位置是手動放的，不重排 —— 但轉盤／字型把它放大到凸出邊線時，從邊界往回
         退到剛好貼齊，不讓它壓到隔壁版位。只夾這一塊，相對關係不碰；夾完寫回
         b.x/b.y，所以夾過一次就穩住了（下一次已經在界內，不會再動）。 */
      let x=p.b.x, y=p.b.y;
      if(x+p.w>CW-PAD)   x=CW-PAD-p.w;
      if(x<PAD)          x=PAD;           // 比整條界還寬就貼左，右邊只能溢（字太大）
      if(y+p.h>CH-PAD_Y) y=CH-PAD_Y-p.h;
      if(y<PAD_Y)        y=PAD_Y;
      if(Math.abs(x-p.b.x)>.5||Math.abs(y-p.b.y)>.5){ p.b.x=x; p.b.y=y; moved=true; }
      p.x=p.b.x; p.top=p.b.y;
    });

    if(autoP.length){
      /* 先問「照要求的字級要多寬」—— 用 priceReq（不吃 b.fs），autoSpace 才不會
         把自己上一輪的結果又當這一輪的輸入（見 priceReq）。 */
      const want=autoP.map(p=>priceReq(p.b));
      const base=autoP.map(p=>sizes.get(p.key)[p.j]);
      const fixed=base.reduce((a,s)=>a+s.cw,0)+COLGAP*(autoP.length-1); // 不縮的部分
      const inkw=base.reduce((a,s,i)=>a+s.w*want[i],0);                 // 會縮的部分
      /* 絕不溢出：要求的字級排不下就整組等比例縮到剛好排得下。轉盤本來是允許
         溢出的，談定改成不准 —— 寧可字小一點，也不要壓到隔壁版位。
         只有字會縮，框那 10px 不會，所以是這樣解出來的、不是 avail/need。 */
      const shrink = (inkw+fixed>avail && inkw>0) ? Math.max(0, avail-fixed)/inkw : 1;

      /* 這一格自己想要多大，往上報給同組取最小（同一個版位裡同樣價格數的
         格子要一樣大，那要收齊全部格子才算得出來，一格自己看不到別人）。
         要乘上 countFs()：報上去的必須是「絕對想要多大」，不能只報「我需要縮多少」。
         只報縮放比例的話，一價那一格報 1、三價那一格也報 1，上層看起來一模一樣，
         於是「一個價要大一點」這件事在傳上去的路上就被抹平了。 */
      priceWanted = (shrink<1 ? Math.max(.55, shrink) : 1) * countFs();

      const eff=want.map(w=>w*shrink);            // 夾過之後真正要用的
      autoP.forEach((p,i)=>{
        const hs=sizes.get(p.key), s=base[i];
        const was=p.b.fs, wasS=p.b.shrink;
        p.b.fs=priceWanted; p.b.shrink=shrink;
        if(was!==p.b.fs || wasS!==p.b.shrink) moved=true;
        p.w=s.w*eff[i]+s.cw; p.h=s.h*eff[i]+s.ch;   // 字乘比例，框原樣加回去
        hs[p.j]={ w:p.w, h:p.h };
        priceH=Math.max(priceH,p.h);
      });
      // 右緣釘在 CW-PAD，由右往左擺，間距固定
      let px=CW-PAD;
      for(let i=autoP.length-1;i>=0;i--){ px-=autoP[i].w; autoP[i].x=px; px-=COLGAP; }
      priceTop=CH-PRICE_BOTTOM-priceH;
      autoP.forEach(p=>{ put(p.b,p.x,priceTop); p.b.w2=p.w; p.top=priceTop; });
      gTop=priceTop;
    }

    /* 規格／SKU：每一欄靠齊自己那個價格的右緣，由下往上疊。價格被釘走的那一欄
       就靠著釘住的位置，SKU 跟著價格一起搬；其餘欄照舊貼右下。沒有價格的欄
       （理論上不會有）才退回貼右緣、貼底。 */
    keys.forEach(key=>{
      const list=cols.get(key), hs=sizes.get(key);
      const p=prices.find(q=>q.key===key);
      const right=p ? p.x+p.w : CW-PAD;
      const rest=list.map((b,j)=>({b,s:hs[j]})).filter(o=>o.b.kind!=='price');
      if(!rest.length) return;
      const w=Math.max(...rest.map(o=>o.s.w));
      let y=(p ? p.top : CH-PRICE_BOTTOM)-LINEGAP;
      for(let i=rest.length-1;i>=0;i--){
        y-=rest[i].s.h;
        // b.w2＝這一欄的寬度：整欄靠右對齊靠的就是這個固定寬度框（見 blockHTML）
        put(rest[i].b, right-w, y); rest[i].b.w2=w;
        y-=LINEGAP;
      }
      if(gTop===null || y<gTop) gTop=y;
    });
  }

  // 舊檔裡單獨貼右下角的價格（現在改走欄位那條路，這段留著讓舊版面還能對齊）
  VIS.filter(b=>b.anchor==='br').forEach(b=>{
    const s=size(b.id); if(!s) return;
    put(b, Math.max(PAD,CW-PAD-s.w), Math.max(PAD_Y,CH-PAD_Y-s.h));
  });

  /* 格子越扁，上下能用的高度越少：商品圖夾在「品牌品名」和「數字那一疊」中間，
     兩頭都不能壓到。擠不下就往上讓 —— 字和價格是要看的，圖可以擋一點。 */
  VIS.filter(b=>b.kind==='img').forEach(b=>{
    const sz=size(b.id); if(!sz) return;
    let y=b.y;
    if(gTop!==null && y+sz.h > gTop-6) y = gTop-6-sz.h;
    if(y < hy) y = hy;
    if(Math.abs(y-b.y)>.5){ b.y=y; moved=true; }
  });
  return moved;
}

/* ====== 拖曳 / 框選 / 合併 ====== */
let drag=null, marq=null, dragHappened=false;
let rz=null;                         // 正在拖角落改大小
let guides=[];                       // 目前要畫的引導線
const SNAP=6;                        // 弱磁吸半徑(px)，超過就掙脫
/* 格線：拖曳時先吸到 10px 的格子上，讓「大致對齊」不必手動瞄。
   對齊線（SNAP）在格線之後才套用，所以「跟另一塊對齊」永遠贏過「貼在格線上」——
   那是使用者真正想要的那一種對齊，格線只是沒有對齊對象時的底。 */
const GRID=10;
const onGrid=v=>Math.round(v/GRID)*GRID;

/* 量測所有 block 的實際尺寸（拖曳開始時做一次） */
function measure(){
  const m={}, k=scaleOf();
  for(const b of BLOCKS){
    const el=bEl(b.id);
    if(el){ const r=el.getBoundingClientRect(); m[b.id]={w:r.width/k,h:r.height/k}; }
    else m[b.id]={w:0,h:0};
  }
  return m;
}

/* 依候選線做弱磁吸；回傳 {dx,dy,guides} */
/* 10px 安全邊界：任何元素都不能超出 */
function clampAll(ids,sizes){
  if(!sizes) return;
  // 以整組外框計算，維持相對位置
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const id of ids){
    const b=BLOCKS.find(x=>x.id===id); if(!b) continue;
    const s=sizes[id]||{w:0,h:0};
    L=Math.min(L,b.x); T=Math.min(T,b.y);
    R=Math.max(R,b.x+s.w); B=Math.max(B,b.y+s.h);
  }
  if(L===Infinity) return;
  let ox=0, oy=0;
  if(L<PAD) ox=PAD-L;
  if(R+ox>CW-PAD) ox=Math.min(ox,(CW-PAD)-R);
  if(T<PAD_Y) oy=PAD_Y-T;
  if(B+oy>CH-PAD_Y) oy=Math.min(oy,(CH-PAD_Y)-B);
  if(ox||oy) for(const id of ids){
    const b=BLOCKS.find(x=>x.id===id); if(b){ b.x+=ox; b.y+=oy; }
  }
}

function snap(movingIds, sizes){
  const moving=movingIds.map(id=>BLOCKS.find(b=>b.id===id));
  // 移動群組的整體外框
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const b of moving){
    const s=sizes[b.id]||{w:0,h:0};
    L=Math.min(L,b.x); T=Math.min(T,b.y);
    R=Math.max(R,b.x+s.w); B=Math.max(B,b.y+s.h);
  }
  const gV=[{v:L,e:'l'},{v:(L+R)/2,e:'c'},{v:R,e:'r'}];   // 群組的垂直邊
  const gH=[{v:T,e:'t'},{v:(T+B)/2,e:'m'},{v:B,e:'b'}];

  // 目標線：其他 block 的邊/中線 + 格子邊界與中線
  // 對齊線用安全邊界，不用格子實際邊緣
  const tV=[{v:PAD},{v:CW/2},{v:CW-PAD}], tH=[{v:PAD},{v:CH/2},{v:CH-PAD}];
  for(const b of BLOCKS){
    if(movingIds.includes(b.id) || isOff(b)) continue;   // 藏起來的不當對齊線
    const s=sizes[b.id]||{w:0,h:0};
    tV.push({v:b.x},{v:b.x+s.w/2},{v:b.x+s.w});
    tH.push({v:b.y},{v:b.y+s.h/2},{v:b.y+s.h});
  }

  let bestX=null,bestY=null;
  for(const g of gV) for(const t of tV){
    const d=t.v-g.v;
    if(Math.abs(d)<=SNAP && (!bestX||Math.abs(d)<Math.abs(bestX.d))) bestX={d,line:t.v};
  }
  for(const g of gH) for(const t of tH){
    const d=t.v-g.v;
    if(Math.abs(d)<=SNAP && (!bestY||Math.abs(d)<Math.abs(bestY.d))) bestY={d,line:t.v};
  }
  const gl=[];
  if(bestX) gl.push({dir:'v',pos:bestX.line});
  if(bestY) gl.push({dir:'h',pos:bestY.line});
  return {dx:bestX?bestX.d:0, dy:bestY?bestY.d:0, guides:gl};
}

/* 只在目前格子內查找 block 元素（多格時 id 會重複出現在每一格） */
function bEl(id){ const c=cellEl(); return c?c.querySelector(`[data-b="${id}"]`):null; }
function scaleOf(){ return (cellEl()?cellEl().clientWidth:CW)/CW; }
/* 滑鼠座標 -> 排版座標（除以縮放比） */
function cellPt(e){
  const el=cellEl(); if(!el) return {x:0,y:0};
  const r=el.getBoundingClientRect(), k=scaleOf();
  return {x:(e.clientX-r.left)/k, y:(e.clientY-r.top)/k};
}
function blockAt(x,y,exceptId){
  // 由上往下找命中的 sku block
  for(let i=BLOCKS.length-1;i>=0;i--){
    const b=BLOCKS[i];
    if(b.kind!=='sku'||b.id===exceptId) continue;
    const el=bEl(b.id); if(!el) continue;
    const r=el.getBoundingClientRect(), c=cellEl().getBoundingClientRect(), k=scaleOf();
    const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
    if(x>=bx&&x<=bx+r.width/k&&y>=by&&y<=by+r.height/k) return b;
  }
  return null;
}

document.getElementById('grid').addEventListener('mousedown',e=>{
  const ce=e.target.closest('.cell'); if(!ce) return;
  const idx=+ce.dataset.cell;
  if(idx!==curCell){ saveCell(); loadCell(idx); selected.clear(); activeImg=null;
    CELLS.forEach((c,i)=>renderOne(i));
    renderPick();                   // 內容切換成這一格的
  }
  // 不論是否換格，按到任何格子都必定展開兩個窗口
  openPanels(true); renderLayers();
  if(!picked.size) return;
  if(e.target.closest('.tobtn')) return;   // 按鈕不觸發拖曳
  /* 拖角落＝改大小，不是搬位置。要在找 .blk 之前攔下來，不然它也算按在那一塊上，
     會同時開始搬移，變成一邊拉大一邊亂跑。 */
  const hz=e.target.closest('.rz');
  if(hz && ROLE!=='pm'){
    const b=BLOCKS.find(x=>x.id===hz.parentElement.dataset.b);
    if(b){
      const r=hz.parentElement.getBoundingClientRect(), k=scaleOf();
      rz={ id:b.id, corner:hz.dataset.corner, base:scaleBase(b),
           /* 對角那一點固定不動，量的是「游標離它多遠」的變化 —— 跟 PPT 一樣，
              拉哪一角就從那一角長出去。 */
           ax:(hz.dataset.corner.includes('e')?r.left:r.right),
           ay:(hz.dataset.corner.includes('s')?r.top:r.bottom),
           d0:0 };
      rz.d0=Math.hypot(e.clientX-rz.ax, e.clientY-rz.ay)/k || 1;
    }
    e.preventDefault(); e.stopPropagation();
    return;
  }
  const el=e.target.closest('.blk');
  const p=cellPt(e);
  if(el){
    const id=el.dataset.b;
    const blk=BLOCKS.find(x=>x.id===id);
    if(blk && blk.kind==='img'){
      // 點 PNG：立刻選為當前圖層並展開左右面板
      activeImg=id;
      openPanels(true);
      setTimeout(renderLayers,0);
    }
    if(!selected.has(id)){
      if(!e.shiftKey) selected.clear();
      selected.add(id);
    }else if(e.shiftKey){ selected.delete(id); }
    // 拖動所有已選 block —— PM 只能選，位置是設計的事
    if(ROLE!=='pm'){
      drag={start:p, ids:[...selected],
        orig:Object.fromEntries([...selected].map(i=>{const b=BLOCKS.find(x=>x.id===i);return [i,{x:b.x,y:b.y}]})),
        main:id, moved:false, sizes:null};
      renderCell(); drag.sizes=measure();
    }
    renderCell();
  }else{
    // 點格子空白處：取消框選並取消目前選中的 PNG 圖層
    if(!e.shiftKey) selected.clear();
    if(activeImg){ activeImg=null; stackUnder=[]; cycleIndex=0; setTimeout(renderLayers,0); }
    marq={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
    renderCell();
  }
  e.preventDefault();
});

addEventListener('mousemove',e=>{
  if(rz){
    const b=BLOCKS.find(x=>x.id===rz.id);
    if(b){
      const k=scaleOf();
      const d=Math.hypot(e.clientX-rz.ax, e.clientY-rz.ay)/k;
      let r=d/rz.d0;
      if(e.shiftKey) r=1+(r-1)*.35;        // 微調：同樣的手移距離只走三分之一
      setBlockScale(b, rz.base*r);
      holdPlace(b);                     // 拉過大小就釘住，別再被自動排版搬走
      dragHappened=true;
      renderOne(curCell,true);          // 尺寸變了要重量，不然把手停在舊位置
      paintHandles();
    }
    e.preventDefault();
    return;
  }
  if(drag){
    const p=cellPt(e), dx=p.x-drag.start.x, dy=p.y-drag.start.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2) drag.moved=true;
    /* 格線是主，對齊線是輔。
       量的是「主角那一塊」落在哪一格，整組平移同樣的量 —— 多選拖曳時彼此的
       相對位置一步都不會跑掉。按住 Alt 不吸格線，要微調的時候用。 */
    const o=drag.orig[drag.main] || drag.orig[drag.ids[0]];
    let gx=dx, gy=dy;
    if(!e.altKey && o){
      gx=onGrid(o.x+dx)-o.x;
      gy=onGrid(o.y+dy)-o.y;
    }
    for(const id of drag.ids){
      const b=BLOCKS.find(x=>x.id===id);
      b.x=drag.orig[id].x+gx; b.y=drag.orig[id].y+gy;
    }
    clampAll(drag.ids, drag.sizes);
    /* 弱磁吸只當「微調」用：吸完格線之後，如果離某條對齊線已經很近（FINE 以內），
       才讓它把最後那幾 px 補上。
       原本是對齊線說了算，但那等於格線白吸了 —— 版面上每一塊的邊和中線都是候選線，
       六個 px 內幾乎永遠找得到一條，於是不管怎麼拖都落在別人的邊上，
       格線一次都感覺不到。現在反過來：先站上格子，真的快對齊了才貼過去。 */
    guides=[];
    if(drag.sizes){
      const FINE=3;
      const sn=snap(drag.ids, drag.sizes);
      const ax=Math.abs(sn.dx)<=FINE?sn.dx:0, ay=Math.abs(sn.dy)<=FINE?sn.dy:0;
      if(ax||ay){
        for(const id of drag.ids){
          const b=BLOCKS.find(x=>x.id===id); b.x+=ax; b.y+=ay;
        }
        guides=sn.guides.filter(g=>(g.dir==='v'?ax:ay)!==0);
        clampAll(drag.ids, drag.sizes);
      }
    }
    // 合併預示
    const src=BLOCKS.find(x=>x.id===drag.main);
    let hit=null;
    if(src&&src.kind==='sku'&&drag.ids.length===1) hit=blockAt(p.x,p.y,src.id);
    drag.hit=hit;
    renderCell();
    if(hit){ const t=bEl(hit.id); if(t) t.classList.add('drop'); }
  }else if(marq){
    const p=cellPt(e); marq.x1=p.x; marq.y1=p.y;
    const c=cellEl().getBoundingClientRect();
    const L=Math.min(marq.x0,marq.x1),R=Math.max(marq.x0,marq.x1),
          T=Math.min(marq.y0,marq.y1),B=Math.max(marq.y0,marq.y1);
    selected.clear();
    const k=scaleOf();
    for(const b of BLOCKS){
      const el=bEl(b.id); if(!el) continue;
      const r=el.getBoundingClientRect();
      const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
      if(bx<R&&bx+r.width/k>L&&by<B&&by+r.height/k>T) selected.add(b.id);
    }
    renderCell();
    const m=document.getElementById('marquee'+curCell);
    if(m){ m.style.display='block'; m.style.left=L+'px'; m.style.top=T+'px';
           m.style.width=(R-L)+'px'; m.style.height=(B-T)+'px'; }
  }
});

/* ====== 滾輪：在游標下重疊的圖層之間循環 ====== */
/* 嵌在版面裡的畫布（?ui=stage）：滾輪是外面那張版的縮放，不是捲這個 iframe。
   不轉出去的話，滾輪會被 iframe 自己吃掉 —— 游標一移到格子上，縮放就失靈，
   而格子正好佔滿整張版，等於整片都不能縮放。
   疊在圖上時仍然先給「切換圖層」用（那是這裡本來就有的手勢），沒有圖才轉出去。 */
function relayWheel(e){
  if(!UI_STAGE) return false;
  e.preventDefault();
  try{ parent.postMessage({ stageWheel:{ deltaY:e.deltaY, x:e.screenX, y:e.screenY } }, '*'); }catch(_){}
  return true;
}

document.getElementById('grid').addEventListener('wheel',e=>{
  const ce=e.target.closest('.cell'); if(!ce){ relayWheel(e); return; }
  const idx=+ce.dataset.cell;
  if(idx!==curCell){ saveCell(); loadCell(idx); CELLS.forEach((c,i)=>renderOne(i)); renderPick(); renderLayers(); }
  if(!picked.size){ relayWheel(e); return; }
  const imgs=BLOCKS.filter(b=>b.kind==='img');
  if(!imgs.length){ relayWheel(e); return; }
  const hit=e.target.closest('.blk');
  // 游標下所有 img block（由 z 大到小）
  const p=cellPt(e), c=cellEl().getBoundingClientRect();
  const k=scaleOf();
  const under=imgs.filter(b=>{
    const el=bEl(b.id); if(!el) return false;
    const r=el.getBoundingClientRect();
    const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
    return p.x>=bx&&p.x<=bx+r.width/k&&p.y>=by&&p.y<=by+r.height/k;
  }).sort((a,b)=>b.z-a.z);
  if(!under.length){ activeImg=null; renderCell(); relayWheel(e); return; }
  e.preventDefault();
  const ids=under.map(b=>b.id).join(',');
  if(ids!==stackUnder.join(',')){ stackUnder=under.map(b=>b.id); cycleIndex=0; }
  else cycleIndex=(cycleIndex+(e.deltaY>0?1:-1)+under.length)%under.length;
  activeImg=stackUnder[cycleIndex];
  renderCell(); renderLayers();
},{passive:false});

/* 「最上面」按鈕 */
document.getElementById('grid').addEventListener('click',e=>{
  const btn=e.target.closest('[data-top]');
  if(btn){ e.stopPropagation(); bringTop(btn.dataset.top); }
});
/* 兩個窗口一律同進同退，不因格子有沒有內容而分開。
   各留各的：設計 沒有選商品面板，PM 沒有圖層面板（疊放順序是排版的事）。 */
let panelsOn=false;
function openPanels(on){
  if(UI_PANEL) on=true;                 // 只出借面板時，收起來就什麼都不剩了
  panelsOn=on;
  $('#panel').classList.toggle('on', on && ROLE!=='design');
  $('#lay').classList.toggle('on',   on && ROLE!=='pm');
}
function bringTop(id){
  const b=BLOCKS.find(x=>x.id===id); if(!b) return;
  const maxZ=Math.max(...BLOCKS.filter(x=>x.kind==='img').map(x=>x.z));
  if(b.z!==maxZ){ b.z=maxZ+1; normalizeZ(); }
  activeImg=id; renderCell(); renderLayers();
}
function normalizeZ(){
  BLOCKS.filter(b=>b.kind==='img').sort((a,b)=>a.z-b.z)
    .forEach((b,i)=>b.z=i+1);
}

/* ====== 右側圖層面板：顯示這個格子的圖層 ====== */
function renderLayers(){
  const box=$('#layers');
  // 藏起來的圖不列在圖層裡：它不在版上，談不上疊在誰上面（要找回來走右上角那顆 ＋）
  const imgs=liveBlocks().filter(b=>b.kind==='img').sort((a,b)=>b.z-a.z); // 上層在前
  if(!imgs.length){ box.innerHTML='<div class="empty-hint">尚未選商品</div>'; return; }
  box.innerHTML=imgs.map(b=>
    `<div class="lyr${activeImg===b.id?' on':''}" data-lyr="${b.id}" draggable="true">
       <span class="lgrip">☰</span>
       <span class="lthumb">${imgHTML(b.key)}</span>
       <span class="lname">${keyLabel(b.key)}</span>
       <span class="lz">z${b.z}</span>
       <button class="mini" data-top="${b.id}" style="margin:0">最上面</button>
     </div>`).join('');

  box.querySelectorAll('.lyr').forEach(el=>{
    el.onmouseenter=()=>{ if(!lyrDrag){ activeImg=el.dataset.lyr; renderCell(); markLayerActive(); } };
    el.onclick=()=>{ activeImg=el.dataset.lyr; renderCell(); markLayerActive(); };
  });
  box.querySelectorAll('[data-top]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); bringTop(b.dataset.top);
  });
}

/* ====== 圖層面板拖曳排序（Photoshop 式）====== */
let lyrDrag=null;
function initLayerDnD(){
  const box=$('#layers');
  box.addEventListener('dragstart',e=>{
    const it=e.target.closest('.lyr'); if(!it) return;
    lyrDrag=it; it.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',it.dataset.lyr);}catch(_){}
  });
  box.addEventListener('dragend',()=>{
    if(lyrDrag) lyrDrag.classList.remove('dragging');
    box.querySelectorAll('.lyr').forEach(x=>x.classList.remove('over'));
    lyrDrag=null;
  });
  box.addEventListener('dragover',e=>{
    e.preventDefault();
    const it=e.target.closest('.lyr');
    box.querySelectorAll('.lyr').forEach(x=>x.classList.remove('over'));
    if(it&&it!==lyrDrag) it.classList.add('over');
  });
  box.addEventListener('drop',e=>{
    e.preventDefault();
    const tgt=e.target.closest('.lyr');
    if(!tgt||!lyrDrag||tgt===lyrDrag) return;
    const items=[...box.querySelectorAll('.lyr')];
    const from=items.indexOf(lyrDrag), to=items.indexOf(tgt);
    if(from<to) tgt.after(lyrDrag); else tgt.before(lyrDrag);
    applyLayerOrder();
  });
}
/* 面板由上到下 = z 由大到小 */
function applyLayerOrder(){
  const ids=[...$('#layers').querySelectorAll('.lyr')].map(el=>el.dataset.lyr);
  const n=ids.length;
  ids.forEach((id,i)=>{ const b=BLOCKS.find(x=>x.id===id); if(b) b.z=n-i; });
  renderCell(); renderLayers();
}

/* ====== 單塊的大小：放大、縮小、回自動 ======================================
   每一種零件的「大小」不是同一件事，所以存的地方也不同：
     圖  → b.w（px 寬，高是等比跟著跑的）
     價格→ b.fsFix（比例。價格本來就有一套 fsFix > 轉盤 > 同組 > 自動，
            這裡就是把最前面那一級寫進去）
     其他→ b.sc（比例，CSS 那邊 --bs 乘上去）
   共通的一條規矩：這些欄位只給人寫，autoSpace 一律不准回頭寫它們 ——
   排版讀自己上一輪的輸出當輸入，就會每次都要多排一次才收斂（見 priceReq）。 */
const SC_STEP=1.08, SC_MIN=.4, SC_MAX=3;
const clampSc=v=>Math.min(SC_MAX,Math.max(SC_MIN,v));

/* 這一塊現在是幾倍大（1＝沒調過）。給工具列顯示，也給 ＋／− 當起點。 */
function scaleOfBlock(b){
  if(b.kind==='img')   return b.w0 ? b.w/b.w0 : 1;
  if(b.kind==='price') return b.fsFix || 0;      // 0＝還是自動，沒有固定倍率
  return b.sc || 1;
}
/** 直接設定倍率（拖角落用）。scaleBlock 是乘的，一路拖會愈乘愈歪 ——
    拉大小要的是「從按下去那一刻的倍率算到現在」，所以這裡收絕對值。 */
function setBlockScale(b, s){
  const v = clampSc(s);
  if(b.kind==='img'){ if(!b.w0) b.w0=b.w; b.w=+(b.w0*v).toFixed(1); return; }
  if(b.kind==='price'){ b.fsFix=+v.toFixed(3); return; }
  b.sc=+v.toFixed(3);
}
/** 按下角落那一刻它是幾倍大。價格的 0 代表「還在自動」，要換算成它現在真正的倍率。 */
function scaleBase(b){
  const s=scaleOfBlock(b);
  if(b.kind==='price') return s || priceFsRaw(b) || 1;
  return s || 1;
}

function scaleBlock(b, mul){
  if(b.kind==='img'){
    if(!b.w0) b.w0=b.w;                          // 第一次調就記下原本多寬，才回得去
    b.w = +(b.w0 * clampSc((b.w/b.w0) * mul)).toFixed(1);
    return;
  }
  if(b.kind==='price'){
    /* 起點是它「現在看起來多大」（含轉盤、同組），不是基準 1 ——
       不然轉盤調過之後按一下 ＋，字會先跳回 52 再放大。 */
    b.fsFix = +clampSc((b.fsFix || priceFsRaw(b) || 1) * mul).toFixed(3);
    return;
  }
  b.sc = +clampSc((b.sc||1) * mul).toFixed(3);
}
function resetBlock(b){
  if(b.kind==='img'){ if(b.w0){ b.w=b.w0; delete b.w0; } return; }
  if(b.kind==='price'){ delete b.fsFix; return; }
  delete b.sc;
}
function selBlocks(){
  /* PM 只能選和看：大小、刪掉都是排版的事（跟拖曳同一條線）。擋在這裡而不是
     只擋按鈕 —— 按鈕會不會畫出來是版面的事，能不能動到版面是規則的事。 */
  if(ROLE==='pm') return [];
  return [...selected].map(id=>BLOCKS.find(b=>b.id===id)).filter(Boolean);
}

/* 自己動過大小的那一塊，就從自動排版手上接管過來（跟拖過一次是同一個意思）。
   不釘住的話，改完大小 renderOne(force) 會重跑一次 autoSpace，把價格重新靠右下
   對齊、把圖重新讓開 —— 看起來就是「我只是想放大一點，結果整格跳了位置」。
   誰動過誰負責：手動調過的位置和大小都留在原地，沒動過的照舊自動排。 */
function holdPlace(b){ if(b.kind==='price') b.placed=true; }

function scaleSelected(mul){
  const sel=selBlocks(); if(!sel.length) return;
  sel.forEach(b=>{ scaleBlock(b,mul); holdPlace(b); });
  renderOne(curCell,true); reportBoard();
}
function resetSelected(){
  const sel=selBlocks(); if(!sel.length) return;
  sel.forEach(resetBlock);
  renderOne(curCell,true); reportBoard();
}

/* ====== 刪掉／找回來 ========================================================
   刪掉不是真的丟掉：記在格子的 off 名冊上，版上就不畫了。右上角那顆 ＋
   列的就是這份名冊，打勾就回到原來的位置 —— 位置、調過的大小都還在，
   因為那一塊從頭到尾沒有離開過 c.blocks。 */
function labelOf(b){
  if(b.kind==='img')   return '商品圖　'+keyLabel(b.key);
  if(b.kind==='name')  return '品名　'+(b.text||'');
  if(b.kind==='brand') return '品牌　'+(b.name||'');
  if(b.kind==='model') return '機型　'+(b.text||'');
  if(b.kind==='spec')  return '規格　'+(b.spec||'');
  if(b.kind==='price') return '價格　'+(b.price!=null?'$'+b.price:'');
  return 'SKU　'+((b.vs&&b.vs.length)?b.vs.map(v=>v.sku).join(' / '):'');
}
function hideSelected(){
  const sel=selBlocks(); if(!sel.length) return;
  const off=offMap();
  sel.forEach(b=>{ if(b.uid) off[b.uid]=labelOf(b); });
  selected.clear(); activeImg=null;
  /* 少了一塊，右下那一疊要重新靠齊、圖要重新讓開 —— 強制重排一次。 */
  renderOne(curCell,true); renderLayers(); reportBoard();
}
function restoreUid(uid){
  delete offMap()[uid];
  renderOne(curCell,true); renderLayers(); reportBoard();
}

/* 右上角那顆 ＋：藏了東西才出現，沒藏就不佔畫面。
   只要這一格藏著東西就一直在，不管現在有沒有在編輯那一格 —— 不然「東西不見了」
   跟「東西被我收起來了」在畫面上長得一模一樣，得先點進去才分得出來。
   沒在編輯的時候畫布是 pointer-events:none，那一下會先幫你打開這一格，再點才展開清單。 */
function renderRestore(){
  const box=$('#restore'); if(!box) return;
  const off=offMap(), keys=Object.keys(off);
  const el=cellEl();
  if(!keys.length || !el || ROLE==='pm'){
    box.classList.remove('on','open'); box.innerHTML=''; return;
  }
  box.innerHTML=
    `<button class="rbtn" data-rtoggle>＋<span class="rn">${keys.length}</span></button>`+
    `<div class="rlist"><div class="rhead">刪掉的，打勾放回來</div>`+
    keys.map(k=>`<label class="ritem"><input type="checkbox" data-ruid="${k}"><span>${off[k]}</span></label>`).join('')+
    `</div>`;
  /* 位置：格子右上角，座標以 #wrap 為基準（跟 #props 同一套）。
     這裡本來跟外面那層的紅色未處理數字撞在一起 —— 兩顆數字長得像、意思完全不同
     （一個是「還有幾則沒處理」，一個是「藏了幾個零件」）。讓開的是紅點：
     它是外面貼上去的提示，這顆 ＋ 才是版面自己的東西。 */
  const wrapR=$('#wrap').getBoundingClientRect(), r=el.getBoundingClientRect();
  box.style.left=(r.right-wrapR.left-8)+'px';
  box.style.top =(r.top-wrapR.top+8)+'px';
  box.style.transform='translateX(-100%)';
  box.classList.add('on');

  box.querySelector('[data-rtoggle]').onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    box.classList.toggle('open');
  };
  box.querySelectorAll('[data-ruid]').forEach(inp=>{
    inp.onmousedown=ev=>ev.stopPropagation();
    inp.onchange=()=>restoreUid(inp.dataset.ruid);
  });
}

/* ====== 右側面板頂部：依選取的元素顯示可切換的屬性 ====== */
function renderProps(){
  const box=$('#props');
  const sel=selBlocks().filter(b=>!isOff(b));
  /* 大小和刪除是排版的事，PM 只能看和選（跟拖曳同一條線）。
     黑色／劃線本來也只有設計動得到，一起收在這個判斷裡。 */
  if(!sel.length || ROLE==='pm' || !STAGE_EDIT){ box.classList.remove('on'); box.innerHTML=''; reportPropsBar(); return; }
  const specs=sel.filter(b=>b.kind==='spec');
  const prices=sel.filter(b=>b.kind==='price');

  /* 選一塊才報幾成大；選一群的時候每塊倍率不同，報一個數字會是騙人的。 */
  let now='';
  if(sel.length===1){
    const s=scaleOfBlock(sel[0]);
    now = s ? Math.round(s*100)+'%' : '自動';
  }
  const changed = sel.some(b=>scaleOfBlock(b) && scaleOfBlock(b)!==1);

  let h=`<button class="pbtn sq" data-size="down" title="縮小">−</button>`
       +`<span class="pnum">${now}</span>`
       +`<button class="pbtn sq" data-size="up" title="放大">＋</button>`
       +`<button class="pbtn${changed?'':' dis'}" data-size="reset">回自動</button>`;
  if(specs.length){
    const allDark=specs.every(b=>b.dark);
    h+=`<button class="pbtn${allDark?' act':''}" data-prop="dark">黑色</button>`;
  }
  if(prices.length){
    const allX=prices.every(b=>b.cross);
    h+=`<button class="pbtn${allX?' act':''}" data-prop="cross">劃線</button>`;
  }
  h+=`<button class="pbtn danger" data-kill="1" title="刪掉（Delete）">刪掉</button>`;
  box.innerHTML=h;
  box.classList.add('on');

  // 定位：所有選中元素的外框上緣中點（座標以 #wrap 為基準）
  const wrapR=$('#wrap').getBoundingClientRect();
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const b of sel){
    const el=bEl(b.id); if(!el) continue;
    const r=el.getBoundingClientRect();
    L=Math.min(L,r.left); R=Math.max(R,r.right);
    T=Math.min(T,r.top);  B=Math.max(B,r.bottom);
  }
  if(L===Infinity){ box.classList.remove('on'); return; }
  const cx=(L+R)/2-wrapR.left;
  const bh=box.offsetHeight||30;      // 讀取時強制 reflow，取得真實高度
  /* 選到最上面那一排（品牌、品名）時，工具列擺上面就出了畫面外 ——
     拼板那一格是 overflow:hidden，出去就等於整條不見了。頂不住就改掛下面。 */
  const up=T-wrapR.top-bh-9, below=B-wrapR.top+9;
  box.style.left=cx+'px';
  box.style.top=(up<0?below:up)+'px';
  box.classList.toggle('under', up<0);
  box.style.transform='translateX(-50%)';

  box.querySelectorAll('[data-prop]').forEach(btn=>btn.onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();   // 不觸發格子的拖曳/取消選取
    const k=btn.dataset.prop;
    const targets = k==='dark'?specs:prices;
    const turnOn = !targets.every(b=>b[k]);
    targets.forEach(b=>b[k]=turnOn);
    renderCell();
  });
  box.querySelectorAll('[data-size]').forEach(btn=>btn.onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const k=btn.dataset.size;
    if(k==='reset') resetSelected();
    else scaleSelected(k==='up'?SC_STEP:1/SC_STEP);
  });
  box.querySelector('[data-kill]').onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    hideSelected();
  };
  reportPropsBar();
}

/* 工具列住在畫布 iframe 裡，便利貼貼在外面那一層 —— 誰疊在誰上面是 iframe
   整塊決定的，這裡面寫多少 z-index 都壓不過外面那張紙。所以把工具列的位置
   報上去，讓外面把「剛好壓在上面」的那幾張讓開。報的是 iframe 自己的視窗座標，
   外面加上 iframe 的位置就對得起來（iframe 本身沒有被縮放）。 */
function reportPropsBar(){
  if(!UI_STAGE || window.parent===window) return;
  const box=$('#props');
  let r=null;
  if(box.classList.contains('on')){
    const b=box.getBoundingClientRect();
    r={left:b.left,top:b.top,right:b.right,bottom:b.bottom};
  }
  try{ parent.postMessage({ propsBar:r }, '*'); }catch(_){}
}

function markLayerActive(){
  $('#layers').querySelectorAll('.lyr').forEach(el=>
    el.classList.toggle('on', el.dataset.lyr===activeImg));
}

addEventListener('mouseup',e=>{
  /* 放手才回報：拖的過程每一格都 reportBoard() 的話，外面那層會被存檔洗版。
     renderOne(force) 跟 ＋／− 那條路一樣，重新量一次尺寸再畫。 */
  if(rz){ rz=null; renderOne(curCell,true); reportBoard(); return; }
  if(drag){
    const p=cellPt(e);
    const src=BLOCKS.find(x=>x.id===drag.main);
    if(drag.moved && src && src.kind==='sku' && drag.ids.length===1){
      const tgt=blockAt(p.x,p.y,src.id);
      if(tgt){
        // 合併：把 src 的 rows 併入 tgt，依 SKU 排序後重算字串
        tgt.vs = [...tgt.vs,...src.vs].sort((a,b)=>a.sku.localeCompare(b.sku));
        BLOCKS = BLOCKS.filter(b=>b.id!==src.id);
        selected.clear(); selected.add(tgt.id);
      }
    }
    if(drag.moved){
      dragHappened=true;
      /* 拖過的價格就釘在你放的地方 —— 之後 autoSpace 不再把它排回右下（見那邊的
         placed 分流）。沒拖過的價格照舊自動貼右下、自動縮字。重選商品會整組重建，
         placed 也跟著沒了，回到全自動。 */
      for(const id of drag.ids){
        const b=BLOCKS.find(x=>x.id===id);
        if(b&&b.kind==='price') b.placed=true;
      }
    }
    drag=null; guides=[]; renderCell();
  }
  if(marq){
    const big=Math.abs(marq.x1-marq.x0)>3||Math.abs(marq.y1-marq.y0)>3;
    dragHappened=big;    // 只有真的拖出範圍才算拖曳；單純點一下要能開窗
    marq=null; renderCell();
  }
});

/* ====== 選商品清單：搜尋過濾，就地成群顯示 ====== */
function renderPick(){
  const kw=q.trim().toLowerCase();
  const gs = groups().map(g=>({name:g.name,
      rows:g.rows.filter(r=> !kw || g.name.toLowerCase().includes(kw)
        || r.spec.toLowerCase().includes(kw) || r.sku.includes(kw))}))
    .filter(g=>g.rows.length);
  if(!gs.length){ $('#panePick').innerHTML='<div class="empty-hint">沒有符合的商品</div>'; return; }
  $('#panePick').innerHTML = gs.map(g=>
    `<div class="grp">${g.name}</div>`+g.rows.map(r=>
      `<label class="item"><input type="checkbox" data-sku="${r.sku}" ${picked.has(r.sku)?'checked':''}>
        <b>${r.spec||'—'}</b>${r.color?`<span style="color:#666">${r.color}</span>`:''}<span class="var">${r.sku}　$${r.price.toLocaleString()}</span></label>`
    ).join('')).join('');
  $('#panePick').querySelectorAll('input').forEach(cb=>cb.onchange=e=>{
    const row=ROWS.find(r=>r.sku===e.target.dataset.sku);
    if(!row) return;
    if(e.target.checked){
      const cur=ROWS.find(r=>picked.has(r.sku));
      if(cur && cur.name!==row.name){ picked.clear(); setTimeout(renderPick,0); }
      picked.add(row.sku);
    } else picked.delete(row.sku);
    renderCell();
  });
}

  $('#stress').onclick=()=>{
    for(let i=0;i<30;i++) ROWS.push({name:'iPhone 17 Pro Max',spec:'2TB',color:['黑','白','橘'][i%3],sku:'21567'+(60+i),price:i%3===0?68900:69900});

  $('#paste').onclick=()=>{

      const m=l.split(/[\t]+|\s{2,}|\s(?=\S+\s+\d{6,}\s+\d+$)/).map(x=>x.trim()).filter(Boolean);
      const parts = m.length>=4 ? m : l.split(/\s+/);
      if(parts.length<4) return;
      const price=+parts[parts.length-1], sku=parts[parts.length-2];
      let rest=parts.slice(0,parts.length-2);

    box.value=''; box.style.display='none'; reindex(); refreshAll(); reportCatalogue();
  };
}
function reindex(){ ROWS.forEach((r,i)=>r._i=i); }

/* ====== 跟上層（落版）的往來 ==================================================
   這一格是哪一版的哪一格，由上層決定；內容也存在上層那份檔期裡。
   落版上那一格裡跑的是這一頁的 ui=stage，旁邊那塊面板是這一頁的 ui=panel —
   同一支程式的兩個面向。面板挑了什麼，經由上層轉給畫布；畫布排好的樣子往上
   報一份，存進檔期。沒有縮圖這回事：看到的那一格就是畫布本人。 */
const CELL_ID = PICK_Q.get('cell') || '';
const UI_SRC  = UI_STAGE ? 'stage' : (UI_PANEL ? 'panel' : 'full');

function boardState(){
  saveCell();
  const c = cell(); if(!c) return null;
  /* v 是版本章。2 ＝ 座標已經是「照真實尺寸」那一套；3 ＝ 價格那一組是照修好的
     規則排的（縮放只做一遍、貼底對的是看得到的數字）。比 3 舊的讀進來重排一次
     （見 restoreBoard），蓋了章就不會再重排第二次。
     nPrice／wantFs 是報給上層分組用的：這一格有幾個價格、自己需要縮到多少。
     上層收齊同一組的 wantFs 取最小再廣播回來，同組才會一樣大。 */
  return { v:3, picked:[...c.picked], blocks:c.blocks, layoutKey:c.layoutKey,
           img: c.img || {},          // 換過的商品圖：只有網址，不是圖本身
           off: c.off || {},          // 刪掉的零件（uid → 名字），右上角那顆 ＋ 列的就是它
           nPrice: priceCount(c.blocks, c.off), wantFs: priceWanted };
}
let reportTimer = 0;
function reportBoard(){
  if(window.parent === window) return;          // 單獨開檔就什麼都不必報
  clearTimeout(reportTimer);
  // 拖曳中每一格畫面都會叫一次，等手停下來再報一次就好
  reportTimer = setTimeout(()=>{
    try{ parent.postMessage({ boardCell:CELL_ID, src:UI_SRC, state:boardState() }, '*'); }
    catch(_){}
  }, 60);       // 勾了就要看到，別讓上面那張版慢半拍
}
function restoreBoard(s){
  if(!s) return;
  picked = toSkus(s.picked);        // 舊檔存的是列號，換算成 SKU
  BLOCKS = s.blocks||[];
  layoutKey = s.layoutKey||'';
  if(cell()) cell().img = s.img || {};      // 換過的商品圖跟著這一格回來
  if(cell()) cell().off = s.off || {};      // 刪掉的也跟著回來（否則一重開就全部復活）
  ensureUids(BLOCKS);                       // 舊檔沒有 uid，補一次才認得出誰被刪了
  /* 舊檔的座標存的是「每一格都 540 寬」那套；現在每一格照自己的實際尺寸開
     座標系，兩套之間差一個等比例（寬高差的是同一個 k —— 舊的 CH 也是照同一個
     長寬比推出來的）。轉一次就好，轉完 boardState() 會蓋上 v:2。
     沒帶尺寸進來（單獨開這一頁）就別動它，不然會照著假的比例縮。 */
  if(!(s.v >= 2) && CM_W && CW !== LEGACY_CW){
    const k = CW / LEGACY_CW;
    BLOCKS.forEach(b => { b.x = (+b.x || 0) * k; b.y = (+b.y || 0) * k; });
  }
  /* v3 以前存的 b.x/b.y 是「縮放做了兩遍」那一版算出來的：欄跟欄之間被撐開、
     整疊的高度算錯。載進來如果不重排就會原樣照搬 —— 「一開始看起來就是低的、
     兩個價格中間空一大塊」講的就是這個，因為 autoSpace 只在重建或強制時才跑。
     只重排右下那一組（有欄號的），品名和商品圖的手動位置不動。 */
  if(!(s.v >= 3)) CELLS.forEach(c => { if(c) c.respace = true; });
  /* 舊版排的版沒有欄號，價格是按估算的字寬硬擺的，兩個價格會疊在一起。
     認得出是舊的就重排一次 — 那一版的手動位置留不住，但至少讀得出來。 */
  if(oldLayout(BLOCKS)) layoutKey='';
  saveCell();
  selected.clear();
  refreshAll();
}

/* ====== 鍵盤 ==============================================================
   這一頁本來一個 keydown 都沒有（畫布上沒有東西要打字）。加了刪除就非加不可，
   而且 Ctrl+Z 一定要一起處理：拼板那一格是 iframe，焦點在裡面的時候
   keydown 根本傳不到主程式那一層 —— 刪得掉、按 Z 卻沒反應是最嚇人的組合。
   刪除本身早就是一步歷史了（主程式收到畫布回報就 commitAction），
   這裡只是把「按鍵在誰身上」這件事接回去。 */
addEventListener('keydown', e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod && (e.key==='z'||e.key==='Z'||e.key==='y'||e.key==='Y')){
    if(window.parent===window) return;            // 單獨開這一頁就沒有上一層可以問
    e.preventDefault();
    const redo = (e.key==='y'||e.key==='Y') || e.shiftKey;
    try{ parent.postMessage({ boardCell:CELL_ID, boardHistory: redo?'redo':'undo' }, '*'); }catch(_){}
    return;
  }
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){
    if(ROLE==='pm' || !STAGE_EDIT || !selected.size) return;
    e.preventDefault();
    hideSelected();
  }
});

const padEl=document.getElementById('pad');
padEl.oninput=()=>{
  PAD=+padEl.value;
  document.getElementById('padv').textContent=PAD+' px';
  document.documentElement.style.setProperty('--pad',PAD+'px');
  // 邊界變大時，把已經超出的元素拉回來
  CELLS.forEach((c,i)=>{
    const bs = (c===cell())?BLOCKS:c.blocks;
    const el=document.getElementById('cell'+i);
    if(!el||!bs.length) return;
    const k=(el.clientWidth||CW)/CW;
    bs.forEach(b=>{
      const n=el.querySelector(`[data-b="${b.id}"]`);
      const w=n?n.getBoundingClientRect().width/k:0;
      const h=n?n.getBoundingClientRect().height/k:0;
      b.x=Math.max(PAD,Math.min(b.x,CW-PAD-w));
      b.y=Math.max(PAD,Math.min(b.y,CH-PAD-h));
    });
  });
  CELLS.forEach((c,i)=>renderOne(i));
};

document.getElementById('gapply').onclick=()=>{
  const c=Math.max(1,Math.min(8,+document.getElementById('gcols').value||1));
  const r=Math.max(1,Math.min(8,+document.getElementById('grows').value||1));
  document.getElementById('gcols').value=c; document.getElementById('grows').value=r;

  const cw = c<=1?540 : c===2?420 : c===3?330 : c===4?270 : 230;
  document.documentElement.style.setProperty('--cw',cw+'px');
  document.documentElement.style.setProperty('--ch',Math.round(cw*420/540)+'px');
  document.documentElement.style.setProperty('--cs',(cw/540).toFixed(4));
  saveCell();
  makeCells(c,r);
  loadCell(curCell);
  CELLS.forEach((x,i)=>renderOne(i));
};

/* ====== 價格拖曳壓力測試（看得到的那顆）====================================
   headless 的 fuzzer 是給機器對數字用的；這顆是給人看的：就在目前這一格裡，
   一步一步把價格釘到隨機位置、轉盤忽大忽小、偶爾放開一個回自動，你就盯著看
   「拖過釘住、沒拖的自動貼右下、放大凸出就夾回邊界」到底對不對。右上角三盞燈
   每一步亮一次：定位穩不穩、釘住的有沒有超界、自動那排有沒有溢出 —— 綠＝對。
   再按一次停。純 dev 工具，嵌在落版裡也不礙事（那邊 topbar 看不到它）。 */
let stressTimer=0;
function stressHud(){
  let h=document.getElementById('stresshud');
  if(!h){ h=document.createElement('div'); h.id='stresshud';
    h.style.cssText='position:fixed;right:14px;top:60px;z-index:95;width:224px;background:#111;color:#fff;'
      +'font:inherit;font-size:12px;line-height:1.6;padding:10px 12px;border-radius:10px;'
      +'box-shadow:0 6px 24px rgba(0,0,0,.3)';
    document.body.appendChild(h); }
  return h;
}
const stressLamp=ok=>`<span style="color:${ok?'#37d67a':'#ff5b5b'}">●</span>`;
/* 三個不變量：定位再排一次不變、釘住的在界內、自動那排不溢出。 */
function stressCheck(){
  const q=id=>cellEl().querySelector(`[data-b="${id}"]`);
  const ps=BLOCKS.filter(b=>b.kind==='price');
  let inb=true, ov=false;
  for(const p of ps){ const n=q(p.id); if(!n) continue;
    if(p.placed){ if(p.x<PAD-1||p.x+n.offsetWidth>CW-PAD+1||p.y<PAD_Y-1||p.y+n.offsetHeight>CH-PAD_Y+1) inb=false; }
    else if(p.x+n.offsetWidth>CW-PAD+1) ov=true;
  }
  /* 「再排一次不變」要留 1px 容差：量測→定位→再量測本來就有 getComputedStyle／
     offsetWidth 的次像素捨入，那不是版位在跳，是浮點雜訊。>1px 才算真的不穩。 */
  const pos=()=>BLOCKS.map(b=>({x:b.x,y:b.y}));
  const before=pos(); renderOne(curCell,true); const after=pos();
  const stable=before.every((p,i)=>Math.abs(p.x-after[i].x)<1&&Math.abs(p.y-after[i].y)<1);
  return { stable, inb, noov:!ov };
}
let stressFlash=null;
function stressStep(){
  const ps=BLOCKS.filter(b=>b.kind==='price');
  if(!ps.length) return '這一格沒有價格';
  const r=Math.random(); let msg; stressFlash=null;
  if(r<.5){                                   // 釘一個到隨機位置（故意偶爾擺出界）
    const p=ps[Math.floor(Math.random()*ps.length)];
    p.placed=true;
    p.x=Math.round(PAD-20+Math.random()*(CW-2*PAD+40));
    p.y=Math.round(PAD_Y-20+Math.random()*(CH-2*PAD_Y+40));
    stressFlash=p.id; msg=`釘住 ${p.id} → 丟到隨機位置`;
  }else if(r<.8){                             // 轉盤忽大忽小
    const px=[0,64,88,120][Math.floor(Math.random()*4)];
    applyType({pricePx:px}); msg=`轉盤字級 → ${px||'自動'}`;
  }else{                                      // 放開一個回自動
    const placed=ps.filter(p=>p.placed);
    if(placed.length){ const p=placed[Math.floor(Math.random()*placed.length)];
      p.placed=false; msg=`放開 ${p.id}（回自動貼右下）`; }
    else msg='（目前沒有釘住的可放開）';
  }
  renderOne(curCell,true);
  return msg;
}
function runPriceStress(){
  const btn=document.getElementById('stressDrag');
  if(stressTimer){ clearTimeout(stressTimer); stressTimer=0;
    btn.textContent='壓力測試：價格拖曳';
    const h=document.getElementById('stresshud'); if(h) h.style.opacity='.45';
    return;
  }
  $('#side').classList.remove('on');           // 收起後台，畫布整個露出來
  // 這一格沒有多價格商品就先鋪一個：iPhone 17 Pro Max 有三個價格，看得出分流
  if(BLOCKS.filter(b=>b.kind==='price').length<2){
    picked=new Set(ROWS.filter(r=>r.name==='iPhone 17 Pro Max').slice(0,6).map(r=>r.sku));
    layoutKey=''; PRICE_PX=0; GROUP_FS=0; buildBlocks(); saveCell(); renderOne(curCell,true);
  }
  btn.textContent='停止壓力測試';
  const hud=stressHud(); hud.style.opacity='1';
  let step=0, fails=0;
  const tick=()=>{
    step++;
    const msg=stressStep();
    const c=stressCheck();
    if(!(c.stable&&c.inb&&c.noov)) fails++;
    if(stressFlash){ const n=cellEl().querySelector(`[data-b="${stressFlash}"]`);
      if(n){ n.style.boxShadow='0 0 0 3px #0a84ff'; setTimeout(()=>{ if(n) n.style.boxShadow=''; }, 520); } }
    hud.innerHTML=`<b>價格拖曳壓力測試</b><br>第 ${step} 步：${msg}<br>`
      +`${stressLamp(c.stable)} 定位穩定　${stressLamp(c.inb)} 釘住在界內<br>`
      +`${stressLamp(c.noov)} 自動不溢出　　累計問題 <b>${fails}</b>`;
    stressTimer=setTimeout(tick, 850);
  };
  tick();
}
document.getElementById('stressDrag').onclick=runPriceStress;

document.documentElement.style.setProperty('--pad','10px');
applyRole(ROLE);
initLayerDnD();
makeCells(1,1); loadCell(0);
fitStage();                    // 畫布模式：先照這一格的大小把自己縮好
refreshAll();
if(UI_PANEL) openPanels(true);
// 上層在 load 之後才送 restore，這句只是告訴它「我可以收了」
if(window.parent !== window){
  try{ parent.postMessage({ boardCell:CELL_ID, src:UI_SRC, ready:true }, '*'); }catch(_){}
}

/* 價格用的 Anton 是網路字型，而且是 display=swap —— 先用替代字畫、載好再換。
   替代字比 Anton 寬得多，所以在它載好之前量到的文字寬是錯的（偏寬），
   整欄靠右對齊就會被推到偏左的位置；載好之後版面不會自己重量，那個位置就留著。
   同樣的操作有時偏右有時偏左，差別只在「那一刻字型載到了沒」。
   等它真的到了，重量一次 —— 只重量，不重建：清 layoutKey 會整組 block 重生，
   連品名和商品圖被搬到哪裡都一起還原，那是連手動排的版一起賠掉。 */
whenPriceFont().then(()=>{
  if(!CELLS.length) return;
  CELLS.forEach(c=>{ if(c) c.respace = true; });
  refreshAll();
  reportBoard();          // 位置變了要讓上層存下來，不然重開又跳回舊的
}).catch(()=>{});
</script>
