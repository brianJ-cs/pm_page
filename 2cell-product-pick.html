function loadCell(i){
  if(cell(i)===undefined) return;
  curCell=i; picked=cell().picked; BLOCKS=cell().blocks; layoutKey=cell().layoutKey;
}
function saveCell(){ if(cell()){ cell().picked=picked; cell().blocks=BLOCKS; cell().layoutKey=layoutKey; } }
let selected = new Set();     // 選中的 block id
let layoutKey = '';           // 資料簽章，變了才重排

function sig(){ return [...picked].sort().join(','); }

function buildBlocks(){
  const sel = ROWS.filter(r=>picked.has(r.sku));
  if(!sel.length){ BLOCKS=[]; return; }
  const name = sel[0].name;
  /* 照 pickKey 收，不是照商品名 —— 勾選那條已經擋住了，這裡是給**這條規矩之前
     存下來的格子**的最後一道：那些格子裡真的躺著兩個品牌的 sku，照名字收會把
     兩家一起排進來，然後掛上第一列那一家的 logo。 */
  const key = pickKey(sel[0]);
  const rows = sel.filter(r=>pickKey(r)===key);
  const cols = buildCols(rows);
  const single = cols.length===1;
  /* 排之前先把邊界和字級對到現在這個框 —— MARGIN/MARGIN 是快取下來的值，而框的大小
     可能在這之間換過（上層在算得出格子多大之後才送 stageCm 過來）。
     量到過的症狀：框已經是 813 高，版面卻還是照 420 排的，整格內容擠在上半部。 */
  applyMetrics();
  let id=0;
  const B=[];
  /* 三個落點，四邊一律留 MARGIN（談定的）：
       左上　　＝ 品牌／品名／機型，往下疊
       中間偏左＝ 商品圖，垂直居中、由左往右排開
       右下　　＝ 規格／SKU／價格，一欄一組，整組往右下角靠到底
     每一段都自己夾在邊界裡，所以不管格子多扁多瘦都不會有東西壓到邊界。
     字級和行距的數字（30、34、26、24、58、170）還是原版那一套，用 ty() 換算 ——
     那些是「多大」，不是「在哪」；在哪由這三個落點決定。 */
  /* 品牌和型號問的是**這一群裡的第一列**，不是商品名 —— 同名跨品牌的時候
     （空調就是），照商品名查會查到別人的牌子。挑貨一次只挑得到同一個商品、
     同一個品牌的那幾個規格（pickKey），所以第一列就代表這一群。 */
  const brand = rowBrand(rows[0]), bimg = bimgOf(rows[0]);
  const hasBrand = !!(brand || bimg);

  // 左上
  /* hres＝這一塊當初留了多少位子。比例是量出來的（可能晚一步才知道），
     所以要留著證據，之後才對得出差多少（見 refitBrandStack）。 */
  if(hasBrand) B.push({id:'b'+id++,kind:'brand',name,brand,bimg,x:MARGIN,y:MARGIN,
                       hres:brandSlotH(bimg)+8});
  /* 商標底下留的位子＝那張圖真正畫多高 ＋ 8（原本寫死 34＝26＋8，26 是「所有商標
     都一樣高」那個年代的高度）。方形的商標會長到 56，還照 34 留位子的話品名
     會壓在它身上 —— 正在編的那一格 spreadStack 會量完再推開，但別的格子不會量。 */
  const nameY = hasBrand?MARGIN+ty((brandSlotH(bimg) + 8) * SZ_BRAND):MARGIN;
  B.push({id:'b'+id++,kind:'name',text:name,x:MARGIN,y:nameY});
  const mdl=rowModel(rows[0]);
  let ly = nameY + ty(34 * SZ_NAME);
  let modelY = null;
  if(mdl){ modelY = ly;
           B.push({id:'b'+id++,kind:'model',text:mdl,name,x:MARGIN,y:ly});
           ly += ty(26 * SZ_MODEL); }
  /* 只有一個價格時，SKU 跟機型排在一起（左邊那一疊，機型在上、SKU 在下）——
     真正的 DM 就是這樣排的（見 ref.png）：右下角只留價格，左上角把「這是什麼」
     一次講完。多個價格就不能這樣：那時候 SKU 說的是「這個號碼配這個價」，
     一定要站在它自己那個價格上面，收到左邊就對不起來了。 */
  const skuLeft = single;
  /* 一價：第一條 SKU 跟機型**併在同一行**（rule.png 就是這樣），不是疊在它下面。
     x 這裡只給一個估值 —— 機型那串字畫出來多寬只有瀏覽器知道，真正的 x 是
     spreadStack 量完再對上去的。第二條以後照舊往下疊：同一行擺不下兩個號碼。 */
  if(skuLeft) cols[0].lines.forEach((l,i)=>{
    const inline = (i===0 && modelY!=null);
    B.push({id:'b'+id++,kind:'sku',vs:l.vs.slice(),x:MARGIN,
            y: inline?modelY:ly, inline: inline||undefined});
    if(!inline) ly += ty(24 * SZ_SKU);
  });
  /* 商品圖從這裡開始往下 —— 一價的圖要**貼著機型／SKU 那一行**（見 stickImage）。
     這個值只是第一次畫的估值，量完 DOM 才是最後的位置。 */
  const stackBottom = ly + (skuLeft && modelY!=null ? ty(24 * SZ_SKU) : 0);

  /* 右下。一價和多價走同一套 —— 原版把一價的價格單獨擺在別的地方，
     談定改成「價格永遠在右下角」，所以不再分兩種。 */
  const n=cols.length;
  /* 每一組用「離右邊界多遠」定位（rx），不是「左緣在哪」——
     內容有多寬要畫出來才知道，用左緣推的話一定會凸出去
     （量到過扁格子超出右邊界 64 個單位）。改用右緣錨點，右邊界一定精準。 */
  /* 幾組價格怎麼放，看有幾組（談定，見 rule.png／DM.jpg）：
       一組、兩組 → **上下疊**，整疊靠右下角。
         並排那一版的毛病：兩組都要擠在右下角那一塊寬度裡，欄距一縮 SKU 就互相撞
         （量到過「…44橋SKU：2156739」黏成一行），而版上其實有的是上下的空間。
       三組以上 → **沿著格子下緣攤開、平分整個格寬**，字級再小一級。
         三組疊起來是一根從半腰壓到底的柱子，圖被擠到只剩一條；
         真的那一張上（DM.jpg 那幾格 256G／512G／1TB）就是一整排排在下面。
     一組＝規格＋SKU 一行（規格在 SKU 左邊的小方框），價格在它下面 ——
     ⚠️ 只有「上下疊」才把規格併進 SKU 那一行：攤開之後一欄只剩三分之一格寬，
     併排一定塞不下，所以那時候規格回到自己一行、站在 SKU 上面（原本的做法）。 */
  const spread = n >= 3;
  const lineH  = ty(24 * SZ_SKU);
  const priceH = ty(58 * SZ_PRICE);
  const gapG   = ty(10);                       // 兩組之間
  /* 一價的 SKU 收在左上那一疊，所以這裡只剩規格那一行（ty(26)）。 */
  /* 規格跟 SKU 同一行（見下面的 inlineSpecs），所以一行就是一行 —— 不必再替規格
     多留一條 ty(26)。只有一價那種「SKU 收到左上那一疊」的，規格才自己站一行。 */
  const colH   = c => (skuLeft ? c.lines.reduce((a,l)=>a+(l.spec?ty(26):0),0)
                               : c.lines.length * lineH) + priceH;
  /* 規格一律貼著 SKU 的左端（談定）。以前攤開的那一版讓規格自己站一行，理由是
     一欄只剩三分之一格寬、併排塞不下 —— 現在照談定的來，塞不塞得下由字級那邊處理。 */
  const inlineSpecs = !skuLeft;
  if(spread){
    // 每一欄分到一樣寬的一格，右緣落在自己那一格的右邊界 → 攤開之後間距一定相等
    const slot = (CW - MARGIN*2) / n;
    const yTop = Math.max(MARGIN, CH - MARGIN - Math.max(...cols.map(colH)));
    cols.forEach((c,ci)=>{
      const rx = MARGIN + (n-1-ci) * slot;
      let y = yTop;
      for(const l of c.lines){
        /* 規格**貼著 SKU 的左端**（談定，攤開的也一樣）：同一行，緊接在號碼左邊。
           真正的 x 是 packPriceGroups 量完 SKU 多寬才對得上去的。 */
        if(l.spec) B.push({id:'b'+id++,kind:'spec',spec:l.spec,rx,y,col:ci,inline:true});
        B.push({id:'b'+id++,kind:'sku',vs:l.vs.slice(),rx,y,col:ci});
        y+=lineH;
      }
      B.push({id:'b'+id++,kind:'price',price:c.price,rx,y:y+ty(2),col:ci});
    });
  }else{
    const totalH = cols.reduce((a,c)=>a+colH(c),0) + gapG*(n-1);
    // 由下往上推：整疊的下緣要落在 CH-MARGIN
    let gy = Math.max(MARGIN, CH-MARGIN-totalH);
    cols.forEach((c,ci)=>{
      const rx=MARGIN;                   // 每一組都靠右邊界，上下疊
      for(const l of c.lines){
        /* x 要等畫出來量到 SKU 多寬才知道，這裡先跟 SKU 同一個 rx，
           真正的位置是 packPriceGroups() 對上去的。 */
        if(l.spec) B.push({id:'b'+id++,kind:'spec',spec:l.spec,rx,y:gy,col:ci,
                           inline: inlineSpecs||undefined});
        if(!skuLeft){
          B.push({id:'b'+id++,kind:'sku',vs:l.vs.slice(),rx,y:gy,col:ci});
          gy+=lineH;
        }else if(l.spec){ gy+=ty(26); }
      }
      B.push({id:'b'+id++,kind:'price',price:c.price,rx,y:gy+ty(2),col:ci});
      gy += priceH + gapG;
    });
  }

  /* 商品圖一律**貼在機型那一行底下、靠最左邊**（談定，不分幾個價格）——
     往下填到下邊界，左緣就是版面的左邊界，而且讓開右下那一組（見 stickImage）。
     以前多價走的是「垂直居中」，於是圖浮在半空、跟左上那一疊和右下的價格
     兩邊都可能疊到；一價早就改成貼著了，兩種長得不一樣本來就沒有理由。 */
  stackImgs(B, rows, (single ? 200 : 190) * SZ_IMG, () => 'b'+id++, stackBottom);

  BLOCKS=B;
  COORDS_V4 = true;            // 剛照新座標系排好的
  assignUids(BLOCKS);
}

/* 商品圖：一張一張**由左往右排開**，同一個 y（談定的，跟原版的斜疊不一樣）。
   大小維持原版的比例（190 或 200，佔 35～37% 格寬）—— 不跟著張數平分，
   平分過的那一版三張圖各剩 8% 格寬，整格看起來是空的。
   排到右邊界為止。不必避開價格那一疊 —— 圖在上面、數字在下面，本來就不同高度
   （原版也是這樣）。擠不下就讓它們互相疊一點，寧可疊也不要縮小或跑出格子。 */
/* 商品圖：垂直居中、貼左邊界、由左往右排開，最後一張的右緣停在 CW-MARGIN。
   大小維持原版的比例（190／200 寬，正方形）—— 不跟著張數平分，
   平分過的那一版三張圖各剩 8% 格寬，整格看起來是空的。 */
/* top ＝ 一價那條路傳進來的「那一疊的下緣」：圖從這裡開始，往下填到下邊界，
   維持正方形。傳 null 就是原本的垂直居中（多價）。 */
function stackImgs(B, rows, w, nextId, top){
  const n = rows.length;
  let iw = w, ih = w;                                    // 預留圖是正方形
  let y;
  if(top != null){
    ih = Math.max(ty(40), (CH - MARGIN) - top);          // 往下填滿剩下的高度
    iw = Math.min(ih, CW - MARGIN*2);
    ih = iw;
    y  = top;
  }else{
    y  = Math.max(MARGIN, Math.min((CH - ih) / 2, CH - MARGIN - ih));
  }
  const x0 = MARGIN;
  /* 好幾張圖並排時**不可以疊在一起**：先把每一張夾到「攤得開的寬度」，
     再照這個寬度算間距。以前是照 span/(n-1) 攤，張數一多間距就小於圖本身，
     三張圖疊成一團（看起來像只有一張，而且蓋住下面那張的商品名）。 */
  const availW = Math.max(ty(40), (CW - MARGIN) - x0);
  if (n > 1) iw = Math.min(iw, availW / n);
  const step = n > 1 ? Math.max(iw, (availW - iw) / (n - 1)) : 0;
  rows.forEach((r, i) => B.push({ id:nextId(), kind:'img', row:r, key:imgKey(r),
                                  x:x0 + i*step, y, w:iw, z:i+1,
                                  stick: top!=null || undefined }));
}

/* 每一塊在版面上的「身分」，跟 b.id 不一樣：id 是重建時從 0 數的流水號，
   換一組商品之後同一個號碼就是別人了。藏起來的零件記在格子身上（c.off），
   重選商品整批重建之後還要認得出誰是誰，靠的就是這個。
   認的是「哪一種、第幾欄、同類的第幾個」—— 這些都是照 picked 推出來的，
   同一組商品重建幾次都一樣。 */
function assignUids(B){
  const n={};
  B.forEach(b=>{
    const base = b.kind==='img' ? 'img|'+b.key : b.kind+'|'+(b.col==null?'-':b.col);
    n[base]=(n[base]||0)+1;
    b.uid = base+'#'+n[base];
  });
}
/* 舊檔沒有 uid。補的時候要整批一起補（跟重建時同一套規則），
   補一半會撞號。 */
function ensureUids(B){ if(B && B.length && !B[0].uid) assignUids(B); }

/* 這一格藏起來的零件：{uid: 顯示用的名字}。名字要一起存 —— 清單得說得出
   「你藏起來的是哪一塊」，而那一塊已經不在版上了，問不到它自己。
   跟換過的商品圖（cellImgs）一樣掛在格子上，理由也一樣：掛在零件身上，
   重選商品整批重做就跟著不見了。 */
function offMap(c){
  c = c || cell();
  if(!c) return {};
  if(!c.off) c.off = {};
  return c.off;
}
function isOff(b, c){ return !!offMap(c)[b.uid]; }
/* 還在版上的（沒被藏起來的）。排版、對齊、分組一律只算這些。 */
function liveBlocks(){ return BLOCKS.filter(b=>!isOff(b)); }

/* 這一格自己換過的商品圖：key 是商品（品名|規格|顏色），值是 Storage 的網址。
   為什麼掛在「格子」上而不是掛在零件上：勾選一變動 buildBlocks() 就把零件整批
   重做，掛在零件上的東西會跟著不見。掛在格子上，重排幾次都還在。 */
function cellImgs(){
  const c = cell();
  if(!c) return {};
  if(!c.img) c.img = {};
  return c.img;
}

/* 預留圖上寫的那一行字＝**這一張是這一群裡的哪一支**。
   本來只寫規格和顏色，那對手機平板夠用（256G 黑／512G 橘），但公司很多品類
   根本沒有這兩欄 —— 空調就是：同一格三支，三張預留圖上都寫著「—」，
   誰是 HITACHI 誰是 Panasonic 完全看不出來，而缺圖的時候正是最需要分得出來的時候
   （不然沒有人知道該補哪一張）。
   所以退而求其次：規格顏色 → 型號 → 品牌。型號用斜線前那一段就夠認人
   （`RAC-28NP1/RAS-28NJP1` 的後半是室外機），太長會撐出格子外面。
   照 key 回頭去找那一列 —— 呼叫的三個地方手上不一定有列，而 key 一定有。 */
function phTag(k, a, row){
  const spec = [a[1], a[2]].filter(Boolean).join(' ');
  if(spec) return spec;
  /* ⚠️ 認人要用**那一列**，不是 key：沒有規格也沒有顏色的時候，同一個商品名
     底下每一列算出來的 key 一模一樣（`變頻冷暖空調||`），照 key 回頭找只會
     一直找到第一列 —— 三支空調的預留圖上就會寫著同一個型號。
     版面上呼叫的地方手上都有那一列（stackImgs 把 row 一起放進零件裡）。 */
  const r = row || ROWS.find(x => imgKey(x) === k);
  const m = String(rowModel(r) || '').split('/')[0].trim();
  if(m) return m.length > 14 ? m.slice(0,13) + '…' : m;
  return rowBrand(r) || '—';
}

/* 商品圖：這一格換過的優先，其次是圖庫上傳的，都沒有就畫 placeholder
   （內嵌 SVG，斷網也看得到） */
function imgHTML(k, row){
  const url = imgUrlOf(k);
  if(url) return `<img src="${url}" alt="" draggable="false" decoding="sync">`;
  const a=k.split('|'), tag=phTag(k,a,row);
  return `<svg class="ph" viewBox="0 0 100 100">
    <rect x="0" y="0" width="100" height="100" rx="3" fill="#f0f2f6" stroke="#d5dae3"
      stroke-width="0.7" stroke-dasharray="3 2"/>
    <g fill="none" stroke="#b9c1cf" stroke-width="1.6" stroke-linejoin="round">
      <rect x="30" y="34" width="40" height="32" rx="2.5"/>
      <path d="M30 58 L41 47 L50 56 L59 50 L70 60"/>
    </g>
    <circle cx="41" cy="43" r="3.2" fill="#b9c1cf"/>
    <text x="50" y="80" text-anchor="middle" font-size="7" fill="#8a94a6"
      font-family="sans-serif" font-weight="700">${tag}</text>
  </svg>`;
}

let activeImg=null;          // 滾輪循環中的目前圖層 id
let stackUnder=[];           // 游標下的圖層(由上到下)
let cycleIndex=0;

/* 擋在 active 前面(z 較大)的圖層降為 0.5，其餘 1 */
function xrayDim(b){
  if(!activeImg) return 1;
  const a=BLOCKS.find(x=>x.id===activeImg);
  if(!a||b.id===a.id) return 1;
  return b.z>a.z ? .5 : 1;
}

/* 這一塊自己調過的倍率。沒調過就不寫，CSS 那邊 var(--bs,1) 吃預設值。 */
function bsVar(b){ return (b.sc && b.sc!==1) ? `;--bs:${b.sc}` : ''; }

/* 集體移動開著時，選起來的那幾塊改畫紅虛線：同樣是「選到的」，但那一下拖出去
   動的是每一格。藍和紅不疊 —— 兩個記號指同一件事只會讓人以為它們不一樣。 */
const pk = b => (BULK_MOVE && selected.has(b.id)) ? ' bpick' : '';
function blockHTML(b,isCur=true){
  /* 選了不只一塊時，選取本身要看得見：把手只畫在「剛好選了一塊」的時候
     （四個角是拉大小用的，一次拉一塊），所以框選一片下來畫面上什麼都不會變 ——
     看起來就像沒選到。多選的那幾塊各自描一圈藍。 */
  const many = isCur && selected.has(b.id) && selected.size>1 && !BULK_MOVE;
  const on = (isCur&&selected.has(b.id)) ? (many?' sel msel':' sel') : '';
  const bs = bsVar(b);
  /* 右緣錨點：右下那一組用 right 定位（見 buildBlocks）。搬過之後就換回 left ——
     手動位置是絕對的，不該再跟著右邊界跑（見 mousedown 那邊的 unpin）。 */
  const pos = b.rx != null ? `right:${(+b.rx).toFixed(1)}px` : `left:${b.x}px`;
  if(b.kind==='name')  return `<div class="blk name${on}${pk(b)}" data-b="${b.id}" style="${pos};top:${b.y}px${bs}">${b.text}</div>`;
  if(b.kind==='img'){
    const dim = isCur?xrayDim(b):1;
    const noimg = imgUrlOf(b.key) ? '' : ' noimg';   // 還沒換圖＝框紅的
    const iw=((+b.w||0) * TYPE_MUL.img).toFixed(1);   // 轉盤的倍率乘在畫的時候
    /* 拉過高度的圖（PPT 的邊中點把手）帶著自己的高度走；沒拉過就讓高度跟著寬度
       等比例（.ph 的 --h-ph / 真圖的 height:auto）。 */
    /* 高度一律跟著寬度等比例（.ph 的 aspect-ratio／真圖的 height:auto）。
       舊資料可能還留著 b.h（單向拉伸那個功能留下來的），不理它 —— 拉不回來的
       扁圖留在版上，比「不能改長寬比」這條規矩本身更糟。 */
    return `<div class="blk img${on}${noimg}${pk(b)}${(isCur&&activeImg===b.id)?' actimg':''}" data-b="${b.id}"
      style="${pos};top:${b.y}px;width:${iw}px;${noimg?`--iw:${iw}px;`:''}z-index:${b.z};opacity:${dim}">
      ${imgHTML(b.key, b.row)}
      <button class="tobtn" data-top="${b.id}" title="移到最上層">最上面</button></div>`;
  }
  /* 貼圖：b.tpl 是這張貼紙的模板（貼上去那一刻從貼紙庫抄一份跟著走），
     b.vals 是**這一格自己**改過的那幾個字。所以同一張貼紙貼十格，十格可以寫
     十種價格 —— 那正是貼紙庫「可變文字」的用處，而攤平成一張圖就沒有了。
     為什麼模板要整份抄一份：庫裡改了那一張，已經貼出去的不該跟著變；
     庫裡刪掉了，版上這一張也不該跟著消失。 */
  if(b.kind==='sticker'){
    const dim = isCur?xrayDim(b):1;
    const W = +b.w||0;
    /* 高度只有照模板排的時候才寫死（圖層是絕對定位的，沒有高度就疊在一起）。
       舊資料那種一張烤好的圖不寫 —— 高度跟著圖片自己的比例走就對了。 */
    const H = b.tpl ? `height:${(W*stickerRatio(b)).toFixed(1)}px;` : '';
    return `<div class="blk sticker${on}${pk(b)}${(isCur&&activeImg===b.id)?' actimg':''}" data-b="${b.id}"
      style="${pos};top:${b.y}px;width:${W.toFixed(1)}px;--bw:${W.toFixed(1)}px;${H}z-index:${b.z};opacity:${dim}">
      ${stickerArt(b, W, W*stickerRatio(b))}
      <button class="tobtn" data-top="${b.id}" title="移到最上層">最上面</button>
      ${ROLE==='pm' ? '' : `<button class="delbtn" data-del="${b.id}" title="刪掉這張貼圖">✕</button>`}</div>`;
  }
  /* 舊存檔的 brand 零件只有 name（那時候品牌是照商品名查的），所以查不到
     b.brand 就退回那張對照表 —— 不然舊檔期一開起來，品牌全部變成空白。
     圖不讀 b.bimg，當場再查一次（見 blockBimg）：庫裡換過的圖要跟著換。 */
  if(b.kind==='brand'){
    const img = blockBimg(b);
    const g = img ? brandGeom(img) : null;
    /* 單位換算跟 applyMetrics 那幾條一樣：排版單位 → px，再乘這一塊自己的 --bs。 */
    const u = v => ty(v * SZ_BRAND * TYPE_MUL.brand).toFixed(2);
    const px = v => `calc(${u(v)}px * var(--bs,1))`;
    let inner;
    if(g && g.crop){
      /* 外面這一層就是墨水框（看得見的那一塊），裡面那張圖放大之後往左上位移，
         四周那圈空白被 overflow 切掉。零件佔的位子＝這一層，所以品名貼得上來。 */
      inner = `<span class="bcrop" style="width:${px(g.w)};height:${px(g.h)}">`
            + `<img class="bimg" src="${img}" alt="" draggable="false" decoding="sync" style="`
            + `width:${px(g.iw)};height:${px(g.ih)};`
            + `margin-left:calc(0px - ${px(g.ox)});margin-top:calc(0px - ${px(g.oy)})"></span>`;
    } else if(img){
      /* 沒量到（或本來就填滿畫布）：照舊用 --h-brand 那條，高度自己算。 */
      inner = brandHTML(b.brand != null ? b.brand : (BRAND[b.name]||''), img);
    } else {
      inner = brandHTML(b.brand != null ? b.brand : (BRAND[b.name]||''), '');
    }
    const hv = (img && !(g && g.crop)) ? `;--h-brand:${u(brandSlotH(img))}px` : '';
    return `<div class="blk brand${on}${pk(b)}" data-b="${b.id}" style="${pos};top:${b.y}px${bs}${hv}">${
      inner}</div>`;
  }
  if(b.kind==='model') return `<div class="blk model${on}${pk(b)}" data-b="${b.id}" style="${pos};top:${b.y}px${bs}">機型：${b.text}</div>`;
  if(b.kind==='spec')  return `<div class="blk specb${on}${pk(b)}" data-b="${b.id}" style="${pos};top:${b.y}px${bs}${b.w2?`;width:${b.w2}px`:''}"><div class="spec${b.dark?' dark':''}">${b.spec}</div></div>`;
  /* 價格用哪一級字由 priceFs() 決定：基準（轉盤 > 同組最小 > 自動）× 這一塊自己的倍率。
     轉盤是允許溢出的（談定的），所以這裡不夾上限。 */
  if(b.kind==='price'){
    const fs=priceFs(b);
    return `<div class="blk price${on}${pk(b)}${b.cross?' crossed':''}" data-b="${b.id}" style="${pos};top:${b.y}px${
      b.w2?`;width:${b.w2}px`:''}${
      fs?`;font-size:${(priceBase()*fs).toFixed(1)}px`:''}">${b.price}</div>`;
  }
  // sku
  return `<div class="blk skub${on}${pk(b)}${b.rx == null ? ' atleft' : ''}" data-b="${b.id}" style="${pos};top:${b.y}px${bs}${b.w2?`;width:${b.w2}px`:''}">`+
    `<div class="sku">${skuLine(b.vs)}</div></div>`;
}

function renderCell(){ renderOne(curCell); paintHandles(); reportBoard(); reportSel(); }
/* 這一格有沒有抓著選取，報給上層 —— 上層再去把別格的收掉。
   為什麼要繞上層一圈：每一格的畫布是各自獨立的文件，彼此看不到對方，
   而版上任何一格都點得到（見 .ccanvas 的 pointer-events），
   所以「點了 B 格，A 格的藍框要消失」只有上層講得出來。 */
let lastSelSent = null;
function reportSel(){
  if(window.parent === window) return;
  const on = !!(selected.size || activeImg);
  if(on === lastSelSent) return;
  lastSelSent = on;
  try{ parent.postMessage({ stageSel: on ? String(CELL_ID) : '' }, '*'); }catch(_){}
}

/* 選中一塊就在四個角長出把手，拖角落等比放大縮小 —— 跟 PPT 一樣的手感。
   只在「剛好選一塊」時出現：多選時每一塊各自的基準倍率不同，一個角落沒辦法
   同時代表全部，硬做出來的結果只會跟你想的不一樣。工具列上的 ＋／− 才是多選用的。
   在 render 之後補上去，不塞進 blockHTML —— 那支函式一種零件一條分支，
   每條都補一次把手，遲早漏掉一種。 */
/* 把手是「螢幕上的東西」，不是版面的一部分（同 CLAUDE.md 的 固定大小 那一條）：
   版面整份被 --cs 縮進格子裡，把手要是跟著縮，縮小的時候就變成兩三個 px，
   怎麼點都點不到（量到過 2.8px）。所以除以 --cs 把它換算回排版單位，
   讓它在螢幕上永遠是同一個大小。
   ⚠️ 但不能無上限地補：縮得很小的時候 1/--cs 會很大，一顆把手就蓋住整塊零件，
   四顆疊起來比它要改的東西還大。所以夾在「這一塊短邊的 HANDLE_MAX_FRAC」以內 ——
   縮到看不清楚的時候把手跟著小，那是對的：那個尺寸本來就不是拿來拖的，
   要拖就先放大。下限留 6，再小就連看都看不到了。 */
const HANDLE_PX = 10;          // 想要的螢幕大小（白底細環，見 .rz）
/* 外面那層 .ccanvas 的 transform 把整份畫布又縮放了一次，而 iframe 裡量不到它
   —— 上層會用 stageScale 報進來（見 fitCellCanvases）。單獨開這一頁時沒有人報，
   那就是 1。 */
let STAGE_SCALE = 1;
const HANDLE_MIN = 6;          // 排版單位的下限
const HANDLE_MAX_FRAC = .34;   // 最多吃掉這一塊短邊的幾成
function handleSize(el){
  const cs = (parseFloat(getComputedStyle(document.documentElement)
               .getPropertyValue('--cs')) || 1) * (STAGE_SCALE || 1);
  const want = HANDLE_PX / cs;
  const cap  = Math.min(el.offsetWidth, el.offsetHeight) * HANDLE_MAX_FRAC;
  return Math.max(HANDLE_MIN, Math.min(want, Math.max(HANDLE_MIN, cap)));
}

/* 只把既有的那四顆改大小。--cs 變了但版面沒重排時走這條 —— 直接叫 paintHandles
   會再 append 一組，變成八顆疊著。 */
function resizeHandles(){
  const el = selected.size===1 ? bEl([...selected][0]) : null; if(!el) return;
  const hs = el.querySelectorAll('.rz'); if(!hs.length) return;
  const sz = handleSize(el), bd = Math.max(1, sz / 9);
  hs.forEach(h=>{ h.style.width = h.style.height = sz.toFixed(1)+'px';
                  h.style.borderWidth = bd.toFixed(2)+'px'; });
  placeHandles(el, hs, sz);
}

/* 還沒有圖的那一塊：四顆把手站在**灰圖**的四個角，不是框的四個角
   （見 .blk.img.noimg 那一段）。量出來再擺 —— 灰圖在框裡的位置是 CSS 的百分比
   加內距加框線算出來的，這裡照抄一份算式遲早對不上。
   有圖的那幾塊把 inline 的位置清掉，交還給 .rz-nw／.rz-se 那幾條。 */
function placeHandles(el, hs, sz){
  const ph = el.classList.contains('noimg') ? el.querySelector(':scope > .ph') : null;
  const er = el.getBoundingClientRect();
  if(!ph || !er.width){
    hs.forEach(h=>{ h.style.left = h.style.top = h.style.right = h.style.bottom = ''; });
    return;
  }
  const pr = ph.getBoundingClientRect();
  const k = el.offsetWidth / er.width;                 // 螢幕 px → 排版單位（外面還縮過好幾層）
  const L = (pr.left - er.left) * k - el.clientLeft;   // 絕對定位從框線裡面算起
  const T = (pr.top  - er.top)  * k - el.clientTop;
  const W = pr.width * k, H = pr.height * k;
  hs.forEach(h=>{
    const c = h.dataset.corner || '';
    h.style.left = (c.includes('w') ? L : L + W - sz).toFixed(1)+'px';
    h.style.top  = (c.includes('n') ? T : T + H - sz).toFixed(1)+'px';
    h.style.right = h.style.bottom = 'auto';
  });
}

function paintHandles(){
  if(ROLE==='pm' || selected.size!==1) return;
  const el=bEl([...selected][0]); if(!el) return;
  /* 一律只有四個角。圖片本來多四顆邊中點可以單向拉伸（PPT 那一套），
     談定拿掉：商品圖拉扁就不是那個商品的樣子了，而印出去改不回來。
     四個角是等比例的，所以「拉大小」這件事永遠不會動到長寬比。 */
  const corners = ['nw','ne','sw','se'];
  const sz = handleSize(el), bd = Math.max(1, sz / 9);
  corners.forEach(c=>{
    const h=document.createElement('i');
    h.className='rz rz-'+c;
    h.dataset.corner=c;
    h.title='拖曳改大小（按住 Shift 微調）';
    h.style.width = h.style.height = sz.toFixed(1)+'px';
    h.style.borderWidth = bd.toFixed(2)+'px';
    el.appendChild(h);
  });
  placeHandles(el, el.querySelectorAll('.rz'), sz);
}

/* 渲染單一格子（i 可為任一格） */
/* 重畫一次＝把整格的 innerHTML 換掉，於是每一張 <img> 都是新生的 —— 新的 img
   身上沒有解好的點陣圖，就算 bytes 還在快取裡也會空掉一格畫面（Storage 那幾張
   還可能多一趟 revalidate）。而調字級時 renderOne 一趟會重畫到六次
   （spreadStack→…→stickImage），按住 ＋ 又是每 80ms 一趟、整個版位每一格同時跑 ——
   看起來就是商品圖和品牌 logo 一直在閃。
   所以換之前先把還活著（已經載完）的 img 照 src 收起來，換完照 src 認領回去：
   螢幕上那張已經解好的圖從頭到尾沒有離開過 DOM，也就沒有空白的那一幀。
   ⚠️ 認領回去的是**節點**，class／style 一律照新那一份重寫：品牌 logo 的裁切
   靠 inline 的寬高和位移（見 blockHTML 的 bcrop），不抄就會沿用上一輪的大小 ——
   那正是字級要改的東西，看起來會像「轉盤對 logo 沒有作用」。
   ⚠️ 一個舊節點只認領一次（認領完就 isConnected 了）：同一張圖在一格裡放兩塊
   的時候，兩邊搶同一個節點只會有一邊畫得出來。
   ⚠️ 這裡要問 isConnected，不是 parentNode：innerHTML 換掉的是 el 的直接子節點，
   而 img 掛在 .blk 底下 —— 那顆 .blk 被拆下來之後 img 的 parentNode 還在（是一顆
   已經離線的 .blk），照 parentNode 判的話一個都認領不到，整段等於沒作用。 */
function paintKeepingImgs(el, html){
  const live = new Map();
  el.querySelectorAll('img[src]').forEach(im => {
    if(im.complete && im.naturalWidth) live.set(im.src, im);
  });
  el.innerHTML = html;
  if(!live.size) return;
  el.querySelectorAll('img[src]').forEach(im => {
    const prev = live.get(im.src);
    if(!prev || prev.isConnected) return;
    prev.className = im.className;
    const st = im.getAttribute('style');
    if(st == null) prev.removeAttribute('style'); else prev.setAttribute('style', st);
    im.replaceWith(prev);
  });
}

function renderOne(i, force){
  const el=document.getElementById('cell'+i);
  if(!el) return;
  const c=CELLS[i]; if(!c) return;
  const isCur = i===curCell;
  const row1 = i<GC ? ' row1':'';
  const pk = isCur?picked:c.picked;
  if(!pk.size){
    el.className='cell empty'+(isCur?' cur':'')+row1;
    el.innerHTML='點一下選商品';
    // 必須清掉 layoutKey，否則之後重選同一組會與舊 key 相同而不重建
    c.layoutKey='';
    if(isCur){ BLOCKS=[]; layoutKey=''; } else c.blocks=[];
    return;
  }
  const k=[...pk].sort((a,b)=>a-b).join(',');
  const rebuilt = k!==c.layoutKey;
  if(rebuilt){
    c.layoutKey=k;
    if(isCur){ layoutKey=k; selected.clear(); activeImg=null; }
    const savedP=picked, savedB=BLOCKS;
    picked=pk; buildBlocks(); c.blocks=BLOCKS;
    if(isCur){ setTimeout(()=>{
        document.getElementById('lay').classList.toggle('on',panelsOn&&ROLE!=='pm');
        renderLayers();
      },0); }
    else { picked=savedP; BLOCKS=savedB; }
  }
  /* 藏起來的零件在這裡就被濾掉：不畫、不量、不參與排版。留在 c.blocks 裡不刪，
     所以打勾放回來的時候它連位置、調過的大小都還在原地，不必整組重建。 */
  const hid = c.off || {};
  const blocks = (isCur?BLOCKS:c.blocks).filter(b=>!hid[b.uid]);
  el.className='cell'+(isCur?' cur':'')+row1;
  if(isCur) setTimeout(()=>{ renderProps(); renderRestore(); },0);
  const paint = hidden => {
    paintKeepingImgs(el, '<div class="cstage'+(hidden?' measuring':'')+'">'
      /* 開著就一直看得到，關著就一直看不到 —— 這顆是「要不要看到尺」，不是拖曳的一部分。 */
      + ((isCur && SHOW_GRID) ? '<div class="gridlines"></div>' : '')
      + blocks.map(b=>blockHTML(b,isCur)).join('')
      + (isCur?guides.map(g=>g.dir==='v'
          ? `<div class="guide gv" style="left:${g.pos}px"></div>`
          : `<div class="guide gh" style="top:${g.pos}px"></div>`).join(''):'')
      + '<div class="marquee" id="marquee'+i+'"></div>'
      + '<div class="safe"></div>'
      + '</div>');
    /* 貼圖裡設了「自動縮小塞進框」的那幾層要等畫出來才量得到 —— 每一次 paint
       都要再縮一次（上面那幾趟對齊會重畫好幾遍）。 */
    try{ if(blocks.some(b=>b.kind==='sticker')) StickerRender.fitTexts(el); }catch(_){}
  };
  /* 剛排好（或字型到齊後強制重排）的那一格：先照內容寬度藏著畫一次、量真正的
     寬高，autoSpace 把價格 SKU 靠右對齊、圖讓開，定位完才顯示。b.w2 是靠右用的
     固定寬度框，量之前先清掉，不然量到的是上一輪的框寬、欄寬會越算越死。 */
  /* ⚠️ 商標還在量的時候**先藏著**（`.cstage.measuring`）。brandGeom 量到之前回 null，
     那一疊照暫代的 26 高排 —— 那不是它最後的位置，量到的那一刻整疊會跳一次，
     看起來就是「挑完貨，格子先閃一下預設位置」。圖是網路來的，所以這一跳一定
     隔著一幀，同一趟裡多畫幾次是看不到的（那幾趟在同一個 task 裡，只 paint 一次）。
     藏著等的上限是 LOGO_WAIT，到了就當作量不到 —— 見 measureLogo。 */
  const waitLogo = blocks.some(b => b.kind==='brand' && logoPending(blockBimg(b)));
  /* 位置是 buildBlocks 算好的，不必量 DOM。唯一的例外是下緣那一下 ——
     「價格貼著下邊界」要的是**畫出來**的高度，而字框、padding、border 的實際高度
     只有瀏覽器知道（量到過比估算多 6 個單位，就凸出邊界了）。所以畫一次、
     對一次下緣、再畫一次。只有重建或強制的時候會走到，不是每次重畫。 */
  paint(waitLogo);
  if((rebuilt||force) && isCur){
    // 先把上面那一疊推開（放大的那塊要先佔到位），再對齊四邊
    try{ if(spreadStack(blocks)) paint(waitLogo); }catch(_){}
    /* 攤開那幾組價格要**先夾**到塞得進自己那一欄：夾了字級，寬和高都會變，
       後面兩趟（疊、對齊四邊）量到的才是最後那個大小。 */
    try{ if(fitSpreadPrices(blocks)) paint(waitLogo); }catch(_){}
    try{ if(packPriceGroups(blocks)) paint(waitLogo); }catch(_){}
    try{ if(nudgeGroupBottom(blocks)) paint(waitLogo); }catch(_){}
    /* 商品圖**最後**才算，不能跟 spreadStack 一起做：它要讓開右下那一組，
       而那一組真正的位置是上一行的 nudgeGroupBottom 對出來的。
       早一步算的話量到的是還沒對齊前的位置 —— 那時候價格離右邊界還有一段，
       圖就以為左邊只剩那麼點空間，於是縮得莫名其妙的小（量到過該有 78 卻只給 45）。 */
    try{ if(stickImage(blocks)) paint(waitLogo); }catch(_){}
  }
}

/* 畫完之後把「看得見的邊」對到邊界上。
   為什麼要這一步：我們寫的座標是零件的**框**，而框裡面還有 border、padding，
   字更是自己就有一圈空隙（Anton、line-height:1 的數字，框比字高一大截）。
   框貼齊邊界時，看到的東西離邊界還有一段 —— 量到過右邊 5、下面 18、左邊 15、
   上面 13，同樣是「10」的邊界，四邊看起來都不一樣寬。
   所以畫一次、量墨水、把每一組挪到看得見的邊剛好落在邊界上，再畫一次。

   算的是「現在量到的差多少」，所以做過一次之後差就是 0 —— 重複跑不會愈挪愈歪。
   手動搬過的（placed）不碰：那是使用者放的位置。 */
/* 左上那一疊（商標／品名／型號／SKU）本來是照一組固定間距排的，而那組數字
   假設了預設字級。轉盤一把品名放大，下面那幾塊就被壓在它身上 —— 疊字。
   所以畫完之後照**量到的高度**重新疊一次：一塊接一塊，誰變大就把下面的推開，
   誰變小就收回來。量的是 offsetHeight（版面單位，跟座標同一把尺）。
   手動搬過的（b.placed）不碰 —— 那是使用者自己放的位置。 */
const STACK_GAP = 6;
function spreadStack(blocks){
  /* 併排的那條 SKU（b.inline）不進這一疊 —— 它跟機型是**同一行**，
     疊進來就會被推到機型下面，那正是要拿掉的東西。它的位置在下面單獨對。 */
  const list=(blocks||[]).filter(b=>!b.placed && b.rx==null && !b.inline
    && ['brand','name','model','sku'].includes(b.kind));
  if(list.length<2){
    // 疊不起來也還是要把併排的 SKU 對好（右下那一組和圖各有自己那一趟，見 renderOne）
    let m=false;
    try{ if(inlineSku(blocks)) m=true; }catch(_){}
    return m;
  }
  list.sort((a,b)=>(+a.y||0)-(+b.y||0));
  /* ⚠️ 量的是**看得見的**上下緣（inkBox），不是框。字框比字高一大截（Anton、
     大字級的品名尤其明顯），照框排出來的「6 個單位」在畫面上是一大條空白 ——
     商標和品名中間那個大縫就是這樣來的。改用墨水框，縫多寬就是看起來多寬。 */
  const ink=list.map(b=>{
    let k=null; try{ k=inkBox(b.id); }catch(_){}
    const n=bEl(b.id);
    const h=(k && k.h) ? k.h : (n && n.offsetHeight ? n.offsetHeight : ty(24));
    return { oy:(k ? k.oy : 0), h };
  });
  const hs=ink.map(k=>k.h);
  const top=(+list[0].y||0) + ink[0].oy;      // 第一塊看得見的上緣
  /* 下界＝右下那一組的上緣（沒有就是格子的下邊界）。整疊只能長到這裡，
     再往下就是壓到價格身上，或整個掉出格子外。 */
  let limit = CH - MARGIN;
  (blocks||[]).forEach(b=>{ if(b.rx==null) return;
    const n=bEl(b.id); if(n) limit=Math.min(limit, n.offsetTop); });
  const need=hs.reduce((a,h)=>a+h,0), joints=list.length-1;
  /* 裝得下就照正常間距；裝不下就把不足**平均分攤**成負間距 ——
     擠是一定要擠的，但每一個接縫擠一樣多，最嚴重的那一處就是最輕的。
     一路往下推的話最後一塊會被推出格子（看不到＝等於不見了），
     全部堆在同一個接縫則是一塊完全蓋住另一塊。兩個都比平均分攤糟。 */
  let gap = ty(STACK_GAP);
  const room = Math.max(0, limit - top);
  if(joints > 0 && need + gap*joints > room) gap = (room - need) / joints;
  let y=top, moved=false;
  list.forEach((b,i)=>{
    const want = y - ink[i].oy;              // 框要往上退，墨水才落在 y
    if(Math.abs((+b.y||0)-want)>.5){ b.y=want; moved=true; }
    y += ink[i].h + gap;
  });
  try{ if(inlineSku(blocks)) moved=true; }catch(_){}
  return moved;
}

/* 右下那一組（規格／SKU／價格）照**量到的高度**重新疊一次，一組一組往下。
   跟左上那一疊（spreadStack）同一個道理，而且是同一個毛病：
   排的時候一行給 ty(24*SZ_SKU) ＝ 39 個單位，可是那一行的字畫出來只有 26；
   價格更誇張 —— Anton 的字框比數字高一大截（line-height:1 也一樣），
   所以「SKU 在上、價格在下」中間會空出一條看起來莫名其妙的縫。
   照墨水（inkBox）疊就沒有這件事：縫多寬就是看起來多寬。

   規格小框在哪也在這裡決定，因為它是「哪一行」的一部分：
     ・上下疊（一價、二價）→ 併進 SKU 那一行、站在它左邊
     ・攤開（三價以上）   → 自己一行、站在 SKU 上面（一欄只剩三分之一格寬，併不下）
   規格和 SKU **照順序配對**（同一欄裡第 i 個對第 i 個），不照 y 配 ——
   第一趟疊完 y 就不一樣了，照 y 配第二趟就配不上。 */
function packPriceGroups(blocks){
  const grp=(blocks||[]).filter(b=>b.col!=null && b.rx!=null && !b.placed);
  if(!grp.length) return false;
  const cols=[...new Set(grp.map(b=>b.col))].sort((a,b)=>a-b);
  const spread=cols.length>=3;              // 跟 buildBlocks 同一條規矩
  const ink=b=>{ const el=bEl(b.id); if(!el) return null;
                 let k=null; try{ k=inkBox(b.id); }catch(_){}
                 return k ? { el, ...k }
                          : { el, ox:0, oy:0, w:el.offsetWidth, h:el.offsetHeight }; };
  // 起點＝這一組現在最上面那一塊的墨水上緣。整組要挪到哪是 nudgeGroupBottom 的事，
  // 這裡只負責它們**彼此**的距離。
  let top=Infinity;
  grp.forEach(b=>{ const k=ink(b); if(k) top=Math.min(top, k.el.offsetTop+k.oy); });
  if(!isFinite(top)) return false;
  const gapLine=ty(4), gapGroup=ty(12);
  let moved=false;
  const put=(b,k,y)=>{ const want=y-k.oy;          // 框往上退，墨水才落在 y
    if(Math.abs((+b.y||0)-want)>.5){ b.y=want; moved=true; } };
  let gy=top;
  cols.forEach(ci=>{
    const bs=grp.filter(b=>b.col===ci);
    const skus =bs.filter(b=>b.kind==='sku');
    const specs=bs.filter(b=>b.kind==='spec');
    const price=bs.find(b=>b.kind==='price');
    let y = spread ? top : gy;                      // 攤開的每一欄都從同一條線開始
    const rows=Math.max(skus.length, specs.length);
    for(let i=0;i<rows;i++){
      const sk=skus[i], sp=specs[i];
      const kk=sk?ink(sk):null, pk=sp?ink(sp):null;
      if(sk && kk && sp && pk){
        // 併排：規格站在 SKU 左邊、緊貼著它，兩者看得見的**下緣**對齊
        put(sk,kk,y);
        const wantRx=(+sk.rx||0)+kk.w+ty(8);
        if(Math.abs((+sp.rx||0)-wantRx)>.5){ sp.rx=wantRx; moved=true; }
        put(sp,pk,y+kk.h-pk.h);
        y+=kk.h+gapLine;
      }else{
        if(sp && pk){ put(sp,pk,y); y+=pk.h+gapLine; }   // 規格自己一行
        if(sk && kk){ put(sk,kk,y); y+=kk.h+gapLine; }
      }
    }
    if(price){ const pk=ink(price); if(pk){ put(price,pk,y); y+=pk.h;
      /* SKU 靠左（談定）：這一欄的左邊界＝**價格看得見的左緣**，所以號碼的第一個字
         跟數字的第一位對成一條線。攤開的那一版在 buildBlocks 就算得出左邊界
         （每一欄一樣寬），上下疊這一版算不出來 —— 欄有多寬要等價格畫出來才知道。 */
    } }
    if(!spread) gy=y+gapGroup;                    // 上下疊：下一組接著往下
  });
  return moved;
}

/* 併排的那條 SKU：跟機型同一行、接在它右邊。
   機型那串字（LSU22CHST/LSN22ICHST 之類）多寬只有畫出來才知道，所以位置是量的 ——
   照字數估的話，長型號會把 SKU 推到格子外，短的又留一大段空白。
   兩段之間留一個字寬的空隙，不畫分隔線：ref.png 上就是靠距離分開的。 */
function inlineSku(blocks){
  const sku=(blocks||[]).find(b=>b.kind==='sku' && b.inline && !b.placed);
  const mdl=(blocks||[]).find(b=>b.kind==='model' && !b.placed);
  if(!sku || !mdl) return false;
  const mn=bEl(mdl.id), sn=bEl(sku.id);
  if(!mn || !sn) return false;
  let mk=null, sk=null;
  try{ mk=inkBox(mdl.id); sk=inkBox(sku.id); }catch(_){}
  if(!mk || !sk) return false;
  const gap=ty(14);
  // 機型墨水的右緣（版面座標）＋空隙，再退掉 SKU 自己的左內距
  const wantX=(+mdl.x||0)+mk.ox+mk.w+gap-sk.ox;
  /* 兩行的**基線**要對齊，不是框的上緣：兩邊字級不一樣（SKU 比機型大一級），
     照上緣對的話小的那一行會浮在上面。用墨水的下緣對齊最接近視覺上的基線。 */
  const wantY=(+mdl.y||0)+mk.oy+mk.h-sk.oy-sk.h;
  let moved=false;
  if(Math.abs((+sku.x||0)-wantX)>.5){ sku.x=wantX; moved=true; }
  if(Math.abs((+sku.y||0)-wantY)>.5){ sku.y=wantY; moved=true; }
  return moved;
}

/* 攤開的那幾組價格（三組以上）：夾到每一組都塞得進自己那一欄。
   為什麼要量：欄寬是 格寬/n，而數字有幾位是商品決定的 —— 44900 和 1290
   差了兩位，寫死一個字級一定有一種會頂到隔壁那一欄
   （量到過 0.9 那一級的價格佔 38.5% 格寬，而一欄只有 33.3%，最左邊那個
    直接凸出格子外 3.5%）。
   夾出來的比例**整格共用一個**：同一格裡三個價格不一樣大，看起來像其中一個
   比較重要，而它們只是三種容量。
   用 b.shrink 這道夾子，不動 b.fsFix —— 那是使用者自己調的那一份。 */
function fitSpreadPrices(blocks){
  const ps=(blocks||[]).filter(b=>b.kind==='price' && b.col!=null && !b.placed);
  const n=ps.length;
  if(n<3) return false;
  const slot=(CW-MARGIN*2)/n - ty(6);        // 留一點縫，兩欄的數字不要貼在一起
  let k=1;
  ps.forEach(b=>{
    const el=bEl(b.id); if(!el) return;
    let ink=null; try{ ink=inkBox(b.id); }catch(_){}
    const w=(ink && ink.w) ? ink.w : el.offsetWidth;
    if(!(w>0)) return;
    /* 量到的寬度是**現在這個 shrink 之下**的，所以要先還原回沒夾過的寬度，
       再算新的比例 —— 不還原的話每跑一次就再乘一次，數字會一路縮到看不見。 */
    k=Math.min(k, slot*(b.shrink||1)/w);
  });
  if(!(k>0) || !isFinite(k)) return false;
  let moved=false;
  ps.forEach(b=>{ if(Math.abs((b.shrink||1)-k)>.005){ b.shrink=k; moved=true; } });
  return moved;
}

/* 一價那張商品圖：上緣**貼著**機型／SKU 那一行的下緣（中間不留空），
   往下填到下邊界，維持正方形。
   為什麼要量：那一疊有多高要看品名換不換行、轉盤把字放多大 ——
   寫死一個百分比的話，字一大圖就被壓到，字一小中間就開一個洞。
   自己搬過（placed）或自己縮放過（w0）的不碰，那是使用者的東西。 */
function stickImage(blocks){
  const imgs=(blocks||[]).filter(b=>b.kind==='img' && b.stick && !b.placed && !b.w0);
  if(!imgs.length) return false;
  const stack=(blocks||[]).filter(b=>b.rx==null && !b.placed
    && ['brand','name','model','sku'].includes(b.kind));
  let bottom=-Infinity;
  stack.forEach(b=>{ const n=bEl(b.id); if(!n) return;
    let k=null; try{ k=inkBox(b.id); }catch(_){}
    bottom=Math.max(bottom, n.offsetTop+(k?k.oy+k.h:n.offsetHeight));
  });
  if(!isFinite(bottom)) return false;
  const top=bottom+ty(STACK_GAP);
  const n=imgs.length;
  /* 讓開右下那一組（規格／SKU／價格），一格都不許疊到。
     那一組有兩種讓法，**取畫得比較大的那一種**：
       ・站在它左邊（beside）：往下填到下邊界，寬度到那一組的左緣為止。
         一個價格時通常是這種 —— 價格只佔右下一小塊，左邊又高又寬。
       ・站在它上面（above）：整排攤開用滿格寬，高度到那一組的上緣為止。
         價格一多就變這種 —— 幾組價格上下疊起來是一根很高的柱子，
         硬要擠在它左邊的話每張圖只剩格寬的四分之一（量到過 27%，
         而下面還空著一大片沒人用）。
     兩種都是「貼著機型那一行、靠最左邊」，差別只在往哪個方向長。 */
  let right=CW-MARGIN, high=CH-MARGIN;
  (blocks||[]).forEach(b=>{ if(b.rx==null) return;
    const el=bEl(b.id); if(!el) return;
    let k=null; try{ k=inkBox(b.id); }catch(_){}
    right=Math.min(right, el.offsetLeft+(k?k.ox:0));
    high =Math.min(high,  el.offsetTop +(k?k.oy:0));
  });
  const gapI=ty(12);
  const wide=Math.max(0, (CW-MARGIN)-MARGIN);          // 整個格寬
  const beside=Math.max(0, right-gapI-MARGIN);         // 左邊界到那一組的左緣
  /* 每一張都是正方形，所以「排得下幾張」同時夾寬也夾高：
     n 張並排的總寬不能超過可用的寬，單張的高不能超過可用的高。 */
  /* 兩種讓法各有自己的下緣：站旁邊的填到下邊界，站上面的填到那一組的上緣。 */
  const lowBeside=CH-MARGIN, lowAbove=Math.max(MARGIN, high-gapI);
  const wBeside=Math.min(lowBeside-top, beside/n);
  const wAbove =Math.min(Math.max(0, lowAbove-top), wide/n);
  const above=wAbove>wBeside;
  let w=Math.max(wBeside, wAbove);
  const availW=above ? wide : beside;
  const low   =above ? lowAbove : lowBeside;
  w=Math.max(ty(40), Math.min(w, CW-MARGIN*2));
  /* ⚠️ 上緣照 top 貼，但**下緣不准掉出這一側的底**。品名放大（或換行）之後
     那一疊會一路往下長，top 跟著跑到底線下面，剩下的高度變成 0 甚至負的 ——
     w 有 ty(40) 這道地板頂著，y 卻沒有，於是那張正方形整個掛在格子外面，
     被 .cell 的 overflow 裁掉。症狀是「字放大一點，商品圖就不見了」，
     而且完全不報錯。擠不下就讓它疊回那一疊身上 —— 寧可疊也不要不見
     （跟 stackImgs 那條同一個道理）。
     沒擠到的時候 top+w 本來就在底線以內，這一行量出來是 top 本人。 */
  const iy=Math.max(MARGIN, Math.min(top, low-w));
  const step=n>1 ? Math.max(w, (availW-w)/(n-1)) : 0;
  let moved=false;
  imgs.forEach((b,i)=>{
    const wx=MARGIN+i*step;
    if(Math.abs((+b.w||0)-w)>.5){ b.w=w; moved=true; }
    if(Math.abs((+b.y||0)-iy)>.5){ b.y=iy; moved=true; }
    if(Math.abs((+b.x||0)-wx)>.5){ b.x=wx; moved=true; }
  });
  return moved;
}

function nudgeGroupBottom(blocks){
  const el=cellEl(); if(!el) return false;
  if(!el.querySelector('.cstage')) return false;
  const list=(blocks||[]).filter(b=>!b.placed);
  const inkOf=b=>{ const n=bEl(b.id); return n?{n,k:inkBox(b.id)}:null; };
  let moved=false;

  // 左上那一疊：每一塊各自對左緣（框的內距不一樣），整疊一起對上緣
  const stack=list.filter(b=>['brand','name','model','sku'].includes(b.kind) && b.rx==null);
  if(stack.length){
    let top=Infinity;
    stack.forEach(b=>{ const o=inkOf(b); if(!o) return;
      /* 併排的那條 SKU 不對左緣 —— 它的左緣是「機型的右緣＋一個空隙」（inlineSku），
         拉回邊界就等於把它疊回機型上面。上緣那一下它要跟著整疊走。 */
      if(!b.inline){
        const dx=MARGIN-(o.n.offsetLeft+o.k.ox);
        if(Math.abs(dx)>.5){ b.x=(+b.x||0)+dx; moved=true; }
      }
      top=Math.min(top, o.n.offsetTop+o.k.oy);
    });
    if(isFinite(top)){
      const dy=MARGIN-top;
      if(Math.abs(dy)>.5){
        stack.forEach(b=>{ b.y=(+b.y||0)+dy; });
        /* 貼著那一疊的圖跟著一起挪，不然這一下會在 SKU 和圖中間開一條縫。 */
        list.forEach(b=>{ if(b.kind==='img' && b.stick) b.y=(+b.y||0)+dy; });
        moved=true;
      }
    }
  }

  // 商品圖：整排一起挪，讓最左邊那張的看得見的左緣落在邊界上
  const imgs=list.filter(b=>b.kind==='img');
  if(imgs.length){
    let left=Infinity;
    imgs.forEach(b=>{ const o=inkOf(b); if(o) left=Math.min(left, o.n.offsetLeft+o.k.ox); });
    if(isFinite(left)){
      const dx=MARGIN-left;
      if(Math.abs(dx)>.5){ imgs.forEach(b=>{ b.x=(+b.x||0)+dx; }); moved=true; }
    }
  }

  /* 右下那一組：整組一起挪，讓看得見的下緣和右緣落在邊界上。
     下緣挪 y，右緣挪 rx（rx 是「離右邊界多遠」，往右是減）。 */
  const grp=list.filter(b=>b.col!=null && b.rx!=null);
  if(grp.length){
    let low=-Infinity, right=-Infinity;
    grp.forEach(b=>{ const o=inkOf(b); if(!o) return;
      low  =Math.max(low,   o.n.offsetTop +o.k.oy+o.k.h);
      right=Math.max(right, o.n.offsetLeft+o.k.ox+o.k.w);
    });
    if(isFinite(low) && isFinite(right)){
      const dy=(CH-MARGIN)-low, dx=(CW-MARGIN)-right;
      if(Math.abs(dy)>.5||Math.abs(dx)>.5){
        grp.forEach(b=>{
          if(Math.abs(dy)>.5) b.y=(+b.y||0)+dy;
          if(Math.abs(dx)>.5) b.rx=Math.max(0,(+b.rx||0)-dx);
        });
        moved=true;
      }
    }
  }
  return moved;
}

/* ====== 為什麼這裡不再有 autoSpace ==========================================
   原版（2cellOriginal.html）沒有排版後處理：位置在 buildBlocks 就算完了，
   而且那些數字是**比例**（在 540×420 的框裡量的），所以任何形狀的格子都裝得下。

   這裡本來有一整套後處理：量完 DOM 再靠右對齊、統一欄寬（w2）、價格貼底
   （nudgeGroupBottom）、字級讓步（--ts）、整份縮（--fit）、商品圖讓步（IMG_FIT），
   還有跟上層來回協商同組字級。那一整套存在的理由只有一個 ——
   **字級是寫死的 px，格子大小卻是實際公分**，格子一矮內容就比框大。
   改成照比例排之後那個前提不成立了，所以整套一起拿掉：
   少了那些來回，也就沒有「排完再量、量完再排」那幾圈重繪。

   autoSpace 這個名字留一個空殼：呼叫的地方還在（renderOne），
   而且哪天真的需要後處理時，這裡是它該回來的位置。 */
function autoSpace(){ return false; }

/** 這組 block 是不是舊版排的：有價格，卻沒有一塊帶欄號或右下角錨點。
    舊檔載進來要認得出來、重建一次（見 restoreBoard）—— 那一版的座標是照
    別套規則擺的，直接照搬會疊在一起。 */
function oldLayout(bs){
  const ps=(bs||[]).filter(b=>b.kind==='price');
  return ps.length>0 && ps.every(b=>b.col==null && !b.anchor);
}

/* ====== 拖曳 / 框選 / 合併 ====== */
let drag=null, marq=null, dragHappened=false;
let rz=null;                         // 正在拖角落改大小
let guides=[];                       // 目前要畫的引導線
const SNAP=6;                        // 弱磁吸半徑(px)，超過就掙脫
/* 格子中線的吸力半徑。比 SNAP 大很多，而且贏過其他線 —— 置中是一個「講得出名字」
   的位置，值得被吸過去；貼齊隔壁那塊的邊常常只是碰巧。 */
const SNAP_STRONG=18;
/* 格線純粹是一把看得到的尺：開著就一直鋪在版面上，關著就沒有，跟拖曳無關，
   也**不吸** —— 零件想放在兩條線中間就放得到（吸到 10 的倍數等於「只能放在線上」）。
   平常那層網子會擋住你看真正的排版，所以預設關著。 */
let SHOW_GRID=false;

/* 量測所有 block 的實際尺寸（拖曳開始時做一次） */
/* 一塊零件在排版座標裡真正占多大 —— offsetWidth/offsetHeight 含 border 和 padding，
   而且量到的就是 CSS 定位用的同一套數字（不必再除縮放）。
   本來是 getBoundingClientRect()/scaleOf()：那個值漏掉框線和內距，夾邊界的時候
   就以為還有空間，於是拖得出邊界（量到過價格被拖出下緣 4 個單位）。 */
function outerSize(id){
  const n=bEl(id);
  return n ? { w:n.offsetWidth, h:n.offsetHeight } : { w:0, h:0 };
}

/* 一塊零件**看得見的**外框（ink box），相對於它的左上角：{ox,oy,w,h}。
   為什麼不是 offsetWidth/offsetHeight：那是 border box，裡面有 padding、border，
   而字還有自己的空隙 —— 數字用 Anton、line-height:1，字框比數字高一大截
   （量到過：框貼齊下邊界時，數字離邊界還有 18px，右邊卻只有 5px。同樣是「10」的
   邊界，看起來一邊是另一邊的三倍多）。
   對齊線、磁吸、夾邊界都改用這個框，看到的東西才會真的對齊。 */
let inkCv=null;
function inkBox(id){
  const n=bEl(id);
  if(!n) return { ox:0, oy:0, w:0, h:0 };
  const cs=getComputedStyle(n);
  const bl=parseFloat(cs.borderLeftWidth)||0, bt=parseFloat(cs.borderTopWidth)||0;
  const br=parseFloat(cs.borderRightWidth)||0, bb=parseFloat(cs.borderBottomWidth)||0;
  const pl=parseFloat(cs.paddingLeft)||0, pt=parseFloat(cs.paddingTop)||0;
  const pr=parseFloat(cs.paddingRight)||0, pb=parseFloat(cs.paddingBottom)||0;
  // 先退到 content box —— 每一種零件都適用，而且一定比 border box 準
  const box={ ox:bl+pl, oy:bt+pt,
              w:Math.max(0,n.offsetWidth-bl-br-pl-pr),
              h:Math.max(0,n.offsetHeight-bt-bb-pt-pb) };
  /* 單行的字再往裡量一次真正的墨水範圍。多行（品名會換行）就停在 content box：
     一行一行量得先拆行，那是另一件事，而且品名的字框空隙小很多。 */
  const txt=(n.textContent||'').trim();
  const lh=parseFloat(cs.lineHeight)||0;
  if(!txt || !lh || box.h > lh*1.6) return box;
  try{
    inkCv = inkCv || document.createElement('canvas').getContext('2d');
    inkCv.font = cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    const m=inkCv.measureText(txt);
    const fa=m.fontBoundingBoxAscent, fd=m.fontBoundingBoxDescent;
    const aa=m.actualBoundingBoxAscent, ad=m.actualBoundingBoxDescent;
    if(!(fa>=0)||!(aa>=0)) return box;
    // 半行距：line-height 和字框的差，上下各分一半 —— 基線就從這裡算
    const base=box.oy+(lh-(fa+fd))/2+fa;
    const top=base-aa, bot=base+ad;
    const w=Math.min(box.w, m.width||box.w);
    // 靠右對齊的（價格／SKU／規格）墨水貼右緣，其餘貼左緣
    const rightAligned = cs.textAlign==='right' || cs.direction==='rtl';
    const ox = rightAligned ? box.ox+box.w-w : box.ox;
    return { ox, oy:top, w, h:Math.max(0,bot-top) };
  }catch(_){ return box; }
}

function measure(){
  const m={};
  for(const b of BLOCKS) m[b.id]=inkBox(b.id);
  return m;
}

/* 這一塊現在有沒有乖乖待在邊界裡。用畫出來的位置問（offsetLeft/Top），
   所以右緣錨點（b.rx）那幾塊也問得到。
   四邊都問 MARGIN，跟 clampAll 同一套 —— 兩邊的尺不一樣的話，會有一塊「拖不過去
   卻被判定凸出去」的零件，每次改大小就被整份還原回去。 */
function withinMargin(id){
  const n=bEl(id); if(!n) return true;
  const k=inkBox(id);
  const l=n.offsetLeft+k.ox, t=n.offsetTop+k.oy;
  return l >= MARGIN-.5 && t >= MARGIN-.5
      && l + k.w <= CW - MARGIN + .5
      && t + k.h <= CH - MARGIN + .5;
}

/* 依候選線做弱磁吸；回傳 {dx,dy,guides} */
/* 安全邊界：**四邊都擋**（談定的）。以前左右擋的是格子本身的邊（0 和 CW），
   理由是「價格、SKU 要能真的貼到格子邊緣」；改成四邊之後那件事做不到了，
   換來的是紅線就是牆 —— 看得到的那條線和拖得到的地方是同一條。 */
function clampAll(ids,sizes){
  if(!sizes) return;
  // 以整組外框計算，維持相對位置
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const id of ids){
    const b=BLOCKS.find(x=>x.id===id); if(!b) continue;
    const s=sizes[id]||{w:0,h:0,ox:0,oy:0};
    const x=b.x+(s.ox||0), y=b.y+(s.oy||0);
    L=Math.min(L,x); T=Math.min(T,y);
    R=Math.max(R,x+s.w); B=Math.max(B,y+s.h);
  }
  if(L===Infinity) return;
  let ox=0, oy=0;
  if(L<MARGIN) ox=MARGIN-L;
  if(R+ox>CW-MARGIN) ox=Math.min(ox,(CW-MARGIN)-R);
  if(T<MARGIN) oy=MARGIN-T;
  if(B+oy>CH-MARGIN) oy=Math.min(oy,(CH-MARGIN)-B);
  if(ox||oy) for(const id of ids){
    const b=BLOCKS.find(x=>x.id===id); if(b){ b.x+=ox; b.y+=oy; }
  }
}

/* 一塊零件現在畫在哪（排版座標）。右下那一組是用「離右邊界多遠」定位的（b.rx），
   它們**根本沒有 b.x** —— 直接拿 b.x 去算對齊線，候選線就是 NaN，而 NaN 的比較
   全部回 false：`Math.abs(NaN)>R` 擋不住它，於是 bestX.d 變成 NaN、被拖的那幾塊
   b.x 也跟著 NaN。`left:NaNpx` 是無效宣告會被整條丟掉，那一塊就掉回容器左緣
   —— 「拖完放手圖片跑到最左」就是這樣來的。
   （以前看不到是因為對齊線被一道「差 3 以內才算」的閘擋著，NaN 過不了那道閘就被
     當成 0；閘拿掉之後這個洞才露出來。）
   沒有 x 就問畫出來的那一個（offsetLeft）—— 順便讓 rx 那幾塊也有對齊線可以吸。 */
function blockXY(b){
  const fx=Number.isFinite(+b.x), fy=Number.isFinite(+b.y);
  if(fx && fy) return {x:+b.x, y:+b.y};
  const n=bEl(b.id); if(!n) return null;
  return { x: fx?+b.x:n.offsetLeft, y: fy?+b.y:n.offsetTop };
}

function snap(movingIds, sizes){
  const moving=movingIds.map(id=>BLOCKS.find(b=>b.id===id));
  // 移動群組的整體外框
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const b of moving){
    const s=sizes[b.id]||{w:0,h:0,ox:0,oy:0};
    const x=b.x+(s.ox||0), y=b.y+(s.oy||0);
    L=Math.min(L,x); T=Math.min(T,y);
    R=Math.max(R,x+s.w); B=Math.max(B,y+s.h);
  }
  const gV=[{v:L,e:'l'},{v:(L+R)/2,e:'c'},{v:R,e:'r'}];   // 群組的垂直邊
  const gH=[{v:T,e:'t'},{v:(T+B)/2,e:'m'},{v:B,e:'b'}];

  /* 目標線：其他 block 的邊/中線 + 格子邊界與中線。
     格子的中線標成 strong：置中是「講得出名字」的位置，跟「剛好貼到隔壁那塊的邊」
     不一樣 —— 後者只是碰巧。所以中線吸力大、而且贏過其他線（見下面的 better）。
     ⚠️ 直的那一組**只有格子的邊**（0／CW），沒有 MARGIN。左右的牆拿掉之後，MARGIN
     那兩條線就只是版面裡的兩個數字，不是邊界了 —— 留著的話它照樣把零件吸在離邊
     8 個單位的地方，牆是拆了，可是拖起來還是「推不過去那一條線」，看起來根本沒改。
     （要對齊預設那一欄還是對得到：品名、商品圖自己的邊本來就在下面那個迴圈裡。） */
  const tV=[{v:0},{v:CW/2,strong:1},{v:CW}],
        tH=[{v:MARGIN},{v:CH/2,strong:1},{v:CH-MARGIN}];
  for(const b of BLOCKS){
    if(movingIds.includes(b.id) || isOff(b)) continue;   // 藏起來的不當對齊線
    const s=sizes[b.id]||{w:0,h:0,ox:0,oy:0};
    const p=blockXY(b); if(!p) continue;
    const x=p.x+(s.ox||0), y=p.y+(s.oy||0);
    tV.push({v:x},{v:x+s.w/2},{v:x+s.w});
    tH.push({v:y},{v:y+s.h/2},{v:y+s.h});
  }

  /* 強的先贏，同強度才比誰近 —— 只比距離的話，中線旁邊隨便一條別人的邊都比它近，
     中線就永遠吸不到（版面上每一塊的邊和中線都是候選線，六個 px 內幾乎一定有一條）。 */
  const pick=(best,d,t)=>{
    const R=t.strong?SNAP_STRONG:SNAP;
    // 寫成「不在範圍內就算了」而不是「超過就算了」：NaN 兩邊都回 false，
    // 前者擋得住它、後者放它過（見 blockXY 那一段的傷疤）
    if(!(Math.abs(d)<=R)) return best;
    if(!best) return {d,line:t.v,strong:!!t.strong};
    if(!!t.strong!==!!best.strong) return t.strong ? {d,line:t.v,strong:1} : best;
    return Math.abs(d)<Math.abs(best.d) ? {d,line:t.v,strong:!!t.strong} : best;
  };
  let bestX=null,bestY=null;
  for(const g of gV) for(const t of tV) bestX=pick(bestX,t.v-g.v,t);
  for(const g of gH) for(const t of tH) bestY=pick(bestY,t.v-g.v,t);
  const gl=[];
  if(bestX) gl.push({dir:'v',pos:bestX.line,strong:!!bestX.strong});
  if(bestY) gl.push({dir:'h',pos:bestY.line,strong:!!bestY.strong});
  return {dx:bestX?bestX.d:0, dy:bestY?bestY.d:0, guides:gl,
          strongX:!!(bestX&&bestX.strong), strongY:!!(bestY&&bestY.strong)};
}

/* 只在目前格子內查找 block 元素（多格時 id 會重複出現在每一格） */
function bEl(id){ const c=cellEl(); return c?c.querySelector(`[data-b="${id}"]`):null; }
/* 螢幕上真正套在內容上的比例 —— 含那道「裝不下就整份縮」的 FIT。
   漏掉 FIT 的話，被縮過的那些格子裡，滑鼠座標換回排版座標會差一個倍率：
   拖曳看起來就是「手往右移一格，東西跑兩格」。 */
function scaleOf(){ return (cellEl()?cellEl().clientWidth:CW)/CW; }
/* 滑鼠座標 -> 排版座標（除以縮放比） */
function cellPt(e){
  const el=cellEl(); if(!el) return {x:0,y:0};
  const r=el.getBoundingClientRect(), k=scaleOf();
  return {x:(e.clientX-r.left)/k, y:(e.clientY-r.top)/k};
}
function blockAt(x,y,exceptId){
  // 由上往下找命中的 sku block
  for(let i=BLOCKS.length-1;i>=0;i--){
    const b=BLOCKS[i];
    if(b.kind!=='sku'||b.id===exceptId) continue;
    const el=bEl(b.id); if(!el) continue;
    const r=el.getBoundingClientRect(), c=cellEl().getBoundingClientRect(), k=scaleOf();
    const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
    if(x>=bx&&x<=bx+r.width/k&&y>=by&&y<=by+r.height/k) return b;
  }
  return null;
}

document.getElementById('grid').addEventListener('mousedown',e=>{
  const ce=e.target.closest('.cell'); if(!ce) return;
  const idx=+ce.dataset.cell;
  if(idx!==curCell){ saveCell(); loadCell(idx); selected.clear(); activeImg=null;
    CELLS.forEach((c,i)=>renderOne(i));
    renderPick();                   // 內容切換成這一格的
  }
  // 不論是否換格，按到任何格子都必定展開兩個窗口
  openPanels(true); renderLayers();
  if(!picked.size) return;
  if(e.target.closest('.tobtn,.delbtn')) return;   // 按鈕不觸發拖曳
  /* 已經選起來的那張貼圖，按在它的字上＝進去改字。不放行的話這一下會被當成
     「抓著它搬」：整格當場重畫，按住的那個節點被換掉，游標永遠進不到字裡面。 */
  if(e.target.closest('.blk.sticker.sel') && e.target.closest('.ft')) return;
  /* 拖角落＝改大小，不是搬位置。要在找 .blk 之前攔下來，不然它也算按在那一塊上，
     會同時開始搬移，變成一邊拉大一邊亂跑。 */
  const hz=e.target.closest('.rz');
  if(hz && ROLE!=='pm'){
    const b=BLOCKS.find(x=>x.id===hz.parentElement.dataset.b);
    if(b){
      /* 沒圖的那一塊，把手站在灰圖的角上 —— 對角那一點也要量灰圖，
         不然「游標離對角多遠」一開始就多算了那一圈空白，拉起來會比手慢。 */
      const pe=hz.parentElement, phEl=pe.classList.contains('noimg') && pe.querySelector(':scope > .ph');
      const r=(phEl||pe).getBoundingClientRect(), k=scaleOf();
      const c=hz.dataset.corner;
      rz={ id:b.id, corner:c, base:scaleBase(b),
           w0:+b.w||r.width/k, h0:r.height/k,
           mx:e.clientX, my:e.clientY,
           /* 對角那一點固定不動，量的是「游標離它多遠」的變化 —— 跟 PPT 一樣，
              拉哪一角就從那一角長出去。 */
           ax:(hz.dataset.corner.includes('e')?r.left:r.right),
           ay:(hz.dataset.corner.includes('s')?r.top:r.bottom),
           d0:0 };
      rz.d0=Math.hypot(e.clientX-rz.ax, e.clientY-rz.ay)/k || 1;
    }
    e.preventDefault(); e.stopPropagation();
    return;
  }
  /* 滾輪循環選到的那一層優先。e.target 永遠是**最上面**那一塊，所以照它抓的話，
     循環等於白做：X 光把擋路的那幾張調淡、你也看到要的是底下那張了，按下去抓到的
     還是擋在前面那一張 —— 被壓住的預留圖因此永遠搬不動。
     只有游標還落在那一層身上才算數；滑開了就回到一般規則（抓最上面那個）。 */
  let el=e.target.closest('.blk');
  if(activeImg && ROLE!=='pm'){
    const a=bEl(activeImg), r=a&&a.getBoundingClientRect();
    if(r && e.clientX>=r.left && e.clientX<=r.right
         && e.clientY>=r.top  && e.clientY<=r.bottom) el=a;
  }
  const p=cellPt(e);
  if(el){
    const id=el.dataset.b;
    const blk=BLOCKS.find(x=>x.id===id);
    /* 右下那一組是用「離右邊界多遠」定位的（b.rx）。要搬它之前先換算成絕對的 x ——
       量它現在畫在哪（offsetLeft 就是排版座標），然後把錨點拿掉。
       不換的話拖曳算出來的 b.x 根本沒人在看，放手後它會跳回右邊界。 */
    unpin(blk);
    if(blk && stackable(blk)){
      // 點商品圖或貼圖：立刻選為當前圖層（圖層清單那一列跟著亮）
      activeImg=id;
      if(blk.kind==='img') openPanels(true);   // 貼圖不順手開面板：多半只是要拖它
      setTimeout(renderLayers,0);
    }
    /* Ctrl／⌘ 和 Shift 是同一件事：加進選取（再點一次就拿掉）。
       兩顆都認 —— 別的軟體兩種都有人用，而這裡不需要它們分工。 */
    const add = e.shiftKey || e.ctrlKey || e.metaKey;
    if(!selected.has(id)){
      if(!add) selected.clear();
      selected.add(id);
    }else if(add){ selected.delete(id); }
    // 拖動所有已選 block —— PM 只能選，位置是設計的事
    if(ROLE!=='pm'){
      [...selected].forEach(i=>unpin(BLOCKS.find(x=>x.id===i)));
      drag={start:p, ids:[...selected],
        orig:Object.fromEntries([...selected].map(i=>{const b=BLOCKS.find(x=>x.id===i);return [i,{x:b.x,y:b.y}]})),
        main:id, moved:false, sizes:null};
      renderCell(); drag.sizes=measure();
    }
    renderCell();
  }else{
    // 點格子空白處：取消框選並取消目前選中的 PNG 圖層
    if(!e.shiftKey) selected.clear();
    if(activeImg){ activeImg=null; stackUnder=[]; cycleIndex=0; setTimeout(renderLayers,0); }
    marq={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
    renderCell();
  }
  e.preventDefault();
});

addEventListener('mousemove',e=>{
  if(rz){
    const b=BLOCKS.find(x=>x.id===rz.id);
    if(b){
      const k=scaleOf();
      /* 改大小之前先存一份。改完畫出來如果凸出邊界，就整份還原 ——
         「碰到邊界就停住」，跟拖曳撞到邊界是同一個行為（PPT 在框裡也是這樣）。
         為什麼是「改完再檢查」而不是先算出上限：一塊零件畫出來多大要含字框、
         border、padding，那三樣只有瀏覽器算得準（拖曳那邊漏掉它們就是 4 個單位的洞）。 */
      const snap0 = { x:b.x, y:b.y, w:b.w, h:b.h, sc:b.sc, fsFix:b.fsFix, w0:b.w0 };
      /* 四個角，一律等比例：量的是「游標離對角那一點多遠」的變化，
         整塊只有一個倍率，所以長寬比不可能被拉走。 */
      {
        const d=Math.hypot(e.clientX-rz.ax, e.clientY-rz.ay)/k;
        let r=d/rz.d0;
        if(e.shiftKey) r=1+(r-1)*.35;      // 微調：同樣的手移距離只走三分之一
        setBlockScale(b, rz.base*r);
      }
      holdPlace(b);                     // 拉過大小就釘住，別再被自動排版搬走
      dragHappened=true;
      renderOne(curCell,true);          // 尺寸變了要重量，不然把手停在舊位置
      if(!withinMargin(b.id)){          // 撞到邊界：這一步不算，停在上一個尺寸
        b.x=snap0.x; b.y=snap0.y;
        if(snap0.w!=null) b.w=snap0.w; else delete b.w;
        if(snap0.h!=null) b.h=snap0.h; else delete b.h;
        if(snap0.sc!=null) b.sc=snap0.sc; else delete b.sc;
        if(snap0.fsFix!=null) b.fsFix=snap0.fsFix; else delete b.fsFix;
        if(snap0.w0!=null) b.w0=snap0.w0; else delete b.w0;
        renderOne(curCell,true);
      }
      paintHandles();
    }
    e.preventDefault();
    return;
  }
  if(drag){
    const p=cellPt(e), dx=p.x-drag.start.x, dy=p.y-drag.start.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2) drag.moved=true;
    /* 零件放哪裡就是哪裡：格線只是給眼睛的尺，不是軌道。本來拖曳先吸到 10 的倍數上，
       等於「只能放在線上」，微調得按著 Alt 才做得到 —— 那是把工具的方便加在使用者頭上。 */
    const gx=dx, gy=dy;
    for(const id of drag.ids){
      const b=BLOCKS.find(x=>x.id===id);
      b.x=drag.orig[id].x+gx; b.y=drag.orig[id].y+gy;
    }
    clampAll(drag.ids, drag.sizes);
    /* 對齊線是唯一的吸力了（格線不再吸，見上面）。它吸的是「講得出名字」的位置 ——
       跟隔壁那塊切齊、站在格子中線上；按住 Alt 就一點都不吸，那是微調用的臨時開關。 */
    guides=[];
    if(drag.sizes && !e.altKey){
      const sn=snap(drag.ids, drag.sizes);
      if (!sn){ guides=[]; }
      else {
      const ax=sn.dx, ay=sn.dy;
      if(ax||ay){
        for(const id of drag.ids){
          const b=BLOCKS.find(x=>x.id===id); b.x+=ax; b.y+=ay;
        }
        guides=sn.guides.filter(g=>(g.dir==='v'?ax:ay)!==0);
        clampAll(drag.ids, drag.sizes);
      }
      }
    }
    // 合併預示
    const src=BLOCKS.find(x=>x.id===drag.main);
    let hit=null;
    if(src&&src.kind==='sku'&&drag.ids.length===1) hit=blockAt(p.x,p.y,src.id);
    drag.hit=hit;
    renderCell();
    if(hit){ const t=bEl(hit.id); if(t) t.classList.add('drop'); }
    /* 集體移動：本格其他同種零件先跟著動（renderCell 剛重建過，所以在它之後貼），
       同時把位移報給上層去預覽別格。一幀報一次就夠，滑鼠的解析度比畫面高。 */
    if(BULK_MOVE && src && drag.orig && drag.orig[src.id]) bulkPreviewTick(src);
  }else if(marq){
    const p=cellPt(e); marq.x1=p.x; marq.y1=p.y;
    const c=cellEl().getBoundingClientRect();
    const L=Math.min(marq.x0,marq.x1),R=Math.max(marq.x0,marq.x1),
          T=Math.min(marq.y0,marq.y1),B=Math.max(marq.y0,marq.y1);
    selected.clear();
    const k=scaleOf();
    for(const b of BLOCKS){
      const el=bEl(b.id); if(!el) continue;
      const r=el.getBoundingClientRect();
      const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
      if(bx<R&&bx+r.width/k>L&&by<B&&by+r.height/k>T) selected.add(b.id);
    }
    renderCell();
    const m=document.getElementById('marquee'+curCell);
    if(m){ m.style.display='block'; m.style.left=L+'px'; m.style.top=T+'px';
           m.style.width=(R-L)+'px'; m.style.height=(B-T)+'px'; }
  }
});

/* ====== 滾輪：在游標下重疊的圖層之間循環 ====== */
/* 嵌在版面裡的畫布（?ui=stage）：滾輪是外面那張版的縮放，不是捲這個 iframe。
   不轉出去的話，滾輪會被 iframe 自己吃掉 —— 游標一移到格子上，縮放就失靈，
   而格子正好佔滿整張版，等於整片都不能縮放。
   疊在圖上時仍然先給「切換圖層」用（那是這裡本來就有的手勢），沒有圖才轉出去。 */
/* 拼板 那邊把每一格的畫布都打開了（要拖零件就直接拖，不必先點開那一格），代價是
   「按在空白處」那一下也會被這個 iframe 收走 —— 而平移、上色、貼貼紙、點開這一格
   全都靠那一下。所以只要這一下不是按在零件上，就把它原封不動轉出去，外面照它本來
   的規則處理；轉的是 iframe 自己的 clientX/clientY，跟滾輪那條路同一個做法。 */
if(UI_STAGE) addEventListener('pointerdown',e=>{
  if(e.target.closest && e.target.closest('.blk')) return;   // 按在零件上：這就是要拖它
  try{ parent.postMessage({ stagePass:{ cx:e.clientX, cy:e.clientY,
                                        button:e.button } }, '*'); }catch(_){}
}, true);

function relayWheel(e){
  if(!UI_STAGE) return false;
  e.preventDefault();
  /* cx/cy 是「在這個 iframe 裡的座標」—— 上層用 e.source 找到是哪一個 iframe，
     加上它的 getBoundingClientRect() 就得到確切的頁面座標。
     screenX/screenY 也還是送（舊的上層還在用），但那條路要靠減掉瀏覽器外框去猜，
     猜歪了縮放就不是以游標為中心 —— 那是「一縮放整張版就跳到中間」的來源。 */
  try{ parent.postMessage({ stageWheel:{ deltaY:e.deltaY, cx:e.clientX, cy:e.clientY,
                                         x:e.screenX, y:e.screenY } }, '*'); }catch(_){}
  return true;
}

/* 滾輪一律轉出去。在 拼板 裡這個 iframe 整片都是「版面」，沒有一個地方該自己捲。
   本來只綁在 #grid 上，於是浮在版面上、卻不在 #grid 裡面的東西沒人管 —— 左下那顆
   ＋ 就是（它跟 #grid 是兄弟，掛在 #wrap 底下）。滾輪落回瀏覽器手上就去捲這一頁，
   看起來就是「滑到 ＋ 上面，整個畫布自己動了」。
   綁在 window 的**冒泡**階段，不是捕捉：#grid 那邊的手勢（疊在一起的圖用滾輪切換）
   要先跑完。它處理掉的都會 preventDefault，所以這裡看 defaultPrevented 就知道
   「還沒有人要這一發」。 */
if(UI_STAGE) addEventListener('wheel',e=>{
  if(e.defaultPrevented) return;
  /* 展開的那張清單自己捲得動就讓它捲 —— 那是一張選單，不是畫布。
     捲不動（項目少、沒有溢出）就照樣轉出去，不然滑到清單上就變成一個死角。 */
  const list=e.target.closest && e.target.closest('.rlist');
  if(list && list.scrollHeight > list.clientHeight + 1) return;
  relayWheel(e);
},{passive:false});

document.getElementById('grid').addEventListener('wheel',e=>{
  const ce=e.target.closest('.cell'); if(!ce){ relayWheel(e); return; }
  const idx=+ce.dataset.cell;
  if(idx!==curCell){ saveCell(); loadCell(idx); CELLS.forEach((c,i)=>renderOne(i)); renderPick(); renderLayers(); }
  if(!picked.size){ relayWheel(e); return; }
  /* 疊在一起的東西＝商品圖和貼圖（跟 bringTop 的「stackable」同一份名單）。
     以前只算商品圖，於是壓在圖底下、或疊在一起的貼圖永遠輪不到，也就搬不動。 */
  const layers=BLOCKS.filter(stackable);
  if(!layers.length){ relayWheel(e); return; }
  // 游標下所有疊得起來的零件（由 z 大到小）
  const p=cellPt(e), c=cellEl().getBoundingClientRect();
  const k=scaleOf();
  const under=layers.filter(b=>{
    const el=bEl(b.id); if(!el) return false;
    const r=el.getBoundingClientRect();
    const bx=(r.left-c.left)/k, by=(r.top-c.top)/k;
    return p.x>=bx&&p.x<=bx+r.width/k&&p.y>=by&&p.y<=by+r.height/k;
  }).sort((a,b)=>b.z-a.z);
  if(!under.length){ activeImg=null; renderCell(); relayWheel(e); return; }
  e.preventDefault();
  const ids=under.map(b=>b.id).join(',');
  if(ids!==stackUnder.join(',')){ stackUnder=under.map(b=>b.id); cycleIndex=0; }
  else cycleIndex=(cycleIndex+(e.deltaY>0?1:-1)+under.length)%under.length;
  activeImg=stackUnder[cycleIndex];
  renderCell(); renderLayers();
},{passive:false});

/* 「最上面」和貼圖那顆 ✕ */
document.getElementById('grid').addEventListener('click',e=>{
  const btn=e.target.closest('[data-top]');
  if(btn){ e.stopPropagation(); bringTop(btn.dataset.top); }
  const del=e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); delSticker(del.dataset.del); }
});

/* 點一個空框＝把那個庫開起來：商品圖的空框去商品目錄，品牌的空框去品牌 Logo 庫。
   空框講的就是「這裡少一張圖」，而那張圖不在這本 DM 裡 —— 少的東西在哪裡，
   點它就該到得了，不必先記得它叫什麼名字再回上面那排找按鈕。
   只認真正的「點」：搬零件也是先按下去的，位移超過幾個 px 就是在拖它，不是在問路。 */
/* ⚠️ 不能掛 click：按下去那一下就會重畫整格（換格、選取都會），按住的那個節點
   當場被換掉，於是瀏覽器的 click 落在共同祖先上，`closest('.blk')` 什麼都找不到。
   所以按下去的時候先記住是哪一塊，放手的時候再問。 */
let clickAt=null;
document.getElementById('grid').addEventListener('mousedown',e=>{
  clickAt=null;
  if(window.parent===window) return;             // 單獨開這一頁：沒有那兩個庫可以開
  if(e.target.closest('[data-top],[data-del]')) return;
  const el=e.target.closest('.blk'); if(!el) return;
  clickAt={x:e.clientX, y:e.clientY, id:el.dataset.b};
});
addEventListener('mouseup',e=>{
  const c=clickAt; clickAt=null;
  if(!c) return;
  if(Math.abs(e.clientX-c.x)>3 || Math.abs(e.clientY-c.y)>3) return;   // 那是在拖它
  const b=BLOCKS.find(x=>String(x.id)===c.id); if(!b) return;
  const el=bEl(b.id);
  const lib = (b.kind==='img'   && !imgUrlOf(b.key))            ? 'product'
            : (b.kind==='brand' && el && el.querySelector('.bph')) ? 'logo' : '';
  if(!lib) return;
  /* 帶上「少的是哪一個」：開到庫只做了一半，一份幾百列的表人還得自己找。
     商品帶圖鑰匙（跟目錄那一頁同一支 imgKey）和 SKU，品牌帶品牌名。 */
  const msg = { boardCell:CELL_ID, openLib:lib };
  if(lib==='product'){ msg.key = b.key || ''; msg.sku = String((b.row && b.row.sku) || ''); }
  else msg.brand = b.brand || '';
  try{ parent.postMessage(msg, '*'); }catch(_){}
});
/* 兩個窗口一律同進同退，不因格子有沒有內容而分開。
   各留各的：設計 沒有選商品面板，PM 沒有圖層面板（疊放順序是排版的事）。 */
let panelsOn=false;
function openPanels(on){
  if(UI_PANEL) on=true;                 // 只出借面板時，收起來就什麼都不剩了
  panelsOn=on;
  $('#panel').classList.toggle('on', on && ROLE!=='design');
  $('#lay').classList.toggle('on',   on && ROLE!=='pm');
}
/* 商品圖和貼圖共用同一疊 z：兩者都是「蓋在版上的一張圖」，最上層講的是
   同一件事。文字／價格那些不在這疊裡——它們從來沒有「最上面」這顆鈕。 */
const stackable = b => b.kind==='img' || b.kind==='sticker';
function bringTop(id){
  const b=BLOCKS.find(x=>x.id===id); if(!b) return;
  const maxZ=Math.max(...BLOCKS.filter(stackable).map(x=>x.z));
  if(b.z!==maxZ){ b.z=maxZ+1; normalizeZ(); }
  /* 圖層面板列的是商品圖和貼圖（見 renderLayers），移到最上面的那一層就是現在這一層。 */
  if(stackable(b)) activeImg=id;
  renderCell(); renderLayers();
}
function normalizeZ(){
  BLOCKS.filter(stackable).sort((a,b)=>a.z-b.z)
    .forEach((b,i)=>b.z=i+1);
}

/* ====== 貼圖：照模板現場排 ==================================================
   一張貼紙身上帶三樣東西：它是庫裡哪一張（b.libId）、它當下長什麼樣（b.tpl，
   整份模板抄一份）、以及**這一格自己**改過的那幾個字（b.vals）。
   為什麼模板要抄一份而不是只記編號：庫裡改了那一張，已經貼出去的不該跟著變；
   庫裡刪掉了，版上這一張也不該跟著消失。
   （代價是庫裡那一張之後被改了，已經貼出去的不跟著變 —— 跟品牌圖那條同一個
   道理：有人特地擺上去的，那就是他要的那一張。） */
function stickerTpl(b){
  try{ return b && b.tpl ? JSON.parse(b.tpl) : null; }catch(e){ return null; }
}
function stickerRatio(b){
  if(+b.ratio) return +b.ratio;
  const t=stickerTpl(b);
  return (t && +t.ratio) || .4;
}
/* 模板在就照模板排（字改得動），不在就退回那張烤好的圖 —— 這個功能加進來之前
   貼上去的那些就是只有圖，照樣要看得到，只是改不了字。 */
function stickerArt(b, W, H){
  const tpl=stickerTpl(b);
  if(!tpl){
    return b.svg ? `<img src="${b.svg}" alt="${String(b.name||'').replace(/"/g,'&quot;')}" draggable="false">` : '';
  }
  const vals=b.vals||{};
  const AW=Math.max(1,W), AH=Math.max(1,H);
  /* 先把這一格自己的字套進模板，形狀才知道要撐多寬（貼紙庫那邊是同一個順序）。
     tpl 是剛剛 parse 出來的新物件，改它不會動到 b.tpl 那個字串。 */
  StickerRender.applyVals(tpl, vals);
  StickerRender.growShapes(tpl, AW, AH);
  /* 只有設計改得動（PM／行銷那邊 ROLE 就是 'pm'）：貼圖是印出去的素材，
     跟刊頭圖同一條理由。 */
  const html=StickerRender.renderTemplate(tpl, AW, AH, vals, ROLE!=='pm', b.assets||null);
  return `<div class="stk-art">${html}</div>`;
}

/* 就地改字：點一下選起來（第一下），再點文字才進得去（第二下）。
   打完離開就寫進 b.vals 並重排一次 —— 形狀是跟著字長的，不重排的話
   「省$500」改成「省$1,200」會撐出框外。
   ⚠️ 不在每一次 input 就重排：重排等於整格重畫，游標當場不見，打第二個字就
   打不下去了。 */
const stkFt = t => (t && t.closest) ? t.closest('.blk.sticker .ft') : null;
document.addEventListener('focusin', e=>{
  const ft=stkFt(e.target); if(!ft) return;
  ft.dataset.before=ft.innerText;
  const host=ft.closest('.lbl')||ft.closest('.lyr');
  if(host) host.classList.add('editing');
});
document.addEventListener('focusout', e=>{
  const ft=stkFt(e.target); if(!ft) return;
  const host=ft.closest('.lbl')||ft.closest('.lyr');
  if(host) host.classList.remove('editing');
  const el=ft.closest('.blk.sticker'); if(!el || ROLE==='pm') return;
  const b=BLOCKS.find(x=>x.id===el.dataset.b); if(!b || !host) return;
  const lid=host.dataset.lid; if(!lid) return;
  const txt=ft.innerText.replace(/\u00a0/g,' ');
  if(txt===ft.dataset.before) return;
  b.vals=Object.assign({}, b.vals);
  b.vals[lid]=Object.assign({}, b.vals[lid], {content:txt});
  renderCell();          // 形狀跟著字長，改完要重排一次（順便報給上層存檔）
});
/* Enter ＝打完了（Shift+Enter 才是換行）：貼紙上的字多半是一行，
   而按 Enter 之後看不出有沒有存到是最容易被當成壞掉的一種。 */
document.addEventListener('keydown', e=>{
  const ft=stkFt(e.target);
  if(ft && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ft.blur(); }
});

/* 拿著 貼圖 工具在版上點這一格：上層送下來「放哪一張」，這裡負責放進去。
   s.svg 是主程式從 貼紙庫（localStorage）讀出來、已經轉成 data: URL 的那張圖 ——
   這一格不用知道貼紙內部長什麼樣，當成一張圖片貼上去就好。
   id 不能借 buildBlocks 那個流水號（那個只在整批重建時存在），
   隨手一個不會撞號的字串就夠，貼圖從來不用靠 id 對到別處的資料。 */
function addStickerBlock(s){
  if(ROLE==='pm' || !s || !(s.tpl||s.svg)) return;
  const maxZ=BLOCKS.filter(stackable).reduce((m,x)=>Math.max(m,x.z||0),0);
  const w=Math.round(Math.min(CW,CH)*0.32);
  /* 高度照這張貼紙自己的長寬比算 —— 用寬當高的話，扁的貼紙一放進來就掉到格子外面。 */
  const ratio=+s.ratio || .4;
  const h=w*ratio;
  /* s.at ＝上層放手（或點下去）的那一點，給的是**這份文件自己的客座標**
     （見 pasteStickerOn）。要再過一次 cellPt 才是排版座標 —— 中間差的是
     「裝不下就整份縮」那個倍率，只有這邊知道（見 scaleOf 的註解）。
     那一點是**中心**，不是左上角：手指指著哪裡，東西就該蓋在哪裡。
     超出去就往裡面收 —— 一半掉在格子外面的貼圖印不出來，而版上看起來只是「歪了」。
     沒帶落點（舊訊息、或量不到縮放）就照舊擺中間。 */
  const at = s.at && isFinite(s.at.cx) && isFinite(s.at.cy)
    ? cellPt({clientX:s.at.cx, clientY:s.at.cy}) : null;
  const fit=(v,max)=>Math.max(0, Math.min(Math.round(v), Math.max(0, Math.round(max))));
  const b={ id:'bs'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
            kind:'sticker', libId:s.libId||'', name:s.name||'',
            tpl:s.tpl||'',            // 模板整份（字串，跟貼紙庫存的同一份）
            vals:{},                  // 這一格自己改過的字；空的＝照模板
            assets:s.assets||null,    // 這張貼紙用到的圖片，只帶用得到的那幾張
            ratio, svg:s.svg||'', w,
            x: at ? fit(at.x - w/2, CW-w) : Math.round((CW-w)/2),
            y: at ? fit(at.y - h/2, CH-h) : Math.round((CH-h)/2), z:maxZ+1 };
  holdPlace(b);           // 手動放的，自動排版（雖然現在是關的）不該碰它
  BLOCKS.push(b);
  selected.clear(); selected.add(b.id); activeImg=null;
  renderCell();
}

/* ====== 右側圖層面板：顯示這個格子的圖層 ====== */
/* ⚠️ 拼板 裡看到的這一排，是**面板那一份**（ui=panel，另一份文件）畫的，而面板手上的
   BLOCKS 不是版上那一份：它只負責挑貨，版面上的零件從來不會傳給它（見主程式
   src==='panel' 那一條：面板報上來的 blocks 一律不收）。
   於是以前面板上的「最上面」、拖曳排順序改的都是面板自己的副本，版上一動也不動；
   貼圖只活在版上那一份，面板更是永遠列不出來。
   所以現在分兩半：
     ・畫布（ui=stage）照自己的 BLOCKS 算出這一疊，報給上層（reportLayers）
     ・面板收到就照那一份畫（STAGE_LAYERS），按下去的每一下都轉回畫布去做（layerAct）
   沒有畫布報上來的時候（單獨開這一頁、或畫布還沒起來）就照自己的畫，跟以前一樣。 */
let STAGE_LAYERS=null, STAGE_ACTIVE='', layersLater=false;
const escA=v=>String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* 這一疊（上層在前）。藏起來的圖不列：它不在版上，談不上疊在誰上面（要找回來走左下角那顆 ＋）。
   貼圖也是一層：跟商品圖疊在同一疊裡（同一份 z），不列的話排順序只排得到一半，
   而「貼圖壓在哪張圖上面」正是會想調的事。 */
function layerSummary(){
  return liveBlocks().filter(stackable).sort((a,b)=>b.z-a.z).map(b=>{
    const stk=b.kind==='sticker';
    return { id:b.id, kind:b.kind, z:b.z,
      name: stk ? '貼圖・'+escA(b.name||'貼紙') : keyLabel(b.key),
      /* 貼圖的縮圖用它帶著的那張（b.svg：貼紙庫烤好的縮圖網址，舊資料是 data:）。
         在 30px 裡現場排一張模板，字小到什麼都看不出來。 */
      thumb: stk ? (b.svg ? `<img src="${escA(b.svg)}" alt="">` : '🏷') : imgHTML(b.key, b.row) };
  });
}
const remoteLayers = () => UI_PANEL && !!STAGE_LAYERS;
const curLayer = () => remoteLayers() ? STAGE_ACTIVE : activeImg;
/* 面板按了什麼，轉給版上那一格去做 */
function layerAct(op, id, ids){
  try{ parent.postMessage({ boardCell:CELL_ID, layerAct:{ op, id, ids } }, '*'); }catch(_){}
}
/* ====== 右側圖層面板：顯示這個格子的圖層 ====== */
function renderLayers(){
  if(UI_STAGE) reportLayers();
  const box=$('#layers');
  if(lyrDrag){ layersLater=true; return; }     // 拖著一列的時候重畫＝把拖著的那一列換掉，放手就落空
  const remote=remoteLayers();
  const layers=remote ? STAGE_LAYERS : layerSummary();
  if(!layers.length){ box.innerHTML='<div class="empty-hint">尚未選商品</div>'; return; }
  const act=curLayer();
  box.innerHTML=layers.map(b=>{
    const stk=b.kind==='sticker';
    const kill=stk ? '刪掉這張貼圖（Ctrl+Z 可以救回來）' : '刪掉這張圖（左下角那顆 ＋ 可以放回來）';
    return `<div class="lrow${act===b.id?' on':''}" data-lyr="${escA(b.id)}" data-kind="${b.kind}" draggable="true">
       <span class="lgrip">☰</span>
       <span class="lthumb${stk?' stk':''}">${b.thumb}</span>
       <span class="lname">${b.name}</span>
       <span class="lz">z${b.z}</span>
       <button class="mini" data-top="${escA(b.id)}" style="margin:0">最上面</button>
       <button class="mini danger" data-kill="${escA(b.id)}" style="margin:0" title="${kill}">刪掉</button>
     </div>`;
  }).join('');

  box.querySelectorAll('.lrow').forEach(el=>{
    el.onmouseenter=()=>{
      if(lyrDrag) return;
      const id=el.dataset.lyr;
      if(remote){ if(id!==STAGE_ACTIVE) layerAct('hover', id); return; }
      activeImg=id; renderCell(); markLayerActive();
    };
    /* 點面板＝也在版上選起來。本來只設 activeImg（那只是「滾輪循環到誰」），
       版上那一塊沒有被 selected，於是點完了還要再去版上點一次才搬得動、拉得大 ——
       面板挑的是哪一層，版上就該是哪一層。 */
    el.onclick=()=>{
      const id=el.dataset.lyr;
      if(remote){ layerAct('select', id); return; }
      activeImg=id;
      selected.clear(); selected.add(id);
      renderCell(); markLayerActive(); renderProps();
    };
  });
  box.querySelectorAll('[data-top]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    if(remote){ layerAct('top', b.dataset.top); return; }
    bringTop(b.dataset.top);
  });
  /* 刪掉商品圖的入口。本來只有 Delete —— 但版面上那張灰色虛線的預留圖看起來
     就不像「可以點的東西」，沒人會先去選它再按鍵；而工具列是談定不出現的。
     圖層這一排列的剛好就是每一張商品圖（含還沒換圖的那些），刪的入口放這裡。 */
  box.querySelectorAll('[data-kill]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    if(remote){ layerAct('kill', b.dataset.kill); return; }
    killLayer(b.dataset.kill);
  });
}
/* 貼圖沒有「刪掉的」名冊可以進（見 delSticker），走它自己那一支 */
function killLayer(id){
  const blk=BLOCKS.find(x=>x.id===id);
  if(blk && blk.kind==='sticker') delSticker(blk.id); else hideBlockId(id);
}
/* 畫布：這一疊變了就報上去。沒變就不報 —— renderLayers／reportBoard 一次操作會叫好幾次。 */
let lastLayersSent='';
function reportLayers(){
  if(!UI_STAGE || window.parent===window) return;
  const layers=layerSummary();
  const msg=JSON.stringify([layers, activeImg||'']);
  if(msg===lastLayersSent) return;
  lastLayersSent=msg;
  try{ parent.postMessage({ boardCell:CELL_ID, stageLayers:layers, activeLayer:activeImg||'' }, '*'); }catch(_){}
}
/* 畫布：面板轉過來的那一下，照自己平常那幾支做。做完 renderLayers 會再報一份上去。 */
function applyLayerAct(a){
  if(!a) return;
  if(a.op==='order' && Array.isArray(a.ids)){
    if(ROLE==='pm') return;
    const n=a.ids.length;
    a.ids.forEach((id,i)=>{ const b=BLOCKS.find(x=>x.id===id); if(b && stackable(b)) b.z=n-i; });
    normalizeZ(); renderCell(); renderLayers();
    return;
  }
  const b=BLOCKS.find(x=>x.id===a.id); if(!b) return;
  if(a.op==='hover'){ activeImg=b.id; renderCell(); renderLayers(); return; }
  if(a.op==='select'){ activeImg=b.id; selected.clear(); selected.add(b.id); renderCell(); renderLayers(); renderProps(); return; }
  if(ROLE==='pm') return;                       // 疊放順序和刪掉是排版的事
  if(a.op==='top'){ bringTop(b.id); return; }
  if(a.op==='kill'){ killLayer(b.id); return; }
}

/* ====== 圖層面板拖曳排序（Photoshop 式）====== */
let lyrDrag=null;
function initLayerDnD(){
  const box=$('#layers');
  box.addEventListener('dragstart',e=>{
    const it=e.target.closest('.lrow'); if(!it) return;
    lyrDrag=it; it.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',it.dataset.lyr);}catch(_){}
  });
  box.addEventListener('dragend',()=>{
    if(lyrDrag) lyrDrag.classList.remove('dragging');
    box.querySelectorAll('.lrow').forEach(x=>x.classList.remove('over'));
    lyrDrag=null;
    if(layersLater){ layersLater=false; renderLayers(); }   // 拖的途中畫布報了新的一份
  });
  box.addEventListener('dragover',e=>{
    e.preventDefault();
    const it=e.target.closest('.lrow');
    box.querySelectorAll('.lrow').forEach(x=>x.classList.remove('over'));
    if(it&&it!==lyrDrag) it.classList.add('over');
  });
  box.addEventListener('drop',e=>{
    e.preventDefault();
    const tgt=e.target.closest('.lrow');
    if(!tgt||!lyrDrag||tgt===lyrDrag) return;
    const items=[...box.querySelectorAll('.lrow')];
    const from=items.indexOf(lyrDrag), to=items.indexOf(tgt);
    if(from<to) tgt.after(lyrDrag); else tgt.before(lyrDrag);
    applyLayerOrder();
  });
}
/* 面板由上到下 = z 由大到小 */
function applyLayerOrder(){
  const ids=[...$('#layers').querySelectorAll('.lrow')].map(el=>el.dataset.lyr);
  if(remoteLayers()){ layerAct('order', null, ids); return; }
  const n=ids.length;
  ids.forEach((id,i)=>{ const b=BLOCKS.find(x=>x.id===id); if(b) b.z=n-i; });
  renderCell(); renderLayers();
}

/* ====== 單塊的大小：放大、縮小、回自動 ======================================
   每一種零件的「大小」不是同一件事，所以存的地方也不同：
     圖  → b.w（px 寬，高是等比跟著跑的）
     價格→ b.fsFix（**倍率，乘在轉盤／同組那個基準上**，見 priceFsRaw）
     其他→ b.sc（比例，CSS 那邊 --bs 乘上去）
   共通的一條規矩：這些欄位只給人寫，autoSpace 一律不准回頭寫它們 ——
   排版讀自己上一輪的輸出當輸入，就會每次都要多排一次才收斂（見 priceReq）。 */
const SC_STEP=1.08, SC_MIN=.4, SC_MAX=3;
const clampSc=v=>Math.min(SC_MAX,Math.max(SC_MIN,v));

/* 這一塊現在是幾倍大（1＝沒調過）。給工具列顯示，也給 ＋／− 當起點。 */
/* 貼圖跟商品圖同一套縮放（b.w0／b.w 那一組）：寬度直接改，高度自己跟著圖片的
   比例走（height:auto），不是靠 CSS transform（跟 name／brand 那些用 b.sc 的
   不一樣）——理由跟商品圖一樣，它本來就是一張圖，寬高本來就該是實際的 px。 */
function scaleOfBlock(b){
  if(b.kind==='img'||b.kind==='sticker')   return b.w0 ? b.w/b.w0 : 1;
  if(b.kind==='price') return b.fsFix || 1;      // 1＝沒調過（fsFix 現在是倍率）
  return b.sc || 1;
}
/** 直接設定倍率（拖角落用）。scaleBlock 是乘的，一路拖會愈乘愈歪 ——
    拉大小要的是「從按下去那一刻的倍率算到現在」，所以這裡收絕對值。 */
function setBlockScale(b, s){
  const v = clampSc(s);
  if(b.kind==='img'||b.kind==='sticker'){ if(!b.w0) b.w0=b.w; b.w=+(b.w0*v).toFixed(1); return; }
  if(b.kind==='price'){ b.fsFix=+v.toFixed(3); return; }
  b.sc=+v.toFixed(3);
}
/** 按下角落那一刻它是幾倍大。 */
function scaleBase(b){ return scaleOfBlock(b) || 1; }

function scaleBlock(b, mul){
  if(b.kind==='img'||b.kind==='sticker'){
    if(!b.w0) b.w0=b.w;                          // 第一次調就記下原本多寬，才回得去
    b.w = +(b.w0 * clampSc((b.w/b.w0) * mul)).toFixed(1);
    return;
  }
  if(b.kind==='price'){
    /* 乘在自己那一倍上就好 —— 轉盤和同組是基準，不歸這一顆按鈕管
       （以前起點是「現在看起來多大」，那時候 fsFix 會蓋掉轉盤，非這樣不可）。 */
    b.fsFix = +clampSc((b.fsFix||1) * mul).toFixed(3);
    return;
  }
  b.sc = +clampSc((b.sc||1) * mul).toFixed(3);
}
function resetBlock(b){
  if(b.kind==='img'||b.kind==='sticker'){ if(b.w0){ b.w=b.w0; delete b.w0; } return; }
  if(b.kind==='price'){ delete b.fsFix; return; }
  delete b.sc;
}
function selBlocks(){
  /* PM 只能選和看：大小、刪掉都是排版的事（跟拖曳同一條線）。擋在這裡而不是
     只擋按鈕 —— 按鈕會不會畫出來是版面的事，能不能動到版面是規則的事。 */
  if(ROLE==='pm') return [];
  return [...selected].map(id=>BLOCKS.find(b=>b.id===id)).filter(Boolean);
}

/* 自己動過大小的那一塊，就從自動排版手上接管過來（跟拖過一次是同一個意思）。
   不釘住的話，改完大小 renderOne(force) 會重跑一次 autoSpace，把價格重新靠右下
   對齊、把圖重新讓開 —— 看起來就是「我只是想放大一點，結果整格跳了位置」。
   誰動過誰負責：手動調過的位置和大小都留在原地，沒動過的照舊自動排。 */
/* 不分種類都釘：品牌／品名／機型那一疊本來也是自動排的，動過了就該留在原地。
   （價格以外的種類，autoSpace 只在上面那一疊讀這個旗標。） */
function holdPlace(b){ b.placed=true; }

function scaleSelected(mul){
  const sel=selBlocks(); if(!sel.length) return;
  sel.forEach(b=>{ scaleBlock(b,mul); holdPlace(b); });
  renderOne(curCell,true); reportBoard();
}
function resetSelected(){
  const sel=selBlocks(); if(!sel.length) return;
  sel.forEach(resetBlock);
  renderOne(curCell,true); reportBoard();
}

/* ====== 刪掉／找回來 ========================================================
   刪掉不是真的丟掉：記在格子的 off 名冊上，版上就不畫了。左下角那顆 ＋
   列的就是這份名冊，打勾就回到原來的位置 —— 位置、調過的大小都還在，
   因為那一塊從頭到尾沒有離開過 c.blocks。 */
function labelOf(b){
  if(b.kind==='img')   return '商品圖　'+keyLabel(b.key);
  if(b.kind==='name')  return '品名　'+(b.text||'');
  if(b.kind==='brand') return '品牌　'+(b.name||'');
  if(b.kind==='model') return '機型　'+(b.text||'');
  if(b.kind==='spec')  return '規格　'+(b.spec||'');
  if(b.kind==='price') return '價格　'+(b.price!=null?'$'+b.price:'');
  if(b.kind==='sticker') return '貼圖　'+(b.name||'');
  return 'SKU　'+((b.vs&&b.vs.length)?b.vs.map(v=>v.sku).join(' / '):'');
}
/* 貼圖沒有「找回來」這件事（那是照 picked 重選商品時，靠 uid 認出來要復原哪一塊——
   貼圖不是挑出來的，本來就沒有 uid，也沒有「重選」這個動作），刪掉就是真的從
   BLOCKS 拿掉，不進 off 名冊。跟商品圖／文字混選時，商品圖那幾塊照舊走 off。 */
function hideSelected(){
  const sel=selBlocks(); if(!sel.length) return;
  const off=offMap();
  const stickers=new Set();
  sel.forEach(b=>{
    if(b.kind==='sticker'){ stickers.add(b.id); return; }
    if(b.uid) off[b.uid]=labelOf(b);
  });
  if(stickers.size) BLOCKS=BLOCKS.filter(b=>!stickers.has(b.id));
  selected.clear(); activeImg=null;
  /* 少了一塊，右下那一疊要重新靠齊、圖要重新讓開 —— 強制重排一次。 */
  renderOne(curCell,true); renderLayers(); reportBoard();
}
/* 拿掉一張貼圖（貼圖右上角那顆 ✕）。跟 hideSelected 裡貼圖那一條是同一件事：
   貼圖**不進**「刪掉的東西」那份名冊 —— 那份是給商品圖找回來用的（靠 uid 認出
   重選商品時要復原哪一塊），而貼圖不是挑出來的，沒有 uid 也沒有「重選」。
   要叫回來走 Ctrl+Z：刪除本來就記成一步（主程式收到回報就 commitAction）。 */
function delSticker(id){
  if(ROLE==='pm') return;                     // 貼圖是印出去的素材，只有設計動得了
  const b=BLOCKS.find(x=>x.id===id);
  if(!b || b.kind!=='sticker') return;
  BLOCKS=BLOCKS.filter(x=>x.id!==id);
  selected.delete(id);
  if(activeImg===id) activeImg=null;
  /* 少了一塊，右下那一疊要重新靠齊、圖要重新讓開 —— 跟 hideSelected 一樣強制重排。 */
  renderOne(curCell,true); renderLayers(); reportBoard();
}
/* 指名刪一塊（圖層面板那顆「刪掉」）。跟 hideSelected 同一份名冊，
   所以左下角那顆 ＋ 一樣找得回來。 */
function hideBlockId(id){
  const b=BLOCKS.find(x=>x.id===id);
  if(!b || !b.uid) return;
  offMap()[b.uid]=labelOf(b);
  selected.delete(b.id);
  if(activeImg===b.id) activeImg=null;
  tellOff(b.uid, labelOf(b));
  renderOne(curCell,true); renderLayers(); reportBoard();
}
/* 面板報上去的狀態上層一律不收（面板沒有格子的尺寸，座標不能用），所以在面板裡
   刪掉一塊要另外講一聲，由上層轉給那一格的畫布 —— 存下來的是畫布報的那一份。
   uid 是照 picked 推出來的，兩邊算的是同一個號碼，指名就找得到同一塊。 */
function tellOff(uid, label){
  if(!UI_PANEL || window.parent===window) return;
  try{ parent.postMessage({ boardCell:CELL_ID, boardOff:{ uid, label } }, '*'); }catch(_){}
}
/* 上層轉過來的「那一塊刪掉了」。畫布這邊照做，然後照常往上報。 */
function applyOff(o){
  if(!o || !o.uid) return;
  const off=offMap();
  if(off[o.uid]) return;                   // 已經是刪掉的，不必再重排一次
  off[o.uid]=o.label||'刪掉的';
  const b=BLOCKS.find(x=>x.uid===o.uid);
  if(b){ selected.delete(b.id); if(activeImg===b.id) activeImg=null; }
  renderOne(curCell,true); renderLayers(); reportBoard();
}
function restoreUid(uid){
  delete offMap()[uid];
  renderOne(curCell,true); renderLayers(); reportBoard();
}

/* 左下角那顆 ＋：**這一格真的刪掉過東西才出現**。
   中間有一版是「一直都在」（怕沒看到 ＋ 的時候分不出是沒藏東西還是鈕跑掉了），
   但那等於在每一格上永遠擺一顆多數時候沒有用的按鈕，蓋在版面上 ——
   而它要救的那件事很罕見：刪掉東西的人就是剛按下 Delete 的那個人，他在找它。
   沒東西可還原就不佔位置，所以清單也不再有「空的」那一種狀態。
   沒在編輯的時候畫布是 pointer-events:none，那一下會先幫你打開這一格，再點才展開清單。 */
function renderRestore(){
  const box=$('#restore'); if(!box) return;
  const off=offMap(), keys=Object.keys(off);
  const el=cellEl();
  if(!el || ROLE==='pm' || !keys.length){
    box.classList.remove('on','open'); box.innerHTML=''; return;
  }
  box.innerHTML=
    `<button class="rbtn" data-rtoggle>＋<span class="rn">${keys.length}</span></button>`+
    `<div class="rlist"><div class="rhead">刪掉的，打勾放回來</div>`+
    keys.map(k=>`<label class="ritem"><input type="checkbox" data-ruid="${k}"><span>${off[k]}</span></label>`).join('')+
    `</div>`;
  /* 位置：格子左下角，座標以 #wrap 為基準（跟 #props 同一套）。
     四個角現在各有各的東西 —— 左上是紅色未處理數字、右上是「這一格在誰手上」，
     版面自己的品牌品名在左上、價格在右下。左下是唯一空著的一角。 */
  const wrapR=$('#wrap').getBoundingClientRect(), r=el.getBoundingClientRect();
  box.style.left=(r.left-wrapR.left+8)+'px';
  box.style.top =(r.bottom-wrapR.top-8)+'px';
  box.classList.add('on');   // translateY(-100%) ＋ 縮放都寫在 CSS 裡（見 #restore）

  box.querySelector('[data-rtoggle]').onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    box.classList.toggle('open');
  };
  box.querySelectorAll('[data-ruid]').forEach(inp=>{
    inp.onmousedown=ev=>ev.stopPropagation();
    inp.onchange=()=>restoreUid(inp.dataset.ruid);
  });
}

/* ====== 右側面板頂部：依選取的元素顯示可切換的屬性 ====== */
function renderProps(){
  const box=$('#props');
  const sel=selBlocks().filter(b=>!isOff(b));
  /* 大小和刪除是排版的事，PM 只能看和選（跟拖曳同一條線）。
     黑色／劃線本來也只有設計動得到，一起收在這個判斷裡。 */
  if(!sel.length || ROLE==='pm' || !STAGE_EDIT){ box.classList.remove('on'); box.innerHTML=''; reportPropsBar(); return; }
  const specs=sel.filter(b=>b.kind==='spec');
  const prices=sel.filter(b=>b.kind==='price');
  /* 工具列一律不出現（談定的）。原版只有規格／價格才長那根棒子，後來連那個也不要了 ——
     選到什麼都不該有東西浮在版面上。
     那幾顆按鈕的功能沒有消失，只是換了入口：
       大小 → 拖四個角（圖片還多了四個邊中點，跟 PPT 一樣）
       刪掉 → Delete
       黑色／劃線 → 目前沒有別的入口（要的話得另外找地方放，不要放回版面上）。 */
  box.classList.remove('on'); box.innerHTML=''; reportPropsBar(); return;

  /* 選一塊才報幾成大；選一群的時候每塊倍率不同，報一個數字會是騙人的。 */
  let now='';
  if(sel.length===1){
    const s=scaleOfBlock(sel[0]);
    now = s ? Math.round(s*100)+'%' : '自動';
  }
  const changed = sel.some(b=>scaleOfBlock(b) && scaleOfBlock(b)!==1);

  let h=`<button class="pbtn sq" data-size="down" title="縮小">−</button>`
       +`<span class="pnum">${now}</span>`
       +`<button class="pbtn sq" data-size="up" title="放大">＋</button>`
       +`<button class="pbtn${changed?'':' dis'}" data-size="reset">回自動</button>`;
  if(specs.length){
    const allDark=specs.every(b=>b.dark);
    h+=`<button class="pbtn${allDark?' act':''}" data-prop="dark">黑色</button>`;
  }
  if(prices.length){
    const allX=prices.every(b=>b.cross);
    h+=`<button class="pbtn${allX?' act':''}" data-prop="cross">劃線</button>`;
  }
  h+=`<button class="pbtn danger" data-kill="1" title="刪掉（Delete）">刪掉</button>`;
  box.innerHTML=h;
  box.classList.add('on');

  // 定位：所有選中元素的外框上緣中點（座標以 #wrap 為基準）
  const wrapR=$('#wrap').getBoundingClientRect();
  let L=Infinity,T=Infinity,R=-Infinity,B=-Infinity;
  for(const b of sel){
    const el=bEl(b.id); if(!el) continue;
    const r=el.getBoundingClientRect();
    L=Math.min(L,r.left); R=Math.max(R,r.right);
    T=Math.min(T,r.top);  B=Math.max(B,r.bottom);
  }
  if(L===Infinity){ box.classList.remove('on'); return; }
  const cx=(L+R)/2-wrapR.left;
  const bh=box.offsetHeight||30;      // 讀取時強制 reflow，取得真實高度
  /* 選到最上面那一排（品牌、品名）時，工具列擺上面就出了畫面外 ——
     拼板那一格是 overflow:hidden，出去就等於整條不見了。頂不住就改掛下面。 */
  const up=T-wrapR.top-bh-9, below=B-wrapR.top+9;
  box.style.left=cx+'px';
  box.style.top=(up<0?below:up)+'px';
  box.classList.toggle('under', up<0);
  box.style.transform='translateX(-50%)';

  box.querySelectorAll('[data-prop]').forEach(btn=>btn.onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();   // 不觸發格子的拖曳/取消選取
    const k=btn.dataset.prop;
    const targets = k==='dark'?specs:prices;
    const turnOn = !targets.every(b=>b[k]);
    targets.forEach(b=>b[k]=turnOn);
    renderCell();
  });
  box.querySelectorAll('[data-size]').forEach(btn=>btn.onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const k=btn.dataset.size;
    if(k==='reset') resetSelected();
    else scaleSelected(k==='up'?SC_STEP:1/SC_STEP);
  });
  box.querySelector('[data-kill]').onmousedown=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    hideSelected();
  };
  reportPropsBar();
}

/* 工具列住在畫布 iframe 裡，便利貼貼在外面那一層 —— 誰疊在誰上面是 iframe
   整塊決定的，這裡面寫多少 z-index 都壓不過外面那張紙。所以把工具列的位置
   報上去，讓外面把「剛好壓在上面」的那幾張讓開。報的是 iframe 自己的視窗座標，
   外面加上 iframe 的位置就對得起來（iframe 本身沒有被縮放）。 */
function reportPropsBar(){
  if(!UI_STAGE || window.parent===window) return;
  const box=$('#props');
  let r=null;
  if(box.classList.contains('on')){
    const b=box.getBoundingClientRect();
    r={left:b.left,top:b.top,right:b.right,bottom:b.bottom};
  }
  try{ parent.postMessage({ propsBar:r }, '*'); }catch(_){}
}

function markLayerActive(){
  const act=curLayer();
  $('#layers').querySelectorAll('.lrow').forEach(el=>
    el.classList.toggle('on', el.dataset.lyr===act));
}

addEventListener('mouseup',e=>{
  /* 放手才回報：拖的過程每一格都 reportBoard() 的話，外面那層會被存檔洗版。
     renderOne(force) 跟 ＋／− 那條路一樣，重新量一次尺寸再畫。 */
  /* 重畫整格會把把手一起洗掉 —— 不補的話拉完大小，四個角就不見了，
     看起來像選取被取消（要再點一下才回來）。 */
  if(rz){ rz=null; renderOne(curCell,true); paintHandles(); reportBoard(); return; }
  if(drag){
    const p=cellPt(e);
    const src=BLOCKS.find(x=>x.id===drag.main);
    if(drag.moved && src && src.kind==='sku' && drag.ids.length===1){
      const tgt=blockAt(p.x,p.y,src.id);
      if(tgt){
        // 合併：把 src 的 rows 併入 tgt，依 SKU 排序後重算字串
        tgt.vs = [...tgt.vs,...src.vs].sort((a,b)=>a.sku.localeCompare(b.sku));
        BLOCKS = BLOCKS.filter(b=>b.id!==src.id);
        selected.clear(); selected.add(tgt.id);
      }
    }
    if(drag.moved){
      dragHappened=true;
      /* 記一下「這一塊被人動過」。現在沒有重排會來搬它了（照原版，位置就是
         buildBlocks 算的那一次），所以這個記號只剩「重選商品要不要整組重建」在用。
         這裡本來還會「拖一塊就把整欄（價格＋SKU＋規格）一起平移」—— 那是為了對抗
         autoSpace：只釘被拖的那一塊，下一次重排就把另外兩塊排回原位、跟它分家。
         重排沒了，那一段也就不必了：每一塊各自待在你放的地方，跟原版一樣。 */
      for(const id of drag.ids){
        const b=BLOCKS.find(x=>x.id===id);
        if(b) holdPlace(b);
      }
      /* 集體移動：把「這一下移了多遠」換成 mm 報上去，其他格照同樣的實際距離走。
         報的是主要那一塊的位移（多選時它們本來就一起走同樣的量）。 */
      if(BULK_MOVE && src && drag.orig && drag.orig[src.id]){
        const per = unitsPerCm();
        const dx = (+src.x||0) - (+drag.orig[src.id].x||0);
        const dy = (+src.y||0) - (+drag.orig[src.id].y||0);
        clearBulkPreview();
        if(per > 0 && (Math.abs(dx) > .5 || Math.abs(dy) > .5)){
          const mm = { keys:bulkTargets(src),
                       dxMm:+(dx/per*10).toFixed(3), dyMm:+(dy/per*10).toFixed(3) };
          /* 本格裡同一種的其他零件（例如兩個 SKU 拖了其中一個）也要跟著走 ——
             上層轉發時會跳過來源那一格，所以它們只能在這裡處理。 */
          applyBulkMove(mm, drag.ids);
          try{ parent.postMessage({ bulkMove: mm }, '*'); }catch(_){}
        }
      }
    }
    drag=null; guides=[]; renderCell();
  }
  if(marq){
