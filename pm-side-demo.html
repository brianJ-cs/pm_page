<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM 左欄 demo：檔期列表 ＋ 品類樹 ＋ 小地圖</title>
<!--
  這一支是 demo，不接資料庫、不進主程式。只回答一個問題：
  PM 在 拼板 的左邊那一欄，同時放「檔期列表 / 品類樹 / 小地圖」三段長什麼樣、按起來順不順。
  顏色、字級、間距一律照 design_and_PM.html 抄過來，看起來才跟真的一樣。

  三段由上而下：檔期列表 → 品類樹 → 小地圖（順序照 2026-08 的決定）。
  每一段都收得起來 —— 三段疊起來比一個螢幕高，不能收就永遠要捲。
-->
<style>
  :root{
    --blue:#4a6fdc;
    --ink:#333a45;
    --muted:#7a8494;
    --bg:#f2f4f8;
    --card:#ffffff;
    --line:#e2e6ee;
    --amber-bg:#fff4d6; --amber:#c07f00;
    --surface:#ffffff;
    --surface-2:#fafbfd;
    --surface-3:#f1f4fb;
    --line-strong:#c9d6e2;
    --ink-dim:#4b5566;
    --accent:#4a6fdc;
    --accent-strong:#3f61c6;
    --accent-tint:#eef2fc;
    --accent-tint-2:#e2e9fa;
    --accent-line:#ccd8f5;
    --accent-ink:#cfd9f2;
    --green-rule:#5aa678; --green-ink:#2e7d52;
    --warn-line:#f0dcae;
    --danger:#d92d20; --danger-ink:#b42318;
    /* 深色那一段：控制項站的底（主程式裡是 stylesheet 最後面那塊「操作區調深色」） */
    --chrome:#232a37;
    --chrome-2:#2e3747;
    --chrome-ink:#eaeef7;
    --chrome-muted:#9aa6bc;
    --chrome-line:#3d4759;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--chrome);color:var(--chrome-ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .app{height:100vh;display:flex;flex-direction:column;padding:14px 20px 10px;gap:10px}

  .bar{display:flex;align-items:center;gap:12px;min-height:36px;flex:none}
  .bar .demo-tag{
    font-size:12px;font-weight:800;color:#e6b465;border:1px dashed #6a5a3a;
    border-radius:999px;padding:4px 12px;
  }
  .tab{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1px solid var(--chrome-line);border-radius:999px;padding:7px 22px;
    background:rgba(255,255,255,.09);color:var(--accent-ink);
  }
  .tab.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:14px;
              font-size:13px;font-weight:800;color:var(--chrome-muted)}

  .stage{flex:1;min-height:0;display:flex;align-items:stretch}

  /* ---- 左欄本人 ------------------------------------------------------------
     一欄三段。段跟段之間只用一條分隔線和一個標題分開 —— 三塊各自加卡片邊框的話，
     260px 的寬度會被邊框和內距吃掉一大截。 */
  #pmSide{
    flex:none;width:262px;overflow-y:auto;overflow-x:hidden;
    padding:0 10px 12px 2px;border-right:1px solid var(--chrome-line);
    display:flex;flex-direction:column;transition:width .14s ease;
  }
  #pmSide.mini{width:0;padding-left:0;padding-right:0;border-right:0}
  #pmSide.mini > *{display:none}

  /* 段標題：整條都能點，收起／展開。三角形在左邊，數字在右邊 —— 收起來的時候
     那個數字就是這一段裡有多少東西，不必展開才知道。 */
  .sec-head{
    display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    padding:9px 6px 8px;margin-top:6px;
    border-top:1px solid var(--chrome-line);
    font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--chrome-muted);
  }
  .sec:first-child .sec-head{margin-top:0;border-top:0}
  .sec-head:hover{color:var(--chrome-ink)}
  .sec-head .caret{font-size:10px;width:10px;flex:none}
  .sec-head .n{margin-left:auto;font-weight:800;font-size:11.5px;opacity:.85}
  .sec-body{display:block}
  .sec.closed .sec-body{display:none}

  /* ---- 第一段：檔期列表 ----------------------------------------------------
     首頁那張 .plan-card 有 20px 內距、20px 的名字，塞進 260px 會只剩名字看得到。
     這裡改成一列一檔：名字一行、出稿日和支數一行，正在看的那一檔標藍。 */
  .pl-row{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    border:1px solid var(--chrome-line);border-radius:9px;
    background:var(--chrome-2);color:var(--chrome-ink);
    padding:8px 10px;margin-bottom:6px;
  }
  .pl-row:hover{border-color:var(--blue)}
  .pl-row.active{background:var(--blue);border-color:var(--blue);color:var(--surface)}
  .pl-row .nm{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800}
  .pl-row .nm .dot{
    width:7px;height:7px;border-radius:50%;flex:none;background:var(--warn-line);
  }
  .pl-row .nm .dot.now{background:#f5a623}
  .pl-row .sub{display:flex;gap:8px;margin-top:3px;font-size:11.5px;color:var(--chrome-muted)}
  .pl-row.active .sub{color:rgba(255,255,255,.85)}
  .pl-row .sub .mine{color:#e6b465;font-weight:800}
  .pl-row.active .sub .mine{color:#ffe6b8}
  /* 換檔期是「離開現在這一本 DM」，不是切一個分頁 —— 給一句提示，別讓它像分頁 */
  .pl-note{font-size:11px;color:var(--chrome-muted);padding:0 6px 4px;line-height:1.5}

  /* ---- 第二段：品類樹（原封抄 #pmTree） ---- */
  .pt-root{
    font-size:14.5px;font-weight:800;color:var(--chrome-ink);
    padding:2px 4px 8px;border-bottom:1px solid var(--chrome-line);margin-bottom:6px;
  }
  .pt-root .sub{display:block;font-size:12px;color:var(--chrome-muted);margin-top:2px}
  .pt-type{
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:5px 6px;border-radius:7px;font-size:13.5px;font-weight:800;color:var(--chrome-ink);
  }
  .pt-type:hover{background:rgba(255,255,255,.08)}
  .pt-type.open{background:rgba(74,111,220,.30);color:var(--accent-ink)}
  .pt-type .caret{font-size:10px;color:var(--chrome-muted);width:10px;flex:none}
  .pt-type .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-type .n{font-size:12px;color:var(--chrome-muted);font-weight:800}
  .pt-kids{display:none;margin:2px 0 6px 16px}
  .pt-type.open + .pt-kids{display:block}
  .pt-blk{
    display:flex;align-items:center;gap:6px;cursor:pointer;
    padding:4px 8px;border-radius:6px;font-size:13px;color:var(--chrome-muted);
  }
  .pt-blk:hover{background:rgba(255,255,255,.08);color:var(--chrome-ink)}
  .pt-blk.active{background:var(--blue);color:var(--surface)}
  .pt-blk .n{margin-left:auto;font-size:11.5px;font-weight:800;opacity:.85}
  .pt-sep{
    font-size:11.5px;font-weight:800;color:var(--chrome-muted);
    margin:10px 4px 4px;padding-top:8px;border-top:1px dashed var(--chrome-line);
  }

  /* ---- 第三段：小地圖（抄 #sheetSide 那套 .mini-*） ------------------------
     版面比例照舊 350:248；欄寬扣掉內距剩 244，高度跟著縮。 */
  .mini-label{font-size:14px;font-weight:800;color:var(--chrome-ink);letter-spacing:.08em;
              margin:8px 0 5px}
  .mini-page{position:relative;width:244px;height:173px;border:2px solid var(--ink);
             background:var(--surface);flex:none}
  .mini-split{display:flex;width:100%;height:100%;overflow:hidden}
  .mini-blk{
    border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.28;user-select:none;
    transition:background .12s,border-color .12s;padding:2px;
  }
  .mini-blk .cnt{color:var(--danger-ink);font-weight:800}
  .mini-blk:hover{background:var(--surface-3);border-color:var(--accent);color:var(--ink)}
  .mini-blk.unowned{background:#e9ecf2;border-color:#cdd4e0;color:#98a1b2}
  .mini-blk.unowned .cnt{color:#98a1b2}
  .mini-blk.at-pm{background:#dff0e5;border-color:var(--green-rule);color:var(--green-ink)}
  .mini-blk.at-pm .cnt{color:var(--green-ink)}
  .mini-blk.active{outline:3px solid var(--blue);outline-offset:-3px;border-color:#2f4b96;z-index:2}
  .mini-blk.active.at-pm{border-color:var(--green-rule)}
  /* PM 這邊多一條：有他的貨的版位在小地圖上要認得出來，不然三十塊裡找不到自己那幾塊。
     用一顆點，不用底色 —— 底色已經在講「走到哪了」，一個位子只能講一件事。 */
  .mini-blk .mine{
    position:absolute;top:3px;left:3px;width:7px;height:7px;border-radius:50%;
    background:var(--blue);box-shadow:0 0 0 1.5px var(--surface);
  }
  .mini-blk{position:relative}
  .mini-prog{
    display:block;width:100%;margin:10px 0 2px;font:inherit;font-size:12px;font-weight:800;
    cursor:pointer;border:1px solid var(--chrome-line);border-radius:8px;padding:7px 8px;
    background:var(--chrome-2);color:var(--chrome-ink);text-align:center;
  }
  .mini-prog:hover{border-color:var(--blue);background:#3a4457}

  /* ---- 收合把手：站在欄位外緣正中間，像書籤 ---- */
  .fold-bar{flex:none;width:0;position:relative;align-self:stretch}
  .fold-tab{
    position:absolute;top:50%;left:0;transform:translateY(-50%);z-index:8;
    width:20px;height:74px;padding:0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;line-height:1;
    border:2px solid var(--chrome-line);border-left:0;border-radius:0 9px 9px 0;
    background:var(--chrome-2);color:var(--chrome-ink);
    display:flex;align-items:center;justify-content:center;
  }
  .fold-tab:hover{border-color:var(--blue);color:var(--accent-ink)}

  /* ---- 右邊：demo 用的假版面，只為了看左欄按下去有沒有反應 ---- */
  #stageMain{flex:1;min-width:0;background:var(--bg);border-radius:12px;color:var(--ink);
             display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
             margin-left:10px;padding:20px}
  #stageMain h2{font-size:20px;font-weight:800}
  #stageMain .meta{font-size:14px;color:var(--muted);font-weight:800}
  #fakeSheet{
    background:var(--surface);border:2px solid var(--ink);
    display:grid;gap:4px;padding:8px;width:min(560px,70%);
  }
  #fakeSheet .c{
    aspect-ratio:3/4;border:1px solid var(--line-strong);border-radius:3px;
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:var(--muted);
  }
  #fakeSheet .c.mine{background:var(--accent-tint);border-color:var(--accent-line);color:var(--blue)}
  #fakeSheet .c.dim{opacity:.35}
  .legend{font-size:12.5px;color:var(--muted);font-weight:800;display:flex;gap:14px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="tab active">拼板</button>
    <span class="demo-tag">DEMO・PM 身分・假資料</span>
    <div class="right"><span id="whoAmI"></span></div>
  </div>

  <div class="stage">
    <div id="pmSide"></div>
    <div class="fold-bar"><button class="fold-tab" id="foldTab" title="收起／展開左邊這一欄">‹</button></div>
    <div id="stageMain">
      <h2 id="stTitle"></h2>
      <div class="meta" id="stMeta"></div>
      <div id="fakeSheet"></div>
      <div class="legend">
        <span>藍格＝這一類是你的</span><span>壓暗＝不是你的品類</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   假資料：兩個檔期，各有正／背兩面，每面幾個版位。
   欄位跟主程式對齊：版位有 name / cells / type（品類）/ at（走到哪：none|design|pm）。
   ========================================================================== */
const PM_ME = 'PM 甲';

const PLANS = [
  {
    id:'p1', name:'8月中檔・生鮮', out:'08/20', now:true,
    pages:{
      front:[
        [{name:'A1', cells:6, type:'冷凍調理', at:'pm',     pm:'PM 甲', w:2},
         {name:'A2', cells:4, type:'乳品',     at:'design', pm:'PM 乙', w:1}],
        [{name:'A3', cells:8, type:'冷凍調理', at:'design', pm:'PM 甲', w:3},
         {name:'A4', cells:3, type:'生鮮蔬果', at:'none',   pm:'',      w:2}]
      ],
      back:[
        [{name:'B1', cells:5, type:'零食',     at:'pm',     pm:'PM 丙', w:1},
         {name:'B2', cells:6, type:'冷凍調理', at:'pm',     pm:'PM 甲', w:1}],
        [{name:'B3', cells:4, type:'乳品',     at:'design', pm:'PM 乙', w:1}]
      ]
    }
  },
  {
    id:'p2', name:'9月首檔・年菜預購', out:'09/03', now:false,
    pages:{
      front:[
        [{name:'A1', cells:4, type:'年菜',     at:'design', pm:'PM 甲', w:1},
         {name:'A2', cells:4, type:'年菜',     at:'design', pm:'PM 甲', w:1},
         {name:'A3', cells:2, type:'酒類',     at:'none',   pm:'',      w:1}]
      ],
      back:[
        [{name:'B1', cells:6, type:'伴手禮',   at:'none',   pm:'PM 丁', w:2},
         {name:'B2', cells:3, type:'年菜',     at:'pm',     pm:'PM 甲', w:1}]
      ]
    }
  }
];

let planId   = 'p1';       // 正在看的檔期
let focusType = null;      // 品類樹翻開的那一類
let activeBlk = null;      // 右邊在看的版位
const closed = { plans:false, tree:false, mini:false };   // 三段各自收合

const plan     = () => PLANS.find(p => p.id === planId);
const allBlocks = p => ['front','back'].flatMap(s =>
  p.pages[s].flatMap(row => row.map(b => ({ ...b, side:s, ref:b }))));
const mineOf   = p => allBlocks(p).filter(b => b.pm === PM_ME);

/** 這個檔期裡屬於我的品類：一類一列，底下掛它散在哪幾個版位。 */
function myTypes(p){
  const map = new Map();
  mineOf(p).forEach(b => {
    if (!map.has(b.type)) map.set(b.type, { name:b.type, count:0, blocks:[] });
    const t = map.get(b.type);
    t.count += b.cells;
    t.blocks.push(b);
  });
  return [...map.values()];
}

/* ---- 左欄 ---------------------------------------------------------------- */
const side = document.getElementById('pmSide');

function section(key, title, count, build){
  const sec = document.createElement('div');
  sec.className = 'sec' + (closed[key] ? ' closed' : '');
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = `<span class="caret">${closed[key] ? '▸' : '▾'}</span>
                    <span>${title}</span><span class="n">${count}</span>`;
  head.addEventListener('click', () => { closed[key] = !closed[key]; renderSide(); });
  const body = document.createElement('div');
  body.className = 'sec-body';
  build(body);
  sec.appendChild(head); sec.appendChild(body);
  side.appendChild(sec);
}

function renderSide(){
  const p = plan();
  side.innerHTML = '';

  /* 一、檔期列表：PM 手上同時有兩三檔是常態，換一檔本來要退回首頁再點進來，
     一來一回會把現在看的版位、翻開的品類全丟掉。 */
  section('plans', '檔期', `${PLANS.length} 檔`, body => {
    PLANS.forEach(pl => {
      const mine = mineOf(pl);
      const qty  = mine.reduce((a, b) => a + b.cells, 0);
      const row = document.createElement('button');
      row.className = 'pl-row' + (pl.id === planId ? ' active' : '');
      row.innerHTML = `<span class="nm"><span class="dot${pl.now ? ' now' : ''}"></span>${pl.name}</span>
        <span class="sub"><span>出稿 ${pl.out}</span>
        <span class="mine">${qty ? `我的 ${qty} 支` : '沒有你的貨'}</span></span>`;
      row.addEventListener('click', () => selectPlan(pl.id));
      body.appendChild(row);
    });
    const note = document.createElement('div');
    note.className = 'pl-note';
    note.textContent = '點一檔＝換一本 DM，右邊整個換掉。';
    body.appendChild(note);
  });

  /* 二、品類樹：PM 是照貨在找版位的，這一段還是主角，所以擺中間、離手最近。 */
  const types = myTypes(p);
  const qty = types.reduce((a, t) => a + t.count, 0);
  section('tree', '我的品類', `${qty} 支`, body => {
    const root = document.createElement('div');
    root.className = 'pt-root';
    const blks = new Set(mineOf(p).map(b => b.name));
    root.innerHTML = `${p.name}<span class="sub">${PM_ME}・${blks.size} 個版位・${
      types.length} 個品類・共 ${qty} 支</span>`;
    body.appendChild(root);

    if (!types.length){
      const s = document.createElement('div');
      s.className = 'pt-sep'; s.textContent = '這一檔沒有交給你的版位';
      body.appendChild(s);
      return;
    }
    types.forEach(t => {
      const open = focusType === t.name;
      const row = document.createElement('div');
      row.className = 'pt-type' + (open ? ' open' : '');
      row.innerHTML = `<span class="caret">${open ? '▾' : '▸'}</span>
        <span class="nm">${t.name}</span><span class="n">${t.count} 支</span>`;
      row.addEventListener('click', () => {
        if (open){ focusType = null; render(); return; }
        selectBlock(t.blocks[0], t.name);
      });
      body.appendChild(row);

      const kids = document.createElement('div');
      kids.className = 'pt-kids';
      t.blocks.forEach(b => {
        const el = document.createElement('div');
        el.className = 'pt-blk' + (activeBlk && activeBlk.name === b.name && open ? ' active' : '');
        el.innerHTML = `<span>${b.side === 'front' ? '正' : '背'}・${b.name}</span>
                        <span class="n">${b.cells} 支</span>`;
        el.addEventListener('click', ev => { ev.stopPropagation(); selectBlock(b, t.name); });
        kids.appendChild(el);
      });
      body.appendChild(kids);
    });
  });

  /* 三、小地圖：PM 本來看不到整本 DM 長什麼樣 —— 自己那幾格夾在哪一頁的哪個角落、
     旁邊放的是誰的貨，只能用猜的。擺在最下面是因為它是「對位置」，不是「找貨」。 */
  const total = allBlocks(p).length;
  section('mini', '整本落版', `${total} 個版位`, body => {
    [['front','正面'], ['back','背面']].forEach(([s, title]) => {
      const lab = document.createElement('div');
      lab.className = 'mini-label'; lab.textContent = title;
      const page = document.createElement('div');
      page.className = 'mini-page';
      const col = document.createElement('div');
      col.className = 'mini-split';
      col.style.flexDirection = 'column';
      p.pages[s].forEach(row => {
        const r = document.createElement('div');
        r.className = 'mini-split';
        r.style.flex = '1';
        row.forEach(b => r.appendChild(miniBlk(b, s)));
        col.appendChild(r);
      });
      page.appendChild(col);
      body.appendChild(lab); body.appendChild(page);
    });
    const prog = document.createElement('button');
    prog.className = 'mini-prog'; prog.textContent = '進度';
    prog.title = '看這個檔期交出去多少、每位 PM 拼完幾格';
    prog.addEventListener('click', () =>
      alert('DEMO：這裡會開主程式那張進度面板（左邊版位、右邊每位 PM）'));
    body.appendChild(prog);
  });
}

/** 小地圖上的一塊：底色＝走到哪了（灰／白／綠），藍點＝有我的貨。 */
function miniBlk(b, sideKey){
  const el = document.createElement('div');
  const state = b.at === 'pm' ? ' at-pm' : b.at === 'none' ? ' unowned' : '';
  const on = activeBlk && activeBlk.name === b.name && activeBlk.side === sideKey;
  el.className = 'mini-blk' + state + (on ? ' active' : '');
  el.style.flex = b.w || 1;
  el.innerHTML = `${b.pm === PM_ME ? '<span class="mine"></span>' : ''}
    <span>${b.name}</span><span class="cnt">${b.cells}</span>`;
  el.title = `${b.name}・${b.type}・${b.cells} 支・${
    b.at === 'pm' ? '都在 PM' : b.at === 'none' ? '待提明細' : '在設計手上'}${
    b.pm ? '・' + b.pm : ''}`;
  /* 不是我的版位一樣點得進去：每位 PM 都看得到整本 DM，壓暗的只有「不是這一關」。 */
  el.addEventListener('click', () =>
    selectBlock({ ...b, side:sideKey }, b.pm === PM_ME ? b.type : focusType));
  return el;
}

/* ---- 動作 ---------------------------------------------------------------- */
function selectPlan(id){
  if (id === planId) return;
  planId = id; activeBlk = null; focusType = null;
  pickDefaultBlock();
  render();
}
function selectBlock(b, type){
  activeBlk = b; focusType = type || null;
  render();
}
/** 別讓 PM 開進一個沒有他的貨的版位：挑第一個有的。都沒有就停在第一個版位上。 */
function pickDefaultBlock(){
  const p = plan();
  const mine = mineOf(p);
  const pick = mine[0] || allBlocks(p)[0];
  if (pick){ activeBlk = pick; focusType = mine[0] ? pick.type : null; }
}

/* ---- 右邊那片假版面：只證明左欄按下去右邊會動 ---- */
function renderStage(){
  const b = activeBlk;
  document.getElementById('whoAmI').textContent = `${PM_ME}・${plan().name}`;
  document.getElementById('stTitle').textContent =
    b ? `${b.side === 'front' ? '正面' : '背面'}・${b.name}` : '（沒有選版位）';
  document.getElementById('stMeta').textContent =
    b ? `${b.type}・${b.cells} 格・${b.pm || '未指派'}` : '';
  const sheet = document.getElementById('fakeSheet');
  sheet.innerHTML = '';
  if (!b) return;
  const cols = Math.min(b.cells, 4);
  sheet.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  for (let i = 0; i < b.cells; i++){
    const c = document.createElement('div');
    const mine = b.pm === PM_ME;
    c.className = 'c' + (mine ? ' mine' : ' dim');
    c.textContent = i + 1;
    sheet.appendChild(c);
  }
}

function render(){ renderSide(); renderStage(); }

document.getElementById('foldTab').addEventListener('click', () => {
  const on = side.classList.toggle('mini');
  document.getElementById('foldTab').textContent = on ? '›' : '‹';
});

pickDefaultBlock();
render();
</script>
</body>
</html>
